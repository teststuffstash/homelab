# Deployment config for the Proxmox hypervisor host (group `pve`).
# Logic in roles/pve-upgrade; values here. The hypervisor is deliberately the one
# hand-installed box (boot-from-git covers everything ABOVE it — CONTEXT.md); this
# group exists so its routine PACKAGE maintenance is code, not clicking. Major
# version jumps (8.x -> 9.x need sources.list edits) are explicitly OUT of scope —
# plain dist-upgrade stays inside the pinned major.

# --- SSH connection (root via the Proxmox seed key, outside the repo) ---
ansible_user: root
ansible_ssh_private_key_file: /home/node/.claude/homelab-pve-ssh/id_ed25519
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

# Where the pre-upgrade /etc/pve backup tarball lands on the controller (the
# jail). Outside the repo — /etc/pve carries key material (corosync, VM configs).
# This is a rolling local CACHE, not the durable copy; the VM/LXC definitions'
# durable home is tofu (recreatable), the hypervisor's own config has none —
# which is exactly why the playbook snapshots it before every touch.
pve_backup_dest: /home/node/.claude/homelab-pve-backup

# --- pve-node-exporter (FU-093, the thin-pool meter) ---
# Scraped by Prometheus as a static LAN target (argocd/resources/pve-metrics/scrapeconfig.yaml
# carries the SAME host:port — change both).
pve_node_exporter_port: 9100
pve_textfile_dir: /var/lib/prometheus/node-exporter

# --- pve-serial-log (#882, the serial-console capture) ---
# The vmids whose serial0 socket gets tailed to pve_serial_log_dir/<vmid>.log. A vmid belongs here
# iff its node is `serial = true` in tofu/variables.tf (the device comes from tofu, the tail from
# this role — change both). 8113 = wk-03.
pve_serial_log_dir: /var/log/qemu-serial
pve_serial_log_vmids:
  - 8113
