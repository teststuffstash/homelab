---
# OPNsense HAProxy — HTTPS reverse proxy for the LAN-exposed cluster services.
# Each backend gets a trusted https://<name>.teststuff.net URL (valid Let's Encrypt
# cert) proxied to its in-cluster LoadBalancer VIP (Cilium BGP). Service list is in
# group_vars/opnsense.yml (haproxy_proxied_services); connection via module_defaults
# in ansible/opnsense-haproxy.yml.
#
# Pieces per service: HAProxy server -> backend -> frontend (via the generic `raw`
# module, create-if-absent keyed on name), an IP-alias VIP, and an Unbound host
# override so the name resolves to the VIP on the LAN. HTTP/2 is DISABLED on every
# frontend: with h2 advertised the HA/Grafana live WebSocket fails to upgrade.
#
# Certs are managed by the opnsense-acme role (issue + sign them there first; this
# role looks each up by name and asserts it exists). HAProxy does not inject
# X-Forwarded-For, so no backend trusted_proxies change is needed.
#
# Prereq: the os-haproxy plugin must be INSTALLED on OPNsense.

# All HTTP frontends: the per-service proxies + the per-stack wildcard gateways (ADR-092).
# stack_gateways entries carry the same keys the frontend machinery needs (name/cert_domain/
# vip/backend_ip/backend_port), so they flow through the create+rebind tasks unchanged — the
# only deltas are their `cert_domain` is a cert OBJECT NAME (a wildcard cert) and their DNS is
# a wildcard override (handled separately at the end, not the per-service Unbound task).
#
# ⚠ APPLY, DON'T JUST SAVE (oxlorg.opnsense 26.x): the collection flipped its global
# `reload` module-argument default true -> false (plugins/module_utils/defaults/main.py,
# RELOAD_MOD_ARG). Two calls here MUST reach the live system: `interface_vip` (the
# per-service IP-alias VIP that the frontend created two sections below binds to — an
# unapplied VIP means the bind has no address) and `unbound_host` (the LAN name that
# resolves to it). Both get an explicit `reload: true` from a ROLE-SCOPED block-level
# module_defaults, so a task added inside the block cannot silently omit the apply.
#
# The value carries the whole `opnsense_conn` dict, not just `{reload: true}`: a
# block-level module_defaults entry REPLACES the play's entry for the same module
# (verified on the pinned ansible-core), so it has to restate the connection args the
# playbook sets. The `raw` calls (HAProxy objects, service start) take no `reload`
# argument — they are applied by their own POST plus the `reconfigure haproxy` handler.
- name: HAProxy reverse proxy + VIPs + DNS (every reload-capable call applies on change)
  module_defaults:
    oxlorg.opnsense.interface_vip: "{{ opnsense_conn | combine({'reload': true}) }}"
    oxlorg.opnsense.unbound_host: "{{ opnsense_conn | combine({'reload': true}) }}"
  block:
    - name: Merge HTTP frontends (proxied services + per-stack wildcard gateways)
      ansible.builtin.set_fact:
        haproxy_all_services: "{{ haproxy_proxied_services + (stack_gateways | default([])) }}"

    # --- bind addresses: one IP-alias VIP per service ----------------------
    - name: LAN IP-alias VIP per service
      oxlorg.opnsense.interface_vip:
        address: "{{ item.vip }}/24"
        mode: ipalias
        interface: "{{ haproxy_vip_interface }}"
        description: "haproxy-{{ item.name }}"
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }} ({{ item.vip }})" }

    # The module matches on address+interface, so flipping haproxy_vip_interface (standby lo0
    # ↔ lan at the cutover) would leave the old alias behind: two holders of one address.
    - name: No service VIP on the other interface
      oxlorg.opnsense.interface_vip:
        address: "{{ item.vip }}/24"
        interface: "{{ 'lan' if haproxy_vip_interface == 'lo0' else 'lo0' }}"
        state: absent
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }} ({{ item.vip }})" }

    # --- find issued cert refids (set by the opnsense-acme role) -----------------
    - name: List ACME certificates
      oxlorg.opnsense.raw: { module: acmeclient, controller: certificates, command: search }
      register: acme_certs
    - name: Assert every cert exists (issue via the opnsense-acme role first)
      ansible.builtin.assert:
        that: acme_certs.response.rows | selectattr('name', 'eq', item.cert_domain) | list | length > 0
        fail_msg: "No ACME cert named {{ item.cert_domain }} — run opnsense-acme and sign it first."
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.cert_domain }}" }
    - name: Map cert_domain -> certRefId
      ansible.builtin.set_fact:
        cert_refid: "{{ dict(acme_certs.response.rows | map(attribute='name') | list | zip(acme_certs.response.rows | map(attribute='certRefId') | list)) }}"

    # --- HAProxy servers (real server = each cluster VIP) -------------------
    - name: Find HAProxy servers
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchServers }
      register: hap_servers
    - name: Create HAProxy server <name>-srv
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addServer
        action: post
        data:
          server:
            enabled: "1"
            name: "{{ item.name }}-srv"
            address: "{{ item.backend_ip }}"
            port: "{{ item.backend_port }}"
            mode: active
            type: static
            ssl: "0"
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }}-srv" }
      when: (item.name ~ '-srv') not in (hap_servers.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy
    - name: Re-read servers (capture uuids)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchServers }
      register: hap_servers2
    - name: Map server name -> uuid
      ansible.builtin.set_fact:
        server_uuid: "{{ dict(hap_servers2.response.rows | map(attribute='name') | list | zip(hap_servers2.response.rows | map(attribute='uuid') | list)) }}"

    # --- HAProxy backends (pools) ------------------------------------------
    - name: Find HAProxy backends
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchBackends }
      register: hap_backends
    - name: Create HAProxy backend <name>-backend
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addBackend
        action: post
        data:
          backend:
            enabled: "1"
            name: "{{ item.name }}-backend"
            mode: http
            algorithm: source
            linkedServers: "{{ server_uuid[item.name ~ '-srv'] }}"
            healthCheckEnabled: "0"
            tuning_timeoutServer: 60m   # keep long-lived WebSockets alive
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }}-backend" }
      when: (item.name ~ '-backend') not in (hap_backends.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy
    - name: Re-read backends (capture uuids)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchBackends }
      register: hap_backends2
    - name: Map backend name -> uuid
      ansible.builtin.set_fact:
        backend_uuid: "{{ dict(hap_backends2.response.rows | map(attribute='name') | list | zip(hap_backends2.response.rows | map(attribute='uuid') | list)) }}"

    # --- HAProxy frontends (TLS :443, one per VIP) -------------------------
    - name: Find HAProxy frontends
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchFrontends }
      register: hap_frontends
    - name: Create HAProxy frontend <name>-frontend
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addFrontend
        action: post
        data:
          frontend:
            enabled: "1"
            name: "{{ item.name }}-frontend"
            bind: "{{ item.vip }}:443"
            mode: http
            defaultBackend: "{{ backend_uuid[item.name ~ '-backend'] }}"
            ssl_enabled: "1"
            ssl_certificates: "{{ cert_refid[item.cert_domain] }}"
            http2Enabled: "0"          # h2 breaks HA/Grafana WebSockets through the proxy
            tuning_timeoutClient: 60m
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }}-frontend ({{ item.vip }}:443)" }
      when: (item.name ~ '-frontend') not in (hap_frontends.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy

    # Create-if-absent means a VIP change in group_vars silently does NOT rebind the frontend —
    # that trap shipped twice (transcripts .11→.30→.28; found live 2026-07-13 when .30 shadowed the
    # Matchbox LXC). Re-post the full frontend payload keyed by uuid whenever the bind drifts.
    - name: Update HAProxy frontend bind on VIP change
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: "setFrontend/{{ (hap_frontends.response.rows | selectattr('name', 'equalto', item.name ~ '-frontend') | first).uuid }}"
        action: post
        data:
          frontend:
            enabled: "1"
            name: "{{ item.name }}-frontend"
            bind: "{{ item.vip }}:443"
            mode: http
            defaultBackend: "{{ backend_uuid[item.name ~ '-backend'] }}"
            ssl_enabled: "1"
            ssl_certificates: "{{ cert_refid[item.cert_domain] }}"
            http2Enabled: "0"
            tuning_timeoutClient: 60m
      loop: "{{ haproxy_all_services }}"
      loop_control: { label: "{{ item.name }}-frontend rebind -> {{ item.vip }}:443" }
      vars:
        _existing: "{{ hap_frontends.response.rows | selectattr('name', 'equalto', item.name ~ '-frontend') | list }}"
      when: (_existing | length) > 0 and (_existing | first).bind != (item.vip ~ ':443')
      notify: reconfigure haproxy

    # --- TCP passthrough services (no TLS) — e.g. Forgejo SSH clone on :22 --------
    # Raw TCP from <vip>:<port> to the cluster VIP, no cert/termination (SSH does its own
    # crypto). Reuses an IP-alias VIP already created above (e.g. forgejo's .2.9), so the
    # same hostname (forgejo.teststuff.net) serves HTTPS:443 and SSH:22. Config:
    # haproxy_tcp_services in group_vars. All guarded so an empty list is a no-op.
    - name: Find HAProxy servers (TCP pass)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchServers }
      register: hap_tcp_servers
      when: haproxy_tcp_services | length > 0
    - name: Create HAProxy TCP server <name>-srv
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addServer
        action: post
        data:
          server:
            enabled: "1"
            name: "{{ item.name }}-srv"
            address: "{{ item.backend_ip }}"
            port: "{{ item.backend_port }}"
            mode: active
            type: static
            ssl: "0"
      loop: "{{ haproxy_tcp_services }}"
      loop_control: { label: "{{ item.name }}-srv" }
      when:
        - haproxy_tcp_services | length > 0
        - (item.name ~ '-srv') not in (hap_tcp_servers.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy
    - name: Re-read servers (TCP uuids)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchServers }
      register: hap_tcp_servers2
      when: haproxy_tcp_services | length > 0
    - name: Map TCP server name -> uuid
      ansible.builtin.set_fact:
        tcp_server_uuid: "{{ dict(hap_tcp_servers2.response.rows | map(attribute='name') | list | zip(hap_tcp_servers2.response.rows | map(attribute='uuid') | list)) }}"
      when: haproxy_tcp_services | length > 0

    - name: Find HAProxy backends (TCP pass)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchBackends }
      register: hap_tcp_backends
      when: haproxy_tcp_services | length > 0
    - name: Create HAProxy TCP backend <name>-backend
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addBackend
        action: post
        data:
          backend:
            enabled: "1"
            name: "{{ item.name }}-backend"
            mode: tcp
            algorithm: source
            linkedServers: "{{ tcp_server_uuid[item.name ~ '-srv'] }}"
            healthCheckEnabled: "0"
            tuning_timeoutServer: 60m   # long-lived git-over-SSH sessions
      loop: "{{ haproxy_tcp_services }}"
      loop_control: { label: "{{ item.name }}-backend" }
      when:
        - haproxy_tcp_services | length > 0
        - (item.name ~ '-backend') not in (hap_tcp_backends.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy
    - name: Re-read backends (TCP uuids)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchBackends }
      register: hap_tcp_backends2
      when: haproxy_tcp_services | length > 0
    - name: Map TCP backend name -> uuid
      ansible.builtin.set_fact:
        tcp_backend_uuid: "{{ dict(hap_tcp_backends2.response.rows | map(attribute='name') | list | zip(hap_tcp_backends2.response.rows | map(attribute='uuid') | list)) }}"
      when: haproxy_tcp_services | length > 0

    - name: Find HAProxy frontends (TCP pass)
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: searchFrontends }
      register: hap_tcp_frontends
      when: haproxy_tcp_services | length > 0
    - name: Create HAProxy TCP frontend <name>-frontend
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: addFrontend
        action: post
        data:
          frontend:
            enabled: "1"
            name: "{{ item.name }}-frontend"
            bind: "{{ item.vip }}:{{ item.port }}"
            mode: tcp
            defaultBackend: "{{ tcp_backend_uuid[item.name ~ '-backend'] }}"
            ssl_enabled: "0"
            tuning_timeoutClient: 60m
      loop: "{{ haproxy_tcp_services }}"
      loop_control: { label: "{{ item.name }}-frontend ({{ item.vip }}:{{ item.port }})" }
      when:
        - haproxy_tcp_services | length > 0
        - (item.name ~ '-frontend') not in (hap_tcp_frontends.response.rows | map(attribute='name') | list)
      notify: reconfigure haproxy

    # Same rebind-on-drift as the HTTP frontends above (create-if-absent never propagates a VIP change).
    - name: Update HAProxy TCP frontend bind on VIP change
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: "setFrontend/{{ (hap_tcp_frontends.response.rows | selectattr('name', 'equalto', item.name ~ '-frontend') | first).uuid }}"
        action: post
        data:
          frontend:
            enabled: "1"
            name: "{{ item.name }}-frontend"
            bind: "{{ item.vip }}:{{ item.port }}"
            mode: tcp
            defaultBackend: "{{ tcp_backend_uuid[item.name ~ '-backend'] }}"
            ssl_enabled: "0"
            tuning_timeoutClient: 60m
      loop: "{{ haproxy_tcp_services }}"
      loop_control: { label: "{{ item.name }}-frontend rebind -> {{ item.vip }}:{{ item.port }}" }
      vars:
        _existing: "{{ hap_tcp_frontends.response.rows | selectattr('name', 'equalto', item.name ~ '-frontend') | list }}"
      when:
        - haproxy_tcp_services | length > 0
        - (_existing | length) > 0
        - (_existing | first).bind != (item.vip ~ ':' ~ item.port)
      notify: reconfigure haproxy

    # --- enable + start HAProxy (no enable flag on the general module) -------
    - name: Read HAProxy general settings
      oxlorg.opnsense.raw: { module: haproxy, controller: settings, command: get }
      register: hap_general
    - name: Enable HAProxy
      oxlorg.opnsense.raw:
        module: haproxy
        controller: settings
        command: set
        action: post
        data: { haproxy: { general: { enabled: "1" } } }
      when: hap_general.response.haproxy.general.enabled | default("0") != "1"
      notify: reconfigure haproxy
    - name: Ensure HAProxy service is running
      oxlorg.opnsense.raw: { module: haproxy, controller: service, command: start, action: post }
      register: hap_start
      changed_when: false

    # --- local DNS: <name>.teststuff.net -> its VIP ------------------------
    - name: Unbound host override per service
      oxlorg.opnsense.unbound_host:
        hostname: "{{ item.cert_domain.split('.')[0] }}"
        domain: "{{ item.cert_domain.split('.')[1:] | join('.') }}"
        record_type: A
        value: "{{ item.vip }}"
        description: "{{ item.name }} via HAProxy"
        # match on identifying fields only (prio default=10 never matches an A record ->
        # would append a duplicate every run).
        match_fields: [hostname, domain, record_type, value]
      loop: "{{ haproxy_proxied_services }}"
      loop_control: { label: "{{ item.cert_domain }} -> {{ item.vip }}" }

    # --- local DNS: WILDCARD per stack gateway: *.<stack>.teststuff.net -> its VIP (ADR-092) --
    # hostname `*` is API-accepted (verified 2026-07-15: two distinct names under a test wildcard
    # both resolved). This is what lets the stack add names with no homelab DNS edit — every
    # `<svc>.<stack>.teststuff.net` resolves to the gateway VIP; the in-cluster gateway host-routes.
    - name: Unbound WILDCARD override per stack gateway
      oxlorg.opnsense.unbound_host:
        hostname: "*"
        domain: "{{ item.wildcard_domain }}"
        record_type: A
        value: "{{ item.vip }}"
        description: "{{ item.name }} wildcard via HAProxy (ADR-092)"
        match_fields: [hostname, domain, record_type, value]
      loop: "{{ stack_gateways | default([]) }}"
      loop_control: { label: "*.{{ item.wildcard_domain }} -> {{ item.vip }}" }

# --- pfsync: HAProxy's own connections are never synced (FU-312, 2026-10-13) ---------------------
# A HAProxy connection terminates on this node's lo0 VIP, so it cannot survive a failover: the
# socket lives in this node's HAProxy. Syncing its pf state therefore buys nothing, and the sync
# breaks it. On the CARP pair, pfsync updates from the BACKUP corrupted the MASTER's sequence
# tracking for these states. pf then dropped the client's ACKs as `BAD state` (ackskew beyond
# ±MAXACKWINDOW), and bulk pulls froze mid-stream. A/B on 2026-10-13, pod clients on wk-02 and
# wk-04 against registry.teststuff.net, 2 × 16 range GETs per run: pfsync on, 5 of 32 stalled
# and pf's state-mismatch counter rose by ~500; BACKUP's pfsync off, 0 of 32 stalled and +0.
# Hence one rule passing LAN → the VIP range with `nopfsync` (pf `no-sync`). Forwarded and NAT
# states keep syncing.
- name: Read firewall automation rules
  oxlorg.opnsense.raw: { module: firewall, controller: filter, command: searchRule }
  register: hap_fw_rules
- name: HAProxy VIPs — pass with no pfsync (create-if-absent by description)
  oxlorg.opnsense.raw:
    module: firewall
    controller: filter
    command: addRule
    action: post
    data:
      rule:
        enabled: "1"
        sequence: "90"
        action: pass
        quick: "1"
        interface: lan
        direction: in
        ipprotocol: inet
        protocol: TCP
        source_net: any
        destination_net: "{{ haproxy_vip_network }}"
        nopfsync: "1"
        description: "haproxy: LAN to the VIPs, states not pfsync'd (ansible, FU-312)"
  when: >-
    "haproxy: LAN to the VIPs, states not pfsync'd (ansible, FU-312)"
    not in (hap_fw_rules.response.rows | map(attribute='description') | list)
  notify: apply firewall

# The SECOND leg (2026-10-13 evening recheck): every HAProxy connection is two pf states. The
# backend leg — the router's own connection to the cluster VIP (`192.168.2.70:n -> 192.168.40.x`)
# — is created by the generated `pass out log all` rule and was still synced; the same stale-echo
# (FreeBSD `pfsync_in_upd_c`: a one-direction-stale update still overwrites `dst`, then echoes)
# rolled its `dst.seqlo` back and pf dropped the router's OWN ACKs to the registry as `BAD state`
# (28 drops, `ackskew=-177590`, under a 2x16 parallel pod pull). Same remedy: a quick pass-out
# rule to the backend range with `nopfsync`. Forwarded traffic never creates a state on an out
# rule (its state is the in rule's), so this catches only router-originated connections. The
# generated pass-out rule is not `quick`, so this later quick rule wins. docs/router-move.md §pfsync.
- name: HAProxy backend connections — pass out with no pfsync (create-if-absent by description)
  oxlorg.opnsense.raw:
    module: firewall
    controller: filter
    command: addRule
    action: post
    data:
      rule:
        enabled: "1"
        sequence: "91"
        action: pass
        quick: "1"
        interface: lan
        direction: out
        ipprotocol: inet
        protocol: TCP
        source_net: any
        destination_net: "{{ haproxy_backend_network }}"
        nopfsync: "1"
        description: "haproxy: router to the backend VIPs, states not pfsync'd (ansible, FU-312)"
  when: >-
    "haproxy: router to the backend VIPs, states not pfsync'd (ansible, FU-312)"
    not in (hap_fw_rules.response.rows | map(attribute='description') | list)
  notify: apply firewall

# ...which only takes effect with the ANTI-LOCKOUT rule off. That rule (`pass in quick on lan
# to (self) port {22 80 443}`) is generated at priority 5, and every automation rule sits at
# ≥200000 (FilterRuleField::getPriority), so nothing can precede it. The VIPs are `(self)`
# (lo0), so it caught every HAProxy connection with a synced state. Off is safe: "Default allow
# LAN to any" already passes LAN → the GUI and SSH, and WireGuard clients have their own rule.
# There is no API for the setting (26.7: legacy system_advanced_firewall.php,
# system/webgui/noantilockout), so it goes over ssh through the config singleton, which keeps a
# backup revision. Idempotent: the read runs in check mode; the write only on drift.
- name: Read the anti-lockout setting (ssh — no API)
  ansible.builtin.command:
    argv: [ssh, -i, "{{ opnsense_ssh_key }}", -o, BatchMode=yes, -o, ConnectTimeout=10,
           -o, StrictHostKeyChecking=no, -o, UserKnownHostsFile=/dev/null, -o, LogLevel=ERROR,
           "root@{{ ansible_host }}",
           "php -r 'require_once \"config.inc\"; echo isset(\\OPNsense\\Core\\Config::getInstance()->object()->system->webgui->noantilockout) ? \"off\" : \"on\";'"]
  register: hap_antilockout
  changed_when: false
  check_mode: false
- name: Anti-lockout off (the VIP rule above must win for HAProxy's connections)
  ansible.builtin.command:
    argv: [ssh, -i, "{{ opnsense_ssh_key }}", -o, BatchMode=yes, -o, ConnectTimeout=10,
           -o, StrictHostKeyChecking=no, -o, UserKnownHostsFile=/dev/null, -o, LogLevel=ERROR,
           "root@{{ ansible_host }}",
           "php -r 'require_once \"config.inc\"; $c = \\OPNsense\\Core\\Config::getInstance(); $c->object()->system->webgui->addChild(\"noantilockout\", \"1\"); $c->save();' && configctl filter reload"]
  when: hap_antilockout.stdout | trim == 'on'
