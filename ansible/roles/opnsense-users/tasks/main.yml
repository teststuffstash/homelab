---
# OPNsense API users as code (FU-013): one local user per API consumer, privileges from
# group_vars (opnsense_api_users), no group membership, no password login (the module scrambles
# the password on create), and at most one API key each — minted here only when the user has
# none. Why per-consumer users: every config revision records its author, so the router's own
# history can tell the playbooks, the backup puller and a hand click apart (the click detector,
# argocd/resources/opnsense-config-backup/).
#
# Privilege KEYS (not labels) — the ACL names from the models' ACL/ACL.xml files. How the
# set for each user was chosen is in group_vars/opnsense.yml next to the list.
#
# `membership: []` is deliberate: a group grant would widen the user past its listed
# privileges (a user put into `admins` gains page-all), so the role pins "no groups".

# A privilege whose plugin is not installed does not exist on that box (page-services-dyndns
# without os-ddclient — the test VM) and the API would reject the whole user. It also grants
# nothing there, so it is dropped with a warning instead; a re-run after the plugin install adds it.
- name: Read the privilege keys this router knows
  oxlorg.opnsense.raw: { module: auth, controller: user, command: get }
  register: opn_user_template

- name: Warn about privileges this router does not have
  ansible.builtin.debug:
    msg: >-
      WARNING {{ item.name }}: {{ item.privileges | difference(opn_user_template.response.user.priv.keys() | list) | join(', ') }}
      unknown on this router (plugin not installed?) — skipped
  loop: "{{ opnsense_api_users }}"
  loop_control: { label: "{{ item.name }}" }
  when: item.privileges | difference(opn_user_template.response.user.priv.keys() | list) | length > 0

# --- API keys: one user = one key pair, identical on every node and in the wallet ------------
# The user module does not manage keys. `search_api_key` lists every key's owner + public half
# (never the secret); `add_api_key/<name>` generates a pair whose response is the ONLY time the
# secret is readable. The CARP pair has no config sync (ADR-144) and each node's add_api_key
# generates its OWN secret, so a key is minted ONCE — on the play's first host in inventory order
# (filter_plugins/opn_user_keys.py: the node is irrelevant to the end state, since the pair lands
# on every node and is verified there; a live CARP read would only add a failure mode during a
# failover) — and its stored `key|hash` line, read from the mint node's config.xml, is installed on
# every other node through the user model's update-only `apikeys` setter (auth/user/set). Proven on
# the test VM 2026-11-17: a deleted key re-installed this way authenticates with the ORIGINAL secret.
# Every divergence (two nodes with different keys, a node key the wallet lacks) is refused BEFORE
# any write — this block runs ahead of the user task for that reason. Rotation is deliberate: delete the key on EVERY node (auth/user/del_api_key/<id>) and
# re-run — see scripts/opnsense-api-users.sh.
- name: Refuse a partial run (a key minted on a --limit subset would exist on one node only)
  ansible.builtin.assert:
    that: ansible_play_hosts_all | sort == groups['opnsense'] | sort
    fail_msg: >-
      The users play converges keys across ALL router nodes ({{ groups['opnsense'] | join(', ') }});
      this run has {{ ansible_play_hosts_all | join(', ') }}. Drop the --limit.
    quiet: true
  run_once: true

- name: Read existing API keys
  oxlorg.opnsense.raw: { module: auth, controller: user, command: search_api_key }
  register: opn_user_keys
  no_log: true   # the rows carry the keys' public halves

- name: Plan each user's key across the nodes
  ansible.builtin.set_fact:
    opn_keys_plan: >-
      {{ dict(ansible_play_hosts_all | zip(ansible_play_hosts_all
              | map('extract', hostvars, ['opn_user_keys', 'response', 'rows']) | list))
         | opn_user_keys_plan(opnsense_api_users | map(attribute='name') | list,
                              ansible_play_hosts_all, opnsense_users_wallet_keys) }}
  no_log: true   # the plan carries public halves

- name: Refuse diverged keys (nothing has been written yet)
  ansible.builtin.assert:
    that: opn_keys_plan.errors | length == 0
    fail_msg: "{{ opn_keys_plan.errors | join(' | ') }}"
    quiet: true

- name: Key plan for this node (--check reports the same, mints nothing)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ opn_keys_plan.summary[inventory_hostname] }}"

# --- users, then the keys the plan above decided ----------------------------------------------
- name: API user (privileges pinned, no groups)
  oxlorg.opnsense.user:
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    privilege: "{{ item.privileges | intersect(opn_user_template.response.user.priv.keys() | list) }}"
    membership: []
  loop: "{{ opnsense_api_users }}"
  loop_control: { label: "{{ item.name }}" }


- name: Refuse to mint without a key sink (the secret is shown once)
  ansible.builtin.assert:
    that: opnsense_users_key_sink | length > 0
    fail_msg: >-
      {{ opn_keys_plan.mint | join(', ') }} need an API key, but opnsense_users_key_sink is empty.
      Run through scripts/opnsense-api-users.sh, which provides one and stores the result.
    quiet: true
  when: opn_keys_plan.mint | length > 0 and not ansible_check_mode

# The sink is written by the mint host alone (the mint tasks run nowhere else), one file per user
# and half; an existing file is refused rather than overwritten — two writers for one sink file
# cannot happen by construction, and this makes a stale sink loud too.
- name: Refuse a sink that already holds a pair for a user to mint
  ansible.builtin.stat:
    path: "{{ opnsense_users_key_sink }}/{{ item.0 }}.{{ item.1 }}"
  delegate_to: localhost
  loop: "{{ opn_keys_plan.mint | product(['key', 'secret']) | list }}"
  register: opn_sink_stat
  failed_when: opn_sink_stat.stat.exists
  when: inventory_hostname == opn_keys_plan.mint_host and not ansible_check_mode

- name: Mint an API key (once, on the mint host)
  oxlorg.opnsense.raw:
    module: auth
    controller: user
    command: "add_api_key/{{ item }}"
    action: post
  loop: "{{ opn_keys_plan.mint }}"
  register: opn_minted
  changed_when: true
  when: inventory_hostname == opn_keys_plan.mint_host
  no_log: true

- name: Assert every mint returned a key pair
  ansible.builtin.assert:
    that:
      - item.response.result | default('') == 'ok'
      - item.response.key | default('') | length > 0
      - item.response.secret | default('') | length > 0
    fail_msg: "add_api_key/{{ item.item }} did not return a key pair (result: {{ item.response.result | default('?') }})"
    quiet: true
  loop: "{{ opn_minted.results | default([]) }}"
  loop_control: { label: "{{ item.item }}" }
  when: inventory_hostname == opn_keys_plan.mint_host and not ansible_check_mode
  no_log: true   # a failed iteration would dump `item`, which carries the live secret

- name: Write the minted pair to the controller-side sink (0600)
  ansible.builtin.copy:
    dest: "{{ opnsense_users_key_sink }}/{{ item.0.item }}.{{ item.1 }}"
    content: "{{ item.0.response[item.1] }}"
    mode: "0600"
    force: false
  delegate_to: localhost
  loop: "{{ (opn_minted.results | default([])) | product(['key', 'secret']) | list }}"
  when: inventory_hostname == opn_keys_plan.mint_host and not ansible_check_mode
  no_log: true

# --- install the same pair on every other node ------------------------------------------------
# The public key of each install: the held key, or (minted this run) the mint host's response.
- name: Resolve the public key of each install
  ansible.builtin.set_fact:
    opn_key_installs: "{{ opn_keys_plan | opn_user_keys_installs(inventory_hostname, _minted) }}"
  vars:
    _m: "{{ hostvars[opn_keys_plan.mint_host].opn_minted.results | default([]) | selectattr('response', 'defined') | list }}"
    _minted: "{{ dict(_m | map(attribute='item') | zip(_m | map(attribute='response') | map(attribute='key'))) }}"
  when: not ansible_check_mode
  no_log: true

# The stored line (`key|$6$…hash`) lives only in the source node's config.xml; the newest backup
# revision IS the running config (every API save writes one); the line is found by its public key.
- name: Read each install's stored key line from its source node
  ansible.builtin.uri:
    url: "https://{{ hostvars[item.source].ansible_host }}/api/core/backup/download/this"
    url_username: "{{ hostvars[item.source].opnsense_conn.api_key }}"
    url_password: "{{ hostvars[item.source].opnsense_conn.api_secret }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  loop: "{{ opn_key_installs | default([]) }}"
  register: opn_key_src
  when: not ansible_check_mode
  no_log: true   # the response is the whole config.xml

- name: Extract the stored line
  ansible.builtin.set_fact:
    opn_key_lines: "{{ opn_key_src.results | default([]) | opn_user_key_lines }}"
  when: not ansible_check_mode
  no_log: true

- name: Assert every install found its line on the source node
  ansible.builtin.assert:
    that: opn_key_lines | selectattr('line', 'equalto', '') | list | length == 0
    fail_msg: >-
      no stored line for the key in the source node's config.xml:
      {{ opn_key_lines | selectattr('line', 'equalto', '') | map(attribute='user') | join(', ') }}
    quiet: true
  when: not ansible_check_mode

- name: Read this node's users (the install targets a uuid)
  oxlorg.opnsense.raw: { module: auth, controller: user, command: search }
  register: opn_user_rows
  when: (opn_key_lines | default([])) | length > 0

# The `apikeys` setter REPLACES the user's key blob — safe only because the plan installs on a node
# that holds no key for the user (holding a different one is refused above).
- name: Install the pair on this node
  oxlorg.opnsense.raw:
    module: auth
    controller: user
    command: "set/{{ (opn_user_rows.response.rows | selectattr('name', 'equalto', item.user) | first).uuid }}"
    action: post
    data: { user: { name: "{{ item.user }}", apikeys: "{{ item.line }}" } }
  loop: "{{ opn_key_lines | default([]) }}"
  loop_control: { label: "{{ item.user }} <- {{ item.source }}" }
  register: opn_installed
  changed_when: true
  failed_when: opn_installed.response.result | default('') != 'saved'
  when: not ansible_check_mode
  no_log: true   # the item carries the stored hash

# --- end state: every node holds the same single key per user -----------------------------------
- name: Re-read API keys
  oxlorg.opnsense.raw: { module: auth, controller: user, command: search_api_key }
  register: opn_user_keys_after
  when: not ansible_check_mode
  no_log: true

- name: Assert one identical key per user on every node
  ansible.builtin.assert:
    that:
      - opn_keys_after.errors | length == 0
      - opn_keys_after.mint | length == 0
      - opn_keys_after.actions[inventory_hostname].values() | map(attribute='act') | difference(['ok']) | length == 0
    fail_msg: "after the run: {{ opn_keys_after.errors | join(' | ') }} {{ opn_keys_after.summary[inventory_hostname] }}"
    quiet: true
  vars:
    opn_keys_after: >-
      {{ dict(ansible_play_hosts_all | zip(ansible_play_hosts_all
              | map('extract', hostvars, ['opn_user_keys_after', 'response', 'rows']) | list))
         | opn_user_keys_plan(opnsense_api_users | map(attribute='name') | list, ansible_play_hosts_all, None) }}
  when: not ansible_check_mode

# A pair minted this run is in hand once: prove its SECRET authenticates on every node (401 = the
# node does not hold it; 403 = authenticated, the user just lacks that page).
- name: Prove each minted secret authenticates on this node
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}/api/core/firmware/status"
    url_username: "{{ item.response.key }}"
    url_password: "{{ item.response.secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 403]
  loop: "{{ hostvars[opn_keys_plan.mint_host].opn_minted.results | default([]) | selectattr('response', 'defined') | list }}"
  when: not ansible_check_mode
  no_log: true
