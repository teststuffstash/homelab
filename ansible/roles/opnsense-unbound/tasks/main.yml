---
# OPNsense Unbound — static LAN host overrides (config-as-code).
# Home for hand-made overrides NOT created by another role (per-service names for
# HAProxy-proxied backends are managed by the opnsense-haproxy role — don't duplicate
# them here). The list is in group_vars/opnsense.yml (unbound_hosts).
#
# match_fields EXCLUDES `value`: matching on hostname+domain+record_type updates the
# existing record in place (a repoint) instead of appending a duplicate.
#
# NOTE: the unbound_host module saves the record but does NOT apply it — Unbound keeps
# serving the old answer until reconfigured. The handler forces that apply (raw
# mutating commands need action:post, else they default to get and silently no-op).

- name: Unbound host override per entry
  oxlorg.opnsense.unbound_host:
    hostname: "{{ item.hostname }}"
    domain: "{{ item.domain }}"
    record_type: A
    value: "{{ item.value }}"
    description: "{{ item.description }}"
    match_fields: [hostname, domain, record_type]
  loop: "{{ unbound_hosts }}"
  loop_control: { label: "{{ item.hostname }}.{{ item.domain }} -> {{ item.value }}" }
  notify: reconfigure unbound

# --- Advanced settings (unbound_advanced) ------------------------------------------------
# No typed module covers Unbound's Advanced tab, so: read the live settings, POST the pinned
# dict only when some key differs (idempotent — a steady-state run changes nothing), then the
# same reconfigure handler applies. `unbound/settings/set` merges: unlisted fields keep their
# current value, so the dict only needs the keys we pin. An unset boolean reads back as "" —
# it compares unequal to "1" once and reads back "1" from then on.
- name: Read Unbound settings
  oxlorg.opnsense.raw: { module: unbound, controller: settings, command: get }
  register: unbound_settings

- name: Compute Unbound advanced keys that differ from the pinned values
  ansible.builtin.set_fact:
    unbound_advanced_drift: >-
      {{ unbound_advanced_drift | default([])
         + ([item.key] if (unbound_settings.response.unbound.advanced[item.key] | default('') | string)
                          != (item.value | string) else []) }}
  loop: "{{ unbound_advanced | dict2items }}"
  loop_control: { label: "{{ item.key }}={{ item.value }}" }

- name: "Unbound advanced settings (drifted keys: {{ unbound_advanced_drift | default([]) | join(', ') }})"
  oxlorg.opnsense.raw:
    module: unbound
    controller: settings
    command: set
    action: post
    data: { unbound: { advanced: "{{ unbound_advanced }}" } }
  when: unbound_advanced_drift | default([]) | length > 0
  notify: reconfigure unbound
