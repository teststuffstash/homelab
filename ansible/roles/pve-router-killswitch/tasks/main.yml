# pve-router-killswitch — one `router-killswitch@<vmid>` unit (+ its sibling `router-wangate@<vmid>`,
# the WAN gate) per standing router node on this hypervisor (docs/router-move.md §Building a standing node, step 1). The logic is
# files/router-killswitch.sh + router-wangate.sh; the vmids are host_vars `pve_router_killswitch_vmids`. The role
# INSTALLS and ENABLES the kill-switch units but does not start them: arming is the build's first act
# (`scripts/opnsense-router-node.sh killswitch-arm <node>`, before the first boot) and every host
# boot's (WantedBy + Before=pve-guests). Instances for vmids dropped from the list are retired.
# A LIVE node (`pve_router_live_vmids`, ADR-145) keeps its WAN gate and loses its kill switch: the
# switch's trip conditions are a live router's normal traffic.
---
- name: tcpdump present (Debian main)
  ansible.builtin.apt:
    name: tcpdump
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Log directory exists
  ansible.builtin.file:
    path: /var/log/router-killswitch
    state: directory
    mode: "0750"

- name: Install the kill switch
  ansible.builtin.copy:
    src: router-killswitch.sh
    dest: /usr/local/sbin/router-killswitch
    mode: "0755"
  register: pve_rks_script

- name: No exemptions file (retired with the /24 ruling, ADR-088 as amended)
  ansible.builtin.file:
    path: /etc/default/router-killswitch
    state: absent
  register: pve_rks_default

- name: Install the template unit
  ansible.builtin.template:
    src: router-killswitch@.service.j2
    dest: /etc/systemd/system/router-killswitch@.service
    mode: "0644"
  register: pve_rks_unit

- name: Reload systemd when the unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: pve_rks_unit.changed

- name: Install the WAN gate
  ansible.builtin.copy:
    src: router-wangate.sh
    dest: /usr/local/sbin/router-wangate
    mode: "0755"
  register: pve_rwg_script

- name: Install the WAN gate template unit
  ansible.builtin.template:
    src: router-wangate@.service.j2
    dest: /etc/systemd/system/router-wangate@.service
    mode: "0644"
  register: pve_rwg_unit

- name: Reload systemd when the gate unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: pve_rwg_unit.changed

# Unlike the kill switch, the gate is not armed by the build: it is always safe (its default is
# WAN DOWN), so it runs from install on — restarted when its script or unit changed.
- name: WAN gate instances enabled + running
  ansible.builtin.systemd:
    name: "router-wangate@{{ item }}.service"
    enabled: true
    state: "{{ 'restarted' if (pve_rwg_script.changed or pve_rwg_unit.changed) else 'started' }}"
  loop: "{{ pve_router_killswitch_vmids }}"

- name: Instances enabled (armed at every host boot) — standing nodes only
  ansible.builtin.systemd:
    name: "router-killswitch@{{ item }}.service"
    enabled: true
  loop: "{{ pve_router_killswitch_vmids | difference(pve_router_live_vmids) }}"

- name: Running instances restarted when the script or unit changed (a stopped one stays stopped)
  ansible.builtin.shell: |
    systemctl is-active -q "router-killswitch@{{ item }}.service" || exit 0
    systemctl restart "router-killswitch@{{ item }}.service" && echo restarted
  loop: "{{ pve_router_killswitch_vmids | difference(pve_router_live_vmids) }}"
  when: pve_rks_script.changed or pve_rks_unit.changed or pve_rks_default.changed
  register: pve_rks_restart
  changed_when: "'restarted' in pve_rks_restart.stdout"

- name: Instances no longer wanted are stopped + disabled (a dropped vmid; a live node's kill switch)
  ansible.builtin.shell: |
    set -eu
    for u in $( { ls /etc/systemd/system/multi-user.target.wants/ 2>/dev/null | grep -E '^router-(killswitch|wangate)@.*\.service$'
                  systemctl list-units --all --plain --no-legend 'router-killswitch@*.service' 'router-wangate@*.service' | awk '{print $1}'; } | sort -u); do
      id="${u#*@}"; id="${id%.service}"
      case "$u" in
        router-wangate@*) keep=" {{ pve_router_killswitch_vmids | join(' ') }} " ;;
        *)                keep=" {{ pve_router_killswitch_vmids | difference(pve_router_live_vmids) | join(' ') }} " ;;
      esac
      case "$keep" in *" $id "*) ;; *) systemctl disable --now "$u"; echo "retired $u";; esac
    done
  register: pve_rks_retired
  changed_when: "'retired' in pve_rks_retired.stdout"
