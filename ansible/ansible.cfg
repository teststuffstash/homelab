# Paths here resolve relative to THIS file's directory (ansible/). Point
# ANSIBLE_CONFIG at this file: export ANSIBLE_CONFIG=ansible/ansible.cfg
# (the scripts/opnsense-playbook.sh wrapper does this).
[defaults]
# The router is the CARP pair's nodes since window 1 (ADR-145) — their own file (and group_vars).
inventory = inventory.yml,router-nodes/inventory.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
