# OPNsense CARP + pfsync — the router pair's shared VIPs and state sync (ADR-144; docs/router-move.md, **The CARP trial**).
# Thin role-caller — logic in roles/opnsense-carp. The VIPs live in the ROUTER NODES' own
# group_vars (ansible/router-nodes/group_vars/opnsense.yml `router_carp_vips`), each node's skew in
# its inventory host vars: for prod (ansible/inventory.yml) the list is undefined and this play is
# a no-op, as it is on the test VM and the rebuild drill.
# Needs OPN_CARP_PASSWORD in the env (wallet `opnsense-carp-password`) when the list is non-empty;
# scripts/opnsense-router-node.sh converge exports it.
#   bash scripts/opnsense-playbook.sh ansible/opnsense-carp.yml -i ansible/router-nodes/inventory.yml
- name: OPNsense CARP VIPs (router nodes only)
  hosts: opnsense
  gather_facts: false
  module_defaults:
    oxlorg.opnsense.hasync_general: "{{ opnsense_conn }}"
    oxlorg.opnsense.gateway: "{{ opnsense_conn }}"
  roles:
    - opnsense-carp
