# Inventory for the homelab control targets. Group names (opnsense, matchbox) drive
# group_vars/*.yml; host names are distinct from the groups to avoid Ansible's
# "group and host with same name" warning. Playbooks target the GROUPS.
#   - opnsense : the router, driven via its REST API *from the controller* (connection: local —
#               the oxlorg.opnsense modules POST to the API). Since window 1 (ADR-145) its hosts are
#               the CARP pair's nodes in router-nodes/inventory.yml, which ansible.cfg loads beside
#               this file — Big Data (`opnsense-fw` @ .1) left; the fallback re-adds it here.
#   - matchbox : the PXE provisioning LXC @ .30, configured over SSH.
# Per-group connection + config values live in group_vars/{opnsense,matchbox}.yml.
all:
  children:
    matchbox:
      hosts:
        matchbox-lxc:
          ansible_host: 192.168.2.30
    pve:
      # The group is "Proxmox hypervisor hosts", not the box named pve — nx-02 (the SECOND
      # hypervisor, 2026-09-15) is one too, and every play here is per-host work: the thin-pool
      # meter, the package upgrade, the serial-console tails. Per-HOST values live in host_vars/.
      hosts:
        pve-host:
          ansible_host: 192.168.2.3
        nx-02-host:
          ansible_host: 192.168.2.59
