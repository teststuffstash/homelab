# mgmt-metrics — the management box as a scrape target + the belts on its apply loop (FU-252).
# Raw manifests in argocd/resources/mgmt-metrics/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/mgmt-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
