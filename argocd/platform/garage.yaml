# Garage — self-hosted S3-compatible object store (Deuxfleurs), ADR-031. THE store: every bucket in
# docs/garage.md §Durability lives here, including agent-transcripts and the tofu remote state.
#
# MIGRATED off tofu `helm_release.garage` on 2026-08-04 — the LAST release of the ArgoCD lever
# (FU-136), and the one the runbook said to leave until last because a destroy here is
# unrecoverable. It was gated on three things, all now satisfied:
#   1. a backup existing (FU-137 — `devbox run garage-backup`, 351,682 objects verified);
#   2. both secrets behind references (rpcSecret AND the admin token — see tofu/garage.tf);
#   3. the vendored chart relocated to argocd/charts/garage, where ArgoCD can read it.
#
# The Application name MUST stay `garage` — it equals the Helm release name, which is what makes
# ArgoCD's label tracking agree with the labels already on the live objects.
#
# Verified before the move: this chart path + these values rendered and diffed against live with
# `kubectl diff -n garage` — 7 objects, zero differences. (Use -n garage: the chart emits no
# metadata.namespace, so an unscoped diff compares against the wrong namespace and reports
# five phantom differences.)
#
# ⚠ The StatefulSet's volumeClaimTemplates are IMMUTABLE and hold 63 GB. Nothing here may change
# `persistence`, and the sizes below are NOT the live sizes — they must keep matching the existing
# templates or the app stops syncing under selfHeal. A real resize is `kubectl patch pvc` (the
# longhorn StorageClass sets allowVolumeExpansion — that is how meta went 10Gi -> 30Gi on
# 2026-08-25), or the PV-rebind dance in docs/garage-bulk-migration.md to move tier/storageClass.
# Either way the value here stays put; docs/garage.md §Durability carries the live numbers.
#
# Before any SUBSTANTIAL change here (replication, storage, engine, snapshots): read
# docs/garage.md §Target architecture — it carries ADR-114 and the upstream garagehq reading
# list that grounded the current posture (the fsync/snapshot lines below are incident response,
# 2026-08-24 meta wipe).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    # The chart is VENDORED IN THIS REPO (argocd/charts/garage, Garage v2.3.0 / chart 0.9.3) so a
    # sync never depends on git.deuxfleurs.fr. Upgrades = re-vendor at the new tag, per that dir's
    # VENDORED.md.
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/charts/garage
    helm:
      valuesObject:
        deployment:
          kind: StatefulSet
          replicaCount: 1
        environment:
          - name: GARAGE_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: garage-admin-token
        garage:
          consistencyMode: consistent
          existingRpcSecret: garage-rpc
          replicationFactor: "1"
          # Both lines are the 2026-08-24 incident response (pve thin pool hit 100%, wk-01 froze,
          # the meta LMDB came back with empty tables — docs/incidents/2026-08-24-pve-thin-pool-garage-meta-wipe.md):
          # Garage's metadata_fsync DEFAULTS TO FALSE, so a hard VM stop can lose committed metadata;
          # the auto-snapshot is the second belt — a periodic LMDB copy inside the meta volume.
          metadataAutoSnapshotInterval: 6h
          additionalTopLevelConfig: |-
            metadata_fsync = true
            # snapshots need up to 4x the DB size — the 10Gi meta volume can't hold that
            # (2.4GB db as of the incident); the docs' own advice is the data volume.
            metadata_snapshots_dir = "/mnt/data/meta_snapshots"
          s3:
            api:
              region: garage
            web:
              rootDomain: .teststuff.net
        monitoring:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        persistence:
          data:
            size: 150Gi
            storageClass: longhorn-bulk
          enabled: true
          meta:
            # ⚠ DO NOT "correct" this to the live size. It must keep matching the StatefulSet's
            # immutable volumeClaimTemplate (also 1Gi) or the app never syncs again under selfHeal.
            # The real PVC is 30Gi with numberOfReplicas 1 on wk-02 (2026-08-25) — see FU-137;
            # this number has been decorative since the volume was first resized out of band.
            size: 1Gi
            storageClass: longhorn
        resources:
          limits:
            # 512Mi until 2026-08-25, when it became the thing that broke the snapshot belt
            # (FU-184). A metadata snapshot is an LMDB compacting copy; while the env was
            # page-leaked it crawled for ~11 min and never finished, so its page cache never
            # piled up. On the rebuilt 1.6 GiB env the same copy completes in ~15 s, and that
            # burst of dirty pages exceeded 512Mi — the first successful-shaped attempt
            # OOM-killed the container instead. Sized for the copy, not the steady state:
            # headroom must exceed the DB size, so this rises with it. docs/garage.md §Durability.
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 128Mi
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    # prune was false for the first sync. On this Application a stray prune is not an
    # inconvenience — it is the StatefulSet and its 63 GB of PVCs. Flipped 2026-08-04 after the
    # adoption verified clean: Synced/Healthy, pod still the one from the pre-migration apply with
    # 0 restarts, data PVC 22d / meta PVC 51d untouched, node id b4bea2fa753499fd unchanged, and
    # the S3 + admin paths both answering.
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
