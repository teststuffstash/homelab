# Garage — self-hosted S3-compatible object store (Deuxfleurs), ADR-031. THE store: every bucket in
# docs/garage.md §Durability lives here, including agent-transcripts and the tofu remote state.
#
# MIGRATED off tofu `helm_release.garage` on 2026-08-04 — the LAST release of the ArgoCD lever
# (FU-136), and the one the runbook said to leave until last because a destroy here is
# unrecoverable. It was gated on three things, all now satisfied:
#   1. a backup existing (FU-137 — `devbox run garage-backup`, 351,682 objects verified);
#   2. both secrets behind references (rpcSecret AND the admin token — see tofu/garage.tf);
#   3. the vendored chart relocated to argocd/charts/garage, where ArgoCD can read it.
#
# The Application name MUST stay `garage` — it equals the Helm release name, which is what makes
# ArgoCD's label tracking agree with the labels already on the live objects.
#
# Verified before the move: this chart path + these values rendered and diffed against live with
# `kubectl diff -n garage` — 7 objects, zero differences. (Use -n garage: the chart emits no
# metadata.namespace, so an unscoped diff compares against the wrong namespace and reports
# five phantom differences.)
#
# ⚠ The StatefulSet's volumeClaimTemplates are IMMUTABLE. Nothing here may change `persistence`
# without the orphan-delete dance (docs/garage.md §Target architecture: `delete sts --cascade=orphan`,
# then let ArgoCD re-create — the pods and PVCs survive, the templates change). A real resize is
# `kubectl patch pvc` (allowVolumeExpansion — that is how meta went 10Gi -> 30Gi on 2026-08-25);
# the value here then stays put, docs/garage.md §Durability carries the live numbers.
#
# rf=3 across physical zones since 2026-09-07 (ADR-114 + amendment, FU-137): three pods, one per
# zone (wk-metal-01, wk-metal-04, m70s), each on its own replica-1 XFS Longhorn volume — engines
# replicate, storage stores singles. Before any SUBSTANTIAL change here (replication, storage,
# engine, snapshots): read docs/garage.md §Target architecture — it carries ADR-114, the executed
# build-out and the upstream garagehq reading list that grounded the posture (the fsync/snapshot
# lines below are incident response, 2026-08-24 meta wipe).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    # The chart is VENDORED IN THIS REPO (argocd/charts/garage, Garage v2.3.0 / chart 0.9.3) so a
    # sync never depends on git.deuxfleurs.fr. Upgrades = re-vendor at the new tag, per that dir's
    # VENDORED.md.
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/charts/garage
    helm:
      valuesObject:
        deployment:
          kind: StatefulSet
          # One Garage instance per physical zone (ADR-114); the affinity block below is what
          # makes the three pods land one-per-zone, and the zone label is what `garage layout
          # assign -z` records — keep the two in agreement.
          replicaCount: 3
        environment:
          - name: GARAGE_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: garage-admin-token
        garage:
          consistencyMode: consistent
          existingRpcSecret: garage-rpc
          # ⚠ Changing this on a live cluster is upstream-documented but NOT supported: stop,
          # delete `cluster_layout` from every meta dir, change the config, restart, recreate the
          # layout, repair. 1 -> 3 was executed 2026-09-07 (docs/garage.md §Target architecture);
          # never flip it again casually — a mismatch between this and the layout on disk
          # refuses to start.
          replicationFactor: "3"
          # Both lines are the 2026-08-24 incident response (pve thin pool hit 100%, wk-01 froze,
          # the meta LMDB came back with empty tables — docs/incidents/2026-08-24-pve-thin-pool-garage-meta-wipe.md):
          # Garage's metadata_fsync DEFAULTS TO FALSE, so a hard VM stop can lose committed metadata;
          # the auto-snapshot is the second belt — a periodic LMDB copy inside the meta volume.
          metadataAutoSnapshotInterval: 6h
          additionalTopLevelConfig: |-
            metadata_fsync = true
            # snapshots need up to 4x the DB size — the 10Gi meta volume can't hold that
            # (2.4GB db as of the incident); the docs' own advice is the data volume.
            metadata_snapshots_dir = "/mnt/data/meta_snapshots"
          s3:
            api:
              region: garage
            web:
              rootDomain: .teststuff.net
        monitoring:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        persistence:
          # Both volumes on longhorn-local-xfs (tofu/longhorn.tf): replica 1, XFS, strict-local,
          # WaitForFirstConsumer — the volume lives on the zone node the pod is pinned to.
          # Templates re-cut 2026-09-07 (orphan-delete dance); a pod's PVCs that predate it keep
          # their old class until that pod is rotated (docs/garage.md §Metadata reclamation).
          data:
            size: 150Gi
            storageClass: longhorn-local-xfs
          enabled: true
          meta:
            # 30Gi = the live size the old volume had grown to; LMDB ratchets (leaked pages,
            # ~2.6 GB/day observed) and the answer is rotation, not a bigger volume.
            size: 30Gi
            storageClass: longhorn-local-xfs
        resources:
          limits:
            # 512Mi until 2026-08-25, when it became the thing that broke the snapshot belt
            # (FU-184). A metadata snapshot is an LMDB compacting copy; while the env was
            # page-leaked it crawled for ~11 min and never finished, so its page cache never
            # piled up. On the rebuilt 1.6 GiB env the same copy completes in ~15 s, and that
            # burst of dirty pages exceeded 512Mi — the first successful-shaped attempt
            # OOM-killed the container instead. Sized for the copy, not the steady state:
            # headroom must exceed the DB size, so this rises with it. docs/garage.md §Durability.
            memory: 2Gi
          requests:
            cpu: 100m
            # 1Gi (was 128Mi): two of the three zone nodes are kata ride nodes whose kubelet
            # evicts under memory pressure by usage-over-request first — a store using ~1Gi
            # against a 128Mi request would be the first pod out, before the ride that caused
            # the pressure. Requesting what it uses puts it behind the rides in that ranking.
            memory: 1Gi
        # Platform store above per-ride pods at scheduling and eviction time (the laptops are
        # shared with kata rides). rf=3 tolerates losing one zone, but not as a routine event.
        priorityClassName: system-cluster-critical
        # ROLLOUTS MUST NOT COST QUORUM (2026-09-09 07:22Z: the chart ships no readiness probe, so
        # a values change cycled all three pods in 31 s and a stack's S3 delete failed on
        # "Could not reach quorum of 2" — GarageQuorumMembersRestarted + GarageS3ServerErrors are
        # the detectors, built first and replayed on the event). /health answers 503 exactly when
        # THIS node's view has no quorum, so a pod is Ready only once it has rejoined its peers —
        # and a node stalled off the mesh drops out of the S3 Service instead of coordinating
        # requests (the 2026-09-08 SA400 class). minReadySeconds then holds the rollout after each
        # pod is Ready so the next member goes down only after the previous one has been serving.
        # 300 s, not 90: the live test of the first rollout (09:00–09:05Z) spaced the three starts
        # ~2 min apart — quorum held, GarageS3ServerErrors stayed silent — but
        # GarageQuorumMembersRestarted counts two starts inside 5 min, and a rollout must sit
        # outside that window so the belt keeps meaning "closer than any rollout would ever do".
        # Cost: a full roll takes ~17 min instead of ~5. It is a storage tier; that is fine.
        readinessProbe:
          httpGet: { path: /health, port: 3903 }
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        minReadySeconds: 300
        # One pod per physical zone, ONLY on the three zone nodes. Required anti-affinity on the
        # zone key is what keeps a pod from following a dead node into another zone (it stays
        # Pending until its zone returns — correct for a zone-pinned store whose volume is
        # strict-local anyway). Zone list = machines.yaml `zone` of the three ADR-114 nodes.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values: [wk-metal-01, wk-metal-04, m70s]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                    app.kubernetes.io/instance: garage
        # wk-metal-01/-04 carry the compute-tier taint (metal.tf).
        tolerations:
          - key: homelab.io/ephemeral
            operator: Equal
            value: "true"
            effect: NoSchedule
        service:
          type: ClusterIP
        # METADATA ROTATION SEED — the init container that makes GarageDiskFillingUp on a meta
        # volume a self-clearing condition (docs/garage.md §Metadata reclamation, as built). It runs
        # on every pod start and is a no-op unless the controller (argocd/resources/
        # garage-meta-rotation/, a CronJob polling the alert) has named THIS pod + a fresh
        # generation in the runtime-owned ConfigMap garage-meta-rotation-state; then it swaps the
        # live LMDB for the pod's latest FINISHED compacted snapshot (its own 6h auto-snapshot on
        # the data volume) and Garage reconciles the delta from its peers. Never the native
        # `repair tables` alone — measured 2026-09-09, that re-bloats the env 3–4× (ledger).
        extraVolumes:
          - name: meta-rotate-script
            configMap: { name: garage-meta-rotate-init, defaultMode: 0755 }
        extraInitContainers:
          - name: meta-rotate
            image: busybox:stable
            command: ["/bin/sh", "/script/meta-rotate.sh"]
            env:
              - name: POD_NAME
                valueFrom: { fieldRef: { fieldPath: metadata.name } }
            envFrom:
              # Runtime-owned (the controller creates/patches it; NOT in git, so ArgoCD's selfHeal
              # cannot revert a rotation order). Keys ROTATE_TARGET / ROTATE_GENERATION.
              - configMapRef: { name: garage-meta-rotation-state, optional: true }
            securityContext:
              capabilities: { drop: [ALL] }
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            volumeMounts:
              - { name: meta, mountPath: /mnt/meta }
              - { name: data, mountPath: /mnt/data }
              - { name: meta-rotate-script, mountPath: /script }
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    # prune was false for the first sync. On this Application a stray prune is not an
    # inconvenience — it is the StatefulSet and its 63 GB of PVCs. Flipped 2026-08-04 after the
    # adoption verified clean: Synced/Healthy, pod still the one from the pre-migration apply with
    # 0 restarts, data PVC 22d / meta PVC 51d untouched, node id b4bea2fa753499fd unchanged, and
    # the S3 + admin paths both answering.
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
