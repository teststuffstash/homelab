# FU-280 phase 1 — the registry on a filesystem (PVC) backend, as a TEMPORARY measurable trial.
# Raw manifests + the whole rationale (why contention and not the quota peak; why 150 Gi is the
# selector) in argocd/resources/registry-fs-trial/.
# ⚠ THIS APP IS MEANT TO BE DELETED. It is an experiment with an end state either way: if phase 1
# wins, the live registry moves to this backend and KEEPS its own name; if it loses, this goes.
# Do not grow consumers against it — it has no hostname, no cert and no auth by design.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-fs-trial
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/registry-fs-trial
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: registry-fs-trial
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
