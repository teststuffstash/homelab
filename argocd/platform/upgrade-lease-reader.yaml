# upgrade-lease-reader — the cluster-side read of the ⚓ upgrade leases (ADR-150; operator ruling
# 2026-10-11, docs/management-box.md §MB5): a 2-minute CronJob pushes every standing lease to the
# Pushgateway and a PrometheusRule names the unconfirmed ones — with or without the management box.
# Raw manifests in argocd/resources/upgrade-lease-reader/ (CronJob + SA in monitoring, its Role in
# agent-coordinator; detector only, never acts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upgrade-lease-reader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/upgrade-lease-reader
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
