# Alert triage labels for the UPSTREAM kube-prometheus-stack rules (operator decision 2026-10-03).
#
# Every alert that reaches Alertmanager carries `triage` with one of three values:
#   none — no in-cluster investigation can change what anyone does (self-describing state,
#          operator-only remedy, meta, or the alert cannot fire on this cluster);
#   now  — acute: a real-time responder session starts immediately;
#   dig  — the default: investigated in depth only if it stands or recurs unexplained.
# OUR rules (argocd/**, the values file's own rule groups, the AgentStack
# composition) carry the label in the rule itself. The chart has no per-alert label hook
# (customRules sets only `for`/`severity`; additionalRuleGroupLabels is per group and the groups
# are mixed), so the upstream rules get theirs HERE, on the way to Alertmanager.
#
# FILL-IF-EMPTY by construction: each entry matches `<triage>;<alertname>` with an EMPTY triage,
# so a rule that carries its own label is never rewritten, and the first matching entry wins
# (the severity-specific lines sit above the per-name ones). The label is added at SEND time:
# Alertmanager (API, UI, routes) sees it; the ALERTS series in Prometheus does not.
#
# Coverage is held by scripts/prometheus-rules-lint.sh against
# argocd/platform/values/kube-prometheus-stack-upstream-alerts.txt — the alert names the PINNED
# chart renders. A chart bump that changes that set reds the lint until
# `devbox run upstream-alerts-refresh` re-renders the list and every new name is classified here.
prometheus:
  prometheusSpec:
    additionalAlertRelabelConfigs:
      # ── severity-specific (first match wins) ──
      - {source_labels: [triage, alertname, severity], regex: ';KubePersistentVolumeFillingUp;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      - {source_labels: [triage, alertname, severity], regex: ';KubePersistentVolumeInodesFillingUp;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      - {source_labels: [triage, alertname, severity], regex: ';NodeFilesystemAlmostOutOfFiles;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      - {source_labels: [triage, alertname, severity], regex: ';NodeFilesystemAlmostOutOfSpace;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      - {source_labels: [triage, alertname, severity], regex: ';NodeFilesystemFilesFillingUp;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      - {source_labels: [triage, alertname, severity], regex: ';NodeFilesystemSpaceFillingUp;critical', target_label: triage, replacement: now}  # critical variant: writes fail within minutes; a resize/cleanup PR helps fast
      # ── now ──
      - {source_labels: [triage, alertname], regex: ';KubePodNotReady', target_label: triage, replacement: now}  # operator ruling 2026-10-03: the kata-handler catch class (nx-01, found in 20 min)
      - {source_labels: [triage, alertname], regex: ';PrometheusNotIngestingSamples', target_label: triage, replacement: now}  # whole alert belt going blind; pod logs/config diagnosable, fast fix matters
      # ── dig ──
      - {source_labels: [triage, alertname], regex: ';AlertmanagerClusterCrashlooping', target_label: triage, replacement: dig}  # generic degraded state; dig if it stands for hours or recurs
      - {source_labels: [triage, alertname], regex: ';AlertmanagerClusterFailedToSendAlerts', target_label: triage, replacement: dig}  # operator ruling 2026-10-03: accepted — it rides the integration that is failing
      - {source_labels: [triage, alertname], regex: ';AlertmanagerFailedReload', target_label: triage, replacement: dig}  # generic degraded state; dig if it stands for hours or recurs
