# kube-prometheus-stack values — the VALUES half of argocd/platform/kube-prometheus-stack.yaml.
#
# Provenance: extracted verbatim from the live Helm release (revision 25) when this release moved
# off tofu `helm_release.kube_prometheus_stack` (FU-136, docs/dependency-upgrades.md §"Executing
# the lever"). Nothing was re-authored — the empty-diff pre-flight is only meaningful if these are
# the same values tofu was rendering.
#
# ⚠ NO SECRET MAY EVER APPEAR HERE — this repo is public. Every credential is a REFERENCE:
# grafana.admin.existingSecret → the `grafana-admin` Secret, `secrets: [ha-token]` mounted for the
# Home Assistant scrape, and secretKeyRefs in the sqlite-sync sidecar. Those Secrets are still
# created by tofu (monitoring.tf) — tofu keeps owning the secrets after it stops owning the
# release, which is the ESO/Infisical migration's next target, not this one's problem.
#
# homelab#477: the STOCK kube-prometheus-stack NodeSystemSaturation alert pages on the
# ephemeral/kata pool during every agent ride — ride load is that pool's designed purpose
# (nodes tainted homelab.io/ephemeral=true run hot by construction). The stock expr is not
# overridable via values (chart v86.1.0 has no per-alert expr hook), so we disable it here and
# re-add a scoped copy in the node-health group below. The non-ephemeral nodes keep the stock
# sensitivity (2 load/core for 15m) — wk-01 saturation was a REAL finding once (#103).
defaultRules:
  disabled:
    NodeSystemSaturation: true
additionalPrometheusRulesMap:
  cilium:
    groups:
      - name: cilium
        rules:
          - alert: CiliumAgentScrapeDown
            annotations:
              description: Prometheus can't scrape the Cilium agent on {{ $labels.instance }} for 10m — the node's CNI may be down (the node will go NotReady).
              summary: Cilium agent unreachable
            expr: up{job="cilium-agent"} == 0
            for: 10m
            labels:
              severity: warning
          - alert: CiliumUnreachableNodes
            annotations:
              description: A Cilium agent ({{ $labels.instance }}) can't reach {{ $value }} other node(s) in the mesh for 10m — cross-node pod networking is degraded.
              summary: Cilium reports unreachable nodes
            expr: cilium_unreachable_nodes > 0
            for: 10m
            labels:
              severity: warning
  cilium-bgp:
    groups:
      - name: cilium-bgp
        rules:
          - alert: CiliumBGPAllSessionsDown
            annotations:
              description: 'Not one node is peering with OPNsense — all LoadBalancer VIPs (192.168.40.0/24: HA, Grafana, Prometheus, UniFi, Forgejo, ...) are no longer advertised and are unreachable from the LAN.'
              summary: No Cilium BGP sessions established
            expr: sum(cilium_bgp_control_plane_session_state == bool 1) == 0
            for: 5m
            labels:
              severity: critical
          - alert: CiliumBGPNodeSessionDown
            annotations:
              description: '{{ $labels.instance }} is not peering with {{ $labels.neighbor }} for 15m (state != established) — it advertises no VIPs (reduced redundancy/ECMP). A new node must be added to bgp_node_ips in ansible/group_vars/opnsense.yml + run opnsense-bgp.yml.'
              summary: Cilium BGP session down on a node
            expr: cilium_bgp_control_plane_session_state != 1
            for: 15m
            labels:
              severity: warning
  cnpg:
    groups:
      - name: cnpg
        rules:
          - alert: CNPGInstanceNotReady
            annotations:
              description: 'Postgres instance {{ $labels.pod }} ({{ $labels.namespace }}) has been NotReady for 10m — the CNPG cluster is degraded (often a replica that can''t rejoin and loops on pg_rewind; the primary may be serving alone). Recovery: delete the replica''s PVC+pod so CNPG re-clones from the primary.'
              summary: CloudNativePG instance {{ $labels.pod }} not ready
            expr: kube_pod_container_status_ready{namespace=~"forgejo|infisical|monitoring",container="postgres"} == 0
            for: 10m
            labels:
              severity: warning
          - alert: CNPGInstanceCrashLooping
            annotations:
              description: '{{ $labels.pod }} ({{ $labels.namespace }}) restarted >3 times in 15m — likely a replica stuck on pg_rewind (no common timeline ancestor). Re-clone it: delete the replica''s PVC + pod.'
              summary: CloudNativePG instance {{ $labels.pod }} crash-looping
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"forgejo|infisical|monitoring",container="postgres"}[15m]) > 3
            for: 0m
            labels:
              severity: warning
          - alert: CNPGReplicationLagHigh
            annotations:
              description: Streaming lag on {{ $labels.pod }} is {{ $value | humanizeDuration }} (>5m) for 5m — the standby is falling behind the primary.
              summary: CloudNativePG replication lag high
            expr: cnpg_pg_replication_lag > 300
            for: 5m
            labels:
              severity: warning
          - alert: CNPGInstanceExporterDown
            annotations:
              description: The CNPG collector on {{ $labels.pod }} can't reach Postgres for 5m — the instance is unhealthy or the exporter is failing.
              summary: CloudNativePG metrics collector down
            expr: cnpg_collector_up == 0
            for: 5m
            labels:
              severity: warning
  longhorn:
    groups:
      - name: longhorn
        rules:
          - alert: LonghornVolumeFaulted
            annotations:
              description: Volume {{ $labels.volume }} is faulted (no healthy replica) for 5m — data unavailable / at risk.
              summary: Longhorn volume faulted
            expr: max by (volume) (longhorn_volume_robustness) == 3
            for: 5m
            labels:
              severity: critical
          - alert: LonghornVolumeDegraded
            annotations:
              description: Volume {{ $labels.volume }} has been degraded (a replica missing/rebuilding) for 20m — running below the desired replica count.
              summary: Longhorn volume degraded
            expr: max by (volume) (longhorn_volume_robustness) == 2
            for: 20m
            labels:
              severity: warning
          - alert: LonghornNodeStorageLow
            annotations:
              description: '{{ $labels.node }} Longhorn storage is over 85% used for 30m — volumes may fail to schedule or rebuild.'
              summary: Longhorn node storage low
            expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 0.85
            for: 30m
            labels:
              severity: warning
  node-health:
    groups:
      - name: node-health
        rules:
          - alert: NodeRebooted
            annotations:
              description: '{{ $labels.instance }} booted {{ $value | humanizeDuration }} ago. Sentinel alert — kept after the 2026-06 metal-flapping investigation CLOSED (root cause: bad NIC cable + qemu-guest-agent hanging metal boots, docs/incidents/). An unexpected reboot here means power loss, a crash, or an operator power-cycle: check which, and correlate with the smart-plug power series (sensor.plug_*_power) before suspecting the node.'
              summary: Node {{ $labels.instance }} rebooted
            expr: (time() - node_boot_time_seconds) < 600
            for: 0m
            labels:
              severity: warning
          - alert: PodSigkilled
            annotations:
              description: 'Container {{ $labels.container }} restarted with exit 137 (SIGKILL). SYMPTOM ONLY — three unrelated causes share this exit code, so read the pod before assuming any. `kubectl -n {{ $labels.namespace }} get pod {{ $labels.pod }} -o json` → `.status.containerStatuses[].lastState.terminated.reason`, plus the QoS class and each container''s own memory limit. (1) `OOMKilled` = the container hit ITS OWN limit (raise it) — the common case, node memory can be perfectly healthy. (2) Kubelet node-pressure eviction of a BestEffort victim — the node is genuinely under Memory/DiskPressure. (3) The Talos OOMController (FU-155, docs/spikes/talos-psi-thresholds.md): a userspace killer that SIGKILLs the WHOLE pod cgroup atomically via cgroup.kill — every container dies at the same instant with `reason: "Error"` (never `OOMKilled`), preferentially targeting pods with NO memory limit (BestEffort 1.0, unlimited Burstable 0.5). In-cluster corroboration (an agent lane CAN establish this): `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}` shows the `SandboxChanged` event ("Pod sandbox changed, it will be killed and re-created") with the pod typically back Ready in ~10s and a climbing cumulative `restartCount`. Node-level confirmation — now PLATFORM-SHIPPED via Loki (homelab#541): every node''s kernel log flows in as `{container="kmsg-reader", node="<node>"}` (see argocd/resources/loki/kmsg-reader.yaml) — any session with LogQL access runs the query directly, no talosctl needed. The Talos OOMController''s own line (`OOM controller triggered`, FU-082''s confirmation string) appears in the kernel log because Talos redirects the std logger into /dev/kmsg, so the LogQL line `{container="kmsg-reader", node="<node>"} |~ "OOM controller"` confirms branch 3 the same way `talosctl dmesg | grep ''OOM controller''` used to. For the authoritative record (score, trigger context, victim cmdlines) `talosctl -n <node> get oomactions -o yaml` remains — OPERATOR / NODE-ACCESS ONLY.'
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} killed (exit 137)'
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_exitcode == 137
            for: 0m
            labels:
              severity: warning
          - alert: ContainerMemoryNearLimit
            annotations:
              description: Container {{ $labels.container }} has sat at {{ $value | humanizePercentage }} of its memory limit for 15m — self-cgroup-OOM risk. If it's a FU-112(b) Guaranteed platform daemon (cilium-agent / longhorn-manager / longhorn-driver), RAISE its limit in tofu/cilium.tf or tofu/longhorn.tf before it OOMs and takes networking/storage down on that node.
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} near its memory limit'
            expr: container_memory_working_set_bytes{namespace=~"kube-system|longhorn-system", container!="", container!="POD"} / on (namespace, pod, container) kube_pod_container_resource_limits{namespace=~"kube-system|longhorn-system", resource="memory"} > 0.85
            for: 15m
            labels:
              severity: warning
          # homelab#477: the stock NodeSystemSaturation (disabled above) re-added with the
          # ephemeral/kata pool excluded. The exclusion joins on the TAINT that defines the pool
          # (kube_node_spec_taint key=homelab.io/ephemeral) rather than the homelab.io/kata label:
          # kata and ephemeral are independent flags in machines/machines.yaml, and only the taint
          # is the pool's actual definition — a future ephemeral-but-not-kata node stays excluded,
          # a future kata-but-not-ephemeral node still alerts. Fails OPEN: if the taint metric goes
          # away the exclusion silently lifts and the rule reverts to the pre-#477 status quo
          # (ephemeral nodes page again), which is the safe direction (matches the repo's
          # "never let a join make us MISS a real spin" convention, pushgateway rule).
          - alert: NodeSystemSaturation
            annotations:
              description: 'System load per core at {{ $labels.instance }} has been above 2 for the last 15 minutes, currently {{ printf "%.2f" $value }} — the node may be unresponsive. The ephemeral/kata pool (nodes tainted homelab.io/ephemeral) is excluded from this alert by design; a page here means a NON-ephemeral node is saturated (homelab#477).'
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemsaturation
              summary: System saturated, load per core is very high.
            expr: |-
              (node_load1{job="node-exporter"} / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) > 2)
              unless on (instance) (
                node_uname_info
                and on (nodename) label_replace(kube_node_spec_taint{key="homelab.io/ephemeral", value="true", effect="NoSchedule"}, "nodename", "$1", "node", "(.+)")
              )
            for: 15m
            labels:
              severity: warning
  office-plants:
    groups:
      - name: office-plants
        rules:
          - alert: HomeAssistantScrapeDown
            annotations:
              description: No plant metrics for 10m — HA down or token invalid. Plants stop watering when HA is unreachable.
              summary: Prometheus can't scrape Home Assistant
            expr: up{job="home-assistant"} == 0
            for: 10m
            labels:
              severity: critical
          - alert: DropletOffline
            annotations:
              description: The Droplet ({{ $labels.entity }}) has been disconnected for 10m — no watering and no soil readings.
              summary: Droplet irrigation controller offline
            expr: homeassistant_binary_sensor_state{entity="binary_sensor.office_plants_irrigation_status"} == 0
            for: 10m
            labels:
              severity: critical
          - alert: SoilSensorSuspectZero
            annotations:
              description: '{{ $labels.friendly_name }} has read 0% for 2h — check the sensor wiring/calibration.'
              summary: Soil sensor stuck at 0%
            expr: homeassistant_sensor_voltage_percent{entity=~"sensor.office_plants_irrigation_soilm_sens_[1-4]"} == 0
            for: 2h
            labels:
              severity: warning
alertmanager:
  config:
    receivers:
      - name: "null"
      - name: agent-responder
        webhook_configs:
          - send_resolved: true
            url: http://agent-loop-eventsource-svc.agent-coordinator.svc.cluster.local:12000/alert
      - name: ha-webhook
        webhook_configs:
          - send_resolved: true
            url: http://192.168.40.10:8123/api/webhook/prometheus-alerts
    route:
      group_by:
        - alertname
      group_interval: 5m
      group_wait: 30s
      receiver: ha-webhook
      repeat_interval: 3h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
        # FU-133 leg (a) — the responder's correlation key is PINNED here, not inherited.
        # Grouping by alertname is what makes one root cause one DELIVERY: the group is the unit
        # Alertmanager POSTs, so a same-name storm arrives as a single webhook carrying N alerts
        # instead of N webhooks. That is already the effective behaviour — an Alertmanager child
        # route inherits group_by from its parent and the root route above groups by alertname —
        # so this line changes nothing today, and exists so it cannot change silently: the root
        # route's grouping is tuned for ha-webhook, a HUMAN notification surface, and widening it
        # there (adding `namespace`) or setting the `['...']` no-grouping value would re-fan-out
        # the responder without touching anything that names the responder.
        # ⚠ Do NOT read this as the issue-dedup: the collapse to one ISSUE does not happen here.
        # The respond workflow walks every firing alert in the group and dedups per alert on the
        # 24h fingerprint + subject ledgers (agents/coordinator/responder-argo.yaml), which is
        # deliberate — distinct subjects that share an alertname (three degraded Longhorn volumes)
        # are distinct problems and must keep their own issues. Grouping reduces deliveries and
        # workflow spawns; the ledgers reduce sessions and issues.
        - continue: true
          group_by:
            - alertname
          receiver: agent-responder
        - receiver: ha-webhook
  service:
    annotations:
      lbipam.cilium.io/ips: 192.168.40.14
    labels:
      bgp: advertise
    type: LoadBalancer
grafana:
  additionalDataSources:
    - access: proxy
      editable: false
      isDefault: false
      jsonData:
        path: /data/sleep.sqlite
      name: sleep-data
      type: frser-sqlite-datasource
      uid: sleep-data
  admin:
    existingSecret: grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  # Grafana's DB on CNPG Postgres (argocd/resources/postgres/grafana-pg.yaml) instead of the
  # default sqlite-on-emptyDir — the sqlite file sat on the hosting node's ROOT disk and its
  # fsync-under-lock pattern produced the 2026-08-25/26 SQLITE_BUSY storms whenever that disk
  # was busy (hp-01: 175ms avg writes under the agent burst). GF_DATABASE_* env wins over
  # grafana.ini. sslmode=require: CNPG serves TLS with its own CA; require encrypts without
  # CA verification, which is the right dial for an in-cluster ClusterIP hop.
  env:
    GF_DATABASE_TYPE: postgres
    GF_DATABASE_HOST: grafana-pg-rw.monitoring.svc:5432
    GF_DATABASE_NAME: grafana
    GF_DATABASE_SSL_MODE: require
  envValueFrom:
    GF_DATABASE_USER:
      secretKeyRef: { name: grafana-pg-app, key: username }
    GF_DATABASE_PASSWORD:
      secretKeyRef: { name: grafana-pg-app, key: password }
  extraContainers: |
    - name: sleep-sqlite-sync
      image: amazon/aws-cli:2.17.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          aws configure set default.s3.addressing_style path
          while true; do
            aws --endpoint-url "$S3_ENDPOINT" s3 cp "s3://sleep-db/sleep.sqlite" /data/sleep.sqlite || true
            sleep 600
          done
      env:
        - { name: S3_ENDPOINT, value: "https://s3.teststuff.net" }
        - { name: AWS_DEFAULT_REGION, value: "garage" }
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: sleep-db-reader, key: STORE_S3_ACCESS_KEY_ID } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: sleep-db-reader, key: STORE_S3_SECRET_KEY } }
      volumeMounts:
        - { name: sleep-data, mountPath: /data }
      resources:
        requests: { cpu: 10m, memory: 64Mi }
  extraEmptyDirMounts:
    - mountPath: /data
      name: sleep-data
  grafana.ini:
    server:
      root_url: https://grafana.teststuff.net
  persistence:
    enabled: false
  plugins:
    # Pinned (FU-173): unpinned fetches the LATEST release per pod start — prod could drift
    # from the 4.0.6 sleep integration gate with no commit anywhere. Renovate owns the bump.
    # ⚠ Grafana's background installer parses `id@version`; the docs' legacy `id version`
    # space form SPLITS here — "4.0.6" was installed as its own pluginId, 404'd, and
    # crashlooped the pod (2026-08-25 20:11Z, 4 restarts before the fix).
    - frser-sqlite-datasource@4.0.6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    annotations:
      lbipam.cilium.io/ips: 192.168.40.11
    labels:
      bgp: advertise
    port: 80
    type: LoadBalancer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
      # Per-stack Grafana folders (docs/patterns/observability.md, oracle handoff 2026-09-01):
      # a dashboard ConfigMap annotated `grafana_folder: <stack>` lands in that folder; an
      # un-annotated one keeps landing in General, so every existing CM is unaffected.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
kube-state-metrics:
  resources:
    limits:
      memory: 192Mi
    requests:
      cpu: 20m
      memory: 64Mi
kubeControllerManager:
  endpoints:
    - 192.168.2.51
kubeProxy:
  enabled: false
kubeScheduler:
  endpoints:
    - 192.168.2.51
prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - authorization:
          credentials_file: /etc/prometheus/secrets/ha-token/token
          type: Bearer
        job_name: home-assistant
        metrics_path: /api/prometheus
        scheme: http
        scrape_interval: 60s
        static_configs:
          - targets:
              - 192.168.40.10:8123
    initContainers:
      - command:
          - sh
          - -c
          - chown -R 1000:2000 /prometheus
        image: busybox:1.37
        name: chown-data
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
          - mountPath: /prometheus
            name: prometheus-kube-prometheus-stack-prometheus-db
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    replicas: 1
    resources:
      limits:
        memory: 8Gi
      requests:
        cpu: 300m
        memory: 1200Mi
    retention: 90d
    retentionSize: 16GB
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 60s
    secrets:
      - ha-token
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
  service:
    annotations:
      lbipam.cilium.io/ips: 192.168.40.13
    labels:
      bgp: advertise
    type: LoadBalancer
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
prometheusOperator:
  prometheusConfigReloader:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
