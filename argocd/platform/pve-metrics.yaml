# The pve thin-pool meter's cluster half (FU-093): a static ScrapeConfig for the node_exporter that
# ansible/pve-node-exporter.yml puts on the hypervisor, plus the alert belt on the pool level, the
# guests' qmpstatus and the meter's own liveness. Raw manifests in argocd/resources/pve-metrics/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pve-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/pve-metrics
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
