# Platform-precreated namespaces for the sleep tenant (FU-025, docs/sleep-iac.md). homelab owns
# namespace lifecycle; the `sleep` AppProject only *allowlists* these as destinations, and the child
# apps run CreateNamespace=false. Precreating them (a) lets us drop `Namespace` from the project's
# clusterResourceWhitelist — the tenant can't spawn arbitrary namespaces — and (b) means a first
# sync never fails on a missing ns. Both namespaces already exist live (created imperatively by the
# old child apps' CreateNamespace=true); ArgoCD adopts them in place via SSA — no recreate.
apiVersion: v1
kind: Namespace
metadata:
  name: sleep-tracking
  labels:
    # AgentStack fixer.docker=true (sleep-iac#19, 2026-07-25 — capability parity with oracle for
    # the coming k3d/Grafana evidence gate): dind rides run privileged only INSIDE the kata
    # microVM; the kata runtimeClass is PSS-exempt via apiserver admission config (FU-077),
    # namespace stays baseline; a privileged RUNC pod is still rejected. Mirrors
    # oracle-namespaces.yaml — posture pinned explicitly so it is visible in git.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the sleep child apps deploy into it
---
apiVersion: v1
kind: Namespace
metadata:
  name: snore-recorder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# FU-106 (2026-07-27): the sleep-iac FIXER namespace — fixer ns == repo by platform convention;
# the AgentStack Composition renders worker infra into it (SA/keys/CNP) once the claim carries a
# fixer block. Platform-precreated like its siblings (the tenant deliberately cannot create
# namespaces). docker=false ⇒ plain runc rides ⇒ baseline enforce is right.
apiVersion: v1
kind: Namespace
metadata:
  name: sleep-iac
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
