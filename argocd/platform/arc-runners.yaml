# The runner scale set — ephemeral GitHub Actions runners registered org-wide on teststuffstash.
# Workflows target them with `runs-on: homelab-ephemeral`. One warm runner (minRunners 1, settled
# 2026-08-30 — see the readout at the field below); each job's pod is ephemeral: it runs, then it's
# torn down and a fresh one pre-warms. Pinned to the ephemeral laptop tier so CI
# noise/privilege stays off the service nodes (same tier as the Forgejo runner).
#
# Wave 5 — after github-runner-secrets (wave 4) creates the arc-runners ns + the arc-github-app
# Secret (ESO). Version MUST match arc-controller.yaml.
#
# containerMode: dind → jobs get a Docker daemon (Talos has no host docker socket); the chart adds
# a privileged dind sidecar, hence the ns PodSecurity=privileged label. NOTE: this runner is
# linux/amd64 — it can build the (amd64) sleep-ingester image, but NOT snore-recorder's arm64 image
# (the Talos kernel has no binfmt_misc); that one still builds off-cluster. See docs/ci.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2 # keep in lockstep with arc-controller.yaml
    helm:
      valuesObject:
        githubConfigUrl: https://github.com/teststuffstash
        githubConfigSecret: arc-github-app
        # Point the scale set at the controller's SA explicitly. The chart otherwise tries to
        # DISCOVER it by label at template time — which fails under ArgoCD's `helm template`
        # (no cluster lookup): "No gha-rs-controller deployment found using label
        # app.kubernetes.io/part-of=gha-rs-controller". Must match arc-controller (arc-systems).
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller-gha-rs-controller
        runnerScaleSetName: homelab-ephemeral
        # minRunners 1 SETTLED (trial 2026-08-18 → readout 2026-08-30, ci.yaml job pickup latency,
        # created_at→started_at, n=40 per window): 0 → median 22s / mean 99s / p90 300s / max 648s;
        # 1 → median 3s / p90 3s / max 7s. The warm runner deletes the cold-start tail (pod spin-up
        # + registration, minutes at p90) for ~2.5Gi resident on the ephemeral tier. Revisit only
        # if the tier needs the RAM back.
        minRunners: 1
        # 2 ephemeral nodes (wk-metal-01/-02, ~4 CPU + 7 GB each). Since 2026-08-11 runner pods carry
        # memory REQUESTS (~2.5Gi/pod incl. dind) + a soft hostname spread (see the template comment), so
        # packing is honest and ~2 land per node — but THIS cap remains the concurrency contract
        # (≈2 dind runners per metal node). Watch memory on the old ThinkPads under concurrent heavy
        # builds; go higher only by ADDING ephemeral capacity (another quiet node, or a Proxmox VM
        # runner à la ADR-082), not by overpacking these two.
        maxRunners: 4
        # NO containerMode: the spec below is the chart's own dind template (rendered at 0.14.2 and
        # transcribed), owned here because dind customization requires it (the chart APPENDS user
        # initContainers — a name-merge dupes the dind container; render-verified). We own it to:
        #   - FU-015: run the custom runner image (docker/arc-runner/ — nix/devbox/gh + warm store
        #     + LAN nix substituter) instead of unpinned stock :latest (bump the tag per build);
        #   - FU-073(c): dockerd --registry-mirror → the in-cluster docker.io pull-through mirror
        #     (BGP VIP, ADR-091; Hub-only by dockerd design, plain http hence insecure-registry);
        #   - pin docker:dind (was :latest-floating via the chart).
        # On chart upgrades: re-render with containerMode dind and diff against this spec.
        template:
          spec:
            # ndots:1 — runner jobs talk almost exclusively to EXTERNAL FQDNs; the stock
            # ClusterFirst ndots:5 expanded every such name through 3 search domains first
            # (measured fleet-wide 2026-08-18: 1.09M NXDOMAIN vs 448k NOERROR in 24h), 4x-ing
            # both DNS latency and the exposure window to upstream flaps (#518's Set-up-job
            # retry landed in the day's single SERVFAIL burst, 08:00-09:00Z). In-cluster
            # service lookups from CI are rare-to-none; anything that needs one can use the
            # FQDN. Evidence + diagnosis: #518 thread.
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
            nodeSelector:
              homelab.io/ephemeral: "true"
            tolerations:
              - key: homelab.io/ephemeral
                operator: Exists
            # Soft spread across the two ephemeral nodes + a real memory request (2026-08-11
            # incident: all 4 runners binpacked onto wk-metal-02 while its WAN was dead — 100% of
            # CI on one node's failure). Requests-not-limits by intent: a runner's true footprint
            # depends on which job lands (lint vs cold nix build vs dind), so requests state the
            # ~2-per-node envelope for honest packing and the spread halves the blast radius;
            # BestEffort→Burstable also keeps runners first-kill under node pressure, which is
            # correct for retryable CI. maxRunners stays the concurrency contract.
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    actions.github.com/scale-set-name: homelab-ephemeral
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/teststuffstash/homelab/arc-runner:2026.8.31-g1b9c540216f8
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker:29.6.2-dind
                resources:
                  requests:
                    memory: 1Gi
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                  - --registry-mirror=http://192.168.40.20
                  - --insecure-registry=192.168.40.20
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: [docker, info]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: ghcr.io/teststuffstash/homelab/arc-runner:2026.8.31-g1b9c540216f8
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    memory: 1536Mi
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
