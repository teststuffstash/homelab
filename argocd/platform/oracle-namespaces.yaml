# Platform-precreated namespace for the oracle tenant (docs/oracle-iac.md; pattern from
# sleep-namespaces.yaml). homelab owns namespace lifecycle; the `oracle` AppProject only
# *allowlists* it as a destination, and the child apps run CreateNamespace=false — the tenant
# cannot spawn arbitrary namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: oracle-fleet
  labels:
    # AgentStack fixer.docker=true workers run a privileged dind sidecar — privileged only
    # INSIDE the kata microVM (root in the guest, not the node). PodSecurity can't see runtime
    # classes, so the apiserver admission config exempts the kata runtimeClass (FU-077,
    # tofu/talos.tf) — kata pods bypass PSS surgically and the namespace stays at the
    # cluster-default baseline; a privileged RUNC pod here is still rejected (tested live
    # 2026-07-16). Labels pinned explicitly so the posture is visible in git.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the oracle child apps deploy into it
---
# FU-106 twin (2026-08-02, operator directive "steady-state -iac work is the stack's lane"): the
# oracle-iac FIXER namespace — fixer ns == repo by platform convention; the AgentStack Composition
# renders worker infra into it once the claim carries a fixer block (mirrors sleep-iac in
# sleep-namespaces.yaml). docker=false ⇒ plain runc rides ⇒ baseline enforce is right.
apiVersion: v1
kind: Namespace
metadata:
  name: oracle-iac
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# The Kargo PROJECT namespace for oracle (argocd/platform/kargo.yaml).
# Platform-precreated like the rest, with the Kargo project label already set: Kargo's Project
# webhook accepts an existing namespace only when it carries `kargo.akuity.io/project: "true"`,
# and the kargo SAs hold no namespace-create grant (argocd/resources/kargo/) — so the platform,
# not Kargo, owns this namespace's lifecycle. Holds the Project's Warehouses/Stages/Freight, the
# AnalysisTemplates, and the namespaced Argo Rollouts controller (argo-rollouts.yaml) whose
# analysis Jobs run here — baseline enforce suits plain runc Jobs.
apiVersion: v1
kind: Namespace
metadata:
  name: oracle-kargo
  labels:
    kargo.akuity.io/project: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
