# Logging stack — raw resources (wave 6, after Crossplane providers are Installed+Healthy):
# the Garage Workspace that provisions Loki's S3 bucket+key, and (added next) the Grafana Loki
# datasource configmap. The Loki + Alloy Helm charts are separate Applications (loki.yaml, alloy.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/loki
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # homelab#541: the kmsg-reader DaemonSet needs CAP_SYSLOG to open /dev/kmsg — baseline PSS
    # (Talos cluster default) rejects that, so the loki namespace opts up to privileged. Done via
    # managedNamespaceMetadata (NOT a Namespace manifest) so the IAC-G04 no-cluster-scoped sentinel
    # stays satisfied — the Namespace is created by CreateNamespace=true and ArgoCD labels it here.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
