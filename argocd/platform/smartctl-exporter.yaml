# Disk health for every Talos node (FU-284) — a privileged DaemonSet running the upstream
# smartctl_exporter, plus the belts over it. The hypervisors' half is NOT here: pve and nx-02 are
# not Kubernetes nodes, so they get the same metrics from their node_exporter textfile collector
# (ansible/roles/pve-node-exporter). One PrometheusRule group covers both.
# Raw manifests in argocd/resources/smartctl-exporter/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/smartctl-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: disk-health
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=false     # namespace.yaml owns it — it carries the privileged PSA labels
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
