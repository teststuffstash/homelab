# Garage client-perspective write probe (homelab#1560, FU-093) — signed PUT→GET→DELETE CronJob
# that detects write-path failures the server-side metrics miss (the 2026-09-08 class).
# Raw manifests in argocd/resources/garage-write-probe/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-write-probe
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/teststuffstash/homelab.git
    targetRevision: master
    path: argocd/resources/garage-write-probe
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
