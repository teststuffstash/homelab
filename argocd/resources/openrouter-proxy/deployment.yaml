# The proxy pod. Stock python image + the script from the generated ConfigMap — no custom image
# pipeline (github-exporter pattern). Holds NO secrets in v1: the workers' Authorization header
# passes through unread (credential injection is the remaining ADR-081 leg, homelab FU-018).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-proxy
  labels:
    app: openrouter-proxy
spec:
  replicas: 1
  # ADR-096: the router store PVC is RWO — RollingUpdate would deadlock on the volume attach.
  # Cost: ~10-20s data-plane blackout per script roll; launchers fail-open/retry by design.
  # rollingUpdate: null is LOAD-BEARING under ServerSideApply: the live object carries defaulted
  # rollingUpdate fields, and switching type without clearing them is rejected as invalid.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: openrouter-proxy
  template:
    metadata:
      labels:
        app: openrouter-proxy
    spec:
      # ADR-087: the SA whose per-namespace Roles let _resolve_ref read labeled session keys.
      serviceAccountName: openrouter-proxy
      securityContext:
        fsGroup: 65534 # the PVC must be writable by the nobody uid the container runs as
      containers:
        - name: proxy
          image: python:3.13-slim
          command: ["python3", "/app/openrouter-proxy.py"]
          env:
            # FU-088 per-window thresholds (operator direction 2026-07-28): 5h stays at the base
            # 0.80 (finish-in-progress guard — deny spawns that can't complete before the short
            # window flips); 7d is the operator's personal weekly headroom preference. Base
            # default (ANTHROPIC_UTIL_THRESHOLD, unset here) = 0.80 governs 5h.
            # 0.95 restored 2026-08-13 (the same ruling's second half): the latch sat at 1.0 for
            # one day while the Go-rail failover was built — with reviewer-session.sh now failing
            # over to opencode-go/kimi-k3 when this latch fires (#424, PR#435) and the Go rail
            # live end-to-end (PR#433/#434/#436, seat-probed: real completion + metered ledger
            # row), a latched week degrades to the second subscription instead of deferring.
            - name: ANTHROPIC_UTIL_THRESHOLD_7D
              value: "0.95"
            # FU-088 concurrency semaphore, EXPLICIT since 2026-08-08 (was the code default 3):
            # operator upgraded the subscription Max 5x → Max 20x and raised this to 5. The
            # utilization thresholds above need NO recalibration — they read Anthropic's own
            # per-plan fraction headers. Keep in step with the subscription-capacity ConfigMap
            # (agents/coordinator/reflexes-argo.yaml) and agents/subscription-latch.sh's default.
            - name: SUBSCRIPTION_MAX_RUNNING
              value: "5"
            # FU-170 (a): the Go-rail concurrency bound, EXPLICIT like the anthropic one above
            # (code default 3). 5 per operator direction 2026-08-17: the workers are cheaper,
            # but the Go subscription's absolute pool is far smaller (€10/mo vs €220/mo Max
            # 20x) — the window utilization gates are what protect the budget; this bounds
            # burst/concurrency only.
            - name: OPENCODE_MAX_RUNNING
              value: "5"
            # FU-089 finale (2026-07-26): /git-token refuses unauthenticated callers. Flipped
            # after live evidence — a full ride lifecycle (issue-135 r1 redispatch) fetched
            # with the agentstack-worker SA bearer, TokenReview-verified. Set "0" only for a
            # rollback window.
            - name: GIT_TOKEN_REQUIRE_AUTH
              value: "1"
            # ADR-096: the router store (sqlite, WAL). Unset/unwritable ⇒ :memory: degrade —
            # never a hard dependency for the data plane.
            - name: ROUTER_DB
              value: /data/router.db
            # ADR-096 P2: the router's own account-state credential (openrouterkey.yaml),
            # resolved through the same labeled-secret ref rail as session keys.
            - name: ROUTER_ACCOUNT_REF
              value: agent-egress/router-account-key
            # homelab#180: the capacity latch's `credit` leg reads the openrouter-operator's
            # account-credit gauge over in-cluster service DNS — that operator owns the
            # provisioning key this proxy is deliberately NOT given. Set explicitly (not left to
            # the code default) so the cross-namespace dependency is visible in the manifest;
            # set it to "" to retire the leg.
            - name: CREDIT_METRICS_URL
              value: http://openrouter-operator-metrics.openrouter-operator.svc.cluster.local:9090/metrics
            # FU-213 (operator, 2026-09-04): opencode.ai is PARKED. OpenCode mailed that this
            # proxy's client (User-Agent homelab-openrouter-proxy) sends no `x-opencode-session`
            # header and "may error" from 2026-09-06; both legs park until that is settled, since
            # they share the account, the key and the UA. "1"/"all" = both, "go"/"zen" = one leg,
            # "0" = live. While set, /opencode-limit serves limited=true reason="rail-disabled"
            # (so --pick-rail skips Go and the worker gate degrades to the subscription fallback)
            # and both legs refuse 503 without calling out. RE-ENABLE by setting "0" — the rail's
            # posture (janitorial/failover) is unchanged, this is a vendor-side pause.
            - name: OPENCODE_RAIL_DISABLED
              value: "1"
            # ADR-107 chunk C (homelab#423): the OpenCode Go API key, consumed by the Go leg
            # (PR#429). optional: true — the pod must keep serving the Anthropic/OpenRouter legs
            # even if ESO hasn't materialized the Secret; the code fails closed per-request.
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-go-key
                  key: api-key
                  optional: true
            # ADR-108: the Go usage ingest token — gates POST /go-usage-report on port 8081.
            # optional: true — the pod serves the data plane even before the seat writes the
            # Infisical value; ingest 503s until then (fail closed: no token = no ingest).
            - name: GO_USAGE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencode-ingest-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
            - name: ingest
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: openrouter-proxy-script # kustomize rewrites to the hashed name
        - name: data
          persistentVolumeClaim:
            claimName: openrouter-proxy-data
