# FU-088 alerting: the latch/threshold state that defers agent dispatch should never sit
# unnoticed (the 2026-07-12 and 2026-07-17 429 incidents were both discovered by a human reading
# pod output). Alertmanager routes to the Home Assistant webhook (tofu/monitoring.tf).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openrouter-proxy
  labels:
    app: openrouter-proxy
spec:
  groups:
    - name: claude-subscription
      rules:
        # Dispatch has been deferring (429 latch or ≥threshold utilization) for 15m — batch
        # work is parked; decide whether to wait out the window or pause interactive use.
        - alert: SubscriptionDispatchLimited
          expr: anthropic_subscription_dispatch_limited == 1
          for: 15m
          labels:
            severity: warning
            # Self-describing capacity state: it self-resolves when the window drops, the
            # deferral IS the correct behavior, and triaging it would defer on the same latch
            # (circular). The responder skips triage:none deterministically.
            triage: none
          annotations:
            summary: "Claude subscription dispatch is deferred"
            description: 'Agent dispatch (reviewers/coordinator/claude-tier workers) has been deferring for 15m — 5h utilization {{ with query "anthropic_subscription_utilization{window=''5h''}" }}{{ . | first | value | humanizePercentage }}{{ end }}, 7d {{ with query "anthropic_subscription_utilization{window=''7d''}" }}{{ . | first | value | humanizePercentage }}{{ end }}. Probe: GET openrouter-proxy.agent-egress:8080/anthropic-limit.'

        # The WEEKLY pool is the scarce one (5h refills fast): >90% with >1 day to the reset
        # means the rest of the week runs on fumes even though 5h windows keep clearing.
        - alert: SubscriptionWeeklyPoolLow
          expr: >-
            anthropic_subscription_utilization{window="7d"} > 0.9
            and (anthropic_subscription_reset_timestamp_seconds{window="7d"} - time()) > 86400
          for: 30m
          labels:
            severity: warning
            triage: none # same class: a capacity fact the operator reads on Grafana, not a triage target
          annotations:
            summary: "Claude subscription weekly pool above 90%"
            description: '7d utilization is {{ $value | humanizePercentage }} with more than a day until the weekly reset — batch agent work will starve; consider suspending non-critical reflexes.'

    - name: agent-router
      rules:
        # ADR-096: the router store degraded to :memory: — decisions/strikes/costs are being
        # forgotten on every roll. Real fault (PVC/Longhorn), triage-able.
        - alert: RouterDbEphemeral
          expr: router_db_persistent == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Router store is running ephemeral (:memory:)"
            description: 'The openrouter-proxy router store failed to open its PVC and degraded to :memory: — strikes, provider events, generation costs and the persisted 429 latch are lost on every restart. Check the openrouter-proxy-data PVC / Longhorn volume in ns agent-egress.'

        # ADR-096 addendum 2: the MCP daily-rankings feed stopped landing. The git-curated
        # rotation_fallback belt still routes, but the "what's currently good" signal is stale.
        - alert: RouterRotationStale
          expr: router_rotation_age_seconds{source="openrouter-daily-rankings"} > 259200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "OpenRouter rankings rotation feed is stale (>3d)"
            description: 'The dailyish list-daily-model-rankings pull has not written rotation entries for {{ $value | humanizeDuration }} — check proxy logs for MCP/Cloudflare failures (the UA gotcha) and the router-account-key Secret.'

        # ADR-096 P2: a standing project key is close to its OpenRouter spend limit — worker
        # dispatch on that rail will start failing with 402s when it empties.
        - alert: OpenRouterKeyBudgetLow
          expr: >-
            router_openrouter_key_limit_remaining_usd / on(key) router_openrouter_key_limit_usd < 0.10
          for: 30m
          labels:
            severity: warning
            triage: none # capacity fact — topping up/raising the key limit is an operator move
          annotations:
            summary: "OpenRouter key {{ $labels.key }} below 10% of its spend limit"
            description: 'Standing key {{ $labels.key }} has {{ with query (printf "router_openrouter_key_limit_remaining_usd{key=''%s''}" $labels.key) }}{{ . | first | value | humanize }}{{ end }} USD left under its limit — OpenRouter-rail dispatch for that project will die on 402s when it empties.'

        # homelab#158/#163: the ACCOUNT-scope capacity latch (credit floor / hard-402 / 429s from
        # ≥2 distinct models) has held continuously for 30m — this is the whole OpenRouter leg,
        # not one model, so it is fleet-wide. `for: 30m` is the judgment call and is set from the
        # latch's own arithmetic: a single engagement holds OR_CAPACITY_HOLD_S=900s (the credit
        # leg HEADROOM_POLL_S+120=1020s) and then self-expires, so one blip — including its full
        # post-recovery tail on an idle fleet — cannot reach 30m. Staying latched that long means
        # the latch was RE-engaged mid-window, i.e. the condition is persisting. A proxy roll
        # forgets the in-memory latch, so a roll reads 0 and can never itself page; the cost is
        # the reverse ~30m re-arm blank after a roll during an ongoing outage (the known class
        # the #162 review flagged), which the multi-hour 2026-08-08 outage this alert exists for
        # still clears comfortably. Same window as the two capacity facts above.
        - alert: OpenRouterCapacityDown
          expr: router_openrouter_capacity_down == 1
          for: 30m
          labels:
            severity: warning
            triage: none # capacity fact — the degrade IS the correct behavior, and a triage ride would defer on this same latch
          annotations:
            summary: "OpenRouter account is capacity-down"
            description: 'OpenRouter account-scope capacity has been latched for 30m — worker dispatch is degrading to the haiku subscription rail or deferring the OpenRouter rail. Probe: GET openrouter-proxy.agent-egress:8080/router-status → .openrouter_capacity (reason / remaining_s / recent_429_models) names which leg latched. The credit leg reads the openrouter-operator''s openrouter_account_credit_usd gauge (openrouter-operator-metrics.openrouter-operator:9090), NOT OpenRouter directly — .credit_poll_failures climbing there, or router_openrouter_credit_poll_failures_total here, means that leg is blind and only the data-plane legs (hard-402 / cross-model 429s) can still fire (homelab#180).'
