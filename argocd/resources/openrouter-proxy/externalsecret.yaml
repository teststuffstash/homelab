# ADR-107 chunk C (homelab#423): ExternalSecret for the OpenCode Go API key.
# Consumed by the Go leg in openrouter-proxy.py (PR#429).
# Without this secret the Go leg fails closed (502) — the pod itself keeps serving
# the Anthropic/OpenRouter legs via optional: true on the env injection.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-go-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: opencode-go-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: OPENCODE_GO_API_KEY
