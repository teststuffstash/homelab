# The hypervisor thin-pool belt (FU-093). Four fills (2026-08-07, 08-18, 08-24, 09-03) and not one
# alert, because nothing could see the pool; at 100 % every VM on it pauses on io-error together,
# control plane included (docs/incidents/2026-09-03-pve-thin-pool-fourth-fill-prepull.md). The
# series come from each hypervisor's own node_exporter textfile (ansible/roles/pve-node-exporter/
# files/pve-textfile-metrics.sh), scraped as job="pve-node" (scrapecfg beside this file).
#
# TWO hypervisors since 2026-09-15 (`host="pve"`, `host="nx-02"`), so every rule below is written
# per SERIES and names `{{ $labels.host }}` — the box-specific facts that used to sit in the prose
# (which VMs, which VG, how much free) are labels or a probe now, because a description that says
# "pve" while nx-02's pool is the one filling sends the reader to the wrong box.
#
# Thresholds. The VG has ~28 MB free, so thin_pool_autoextend cannot save the pool — the human is
# the autoextend, and needs the warning while the fstrim CronJobs (argocd/resources/node-fstrim/)
# can still return blocks: 80 % warns (the runner-image-prepull gate already refuses pulls onto
# pool VMs from 75 %), 90 % is critical (a single 4.9 GiB pull ate the last ~5 % on 09-03).
# The io-error rule is the direct detector of the incident's signature — a guest paused on a failed
# write while `qm list` still says running.
#
# Shared-fate caveat, recorded: the control plane sits on this pool, so at 100 % Prometheus and
# Alertmanager are down with it. The belt is for the approach, not the arrival — which is why the
# warning threshold is the load-bearing one.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pve-metrics
  namespace: monitoring
  labels:
    app: pve-metrics
spec:
  groups:
    - name: node-reboots
      # A box that reboots ITSELF, seen from its own node_exporter (node_boot_time_seconds moves).
      # NodeRebooted (kube-prometheus-stack values, node-health) fires on every boot and cannot
      # tell a planned seat window (scripts/node-maintenance.sh — one boot, silenced) from a VM
      # rebooting on its own: on 2026-09-12 both landed on collapsed subject threads within one
      # hour (#261, #882). These two count boots per node instead. Replay at the event
      # (#882, wk-03 = 192.168.2.63): boots 09-10 09:39Z + 18:58Z, 09-11 18:53Z, 09-12 13:44Z,
      # 09-13 21:15Z → `changes(...[24h])` = 2 on 09-10 and 09-11 (fires), 1 on the other days
      # (quiet); `changes(...[7d])` = 5 today (fires). A DaemonSet node_exporter keeps its pod
      # name across a node reboot, so one series carries the boots; the sum by (instance)
      # absorbs a re-created pod. No `for:`: changes() over a window is not a blip.
      rules:
        - alert: NodeRebootedTwiceIn24h
          expr: sum by (instance) (changes(node_boot_time_seconds{job="node-exporter"}[24h])) >= 2
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} booted {{ $value }} times in 24 h — a box rebooting itself"
            description: >-
              Two or more boots of the same node inside 24 h — a SYMPTOM, not a diagnosis. A planned
              maintenance window is one boot (scripts/node-maintenance.sh). What to check, in order:
              the exact boot times (`node_boot_time_seconds{instance="{{ $labels.instance }}"}[24h]`),
              then load / CPU steal / MemAvailable / filesystem free in the 30 min before each
              (`node_load1`, `node_cpu_seconds_total{mode="steal"}`, `node_memory_MemAvailable_bytes`,
              `node_filesystem_avail_bytes`), the hypervisor's task log and journal for the VM if it
              is one (`qm list`, `journalctl` on pve), and the kmsg-reader's previous-container tail
              on the node. If a serial console log exists for the VM, read it first. Thread: #882.
        - alert: NodeRebootingRepeatedly
          expr: sum by (instance) (changes(node_boot_time_seconds{job="node-exporter"}[7d])) >= 3
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} booted {{ $value }} times in 7 d"
            description: >-
              Three or more boots of the same node in 7 d — the slow-cadence twin of
              NodeRebootedTwiceIn24h (one self-reboot a day never trips the 24 h rule). Same read:
              boot times from `node_boot_time_seconds`, the resource series before each boot, the
              hypervisor's log, the kmsg-reader tail, and a serial console log if one exists.
    - name: pve-thin-pool
      rules:
        - alert: PveThinPoolFillingUp
          expr: pve_lvm_thin_pool_data_percent > 80
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.1f\" }}%"
            description: >-
              An LVM thin pool carrying Talos VMs is above 80%. Check the VG's free extents first
              (`pve_lvm_vg_free_bytes{host="{{ $labels.host }}",vg="{{ $labels.vg }}"}`): pve's are
              ~0, so autoextend cannot act there and the human IS the autoextend. At 100% every VM
              on the pool pauses on io-error together — on pve that includes the control plane.
              Return blocks now: trigger the fstrim CronJobs (`kubectl -n node-maintenance create
              job --from=cronjob/<node> ...`), then read `lvs -o lv_name,data_percent
              {{ $labels.vg }}` on {{ $labels.host }}. Recipe: docs/runbook.md §"Reclaiming
              thin-pool space from a Talos VM".
        - alert: PveThinPoolAlmostFull
          expr: pve_lvm_thin_pool_data_percent > 90
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.host }} thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.1f\" }}% — VMs pause at 100%"
            description: >-
              Under 10% headroom on a pool carrying Talos VMs — on pve that pool carries the control
              plane. One image pull or one Longhorn rebuild finishes it. Act on {{ $labels.host }}
              directly: fstrim the guests (runbook recipe), or destroy a sacrificial guest
              (`qm destroy 9001` freed 26 points on 2026-09-03). If VMs are already paused:
              `qm status <vmid> --verbose | grep qmpstatus`, free space, then `qm resume <vmid>`.
        - alert: PveThinPoolMetadataHigh
          expr: pve_lvm_thin_pool_metadata_percent > 80
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} thin pool {{ $labels.vg }}/{{ $labels.lv }} metadata at {{ $value | printf \"%.1f\" }}%"
            description: >-
              Thin-pool METADATA is filling — a different exhaustion from data%, with the same
              outcome (pool switches to read-only). Grow it on {{ $labels.host }}: `lvextend
              --poolmetadatasize +1G {{ $labels.vg }}/{{ $labels.lv }}` needs free VG extents, which
              pve's VG does not have; plan the fix, do not wait for 100%.
        - alert: PveVmIoError
          expr: pve_qemu_status{qmpstatus="io-error"} == 1
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.host }} guest {{ $labels.name }} (vmid {{ $labels.vmid }}) is paused on io-error"
            description: >-
              The guest hit a failed write and QEMU paused it — the 2026-09-03 signature (thin pool
              at 100%). `qm list` still says running; the Talos API is "no route to host". On
              {{ $labels.host }}: `lvs -o lv_name,data_percent`, free pool space, then
              `qm resume {{ $labels.vmid }}`.
        - alert: PveHostMemoryLow
          expr: node_memory_MemAvailable_bytes{job="pve-node"} < 3 * 1024 * 1024 * 1024
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} memory available {{ $value | humanize1024 }}B — below 3GiB"
            description: >-
              A hypervisor is close to committing more VM RAM than it has. pve is the known case
              (65GB of allocations on 62.7GiB since 2026-09-08, FU-225, living on KSM ~11GB shared);
              Talos guests have no virtio_balloon, so when KSM sharing collapses or a guest grows,
              the host swaps and then OOM-kills a VM. On {{ $labels.host }}: `free -m`,
              `cat /sys/kernel/mm/ksm/pages_sharing`, the per-VM RSS (`ps -o rss= -p $(cat
              /var/run/qemu-server/<vmid>.pid)`); relief is a smaller allocation in
              `tofu/variables.tf` (reboots that VM), or the VM moves to the other hypervisor —
              never a RAM buy for pve (operator direction: the second hypervisor was the answer).
        - alert: PveMetricsStale
          expr: time() - node_textfile_mtime_seconds{job="pve-node", file=~".*/pve.prom"} > 600
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} textfile metrics not refreshed for {{ $value | humanizeDuration }}"
            description: >-
              node_exporter on {{ $labels.host }} is up but pve.prom has stopped advancing — the
              collector timer (pve-textfile-metrics.timer) is failing or stopped, so the pool level
              above is a stale number, not a calm pool. On {{ $labels.host }}: `systemctl status
              pve-textfile-metrics.timer pve-textfile-metrics.service`; `journalctl -u
              pve-textfile-metrics`. Re-run `ansible/pve-node-exporter.yml` to reassert the units.
        # absent() cannot be written per label VALUE — an unqualified absent() over both
        # hypervisors goes quiet the moment EITHER one still reports, which is precisely the state
        # this alert exists to catch. So: one arm per host, each carrying its own `host` matcher
        # into the result (absent() keeps an equality matcher's labels, so $labels.host resolves).
        # A third hypervisor adds a third `or` arm — deliberate, and the reason it is one rule.
        - alert: PveMetricsAbsent
          expr: >-
            absent(pve_lvm_thin_pool_data_percent{job="pve-node", host="pve"})
            or absent(pve_lvm_thin_pool_data_percent{job="pve-node", host="nx-02"})
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} thin-pool meter absent — that pool is unmetered again"
            description: >-
              No pve_lvm_thin_pool_data_percent series from {{ $labels.host }} for 15m:
              node_exporter there is down, the ScrapeConfig lost its target, or the textfile is
              missing. Every pool alert for that box is blind while this fires, and the
              runner-image-prepull gate holds pool-VM pulls (fail closed, on the max across BOTH
              pools). Check `curl <host>:9100/metrics | grep pve_lvm` from the LAN (pve
              192.168.2.3, nx-02 192.168.2.59), then the ScrapeConfig (`kubectl -n monitoring get
              scrapeconfig pve-node`) and Prometheus targets.
