# Periodic guest fstrim for the Talos VMs on pve's LVM thin pool — the automation half of
# docs/storage-ledger.md §"A THIRD sum: the hypervisor underneath" (FU-093).
#
# WHY THIS EXISTS. Deleting data inside a Talos VM does not return blocks to pve's thin pool:
# nothing in the guest issues TRIM, so the pool only ever grows. It has now filled FOUR times, the
# fifth alert (2026-09-14, #1661) confirmed a NEW failure mode: the twice-daily schedule is correct
# for the slow-creep case (1-2 points/day) but the pool can gain 6 points in 45 minutes from a CI
# burst (arc-runner disk-pressure eviction on a pool-backed node). The twice-daily cadence leaves a
# reaction window of up to ~12 hours, during which the pool can cross 80 % (and given the slope,
# 90 %/critical). Fix (#1661): a reactive guard CronJob per node that queries the pool level every
# 15 minutes and trims immediately when it is ≥79 %, so reclaim starts BEFORE the PveThinPoolFillingUp
# alert's 10-minute `for:` window fires. The twice-daily trims remain as the guaranteed floor.
#
# At 100% every VM on the pool goes read-only TOGETHER — cp-01, wk-01, wk-02 and ci-runner-01, i.e.
# the control plane and the CI runner. `discard=on` (set on all five VMs) is necessary and NOT
# sufficient: it only means the guest's discards are honoured, and Talos never issues any. Every
# reclaim so far has been a human running the runbook recipe by hand; 2026-08-25 found the pool back
# at 77.41% one day after a trim took it to 47.69%, with 1.00G of VG free — so the
# `thin_pool_autoextend_threshold=80` belt would fail exactly as it did on 08-17 (257 extents).
# Hence a schedule, not a reminder.
#
# WHY A PRIVILEGED POD AND NOT SOMETHING TIDIER — both alternatives are tried and dead
# (docs/runbook.md §"Reclaiming thin-pool space from a Talos VM"):
#   • `qm guest cmd <vmid> fstrim` returns {"paths": []} — Talos' qemu-guest-agent does not
#     enumerate the guest's filesystems.
#   • Mounting the guest partition on the pve host fails: Talos formats EPHEMERAL with XFS feature
#     bits the Proxmox kernel cannot mount. Worse, if the mount fails and the trim runs anyway, it
#     silently trims the pve host root instead.
# There is no `talosctl fstrim`, and Talos' VolumeConfig for EPHEMERAL exposes no discard mount
# option. A privileged pod with /var hostPath'd is the mechanism.
#
# SCOPE: every Talos VM whose disk sits on an LVM thin pool — the four on pve (`zone: proxmox`)
# and, since 2026-09-15, wk-04 on nx-02's `nvme-thin` (`zone: nx-02`). The membership test is "a
# thin pool underneath", NOT the literal zone `proxmox`: a second hypervisor's VM needs reclaim for
# exactly the same reason, and `discard=on` in tofu is as insufficient there as it is here. The
# metal nodes are deliberately absent — real disks, no pool, so a trim there would be
# wear-levelling housekeeping rather than this failure. ci-runner-01 shares pve's pool but is not a
# k8s node; it is a normal Linux guest covered by its own systemd fstrim.timer — verify that
# separately, this CronJob cannot reach it.
#
# One CronJob per node because a Job cannot pin different pods to different nodes, and `nodeName`
# is what puts a pod on a specific box. They are staggered so four simultaneous discards do not
# hit one NVMe together.
apiVersion: v1
kind: Namespace
metadata:
  name: node-maintenance
  labels:
    # fstrim needs CAP_SYS_ADMIN on a hostPath mount; this namespace exists so that privilege is
    # scoped to one place instead of borrowing kata-spike/longhorn-system/monitoring.
    # All THREE levels, as kata-spike does. Setting only `enforce` leaves audit/warn at the
    # cluster default, which emits a "would violate PodSecurity restricted" warning on every
    # apply — the pod runs fine, but the warning trains readers to ignore PSA warnings.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-fstrim
  namespace: node-maintenance
data:
  trim.sh: |
    #!/bin/sh
    # Never `set -e`: a failed trim must still report, and the exit code is what the alert reads.
    set -u
    NODE="${NODE_NAME:-unknown}"
    PG="${PUSHGATEWAY_URL:-http://prometheus-pushgateway.monitoring.svc.cluster.local:9091}"

    # Two output shapes, and they differ by implementation — measured, not assumed:
    #   busybox (alpine):  "/hostvar: 81594941440 bytes trimmed"
    #   util-linux:        "/hostvar: 76 GiB (81594941440 bytes) trimmed"
    # Matching only the parenthesised form silently pushed 0 from a run that reclaimed 76 GiB
    # (caught on the first live run, 2026-08-25). Accept the digits before " bytes" either way.
    out="$(fstrim -v /hostvar 2>&1)"; rc=$?
    echo "$out"
    bytes="$(echo "$out" | sed -n 's/.*[( ]\([0-9]\{1,\}\) bytes.*/\1/p' | head -1)"
    [ -n "${bytes:-}" ] || bytes=0

    if [ "$rc" -ne 0 ]; then
      echo "FSTRIM-FAIL: rc=$rc on ${NODE} — pool blocks were NOT returned"
    else
      echo "trimmed ${bytes} bytes on ${NODE}"
    fi

    # Report the outcome, not the attempt. A trim that silently does nothing looks identical to
    # one that worked — the pool level is the pve-metrics belt's (since 2026-09-04); this push is the
    # in-cluster evidence that the reclaim path is alive (storage-ledger.md: "a ledger that isn't
    # measured is a spreadsheet"). Best-effort: monitoring being down must not fail the trim.
    wget -q -O- --timeout=5 \
      --post-data="node_fstrim_bytes_trimmed ${bytes}
    node_fstrim_success ${rc}
    node_fstrim_last_run_timestamp $(date +%s)
    " "${PG}/metrics/job/node_fstrim/node/${NODE}" >/dev/null 2>&1 &&
      echo "pushed fstrim metrics for ${NODE}" ||
      echo "WARN could not push fstrim metrics (the trim itself already happened)"
    exit "$rc"
  reactive-trim.sh: |
    #!/bin/sh
    # Reactive off-cycle fstrim guard — #1661: query the pool level, trim only above threshold,
    # so a CI-burst spike events reclaim before the PveThinPoolFillingUp alert's `for:` window.
    # Never `set -e`: decision logic must survive wget/Prometheus failures.
    set -u
    NODE="${NODE_NAME:-unknown}"
    PG="${PUSHGATEWAY_URL:-http://prometheus-pushgateway.monitoring.svc.cluster.local:9091}"
    PROM="${PROMETHEUS_URL:-http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090}"
    THRESHOLD="${GUARD_THRESHOLD:-79}"
    # The series for THIS node's pool, url-encoded. Default = pve's, so the four pve VMs are
    # unchanged; a VM on another hypervisor passes its own (POOL_QUERY on its CronJob). It must be
    # the node's OWN pool, not `max()` over all of them: trimming wk-04 returns nothing to pve, so
    # a shared query would make every guard fire on a pool it cannot help (and stay silent on the
    # one it can).
    POOL_QUERY="${POOL_QUERY:-pve_lvm_thin_pool_data_percent%7Bjob%3D%22pve-node%22%2Chost%3D%22pve%22%2Cvg%3D%22pve%22%2Clv%3D%22data%22%7D}"

    pool_pct=$(wget -q -O- --timeout=10 \
      "${PROM}/api/v1/query?query=${POOL_QUERY}" \
      2>/dev/null | sed -n 's/.*"value":\[[^,]*,"\([0-9.]*\)"\].*/\1/p' | head -1)

    if [ -z "${pool_pct}" ]; then
      # FAIL OPEN: if we cannot read the pool, trim anyway. Rationale: matching trim.sh's
      # "best-effort-metrics, never-fail-the-trim" posture — the cost of a needless trim is
      # bounded I/O on a shared NVMe (stagger is preserved), while the cost of a missed reclaim
      # during a monitoring outage is a frozen control plane at 100 % (docs/incidents/).
      # The twice-daily floor still runs independently as a second-time-around guarantee.
      echo "GUARD-TRIM (query-fail) on ${NODE}: pool level unreadable — trimming anyway (fail-open)"
      out="$(fstrim -v /hostvar 2>&1)"; rc=$?
      echo "$out"
      wget -q -O- --timeout=5 \
        --post-data="node_fstrim_guard_pool_pct -1
    node_fstrim_guard_trimmed 1
    node_fstrim_guard_rc ${rc}
    node_fstrim_guard_last_run_timestamp $(date +%s)
    " "${PG}/metrics/job/node_fstrim_guard/node/${NODE}" >/dev/null 2>&1 || true
      exit "$rc"
    fi

    pool_int=$(echo "${pool_pct}" | sed 's/\..*//')
    [ -n "${pool_int}" ] || pool_int=0

    if [ "${pool_int}" -ge "${THRESHOLD}" ]; then
      echo "GUARD-TRIM on ${NODE}: pool at ${pool_pct}% >= ${THRESHOLD}% — running fstrim"
      out="$(fstrim -v /hostvar 2>&1)"; rc=$?
      echo "$out"
      bytes="$(echo "$out" | sed -n 's/.*[( ]\([0-9]\{1,\}\) bytes.*/\1/p' | head -1)"
      [ -n "${bytes:-}" ] || bytes=0
      if [ "$rc" -ne 0 ]; then
        echo "GUARD-FSTRIM-FAIL: rc=$rc on ${NODE} — pool blocks were NOT returned"
      else
        echo "guard-trimmed ${bytes} bytes on ${NODE} (pool was ${pool_pct}%)"
      fi
      wget -q -O- --timeout=5 \
        --post-data="node_fstrim_guard_pool_pct ${pool_pct}
    node_fstrim_guard_trimmed 1
    node_fstrim_guard_rc ${rc}
    node_fstrim_guard_last_run_timestamp $(date +%s)
    " "${PG}/metrics/job/node_fstrim_guard/node/${NODE}" >/dev/null 2>&1 &&
        echo "pushed guard metrics for ${NODE}" ||
        echo "WARN could not push guard metrics (the trim happened)"
      exit "$rc"
    else
      echo "GUARD-SKIP on ${NODE}: pool at ${pool_pct}% < ${THRESHOLD}% — no trim needed"
      wget -q -O- --timeout=5 \
        --post-data="node_fstrim_guard_pool_pct ${pool_pct}
    node_fstrim_guard_trimmed 0
    node_fstrim_guard_rc 0
    node_fstrim_guard_last_run_timestamp $(date +%s)
    " "${PG}/metrics/job/node_fstrim_guard/node/${NODE}" >/dev/null 2>&1 || true
      exit 0
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-cp-01
  namespace: node-maintenance
spec:
  # Twice daily (operator quickfix 2026-09-04). Daily was in place for the fourth fill: the 03:17
  # run had fired 19 h before the 22:05Z 100 %, and the recovery trims returned 65–85 GB the guests
  # had freed since — 18–24 points of pool sitting unreturned (TICK-LOG 2026-09-04). The pool went
  # 47.69% -> 77.41% in one day of ordinary churn already on 2026-08-25. Two runs halve the ratchet
  # while the pve meter (argocd/resources/pve-metrics/) measures the real per-run reclaim; size the
  # cadence from that, not from here. Staggered by node so four discards do not land on the one
  # NVMe together.
  schedule: "17 3,15 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          # nodeName, not affinity: this must run on exactly this box, and it must still run when
          # the node is cordoned for maintenance — cordon is precisely when reclaim matters.
          nodeName: cp-01
          tolerations: [{ operator: Exists }]
          containers:
            - name: fstrim
              image: alpine:3.20
              command: ["/bin/sh", "/script/trim.sh"]
              env:
                - name: NODE_NAME
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
              securityContext:
                privileged: true
              volumeMounts:
                - { name: script, mountPath: /script }
                # /var is where Talos puts EPHEMERAL — the partition that actually holds the
                # container images, Longhorn replicas and logs whose deletion never reached the pool.
                - { name: hostvar, mountPath: /hostvar }
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: script
              configMap: { name: node-fstrim, defaultMode: 0755 }
            - name: hostvar
              hostPath: { path: /var, type: Directory }
---
