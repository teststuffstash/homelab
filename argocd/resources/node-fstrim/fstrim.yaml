---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-guard-wk-04
  namespace: node-maintenance
spec:
  schedule: "12,27,42,57 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeName: wk-04
          tolerations: [{ operator: Exists }]
          containers:
            - name: fstrim-guard
              image: alpine:3.20
              command: ["/bin/sh", "/script/reactive-trim.sh"]
              env:
                - name: NODE_NAME
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
                # nx-02's pool, url-encoded: {job="pve-node",host="nx-02",vg="nvme-thin",lv="data"}
                - name: POOL_QUERY
                  value: "pve_lvm_thin_pool_data_percent%7Bjob%3D%22pve-node%22%2Chost%3D%22nx-02%22%2Cvg%3D%22nvme-thin%22%2Clv%3D%22data%22%7D"
              securityContext:
                privileged: true
              volumeMounts:
                - { name: script, mountPath: /script }
                - { name: hostvar, mountPath: /hostvar }
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: script
              configMap: { name: node-fstrim, defaultMode: 0755 }
            - name: hostvar
              hostPath: { path: /var, type: Directory }
