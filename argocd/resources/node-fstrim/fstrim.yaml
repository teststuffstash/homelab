apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-guard-cp-01
  namespace: node-maintenance
spec:
  # Reactive guard (#1661): every 15 min, query the pool level and fstrim ONLY when ≥79 % (one
  # point below the PveThinPoolFillingUp alert's 80, so reclaim precedes the alert, normal
  # 73–77 % operation never touches it). The guard answers the #1661 burst — 74.96 → 80.96 in
  # ~45 min from an arc-runner disk-pressure eviction — with an off-cycle reclaim; the twice-daily
  # fstrim above is still the guaranteed floor and runs unchanged. GUARD_THRESHOLD is an env so the
  # exact point can be tuned without re-rendering the script. Staggered by node (:00/:03/:06/:09)
  # for the same reason as the twice-daily set — four discards must not land on the one NVMe at
  # once. `concurrencyPolicy: Forbid` + `nodeName` + `tolerations` mirror the floor jobs: a guard
  # must still run on a cordoned node, and a slow query must not pile up jobs.
  schedule: "0,15,30,45 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeName: cp-01
          tolerations: [{ operator: Exists }]
          containers:
            - name: fstrim-guard
              image: alpine:3.20
              command: ["/bin/sh", "/script/reactive-trim.sh"]
              env:
                - name: NODE_NAME
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
              securityContext:
                privileged: true
              volumeMounts:
                - { name: script, mountPath: /script }
                # Same /var hostPath as the floor job — EPHEMERAL is where the reclaimed blocks live.
                - { name: hostvar, mountPath: /hostvar }
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: script
              configMap: { name: node-fstrim, defaultMode: 0755 }
            - name: hostvar
              hostPath: { path: /var, type: Directory }
---
