# ── wk-04, on the SECOND hypervisor (nx-02, 2026-09-15) ────────────────────────────────────────
# Same pair as every pool VM above, with one difference: `POOL_QUERY` points the guard at nx-02's
# own pool. Trimming wk-04 returns blocks to `nvme-thin` on nx-02 and to nothing else, so reading
# pve's number here would be the wrong signal in both directions.
# The stagger is kept for readability, not for I/O: this is a different NVMe in a different box.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim-wk-04
  namespace: node-maintenance
spec:
  schedule: "41 3,15 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
