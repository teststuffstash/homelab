# cloudflare-exporter — the Cloudflare edge into Prometheus (FU-039 public-ingress observability
# leg, operator direction 2026-08-08: "the platform is responsible for observability"; also the
# jail's GraphQL read token's in-cluster twin). lablabs/cloudflare_exporter polls the GraphQL
# Analytics API with the SAME read-only token the jail uses (Infisical
# CLOUDFLARE_OBSERVABILITY_READ) — all-zones scope, so future product zones appear without a
# config change. ⚠ Zone metrics cover NON-free-plan zones only (#132 — the v0.2.3 source gates
# free zones out; validated matrix in docs/cloudflare.md §Free-zone GraphQL): eid-demo.com (pro)
# emits, teststuff.net (free) needs the FU-039 DIY GraphQL leg. The cloudflared PodMonitor is the
# plan-independent half: local tunnel metrics, no Cloudflare API involved.
#
# spend-probe-* (#217) is a SECOND workload in this directory, deliberately: the lablabs binary is
# third-party and cannot grow gauges of ours, so the spend-toggle drift belt is our own
# ConfigMap-python poller riding the same namespace, the same ExternalSecret token and the same
# `cloudflare-edge` rule group — one Cloudflare observability app, two API surfaces (GraphQL
# analytics vs the zone-settings REST reads). It also covers the zone CF_EXCLUDE_ZONES hides from
# the exporter above. Design: docs/cloudflare.md §Spend surface (zone classes: §Zone classes).
#
# credential-expiry-* (FU-156) rides here too: the credential-expiry belt's Cloudflare leg, polling
# GET /user/tokens with its OWN user-scoped token (Infisical CLOUDFLARE_INVENTORY_READ) into the
# provider-generic `credential_expiry_timestamp_seconds` gauge. Rules: the `credential-expiry` group
# in prometheusrule.yaml. Design: docs/secrets.md §Credential expiry is telemetry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - podmonitor-cloudflared.yaml
  - spend-probe-deployment.yaml
  - spend-probe-service.yaml
  - spend-probe-servicemonitor.yaml
  - edge-probe-deployment.yaml
  - edge-probe-service.yaml
  - edge-probe-servicemonitor.yaml
  - credential-expiry-externalsecret.yaml
  - credential-expiry-probe-deployment.yaml
  - credential-expiry-probe-service.yaml
  - credential-expiry-probe-servicemonitor.yaml

configMapGenerator:
  # Hash-named, so an edit to the probe script rolls its pod (the github-exporter pattern).
  - name: cloudflare-spend-probe-script
    files:
      - spend-probe.py
  # Hash-named, same pattern — an edit to edge-probe.py rolls its pod.
  - name: cloudflare-edge-probe-script
    files:
      - edge-probe.py
  # Hash-named, same pattern — the FU-156 credential-expiry belt's Cloudflare leg.
  - name: cloudflare-credential-expiry-probe-script
    files:
      - credential-expiry-probe.py
