apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-credential-expiry-probe
  labels: { app: cloudflare-credential-expiry-probe }
spec:
  selector:
    matchLabels: { app: cloudflare-credential-expiry-probe }
  endpoints:
    - port: http-metrics
      interval: 120s # probe_ok is computed per scrape; the Cloudflare poll runs every POLL_INTERVAL_SECONDS
