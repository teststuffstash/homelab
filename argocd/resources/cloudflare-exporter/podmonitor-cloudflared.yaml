apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  labels: { app: cloudflared }
spec:
  # The tunnel daemon has exported Prometheus metrics on :2000 since day one
  # (`--metrics 0.0.0.0:2000` in tofu/cloudflare/) — unscraped for its first 25 days (#132's
  # sibling find, 2026-08-08). This is the PLAN-INDEPENDENT half of edge observability:
  # per-hostname tunnel requests + response codes, QUIC/HA connection health, retries —
  # local truth about the ha.teststuff.net path regardless of what the free zone's GraphQL
  # will serve. portNumber because the tofu Deployment declares no named ports; changing
  # that would be a tofu apply for a cosmetic rename.
  namespaceSelector:
    matchNames: [cloudflared]
  selector:
    matchLabels: { app: cloudflared }
  podMetricsEndpoints:
    # NOT portNumber: that field matches against DECLARED container ports, and the tofu
    # Deployment declares none — the generated keep-rule on
    # __meta_kubernetes_pod_container_port_number matched nothing and the job had zero
    # targets (found live: scrape config rendered, activeTargets empty). The CRD's own doc
    # says undeclared ports need relabeling; this rewrites the address to podIP:2000.
    # Declaring the port in tofu/cloudflare's Deployment is the cleaner fix — fold it into
    # the next apply of that root, then this can revert to portNumber.
    - interval: 60s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: $1:2000
          action: replace
