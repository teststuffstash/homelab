apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  labels: { app: cloudflared }
spec:
  # Every PublicRoute connector, in whatever namespace its claim lives (ha.teststuff.net in
  # home-assistant since the 2026-10-26 retrofit, the oracle claims in oracle-fleet, …): the
  # composition's cloudflared Deployment labels its pods `app.kubernetes.io/name: cloudflared`
  # and serves Prometheus metrics on the declared port `metrics` (:2000). This is the
  # PLAN-INDEPENDENT half of edge observability: tunnel requests, QUIC/HA connection health,
  # retries — local truth about each public path regardless of what the free zone's GraphQL
  # will serve. Per-claim identity is the `namespace`/`pod` target labels (the pod name carries
  # `pr-<ns>-<claim>-cloudflared`).
  # History: until the retrofit this selected the tofu/cloudflare one-off (ns `cloudflared`,
  # `app: cloudflared`, NO declared port — hence an __address__ relabel to podIP:2000); the
  # composition's connectors were unscraped (no --metrics) until the same change.
  namespaceSelector:
    any: true
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
