apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  labels: { app: cloudflare-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflare-exporter }
  template:
    metadata:
      labels: { app: cloudflare-exporter }
    spec:
      containers:
        - name: exporter
          # 0.2.3, digest-pinned (== latest at pin time). GraphQL poller; ~270s default lookback.
          image: ghcr.io/lablabs/cloudflare_exporter:0.2.3@sha256:6bf84a81725c6d75b14fb584135ccfe5f8aff89d23c36b04511d22b1c6cc10cb
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflare-exporter-token, key: token }
            # NO CF_ZONES: zones auto-discover (ListZones with the token) — future product
            # zones (FU-039) appear in Prometheus the day they exist, no re-deploy.
            # ⚠ NO FREE_TIER flag, and read the v0.2.3 SOURCE before touching this (#132):
            # FREE_TIER=true early-returns from EVERY zone fetcher (only Worker/R2 account
            # metrics survive — we have neither, so the exporter emitted literally nothing),
            # and independently filterNonFreePlanZones drops Free-PLAN zones from the zone
            # analytics path. Net: zone metrics exist for NON-free zones only — eid-demo.com
            # (pro) today; teststuff.net (free plan) is structurally invisible to this
            # exporter and needs the DIY GraphQL leg (FU-039). CF_ACCOUNTS does not exist at
            # 0.2.3 (it's a master-README-only knob; accounts are auto-fetched).
            # info, not the default error: a misconfiguration here fails SILENTLY at error
            # level (#132 ran 30m with zero series and two startup log lines).
            - { name: LOG_LEVEL, value: "info" }
            - { name: LISTEN, value: ":8080" }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
