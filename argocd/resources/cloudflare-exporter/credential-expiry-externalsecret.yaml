# The credential-expiry probe's own credential (FU-156): `homelab-token-inventory-read`, user-scoped
# User: API Tokens: Read — NOT the observability token the other two pollers share (that one is
# account/zone-scoped and cannot list tokens). Stored by scripts/cloudflare-token-store.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-inventory-read
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-inventory-read
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_INVENTORY_READ
