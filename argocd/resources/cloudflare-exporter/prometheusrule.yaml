apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudflare-exporter
  labels: { app: cloudflare-exporter }
spec:
  groups:
    - name: cloudflare-edge
      rules:
        # The FU-150 lesson applied to the edge: a dead exporter/credential looks exactly like a
        # quiet edge. Absence is the alert, not an error count.
        # ⚠ Re-keyed 2026-08-08 (#132, round 4): the original expr was
        # absent(cloudflare_zone_requests_total) — but NEITHER zone can produce that series
        # (teststuff.net is free-plan-gated at exporter v0.2.3; eid-demo.com has no DNS records,
        # so no request can ever reach its edge). An alert on a metric that cannot exist fires
        # forever by construction. Scrape-target health is what the exporter can actually prove;
        # END-TO-END edge-data absence becomes the DIY poller's belt (FU-039), which has real
        # data to lose. The cloudflared_* series (PodMonitor) are today's live edge signal.
        # Behaviour fixture: exporter-down.promtool-{rules,test} beside this file (#351) — the
        # `for: 30m`, the absent() arm's label-less identity, and the restart-gap exemption noted
        # in the spend-belt block below are all executed there.
        - alert: CloudflareExporterDown
          expr: up{job=~".*cloudflare-exporter.*"} == 0 or absent(up{job=~".*cloudflare-exporter.*"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Cloudflare exporter scrape target down/absent"
            description: "Prometheus cannot scrape the cloudflare-exporter for 30m — pod down, Service/ServiceMonitor broken, or the app undeployed. SYMPTOM ONLY. Check: pod + logs in monitoring (LOG_LEVEL=info logs every poll), ArgoCD app cloudflare-exporter, then token verify (docs/cloudflare.md §Token matrix)."
        # ⚠ DELETED 2026-08-12 (#350) — do NOT re-add by symmetry with the alert above. There was a
        # `CloudflareEdge5xx` here, `sum by (zone) (rate(cloudflare_zone_requests_status{status=~
        # "5.."}[15m])) > 0.2`, described as "armed now, quiet on today's traffic". It was not quiet
        # on today's traffic — its input series cannot be produced, so its silence was
        # indistinguishable from a healthy edge. This is the same #132 finding that re-keyed
        # `CloudflareExporterDown` above, recurring one alert down. What settled it, live:
        #   • `cloudflare_zone_requests_status` has ZERO series over the whole TSDB retention (which
        #     begins 2026-08-03), and scraping the exporter itself on 2026-08-12 returns exactly one
        #     cloudflare_* family — `cloudflare_r2_storage_total_bytes`, an ACCOUNT metric. No
        #     zone-scoped series exists at all, so nothing was merely waiting for traffic.
        #   • The reason is structural, not incidental: the lablabs exporter's dataset is
        #     `httpRequests1mGroups`, which answers "does not have access to the path" on FREE zones
        #     (docs/cloudflare.md §Free-zone GraphQL matrix, validated live 2026-08-08). Both watched
        #     product zones are free today — read off the belt's own gauge,
        #     `cloudflare_zone_plan_is_free{zone="teststuff.net"} == 1` and `{zone="minutark.ee"} == 1`
        #     — and teststuff.net is additionally hidden from the exporter by CF_EXCLUDE_ZONES
        #     (#132 round 3). The one Pro zone, eid-demo.com, is out of scope by design (outside
        #     every write token's zone map) and has no DNS records, so no request reaches its edge.
        #   • Which makes the arming precondition "a watched zone left the free plan" — exactly what
        #     `CloudflareZonePlanNotFree` below exists to page about. A belt whose input series can
        #     only appear in a state the platform already alerts against is not a belt.
        # NOT re-keyed onto the live edge signal, deliberately: `cloudflared_*` (the PodMonitor
        # beside this file) is the plan-independent truth about the ha.teststuff.net path, but this
        # cloudflared build exports no response-code breakdown — the tunnel families are
        # `cloudflared_tunnel_total_requests` / `_request_errors` / `_concurrent_requests_per_tunnel`
        # and friends, with no `status`/`code` dimension and no hostname label — so "5xx at the edge"
        # cannot be re-expressed over it. A threshold on tunnel ERRORS would be a new alert on a
        # different symptom, and there is no baseline to size it from: `cloudflared_tunnel_total_requests`
        # reads 0 on both replicas right now.
        # Where this belt actually belongs: FU-039's DIY GraphQL poller, on
        # `httpRequestsAdaptiveGroups` — ✅ on free zones WITH host+status dims per the same matrix,
        # which is the only path that can see the zone that carries our public traffic. It will
        # export its own metric name, so this rule could not have been recycled into it either;
        # re-add an edge-5xx alert when that poller lands, keyed to what IT produces.
        # ── spend drift belt (#217; the argo leg RETIRED 2026-08-12) ───────────────────────────
        # The account has a payment card attached, so a plan change bills silently — this is the
        # belt: it cannot prevent the change, it makes it loud. It shipped with a third alert,
        # `CloudflareZoneSpendToggleEnabled` over an argo gauge, on the assumption that Argo
        # Smart Routing (per-GB) was togglable by Zone Settings Write. The host-side admin-token
        # session (2026-08-12) refuted that: `/zones/{id}/argo/smart_routing` answers 1015
        # `Cause(s): smart_routing` to EVERY mintable scope (admin, Settings Read+Write, the
        # legacy all-read-groups template), no Argo permission group exists, and the endpoint
        # docs name no accepted permissions — the setting is ENTITLEMENT-gated, unreachable by
        # any credential we hold, read or write. So the leg could only ever be blind; it was
        # retired rather than reinterpreted ("1015 ⇒ off" is unverifiable without buying the
        # entitlement), and a dashboard toggle lands in the audit log (Account Settings Read,
        # on-demand jail read). Verdict + evidence table: docs/cloudflare.md §spend surface.
        # Series come from cloudflare-spend-probe (spend-probe.py beside this file), whose
        # --self-test replays THESE exprs against a flipped fixture — rename an alert or a metric
        # on one side only and that test fails (it also asserts the retired alert STAYS retired —
        # its input series is never emitted, so a re-add would be born silent).
        # severity: warning because info is inhibited here.
        # ⚠ Both carry the #288/#313 RESTART-GAP shape as of homelab#334: `min by (zone)` to drop
        # the churning `pod`/`instance` identity, plus a `min_over_time` `[10m]` bridge over the
        # hole a `replicas: 1` roll leaves. Both halves are needed — #288 measured that either
        # alone still restarts the `for:` window at one replica — and the sizing is #288's (ten
        # pod generations, gapped 69-116s); a hole longer than the range still costs the whole
        # window, which is accepted and asserted.
        # The part that is NOT a copy of #328: both are LOW-is-bad (`plan_is_free == 0`,
        # `spend_probe_ok == 0`), so they bridge with `min_over_time`. The mechanical `max` port
        # reads the HEALTHIEST sample in the window and would delay the very drift the belt
        # exists to catch by up to 10m — executed, not argued, in spend-belt.promtool-test
        # (CloudflareZonePlanNotFreeMaxDirection).
        # `CloudflareSpendProbeBlind`'s `absent()` arm is bridged too, and that is the whole point
        # of its case: unbridged, a roll empties the series, the alert swaps a `{zone=…}` identity
        # for the label-less one the `absent()` arm produces, and THAT is a window restart with no
        # change in the underlying condition. The price is the mirror: a probe that vanishes for
        # good is noticed ≤10m later than before (FU-150's "absence is the alert" still holds, it
        # just holds 10m slower). `CloudflareExporterDown` above is deliberately NOT in this class
        # — `up == 0` needs a live target, and a replaced target is a genuinely new attempt at
        # being scraped, so its reset is correct. Since #351 that is executed, not argued: the
        # bridged port exists as a regression witness and both forms run over the same roll in
        # exporter-down.promtool-test — §4 has the bridged one paging at 30m about an exporter that
        # has been scraping successfully for three minutes, §5 has it 9m late on a real absence.
        # ⚠ Both spend-belt alerts carry `platform_machinery: "true"` (homelab#239): they
        # fire in ns `monitoring`, which is in no claim and in no self-referential namespace set,
        # and their names are not `Agent*` — so the responder's gate saw them as ordinary
        # dispatchable symptoms. They are not: the account, its card and its tokens are the
        # platform's own, the evidence lives in a third-party console's audit log, and the
        # remedy is an operator move (revert a toggle, re-scope a token) or a `tofu/cloudflare/**`
        # change applied out-of-band. Triage still runs and still files — what the label caps is
        # the auto-merge, per the gate in agents/coordinator/responder-argo.yaml.
        - alert: CloudflareZonePlanNotFree
          expr: min by (zone) (min_over_time(cloudflare_zone_plan_is_free[10m])) == 0
          for: 5m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Cloudflare product zone {{ $labels.zone }} is no longer on the free plan"
            description: "Zone {{ $labels.zone }} reports a plan other than free — a recurring charge on the card attached to the account. SYMPTOM ONLY (a deliberate upgrade looks identical to an accidental one). Check: Cloudflare audit log, and whether the change was intended; the two watched zones are the product zones only, eid-demo.com is out of scope by design."
        - alert: CloudflareSpendProbeBlind
          expr: min by (zone) (min_over_time(cloudflare_zone_spend_probe_ok[10m])) == 0 or absent(min_over_time(cloudflare_zone_spend_probe_ok[10m]))
          for: 30m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Cloudflare spend belt is blind{{ if $labels.zone }} on zone {{ $labels.zone }}{{ end }}"
            description: "The spend probe has not read a zone's plan state for 30m — the gauge above is UNKNOWN, not safe, and a plan change now would go unnoticed. SYMPTOM ONLY. Check: pod + logs (deploy/cloudflare-spend-probe in monitoring, it logs every failed read), the cloudflare-exporter-token Secret (ESO ← Infisical CLOUDFLARE_OBSERVABILITY_READ), then the token's zone reads on both product zones (docs/cloudflare.md §Token matrix)."
        # ── edge observability belt (#1306) — the FU-039 DIY GraphQL poller ─────────────────────
        # The lablabs exporter's dataset (`httpRequests1mGroups`) 403s on free zones, so the
        # edge-probe uses `httpRequestsAdaptiveGroups` and `firewallEventsAdaptive` — both ✅ on
        # free zones per the validated matrix in docs/cloudflare.md §Free-zone GraphQL matrix.
        # Series come from cloudflare-edge-probe (edge-probe.py beside this file), whose --self-test
        # replays THESE exprs against a flipped fixture — rename an alert or a metric on one side
        # only and that test fails (it also asserts the retired CloudflareEdge5xx STAYS retired).
        # severity: warning because info is inhibited here.
        # ⚠ Carries the #288/#313 restart-gap shape (homelab#334): `min by (zone)` to drop the
        # churning `pod`/`instance` identity, plus `min_over_time` `[10m]` bridge over the hole a
        # `replicas: 1` roll leaves. LOW-is-bad (`probe_ok == 0`), so `min_over_time` is the
        # alert-preserving direction. The `absent()` arm is bridged too, for the same reason as
        # CloudflareSpendProbeBlind: an unbridged roll swaps `{zone=…}` for `{}` and back, which
        # is a window restart with no change in the underlying condition.
        - alert: CloudflareEdgeProbeBlind
          expr: min by (zone) (min_over_time(cloudflare_edge_probe_ok[10m])) == 0 or absent(min_over_time(cloudflare_edge_probe_ok[10m]))
          for: 30m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Cloudflare edge probe is blind{{ if $labels.zone }} on zone {{ $labels.zone }}{{ end }}"
            description: "The edge probe has not read a zone's edge data for 30m — the gauges above are UNKNOWN, not safe, and edge data absence would go unnoticed. SYMPTOM ONLY. Check: pod + logs (deploy/cloudflare-edge-probe in monitoring, it logs every failed read), the cloudflare-exporter-token Secret (ESO ← Infisical CLOUDFLARE_OBSERVABILITY_READ), then the token's GraphQL reads on the product zone (docs/cloudflare.md §Token matrix)."
