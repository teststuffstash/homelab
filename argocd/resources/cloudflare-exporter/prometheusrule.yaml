apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudflare-exporter
  labels: { app: cloudflare-exporter }
spec:
  groups:
    - name: cloudflare-edge
      rules:
        # The FU-150 lesson applied to the edge: a dead exporter/credential looks exactly like a
        # quiet edge. Absence is the alert, not an error count.
        # ⚠ Re-keyed 2026-08-08 (#132, round 4): the original expr was
        # absent(cloudflare_zone_requests_total) — but NEITHER zone can produce that series
        # (teststuff.net is free-plan-gated at exporter v0.2.3; eid-demo.com has no DNS records,
        # so no request can ever reach its edge). An alert on a metric that cannot exist fires
        # forever by construction. Scrape-target health is what the exporter can actually prove;
        # END-TO-END edge-data absence becomes the DIY poller's belt (FU-039), which has real
        # data to lose. The cloudflared_* series (PodMonitor) are today's live edge signal.
        - alert: CloudflareExporterDown
          expr: up{job=~".*cloudflare-exporter.*"} == 0 or absent(up{job=~".*cloudflare-exporter.*"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Cloudflare exporter scrape target down/absent"
            description: "Prometheus cannot scrape the cloudflare-exporter for 30m — pod down, Service/ServiceMonitor broken, or the app undeployed. SYMPTOM ONLY. Check: pod + logs in monitoring (LOG_LEVEL=info logs every poll), ArgoCD app cloudflare-exporter, then token verify (docs/cloudflare.md §Token matrix)."
        # Symptom alert for the future public endpoints (armed now, quiet on today's traffic):
        # origin-side failures surface as 5xx at the edge before anything else user-visible.
        - alert: CloudflareEdge5xx
          expr: sum by (zone) (rate(cloudflare_zone_requests_status{status=~"5.."}[15m])) > 0.2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Edge 5xx on zone {{ $labels.zone }}"
            description: "Sustained >0.2 rps of 5xx responses at the Cloudflare edge for zone {{ $labels.zone }} over 15m. SYMPTOM ONLY — origin (tunnel/backend) failure, or an edge rule misfire."
        # ── spend-toggle drift belt (#217) ──────────────────────────────────────────────────────
        # The account has a payment card attached and Zone Settings WRITE — which the minutark
        # bootstrap legitimately needs, and which the jail wallet holds — is enough to enable
        # per-GB-billed features. The guard would be not granting that write; since we grant it,
        # this is the belt: enabling a paid feature is an anomaly by definition, and anomalies get
        # belts. Series come from cloudflare-spend-probe (spend-probe.py beside this file), whose
        # --self-test replays THESE exprs against a flipped fixture — rename an alert or a metric
        # on one side only and that test fails. severity: warning because info is inhibited here.
        # ⚠ All three carry the #288/#313 RESTART-GAP shape as of homelab#334: `max by (zone)` /
        # `min by (zone)` to drop the churning `pod`/`instance` identity, plus a
        # `max_over_time`/`min_over_time` `[10m]` bridge over the hole a `replicas: 1` roll leaves.
        # Both halves are needed — #288 measured that either alone still restarts the `for:` window
        # at one replica — and the sizing is #288's (ten pod generations, gapped 69-116s); a hole
        # longer than the range still costs the whole window, which is accepted and asserted.
        # The part that is NOT a copy of #328: two of these three are LOW-is-bad
        # (`plan_is_free == 0`, `spend_probe_ok == 0`), so they bridge with `min_over_time`.
        # The mechanical `max` port reads the HEALTHIEST sample in the window and would delay the
        # very drift the belt exists to catch by up to 10m — executed, not argued, in
        # spend-belt.promtool-test (CloudflareZonePlanNotFreeMaxDirection).
        # `CloudflareSpendProbeBlind`'s `absent()` arm is bridged too, and that is the whole point
        # of its case: unbridged, a roll empties the series, the alert swaps a `{zone=…}` identity
        # for the label-less one the `absent()` arm produces, and THAT is a window restart with no
        # change in the underlying condition. The price is the mirror: a probe that vanishes for
        # good is noticed ≤10m later than before (FU-150's "absence is the alert" still holds, it
        # just holds 10m slower). `CloudflareExporterDown` above is deliberately NOT in this class
        # — `up == 0` needs a live target, and a replaced target is a genuinely new attempt at
        # being scraped, so its reset is correct.
        # ⚠ All three spend-belt alerts carry `platform_machinery: "true"` (homelab#239): they
        # fire in ns `monitoring`, which is in no claim and in no self-referential namespace set,
        # and their names are not `Agent*` — so the responder's gate saw them as ordinary
        # dispatchable symptoms. They are not: the account, its card and its tokens are the
        # platform's own, the evidence lives in a third-party console's audit log, and the
        # remedy is an operator move (revert a toggle, re-scope a token) or a `tofu/cloudflare/**`
        # change applied out-of-band. Triage still runs and still files — what the label caps is
        # the auto-merge, per the gate in agents/coordinator/responder-argo.yaml.
        - alert: CloudflareZoneSpendToggleEnabled
          expr: max by (zone) (max_over_time(cloudflare_zone_argo_smart_routing[10m])) > 0
          for: 5m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Usage-billed toggle enabled on Cloudflare zone {{ $labels.zone }}"
            description: "Argo Smart Routing is no longer \"off\" on zone {{ $labels.zone }} — a per-GB usage-billed feature, which bills the card attached to the account. SYMPTOM ONLY. Check: Cloudflare audit log for who/when (docs/cloudflare.md §Token matrix lists which tokens carry Zone Settings Write), then GET /zones/{id}/argo/smart_routing to confirm the live value."
        - alert: CloudflareZonePlanNotFree
          expr: min by (zone) (min_over_time(cloudflare_zone_plan_is_free[10m])) == 0
          for: 5m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Cloudflare product zone {{ $labels.zone }} is no longer on the free plan"
            description: "Zone {{ $labels.zone }} reports a plan other than free — a recurring charge on the card attached to the account. SYMPTOM ONLY (a deliberate upgrade looks identical to an accidental one). Check: Cloudflare audit log, and whether the change was intended; the two watched zones are the product zones only, eid-demo.com is out of scope by design."
        - alert: CloudflareSpendProbeBlind
          expr: min by (zone) (min_over_time(cloudflare_zone_spend_probe_ok[10m])) == 0 or absent(min_over_time(cloudflare_zone_spend_probe_ok[10m]))
          for: 30m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Cloudflare spend-toggle belt is blind{{ if $labels.zone }} on zone {{ $labels.zone }}{{ end }}"
            description: "The spend-toggle probe has not read a zone's plan/Argo state for 30m — the gauges above are UNKNOWN, not safe, and a toggle flipped now would go unnoticed. SYMPTOM ONLY. Check: pod + logs (deploy/cloudflare-spend-probe in monitoring, it logs every failed read), the cloudflare-exporter-token Secret (ESO ← Infisical CLOUDFLARE_OBSERVABILITY_READ), then the token's Zone Settings Read on both product zones (docs/cloudflare.md §Token matrix)."
