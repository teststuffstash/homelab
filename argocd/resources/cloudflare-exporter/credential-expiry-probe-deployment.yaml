# cloudflare-credential-expiry-probe (FU-156) — the credential-expiry belt's Cloudflare leg: lists
# every API token with its expires_on into `credential_expiry_timestamp_seconds`. Same shape as
# spend-probe-deployment.yaml (stock python image + the script from the generated ConfigMap);
# its credential is its own ExternalSecret (credential-expiry-externalsecret.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-credential-expiry-probe
  labels: { app: cloudflare-credential-expiry-probe }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflare-credential-expiry-probe }
  template:
    metadata:
      labels: { app: cloudflare-credential-expiry-probe }
    spec:
      containers:
        - name: probe
          image: python:3.15-slim@sha256:a83d68dc3d8f1048ff5628bc6f8c9f859938eb5add44ca947b70105b0383e961
          command: ["python3", "/app/credential-expiry-probe.py"]
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflare-inventory-read, key: token }
            - name: POLL_INTERVAL_SECONDS
              value: "600"
          ports:
            - { name: http-metrics, containerPort: 9507 }
          readinessProbe:
            httpGet: { path: /healthz, port: 9507 }
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: cloudflare-credential-expiry-probe-script # kustomize rewrites to the hashed name
