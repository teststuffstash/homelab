# The read-only Postgres credential behind Grafana's `oracle-feedback` datasource (oracle-fleet#713).
#
# WHY IT IS HERE AND NOT COPIED ACROSS NAMESPACES: the role's password has TWO in-cluster
# consumers in different namespaces — oracle's CNPG cluster (`oracle-pg`, ns oracle-fleet, which
# creates the role via `managed.roles`) and Grafana (ns monitoring, which connects as it). ESO's
# Infisical path is READ-ONLY by design and by capability (`ClusterSecretStore` reports ReadOnly,
# `PushSecret` to Infisical does not work — docs/secrets.md §Boundaries), so a CNPG-generated
# password cannot be pushed up and re-read here. Infisical is therefore the source of truth and
# BOTH sides read it: oracle-iac's Workspace publishes the value with the Infisical TF provider
# (the `crossplane-tf-writer` identity, ADR-076 — the same path sleep-iac's snore-recorder
# Workspace already uses), and this ExternalSecret pulls it into monitoring. Nothing is copied.
#
# The datasource entry lives in argocd/platform/values/kube-prometheus-stack.yaml
# (`grafana.additionalDataSources`, uid `oracle-feedback`) and reads this Secret through
# `grafana.envValueFrom` → `$__env{ORACLE_FEEDBACK_PG_RO_PASSWORD}`, marked `optional: true` so
# Grafana starts before oracle publishes the key (the ADR-108 GO_USAGE_INGEST_TOKEN shape). Until
# then the datasource simply cannot connect; nothing else in Grafana is affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oracle-feedback-pg-ro
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: oracle-feedback-pg-ro
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ORACLE_FEEDBACK_PG_RO_PASSWORD
