# school.homelab.teststuff.net → the school site (argocd/resources/school/, Service school in ns school,
# permitted by the ReferenceGrant shipped beside it). LAN/VPN-only, like every *.homelab name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: school
  namespace: homelab-gateway
spec:
  parentRefs:
    - name: homelab-gateway
  hostnames:
    - school.homelab.teststuff.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: school
          namespace: school
          port: 80
