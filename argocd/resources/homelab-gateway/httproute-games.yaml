# games.homelab.teststuff.net → the games site (argocd/resources/games/, Service games in ns games,
# permitted by the ReferenceGrant shipped beside it). LAN/VPN-only, like every *.homelab name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: games
  namespace: homelab-gateway
spec:
  parentRefs:
    - name: homelab-gateway
  hostnames:
    - games.homelab.teststuff.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: games
          namespace: games
          port: 80
