# Log-volume ingest belt, aggregate half (homelab#811). WHY THIS EXISTS: on 2026-08-19..24 a
# single pod (prometheus-pushgateway, 256KB "inconsistent help strings" lines) ramped Loki ingest
# 0.9 → 48.7 GiB/day — 98% of everything ingested — and filled the loki Garage bucket to its hard
# cap before anything alerted, because NOTHING watched log volume: Loki itself was not even
# scraped. The belt has three straps across two systems:
#   • per-namespace ABSOLUTE (LokiNamespaceLogVolumeHigh, below) — attributes the flood to ONE
#     tenant. Was a per-POD LogQL alert in the Loki ruler until ADR-118 step 2; tenancy killed
#     that home (a ruler rule is per-tenant-directory, so it would have needed one mount per
#     namespace and lost every namespace added afterwards, silently). The distributor counter
#     carries a `tenant` label for free, so this strap now covers new namespaces automatically
#     and — unlike LogQL — is promtool-testable. Granularity cost: pod → namespace, which the
#     #811 shape tolerates with room (see SIZING).
#   • aggregate ABSOLUTE (LokiIngestVolumeHigh, below) — a flat ceiling no healthy day touches.
#   • aggregate RAMP (LokiIngestVolumeRamp, below) — deviation vs the system's own 7d baseline,
#     with a clamp_min FLOOR so a quiet system's first real logging can never fire it (a ramp
#     alert without a floor pages on 100 B/s → 5 KB/s, which is nothing).
# SIZING, all measured 2026-08-24: pre-flood baseline ~12-18 KB/s total (~1-1.5 GiB/day raw);
# the #811 flood 590 KB/s (48.7 GiB/day) — 30-50x baseline. Absolute 120 KB/s ≈ 10 GiB/day sits
# ~8x above baseline and 5x under the flood; ramp 8x-of-baseline catches a recurrence in ~2.5h
# even if baseline drifts up; floor 25 KB/s ≈ 2 GiB/day. The distributor counter resets on a Loki
# roll — rate() bridges resets, and the recording rule is what gives the ramp a 7d baseline that
# survives them. Behaviour pinned in loki-ingest.promtool-test (all three alerts + the floor).
# PER-NAMESPACE SIZING, re-measured live 2026-08-27 rather than inherited from the #811 write-up:
# the loudest whole namespace is argocd at 2.0 KB/s (then garage 1.5, forgejo 0.6, agent-coordinator
# 0.6, registry-cache 0.6). The 25 KB/s threshold therefore keeps ~12x headroom over the loudest
# legitimate namespace and sits ~24x under the #811 flood (590 KB/s) — the same threshold the
# per-pod rule used, and it still discriminates at the coarser grain. What it cannot see is one
# chatty pod inside an already-busy namespace; that is an accepted trade, and pod attribution is
# one Grafana query away (in the annotation below).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-ingest
  namespace: loki
  labels: { app: loki }
spec:
  groups:
    - name: loki-ingest
      rules:
        - record: loki:distributor_ingest_bytes:rate30m
          expr: |
            sum(rate(loki_distributor_bytes_received_total[30m]))
        - alert: LokiNamespaceLogVolumeHigh
          expr: |
            sum by (tenant) (rate(loki_distributor_bytes_received_total[30m])) > 25000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Namespace {{ $labels.tenant }} is logging {{ $value | printf \"%.0f\" }} B/s (>2GiB/day)"
            description: "One namespace is producing more than ~2GiB/day of log volume — the #811 class (a 256KB-per-line error flood filled the loki Garage bucket in 6 days while nothing alerted). The whole cluster's baseline is ~1-2GiB/day total and the loudest healthy namespace is ~2KB/s, so this is ~12x above normal for a single namespace. Attribute and fix the EMITTER (or its trigger) rather than raising the threshold. The tenant label IS the namespace (ADR-118). Narrow to the pod: sum by (pod) (bytes_over_time({namespace=\"{{ $labels.tenant }}\"}[6h])) in Grafana Explore, or the Loki volume API (index/volume, aggregateBy labels). Before ADR-118 this was LokiPodLogVolumeHigh, evaluated per-pod by the Loki ruler."
        - alert: LokiIngestVolumeHigh
          expr: |
            loki:distributor_ingest_bytes:rate30m > 120000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Loki is ingesting {{ $value | humanize }}B/s (>10GiB/day) — something is flooding the log store"
            description: "Aggregate log ingest is ~8x the measured healthy baseline (~12-18KB/s). The #811 class: one pathological emitter filled the loki Garage bucket to its hard cap in 6 days, wedging flush AND the compactor. Attribute the namespace with LokiNamespaceLogVolumeHigh, then the pod with the volume API, then fix the EMITTER — the bucket cap is the belt, not the fix."
        - alert: LokiIngestVolumeRamp
          expr: |
            loki:distributor_ingest_bytes:rate30m > clamp_min(8 * avg_over_time(loki:distributor_ingest_bytes:rate30m[7d]), 25000)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Loki ingest {{ $value | humanize }}B/s is >8x its own 7d average — a new log flood is ramping"
            description: "Log volume deviates hard from this system's own trailing week. Fires only above a 25KB/s (~2GiB/day) floor, so a quiet system growing its first real workload stays silent — this alert is for the 30-100x pathological ramps (#811: 0.9→48.7GiB/day over 5 days while under every static radar until the bucket hit its cap). Attribute per-namespace via LokiNamespaceLogVolumeHigh, then per-pod via the volume API."
    # ── The kernel-log belt (FU-247) ─────────────────────────────────────────────────────────────
    # WHY THIS EXISTS: the `page_table_check` oops sat in Loki from 2026-09-10 09:38, node-labelled,
    # matching `{namespace="loki",container="kmsg-reader"} |~ "kernel BUG at|Oops:"` — and nothing
    # read it for six days while wk-03 and then nx-01 rebooted themselves every ~15 min
    # (docs/incidents/2026-09-16-page-table-check-reboots.md). Shipping the kernel log was never the
    # gap; READING it was.
    # WHERE THE COUNTER COMES FROM: a stage.match + stage.regex + stage.metrics counter in
    # argocd/resources/loki/alloy-config.yaml, scraped by podmonitor-alloy.yaml — NOT a Loki ruler.
    # The ruler is gone by decision (ADR-118 / docs/loki-tenancy.md §The belt could not stay in the
    # ruler): its rules are per-tenant DIRECTORIES, so it needs one static mount per namespace and
    # covers every namespace added later with nothing, silently. Same reasoning that moved the
    # #811 volume belt above out of it; the pattern set's own rationale lives with the stage.
    # THE SERIES NAME IS HALF-INHERITED — Alloy prefixes a stage.metrics counter with its own
    # default and the stage names only the suffix. Nothing in devbox ships an `alloy` binary, so
    # this was pinned OUT of band before merge: `nix shell nixpkgs#grafana-alloy` (1.17.1) running
    # THIS ConfigMap's rendered config against a fake kmsg file, 2026-09-23. It exposed exactly
    #     loki_process_custom_kernel_oops_lines_total{namespace="loki",container="kmsg-reader",node="…"} 1
    # for a `kernel BUG at` line and did not move for two ordinary ones. ⚠ The deployed Alloy is
    # v1.5.1 (alloy.yaml), so the version that emits the name in production is not the version that
    # was measured — the post-merge probe in the FU-247 PR still reads the name off a pod's own
    # /metrics before this belt is trusted. A wrong prefix here is a silent no-op, which is the one
    # failure this belt must not have.
    - name: kernel-oops
      rules:
        - alert: KernelOopsCaptured
          # RESTART SEMANTICS — why this is not a plain increase(). Two restarts move this counter:
          #   • ALLOY restarts (config-hash bump, node reboot) → the counter RESETS. increase()
          #     bridges resets, which is the second disjunct's job.
          #   • KMSG-READER restarts → it REPLAYS the kernel ring buffer (kmsg-reader.yaml §RESTART
          #     REPLAY), so an old oops is counted again — under a NEW pod label, i.e. a new child
          #     series starting at 1. `sum by (node)` first, then compare to 6 h ago, is what keeps
          #     one six-day-old oops from re-firing this alert on every replay: the node's total
          #     only has to be HIGHER than it was 6 h ago.
          # And why not `> 0` alone: the metric does not exist until the first matching line (the
          # stage's `source` gate), so a plain increase() misses the FIRST oops on a node — a single
          # sample, never a delta — which is the exact event this alert is for. The
          # `or <current> * 0` fallback supplies the missing 6 h-ago value as zero, so a series that
          # was BORN inside the window fires; 6 h after the last line both disjuncts fall to 0 and
          # the alert self-clears without any reliance on metric pruning.
          expr: |
            (sum by (node) (loki_process_custom_kernel_oops_lines_total)
               - (sum by (node) (loki_process_custom_kernel_oops_lines_total offset 6h)
                  or sum by (node) (loki_process_custom_kernel_oops_lines_total) * 0)) > 0
            or sum by (node) (increase(loki_process_custom_kernel_oops_lines_total[6h])) > 0
          # No `for:` — one captured fault dump IS the event (the incident shipped only 3 of 7), and
          # the 6 h window already debounces it. Same reasoning as node-reboots' changes() rules.
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }} printed {{ $value | printf \"%.0f\" }} kernel fault-dump line(s) in the last 6 h"
            description: >-
              The kernel on {{ $labels.node }} printed oops/BUG/fault-dump lines into /dev/kmsg — a
              SYMPTOM, not a diagnosis: this matches a fatal oops, a #GP, a NULL-deref AND a
              non-fatal WARN_ON backtrace, so read the lines before concluding anything. They are in
              Loki (Grafana Explore, tenant `loki`):
              {namespace="loki",container="kmsg-reader",node="{{ $labels.node }}"} |~ "kernel BUG at|Oops:|general protection fault|BUG: unable to handle kernel|Call Trace:"
              — widen to the whole stream for the ~20 lines around the dump. If the box also
              rebooted (NodeRebootedTwiceIn24h / NodeRebootingRepeatedly, pve-metrics), the dump is
              the reboot's cause and the panic line itself is NOT here: a userspace reader cannot
              ship it, only a console can. The known instance of this class was the upstream
              PAGE_TABLE_CHECK bug on Talos < v1.13.10 (docs/incidents/2026-09-16-page-table-check-reboots.md);
              a new one starts by reading the RIP/Comm lines, not by assuming that one.
