# Loki single-binary config. Chunks + index live in Garage S3 (bucket `loki`); only working dirs +
# caches are on the local PVC. Retention = 168h (7 days) enforced by the compactor. Creds come from
# the Crossplane-written loki-garage-s3 secret via env + `-config.expand-env=true`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: loki
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: aws
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      aws:
        endpoint: garage.garage.svc.cluster.local:3900
        bucketnames: loki
        access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
        s3forcepathstyle: true
        insecure: true
        region: garage
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: aws
      compaction_interval: 10m

    limits_config:
      retention_period: 720h          # 30 days — measured 12MiB after 26d of ingest (FU-030,
                                      # archived 2026-07-25): volume is trivial, history is the
                                      # scarce thing in incident archaeology (the 3-day-stall class)
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      volume_enabled: true
      max_query_lookback: 168h

    ruler:                            # homelab#811: the per-pod log-volume belt runs IN the ruler
      storage:                        # (LogQL — per-pod volume never leaves Loki); rules come from
        type: local                   # the loki-ruler-rules ConfigMap mounted under
        local:                        # /etc/loki/rules/<tenant>; "fake" is the single-tenant dir
          directory: /etc/loki/rules  # name when auth_enabled=false.
      rule_path: /loki/ruler-scratch  # scratch on the PVC (ruler needs a writable copy)
      alertmanager_url: http://alertmanager-operated.monitoring.svc.cluster.local:9093
      enable_alertmanager_v2: true    # AM >=0.27 removed the v1 API; without this every
                                      # notification 404s silently

    analytics:
      reporting_enabled: false
