# Loki single-binary config. Chunks + index live in Garage S3 (bucket `loki`); only working dirs +
# caches are on the local PVC. Retention = 168h (7 days) enforced by the compactor. Creds come from
# the Crossplane-written loki-garage-s3 secret via env + `-config.expand-env=true`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: loki
data:
  config.yaml: |
    auth_enabled: true               # ADR-118 step 2. NOT authentication — it makes Loki REQUIRE
                                     # and TRUST X-Scope-OrgID; the authenticating hop is
                                     # loki-rbac-proxy.yaml. Every WRITER must send the header or
                                     # its pushes 401: Alloy (stage.tenant, per namespace) and the
                                     # OTel collector (static `monitoring`, otel-config.yaml).
                                     # docs/loki-tenancy.md.

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: aws
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      aws:
        endpoint: garage.garage.svc.cluster.local:3900
        bucketnames: loki
        access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
        s3forcepathstyle: true
        insecure: true
        region: garage
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: aws
      compaction_interval: 10m

    limits_config:
      retention_period: 720h          # 30 days — measured 12MiB after 26d of ingest (FU-030,
                                      # archived 2026-07-25): volume is trivial, history is the
                                      # scarce thing in incident archaeology (the 3-day-stall class)
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # ⚠ limits_config is PER TENANT. Until ADR-118 step 2 there was one tenant, so these two
      # numbers were an effective whole-cluster ceiling; from the flip each namespace gets its own
      # 8 MB/s, and the aggregate ceiling rose ~32x as a SIDE EFFECT of the flip. Left at 8
      # deliberately (no per-tenant regression) — sizing a real per-tenant limit needs the
      # per-namespace baselines the flip itself produces, and tightening trades bucket-fill risk
      # for 429s and dropped lines. FU-192 sizes it after a week of data. Until then the #811
      # containment is the alert belt (prometheusrule.yaml) + the Garage bucket cap, NOT this.
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      volume_enabled: true
      max_query_lookback: 168h

    querier:
      multi_tenant_queries_enabled: true   # lets ONE query span tenants via `X-Scope-OrgID: a|b|c`
                                           # — the operator's Grafana datasource is the only user
                                           # (grafana-loki-datasource.yaml). Key placement verified
                                           # against the running binary's own resolved config
                                           # (`loki -print-config-stderr`), not the docs, which do
                                           # not list it. ⚠ upstream: /loki/api/v1/tail 400s when
                                           # more than one tenant is named, so Grafana's Live tail
                                           # does not work on that datasource (FU-192).

    # NO ruler block, deliberately. homelab#811's per-pod belt used to run here, reading LogQL rules
    # from /etc/loki/rules/<tenant>. That does not survive tenancy: with tenant == namespace, a rule
    # in the `fake` dir evaluates over a tenant nothing writes to any more — the belt goes silently
    # green — and covering every tenant would mean one mount per namespace, so namespace N+1 loses
    # the belt with nothing saying so. The belt moved to an ordinary PrometheusRule instead
    # (prometheusrule.yaml, LokiNamespaceLogVolumeHigh): loki_distributor_bytes_received_total
    # already carries a `tenant` label, so a new namespace is covered the moment it logs, and the
    # expr became promtool-testable, which the LogQL one never was. docs/loki-tenancy.md §Rollout.

    analytics:
      reporting_enabled: false
