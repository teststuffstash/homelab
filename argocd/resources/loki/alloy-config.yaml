# Alloy (River) config: discover pods ON THIS NODE only (field selector via the downward-API
# NODE_NAME, so a DaemonSet doesn't ship every pod's logs N times), label them, tail via the K8s API,
# and push to Loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: loki
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      // ADR-118, the WRITE half of Loki multi-tenancy. `__tenant_id__` is Alloy's reserved
      // per-entry tenant label: loki.write consumes it and sets X-Scope-OrgID per push, so one
      // write component still serves every tenant. Reserved `__`-prefixed labels are stripped
      // from the stored stream, so this adds no cardinality.
      //
      // tenant == NAMESPACE, deliberately, and the reason is on the READ side: the
      // authorizing proxy in front of Loki splits its authorization header per OCCURRENCE, not
      // per delimiter (verified in kube-rbac-proxy v0.22.1 pkg/proxy/proxy.go), so Loki's
      // `a|b|c` multi-tenant syntax would authorize against a namespace literally named "a|b|c".
      // One tenant per query is the shape that works, and namespace needs no mapping table here
      // — nothing in this file changes when a stack gains a namespace. Full reasoning:
      // docs/loki-tenancy.md §Why tenant == namespace.
      //
      // ⚠ INERT until loki-config.yaml flips `auth_enabled: true` — a single-tenant Loki ignores
      // the header entirely. Landing the write half FIRST is what makes the flip verifiable
      // instead of a leap; docs/loki-tenancy.md §Rollout has the ordered steps.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "__tenant_id__"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
