# kmsg-reader — ship each node's kernel ring buffer (/dev/kmsg) to Loki as pod stdout.
#
# WHY (homelab#541, Path A of the talosctl question): the PodSigkilled / node-truth family
# (#63/#65/#68/#100/#101/#153/#472) converges on one demand — the kernel log (OOMController
# lines, cgroup kills, sandbox teardown context). Every agent session already has LogQL access to
# Loki, so kernel-log truth becomes reachable by EVERY lane through the log stack: no new
# credential class, no talosctl binary, no os:reader cert lifecycle (that grant waits on #536's
# TOOL_GAP inventory).
#
# WHY A POD, NOT ALLOY: Alloy v1.5.1 (argocd/resources/loki/alloy.yaml, the deployed pin) has NO
# loki.source.kmsg component — its kmsg support arrived in a later version. Rather than bump the
# log collector for one source, we use the deliverable's stated fallback: a tiny reader whose
# stdout already flows through Alloy's pod-log pipeline (loki.source.kubernetes.pods on every
# node) with node attribution for free. No Alloy config change at all.
#
# HOW THE READ WORKS: /dev/kmsg yields "<prio>,<seq>,<clock>,<flags>[;caller];<message>"
# records (the same format `talosctl dmesg` reads, siderolabs/go-kmsg). `cat` emits them
# verbatim; Alloy timestamps the Loki entry at ship time. Talos routes service logs into the
# kernel log (KmsgLogStorageController), so OOMController lines ("OOM controller triggered",
# FU-082's confirmation string) and kubelet/containerd context all appear here.
#
# RESTART REPLAY (item 2): opening /dev/kmsg non-follow replays the CURRENT ring buffer from the
# oldest retained record. A pod restart (DaemonSet rollout, node reboot) therefore re-emits
# whatever is still in the ring — bounded by the kernel's ring size (Talos default ~1MiB), so on
# a healthy node that is minutes of messages, not an event storm. Queries must not read a
# restart's replay as a fresh incident; correlate the LogQL timestamp with the node's uptime /
# the alert time. Idempotent-ish: a replay may duplicate records already shipped before the
# restart, which is fine for grep-shaped queries (line-oriented, no aggregates).
#
# VOLUME (item 3): kernel messages are low-rate on healthy nodes (a handful of lines per minute);
# bursts are the signal, not the noise. No filtering in the reader — filter at query time with
# LogQL (|~ "OOM controller" etc.). Add a drop stage in Alloy only if measurement shows a node
# producing sustained noise.
#
# SECURITY: read-only info-disclosure surface = kernel messages (no secrets in kmsg under normal
# operation; no machine config, no Talos API). Privileged/CAP_SYSLOG is required to read the
# device; the container runs busybox (no shell logic beyond `cat`), and the hostPath is read-only.
# PSS note: the loki namespace opts up to privileged via the logging Application's
# managedNamespaceMetadata (argocd/platform/logging.yaml) — the trim-pod/fstrim precedent
# (runbook.md) — because Talos baseline (the cluster default) rejects privileged elsewhere.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kmsg-reader
  namespace: loki
  labels: { app: kmsg-reader }
spec:
  selector:
    matchLabels: { app: kmsg-reader }
  template:
    metadata:
      labels: { app: kmsg-reader }
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false   # reads a host device + stdout only — no k8s API access
      tolerations:
        - operator: Exists           # every node incl. control-plane + ephemeral/kata tier — the
                                     # OOM evidence is precisely from the hot nodes
      hostNetwork: false
      containers:
        - name: kmsg-reader
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          args:
            - cat
            - /dev/kmsg
          securityContext:
            privileged: true          # required to open /dev/kmsg (CAP_SYSLOG); baseline PSS rejects
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: kmsg, mountPath: /dev/kmsg, readOnly: true }
          resources:
            requests: { cpu: "5m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
      volumes:
        - name: kmsg
          hostPath: { path: /dev/kmsg, type: CharDevice }
