# Alloy log collector — one per node (DaemonSet), tolerating all taints so the tainted metal/compute
# nodes are covered too. API-based (no hostPath), so it runs fully non-root.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: loki
  labels: { app: alloy }
spec:
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
      annotations:
        # ⚠ THE ONLY THING THAT ROLLS THIS DaemonSet WHEN alloy-config.yaml CHANGES. A ConfigMap
        # edit alone does NOT restart pods (raw manifests compute no checksum, and alloy's args
        # carry no reload flag), so an un-bumped value here means the change is IN THE CLUSTER and
        # NOT IN EFFECT — the written-is-not-applied class, and silent: `kubectl get cm` shows the
        # new config while every pod still runs the old one. Caught live 2026-08-27: ADR-118's
        # `__tenant_id__` rule synced into the ConfigMap while the pods dated from 2026-06-29,
        # 07-28 and 08-18. Had `auth_enabled: true` landed on top of that, every push would have
        # been rejected for a missing tenant and cluster-wide ingest would have stopped.
        # BUMP THIS IN THE SAME COMMIT AS ANY alloy-config.yaml CHANGE.
        # (The durable fix is a real content hash — needs a kustomize configMapGenerator here,
        # which this directory does not use today; FU-190.)
        config-hash: v3-adr118-stage-tenant
    spec:
      serviceAccountName: alloy
      tolerations:
        - operator: Exists           # collect logs from tainted nodes too (metal/compute tier)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          ports:
            - { name: http, containerPort: 12345 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /tmp/alloy }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          emptyDir: {}
