# Alloy self-metrics → Prometheus (FU-247). Alloy has exposed :12345/metrics since it was deployed
# and NOTHING scraped it: the only monitor in this directory selects `app: loki`, i.e. the log
# STORE. That gap is what made ADR-118's `loki_write_sent_entries_total{tenant=""}` a hand-probe on
# a running pod rather than a series, and it is why the kernel-oops counter added in
# alloy-config.yaml needs a scrape before any rule can read it.
#
# PodMonitor, not ServiceMonitor: Alloy is a DaemonSet with no Service. `port: http` matches the
# DaemonSet's DECLARED containerPort name (alloy.yaml) — unlike the cloudflared PodMonitor next
# door, which had to rewrite __address__ because its tofu Deployment declares no ports.
#
# SELECTOR REQUIREMENTS, checked rather than assumed (a monitor the operator does not select is a
# silent no-op): argocd/platform/values/kube-prometheus-stack.yaml sets
# `podMonitorSelectorNilUsesHelmValues: false` and defines NO `podMonitorSelector`, so the
# Prometheus CR's selector is nil = "every PodMonitor", and the chart's default
# podMonitorNamespaceSelector `{}` = "every namespace". Live proof rather than doc-reading: the
# cloudflared PodMonitor lives in ns `cloudflared` with `app: cloudflared` labels and is scraped.
# The `app: alloy` label below is therefore identification, not a selector key.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: alloy
  namespace: loki
  labels: { app: alloy }
spec:
  namespaceSelector:
    matchNames: [loki]
  selector:
    matchLabels: { app: alloy }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 60s
      relabelings:
        # `node` is what KernelOopsCaptured names the machine by. It is a TARGET label here, taken
        # from the pod's node — which is the same node the counter's own stream label carries,
        # because Alloy only discovers pods on its own node (the NODE_NAME field selector in
        # alloy-config.yaml). Prometheus resolves the collision by keeping the target's `node` and
        # renaming the sample's to `exported_node`; both hold the same value, so the alert names the
        # right box under either reading — and it still names it if a future Alloy drops stream
        # labels from custom metrics.
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
      metricRelabelings:
        # KEEP-LIST, deliberately. Alloy exports its whole internal surface (component, scrape,
        # runtime, Go); this is 13 DaemonSet pods and this Prometheus has already been sized by
        # incident (8Gi limit, query.maxConcurrency 40 — homelab#153). Kept: the custom metrics this
        # scrape exists for (`loki_process_custom_*` — the FU-247 counter), the write/ingest side
        # ADR-118 verification reads (`loki_write_*`, incl. the `tenant=""` witness), the tailer's
        # own health (`loki_source_*`), and build info for version drift. `up{job=...alloy}` is
        # generated by the scrape itself and is NOT subject to this list, so collector death stays
        # visible. ⚠ A typo here is a SILENT no-op — the post-merge probe in the FU-247 PR checks
        # the series exists in Prometheus, not just in the pod's /metrics.
        - sourceLabels: [__name__]
          regex: 'loki_process_custom_.*|loki_write_.*|loki_source_.*|alloy_build_info'
          action: keep
