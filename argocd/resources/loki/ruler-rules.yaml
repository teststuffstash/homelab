# Loki ruler rules (homelab#811) — the PER-POD half of the log-volume belt. This is a LogQL alert
# evaluated by Loki's own ruler (mounted at /etc/loki/rules/fake — "fake" is the tenant dir when
# auth_enabled=false), firing straight to Alertmanager; per-(namespace,pod) volume never leaves
# Loki, so Prometheus cannot hold this half (its aggregate + ramp belts read the distributor
# counter — see prometheusrule.yaml, one file over).
# ⚠ Not promtool-testable (LogQL) — behaviour was verified live against the #811 flood shape:
# prometheus-pushgateway measured 590KB/s (48.7GiB/day) vs the next-chattiest whole NAMESPACE at
# 2.8KB/s (236MiB/day). Threshold 25000 B/s ≈ 2.1GiB/day/pod sits ~9x above that gap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
  namespace: loki
data:
  volume.yaml: |
    groups:
      - name: log-volume
        rules:
          - alert: LokiPodLogVolumeHigh
            expr: |
              sum by (namespace, pod) (bytes_rate({namespace=~".+"}[30m])) > 25000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} is logging {{ $value | printf \"%.0f\" }} B/s (>2GiB/day)"
              description: "One pod is producing more than ~2GiB/day of log volume — the #811 class (a 256KB-per-line error flood filled the loki Garage bucket in 6 days while nothing alerted). Attribute and fix the EMITTER (or its trigger) rather than raising this threshold: the whole cluster's baseline is ~1-2GiB/day total. Breakdown query: the Loki volume API (index/volume, aggregateBy labels) or Grafana Explore sum by (pod) (bytes_over_time({namespace=\"<ns>\"}[6h]))."
