# nginx as a transparent PULL-THROUGH cache for https://cache.nixos.org. Agent sandbox pods set it as
# a higher-priority nix substituter; the first miss fetches upstream and caches the (immutable) narinfo
# + nar to the Longhorn PVC, every run after is LAN-speed. Bodies pass through byte-for-byte, so the
# upstream cache.nixos.org signatures stay valid — no new trusted key is needed on the clients.
#
# ⚠ MAINTENANCE CONTRACT (issue #519): deployment.yaml mounts this file via subPath, so kubelet never
# live-refreshes it — only a new pod spec rolls. Editing this file requires recomputing the
# Deployment's `checksum/config` annotation in the SAME commit (`sha256sum
# argocd/resources/nix-cache/configmap.yaml`), else the old config keeps running with git and the
# cluster both green (the #500 inert-fix failure mode).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nixcache-nginx
  namespace: nix-cache
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      # immutable content → big cache, long retention; LRU evicts at max_size.
      proxy_cache_path /var/cache/nginx/nixcache levels=1:2 keys_zone=nixcache:50m
                       max_size=16g inactive=30d use_temp_path=off;
      proxy_temp_path /tmp/proxy_temp;
      access_log off;
      # cache.nixos.org (Fastly) publishes AAAA records but the pod net is IPv4-only — a static
      # proxy_pass hostname resolves at config load and pins the AAAA, wasting a connect() per attempt
      # (101: Network unreachable, seen continuously 2026-08-09→today). Runtime resolver + ipv6=off
      # (same shape as cf-api-proxy); valid=30s re-resolves the CDN per-TTL.
      resolver 10.96.0.10 valid=30s ipv6=off;
      server {
        listen 8080;
        # readiness — cheap, no upstream dependency.
        location = /healthz { return 200 "ok\n"; }
        location / {
          set $nix_upstream https://cache.nixos.org;
          proxy_pass $nix_upstream;                    # variable → runtime-resolved via resolver above
          proxy_set_header Host cache.nixos.org;
          proxy_ssl_server_name on;
          proxy_ssl_name cache.nixos.org;              # explicit — variable proxy_pass must not lose SNI
          proxy_http_version 1.1;
          proxy_set_header Connection "";

          proxy_cache nixcache;
          proxy_cache_key "$request_uri";
          proxy_cache_valid 200 301 302 30d;           # store paths are immutable
          proxy_cache_valid 404 1m;                     # nix probes many missing narinfo; don't pin 404s
          proxy_cache_lock on;                          # collapse concurrent identical pulls (many pods)
          proxy_cache_revalidate on;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          proxy_max_temp_file_size 8192m;               # large nars
          add_header X-Cache-Status $upstream_cache_status always;
        }
      }
    }
