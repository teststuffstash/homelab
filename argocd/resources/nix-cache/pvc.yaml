# Cache storage. Pure regenerable cache (anything lost is re-fetched from upstream), so size is a
# cost/throughput knob, not durability — the default replicated Longhorn SC is fine at this size.
# Must stay comfortably above the nginx max_size in configmap.yaml: the cache ran AT its 8g eviction
# ceiling (homelab#500), so a bump moves both values together, not one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nixcache-data
  namespace: nix-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
