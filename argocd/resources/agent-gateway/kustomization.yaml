# agent-gateway — the LLM egress gateway island's deploy (gateway/ is the build; this dir is the
# cluster shape). PARALLEL to openrouter-proxy (operator, 2026-10-15): the old router stays
# untouched; this app adds a second service to the SAME namespace. No namespace.yaml — the
# namespace exists and is owned by the openrouter-proxy app. NO `namespace:` transformer either:
# rbac.yaml's Roles live in the loop/repo namespaces and each manifest names its own (the
# upgrade-lease-reader precedent).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - codex-seed.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # the specs-site bucket + keys (gateway-specs-garage Workspace, connection Secret gateway-specs-s3)
  - garage-workspace.yaml

# The v0 policy (gateway/specs/endpoints/sessions.md — GW-SESSIONS-ADMIT; anthropic-messages.md —
# GW-MODEL-RESOLVE): per-stack credential refs, per-role allowed rails in preference order,
# per-(rail,tier) model, per-rail max_sessions (+ side_models), per-model context_tokens, session
# TTL. NO model id lives in gateway code — only here. SHAPE = gateway/specs/worlds/policy-default.json
# (the test world); gateway/tests/test_model_resolve.py loads policy.json through the island's
# loader and checks every id against model-classes.json, so the two cannot drift silently.
#
# stacks: one entry per AgentStack claim (circles / oracle / platform / sleep, 2026-10-15). Both refs
# point at the stack's mainRepo namespace, because that is where the Secrets live TODAY — every
# OpenRouter key is `<repo>/<repo>-openrouter` (no loop-ns OpenRouter key exists) and every ride's
# `claude-session` is read as `ref:<project>/claude-session` by agents/agent-session.sh. `loop_ns`
# is the stack's loop namespace (`<stack>-agents`); its `claude-session` exists for platform +
# oracle only (the Composition renders the ExternalSecret for all four — sleep-agents and
# circles-agents hold none live), so the policy does not lean on it.
# models: DERIVED (GW-MODEL-TIERS, operator rulings 2026-10-18 + 2026-10-19) — the four rails'
# tier lists are the output of `devbox run tiers -- apply` over benchmarks.json beside this file
# (the committed tier evidence: every candidate per rail with its Artificial Analysis row, its
# price, its clean-ride evidence and its Go limit; the `tiers` block in policy.json holds the
# rules — intelligence bands 0.9/0.75/0.5 of the rail's best, cheapest per CLEAN ride first
# (`tiers.cost`), cap 3, the subscription rail by score ascending) and a test row
# (gateway/tests/test_model_tiers.py) fails on a hand edit. Refresh = `gateway/scripts/
# benchmarks-snapshot.sh`, then `apply`, commit both; the snapshot ships in this ConfigMap too
# (GATEWAY_BENCHMARKS) so its age alerts (TierEvidenceStale, 7 d). A tier with no priced
# candidate is UNDECIDED and keeps its list. The SPELLING stays model-classes.json's
# `models.*.ids` (`claude/<alias>`, `opencode-go/<id>`, bare openrouter ids); the gateway derives
# the wire id by stripping the rail prefix (`claude/sonnet` → `sonnet`, which claude-code resolves
# client-side; `opencode-go/mimo-v2.6-flash` → `mimo-v2.6-flash`), the same strip
# agents/agent-session.sh performs today. Candidates: opencode = the Go catalog's listed models
# with a monthly limit under `plan` (GW-CATALOG-GO's live read, kept in the snapshot — so the Go
# rail's ids are never checked against model-classes.json, which carries no Go id for most of
# them: the old proxy's table, untouched), each at the Go PRICE (the plan fee over what it bought:
# list x fee / max(the rail's 30-day draw, the model's limit)); openrouter = the OpenRouter
# catalog's models (GW-CATALOG-OR), each at its SELECTED endpoint's price — null until a cell
# passed the entry canary (2026-10-20: all of them, so the openrouter lists stand as last derived);
# anthropic = the three `claude/` aliases; codex = the ENROLLED account's model evidence (CODEX_CANDIDATES
# of benchmarks-snapshot.sh: 2026-10-22 one id, gpt-6-astra, from the leg-E usage probe — FU-270). History: opencode heavy first left model-classes.json's
# opencode-go claude-sonnet id (#2663 — 400 "Model is unavailable" upstream, kimi-k3 rejected as
# too expensive for review), then every tier sat on deepseek-v4.1-flash by hand (2026-10-17) once
# deepseek-v4-flash left the Go catalog (docs/spikes/opencode-go-catalog.md); the derivation
# replaces both hand picks.
# side_models (anthropic): claude-code's small side-calls name the haiku family
# (ANTHROPIC_SMALL_FAST_MODEL default) under a sonnet session — admitted ⚖ (GW-MODEL-RESOLVE).
# codex (LIT 2026-10-22, FU-270): the ChatGPT-subscription rail — lit as the explicit canary cell (`prober`
# only), opened to EVERY role 2026-10-23 (operator ruling: subscriptions go to all roles; the walk's harness
# follows the rail — sessions.md §The harness follows the rail; the block's _comment cites every ⚖ value; the
# credential is the gateway's own login, `devbox run codex-seed`).
# roles.*.rails ORDER (2026-10-23) is the operator's weekly knob — re-order to move a role between
# subscriptions; a week's tokens drained on purpose fall through to the next rail: the claude-harness roles
# anthropic → opencode → codex; the opencode-harness roles opencode → codex → anthropic → openrouter (the
# metered rail last); the prober keeps openrouter FIRST (its probes are that rail's cells).
# max_sessions: anthropic 5 = the old proxy's SUBSCRIPTION_MAX_RUNNING; opencode 3 =
# model-classes.json `rails.opencode-go.concurrency` (the declared Go bound); openrouter 20
# (per-token, bounded by key budgets not slots).
# context_tokens: per-model harness window for the NON-Go rails — none declared today; absent =
# null in the dispatch answer, never a guess. The Go rail's windows are NOT here: the gateway
# answers the Go catalog's `context` (models.dev under the console overlay, GW-CATALOG-GO) and an
# `opencode-go/*` entry here refuses the load (ruling 5; GW-SESSIONS-ENV). The 2026-10-17 hand copy
# of deepseek-v4.1-flash's console `limit.context` (1000000) left with FU-270 (d).
# admission (anthropic, opencode): the ladder's capacity half — RULES only: window utilization
# thresholds, the 429 hold and its scope (opencode: `latch_scope: model` — a Go 429 cools its cell,
# never the rail), the Go windows' thresholds + anchors (gateway/specs/endpoints/sessions.md
# §Capacity). The Go rail's prices, peak rows/hours, per-model monthly limits and window shares are
# NOT here: the gateway reads them from the vendor (the Go catalog, GW-CATALOG-GO; operator ruling
# 5, 2026-10-17). Every remaining value is COPIED from the old proxy (openrouter-proxy.py /
# gometer.py / its deployment.yaml) and cited in the block's _comment. Same block as the
# policy-default world.
# plan (opencode, GW-CATALOG-GO): the OpenCode Go plan the key is on — `go` ($10/month) — declared
# here because no vendor API says; it picks which plan tab's per-model monthly limits the Go catalog
# leg reads (gateway/specs/endpoints/catalog.md).
# roles: rails in preference order from model-classes.json's class table (role_defaults → classes
# → rails), harness = what agents/agent-session.sh derives for that rail today.
# callers + control_plane_auth (GW-SESSIONS-AUTH, FU-270): who may call POST /sessions and
# GET/DELETE /sessions/{id} and GET /sessions?task=, keyed by the projected-token ServiceAccount
# username. Exactly today's dispatchers plus the judge, no wildcard: `platform-agents:agentstack-loop` = the platform stack's graduated
# coordinator pod (agents/coordinator-session.sh --loop-ns), the one in-cluster agent-session.sh
# caller — worker admissions bound into the platform repo namespaces that hold an
# `agentstack-worker` SA (agent-runtime, homelab, openrouter-operator; `agent-coordinator` holds
# none, so a bind there could never be pulled ⚖); the jail canary mints this SA's token to act as
# it — and `prober` (2026-10-20): the ENTRY CANARY (gateway/scripts/canary-entrants.sh,
# AGENT_GATEWAY_ROLE=prober, GW-CATALOG-OR §The entry canary) rides as this SA, so without the
# role every canary admission was 403 caller-role-denied and no openrouter cell could become
# eligible; `prober` binds nothing (the canary pod is unbound). It also holds `coordinator` +
# `reviewer`, bound into its own `platform-agents` (2026-11-01, FU-270: the platform loop's
# coordinator and reviewer pods run there as this SA — granted ahead of the launchers that will use
# it). `agent-coordinator:agent-coordinator` = the coordinator namespace's SHARED SA — the responder,
# deep dig, island intake and fix-debounce workflows: `coordinator` + `responder`, unbound, no bind
# (shared, so the grant reaches every workflow on it — the #2685 per-SA split is the narrower
# alternative). `agent-coordinator:specs-review` = the specs-review tick + its shadow cells
# (agents/coordinator/specs-review-argo.yaml), their OWN ServiceAccount since #2685 (callers are
# per SA; as `agent-coordinator` the key covered every workflow in that namespace): `reviewer`, and
# `worker` for the goose@openrouter shadow cell (docs/agents/specs-reviewer.md §Shadow runs); it
# never binds. `agent-coordinator:outcome-judge` = the deploy-revert chain's judge step
# (agents/coordinator/deploy-revert-argo.yaml; FU-270 (b), #2785): admits nothing (no roles, no
# binds), `outcome: any` — it lists a task's sessions and reports `wrong-verdict` on the review
# sessions of a merge the chain reverted (GW-SESSIONS-OUTCOME). `enforce` since 2026-10-17
# (after #2687 made every caller send its token and the unauthenticated series stayed flat): a
# call with no valid caller token is 401; `observe` is the rollback knob.
#
# A configMapGenerator (flipped 2026-10-17, FU-270): the gateway reads policy.json ONCE at startup
# (gateway/src/agent_gateway/app.py Policy.load), and the plain ConfigMap this used to be left the
# pod on the old policy after #2663 synced until a manual rollout restart. The content-hash suffix
# renames the ConfigMap on every edit; kustomize rewrites deployment.yaml's volume reference to the
# new name, so an edit to policy.json now ROLLS the pod — no restart step. The old suffixed
# ConfigMap is pruned by the app's syncPolicy (prune: true). namespace + labels are set on the
# generator because this kustomization has no namespace transformer (header above).
configMapGenerator:
  - name: agent-gateway-policy
    namespace: agent-egress
    options:
      labels:
        app: agent-gateway
    files:
      - policy.json
      # GW-MODEL-TIERS: the committed tier evidence rides beside the policy (GATEWAY_BENCHMARKS) so the
      # gateway can say how old the prices it compares on are (gateway_tier_evidence_age_seconds →
      # TierEvidenceStale); a re-cut rolls the pod like a policy edit.
      - benchmarks.json

# The image pin — the ONLY line .github/workflows/gateway-image.yaml's deploy/agent-gateway pin PR
# edits (calver-gsha, `2026.<m>.<d>-g<sha12>`). 0.0.0-pending = no build has landed yet: the
# Deployment sits ImagePullBackOff until the first master push of gateway/** builds one. Nothing
# consumes :latest (none is pushed).
images:
  - name: ghcr.io/teststuffstash/agent-gateway
    newTag: 2026.11.1-g87edb64d9c44
