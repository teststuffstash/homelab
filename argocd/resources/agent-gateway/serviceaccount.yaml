# agent-gateway — the LLM egress gateway rebuilt as an island (gateway/, P2 of
# docs/spikes/context-and-autonomy.md; ADR-139 rename). Runs PARALLEL to openrouter-proxy in this
# namespace: its own name, Service, image and SA. The SA is what the per-namespace
# agent-gateway-session-keys Roles (rbac.yaml) bind — it resolves credential refs by reading
# LABELED session Secrets (openrouter.teststuff.net/session-key=true) and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-gateway
  namespace: agent-egress
