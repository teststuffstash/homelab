# The v0 policy (gateway/specs/endpoints/sessions.md — GW-SESSIONS-ADMIT; anthropic-messages.md —
# GW-MODEL-RESOLVE): per-stack credential refs, per-role allowed rails in preference order,
# per-(rail,tier) model, per-rail max_sessions (+ side_models), per-model context_tokens, session
# TTL. NO model id lives in gateway code — only here. SHAPE = gateway/specs/worlds/policy-default.json
# (the test world); gateway/tests/test_model_resolve.py loads THIS block through the island's
# loader and checks every id against model-classes.json, so the two cannot drift silently.
#
# stacks: one entry per AgentStack claim (circles / oracle / platform / sleep, 2026-10-15). Both refs
# point at the stack's mainRepo namespace, because that is where the Secrets live TODAY — every
# OpenRouter key is `<repo>/<repo>-openrouter` (no loop-ns OpenRouter key exists) and every ride's
# `claude-session` is read as `ref:<project>/claude-session` by agents/agent-session.sh. `loop_ns`
# is the stack's loop namespace (`<stack>-agents`); its `claude-session` exists for platform +
# oracle only (the Composition renders the ExternalSecret for all four — sleep-agents and
# circles-agents hold none live), so the policy does not lean on it.
# models: copied VERBATIM from argocd/resources/openrouter-proxy/model-classes.json `models.*.ids`
# (that file's spelling: `claude/<alias>`, `opencode-go/<id>`, bare openrouter ids). The gateway
# derives the wire id by stripping the rail prefix (`claude/sonnet` → `sonnet`, which claude-code
# resolves client-side; `opencode-go/deepseek-v4-flash` → `deepseek-v4-flash`), the same strip
# agents/agent-session.sh performs today. openrouter's tiers follow the `coding` class chain_head
# order (v4-flash, then v4.1-flash).
# side_models (anthropic): claude-code's small side-calls name the haiku family
# (ANTHROPIC_SMALL_FAST_MODEL default) under a sonnet session — admitted ⚖ (GW-MODEL-RESOLVE).
# max_sessions: anthropic 5 = the old proxy's SUBSCRIPTION_MAX_RUNNING; opencode 3 =
# model-classes.json `rails.opencode-go.concurrency` (the declared Go bound); openrouter 20
# (per-token, bounded by key budgets not slots).
# context_tokens: per-model harness window from model-classes.json `models.*.context_tokens` —
# the only declared one is the Go rail's deepseek-v4-flash; absent = null, never a guess.
# roles: rails in preference order from model-classes.json's class table (role_defaults → classes
# → rails), harness = what agents/agent-session.sh derives for that rail today.
#
# A plain ConfigMap (not a configMapGenerator): an edit here does NOT roll the pod — the gateway
# re-reads the policy on change, or the seat restarts it. Flip to the generator if the first
# canary shows a stale read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-gateway-policy
  namespace: agent-egress
  labels:
    app: agent-gateway
data:
  policy.json: |
    {
      "stacks": {
        "platform": {
          "loop_ns": "platform-agents",
          "openrouter_ref": "homelab/homelab-openrouter",
          "anthropic_ref": "homelab/claude-session"
        },
        "oracle": {
          "loop_ns": "oracle-agents",
          "openrouter_ref": "oracle-fleet/oracle-fleet-openrouter",
          "anthropic_ref": "oracle-fleet/claude-session"
        },
        "sleep": {
          "loop_ns": "sleep-agents",
          "openrouter_ref": "sleep-tracking/sleep-tracking-openrouter",
          "anthropic_ref": "sleep-tracking/claude-session"
        },
        "circles": {
          "loop_ns": "circles-agents",
          "openrouter_ref": "circles/circles-openrouter",
          "anthropic_ref": "circles/claude-session"
        }
      },
      "roles": {
        "worker":      {"rails": ["opencode", "openrouter"],  "tier": "standard", "harness": "opencode"},
        "reviewer":    {"rails": ["anthropic", "opencode"],   "tier": "heavy",    "harness": "claude"},
        "coordinator": {"rails": ["anthropic"],               "tier": "standard", "harness": "claude"},
        "responder":   {"rails": ["anthropic"],               "tier": "standard", "harness": "claude"},
        "retro":       {"rails": ["openrouter"],              "tier": "heavy",    "harness": "opencode"},
        "researcher":  {"rails": ["openrouter"],              "tier": "heavy",    "harness": "opencode"},
        "prober":      {"rails": ["openrouter", "opencode"],  "tier": "light",    "harness": "opencode"}
      },
      "rails": {
        "anthropic": {
          "max_sessions": 5,
          "side_models": ["claude/haiku"],
          "models": {
            "light":    "claude/haiku",
            "standard": "claude/sonnet",
            "heavy":    "claude/sonnet"
          }
        },
        "opencode": {
          "max_sessions": 3,
          "models": {
            "light":    "opencode-go/deepseek-v4-flash",
            "standard": "opencode-go/deepseek-v4-flash",
            "heavy":    "opencode-go/claude-sonnet-4-6"
          }
        },
        "openrouter": {
          "max_sessions": 20,
          "models": {
            "light":    "deepseek/deepseek-v4-flash",
            "standard": "deepseek/deepseek-v4-flash",
            "heavy":    "deepseek/deepseek-v4.1-flash"
          }
        }
      },
      "context_tokens": {
        "opencode-go/deepseek-v4-flash": 1000000
      },
      "session_ttl_s": 14400
    }
