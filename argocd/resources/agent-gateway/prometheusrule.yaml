# agent-gateway alerts — the gateway island's own belt (GW-METRICS families,
# gateway/specs/endpoints/metrics.md). The old openrouter-proxy's alerts stay in
# argocd/resources/openrouter-proxy/prometheusrule.yaml, untouched (operator, 2026-10-15).
# Behaviour fixture: agent-gateway.promtool-{rules,test} beside this file (hand copy of the
# groups below, drift-pinned by `devbox run prometheus-rules-lint`).
#
# GoRailCredentialRejected — born from the 2026-10-17 Go key expiry: the OpenCode Go API key
# expired upstream at 17:12:49Z, every Go call answered 401 `api_key_expired` for ~2 h, and the
# only alert that fired was AgentLoopWorkflowsFailing (a symptom, from 17:28Z). The gateway types
# an upstream 401 / credential-reason 403 as 424 `upstream-auth` (a policy-refusal 403 is 403
# `upstream-refused`, never counted here); gateway_upstream_auth_rejected_total is the event series
# that tells a dead credential from a dead upstream (gateway_credentials_rejected is the state).
#
# The shape, in three parts:
#   ONSET  = ≥3 auth rejections in 5m AND zero 2xx in the same 5m, on the opencode rail. Zero 2xx
#            is what keeps a per-model 403 (the free-model experiment saw a harness 403 typed as
#            upstream-auth) from paging while the rest of the rail answers: a bad KEY fails every
#            call, a bad request fails some.
#   HOLD   = the newest ONSET within 2h. A rail whose callers back off after the first failures
#            goes quiet, and quiet is not healed — the 2026-10-17 traffic stopped 16 minutes in.
#   CLEAR  = any 2xx window newer than the newest ONSET (the key works again), or 2h with no new
#            ONSET. ⚠ a counter series is born at its first sample, so the very first 2xx on a
#            freshly rolled pod is not an increase(); the second one clears. The rotation recipe
#            restarts the pod, so expect the clear one request late.
# Fires on ANY sustained rejection, not only expiry: a revoked or mistyped key looks the same.
# NOT bridged across a roll by `max by` alone — the counter is in-memory, but the HOLD's subquery
# reads the old pod's samples too, which is right: the credential outlives the pod.
# Old-proxy coverage: none. openrouter-proxy.py's Go leg counts only 429/402
# (router_go_observed_429_total) and keeps Go outcomes out of provider_events and the circuit
# breaker on purpose, so no existing old-proxy series sees a Go 401.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-gateway
  namespace: agent-egress
  labels:
    app: agent-gateway
spec:
  groups:
    - name: agent-gateway
      rules:
        - alert: GoRailCredentialRejected
          expr: |
            max by (rail) (max_over_time((timestamp((sum by (rail) (increase(gateway_upstream_auth_rejected_total{rail="opencode"}[5m])) >= 3) unless on (rail) (sum by (rail) (increase(gateway_requests_total{rail="opencode",status=~"2.."}[5m])) > 0)))[2h:1m]))
            unless on (rail)
            (max by (rail) (max_over_time((timestamp(sum by (rail) (increase(gateway_requests_total{rail="opencode",status=~"2.."}[5m])) > 0))[2h:1m])) > on (rail) max by (rail) (max_over_time((timestamp((sum by (rail) (increase(gateway_upstream_auth_rejected_total{rail="opencode"}[5m])) >= 3) unless on (rail) (sum by (rail) (increase(gateway_requests_total{rail="opencode",status=~"2.."}[5m])) > 0)))[2h:1m])))
          for: 2m
          labels:
            severity: warning
            triage: now
          annotations:
            summary: 'OpenCode Go answers 401/403 to the gateway''s key with no 2xx — if the probe confirms the key is dead, rotate: wallet opencode-go-api-key → Infisical OPENCODE_GO_API_KEY → force-sync ExternalSecret agent-egress/opencode-go-key → restart agent-gateway + openrouter-proxy'
            description: 'OpenCode Go answered 401/403 (424 upstream-auth) to the gateway''s own key, with no 2xx since; the last sustained burst was at {{ $value | humanizeTimestamp }}. Check: (1) kubectl -n agent-egress logs deploy/agent-gateway | grep "upstream-auth opencode" shows the rejections and their upstream status; (2) probe the key the Secret holds against https://opencode.ai/zen/go/v1/models (docs/runbook.md §Rotate the OpenCode Go API key, step 0) — 401 there = the key itself is rejected. If the probe confirms it, the runbook section is the rotation recipe; if the probe answers 200, the key works and the gateway is not sending it (look at the ExternalSecret sync and the pod''s env). Clears on the first 2xx window after the burst, or after 2h with no new burst.'
    # ── The Go catalog leg (GW-CATALOG-GO, gateway/specs/endpoints/catalog.md) ──────────────────
    # The gateway reads the Go rail's vendor facts on a 6 h schedule from two sources (`config` =
    # the console's V2 config, `docs` = the vendor's Go page) and keeps each source's last good
    # snapshot when a refresh fails. These three say when that fallback has stopped being harmless.
    # Behaviour fixture: go-catalog.promtool-{rules,test} beside this file (hand copy of this group).
    #   GoCatalogStale              — a source's last good snapshot is older than 24 h (4 missed
    #                                 refreshes), or there is none.
    #   GoCatalogParseFailed        — the latest refresh fetched the source but could not read it
    #                                 (the vendor's format or the parser changed) or got an implausible drop (<
    #                                 half the models): the parser needs a look before the snapshot
    #                                 ages out. last_outcome is a gauge set by every attempt, so it
    #                                 needs no counter-reset reasoning across a roll.
    #   GoCatalogPolicyModelMissing — a Go model the policy routes to is not listed by the console,
    #                                 or has no monthly-limit row under the policy's plan: the
    #                                 F3 case (docs/spikes/opencode-go-catalog.md) when the vendor
    #                                 dropped the model; a page/parser change looks the same here.
    - name: agent-gateway-go-catalog
      rules:
        - alert: GoCatalogStale
          expr: |
            (max by (source) (gateway_go_catalog_age_seconds{job="agent-gateway"}) > 86400)
            or
            (max by (source) (gateway_go_catalog_models{job="agent-gateway"}) == 0)
          for: 30m
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The gateway''s Go catalog ({{ $labels.source }}) has had no good refresh for 24 h, or has no snapshot'
            description: 'gateway_go_catalog_age_seconds{source="{{ $labels.source }}"} is past 24 h, or gateway_go_catalog_models is 0 ({{ $value }}); the gateway keeps its last good snapshot. Check: (1) kubectl -n agent-egress logs deploy/agent-gateway | grep "catalog: {{ $labels.source }}" names the failing step (fetch answered <status>, fetch failed, parse failed, implausible); (2) gateway_go_catalog_last_outcome{source="{{ $labels.source }}"}; (3) GET /catalog/opencode on the gateway, sources.{{ $labels.source }}. The contract is gateway/specs/endpoints/catalog.md.'
        - alert: GoCatalogParseFailed
          expr: |
            max by (source, outcome) (gateway_go_catalog_last_outcome{job="agent-gateway",outcome=~"parse-failed|implausible"}) == 1
          for: 5m
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The latest refresh of the gateway''s Go catalog ({{ $labels.source }}) ended {{ $labels.outcome }} — its last good snapshot is in use'
            description: 'parse-failed = the answer did not match the shape gateway/src/agent_gateway/catalog.py parses (parse_catalog / parse_config / parse_docs — the log line names the READ: the config source is models.dev''s api.json overlaid by the console''s config); implausible = it carried fewer than half the last good snapshot''s models. Either the vendor source or the parser may be what changed. Check: kubectl -n agent-egress logs deploy/agent-gateway | grep "catalog: {{ $labels.source }}" names the line or count it stopped on; compare it with the vendor source (config: https://models.dev/api.json `opencode-go`, then GET https://opencode.ai/console/api/v2/config — the workspace overrides; docs: anomalyco/opencode services/www/src/docs/content/console/go.mdx). Clears on the next good refresh (every 6 h, or a pod restart); GoCatalogStale follows at 24 h.'
        - alert: GoCatalogPolicyModelMissing
          expr: |
            max by (source) (gateway_go_catalog_policy_models_missing{job="agent-gateway"}) > 0
          for: 15m
          labels:
            severity: warning
            triage: now
          annotations:
            summary: '{{ $value }} Go model(s) in the gateway policy are not covered by its Go catalog''s {{ $labels.source }} snapshot'
            description: 'config = a policy Go model is not listed in the Go catalog snapshot (models.dev''s opencode-go rows under the console''s overrides); docs = it has no monthly-limit row under rails.opencode.plan in the Go page snapshot. Which ids: GET /catalog/opencode on the gateway, policy_models, or kubectl -n agent-egress logs deploy/agent-gateway | grep "policy model(s) not covered". Check the vendor source before acting: a model the vendor no longer lists needs a policy change (argocd/resources/agent-gateway/policy.json rails.opencode.models, by PR); a page or parser change also shows as GoCatalogParseFailed or as a drop in gateway_go_catalog_models.'
    # ── The OpenRouter catalog leg (GW-CATALOG-OR, gateway/specs/endpoints/catalog.md) ────────────
    # The gateway reads the openrouter rail's registry on a 6 h schedule (the weekly ranking ∩ the
    # AA-benched set over the MCP, then each candidate's endpoints) and keeps the last good snapshot
    # when a refresh fails; a (model, provider) cell enters selection only after a clean, budget-capped
    # entry canary. Behaviour fixture: openrouter-catalog.promtool-{rules,test} beside this file.
    #   OpenRouterCatalogStale        — no good refresh for 24 h (4 missed), or no snapshot at all:
    #                                   every selection runs on month-old prices (#2718 item 3's class —
    #                                   the 10-18 snapshot read $0.144/M against a live $0.080/M).
    #   OpenRouterCatalogParseFailed  — the latest refresh read the sources but could not parse them,
    #                                   or found an implausible drop: the parser needs a look.
    #   GatewayCanaryBudgetExhausted  — the canary cap (per refresh or per day) is spent while
    #                                   candidate cells wait: entrants stay out of the order until
    #                                   the budget rolls — raise the knob or wait, never a code change.
    # ── The tier evidence (GW-MODEL-TIERS, gateway/specs/endpoints/catalog.md) ─────────────────────
    # The deployed tier lists and the admission's rail choice are priced from the committed
    # benchmarks.json (mounted beside the policy); a comparison on a month-old price is a wrong
    # answer with a confident face (#2718 item 3: the 10-18 snapshot read $0.144/M against a live
    # $0.080/M a day later). Behaviour fixture: tier-evidence.promtool-{rules,test} beside this file.
    #   TierEvidenceStale — the mounted snapshot's snapshot_at is older than 7 d (the AA pull behind
    #                       it is weekly), or no snapshot is mounted at all: re-cut it
    #                       (gateway/scripts/benchmarks-snapshot.sh → apply → PR).
    - name: agent-gateway-tier-evidence
      rules:
        - alert: TierEvidenceStale
          expr: |
            (max(gateway_tier_evidence_age_seconds{job="agent-gateway"}) > 604800)
            or
            (absent(gateway_tier_evidence_age_seconds{job="agent-gateway"}) and on() (max(gateway_sessions_active{job="agent-gateway"}) >= 0))
          for: 1h
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The gateway''s tier evidence (benchmarks.json) is older than 7 days, or none is mounted'
            description: 'gateway_tier_evidence_age_seconds is past 7 d ({{ $value }}), or absent while the gateway serves: the deployed tier lists and the rail choice compare on stale prices. Re-cut it: bash gateway/scripts/benchmarks-snapshot.sh, then devbox run tiers -- apply, commit benchmarks.json + policy.json by PR (an undecided tier keeps its deployed list — check names it). Absent = argocd/resources/agent-gateway/kustomization.yaml no longer ships benchmarks.json in the policy ConfigMap, or GATEWAY_BENCHMARKS points elsewhere. The contract is gateway/specs/endpoints/catalog.md#gw-model-tiers.'
    - name: agent-gateway-openrouter-catalog
      rules:
        - alert: OpenRouterCatalogStale
          expr: |
            (max(gateway_openrouter_catalog_age_seconds{job="agent-gateway"}) > 86400)
            or
            (max(gateway_openrouter_catalog_models{job="agent-gateway"}) == 0)
          for: 30m
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The gateway''s OpenRouter catalog has had no good refresh for 24 h, or has no snapshot'
            description: 'gateway_openrouter_catalog_age_seconds is past 24 h, or gateway_openrouter_catalog_models is 0 ({{ $value }}); the gateway keeps its last good snapshot and selection prices from it. Check: (1) kubectl -n agent-egress logs deploy/agent-gateway | grep "orcatalog:" names the failing step (the account key, the MCP source, the parse, the endpoints reads, implausible); (2) gateway_openrouter_catalog_last_outcome; (3) GET /catalog/openrouter on the gateway. The contract is gateway/specs/endpoints/catalog.md#gw-catalog-or.'
        - alert: OpenRouterCatalogParseFailed
          expr: |
            max by (outcome) (gateway_openrouter_catalog_last_outcome{job="agent-gateway",outcome=~"parse-failed|implausible"}) == 1
          for: 5m
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The latest refresh of the gateway''s OpenRouter catalog ended {{ $labels.outcome }} — its last good snapshot is in use'
            description: 'parse-failed = an MCP answer (list-daily-model-rankings / list-benchmarks) did not match the shape gateway/src/agent_gateway/orcatalog.py parses; implausible = no candidate had readable endpoints, or fewer than half the last good snapshot''s models did. Check: kubectl -n agent-egress logs deploy/agent-gateway | grep "orcatalog:" names the step; compare with the live MCP answer (the jail''s openrouter MCP tools) and GET https://openrouter.ai/api/v1/models/<id>/endpoints. Clears on the next good refresh (every 6 h, or a pod restart); OpenRouterCatalogStale follows at 24 h.'
        - alert: GatewayCanaryBudgetExhausted
          expr: |
            max(gateway_canary_budget_exhausted{job="agent-gateway"}) == 1
          for: 15m
          labels:
            severity: warning
            triage: dig
          annotations:
            summary: 'The gateway''s canary budget is spent while candidate OpenRouter cells wait'
            description: 'gateway_canary_budget_exhausted is 1: the per-refresh cap (rails.openrouter.canary.max_per_refresh) or the day''s metered spend (canary.usd_per_day) is reached and candidate cells stay out of selection until it rolls (the next catalog refresh, or the trailing day). GET /catalog/openrouter on the gateway shows canary.admitted_this_refresh, canary.spend_usd_1d and the candidate cells. Nothing is tried over budget by design (operator 2026-10-19); a higher cap is a policy edit (argocd/resources/agent-gateway/policy.json, by PR), never a code change.'
    # ── The codex rail's usage poll (GW-CODEX-HEADROOM §Poll, gateway/specs/endpoints/openai-responses.md) ──
    # The gateway admits the codex rail on ITS OWN account observation: every poll_interval_s it polls
    # the account usage endpoint and the headroom keeps the last ACCEPTED report; past max_age_s the
    # rail defers `quota-stale`, and a declared rail with no poll at all sits on `quota-unknown`
    # forever. gateway_codex_usage_poll_total{outcome} counts every poll (every outcome renders from
    # 0 once the rail is declared; the family is ABSENT while the policy omits the rail — metrics.py
    # bind_codex_rail, the §Poll row "an undeclared rail renders no poll family" — so neither alert
    # can fire on an undeclared rail; fixture P4). Behaviour fixture: codex-headroom.promtool-{rules,test}.
    #   CodexUsagePollStale  — polls run but none was accepted for 15 m (401s, a changed payload,
    #                          windows off the profile, a store failure…): the rail is deferring.
    #   CodexUsagePollSilent — the rail is declared but no poll ran for 15 m: the poll is dark
    #                          (CODEX_USAGE_URL unset, no credential backend) or the schedule died.
    - name: agent-gateway-codex-headroom
      rules:
        - alert: CodexUsagePollStale
          expr: |
            (sum(increase(gateway_codex_usage_poll_total{job="agent-gateway",outcome="accepted"}[15m])) == 0)
            and
            (sum(increase(gateway_codex_usage_poll_total{job="agent-gateway"}[15m])) > 0)
          for: 5m
          labels:
            severity: warning
            triage: now
            rail: codex
          annotations:
            summary: 'The gateway''s codex usage poll has accepted nothing for 15 m — the codex rail is deferring (quota-stale)'
            description: 'gateway_codex_usage_poll_total counts polls but none ended accepted in 15 m, so the headroom report is past rails.codex.headroom.max_age_s and admission answers quota-stale. Check: (1) sum by (outcome) (increase(gateway_codex_usage_poll_total[15m])) names the outcome — upstream-auth = the usage endpoint rejects the credential (not by itself a revocation: see the request log), quota-invalid = the payload no longer matches the profile the poll translates (gateway/src/agent_gateway/codex_usage.py; the shape is docs/spikes/codex-subscription-rail.md §Live usage payload shape), credential-* = the lifecycle (GW-CODEX-OAUTH; credential-recovery-required needs a re-seed: devbox run codex-seed); (2) kubectl -n agent-egress logs deploy/agent-gateway | grep "codex usage poll". Clears on the next accepted poll.'
        - alert: CodexUsagePollSilent
          expr: |
            sum(increase(gateway_codex_usage_poll_total{job="agent-gateway"}[15m])) == 0
          for: 15m
          labels:
            severity: warning
            triage: dig
            rail: codex
          annotations:
            summary: 'The codex rail is declared but its usage poll has not run for 15 m — the rail sits on quota-unknown'
            description: 'gateway_codex_usage_poll_total renders (the policy declares the codex rail) but no poll ran in 15 m. The poll runs only with CODEX_USAGE_URL set AND a credential backend (CODEX_UPSTREAM + CODEX_SEED_FILE with a mounted seed — ESO Secret agent-egress/codex-seed): kubectl -n agent-egress logs deploy/agent-gateway | grep "codex usage poll dark" names which is missing; a live schedule that died logs "codex usage poll: one pass failed". Until a poll is accepted every codex admission defers quota-unknown.'
