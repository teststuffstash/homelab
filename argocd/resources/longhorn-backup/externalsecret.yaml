# The credential Secret Longhorn's BackupTarget names (`backupTargetCredentialSecret`, tofu/longhorn.tf).
# Values: Infisical LONGHORN_BACKUP_KEY_ID / LONGHORN_BACKUP_SECRET — copies of the wallet entries
# `longhorn-backup-key-id` / `longhorn-backup-secret`, which stay canonical: Infisical rides
# Longhorn, so after a total loss the restore is fed from the WALLET (docs/longhorn-backup.md §Restore).
# AWS_ENDPOINTS points Longhorn's S3 client at the nx-02 Garage LXC instead of AWS (path-style).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-target
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: longhorn-backup-target
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ .keyId }}'
        AWS_SECRET_ACCESS_KEY: '{{ .secret }}'
        AWS_ENDPOINTS: http://192.168.2.73:3900
  data:
    - secretKey: keyId
      remoteRef: { key: LONGHORN_BACKUP_KEY_ID }
    - secretKey: secret
      remoteRef: { key: LONGHORN_BACKUP_SECRET }
