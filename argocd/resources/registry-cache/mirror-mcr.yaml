# Pull-through mirror of mcr.microsoft.com — third sibling of mirror-docker-io.yaml /
# mirror-ghcr.yaml (see THEIR headers for the design essays: init-time GC, the #240
# blob-descriptor-cache-off rationale, the #80 upload-purging story — one home per fact, not
# restated here). Born 2026-08-26 (operator direction on the sleep#123 Playwright thread):
# the MS Playwright image lives ONLY on MCR, and additional registries (quay, bitnami,
# chainguard, …) are inevitable — this is the first of the ADR-091 pattern's extensions.
# Anonymous upstream (MCR needs no auth for public images — all we consume); the proxy client
# follows MCR's CDN redirects upstream-side, consumers never see them.
# NB: dockerd's registry-mirrors CANNOT use this (Hub-only); MCR consumers are k3d
# --registry-config / kind containerdConfigPatches / containerd hosts.toml shapes, or an
# explicit image reference against the VIP.
# LAN endpoint: http://192.168.40.31 (BGP VIP; also registry-mcr.registry-cache.svc in-cluster).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-mcr-data
  namespace: registry-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-bulk
  resources:
    requests:
      # 40Gi at birth: the initial working set is the Playwright image family (~2-4G per pinned
      # version) — this is already >5× headroom (the oversize-caches doctrine: a wipe costs a
      # slow re-warm day; grow the volume, not the reclaim cadence). Revisit against
      # registry_mirror_* metrics when more MCR consumers arrive, per the ghcr history.
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-mcr
  namespace: registry-cache
  labels: { app: mirror-mcr }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume
  selector:
    matchLabels: { app: mirror-mcr }
  template:
    metadata:
      labels: { app: mirror-mcr }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Init-time store maintenance — the design and its rationale live in mirror-ghcr.yaml's
      # header (GC only when the store provably has no writer; failure is loud, never wedging).
      initContainers:
        - name: store-maintenance
          image: registry:3.0.0
          command: ["/bin/sh", "/maintenance/maintain.sh"]
          env:
            - { name: MIRROR_NAME, value: "mirror-mcr" }
            - { name: WIPE_THRESHOLD_PCT, value: "90" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: maintenance, mountPath: /maintenance, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "1",   memory: "512Mi" }
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            - { name: REGISTRY_PROXY_REMOTEURL, value: "https://mcr.microsoft.com" }
            - { name: REGISTRY_PROXY_TTL, value: "168h" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            # Blob-descriptor cache OFF — the 46-hour-lie class (homelab#240); the full
            # rationale is mirror-ghcr.yaml's. "" is the off value; never redis.
            - { name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR, value: "" }
            # Debug/metrics server on :5001 (homelab#1297). Binds ALL interfaces (not
            # 127.0.0.1) because there is NO nginx front on this pod — the ServiceMonitor
            # scrapes this port directly. The ADR-121 registry.yaml precedent binds
            # 127.0.0.1:5002 because that pod HAS an nginx front on :5001; here :5001 is
            # free and the debug server is the only listener on it.
            - { name: REGISTRY_HTTP_DEBUG_ADDR, value: ":5001" }
            # Upload-debris reaping at 1h (homelab#80) — one env var holding the whole map,
            # per-key vars panic the registry; rationale in mirror-ghcr.yaml.
            - name: REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING
              value: "{enabled: true, age: 1h, interval: 15m, dryrun: false}"
          ports:
            - { name: http, containerPort: 5000 }
            - { name: debug, containerPort: 5001 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "2",    memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mirror-mcr-data }
        - name: maintenance
          configMap: { name: store-maintenance, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-mcr
  namespace: registry-cache
  labels:
    app: mirror-mcr
    bgp: advertise
  annotations:
    lbipam.cilium.io/ips: "192.168.40.31"
spec:
  type: LoadBalancer
  selector: { app: mirror-mcr }
  ports:
    - { name: http, port: 80, targetPort: 5000 }
    - { name: debug, port: 5001, targetPort: 5001 }
