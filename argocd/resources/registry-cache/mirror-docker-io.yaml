# Pull-through mirror of docker.io (FU-073 / ADR-091 — the nix-cache pattern for OCI images).
# distribution/registry v3 in proxy mode: single-upstream by design, so one instance per upstream
# (mirror-ghcr.yaml is the sibling). Pure regenerable cache — losing it costs a re-fill, hence
# longhorn-bulk (2 replicas on the big-disk tier; ADR-089 tier semantics accept laptop-wipe
# degradation). TTL eviction keeps it a cache, not an archive.
#
# Consumers (docker.io pulls only — dockerd's registry-mirrors is Hub-specific):
#   inner dockerd in kata agent rides (agents/agent-session.sh --docker), k3d --registry-config /
#   kind containerdConfigPatches in CI gates, ci-runner-01 daemon.json, and later the Talos
#   node-level machine.registries.mirrors (deferred — see FU-073).
# LAN endpoint: http://192.168.40.20 (BGP VIP; also registry-docker-io.registry-cache.svc in-cluster).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-docker-io-data
  namespace: registry-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-bulk
  resources:
    requests:
      # 20→40Gi 2026-08-07. Same oversize rationale as the ghcr sibling: with --delete-untagged
      # gone (homelab#116) the fallback valve is a full wipe, which costs a day of slow builds
      # while the cache re-warms — so headroom is cheaper than reclamation. 7.1G actual today.
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-docker-io
  namespace: registry-cache
  labels: { app: mirror-docker-io }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume
  selector:
    matchLabels: { app: mirror-docker-io }
  template:
    metadata:
      labels: { app: mirror-docker-io }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Store maintenance in init — wipe-if-full, dangling-link repair, then plain GC. The
      # script and the full rationale live in store-maintenance.yaml (homelab#116). It runs
      # here because init is the only moment the store provably has no writer; the gc-mirrors
      # CronJob triggers it weekly by deleting the pod.
      initContainers:
        - name: store-maintenance
          image: registry:3.0.0
          command: ["/bin/sh", "/maintenance/maintain.sh"]
          env:
            - { name: MIRROR_NAME, value: "mirror-docker-io" }
            - { name: WIPE_THRESHOLD_PCT, value: "90" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: maintenance, mountPath: /maintenance, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "1",   memory: "512Mi" }
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            - { name: REGISTRY_PROXY_REMOTEURL, value: "https://registry-1.docker.io" }
            # cache semantics: blobs unreferenced for a week get evicted by the proxy scheduler
            - { name: REGISTRY_PROXY_TTL, value: "168h" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            # Blob-descriptor cache OFF — same rationale as mirror-ghcr (homelab#240), where it
            # served a GC'd blob as 200/CL:32/0-bytes for 46h. Nothing about that failure was
            # ghcr-specific: the deleter is the shared proxy TTL scheduler, which vacuums a blob
            # from the global store without a cross-repo refcount, and the in-memory descriptor
            # map then keeps answering for it until the process restarts. This mirror has the
            # identical TTL + cache pair, so it is the same latent bug — fix both or fix neither.
            - { name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR, value: "" }
            # Debug/metrics server on :5001 (homelab#1297). Binds ALL interfaces (not
            # 127.0.0.1) because there is NO nginx front on this pod — the ServiceMonitor
            # scrapes this port directly. The ADR-121 registry.yaml precedent binds
            # 127.0.0.1:5002 because that pod HAS an nginx front on :5001; here :5001 is
            # free and the debug server is the only listener on it.
            - { name: REGISTRY_HTTP_DEBUG_ADDR, value: ":5001" }
            # Upload-debris reaping — same rationale as mirror-ghcr (#80): abandoned
            # pull-through uploads must reap in ~1h, not the 168h default.
            # NB: must be ONE env var holding the whole YAML map — per-key
            # REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING_AGE vars panic the registry
            # ("uploadpurging config key must contain additional keys").
            - name: REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING
              value: "{enabled: true, age: 1h, interval: 15m, dryrun: false}"
          ports:
            - { name: http, containerPort: 5000 }
            - { name: debug, containerPort: 5001 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "2",    memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mirror-docker-io-data }
        - name: maintenance
          configMap: { name: store-maintenance, defaultMode: 0555 }
---
# LoadBalancer (BGP VIP) rather than ClusterIP: kata microVM guests can't reach ClusterIPs
# (FU-072) but routed VIPs work, and the same stable IP serves off-cluster consumers
# (ci-runner-01, laptops). HTTP-only — consumers list it under insecure-registries; it never
# leaves the LAN.
apiVersion: v1
kind: Service
metadata:
  name: registry-docker-io
  namespace: registry-cache
  labels:
    app: mirror-docker-io
    bgp: advertise
  annotations:
    lbipam.cilium.io/ips: "192.168.40.20"
spec:
  type: LoadBalancer
  selector: { app: mirror-docker-io }
  ports:
    - { name: http, port: 80, targetPort: 5000 }
    - { name: debug, port: 5001, targetPort: 5001 }
