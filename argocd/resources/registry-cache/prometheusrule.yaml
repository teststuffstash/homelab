# Mirror cache-disk alerts (#80 / #47's promised early warning). A pull-through cache with a
# full disk does NOT crash — it silently TRUNCATES in-flight blob writes, and consumers see
# layer digest mismatches + 500s (homelab#48). So the alert must fire well before 100%: at
# ~85% the write path still works and the fix is a purge/TTL decision, not an incident.
# Prometheus picks up PrometheusRules cluster-wide (ruleSelectorNilUsesHelmValues=false).
#
# ── THE RESTART-GAP TEST, APPLIED TO A SHARED DEPENDENCY (homelab#333) ────────────────────────
# #332's test is "DOES THE CONDITION OUTLIVE THE ROLL?" (the full statement lives in
# argocd/resources/openrouter-proxy/prometheusrule.yaml — one home, this is the pointer). #333
# asked it of kube-state-metrics, which is not this file's workload but is a `replicas: 1`
# dependency SHARED by three alerts in two directories, and answered it once for all three:
# the two `RegistryGCMirrors*` alerts below and `AgentCoordinateScanWedged` in
# argocd/resources/pushgateway/prometheusrule.yaml.
#
#   VERDICT: BRIDGE, and the reason generalises to every KSM-derived alert in this repo. KSM is a
#   MIRROR, not a source: its series describe OTHER objects (a CronJob's suspend flag, a pod's
#   phase), so a fresh KSM re-lists the API and republishes the SAME values. The condition never
#   stopped being true; only the measurement of it went away. That is the persisted/externally-
#   true arm of #332's test in its purest form.
#
# Two halves, and #288 proved either alone still resets `for:` at one replica:
#   (1) IDENTITY CHURN → `max by (namespace,cronjob)`. `kube_cronjob_*` has no `pod` of its own,
#       so the scrape target's labels survive intact: `pod` and `instance` on these series are
#       KUBE-STATE-METRICS' pod and IP, and they ride onto the alert. A KSM reschedule therefore
#       turns a firing alert into a different alert instance — a spurious resolve plus a re-fire
#       one full `for:` window later, on a CronJob that never stopped being suspended/stale.
#   (2) A REAL HOLE → `max_over_time(...[10m])`. At `replicas: 1` a KSM reschedule empties every
#       kube_* series — nothing is left to aggregate over — and the staleness markers make that
#       instant rather than lookback-cushioned.
# [10m] is #288's measured size for this class on this cluster (69-116s of raw-sample gap across
# 10 pod generations, ~5x margin), carried unchanged: these two alerts wait 15m and 1h, so up to
# 10m of lag on the CLEAR is immaterial, and their conditions move on a weekly/manual timescale.
# `AgentCoordinateScanWedged` waits 2m and deliberately takes a smaller range — the sizing
# argument is in its own manifest, not restated here.
# CEILING, asserted rather than assumed: a KSM hole longer than 10m (crash-loop, cold image pull,
# node drain) still resets the window. Same accepted ceiling as #313's.
# NOT the #313 masking trade-off. There, aggregating meant one healthy exporter instance could
# mask a stuck one, because the metric described the exporter ITSELF. A second KSM replica would
# report the same `gc-mirrors` numbers as the first, so `max by` here discards duplicate mirrors
# of one fact, not independent facts. Pinned as a test (gc-mirrors.promtool-test), not argued.
# Behaviour for both alerts — bridge, ceiling, identity churn, and the asymmetry trap in the
# `absent()` arm — is executed in gc-mirrors.promtool-test, against the pre-#333 exprs kept as a
# regression witness in gc-mirrors-witness.promtool-{rules,test}.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: registry-cache
  labels:
    app: registry-cache
spec:
  groups:
    - name: registry-cache
      rules:
        - alert: RegistryMirrorCacheAlmostFull
          expr: >
            kubelet_volume_stats_available_bytes{namespace="registry-cache"}
              / kubelet_volume_stats_capacity_bytes{namespace="registry-cache"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Registry mirror PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
            description: "{{ $labels.persistentvolumeclaim }} has under 15% free. At 100% the mirror truncates in-flight pull-through writes and nodes see digest mismatches/500s instead of a loud failure. Check what's big: legit blobs (capacity/TTL decision — argocd/resources/registry-cache/) vs _uploads debris (should self-reap within ~1h via uploadpurging; if it isn't, that mechanism is broken)."
        # homelab#116's own complaint was "this is not detectable today": a 200-with-0-bytes is
        # invisible to the mirror's metrics and to every consumer until a build fails oddly, and
        # it took four rounds of circles#19 to find. The store-maintenance initContainer now
        # counts dangling links every restart and pushes the count, so the invariant breaking is
        # a metric instead of an archaeology exercise. NON-ZERO MEANS IT ALREADY HAPPENED — the
        # links are repaired by then. What PRODUCES them stopped being a mystery in homelab#240
        # (the proxy TTL scheduler vacuums a shared blob with no cross-repo refcount); what made
        # it an OUTAGE was the in-memory descriptor cache answering for the deleted blob anyway,
        # and that cache is off as of #240 — see mirror-ghcr.yaml. So this alert demoted itself
        # from "invariant broken" to "housekeeping happened": read it, don't scramble for it.
        #
        # ⚠ DELIBERATELY NOT RESTART-GAP BRIDGED (homelab#336), and the reason is that the premise
        # is wrong rather than that the price is too high. #336 listed this alert as a single-
        # replica candidate on the grounds that "live labels carry pod, mirror; both mirror
        # Deployments are replicas: 1". The `pod` label is NOT a mirror's. This metric is PUSHED
        # (store-maintenance.yaml pushes it to prometheus-pushgateway on every mirror restart), so
        # what Prometheus scrapes is the GATEWAY: live label set
        # {container=pushgateway, endpoint, job="registry_mirror_maintenance", mirror, namespace,
        # pod="prometheus-pushgateway-…", service="prometheus-pushgateway"} — read off Prometheus
        # 2026-08-12. A mirror Deployment rolling cannot gap this series at all; the gateway serves
        # every pushed group forever, which is measured here as 13076 samples in 7 days with a
        # worst inter-sample age of 49s and no hole.
        # So the only workload whose roll matters is the PUSHGATEWAY, `replicas: 1` with its
        # persistence file on an emptyDir (argocd/resources/pushgateway/deployment.yaml) — and a
        # reschedule there does not GAP the datum, it DESTROYS it until the next mirror restart
        # pushes again, which can be weeks. A `max_over_time([B])` bridges B minutes of a permanent
        # loss: it repairs nothing. The remaining case is an in-place container restart, which
        # keeps the emptyDir and returns the same series after a sub-minute gap, costing `for: 5m`
        # once on an alert whose own description says to read it rather than scramble for it.
        # The pushgateway's own durability is a DIFFERENT bug from this class and is carried as a
        # finding in #336's PR body rather than papered over with a range selector here.
        #
        # #479 THRESHOLD — every fire of the original `> 0` form was triaged to the same conclusion,
        # and the evidence is #241's own history: 2026-08-11 mirror-ghcr repaired 1 link (the #241
        # event itself, the first nonzero in 17 days), 2026-08-16 mirror-docker-io repaired 9 (all
        # clustered in one repo, no wipe, no pull failures), 2026-08-17 mirror-ghcr repaired 1 again.
        # Each produced a triage session that re-concluded "expected housekeeping". The 2026-08-11
        # meta ruling that closed #241 named the ONLY trigger worth paging on, quoted here as the
        # evidence: "If the repair COUNT ever jumps by an order of magnitude, that is a new
        # investigation, not this one." Baseline 1, observed routine max 9 → an order-of-magnitude
        # jump is the ≥10 region, so this fires only at `> 9`.
        # ⚠ THE GAUGE IS LATCHED, NOT A RATE: store-maintenance.yaml pushes
        # registry_mirror_dangling_links_repaired once per mirror restart and it only resets at the
        # next rollout, so the threshold is a comparison on the latched value (`> 9`), never
        # increase()/rate() over a window — a rate would be a different alert.
        - alert: RegistryMirrorDanglingLinks
          expr: registry_mirror_dangling_links_repaired > 9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mirror }} had {{ $value }} dangling layer link(s) repaired at last restart"
            description: "A repository layer link pointed at a blob that was missing or zero-length — the homelab#116 failure, where the mirror answers HTTP 200 with 0 bytes for a live layer and BuildKit reports 'short read: expected N bytes but got 0'. The links were unlinked so the next pull re-fetches from upstream. The producer is IDENTIFIED as of homelab#240: the REGISTRY_PROXY_TTL scheduler vacuums an expiring blob out of the global content-addressed store without a cross-repo refcount, so any OTHER repository sharing that blob is left holding a link to nothing. Since #240 disabled the in-memory blob-descriptor cache, such a link is self-healing (the Stat misses on disk and the proxy re-fetches), so counts of 1–9 here are now EXPECTED HOUSEKEEPING rather than an outage and stay silent — this alert fires only at ≥10 (the order-of-magnitude jump #241 reserved for a new investigation), and even then check first whether it is paired with actual pull failures. Still check the store-maintenance init log for a wipe, which produces no dangling links at all and would mean a different cause."
        # The store now reclaims by WIPING when full rather than by selective deletion. A wipe is
        # correct but not free — it forces a cold re-pull herd, which is what left the abandoned
        # _uploads debris in #80. Frequent wipes therefore mean the PVC is undersized, not that
        # the mechanism is misbehaving.
        - alert: RegistryMirrorWipedRepeatedly
          expr: sum_over_time(registry_mirror_store_wiped[14d]) >= 3
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mirror }} has wiped its cache {{ $value }} times in 14 days"
            description: "The capacity valve is firing often enough to hurt: every wipe costs a full cold re-warm from upstream. This is a SIZING signal — grow the PVC (bulk tier has headroom since wk-metal-04 joined, see docs/storage-ledger.md) rather than lowering the threshold."
        # Weekly GC: the gc-mirrors CronJob (Sunday 04:00 UTC) deletes the mirror pods
        # so the garbage-collect initContainer runs with no writer (FU-136 / #93).
        # This alert fires when it has not completed successfully in >8 days
        # (one weekly cycle + 1 day slack). Two arms:
        #   1. The metric exists but is stale (last success > 8 days ago).
        #   2. The metric is absent — the job has never succeeded — but the CronJob
        #      was created long enough ago that it should have run at least once.
        #      (kube_cronjob_status_last_successful_time is only emitted AFTER the
        #      first successful run; absent() + kube_cronjob_created fills that gap.)
        # Note: absent() preserves its input selector's labels, so $labels.namespace
        # and $labels.cronjob are safe to reference — but they are fixed, so we
        # hardcode them for clarity.
        #
        # ⚠ KSM RESTART-GAP HARDENED (homelab#333 — see this file's header for the verdict and the
        # [10m] sizing). `max_over_time` on `..._last_successful_time` costs nothing on the way
        # down, exactly as in #313: the gauge only moves when a run SUCCEEDS, and `max` takes the
        # NEWEST success in the window, so any success inside the last 10m already puts the age
        # far under 8 days. It can neither delay this alert nor keep it ringing after a fix.
        # ⚠ THE `absent()` ARM IS THE TRAP, and it is why bridging one side at a time is wrong.
        # `absent()` fires when its input is EMPTY — which is precisely what a KSM hole produces.
        # Bridge only `kube_cronjob_created` and this arm becomes a FALSE POSITIVE generator: on
        # every KSM roll the created-side would persist while the absent-side flipped to 1, and a
        # CronJob that succeeded an hour ago would page as "never succeeded". So the absent() input
        # carries the SAME [10m] bridge — the arm then holds its shape across a hole in both
        # directions. Bridging neither is the other consistent option and is what #333 rejected:
        # a hole would empty the created-side and restart the 1h window.
        # The operands are ALSO swapped relative to the pre-#333 form, and that is load-bearing
        # rather than cosmetic: `absent(max_over_time(...))` is a function call, not a vector
        # selector, so it no longer carries the selector's labels the note above relies on, and
        # `and on()` keeps the LEFT side's. Putting the labelled `kube_cronjob_created` term on the
        # left is what keeps `namespace`/`cronjob` on this arm's alert. Pinned in
        # gc-mirrors.promtool-test.
        - alert: RegistryGCMirrorsStale
          expr: >
            (
              max by (namespace,cronjob) (
                max_over_time(kube_cronjob_status_last_successful_time{namespace="registry-cache",cronjob="gc-mirrors"}[10m])
              ) < (time() - 8 * 24 * 3600)
            )
            or
            (
              (
                max by (namespace,cronjob) (
                  max_over_time(kube_cronjob_created{namespace="registry-cache",cronjob="gc-mirrors"}[10m])
                ) < (time() - 8 * 24 * 3600)
              )
              and on()
                absent(max_over_time(kube_cronjob_status_last_successful_time{namespace="registry-cache",cronjob="gc-mirrors"}[10m]))
            )
          for: 1h
          labels:
            severity: warning
            triage: none
          annotations:
            summary: "gc-mirrors CronJob in registry-cache has not completed in >8 days"
            description: "The weekly mirror-GC CronJob (gc-mirrors, namespace registry-cache) has not reported a successful run in over 8 days. If this persists, mirror PVCs fill until pulls silently truncate. Check: (1) CronJob exists and is not suspended — kubectl -n registry-cache get cronjob gc-mirrors; (2) recent Jobs — kubectl -n registry-cache get jobs -l cronjob=gc-mirrors; (3) if RBAC or scheduling broke, the pods will show Backoff or RBAC errors in events."
        # ⚠ KSM RESTART-GAP HARDENED (homelab#333 — verdict and [10m] sizing in this file's header).
        # This one DOES pay for the bridge on the way down, and the price is stated rather than
        # hidden: `max_over_time` means "suspended at any point in the last 10m", so un-suspending
        # the CronJob leaves the alert ringing for up to 10m after the fix. Against `for: 15m` on a
        # weekly GC that is the cheaper fault by a wide margin — the alternative is a suspension
        # that goes unreported for another 15m every time KSM moves. Both directions are pinned in
        # gc-mirrors.promtool-test.
        - alert: RegistryGCMirrorsSuspended
          expr: >
            max by (namespace,cronjob) (
              max_over_time(kube_cronjob_spec_suspend{namespace="registry-cache",cronjob="gc-mirrors"}[10m])
            ) == 1
          for: 15m
          labels:
            severity: warning
            triage: none
          annotations:
            summary: "gc-mirrors CronJob in registry-cache is suspended"
            description: "The gc-mirrors CronJob (namespace registry-cache) is currently suspended. Mirror PVC garbage collection will not run. Check who suspended it and why: kubectl -n registry-cache get cronjob gc-mirrors -o yaml | grep suspend."
        # Mirror 5xx detection via blackbox probe (homelab#1282). The mirrors expose NO Prometheus
        # metrics (no REGISTRY_HTTP_DEBUG_ADDR set), so the operator-narrowed fallback is a
        # blackbox probe against /v2/ on each mirror's LAN endpoint. The Probe CRDs live in
        # mirror-probes.yaml; this alert fires when probe_success == 0 for 10m.
        #
        # ── THE RESTART-GAP TEST, APPLIED TO THE BLACKBOX PROBER (homelab#332/#333) ──────────────
        # The full statement lives in argocd/resources/openrouter-proxy/prometheusrule.yaml; this
        # block records only what applying it to this alert needed beyond substitution.
        #
        # (i)   ONLY THE HOLE HALF. The identity half (`max by (<a label that does not churn>)`)
        #       repairs nothing here. `probe_success` carries NO `pod`: the Probe's scrape goes to
        #       the prober SERVICE and `instance` is the TARGET URL, so the live label set is
        #       exactly {instance, job, namespace} (same reasoning as EndpointProbeFailing in
        #       argocd/resources/blackbox/blackbox.yaml). Nothing on this alert churns when
        #       blackbox-exporter moves, so there is no split `for:` clock to repair.
        # (ii)  THE HOLE IS REAL. `replicas: 1` (blackbox-exporter Deployment), and every probe
        #       in this file is scraped through that one pod — so a roll does not gap one series,
        #       it empties every probe at once, staleness-marked instantly.
        # (iii) THE DIRECTION IS `min_over_time`, NOT `max_over_time`. LOW is the bad reading
        #       here (`probe_success == 0`), so `max` would hold the healthiest sample of the
        #       window and delay every page by the whole range — class rule (ii), the same trap
        #       GithubRateLimitLow names.
        # (iv)  [5m], sized by #349's bound on EndpointProbeFailing's own data (see the class
        #       block in argocd/resources/blackbox/blackbox.yaml for the full measurement). The
        #       same single prober serves both probe sets, so the same bound applies.
        # CEILING, asserted rather than assumed: a hole wider than [5m] (crash-loop, cold image
        # pull, node drain) still empties the range and restarts `for: 10m`. Accepted, as in #313.
        # NOT the #313 masking trade-off: there is no aggregation here, so nothing can mask
        # anything — each target keeps its own series and its own alert.
        - alert: RegistryMirrorProbeFailing
          expr: min_over_time(probe_success{job="blackbox-mirrors"}[5m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Registry mirror probe failing: {{ $labels.instance }}"
            description: "{{ $labels.instance }} has failed its blackbox probe for 10m (job {{ $labels.job }}). The mirror is returning 5xx or not answering at all. ⚠ Since homelab#1282 the expr reads a 5m range, so this means at least one failed probe in every 5m window across those ten minutes, and up to 5m may have passed since the last one — check probe_success{instance=\"{{ $labels.instance }}\"} before concluding it is still down. Remedy: bounce the mirror Deployment — kubectl -n registry-cache rollout restart deploy/mirror-<name> (see docs/runbook.md §Registry cache)."
        # Per-blob 5xx detection via registry debug metrics (homelab#1297). The /v2/ probe
        # (RegistryMirrorProbeFailing) misses the poison signature: a mirror whose /v2/ answers
        # 200 all along while ONE committed blob 500s on every HEAD/ranged-GET. The registry's
        # debug endpoint (REGISTRY_HTTP_DEBUG_ADDR=:5001 on each mirror) exposes
        # registry_http_requests_total with handler="blob" for blob-layer requests. A sustained
        # non-zero 5xx rate on the blob handler means a specific blob is consistently failing.
        #
        # ── THE RESTART-GAP TEST ────────────────────────────────────────────────────────────────
        # Same class as RegistryMirrorProbeFailing: each mirror is `replicas: 1`, and a roll
        # gaps the registry's own metrics series. The [5m] range on rate() bridges the gap
        # (rate looks back 5m and uses whatever samples it finds; a gap shorter than 5m still
        # has samples in the range). `for: 10m` ensures the condition is sustained.
        # CEILING: a hole wider than 5m (crash-loop, cold image pull, node drain) still resets
        # the window. Accepted, as in #313/#349.
        - alert: RegistryMirrorBlob5xxRate
          expr: rate(registry_http_requests_total{handler="blob", code=~"5.."}[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Registry mirror {{ $labels.instance }} has sustained 5xx on blob requests"
            description: "{{ $labels.instance }} has had a non-zero 5xx rate on blob (layer) requests for 10m. This is the per-blob poison signature #1282 documents — a specific blob is consistently failing while /v2/ may still answer 200. Check which blob codes are 5xx-ing: increase(registry_http_requests_total{instance=\"{{ $labels.instance }}\",handler=\"blob\",code=~\"5..\"}[10m]). Remedy: bounce the mirror Deployment — kubectl -n registry-cache rollout restart deploy/mirror-<name> (see docs/runbook.md §Registry cache)."
