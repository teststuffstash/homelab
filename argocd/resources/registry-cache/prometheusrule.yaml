# Mirror cache-disk alerts (#80 / #47's promised early warning). A pull-through cache with a
# full disk does NOT crash — it silently TRUNCATES in-flight blob writes, and consumers see
# layer digest mismatches + 500s (homelab#48). So the alert must fire well before 100%: at
# ~85% the write path still works and the fix is a purge/TTL decision, not an incident.
# Prometheus picks up PrometheusRules cluster-wide (ruleSelectorNilUsesHelmValues=false).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: registry-cache
  labels:
    app: registry-cache
spec:
  groups:
    - name: registry-cache
      rules:
        - alert: RegistryMirrorCacheAlmostFull
          expr: >
            kubelet_volume_stats_available_bytes{namespace="registry-cache"}
              / kubelet_volume_stats_capacity_bytes{namespace="registry-cache"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Registry mirror PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
            description: "{{ $labels.persistentvolumeclaim }} has under 15% free. At 100% the mirror truncates in-flight pull-through writes and nodes see digest mismatches/500s instead of a loud failure. Check what's big: legit blobs (capacity/TTL decision — argocd/resources/registry-cache/) vs _uploads debris (should self-reap within ~1h via uploadpurging; if it isn't, that mechanism is broken)."
        # homelab#116's own complaint was "this is not detectable today": a 200-with-0-bytes is
        # invisible to the mirror's metrics and to every consumer until a build fails oddly, and
        # it took four rounds of circles#19 to find. The store-maintenance initContainer now
        # counts dangling links every restart and pushes the count, so the invariant breaking is
        # a metric instead of an archaeology exercise. NON-ZERO MEANS IT ALREADY HAPPENED — the
        # links are repaired by then, but something produced them and that wants explaining.
        - alert: RegistryMirrorDanglingLinks
          expr: registry_mirror_dangling_links_repaired > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mirror }} had {{ $value }} dangling layer link(s) repaired at last restart"
            description: "A repository layer link pointed at a blob that was missing or zero-length — the homelab#116 failure, where the mirror answers HTTP 200 with 0 bytes for a live layer and BuildKit reports 'short read: expected N bytes but got 0'. The links were unlinked so the next pull re-fetches from upstream. Investigate what deleted the blobs: --delete-untagged was removed on 2026-08-07, so a recurrence means a NEW mechanism (check the store-maintenance init log for a wipe, and REGISTRY_PROXY_TTL eviction racing a live reference)."
        # The store now reclaims by WIPING when full rather than by selective deletion. A wipe is
        # correct but not free — it forces a cold re-pull herd, which is what left the abandoned
        # _uploads debris in #80. Frequent wipes therefore mean the PVC is undersized, not that
        # the mechanism is misbehaving.
        - alert: RegistryMirrorWipedRepeatedly
          expr: sum_over_time(registry_mirror_store_wiped[14d]) >= 3
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mirror }} has wiped its cache {{ $value }} times in 14 days"
            description: "The capacity valve is firing often enough to hurt: every wipe costs a full cold re-warm from upstream. This is a SIZING signal — grow the PVC (bulk tier has headroom since wk-metal-04 joined, see docs/storage-ledger.md) rather than lowering the threshold."
        # Weekly GC: the gc-mirrors CronJob (Sunday 04:00 UTC) deletes the mirror pods
        # so the garbage-collect initContainer runs with no writer (FU-136 / #93).
        # This alert fires when it has not completed successfully in >8 days
        # (one weekly cycle + 1 day slack). Two arms:
        #   1. The metric exists but is stale (last success > 8 days ago).
        #   2. The metric is absent — the job has never succeeded — but the CronJob
        #      was created long enough ago that it should have run at least once.
        #      (kube_cronjob_status_last_successful_time is only emitted AFTER the
        #      first successful run; absent() + kube_cronjob_created fills that gap.)
        # Note: absent() preserves its input selector's labels, so $labels.namespace
        # and $labels.cronjob are safe to reference — but they are fixed, so we
        # hardcode them for clarity.
        - alert: RegistryGCMirrorsStale
          expr: >
            (
              kube_cronjob_status_last_successful_time{namespace="registry-cache",cronjob="gc-mirrors"}
                < (time() - 8 * 24 * 3600)
            )
            or
            (
              absent(kube_cronjob_status_last_successful_time{namespace="registry-cache",cronjob="gc-mirrors"})
              and on()
                (kube_cronjob_created{namespace="registry-cache",cronjob="gc-mirrors"}
                   < (time() - 8 * 24 * 3600))
            )
          for: 1h
          labels:
            severity: warning
            triage: none
          annotations:
            summary: "gc-mirrors CronJob in registry-cache has not completed in >8 days"
            description: "The weekly mirror-GC CronJob (gc-mirrors, namespace registry-cache) has not reported a successful run in over 8 days. If this persists, mirror PVCs fill until pulls silently truncate. Check: (1) CronJob exists and is not suspended — kubectl -n registry-cache get cronjob gc-mirrors; (2) recent Jobs — kubectl -n registry-cache get jobs -l cronjob=gc-mirrors; (3) if RBAC or scheduling broke, the pods will show Backoff or RBAC errors in events."
        - alert: RegistryGCMirrorsSuspended
          expr: >
            kube_cronjob_spec_suspend{namespace="registry-cache",cronjob="gc-mirrors"} == 1
          for: 15m
          labels:
            severity: warning
            triage: none
          annotations:
            summary: "gc-mirrors CronJob in registry-cache is suspended"
            description: "The gc-mirrors CronJob (namespace registry-cache) is currently suspended. Mirror PVC garbage collection will not run. Check who suspended it and why: kubectl -n registry-cache get cronjob gc-mirrors -o yaml | grep suspend."
