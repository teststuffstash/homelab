# Pull-through mirror of ghcr.io — sibling of mirror-docker-io.yaml (see its header for the
# design). Anonymous upstream works for public images (all we consume). NB: dockerd's
# registry-mirrors CANNOT use this (Hub-only); ghcr consumers are k3d --registry-config /
# kind containerdConfigPatches / containerd hosts.toml shapes.
# LAN endpoint: http://192.168.40.21 (BGP VIP; also registry-ghcr.registry-cache.svc in-cluster).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-ghcr-data
  namespace: registry-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-bulk
  resources:
    requests:
      # 20→40Gi 2026-08-04 (homelab#99), and this bump is EVIDENCE-BACKED where the last two were
      # reflexes: the GC shipped this morning (639179b) ran and reported `181 blobs marked, 0 blobs
      # and 0 manifests eligible` — so the 17.6G is entirely live, referenced content and there is
      # nothing left to reclaim. The working set genuinely exceeds 20Gi. #93's closing comment
      # pre-committed to exactly this: bump only after collection proves it cannot help.
      # Capacity checked before asking: both replicas are co-located on wk-metal-01 (below), which
      # has 191G physically free and sits at 50% committed — +40G of commitment lands inside it.
      # 40→100Gi 2026-08-07, and this one is a DELIBERATE OVERSIZE rather than a fit to the
      # working set. Since --delete-untagged had to go (homelab#116 — it deleted the digest-pinned
      # images we depend on), the capacity valve of last resort is a FULL WIPE, and a wipe is
      # expensive in a way GC never was: the next day is spent on slow builds while the cache
      # re-warms to roughly where it already was. Operator call: buy headroom instead of paying
      # that repeatedly. At 28.4G actual, 100Gi is >3x the live working set, so the 90% wipe
      # threshold should be unreachable in normal operation and wipes stay a genuine last resort.
      # Affordable only because bulk grew: wk-metal-04 joined the tier the same day, so bulk went
      # from 2 disks (one of them a thin-provisioned VM disk on a 99%-full pool) to 706G
      # allocatable across two independent physical disks.
      storage: 100Gi
      # Replica placement is REAL again (2026-08-07): the co-location note below is obsolete —
      # the two replicas now sit on wk-metal-01 + wk-metal-04, one per zone, as the tier intends.
      # (Was: both on wk-metal-01 because wk-02's allocation couldn't fit the 40Gi expansion.)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-ghcr
  namespace: registry-cache
  labels: { app: mirror-ghcr }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume
  selector:
    matchLabels: { app: mirror-ghcr }
  template:
    metadata:
      labels: { app: mirror-ghcr }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # GC runs HERE, in init, because init is the only moment the store provably has no writer
      # (homelab#93: 17.1G of 20Gi, all legitimate blobs, DELETE_ENABLED=true and nothing ever
      # calling it). `registry garbage-collect` is unsafe against a live registry, and the two
      # obvious ways to stop one — scale to 0, or flip READONLY — both mutate this Deployment,
      # which ArgoCD self-heals back mid-collection. An initContainer needs no mutation at all:
      # the trigger is `kubectl delete pod` (the gc-mirrors CronJob), which is not drift.
      # Failure here must never wedge the cache: a blocked start is a broken mirror now, while a
      # skipped collection is only a full disk later — so the mirror starts either way, and the
      # failure is LOUD in the init log instead of silent. It does happen: docker-io's collection
      # died on `Path not found: .../library/debian/_layers`, an aborted pull leaving a repo dir
      # with _manifests and no _layers, which stops the mark phase dead (cleared 2026-08-04).
      # ⚠ `--delete-untagged` was REMOVED here on 2026-08-07 (homelab#116): in a pull-through
      # cache it deletes exactly the digest-pinned images we depend on, and leaves the layer link
      # behind so the mirror answers 200/0-bytes for a live blob. The capacity it was buying now
      # comes from wipe-if-full instead. Script + full rationale: store-maintenance.yaml.
      initContainers:
        - name: store-maintenance
          image: registry:3.0.0
          command: ["/bin/sh", "/maintenance/maintain.sh"]
          env:
            - { name: MIRROR_NAME, value: "mirror-ghcr" }
            - { name: WIPE_THRESHOLD_PCT, value: "90" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: maintenance, mountPath: /maintenance, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "1",   memory: "512Mi" }
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            - { name: REGISTRY_PROXY_REMOTEURL, value: "https://ghcr.io" }
            # 168h→720h 2026-08-30 (FU-196): this mirror now also carries the private oracle
            # corpus (~6GB/release) — a TTL eviction there re-costs a full upstream pull, which
            # is exactly the ghcr-dependence the credential below exists to remove. Same
            # headroom logic as the 100Gi oversize: the wipe threshold stays the only real valve.
            - { name: REGISTRY_PROXY_TTL, value: "720h" }
            # FU-196 v0: upstream auth so private org images cache too. optional: true — until
            # the operator mints the PAT (scripts/ghcr-mirror-pat-bootstrap.sh) the secret is
            # absent and the mirror serves anonymously, exactly as before. The env lands only
            # on pod restart after the secret appears (FU-190 class) — bounce the pod once.
            - name: REGISTRY_PROXY_USERNAME
              valueFrom:
                secretKeyRef: { name: mirror-ghcr-upstream-auth, key: username, optional: true }
            - name: REGISTRY_PROXY_PASSWORD
              valueFrom:
                secretKeyRef: { name: mirror-ghcr-upstream-auth, key: password, optional: true }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            # ⚠ BLOB-DESCRIPTOR CACHE OFF (homelab#240, 2026-08-11). The image default is
            # `storage.cache.blobdescriptor: inmemory` — a per-PROCESS map of
            # <repo>/<digest> → Descriptor that is invalidated by exactly two things: an API
            # DELETE, or a restart. Nothing that happens on the storage side clears it, which is
            # what turned one deleted blob into a 46-HOUR LIE: this mirror answered 200 with
            # Content-Length 32 and a zero-byte body for the standard empty-layer blob, killing
            # every agent-base pull with ImagePullBackOff, until a `rollout restart` (which
            # clears the map, not the PVC) fixed it in one shot.
            # THE DELETER IS NOT OUR GC. store-maintenance runs in init, before this process
            # exists, so it cannot skew a cache that has not been populated yet. It is the proxy
            # TTL scheduler below: its OnBlobExpire unlinks the blob from the ONE repository
            # whose TTL fired — clearing only THAT repository's descriptor entry — and then
            # vacuums the blob out of the GLOBAL content-addressed store with no cross-repo
            # refcount. Every other repository keeps both its layer link and its stale
            # descriptor. The empty layer is the most-shared blob in any registry, so it is the
            # likeliest casualty, not a freak one. (That also answers the soak question left on
            # #241: no, TTL eviction does not check cross-repo references.)
            # WHY OFF IS ENOUGH: the same deletion becomes harmless without the map. The local
            # Stat misses on disk, proxyBlobStore.serveLocal reports "not served", and the proxy
            # re-fetches from upstream — a lie degrades into a cache MISS, and a miss in a
            # pull-through cache is just a slow pull. The cost is one stat(2) per blob request
            # against a local filesystem store, which a proxy barely notices next to the
            # upstream fetch it exists to avoid.
            # NB: "" is how you turn it off — there is no `disabled` value. A provider is
            # selected only on the literal "redis"/"inmemory", so anything else means no cache.
            # Do NOT substitute redis: it relocates the skew instead of removing it (a 2026
            # advisory covers stale-blob resurrection via the repo-scoped redis cache).
            - { name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR, value: "" }
            # Debug/metrics server on :5001 (homelab#1297). Binds ALL interfaces (not
            # 127.0.0.1) because there is NO nginx front on this pod — the ServiceMonitor
            # scrapes this port directly. The ADR-121 registry.yaml precedent binds
            # 127.0.0.1:5002 because that pod HAS an nginx front on :5001; here :5001 is
            # free and the debug server is the only listener on it.
            - { name: REGISTRY_HTTP_DEBUG_ADDR, value: ":5001" }
            - { name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED, value: "true" }
            # Upload-debris reaping (#80, 2026-08-03): concurrent cold pulls of a fat image
            # (arc-runner, ~2.7G layer × N ARC pods) each stream into their own _uploads/ dir;
            # an ENOSPC truncation abandons them, and the DEFAULT purge age of 168h left 9.8G
            # of debris wedging the disk for a week. A pull-through's upload lives minutes —
            # reap at 1h so a herd self-heals within the hour.
            # NB: must be ONE env var holding the whole YAML map — per-key
            # REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING_AGE vars panic the registry
            # ("uploadpurging config key must contain additional keys").
            - name: REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING
              value: "{enabled: true, age: 1h, interval: 15m, dryrun: false}"
          ports:
            - { name: http, containerPort: 5000 }
            - { name: debug, containerPort: 5001 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "2",    memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mirror-ghcr-data }
        - name: maintenance
          configMap: { name: store-maintenance, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ghcr
  namespace: registry-cache
  labels:
    app: mirror-ghcr
    bgp: advertise
  annotations:
    lbipam.cilium.io/ips: "192.168.40.21"
spec:
  type: LoadBalancer
  selector: { app: mirror-ghcr }
  ports:
    - { name: http, port: 80, targetPort: 5000 }
    - { name: debug, port: 5001, targetPort: 5001 }
