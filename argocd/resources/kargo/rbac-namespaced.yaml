# Namespaced grants for the Kargo SAs — the half of the hardened install that replaces the chart's
# ClusterRoleBindings (argocd/platform/kargo.yaml sets rbac.installClusterRoleBindings: false).
# Each RoleBinding binds a CHART ClusterRole (kept in sync by the chart) inside ONE namespace, so a
# chart `*` on secrets/serviceaccounts/roles/rolebindings is `*` in that namespace only.
#
#  - oracle-kargo (the Project namespace): every component's chart role — the controller and
#    management controller do their real work here (Stages/Freight/Promotions, the per-Project
#    Roles/RoleBindings/ServiceAccounts Kargo reconciles, AnalysisRuns).
#  - kargo-shared-resources / kargo-system-resources: the management controller caches Secrets and
#    ConfigMaps in exactly these two (cmd/controlplane/management_controller.go) and replicates
#    shared ones into Projects. The chart already binds the controller/api readers there.
#  - kargo: the management controller finalizes the controller's ServiceAccount (a Role, not the
#    chart ClusterRole — the kargo namespace holds the API's signing-key Secret).
#
#  - the stack jail's workbench SA (`oracle-fleet/oracle-workbench`, oracle-iac
#    `oracle-fleet/agent/workbench.yaml`) gets the chart's `kargo-viewer` ClusterRole inside
#    oracle-kargo: get/list/watch on Stages, Freight, Promotions, Warehouses, AnalysisRuns and
#    their events, nothing on Secrets — so a Kargo rollout can be verified from the oracle jail
#    (the loki-tenant-grants shape: a platform-owned read grant to the workbench outside its own
#    namespace). The workbench is namespace-admin in oracle-fleet and nothing elsewhere. Plus ONE
#    write: create/delete on AnalysisRuns — so the jail can execute a Project AnalysisTemplate as a
#    standalone AnalysisRun (the verdict object on real mirrored traffic, Kargo promoting nothing)
#    and remove its own runs. Not read-only in effect (a run's job provider starts a pod in this
#    namespace), granted because the namespace holds no Secrets and the workbench already owns
#    pods in oracle-fleet; re-read this if a credential ever lands in oracle-kargo.
#
# Names carry `platform-` so they never collide with the RoleBindings Kargo itself creates in the
# Project namespace (kargo-project-admin, kargo-*-read-secrets, kargo-admin/viewer/promoter).
# A NEW Kargo Project = one more copy of the oracle-kargo block (one Project today).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-controller
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-controller
subjects:
  - kind: ServiceAccount
    name: kargo-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-controller-rollouts
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-controller-rollouts
subjects:
  - kind: ServiceAccount
    name: kargo-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-management-controller
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-management-controller
subjects:
  - kind: ServiceAccount
    name: kargo-management-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-webhooks-server
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-webhooks-server
subjects:
  - kind: ServiceAccount
    name: kargo-webhooks-server
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-api
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-api
subjects:
  - kind: ServiceAccount
    name: kargo-api
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-api-rollouts
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-api-rollouts
subjects:
  - kind: ServiceAccount
    name: kargo-api
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-garbage-collector
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-garbage-collector
subjects:
  - kind: ServiceAccount
    name: kargo-garbage-collector
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-management-controller
  namespace: kargo-shared-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-management-controller
subjects:
  - kind: ServiceAccount
    name: kargo-management-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-management-controller
  namespace: kargo-system-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-management-controller
subjects:
  - kind: ServiceAccount
    name: kargo-management-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-kargo-management-controller
  namespace: kargo
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-management-controller
  namespace: kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-kargo-management-controller
subjects:
  - kind: ServiceAccount
    name: kargo-management-controller
    namespace: kargo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-kargo-viewer-oracle-workbench
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-viewer
subjects:
  - kind: ServiceAccount
    name: oracle-workbench
    namespace: oracle-fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-analysisrun-author
  namespace: oracle-kargo
rules:
  - apiGroups: [argoproj.io]
    resources: [analysisruns]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-analysisrun-author-oracle-workbench
  namespace: oracle-kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-analysisrun-author
subjects:
  - kind: ServiceAccount
    name: oracle-workbench
    namespace: oracle-fleet
