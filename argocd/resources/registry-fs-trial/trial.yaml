# FU-280 phase 1 — the first-party registry on a FILESYSTEM (PVC) backend, as a measurable trial.
# TEMPORARY BY CONSTRUCTION: no DNS, no cert, no VIP, no auth front, ClusterIP only. Phase 2 (real
# hostname) waits, and the spike's naming trap is the reason — "registry2.teststuff.net would be a
# throwaway name that outlives the throwaway" (docs/spikes/registry-filesystem-backend.md).
#
# WHAT IT IS FOR, and it is NOT the 2x quota peak: that was measured on 2026-09-24 to cost ZERO
# disk (a Garage server-side COPY shares blocks), so it was never the case. The case is CONTENTION
# — phase 0, from 7 days of history: while the registry pushes, the other tenants' p99 median is
# 9.5x worse (4.72 s vs 0.50 s), the block resync backlog sits at 2106 vs 60, and the Garage
# PodDisruptionBudget is CLOSED 90.6% of the time vs 41.4%, so no zone node can be drained.
#
# SIZING IS THE SELECTOR — 150 Gi is chosen, not arbitrary (operator, 2026-09-24: run it on the two
# SN530s alone, one variable, nothing else's storage disturbed). Longhorn schedules a replica only
# where `available - size > max * storage-minimal-available-percentage` (25). Read live 2026-09-24:
#   mx500   avail 208Gi / max 463Gi -> takes at most  92Gi
#   intel0  avail 131Gi / max 238Gi -> takes at most  71Gi
#   intel1  avail 108Gi / max 238Gi -> takes at most  48Gi
#   sn530   avail 233Gi / max 238Gi -> takes at most 173Gi   (hp-01 AND wk-04)
# So anything in 93-173Gi can ONLY land on the two fresh SN530s. No tag is coined to achieve it —
# which is the same "a tag is only for a disk you want to EXCLUDE" ruling that sent nx-01 to `fast`.
# ⚠ VERIFY after binding, do not assume: `kubectl -n longhorn-system get replicas.longhorn.io`
# must show exactly two, one per SN530. If a third disk ever frees up, this trick stops working.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-fs-trial
  namespace: registry-fs-trial
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk   # replica-2; replica-1 was ruled out on availability grounds
  resources:
    requests:
      storage: 150Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-fs-trial
  namespace: registry-fs-trial
  labels: { app: registry-fs-trial }
spec:
  replicas: 1
  # ⚠ Recreate, NOT RollingUpdate: the claim is RWO, so a rolling update deadlocks with the old
  # pod holding the volume and the new one waiting for it.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry-fs-trial }
  template:
    metadata:
      labels: { app: registry-fs-trial }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # the registry writes the PVC as uid 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: registry:3.0.0    # the same tag the live registry runs, so the backend is the one variable
          env:
            - { name: REGISTRY_STORAGE, value: "filesystem" }
            - { name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: "/var/lib/registry" }
            # Carried from the live registry, because they are backend-independent lessons:
            # deletes stay enabled for GC, and the blob-descriptor cache stays OFF (#240 — a stale
            # in-memory descriptor turns one delete into a served lie).
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR, value: "" }
            # One env var holding the whole map — per-key vars panic the registry.
            - name: REGISTRY_STORAGE_MAINTENANCE_UPLOADPURGING
              value: "{enabled: true, age: 1h, interval: 15m, dryrun: false}"
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            # The image's default debug server binds :5001; nothing else is in this pod, but pin it
            # to localhost anyway so the shape matches the live registry's.
            - { name: REGISTRY_HTTP_DEBUG_ADDR, value: "127.0.0.1:5002" }
          ports:
            - { name: http, containerPort: 5000 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-fs-trial }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-fs-trial
  namespace: registry-fs-trial
spec:
  type: ClusterIP          # deliberately NOT a LoadBalancer: no VIP, no hostname, no cert (phase 2)
  selector: { app: registry-fs-trial }
  ports:
    - { name: http, port: 5000, targetPort: 5000 }
