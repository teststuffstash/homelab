# PublicRoute (FU-039 public ingress, ADR-101) — a stack claims a public hostname; the platform
# owns everything else (zone, tunnel plumbing defaults, credentials, deprecation lifecycle,
# edge observability). v1 scope: routes on the PLATFORM zone (teststuff.net) via a PER-CLAIM
# Cloudflare Tunnel — plus, since v1alpha2 (goal #1302), the profile's zone-phase rulesets
# (rate-limit / skip-challenge / CORS / cache) rendered PER CLAIM. Cloudflare keeps ONE
# entry-point ruleset per phase per zone, so this is a live limit — at most one claim per
# profile per zone, and no api+origins claim on the platform zone (its firewall_custom phase
# is the ha mTLS ruleset) — until the aggregation leg lands (docs/cloudflare.md §PublicRoute,
# completion table; FU-039).
#
# v1alpha2: `operationalPaths.public` added 2026-09-17 (FU-206) — optional and additive, so
# stored XRs need no conversion; absent means the ADR-123 default (both paths blocked).
# v1alpha2: profile field (consumer|api) added — the route class fans out edge defaults the
# way ADR-101's zone classes fan out zone defaults (docs/cloudflare.md §Predicted shape).
# v1alpha2 is the referenceable (storage) version; v1alpha1 remains served for legacy claims
# (no profile field — defaults to consumer-class rendering via the composition's fallback).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpublicroutes.platform.teststuff.net
spec:
  group: platform.teststuff.net
  names:
    kind: XPublicRoute
    plural: xpublicroutes
  claimNames:
    kind: PublicRoute
    plural: publicroutes
  versions:
    - name: v1alpha1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [hostname, backend]
              properties:
                zone:
                  type: string
                  default: teststuff.net
                  description: >-
                    Which zone the route lives in (ADR-101 zone classes). Platform zone
                    (teststuff.net, the default): any namespace may claim inside its delegated
                    subtree. Product zone (e.g. minutark.ee): ONLY the owning namespace may
                    claim, anywhere in the zone incl. the apex — the owner map is a platform
                    constant in the composition.
                hostname:
                  type: string
                  description: >-
                    Public FQDN. Platform zone: must lie in the claiming namespace's delegated
                    subtree (<anything>.<namespace>.teststuff.net). Product zone: must be the
                    zone apex or inside it. Enforced by the composition (the XRD is the
                    privilege boundary; Cloudflare has no sub-zone grain).
                backend:
                  type: object
                  required: [service, port]
                  properties:
                    service:
                      type: string
                      description: In-cluster origin host (Service FQDN — use a trailing dot to defeat ndots search expansion, see docs/cloudflare.md gotcha #1).
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum: [http, https]
                      default: http
                    originServerName:
                      type: string
                      description: TLS SNI/verify name when protocol=https.
                    noTLSVerify:
                      type: boolean
                      default: false
                replicas:
                  type: integer
                  default: 1
                  description: cloudflared connector replicas in the claiming namespace.
    - name: v1alpha2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [hostname, backend, profile]
              properties:
                zone:
                  type: string
                  default: teststuff.net
                  description: >-
                    Which zone the route lives in (ADR-101 zone classes). Platform zone
                    (teststuff.net, the default): any namespace may claim inside its delegated
                    subtree. Product zone (e.g. minutark.ee): ONLY the owning namespace may
                    claim, anywhere in the zone incl. the apex — the owner map is a platform
                    constant in the composition.
                hostname:
                  type: string
                  description: >-
                    Public FQDN. Platform zone: must lie in the claiming namespace's delegated
                    subtree (<anything>.<namespace>.teststuff.net). Product zone: must be the
                    zone apex or inside it. Enforced by the composition (the XRD is the
                    privilege boundary; Cloudflare has no sub-zone grain).
                profile:
                  type: string
                  enum: [consumer, api]
                  description: >-
                    The route class (docs/cloudflare.md §Predicted shape). consumer: edge
                    caching defaults on, RUM/client telemetry available, challenges legal.
                    api: per-IP rate limiting ON, NO challenge-shaped mitigations reach the
                    route, structured 429 on limit. REQUIRED — no default on the object
                    (the 2026-07-16 API-server-stamp/OutOfSync lesson).
                backend:
                  type: object
                  required: [service, port]
                  properties:
                    service:
                      type: string
                      description: In-cluster origin host (Service FQDN — use a trailing dot to defeat ndots search expansion, see docs/cloudflare.md gotcha #1).
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum: [http, https]
                      default: http
                    originServerName:
                      type: string
                      description: TLS SNI/verify name when protocol=https.
                    noTLSVerify:
                      type: boolean
                      default: false
                rateLimit:
                  type: object
                  description: >-
                    Per-IP rate limiting configuration (api profile only; ignored for
                    consumer). Platform default-when-silent: 1200 req/min (≈ 20 req/s fleet
                    capacity). Bounds: 60-6000.
                  properties:
                    threshold:
                      type: integer
                      description: >-
                        Requests per minute per source IP. Platform default-when-silent: 1200.
                        Bounds: 60-6000.
                      minimum: 60
                      maximum: 6000
                      default: 1200
                origins:
                  type: array
                  description: >-
                    Allowed CORS origins (api profile only; ignored for consumer). Each entry
                    is a scheme + hostname (e.g. https://app.minutark.ee). Empty or absent
                    means no CORS restriction at the edge — the origin controls its own CORS
                    policy.
                  items:
                    type: string
                    pattern: ^https?://[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]+)?$
                operationalPaths:
                  type: object
                  description: >-
                    Operational paths (docs/glossary.md) — the backend's non-public HTTP paths.
                    The platform blocks /metrics and /healthz (and their subpaths) on EVERY
                    PublicRoute, both profiles, by default (ADR-123); the LAN scrape/probe path
                    is untouched. List a default path under `public` to opt it back into public
                    service — an honest consumer rarely wants one.
                  properties:
                    public:
                      type: array
                      description: >-
                        Subset of the platform default list (/metrics, /healthz) to keep
                        publicly served. Anything not listed here is blocked.
                      items:
                        type: string
                        enum: ["/metrics", "/healthz"]
                originMark:
                  type: object
                  required: [header, value]
                  description: >-
                    Edge-asserted origin mark (profile-agnostic, oracle-fleet#667). When set, the
                    platform renders a request-header transform on this hostname: a request from
                    the homelab's own WAN egress gets `header: value`; from any other source that
                    header is REMOVED, so a client-supplied copy never reaches the origin. Lets an
                    origin tell OUR traffic (probers, rides, the jail seat) from a stranger's
                    without any client stamping a header on the way out. The egress address is a
                    PLATFORM fact — read at every reconcile, never carried in the claim. ⚠ ONE
                    claim per zone may set this: http_request_late_transform takes one entry-point
                    ruleset per zone like every other phase (FU-039).
                  properties:
                    header:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9-]*$
                      maxLength: 64
                      description: Header name to assert, e.g. X-Oracle-Origin.
                    value:
                      type: string
                      maxLength: 64
                      description: Literal value set on homelab-originated requests, e.g. homelab.
                replicas:
                  type: integer
                  default: 1
                  description: cloudflared connector replicas in the claiming namespace.