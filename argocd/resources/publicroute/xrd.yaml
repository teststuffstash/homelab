# PublicRoute (FU-039 public ingress, ADR-101) — a stack claims a public hostname; the platform
# owns everything else (zone, tunnel plumbing defaults, credentials, deprecation lifecycle,
# edge observability). v1 scope: routes on the PLATFORM zone (teststuff.net) via a PER-CLAIM
# Cloudflare Tunnel — plus, since v1alpha2 (goal #1302), the profile's zone-phase rulesets
# (rate-limit / skip-challenge / CORS / cache) rendered PER CLAIM. Cloudflare keeps ONE
# entry-point ruleset per phase per zone, so this is a live limit — at most one claim per
# profile per zone, and no api+origins claim on the platform zone (its firewall_custom phase
# is the ha claim's mTLS ruleset) — until the aggregation leg lands (docs/cloudflare.md §PublicRoute,
# completion table; FU-039).
#
# v1alpha2: `mtls`, `cacheRule`, `rum`, `imports` added 2026-10-26 (the ha.teststuff.net retrofit,
# FU-039 consumer #2) — all optional and additive like operationalPaths: no storage flip, no
# stranded composites (docs/cloudflare.md gotchas 4/5). Absent = today's rendering.
# v1alpha2: `operationalPaths.public` added 2026-09-17 (FU-206) — optional and additive, so
# stored XRs need no conversion; absent means the ADR-123 default (both paths blocked).
# v1alpha2: profile field (consumer|api) added — the route class fans out edge defaults the
# way ADR-101's zone classes fan out zone defaults (docs/cloudflare.md §Predicted shape).
# v1alpha2 is the referenceable (storage) version; v1alpha1 remains served for legacy claims
# (no profile field — defaults to consumer-class rendering via the composition's fallback).
# NO schema `default:` (G4, docs/dependency-upgrades.md §Gap register): the API server stamps a
# default into every stored claim, which drifts the claim's ArgoCD app from git. Every
# default-when-silent below lives in the Composition, where the field is read; manifest-lint fails
# on a new one (2026-10-10: the last nine dropped, render-proven identical with `devbox run xr-render`).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpublicroutes.platform.teststuff.net
spec:
  group: platform.teststuff.net
  names:
    kind: XPublicRoute
    plural: xpublicroutes
  claimNames:
    kind: PublicRoute
    plural: publicroutes
  versions:
    - name: v1alpha1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [hostname, backend]
              properties:
                zone:
                  type: string
                  description: >-
                    Which zone the route lives in (ADR-101 zone classes). Platform zone
                    (teststuff.net, the default): any namespace may claim inside its delegated
                    subtree. Product zone (e.g. minutark.ee): ONLY the owning namespace may
                    claim, anywhere in the zone incl. the apex — the owner map is a platform
                    constant in the composition.
                hostname:
                  type: string
                  description: >-
                    Public FQDN. Platform zone: must lie in the claiming namespace's delegated
                    subtree (<anything>.<namespace>.teststuff.net). Product zone: must be the
                    zone apex or inside it. Enforced by the composition (the XRD is the
                    privilege boundary; Cloudflare has no sub-zone grain).
                backend:
                  type: object
                  required: [service, port]
                  properties:
                    service:
                      type: string
                      description: In-cluster origin host (Service FQDN — use a trailing dot to defeat ndots search expansion, see docs/cloudflare.md gotcha #1).
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum: [http, https]
                    originServerName:
                      type: string
                      description: TLS SNI/verify name when protocol=https.
                    noTLSVerify:
                      type: boolean
                replicas:
                  type: integer
                  description: cloudflared connector replicas in the claiming namespace.
    - name: v1alpha2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [hostname, backend, profile]
              properties:
                zone:
                  type: string
                  description: >-
                    Which zone the route lives in (ADR-101 zone classes). Platform zone
                    (teststuff.net, the default): any namespace may claim inside its delegated
                    subtree. Product zone (e.g. minutark.ee): ONLY the owning namespace may
                    claim, anywhere in the zone incl. the apex — the owner map is a platform
                    constant in the composition.
                hostname:
                  type: string
                  description: >-
                    Public FQDN. Platform zone: must lie in the claiming namespace's delegated
                    subtree (<anything>.<namespace>.teststuff.net) — unless the namespace is one
                    of the zone's PLATFORM-OWNED namespaces (the composition's zone map, e.g.
                    home-assistant for ha.teststuff.net), which claim anywhere in the zone like a
                    product-zone owner. Product zone: must be the zone apex or inside it. Enforced
                    by the composition (the XRD is the privilege boundary; Cloudflare has no
                    sub-zone grain).
                profile:
                  type: string
                  enum: [consumer, api]
                  description: >-
                    The route class (docs/cloudflare.md §Predicted shape). consumer: edge
                    caching defaults on, RUM/client telemetry available, challenges legal.
                    api: per-IP rate limiting ON, NO challenge-shaped mitigations reach the
                    route, structured 429 on limit. REQUIRED — no default on the object
                    (the 2026-07-16 API-server-stamp/OutOfSync lesson).
                backend:
                  type: object
                  required: [service, port]
                  properties:
                    service:
                      type: string
                      description: In-cluster origin host (Service FQDN — use a trailing dot to defeat ndots search expansion, see docs/cloudflare.md gotcha #1).
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum: [http, https]
                    originServerName:
                      type: string
                      description: TLS SNI/verify name when protocol=https.
                    noTLSVerify:
                      type: boolean
                rateLimit:
                  type: object
                  description: >-
                    Per-IP rate limiting configuration (api profile only; ignored for
                    consumer). Platform default-when-silent: 1200 req/min (≈ 20 req/s fleet
                    capacity). Bounds: 60-6000.
                  properties:
                    threshold:
                      type: integer
                      description: >-
                        Requests per minute per source IP. Platform default-when-silent: 1200.
                        Bounds: 60-6000.
                      minimum: 60
                      maximum: 6000
                origins:
                  type: array
                  description: >-
                    Allowed CORS origins (api profile only; ignored for consumer). Each entry
                    is a scheme + hostname (e.g. https://app.minutark.ee). Empty or absent
                    means no CORS restriction at the edge — the origin controls its own CORS
                    policy.
                  items:
                    type: string
                    pattern: ^https?://[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]+)?$
                operationalPaths:
                  type: object
                  description: >-
                    Operational paths (docs/glossary.md) — the backend's non-public HTTP paths.
                    The platform blocks /metrics and /healthz (and their subpaths) on EVERY
                    PublicRoute, both profiles, by default (ADR-123); the LAN scrape/probe path
                    is untouched. List a default path under `public` to opt it back into public
                    service — an honest consumer rarely wants one.
                  properties:
                    public:
                      type: array
                      description: >-
                        Subset of the platform default list (/metrics, /healthz) to keep
                        publicly served. Anything not listed here is blocked.
                      items:
                        type: string
                        enum: ["/metrics", "/healthz"]
                originMark:
                  type: object
                  required: [header, value]
                  description: >-
                    Edge-asserted origin mark (profile-agnostic, oracle-fleet#667). When set, the
                    platform renders a request-header transform on this hostname: a request from
                    the homelab's own WAN egress gets `header: value`; from any other source that
                    header is REMOVED, so a client-supplied copy never reaches the origin. Lets an
                    origin tell OUR traffic (probers, rides, the jail seat) from a stranger's
                    without any client stamping a header on the way out. The egress address is a
                    PLATFORM fact — read at every reconcile, never carried in the claim. ⚠ ONE
                    claim per zone may set this: http_request_late_transform takes one entry-point
                    ruleset per zone like every other phase (FU-039).
                  properties:
                    header:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9-]*$
                      maxLength: 64
                      description: Header name to assert, e.g. X-Oracle-Origin.
                    value:
                      type: string
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                      maxLength: 64
                      description: >-
                        Literal value set on homelab-originated requests, e.g. homelab. The
                        charset is deliberately narrow — no quote, `$`, backslash or whitespace:
                        this string is interpolated into a quoted HCL string literal in the
                        rendered Workspace module, so an unconstrained value would be an HCL
                        injection applied with the platform's Cloudflare credential. Same guard
                        as the sibling `header` field.
                mtls:
                  type: object
                  description: >-
                    Client-certificate mTLS enforcement at the edge (profile-agnostic; the ha.teststuff.net
                    retrofit, FU-039 consumer #2). `enforce: true` renders a block rule for this
                    hostname without a verified client certificate
                    (`not cf.tls_client_auth.cert_verified`) in the zone's http_request_firewall_custom
                    ruleset — which this claim then OWNS, so the ADR-123 operational-path block joins
                    it at the edge too. The CREDENTIAL half is not the claim's: the zone's
                    managed-CA hostname association and the client certificate are done once in
                    tofu/cloudflare (SSL/Certificates write, which the composition's token does not
                    carry) — without the association the edge never asks for a certificate and this
                    rule blocks every request. ⚠ Like the api profile's Skip it claims the zone's
                    custom phase: ONE such claim per zone until zone-phase aggregation (FU-039).
                  properties:
                    enforce:
                      type: boolean
                cacheRule:
                  type: boolean
                  description: >-
                    consumer profile only. Absent or true: render the consumer edge-cache rule
                    (respect_origin, http_request_cache_settings). false: render NO cache rule — the
                    route keeps Cloudflare's zone default (static file extensions only, origin
                    Cache-Control honoured) and the claim does not occupy the zone's cache-settings
                    entry point. For an app, not a page (ha.teststuff.net).
                rum:
                  type: boolean
                  description: >-
                    consumer profile only. Absent or true: render Web Analytics (RUM) for the
                    route — which no token we hold can create today (FU-250: the Workspace stays
                    Synced=False). false: render none (no JS beacon injected into the app's HTML).
                imports:
                  type: object
                  description: >-
                    ADOPT existing Cloudflare objects into this claim's Workspace instead of creating
                    them (Terraform `import` blocks — a zero-gap cutover from a hand-applied root).
                    Platform-owned or zone-owner namespaces only (the composition refuses it for a
                    subtree tenant: adopting an arbitrary record or ruleset id would reach outside
                    the delegated subtree). Inert once imported (an import of a resource already in
                    state is a no-op), so it stays in the claim.
                  properties:
                    dnsRecordId:
                      type: string
                      pattern: ^[0-9a-f]{32}$
                      description: The existing record for `hostname` (updated in place to this claim's tunnel).
                    ruleset:
                      type: object
                      required: [id, name]
                      description: >-
                        The zone's existing http_request_firewall_custom ruleset (requires
                        `mtls.enforce` or the api profile). `name` is the live ruleset's name and
                        is rendered as-is: the provider REPLACES a ruleset on a name change, and a
                        replace is a window with no WAF rule (and a 20217 collision on create).
                      properties:
                        id:
                          type: string
                          pattern: ^[0-9a-f]{32}$
                        name:
                          type: string
                          pattern: ^[A-Za-z0-9][A-Za-z0-9 ._-]*$
                          maxLength: 64
                replicas:
                  type: integer
                  description: >-
                    cloudflared connector replicas in the claiming namespace. A FLOOR of two is
                    applied by the composition (a public hostname never rides one connector), so
                    values below 2 are a no-op.