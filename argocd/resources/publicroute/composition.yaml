# PublicRoute Composition — renders, per claim:
#   1. a provider-terraform Workspace (claim ns): Cloudflare Tunnel + remote config + proxied
#      CNAME on the platform zone; tunnel token → connection secret (claim ns, never git)
#   2. a cloudflared Deployment (claim ns) consuming that token
#   3. profile-specific Cloudflare resources (v1alpha2+):
#      - consumer: edge caching rule (respect-origin, 1h default)
#      - api: per-IP rate-limit rule + no-challenge Skip rule
# SUBTREE ENFORCEMENT lives here (fail-loud template): hostname must be under
# <ns>.teststuff.net. The zone/account ids are platform constants (docs/cloudflare.md).
# v5 provider idioms mirror tofu/cloudflare (the proven ha.teststuff.net one-off, which this
# XRD exists to eventually absorb as consumer #2).
#
# Profile fan-out (v1alpha2+): the profile field (required, no default on the object) selects
# which class defaults the composition renders — the way ADR-101's zone classes fan out zone
# defaults (docs/cloudflare.md §Predicted shape). For v1alpha1 claims (legacy, no profile), the
# composition defaults to consumer-class rendering for backwards compatibility.
# ⚠ Rendering of profile-specific resources: api-profile shapes (rate-limit rule with
# structured 429, no-challenge Skip, CORS/preflight) are filled in (#1304). Consumer-profile
# shapes (edge caching) are filled in (#1306). The FIELD contract and the fan-out seam are
# what #1310 delivered.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: publicroute
spec:
  compositeTypeRef:
    apiVersion: platform.teststuff.net/v1alpha2
    kind: XPublicRoute
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $ns := $xr.spec.claimRef.namespace }}
            {{- $claim := $xr.spec.claimRef.name }}
            {{- $host := $xr.spec.hostname }}
            {{- $b := $xr.spec.backend }}
            {{- /* ADR-101 zone classes (platform constants — docs/cloudflare.md §Live IDs).
                 platform: any ns claims inside its delegated subtree. product: ONLY the owning
                 ns, anywhere in the zone (apex included) — the stack owns the whole zone. */}}
            {{- $zones := dict
                  "teststuff.net" (dict "id" "6b63f95592a9e036f8b8f6934511d321" "class" "platform")
                  "minutark.ee"   (dict "id" "fa1b02951c29ee4828b8948d0dd7baaf" "class" "product" "owner" "oracle-fleet") }}
            {{- $zoneName := $xr.spec.zone | default "teststuff.net" }}
            {{- $zone := get $zones $zoneName }}
            {{- if not $zone }}
              {{- fail (printf "PublicRoute %s/%s: zone %q is not a platform-known zone (add it to the composition's zone map — docs/cloudflare.md)" $ns $claim $zoneName) }}
            {{- end }}
            {{- if eq $zone.class "product" }}
              {{- if ne $ns $zone.owner }}
                {{- fail (printf "PublicRoute %s/%s: product zone %q is owned by namespace %q (zone-class doctrine, ADR-101)" $ns $claim $zoneName $zone.owner) }}
              {{- end }}
              {{- if and (ne $host $zoneName) (not (hasSuffix (printf ".%s" $zoneName) $host)) }}
                {{- fail (printf "PublicRoute %s/%s: hostname %q is outside product zone %q" $ns $claim $host $zoneName) }}
              {{- end }}
            {{- else }}
              {{- if not (hasSuffix (printf ".%s.teststuff.net" $ns) $host) }}
                {{- fail (printf "PublicRoute %s/%s: hostname %q is outside the namespace's delegated subtree *.%s.teststuff.net (zone-class + delegations doctrine: docs/cloudflare.md)" $ns $claim $host $ns) }}
              {{- end }}
            {{- end }}
            {{- $res := printf "pr-%s-%s" $ns $claim }}
            {{- $origin := printf "%s://%s:%d" (default "http" $b.protocol) $b.service (int $b.port) }}
            {{- /* Profile fan-out: v1alpha2+ claims carry .spec.profile (required, no default).
                 v1alpha1 claims (legacy, no profile field) default to consumer-class rendering
                 for backwards compatibility. */}}
            {{- $profile := or $xr.spec.profile "consumer" }}
            {{- $rateLimit := 1200 }}
            {{- if $xr.spec.rateLimit }}{{ $rateLimit = $xr.spec.rateLimit.threshold }}{{ end }}
            ---
            apiVersion: tf.upbound.io/v1beta1
            kind: Workspace
            metadata:
              name: {{ $res }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: workspace
            spec:
              providerConfigRef:
                name: default
              writeConnectionSecretToRef:
                namespace: {{ $ns }}
                name: {{ $res }}-tunnel
              forProvider:
                source: Inline
                module: |
                  # platform constants (docs/cloudflare.md §Live IDs)
                  locals {
                    account_id = "07b08646b26bb43cd3073826f43b73da"
                    zone_id    = "{{ $zone.id }}" # {{ $zoneName }} ({{ $zone.class }} zone)
                  }
                  resource "cloudflare_zero_trust_tunnel_cloudflared" "this" {
                    account_id = local.account_id
                    name       = "{{ $res }}"
                    config_src = "cloudflare"
                  }
                  data "cloudflare_zero_trust_tunnel_cloudflared_token" "this" {
                    account_id = local.account_id
                    tunnel_id  = cloudflare_zero_trust_tunnel_cloudflared.this.id
                  }
                  resource "cloudflare_zero_trust_tunnel_cloudflared_config" "this" {
                    account_id = local.account_id
                    tunnel_id  = cloudflare_zero_trust_tunnel_cloudflared.this.id
                    config = {
                      ingress = [
                        {
                          hostname = "{{ $host }}"
                          service  = "{{ $origin }}"
                          {{- if or $b.originServerName $b.noTLSVerify }}
                          origin_request = {
                            {{- if $b.originServerName }}
                            origin_server_name = "{{ $b.originServerName }}"
                            {{- end }}
                            {{- if $b.noTLSVerify }}
                            no_tls_verify = true
                            {{- end }}
                          }
                          {{- end }}
                        },
                        { service = "http_status:404" },
                      ]
                    }
                  }
                  resource "cloudflare_dns_record" "this" {
                    zone_id = local.zone_id
                    name    = "{{ $host }}"
                    type    = "CNAME"
                    content = "${cloudflare_zero_trust_tunnel_cloudflared.this.id}.cfargotunnel.com"
                    proxied = true
                    ttl     = 1
                  }
                  {{- /* Profile-specific resources — api shapes filled in (#1304), consumer shapes filled in (#1306) */}}
                  {{- if eq $profile "api" }}
                  # --- api profile: per-IP rate limiting ---
                  # Renders a cloudflare_ruleset rate-limit rule on the zone for this hostname.
                  # Threshold from claim field .spec.rateLimit.threshold (default 1200/min,
                  # bounds 60-6000). Structured 429 response body a machine client can parse.
                  resource "cloudflare_ruleset" "rate_limit" {
                    zone_id  = local.zone_id
                    name     = "PublicRoute {{ $host }} rate limit"
                    kind     = "zone"
                    phase    = "http_ratelimit"
                    rules {
                      action      = "block"
                      description = "per-IP rate limit ({{ $rateLimit }}/min)"
                      expression  = "(http.host eq \"{{ $host }}\")"
                      ratelimit {
                        characteristics = ["ip.src"]
                        period          = 60
                        requests_per_period = {{ $rateLimit }}
                        mitigation_timeout  = 60
                      }
                      action_parameters {
                        response {
                          status_code = 429
                          content_type = "application/json"
                          content = jsonencode({
                            success = false
                            errors = [{ code = 10429, message = "rate limit exceeded" }]
                            messages = []
                            result = null
                          })
                        }
                      }
                      enabled = true
                    }
                  }
                  # --- api profile: no-challenge Skip rule ---
                  # Ensures NO challenge-shaped mitigation (captcha/managed challenge) reaches
                  # this route. Zone-phase rulesets are per-phase-per-zone (ONE entrypoint per
                  # phase), so this Skip goes on the zone's http_request_firewall_managed phase
                  # ruleset, skipping challenge products (bic, securityLevel, uaBlock) and
                  # challenge phases (http_request_sbfm, http_request_firewall_managed).
                  # The never-challenge invariant is part of #1304 (api profile deliverable).
                  resource "cloudflare_ruleset" "skip_challenge" {
                    zone_id  = local.zone_id
                    name     = "PublicRoute {{ $host }} skip challenge"
                    kind     = "zone"
                    phase    = "http_request_firewall_managed"
                    rules {
                      action      = "skip"
                      description = "api profile: skip all challenge-shaped mitigations"
                      expression  = "(http.host eq \"{{ $host }}\")"
                      action_parameters {
                        products = ["bic", "securityLevel", "uaBlock"]
                        phases  = ["http_request_sbfm", "http_request_firewall_managed"]
                      }
                      enabled = true
                    }
                  }
                  # --- api profile: CORS/preflight ---
                  # Edge-owned CORS headers + preflight handling from the claim's origins
                  # allow-list (.spec.origins). Empty/absent means no CORS restriction at
                  # the edge — the origin controls its own CORS policy.
                  # Preflight: respond to OPTIONS with 204 (no origin round-trip).
                  {{- if $xr.spec.origins }}
                  resource "cloudflare_ruleset" "cors_preflight" {
                    zone_id  = local.zone_id
                    name     = "PublicRoute {{ $host }} CORS preflight"
                    kind     = "zone"
                    phase    = "http_request_firewall_custom"
                    {{- range $i, $origin := $xr.spec.origins }}
                    rules {
                      ref        = "preflight_{{ $i }}"
                      action     = "block"
                      expression = "(http.host eq \"{{ $host }}\" and http.request.method eq \"OPTIONS\" and http.request.headers.origin eq \"{{ $origin }}\")"
                      action_parameters {
                        response {
                          status_code  = 204
                          content_type = "text/plain"
                          content      = ""
                        }
                      }
                      enabled = true
                    }
                    {{- end }}
                  }
                  # CORS response headers: set Access-Control-* on matching origins.
                  resource "cloudflare_ruleset" "cors_headers" {
                    zone_id  = local.zone_id
                    name     = "PublicRoute {{ $host }} CORS headers"
                    kind     = "zone"
                    phase    = "http_response_headers_transform"
                    {{- range $i, $origin := $xr.spec.origins }}
                    rules {
                      ref        = "cors_headers_{{ $i }}"
                      action     = "rewrite"
                      expression = "(http.host eq \"{{ $host }}\" and http.request.headers.origin eq \"{{ $origin }}\")"
                      action_parameters {
                        headers {
                          name      = "Access-Control-Allow-Origin"
                          value     = "{{ $origin }}"
                          operation = "set"
                        }
                        headers {
                          name      = "Access-Control-Allow-Methods"
                          value     = "GET,HEAD,PUT,PATCH,POST,DELETE"
                          operation = "set"
                        }
                        headers {
                          name      = "Access-Control-Allow-Headers"
                          value     = "Content-Type,Authorization,X-Requested-With"
                          operation = "set"
                        }
                        headers {
                          name      = "Access-Control-Max-Age"
                          value     = "86400"
                          operation = "set"
                        }
                      }
                      enabled = true
                    }
                    {{- end }}
                  }
                  {{- end }}
                  {{- else }}
                  # --- consumer profile: edge caching on ---
                  # Respect-origin cache headers with a 1h default TTL.
                  # Filled in (#1306).
                  resource "cloudflare_ruleset" "cache_rule" {
                    zone_id  = local.zone_id
                    name     = "PublicRoute {{ $host }} cache"
                    kind     = "zone"
                    phase    = "http_cache_settings"
                    rules {
                      action      = "set_cache_settings"
                      description = "consumer profile: edge caching default on"
                      expression  = "(http.host eq \"{{ $host }}\")"
                      action_parameters {
                        edge_cache_ttl {
                          mode    = "respect_origin"
                          default = 3600
                        }
                      }
                      enabled = true
                    }
                  }
                  {{- end }}
                  output "tunnel_token" {
                    value     = data.cloudflare_zero_trust_tunnel_cloudflared_token.this.token
                    sensitive = true
                  }
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $res }}-cloudflared
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cloudflared
              labels: { app: {{ $res }}-cloudflared }
            spec:
              replicas: {{ default 1 $xr.spec.replicas }}
              selector:
                matchLabels: { app: {{ $res }}-cloudflared }
              template:
                metadata:
                  labels: { app: {{ $res }}-cloudflared }
                spec:
                  containers:
                    - name: cloudflared
                      # same pin as tofu/cloudflare (the proven one-off)
                      image: cloudflare/cloudflared:2026.5.2@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
                      args: ["tunnel", "--no-autoupdate", "run", "--token", "$(TUNNEL_TOKEN)"]
                      env:
                        - name: TUNNEL_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: {{ $res }}-tunnel
                              key: tunnel_token
                      resources:
                        requests: { cpu: 10m, memory: 32Mi }
                        limits: { memory: 128Mi }
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 65532
                        allowPrivilegeEscalation: false
                        capabilities: { drop: ["ALL"] }
                        seccompProfile: { type: RuntimeDefault }
    - step: ready
      functionRef:
        name: function-auto-ready