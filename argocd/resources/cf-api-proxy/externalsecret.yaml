# The ingress-write token moves HERE and out of provider-terraform's pod env (custody move,
# operator design session 2026-08-09): the reconciler now holds NO Cloudflare credential at all —
# it speaks to this proxy tokenless, and bypassing the allowlist would require a credential the
# pod does not have. Minted by tofu/cloudflare-token/ingress-write.tf; same Infisical key that
# used to arm crossplane-system directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-api-token
  namespace: cf-api-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cf-api-token
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_INGRESS_WRITE
