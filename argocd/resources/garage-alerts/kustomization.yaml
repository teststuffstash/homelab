# Garage alerts and dashboard (FU-093).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - prometheusrule.yaml

configMapGenerator:
  - name: grafana-dashboard-garage
    files:
      - garage.json=dashboard-garage.json
    options:
      labels:
        grafana_dashboard: "1" # the Grafana sidecar discovers this label across ALL namespaces
