# Garage alerts and dashboard (FU-093).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - prometheusrule.yaml

configMapGenerator:
  - name: grafana-dashboard-garage
    files:
      - garage.json=dashboard-garage.json
      # upstream's own dashboard (git.deuxfleurs.fr/Deuxfleurs/garage, script/telemetry/), vendored
      # 2026-09-09 as the raw-rates companion to the SLO view: datasource uid + job label edited, else verbatim.
      - garage-upstream.json=dashboard-garage-upstream.json
    options:
      labels:
        grafana_dashboard: "1" # the Grafana sidecar discovers this label across ALL namespaces
