# Garage admin metrics alerts — the two FU-093 ledger belts (docs/storage-ledger.md).
#
# These depend on `monitoring.metrics.enabled: true` in the garage Application (which renders the
# headless metrics Service + ServiceMonitor against :3903). Without that flag nothing scrapes
# Garage, and these rules evaluate against an empty vector.
#
# ⚠ Known limit, recorded in the ledger doc: this would NOT have helped on 2026-08-24 itself
# (Prometheus shared fate with the failure window — it went read-only too). The belt is for the
# non-shared-fate cases.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-admin-metrics
  namespace: monitoring
  labels:
    app: garage-alerts
spec:
  groups:
    - name: garage-admin-metrics
      rules:
        # DISK FULL BELT — the >80% threshold from the ledger. Garage exposes per-disk avail/total
        # on the admin metrics endpoint; this is the direct detector for the condition that the
        # ledger's ">80% alert" input was designed to catch.
        - alert: GarageDiskFillingUp
          expr: |
            1 - garage_local_disk_avail / garage_local_disk_total > 0.8
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Garage {{ $labels.volume }} volume is {{ $value | humanizePercentage }} full on {{ $labels.pod }}"
            description: >-
              Garage's disk has less than 20% available. The ledger's >80% threshold
              (docs/storage-ledger.md). Check the node's disk usage and whether the Longhorn
              volume or the underlying pve thin pool is filling. A full disk makes Garage go
              read-only — the 2026-08-24 meta wipe started this way. At rf=3 this is ONE zone, not the store: compare the three pods (`garage stats -a` MetaAvail / kubelet_volume_stats). One pod full = rotate that zone from a finished compacted snapshot (docs/garage.md §Metadata reclamation); all three full = capacity.
        # TABLE SIZE DROP-TO-ZERO BELT — the wipe detector. A meta wipe (like the 2026-08-24
        # incident where the LMDB came back with empty tables) makes table_size drop to zero for
        # every table. This alert fires when ANY table that HELD DATA IN THE LAST 7 DAYS reports
        # zero size. The `max_over_time` clause is what keeps it off the by-design-empty tables
        # (admin_token, k2v_index_counter_v2, k2v_item), which is why the plain `table_size == 0`
        # form was replaced (#977, #1013).
        # ⚠ BOUND: that clause is a ROLLING WINDOW, not "was ever populated". A wipe still
        # unrecovered 7 days after the drop stops alerting — every sample in the window is 0 by
        # then. 7d is chosen to sit far outside any plausible detection window. The latch that
        # would remove the bound entirely was considered and rejected in #1015: a latch would
        # make any future transient table's first firing permanent instead of self-clearing in
        # 7d, and the un-latching question (how to unlatch a table legitimately removed by a
        # schema change) has no bounded answer. The rolling window is the right stopping point
        # — a bounded false positive (7d) is preferable to a permanent one. The `for:` window
        # avoids flapping on restarts.
        # ⚠ DENY-LIST: multipart_upload and bucket_mpu_counter are transient by design — an
        # in-flight multipart upload makes them non-zero, and completing it returns them to zero.
        # A deny-list fails safe (every new table is watched by default) whereas an allow-list
        # would fail open (a future table is unwatched forever). Same rot, opposite blast radius.
        - alert: GarageTableEmpty
          expr: |
            table_size{table_name!~"multipart_upload|bucket_mpu_counter"} == 0 and max_over_time(table_size[7d]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Garage table {{ $labels.table_name }} is empty on {{ $labels.pod }}"
            description: >-
              A Garage meta table that should hold data reports zero size. This is the pattern
              from the 2026-08-24 meta wipe (docs/incidents/2026-08-24-pve-thin-pool-garage-meta-wipe.md):
              the LMDB came back with empty tables after a hard VM stop. Check Garage's health
              (`garage status`), the meta volume, and the pod logs. If multiple tables are empty
              simultaneously the meta store may need recovery from the snapshot belt
              (metadataAutoSnapshotInterval: 6h, snapshots in /mnt/data/meta_snapshots).
              This belt only fires within 7 days of the drop — if it resolves without the table
              refilling, the window has slid past the drop rather than the store having recovered;
              check `table_size` directly.
        # COVERAGE GUARD (seat, PR#965 gate read) — the two belts above die SILENTLY if the new
        # :3903 scrape never works (a metrics token, a ServiceMonitor mismatch, or a metric-name
        # drift like `table_size` vs a prefixed family — unverifiable until the scrape is live):
        # an expr over an absent series evaluates to nothing, which is indistinguishable from
        # "everything is fine" (the FU-108/FU-125 class). This alert is the belt's own belt: it
        # fires while EITHER family the belts read is absent, so a dead scrape surfaces as a page
        # instead of as permanent false calm. Expected to fire once at rollout until the
        # ServiceMonitor's first successful scrape — that firing is the acceptance test.
        - alert: GarageAdminMetricsAbsent
          expr: |
            absent(garage_local_disk_total) or absent(table_size)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Garage admin-metrics families are absent — the disk/table belts are blind"
            description: >-
              The garage-admin-metrics belts (GarageDiskFillingUp, GarageTableEmpty) read
              garage_local_disk_total and table_size, and at least one family is absent from
              Prometheus — the scrape is not working (ServiceMonitor selector, metrics token,
              or a metric-name drift), so those belts cannot fire regardless of Garage's state.
              Fix the scrape; do not silence this without confirming both families exist.
    # ── CLUSTER HEALTH AT rf=3 — the 2026-09-08 gap (docs/garage.md §Belts) ─────────────────────
    # garage-0 was unreachable to its peers for minutes EVERY HOUR for three days (Loki: "Too many
    # failed pings", 165/peer in one 90-min window) and nothing Garage-shaped fired: the node
    # belts (NodeDiskIOSaturation) caught 4 short episodes and resolved, rpc_timeout_counter
    # crossed 0.2/s in only 5 of 72 hours. Three views of /health per minute (blackbox Probe
    # garage-health, one target per pod) make "some storage nodes are unavailable" a metric.
    - name: garage-cluster-health
      rules:
        # Acute: a node has seen the cluster degraded in every 5m window for 10m — same bridge
        # shape and reasoning as EndpointProbeFailing (argocd/resources/blackbox/blackbox.yaml).
        - alert: GarageClusterDegraded
          expr: |
            min_over_time(probe_success{job="blackbox-garage-health"}[5m]) == 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Garage cluster degraded as seen from {{ $labels.instance }}"
            description: >-
              This node's /health has not said "fully operational" in any 5m window for 10m — a
              storage node is unavailable from its point of view (or the node itself is off the
              mesh: a partitioned node reports the peers it cannot reach, so read all three
              targets). At rf=3 quorum still serves; the exposure is a SECOND zone. Which peer
              and why: the garage Loki tenant ("Ping timeout", "Too many failed pings from <id>"),
              then the node — the 2026-09-08 class was wk-metal-04's SA400 at 300–760 ms writes.
        # Chronic: the hourly-dropout pattern, which never lasts 10m at a stretch. ≥5 degraded
        # minutes in the last hour, from any node's view.
        - alert: GarageClusterFlapping
          expr: |
            count_over_time(probe_success{job="blackbox-garage-health"}[1h])
              - sum_over_time(probe_success{job="blackbox-garage-health"}[1h]) >= 5
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "Garage cluster degraded ≥5 min in the last hour as seen from {{ $labels.instance }}"
            description: >-
              A storage node keeps dropping off the RPC mesh for minutes at a time — the pattern
              that shadowed multipart parts and stretched UploadPart p99 to 100 s on 2026-09-08
              without any sustained outage. Read the garage Loki tenant for which node id the
              peers cannot ping, then that node's disk latency (node_disk_write_time) and load.
        # The observer-side symptom, from Garage's own counters: RPCs to a peer timing out.
        - alert: GaragePeerRpcTimeouts
          expr: |
            sum by (pod) (rate(rpc_timeout_counter[10m])) > 0.1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Garage {{ $labels.pod }} is timing out RPCs to a peer ({{ $value | humanize }}/s)"
            description: >-
              This pod's RPCs to some peer have been timing out at more than 0.1/s for 15m —
              table reads fall back to the other replica and quorum writes wait. The peer is not
              named in the metric; the pod's log is ("Error pinging <id>: Ping timeout"). On
              2026-09-08 the peers saw 2.2–2.5/s while garage-0 stalled.
