# mgmt-metrics — the management box (thinkcentre, 192.168.2.53) as a scrape target + the belts on
# its loops (FU-252). The box is out of the cluster, so this is a static ScrapeConfig, the
# hypervisors' pattern (argocd/resources/pve-metrics/), on its own job so no pve rule reads it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - scrapeconfig.yaml
  - prometheusrule.yaml
  - reconcile-rollout.yaml   # the fleet rollout's own belts (FU-273) — a file of its own
  - opnsense-drill.yaml      # the weekly OPNsense rebuild drill (FU-297)
  - upgrade-lease.yaml       # the ⚓ upgrade-lease loop's belts (ADR-150)
  - router-verdict.yaml      # the box's `opnsense-test-vm` verdict loop (ADR-152 step 1)

# The operator's progress view — "Management box — now" (uid mgmt-box-now): in-flight leases +
# the box's lifecycle stats, progress from cluster truth, the Mgmt*/UpgradeLease* alerts as a 7-day
# timeline. Same sidecar-discovery vehicle as github-exporter's dashboards (ConfigMap beside the
# rules that emit the series; an edit lands via merge, no tofu apply).
configMapGenerator:
  - name: grafana-dashboard-mgmt-box
    files:
      - mgmt-box.json=dashboard-mgmt-box.json
    options:
      labels:
        grafana_dashboard: "1" # the Grafana sidecar discovers this label across ALL namespaces
