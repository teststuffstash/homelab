# Belts on the management box's apply loop (FU-252, docs/management-box.md §"A standing refusal is
# a THIRD verdict shape"). The measured failure: `mgmt-apply` refused `main` from 2026-09-14 11:42Z
# to 09-18, 2 → 8 addresses, 1101 correct ticks, nothing watching. A liveness belt stays GREEN
# through that — the loop is alive and right to say no — so the primary belt is the AGE of the
# oldest master commit the loop has not accounted for. Commits touching no apply root are stamped
# on the next tick (≤5 min), so only a refusal or a failing loop lets that age grow.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mgmt-metrics
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: mgmt-apply
      rules:
        # 24h: a refusal is a request for a human apply, and a seat session is at most a day away.
        # Past that it is ratcheting — every later master commit to the root joins the same pending
        # apply, and it gets less reviewable the longer it stands.
        - alert: MgmtApplyResidueStale
          expr: |
            (time() - mgmt_apply_unapplied_oldest_timestamp_seconds) > 86400
              and mgmt_apply_unapplied_oldest_timestamp_seconds > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Management box: master has waited {{ $value | humanizeDuration }}+ for an apply"
            description: >-
              The oldest master commit past the box's apply baseline is over a day old.
              `mgmt_apply_refused` says whether it is a standing refusal (and
              `mgmt_apply_refused_addresses` how many addresses it holds). A refusal waits for a human: read the `management-apply` commit STATUS on master's
              head (`gh api repos/teststuffstash/homelab/commits/<sha>/status` — a status is not a
              check-run), then `devbox run mgmt-tf -- plan` and apply by id. A full apply of
              origin/master stamps the baseline and clears the refusal. Not refused? The loop is
              failing before its verdict — the box journal: `journalctl -u mgmt-apply`.
        # The loop itself: ticks every 5 min, an apply may hold it up to 40 min.
        - alert: MgmtApplyLoopStale
          expr: |
            (time() - mgmt_apply_last_ok_tick_timestamp_seconds) > 3600
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Management box apply loop has not completed a tick in over an hour"
            description: >-
              mgmt-apply ticks every 5 minutes; none has finished its evaluation for over an hour
              (a PROBE-FAIL — fetch, lock or classifier — does not count as a tick). On the box:
              `systemctl status mgmt-apply.timer`, `journalctl -u mgmt-apply -n 50`.
        # Exporter up but the loop's file never written (a fresh box, a moved textfile dir):
        # the two belts above would be blind.
        - alert: MgmtApplyMetricsAbsent
          expr: |
            up{job="mgmt-node"} == 1
              unless on (instance) mgmt_apply_last_ok_tick_timestamp_seconds
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Management box is scraped but publishes no mgmt_apply_* metrics"
            description: >-
              node_exporter on the box answers, but the apply loop's textfile
              (/var/lib/node-exporter-textfile/mgmt_apply.prom) is missing, so MgmtApplyResidueStale
              and MgmtApplyLoopStale cannot fire. Check the dir exists and the loop has run since
              the metric change landed (scripts/mgmt-apply.sh emit_metrics).
    - name: mgmt-node
      rules:
        - alert: MgmtBoxDown
          expr: |
            up{job="mgmt-node"} == 0 or absent(up{job="mgmt-node"})
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "The management box (192.168.2.53) is not answering its scrape"
            description: >-
              No scrape of the box's node_exporter for 15m — the box is down, off the LAN, or its
              firewall/exporter unit failed (a NixOS activation that the gate rolled back reverts
              the exporter too). The out-of-band applier is then gone: no plan-on-PR sentinel, no
              apply loop. `ssh` it via the pinned key (docs/management-box.md §MB1).
