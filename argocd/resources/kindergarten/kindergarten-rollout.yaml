# The Forgejo CI's ONLY cluster power: restart deploy/kindergarten (patch its pod template) — nothing
# else, no read of any other object. The token is minted out of band with the TokenRequest API
# (no Secret in git — iac-no-raw-secrets) and stored only as the rasmus/kindergarten Forgejo secret
# ROLLOUT_TOKEN:
#   devbox run -- kubectl --kubeconfig tofu/kubeconfig -n kindergarten create token kindergarten-rollout --duration=8760h
# Expiry = CI's "Publish + roll" step fails with 401 → mint again, replace the Forgejo secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kindergarten-rollout
  namespace: kindergarten
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kindergarten-rollout
  namespace: kindergarten
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [kindergarten]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kindergarten-rollout
  namespace: kindergarten
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kindergarten-rollout
subjects:
  - kind: ServiceAccount
    name: kindergarten-rollout
    namespace: kindergarten
