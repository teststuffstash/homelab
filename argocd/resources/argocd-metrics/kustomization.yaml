# The ArgoCD belt: scrape the application- and notifications-controllers, alert on Degraded apps,
# failed syncs, failed notification deliveries and the belt's own absence (docs/dependency-upgrades.md
# §5 Monitoring; docs/agents/iac-lane.md §"ArgoCD health is NOT the post-deploy gate").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - podmonitor-application-controller.yaml
  - podmonitor-notifications-controller.yaml
  - prometheusrule.yaml
