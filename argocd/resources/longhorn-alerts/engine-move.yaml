# Longhorn engine-move progress, read from CLUSTER truth (operator ruling 2026-10-11, FU-301 S9):
# a box-run engine move (docs/management-box.md §Helm release applies, item 4) is judged by what
# the cluster says about its Volumes and EngineImages, never by the management box's own metrics —
# the box can be mistaken about itself (2026-10-11: its apply loop logged "starting" the engines
# unit every minute while the unit was running), and a box that disappears for a day must leave
# belts that still work. No `mgmt_*` series appears in any expr here, by design; the box
# contributes lifecycle signals elsewhere.
#
# Source: kube-state-metrics customResourceState (argocd/platform/values/kube-prometheus-stack.yaml)
#   kube_longhorn_engineimage_ref_count{name,image,state}  = .status.refCount (engines + replicas)
#   kube_longhorn_volume_engine_info{volume,namespace,current_image,spec_image,robustness,state,replicas} = 1
# Longhorn's own exporter carries no image label on longhorn_volume_* (verified 2026-10-11), so
# the CRs are the only cluster-side source of "which engine runs this volume".
#
# "Default engine" = the engine image whose TAG equals the longhorn-manager container's tag
# (kube_pod_container_info image_spec; one chart version → one tag for manager and engine, and the
# box moves volumes to the manager's `--engine-image`). Tags, not full references, so a pull-through
# mirror prefix on one side cannot split them; a digest-pinned image WOULD (not used here).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-engine-move
  namespace: monitoring
  labels:
    app: longhorn-alerts
spec:
  groups:
    - name: longhorn-engine-move
      rules:
        # How many engine images carry at least one engine or replica. 1 at rest; 2 from the first
        # moved volume until the last one (a freshly deployed image sits at refCount 0 until then).
        - record: longhorn:engine_images_in_use:count
          expr: |
            count(kube_longhorn_engineimage_ref_count > 0)
        # The manager's tag, as a 1-valued series labelled {tag}; two tags for the length of a
        # manager rollout.
        - record: longhorn:default_engine_tag:info
          expr: |
            max by (tag) (
              label_replace(
                kube_pod_container_info{namespace="longhorn-system", container="longhorn-manager"},
                "tag", "$1", "image_spec", ".*:([^:]+)$")
            )
        # Volumes whose RUNNING engine (status.currentImage) is not the manager's. The `or` leg
        # yields 0 when every volume is on the default and stays ABSENT when KSM is blind (a 0
        # from `vector(0)` would read as "all moved" during a KSM outage). 42 at the chart
        # upgrade, counting down as the box moves them; 0 at the end.
        - record: longhorn:volumes_off_default_engine:count
          expr: |
            count(
              label_replace(kube_longhorn_volume_engine_info, "tag", "$1", "current_image", ".*:([^:]+)$")
                unless on (tag) longhorn:default_engine_tag:info
            )
            or (count(kube_longhorn_volume_engine_info) * 0)
        # The whole move, end to end: the clock starts when the manager runs the new tag (every
        # volume is "off default" from that moment), so 2 h bounds chart apply → last volume moved.
        # 2026-10-11's 1.13.0 run took 07:06Z (EngineImage created) → 08:45Z (old refCount 0) = 1 h 39 m
        # and would NOT have fired; 1.12.1's two STOPPED runs (2026-10-10) left volumes on the old
        # engine overnight and would have.
        - alert: LonghornVolumesOnOldEngine
          expr: |
            longhorn:volumes_off_default_engine:count > 0
          for: 2h
          # triage dig: the Volume/EngineImage CRs and the box's engines-unit journal say which volume stopped the move and why
          labels: { severity: warning, triage: dig }
          annotations:
            summary: "{{ $value }} Longhorn volume(s) still run an engine image other than the manager's default after 2h — the engine move has not finished"
            description: >-
              Cluster truth (FU-301): status.currentImage on the Volume CRs, not the management
              box's view of its own run. Images in use:
              `kube_longhorn_engineimage_ref_count > 0`. The volumes:
              `label_replace(kube_longhorn_volume_engine_info, "tag", "$1", "current_image", ".*:([^:]+)$") unless on (tag) longhorn:default_engine_tag:info`.
              A STOPPED box run (docs/management-box.md §Helm release applies, item 4 + §Resume)
              leaves exactly this; so does a volume the box refuses (unreadable replica count).
        # The move is not PROGRESSING: two images are in use, and an in-use non-default image's
        # refCount has not changed in 1 h — the box's own per-move bound is 60 min (the first
        # 1.12.1 move, one 1-replica volume, took 31 min), so 30 m would false-fire on a healthy
        # slow move. The `for` only rides out an evaluation gap; the window IS the threshold.
        # 2026-10-11: the old refCount fell 160 → 0 continuously over 83 min — never flat for an
        # hour while both images were in use — so this stayed silent across the run.
        - alert: LonghornEngineMoveStalled
          expr: |
            (longhorn:engine_images_in_use:count > 1)
            and on ()
            (
              count(
                label_replace(
                  (delta(kube_longhorn_engineimage_ref_count[1h]) == 0)
                    and (kube_longhorn_engineimage_ref_count > 0),
                  "tag", "$1", "image", ".*:([^:]+)$")
                unless on (tag) longhorn:default_engine_tag:info
              ) > 0
            )
          for: 15m
          # triage dig: a stalled move is a per-volume fault (a HOLD on a 1-replica volume, a refused move) readable in the Longhorn CRs and the box's journal
          labels: { severity: warning, triage: dig }
          annotations:
            summary: "Longhorn engine move stalled — two engine images in use and the old image's refCount has not moved in 1h"
            description: >-
              Cluster truth (FU-301): EngineImage .status.refCount (engines + replicas). The box's
              moves run one volume at a time with a 60-min bound; an hour without a single
              reference leaving the old image means the run stopped, holds, or the box is gone.
              `kube_longhorn_engineimage_ref_count` names the images; the volumes left are
              `longhorn:volumes_off_default_engine:count` (listing PromQL in LonghornVolumesOnOldEngine).
