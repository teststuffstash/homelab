# Garage bucket + key for the first-party push-mode registry (ADR-121, FU-196 v1) — the loki
# shape: platform-owned Workspace, CREATE-pattern, connection secret written straight into the
# registry namespace (no Infisical round-trip; the htpasswd push credential is the one that
# rides Infisical, see htpasswd-externalsecret.yaml).
#
# Sizing (ADR-089: every bucket claim states max_size) — 48Gi since 2026-09-10 (20Gi → 32Gi on
# 2026-09-07 → 48Gi). The rule the cap has to satisfy, learned the hard way twice:
#
#   quota − held ≥ 2 × largest layer      (at COMMIT, not at upload)
#
# A blob push commits in two S3 steps (distribution v3, s3 driver): CompleteMultipartUpload of
# the upload, then Move = a server-side multipart COPY of the whole blob into blobs/sha256/…
# (UploadPartCopy ×N + a second complete), then DeleteObject of the upload. Between the two
# completes the bucket holds the layer TWICE. Garage checks the quota on each complete, refuses
# with `AccessDenied: Bucket size quota is reached` at the second one, the registry maps that
# 403 onto an opaque **500** with no detail reaching skopeo, and `api_s3_error_counter` does not
# move for a quota rejection — so from the consumer's side a 51-minute upload just dies at its
# last byte. Two contract gaps worth remembering rather than re-deriving:
#   - ADR-089 promises an over-cap PUT "fails fast with a legible error at CREATE time". On the
#     multipart/registry path it does not: it fails slow, at commit, illegibly.
#   - Garage exports no per-bucket size metric; GarageDiskFillingUp cannot see a CAP. The
#     garage-meta-rotation controller pushes the admin-API counter every 15 min instead, and
#     RegistryBucketCommitHeadroomLow (prometheusrule.yaml here) holds the 2× rule as an alert.
# History: 2026-09-07 — 12.47 GB held + 10.01 GB against 20Gi, refused at the FIRST complete.
# 2026-09-09 — 16.4 GB held + 2 × 10.64 GB against 32Gi, refused at the COPY's complete
# (Prometheus: 261 UploadPartCopy + 2 CompleteMultipartUpload in the window, zero S3 errors).
#
# WHY 48Gi: the corpus layer is ~10.6 GB and grows; the delta rebuilds the corpus weekly, so
# successive releases share nothing. 48Gi = two held releases (the served pin + one rollback,
# ~21 GB) + the 2× commit (~22 GB) + growth. Until the prune half runs (FU-203: the stack untags
# with its push cred, the Sunday registry-garbage-collect CronJob collects), each unpruned
# release eats ~10 GB of this. Storage side, read 2026-09-10: every zone holds a full copy at
# rf=3; each zone is a 150 GiB longhorn-local-xfs volume at ~79 GiB used / ~71 GiB free, and
# the quotas of all 16 buckets already sum to ~205 GiB against 130 GiB of declared capacity —
# a quota is a ceiling, not a reservation. The bucket that hits the disk first is not this one:
# ert-snapshots (stack-owned) at 82 / 97 GB and +10 GB/week. Revisit alongside zone sizing
# (docs/storage-ledger.md).
#
# RETENTION OWNERSHIP (ADR-085 split: mechanism = platform, policy = IaC) — FU-203:
#   - homelab owns the MECHANISM. Only it can run the prune: `registry garbage-collect` executes
#     in ns `registry` (the oracle SA cannot even read that tenant), needs DELETE_ENABLED and the
#     push credential, and the Garage admin API is the platform's provisioning seam only.
#   - oracle-iac owns the POLICY (the keep-set). Its own spec claims it —
#     oracle-fleet/specs/ingestion/riigiteataja.md: "The registry, repository path, retention,
#     schedule ... are the oracle-iac policy layer (ADR-085 split)" — and only it knows which
#     digest is actually served (the corpus.repository pin). A prune job that decides "prod" from
#     tag names alone would eventually delete a served image: the #240 "served lie" class that
#     already keeps the blob-descriptor cache off in registry.yaml.
#   ⚠ ADR-121 also states the policy ("keep 2 latest prod + latest built"), so that string has two
#     homes today. FU-203 carries the resolution; do not grow a third copy here.
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: registry-garage
  namespace: registry
spec:
  providerConfigRef:
    name: default
  forProvider:
    source: Inline
    module: |
      resource "garage_bucket" "registry" {
        global_alias = "registry"
        max_size     = 51539607552 # 48Gi — sizing note above (ADR-089 cap; raised 2026-09-10)
      }
      resource "garage_key" "registry" { name = "registry" }
      resource "garage_bucket_permission" "registry_rw" {
        bucket_id     = garage_bucket.registry.id
        access_key_id = garage_key.registry.id
        read  = true
        write = true
        owner = false
      }
      output "bucket" {
        value = garage_bucket.registry.global_alias
      }
      output "access_key_id" {
        value = garage_key.registry.id
      }
      output "secret_access_key" {
        value     = garage_key.registry.secret_access_key
        sensitive = true
      }
  writeConnectionSecretToRef:
    namespace: registry
    name: registry-garage-s3
