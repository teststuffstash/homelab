# Push credential for the first-party registry (ADR-121): one htpasswd line (user `releaser`,
# apr1 hash), value in Infisical (REGISTRY_PUSH_HTPASSWD; the PLAIN token sits beside it as
# REGISTRY_PUSH_TOKEN for pushers — the oracle-fleet release workflow gets it as a repo Actions
# secret, an operator console step per docs/secrets.md §Minting doctrine item 2).
# Anonymous pull needs no credential — nginx only guards non-GET/HEAD methods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-htpasswd
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: registry-htpasswd
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: REGISTRY_PUSH_HTPASSWD
---
# The PLAIN push token, materialized separately from the htpasswd hash: this one exists so
# scripts/github-secrets-sync.sh can copy it into the oracle-fleet REGISTRY_PUSH_TOKEN Actions
# secret (the dual-publish credential, PR#352) with the same kubectl-read pattern it uses for
# the S3 pairs — one `devbox run github-secrets-sync` on the host covers rotation. A separate
# Secret on purpose: the htpasswd Secret is volume-mounted whole into the nginx container, and
# the plain token has no business on that filesystem.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-push-token
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: registry-push-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: REGISTRY_PUSH_TOKEN
