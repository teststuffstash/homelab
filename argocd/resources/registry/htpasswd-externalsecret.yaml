# Push credential for the first-party registry (ADR-121): one htpasswd line (user `releaser`,
# apr1 hash), value in Infisical (REGISTRY_PUSH_HTPASSWD; the PLAIN token sits beside it as
# REGISTRY_PUSH_TOKEN for pushers — the oracle-fleet release workflow gets it as a repo Actions
# secret, an operator console step per docs/secrets.md §Minting doctrine item 2).
# Anonymous pull needs no credential — nginx only guards non-GET/HEAD methods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-htpasswd
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: registry-htpasswd
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: REGISTRY_PUSH_HTPASSWD
