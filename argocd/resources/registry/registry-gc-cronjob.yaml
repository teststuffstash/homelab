# The collector for the first-party registry (ADR-121, FU-203) — and the guard that keeps it from
# sweeping a live push. Since FU-280's rollout (2026-09-24) it collects the FILESYSTEM store
# (`registry-data`, registry-fs.yaml); the S3 version and its SigV4 bucket-listing guard are in git
# history.
#
# WHY THE GUARD EXISTS. `registry garbage-collect --delete-untagged` is mark-and-sweep against a
# LIVE registry: a blob already committed to blobs/ whose manifest has not been written yet is
# indistinguishable from garbage, so a sweep takes it and the manifest arriving a moment later
# points at a blob that is gone. That is the #116/#240 "serves 200 with 0 bytes" class, and it does
# not heal. The collector runs daily (03:00Z, 30 min after the stack's 02:30Z untag) and oracle
# releases are development-driven, so the clock alone cannot keep the two apart.
#
# WHAT IT CHECKS: ANY path under `docker/registry/v2/` modified within the last 30 min. Every phase
# of a push writes somewhere in that tree — `_uploads/` while streaming, `blobs/` at commit,
# `_manifests/` at the end. That matters because of the S3 guard's first version, which watched
# `_uploads/` only: on the 2026-09-22 release the layer was committed at 20:13:49 and its
# manifest written at 20:20:48, and for those 6m59s the blob was unreferenced and no `_uploads`
# object existed. That guard answered PROCEED in exactly that state. Enumerate the STATES of the
# thing you are guarding, not the error types of the guard. On a filesystem the check is one
# `find -mmin`. Directory mtimes count too, which errs toward deferring: UPLOADPURGING removing a
# stale upload also touches `_uploads/`, and costs at most a day's collection.
#
# FAIL-SAFE: any error (tree missing, find failing or printing ANY error) DEFERS. "We did not look" must never read as
# "nothing there": a skipped collection costs a day, a bad sweep is permanent. A defer exits 0 so
# the Job stays Successful.
#
# PLACEMENT: the claim is RWO, which Longhorn enforces per NODE, so this pod must land on the node
# where registry-fs has the volume attached — hence the required podAffinity. Two pods sharing one
# filesystem is how the registry's own GC is designed to run (it takes no lock either way).
#
# RESIDUAL RACE, stated plainly: a push that starts AFTER the check and commits a blob before the
# sweep reaches it is still exposed. Collection takes seconds on a filesystem, so the window is small
# but not zero. Closing it properly means read-only mode for the duration
# (REGISTRY_STORAGE_MAINTENANCE_READONLY): heavier, and a job dying mid-run would strand the
# registry read-only. Revisit if this ever collects for a busier repo than one release stream.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-garbage-collect
  namespace: registry
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: default
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { app: registry-fs }
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: registry-data }
          containers:
            - name: registry-gc
              image: registry:3.0.0
              command:
                - /bin/sh
                - -c
                - |
                  tree=/var/lib/registry/docker/registry/v2
                  if [ ! -d "$tree" ]; then
                    echo "=== DEFERRED: $tree is missing — refusing to sweep blind ==="; exit 0
                  fi
                  # busybox find exits 0 on a missing or unreadable path (measured in this
                  # image, 2026-09-24), so the exit code alone cannot mean "we looked":
                  # any stderr output defers too.
                  if ! find "$tree" -mmin -30 > /tmp/recent 2>/tmp/find.err || [ -s /tmp/find.err ]; then
                    echo "=== DEFERRED: find failed: $(head -c 300 /tmp/find.err) ==="; exit 0
                  fi
                  if [ -s /tmp/recent ]; then
                    echo "=== DEFERRED: registry write inside 30 min: $(head -5 /tmp/recent | tr '\n' ' ') ==="
                    echo "collector skipped; the next daily run retries"
                    exit 0
                  fi
                  echo "=== GUARD: PROCEED, nothing under $tree written in 30 min ===" && \
                  echo "=== DRY RUN ===" && \
                  registry garbage-collect --dry-run --delete-untagged /etc/distribution/config.yml && \
                  echo "=== ACTUAL RUN ===" && \
                  registry garbage-collect --delete-untagged /etc/distribution/config.yml && \
                  df -h /var/lib/registry
              env:
                - { name: REGISTRY_STORAGE, value: "filesystem" }
                - { name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: "/var/lib/registry" }
                - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
                - { name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR, value: "" }
              volumeMounts:
                - { name: data, mountPath: /var/lib/registry }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "2",    memory: "1Gi" }
          restartPolicy: Never
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
