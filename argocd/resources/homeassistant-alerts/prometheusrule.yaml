# Home Assistant sensor freshness.
#
# WHY THIS EXISTS. On 2026-08-07, an attempt to measure a power change on pve found
# `sensor.plug_pve_power` pinned at exactly 128.7 W for an hour — through a VM reboot, a node
# drain and a 253 GB fstrim. It had been frozen for NINE DAYS. Every Tuya plug was dead (three
# groups, 5.9/6.7/9.3 days), root cause `API_QPS_LIMIT_OR_DEGRADE`: Tuya's cloud rate-limits the
# account, so the tuya_sharing MQTT push channel cannot fetch its config and no state ever
# arrives.
#
# ⚠ THE TRAP, and the only reason this went unnoticed: a stalled HA integration does NOT mark its
# entities unavailable. `homeassistant_entity_available` stayed **1** for all of them, the
# entities kept their last value, and Prometheus dutifully served that constant forever. The power
# dashboard looked perfectly healthy while showing nine-day-old data. A frozen plausible number is
# worse than a gap — a gap is visible.
#
# So the check cannot be "is it available" or "is there data". It has to be "is the data MOVING",
# which is what last_updated gives us. Same lesson as the storage ledger's "a ledger that isn't
# measured is a spreadsheet" (docs/storage-ledger.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homeassistant-freshness
  labels:
    app: homeassistant-alerts
spec:
  groups:
    - name: homeassistant-freshness
      rules:
        # ── THE #288 RESTART-GAP CLASS, BOTH ALERTS, ONE ARGUMENT (homelab#336) ─────────────────
        # The class has one home (argocd/resources/openrouter-proxy/prometheusrule.yaml — the test
        # is "DOES THE CONDITION OUTLIVE THE ROLL?") and its [10m] default is sized at
        # GithubExporterStale in argocd/resources/github-exporter/prometheusrule.yaml. Both rules
        # below read ONE metric off ONE target and fail the same way, so the reasoning is written
        # once here rather than twice below.
        #
        # (i)   THE CONDITION OUTLIVES ANY HOLE, in the strongest form the test has: a frozen
        #       sensor is EXTERNALLY true. The plug does not start reporting because Prometheus
        #       missed a scrape; only the measurement went away. This is the persisted arm, exactly
        #       as KSM is in #333.
        # (ii)  ONLY THE HOLE HALF. Home Assistant is scraped as a STATIC target at its LAN VIP
        #       (`instance="192.168.40.10:8123"`, `job="home-assistant"`), so there is no `pod` on
        #       these series and `instance` does not change when the HA pod moves — live label set
        #       {domain, entity, friendly_name, instance, job}, read off Prometheus 2026-08-12.
        #       Nothing churns, so `max by (...)` would repair nothing and would cost `entity` and
        #       `friendly_name`, which is the entire content of both annotations.
        # (iii) THE DIRECTION IS `max_over_time`, AND THE CLASS'S RULE (ii) DOES NOT DECIDE IT.
        #       Read naively this is a TIMESTAMP where LOW is bad, which is how CiDispatchStalled
        #       reasons its way to `min_over_time` — but that alert's gauge is CONSTANT per series
        #       (a run's created_at never moves), so there min and max coincide and min is merely
        #       the conservative spelling. This gauge is not constant: it only ever moves FORWARD,
        #       one step per update. That monotonicity is what makes the choice, and it makes it
        #       the other way. `max_over_time` = "the freshest reading we have", which equals the
        #       current value whenever a current sample exists and equals the frozen pre-hole value
        #       when one does not — truthful AND hole-bridging, with no tail either way. `min` would
        #       take the value from 10m ago, firing up to 10m early and ringing 10m after a sensor
        #       recovers. This is GithubExporterStale's shape exactly (a last-success timestamp
        #       under `time() - … > threshold`, #313) and it takes GithubExporterStale's function.
        # (iv)  THE HOLE IS MEASURED, and it is not the one the issue expected. Over the 8 days
        #       Prometheus retains, the HA pod never restarted (0 restarts, 3.6d old at the time of
        #       writing) — yet `homeassistant_last_updated_time_seconds` was staleness-marked four
        #       times: 180s, 180s (2026-08-07 18:00 and 18:08), 120s, 120s (08-08 11:19, 08-09
        #       14:48), and `up{job="home-assistant"}` was 0 for six scrape-minutes in the week. So
        #       the "an HA restart also refreshes last_updated, so this is self-cancelling" reading
        #       covers only the RESTART case: the holes that actually happen here are failed
        #       scrapes against a running HA, and they leave the sensor exactly as frozen as it was
        #       while resetting a 30m and a 2h `for:` window from zero.
        # (v)   [10m], the class's own size, and #349's bound is SLACK here rather than binding —
        #       which is worth checking rather than assuming, since it is what forced [5m] on the
        #       probes in argocd/resources/blackbox/blackbox.yaml. HA renders /api/prometheus on
        #       request, so there is no cached exposition and the composed phantom is `cache + B`
        #       = B; the bound `for: > cache + B` reads 30m > 10m and 2h > 10m, both with room.
        #       Sizing: 3.3x the worst measured hole (180s), 5-8x #288's 69-116s roll.
        #       AND THE RANGE COSTS NOTHING IN EITHER DIRECTION, for (iii)'s reason — the #313
        #       result, carried: `max` takes the NEWEST reading in the window, so it can neither
        #       delay a page (a fresh sample inside the window already puts the age under the
        #       threshold) nor keep one ringing after a sensor starts reporting again. The bridge
        #       buys the hole and nothing else changes, which is why both alerts take the same one.
        # CEILING, asserted rather than assumed: a hole wider than 10m still restarts the window.
        # Both alerts, the hole, the ceiling, the free-in-both-directions claim in (v), the wrong
        # direction from (iii), and the label survival from (ii) are executed in
        # freshness.promtool-test, against the pre-#336 exprs kept as a regression witness in
        # freshness.promtool-rules.
        #
        # Power plugs report continuously (they are the perf/W evidence base — machines/README.md,
        # docs/power-measurements.md — and switch.tuyalocal_thinkcentre is the ThinkCentre's remote
        # power path in the runbook's power-loss recovery). An hour without an update is broken,
        # not quiet. 6h before firing so a brief cloud/wifi blip stays quiet.
        # ⚠ RESTART-GAP BRIDGED (homelab#336 — this group's class block above).
        - alert: HomeAssistantPowerSensorStale
          expr: |
            time() - max_over_time(homeassistant_last_updated_time_seconds{entity=~"sensor.plug_.*_(power|voltage)"}[10m]) > 21600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.entity }} has not updated in {{ $value | humanizeDuration }}"
            description: "A Home Assistant power sensor has stopped receiving updates while still reporting available=1 — its last value is being served as if live. The metering source is the tuya_local LAN-polling integration (FU-038 cutover 2026-08-07; the old tuya_sharing cloud path is GONE — do not chase it). Symptom triage: compare staleness ACROSS entities first (`time() - homeassistant_last_updated_time_seconds`) — one frozen plug points at that device/its LAN; every tuyalocal_* entity frozen at the same instant points at the integration or an HA restart (check `up{job=\"home-assistant\"}` for a scrape gap). Check HA's /api/error_log for `tuya_local`. ⚠ Reloading a config entry republishes cached state ONCE (last_updated jumps, the value does not) — verify the VALUE moves before calling it fixed. Consequences while stale: perf/W numbers are fiction and the ThinkCentre's smart-plug power control does not work."
        # Wider net, deliberately looser: any HA sensor Prometheus scrapes that has gone a full day
        # without moving. Catches the next integration to rot silently without naming it up front.
        # ⚠ Excluded: the Tuya CLOUD integration was DELETED on 2026-08-07 when the plugs moved to
        # LAN polling (FU-038), and what it left behind is four orphaned entity-registry entries
        # (`*_corrected`, the old /10 templates) with no definition anywhere — permanently
        # `unavailable`, so they would fire this every day forever. Clearing them properly needs
        # HA's websocket registry API; until then this exclusion is the cheaper answer. The live
        # readings come from tuya_local and surface as sensor.plug_<box>_*, which the rule above
        # still watches.
        # ⚠ RESTART-GAP BRIDGED (homelab#336 — this group's class block above). Treated IDENTICALLY
        # to its sibling above and deliberately so: same metric, same static target, same direction,
        # same hole. It has the LONGEST window in this file, so a 180s scrape gap costs it two whole
        # hours — by "how much window a hole destroys" it is the strongest case here, not the
        # weakest, whatever its severity says.
        # ⚠ homelab#478: EIGHT BY-DESIGN-STATIC ENTITIES excluded (the #221 re-fire noise half).
        # Each of these only moves on a slow, deliberate schedule, so a full day without an update
        # is DESIGN, not a stalled integration — the alert was reading their staleness as a defect
        # and re-firing on every HA restart. The ids come from the #221 probe comment's class
        # enumeration, resolved to exact entities on 2026-08-18:
        #   • sensor.backup_* — the backup-manager state plus the last-attempted /
        #     last-successful / next-scheduled timestamps; idle between runs.
        #   • sensor.nord_pool_ee_currency — literally always "EUR".
        #   • sensor.redmi_note_9_pro_* — companion-app push sensors from a phone that no longer
        #     reports.
        # ⚠ homelab#221 (2026-08-24, operator): the irrigation pump counters
        # (sensor.office_plants_irrigation_pump_*_water_seconds) ARE excluded now, reversing the
        # earlier "deliberately not excluded" stance. They sit still whenever the soil is wet
        # enough that no watering runs — pump 3 was 4 days "stale" with the node healthy and its
        # soil sensors updating every minute — so their staleness measures how wet the soil is,
        # not integration health. The node-death coverage that kept them here did not go away: it
        # moved to IrrigationNodeSilent below, which reads liveness off the node's 60s-cadence
        # sensors and detects a dead node in ~1.5h instead of this rule's 26h. The node's soilm/
        # wifi/uptime sensors stay under this rule — they DO move, so they cost it nothing.
        - alert: HomeAssistantSensorStale
          expr: |
            time() - max_over_time(homeassistant_last_updated_time_seconds{entity=~"sensor\\..*",entity!~"sensor\\.(smart_plug|backup_(backup_manager_state|last_attempted_automatic_backup|last_successful_automatic_backup|next_scheduled_automatic_backup)|nord_pool_ee_currency|redmi_note_9_pro_(battery_level|battery_state|charger_type)|office_plants_irrigation_pump_[0-9]+_water_seconds).*"}[10m]) > 86400
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.entity }} has not updated in {{ $value | humanizeDuration }}"
            description: "Informational: this HA sensor has not changed in over a day. Some sensors legitimately sit still (daily totals, config-ish selects) — the point of this rule is that a whole GROUP going quiet at once is an integration dying, which is invisible otherwise because HA keeps entities `available` and serves the stale value."
            info_suppressed_ack: "Deliberately dashboard/API-only: InfoInhibitor suppresses severity:info from every dispatch path (runbook §Meta-session probe & triage discipline). Per-entity staleness is too noisy to page; the pageable form of this class is the GROUP-level integration-death alert, and this rule feeds the Alertmanager/Grafana surface a human browses."
        # ── IrrigationNodeSilent — GROUP-level liveness for the ESPHome irrigation node ─────────
        # (homelab#221's better algorithm). The node's fast sensors publish every 60s by config
        # (esphome/config/office-plants-irrigation.yaml) and ADC noise keeps last_updated moving —
        # measured worst staleness over 7d: 24.1min (soilm), 45.2min (wifi), read 2026-08-24.
        # `min` across the five = the FRESHEST of them, so this fires only when the WHOLE node has
        # gone quiet: one saturated/flat sensor cannot fire it alone, and one live sensor holds it
        # down. Threshold 1h = 2.5x the worst measured soilm staleness; with `for: 30m` a dead node
        # is caught ~1.5h in, vs the 26h+2h the generic rule above offered when the pump counters
        # were its tripwire. The aggregation deliberately drops `entity`/`friendly_name` — the
        # subject is the node, not any one sensor.
        # ⚠ RESTART-GAP BRIDGED (homelab#336 — this group's class block above): same [10m] bridge,
        # same direction argument; the min() across entities happens AFTER each series is bridged.
        - alert: IrrigationNodeSilent
          expr: |
            min(time() - max_over_time(homeassistant_last_updated_time_seconds{entity=~"sensor\\.office_plants_irrigation_(soilm_sens_[1-4]|wifi_signal_sensor)"}[10m])) > 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The office-plants irrigation node has been silent for over an hour"
            description: "Every 60s-cadence sensor on the ESPHome irrigation node (4x soil moisture + wifi signal) has stopped updating at once — the node is dead, unreachable, or its HA integration is wedged (HA keeps the entities available and serves the last values, so dashboards look alive). Plants stop being watered when soil thresholds cannot be read. Check the device (devbox run irrigation-logs), then the HA ESPHome integration; service doc docs/office-plants/README.md. The pump *_water_seconds counters are NOT liveness signals — they legitimately freeze for days when soil is wet (homelab#221)."
