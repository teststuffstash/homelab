# The games site: nginx-unprivileged + static files, built by Forgejo rasmus/games
# (scripts/publish.sh — crane, no Docker daemon). `:main` + pullPolicy Always is deliberate: the
# repo's CI restarts this Deployment after each push (games-rollout.yaml), and the immutable
# `:<sha>` tags stay in the registry for a rollback (`kubectl set image` → then re-sync).
# Served via the homelab Gateway as games.homelab.teststuff.net (homelab-gateway/httproute-games.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: games
  namespace: games
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: games }
  template:
    metadata:
      labels: { app: games }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: registry.teststuff.net/games:main
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: games
  namespace: games
spec:
  selector: { app: games }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Lets the platform Gateway's HTTPRoute (ns homelab-gateway) point at Service games here.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: homelab-gateway-httproute-to-games
  namespace: games
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: homelab-gateway
  to:
    - group: ""
      kind: Service
      name: games
