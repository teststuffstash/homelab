# The Forgejo CI's ONLY cluster power: restart deploy/games (patch its pod template) — nothing
# else, no read of any other object. The token is minted out of band with the TokenRequest API
# (no Secret in git — iac-no-raw-secrets) and stored only as the rasmus/games Forgejo secret
# ROLLOUT_TOKEN:
#   devbox run -- kubectl --kubeconfig tofu/kubeconfig -n games create token games-rollout --duration=8760h
# Expiry = CI's "Publish + roll" step fails with 401 → mint again, replace the Forgejo secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: games-rollout
  namespace: games
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: games-rollout
  namespace: games
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [games]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: games-rollout
  namespace: games
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: games-rollout
subjects:
  - kind: ServiceAccount
    name: games-rollout
    namespace: games
