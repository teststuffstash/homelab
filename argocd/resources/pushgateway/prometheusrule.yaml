# Agent-run data-quality + stall alerts (FU-057 polish, 2026-07-10). Prometheus picks up
# PrometheusRules cluster-wide; Alertmanager routes to the HA webhook (tofu/monitoring.tf).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-runs
  labels:
    app: pushgateway
spec:
  groups:
    - name: agent-runs
      rules:
        # ADR-103 rule 3 needs a weekly KPI datum, and the only honest success signal is a retro
        # REPORT landing (the harvest step pushes this timestamp on PR-create; the cron's
        # trigger counter increments on guard-refused runs too — the 2026-08-10 Monday fired at
        # 05:00Z, was refused, and nothing said so until the operator read meta-state 13h later).
        # `or vector(0)` makes never-pushed read as epoch 0, so a retro that has never succeeded
        # fires rather than staying silent forever. severity=warning (info is inhibited
        # cluster-wide); first datum expected 2026-08-17 (operator 2026-08-10: wait for next
        # Monday) — until then this alert states a KNOWN gap, triage is report-only.
        - alert: RetroReportOverdue
          expr: (time() - (max(retro_report_last_success_timestamp) or vector(0))) > 8 * 86400
          for: 6h
          labels:
            severity: warning
            # homelab#239, and this alert is why the label exists. The responder's
            # self-referential gate inferred "loop machinery" from the namespace or an `Agent*`
            # name, and a pushgateway-derived alert has neither: this one sailed through on
            # 2026-08-11, took a `fix` verdict, and dispatched a worker at the retro belt — a
            # CronWorkflow whose re-fire is an argo mutation and whose manifests only a human
            # merges. It ended in an agent/error latch (homelab#237). The label caps the outcome
            # at "author a PR, never auto-merge"; it does NOT silence triage (that is `triage:
            # none`, which this alert must not have — the overdue state is worth diagnosing).
            platform_machinery: "true"
          annotations:
            summary: "No retro report has landed in >8 days — ADR-103 weekly KPI scoring is not producing data"
            description: "The Monday 05:00Z retro-session CronWorkflow has not landed a report PR in over 8 days (or has never landed one since the belt shipped 2026-08-10). The cron may be firing and guard-refusing — check the newest retro-session workflow in ns agent-coordinator and re-fire via: argo -n agent-coordinator submit --from cronworkflow/retro-session. KPI spec: docs/agents/retros/BRIEF.md; belt design: FU-058."
        # A negative cost is a DATA-QUALITY bug, never a discount — the probe-fails-into-a-value
        # class (agent-runtime#12 fixed the known instance; this alert catches regressions and any
        # new path that subtracts against a failed read).
        - alert: AgentRunNegativeCost
          expr: agent_run_cost_usd < 0
          labels:
            severity: warning
          annotations:
            summary: "Agent run reported NEGATIVE cost ({{ $labels.project }} issue {{ $labels.issue }})"
            description: "agent_run_cost_usd={{ $value }} for pod-pushed run (model {{ $labels.model }}, round {{ $labels.round }}) — a probe failed into a value somewhere in the cost pipeline. See agent-runtime#12 for the class."
        # An infra-death burst: ≥3 non-clean terminal runs in an hour on one project means a wall,
        # not bad luck — the meta-2 pattern (three attempts, three walls) as an alert.
        # Pushgateway serves every pushed group FOREVER, so the rule must gate on push freshness:
        # the old count_over_time form counted SCRAPES of stale gauges (~120/h each), and one
        # 3-day-old auth-storm residue (sleep-tracking#20, the FU-021 acceptance test) kept it
        # firing for 2+ days (found 2026-07-12). A run-group is keyed (project, issue, role,
        # round) and holds one agent_run_total series, so "runs in the last hour" = groups whose
        # push_time_seconds is <1h old.
        # `issue!~"scout-.*"` excludes MODEL-SCOUT CANARY rides (homelab#235, 2026-08-10): the weekly
        # scout runs MAX_CANARIES=3 trivial probes per tick in CANARY_PROJECT (defaults to
        # `openrouter-operator`, agents/model-scout.sh:37) against brand-new, unproven models, and
        # `agents/model-scout.sh` already treats a canary failure as expected — "a canary failure never
        # fails the tick". Three of them failing in one 6-minute tick is ONE scout-infra datum, not a
        # fleet infra-death burst (docs/agents/model-routing.md §M7 rule 4, common-cause rule; FU-161),
        # yet it tripped this alert on a project where nothing was broken. `issue` is a PUSHGATEWAY
        # GROUPING-KEY label = `AGENT_TASK` with a leading `issue-` stripped, and canaries push
        # `--task "scout-<mangled-id>"` (model-scout.sh:55), which never starts with `issue-` — so the
        # `scout-` prefix is a sound discriminator, and PromQL's full anchoring makes the matcher mean
        # exactly "does not START with scout-". It also fails OPEN: a series with no `issue` label at
        # all is retained (empty ≠ `scout-.*`), so a push-path change cannot silently mute this alert.
        # ⚠ Nothing else now watches canary deaths — re-typing those verdicts is FU-161 legs 3–4.
        # `blocked-deliberate` joins the exclusion (homelab#314, found by the #288 fixtures with 4
        # such series live in the gateway): it is a HUMAN GATE APPLIED ON PURPOSE — the worker read
        # the issue, judged it unworkable, emitted its structured stop report and exited 0
        # (agent-finalize `classify()`: "That is a DECISION, not a death"). Three of them on one
        # project in an hour raised an infra-death page with no infra death.
        # It is the ONLY deliberate terminal, and that is checked, not assumed: the emitter's closed
        # set is clean | ci-failed | no-artifact | harness-death | auth-storm | budget-403 | timeout
        # | blocked-deliberate | failed, of which DEATH_EXIT_STATUSES = harness-death, auth-storm,
        # budget-403, timeout. `no-artifact` (green in-pod, no PR — dead token / unpushed branch)
        # and `failed` (nonzero exit / no output) are neither deliberate nor healthy, so they STAY
        # counted; the description names `no-artifact` for exactly that reason.
        # DENYLIST, not an allowlist, deliberately — same doctrine as `issue!~"scout-.*"` above: a
        # new terminal the emitter grows is counted by default, so a push-path change cannot
        # silently mute this alert. `exit_status=~"harness-death|auth-storm|budget-403|timeout"`
        # would be tighter and fails CLOSED — a new infra terminal would go unwatched until someone
        # remembered this file. Widening the exclusion by one named value keeps the fail-open.
        - alert: AgentRunInfraDeathBurst
          expr: |
            count by (project) (
                agent_run_total{exit_status!~"clean|ci-failed|blocked-deliberate", issue!~"scout-.*"}
              and on (project, issue, role, round)
                (time() - push_time_seconds{job="agent_run"}) < 3600
            ) >= 3
          labels:
            severity: warning
          annotations:
            summary: "3+ non-clean agent runs in 1h on {{ $labels.project }}"
            description: "Repeated infra-class terminals (auth-storm/no-artifact/harness-death/…) — check the strike comments on the active issue before more budget burns. Deliberate stops (exit_status=blocked-deliberate) and model-scout canary rides (issue=scout-*) are excluded by design and cannot raise this."
        # FU-160 (homelab#287; spike: docs/spikes/ride-latency-breakdown.md): ride phase timings
        # stopped being archaeology. `agents/agent-session.sh` pushes
        # `agent_run_phase_seconds{phase=dispatch-gates|pod-spinup|ride|bookkeeping}` per ride,
        # and this is the belt over them: a degraded image cache adding minutes to every dispatch
        # otherwise presents only as "the loop feels slow", which is exactly what happened to the
        # 2026-08-09 specimen — by the time anyone asked whether its image was node-cached, the
        # pod events had aged out and the question was unanswerable.
        #
        # THE BASELINE IS THE GATEWAY'S OWN HISTORY, not a number someone guessed. There is no
        # measured baseline to hard-code: this alert ships in the same PR as the emitter, so every
        # threshold would be a fiction on merge day. Instead the expr splits the SAME metric on
        # push freshness — the last hour of rides against everything older still held in the
        # gateway — and fires when the recent median doubles. Rewrite it as a fixed seconds
        # threshold only once real data says what the phases cost.
        #
        # Three guards, each answering a way this shape goes wrong:
        #   (1) THE FRESHNESS SPLIT, not a range selector. Pushgateway groups are served FOREVER
        #       and re-scraped every 30s, so `quantile_over_time(...[1h])` would weight a ride by
        #       how long its value sat there — the residue class that kept AgentRunInfraDeathBurst
        #       ringing for two days (FU-021). An INSTANT quantile counts each group exactly once,
        #       which is per-ride, which is what "p50 over 1h" has to mean.
        #   (2) `>= 3` FRESH RIDES. With one ride in the window the p50 IS that ride, and a single
        #       cold-node dispatch would fire this every time. Three is the same "a wall, not bad
        #       luck" line AgentRunInfraDeathBurst draws.
        #   (3) A 60s FLOOR on the recent median. `dispatch-gates` and `bookkeeping` are seconds
        #       long, so a 3s→7s wobble is a 2.3× ratio and means nothing. The floor keeps this
        #       alert about phases that got slow in a way a human would notice.
        # THE DISPATCH ROWS ABOVE THE LAUNCHER ARE NOT IN HERE, and that is a decision rather than
        # an omission (FU-160 coordinator half, homelab#319). They are a SEPARATE metric family,
        # `agent_dispatch_phase_seconds{phase=ring-to-scan|scan|coordinator-spinup|coordinator-
        # session}` pushed by agents/coordinator-scan.sh and agents/coordinator-session.sh, and
        # every guard below would misfire on them: their group is keyed (project, role) with one
        # group per STACK, overwritten at the next dispatch — so there is no older half to be a
        # baseline and no ≥3 fresh RIDES to count, and three of the four rows are seconds long,
        # i.e. under the 60s floor by design. Extending this expr to cover them would produce an
        # alert that is silent for a structural reason while LOOKING like coverage, which is worse
        # than the honest gap. What they get instead is the `Dispatch phase breakdown` panel on the
        # `agent-issue` dashboard; alerting them needs a per-dispatch history this deliberately
        # does not keep (the pushgateway serves every group forever — a per-dispatch key leaks one
        # group per ride).
        # ⚠ FAILS SILENT BY CONSTRUCTION, and that is the accepted trade: no older half (a fresh
        # pushgateway — the store is an emptyDir + persistence file, so a reschedule empties it)
        # means an empty right-hand vector and no alert until history rebuilds. An observability
        # belt that invents a baseline is worse than one that waits for it. `platform_machinery`
        # for the homelab#239 reason: the subject IS the launcher, so a responder may author a PR
        # here and must never auto-merge one.
        - alert: AgentRunPhaseSlow
          expr: |
            (
              (
                quantile by (phase) (0.5,
                    agent_run_phase_seconds
                  and on (project, issue, round, role)
                    (time() - push_time_seconds{job="agent_run_phase"}) < 3600
                ) > 60
              )
              >
              2 * quantile by (phase) (0.5,
                  agent_run_phase_seconds
                and on (project, issue, round, role)
                  (time() - push_time_seconds{job="agent_run_phase"}) >= 3600
              )
            )
            and on (phase)
            (
              count by (phase) (
                  agent_run_phase_seconds
                and on (project, issue, round, role)
                  (time() - push_time_seconds{job="agent_run_phase"}) < 3600
              ) >= 3
            )
          for: 30m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Ride phase {{ $labels.phase }} p50 is {{ $value }}s — over 2× its own baseline"
            description: "SYMPTOM ONLY, and deliberately so — this says a launcher-owned phase got slower, never why. `pod-spinup` = schedule + image pull + container start, and the first thing to check is whether the node had the image (a `:latest` tag defeats the node cache — agents/README.md pinned-versions warning, seen live 2026-08-09); `dispatch-gates` = the launcher's deterministic pre-flight, so a slow gh/kubectl API or a pre-flight that started making more calls; `bookkeeping` = the exit path (stats, arm, strike comment, router report); `ride` is the WHOLE in-pod session and its breakdown is NOT here (agent-finalize's timestamps, agent-runtime — FU-160's other half), so a `ride` bar says where to look, not what happened. Compare against the fleet: `sum by (phase) (agent_run_phase_seconds)` and the `Ride phase breakdown` panel on the `agent-issue` dashboard. Baseline is this metric's own pre-1h history in the pushgateway, so a gateway reschedule (emptyDir) resets it and this alert goes quiet, not red."
        # FU-020 enforcement made loud: a worker egress miss under deny-all manifests as a HANG
        # (devbox install against a blocked FQDN — the nix-cache finding), which the run classifier
        # only names `timeout` much later. This alert names the CAUSE within minutes. `source` is
        # the namespace (hubble drop metric runs sourceContext=namespace, tofu/cilium.tf); scoped to
        # worker namespaces via the AgentStack-claim convention ns==repo — extend the regex when a
        # new stack's fixer repo onboards (or it enforces before its alert exists).
        - alert: AgentWorkerEgressDropped
          # homelab added 2026-08-05: its fixer block (FU-068) enforces egress, and the regex had
          # not followed — exactly the drift the line above warns about. circles stays OUT until
          # its `enforce: false` flips; in monitor mode Cilium never emits a DROPPED verdict.
          expr: sum by (source) (rate(hubble_drop_total{reason="POLICY_DENIED", source=~"oracle-fleet|sleep-tracking|openrouter-operator|homelab|agent-runtime"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Worker egress DROPPED by netpol in {{ $labels.source }}"
            # The first instruction must be a read that works from an IN-CLUSTER responder pod: the
            # agent-coordinator image carries no `hubble`/`cilium` binary and agent-read-infra has no
            # pods/portforward, so the old `devbox run hubble` first step sent the responder into a
            # wall (homelab#125, #137). Prometheus is also usually the whole answer — `destination`
            # already IS the FQDN (drop:destinationContext=dns|ip, tofu/cilium.tf). Full runbook:
            # docs/agents/roles.md §responder; keep the two in sync.
            description: >-
              Sustained POLICY_DENIED drops from namespace {{ $labels.source }}. SYMPTOM ONLY — observed causes so far:
              tool phone-home noise (jetify update+telemetry, 2026-07-21/22 — rides ran fine throughout) and genuine
              allowlist misses; a drop does not imply a hung ride.
              STEP 1, name the destination (works from anywhere, and usually the whole answer): `curl -sG
              http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query --data-urlencode
              'query=topk(10, sum by (source,destination,protocol) (increase(hubble_drop_total{reason="POLICY_DENIED",source="{{ $labels.source }}"}[6h])) > 0)'`
              — in-cluster service DNS, NOT the 192.168.40.13 LAN VIP. `destination` already resolves to the FQDN
              whenever the DNS proxy knew the name (drop:destinationContext=dns|ip, tofu/cilium.tf); widen [6h] to
              [24h]/[7d] before concluding nothing is there, and a bare-IP destination is a finding, not a dead end.
              STEP 2, per-flow detail only (port, timing, exact pod): in-cluster
              `kubectl exec -n kube-system ds/cilium -- hubble observe --namespace {{ $labels.source }} --verdict DROPPED`
              (⚠ ONE node's ring buffer — an absence is not evidence); from a JAIL SESSION ONLY, `devbox run hubble --
              --namespace {{ $labels.source }} --verdict DROPPED` (+ `--protocol dns`). Full runbook:
              docs/agents/roles.md §responder.
              Legit destination → the claim's egress.extraFQDNs; phone-home → kill at the tool (agent-session.sh env),
              never widen policy.
        # 2026-08-05: the coordinator Sensor hit a JetStream AckSync timeout, redelivered the same
        # event in a loop, then kept spinning at ~2-4 cores AFTER the loop went silent — a leaked
        # goroutine. It ate 65% of wk-01 for ~50 min and surfaced only as NodeSystemSaturation,
        # whose triage blamed "burst Job pods with no CPU requests" (they have requests; nothing
        # ran `top`). A wrong diagnosis on a node symptom is the second of its kind (homelab#94),
        # so the guard names the CULPRIT instead of the node. Separation is not a guess: the five
        # infra pods idle at 0-5m, the fault sat at 1887m — this threshold is 100x baseline and
        # 4x below the observed fault. Deleting the pod is the fix; the Deployment recreates it.
        # ⚠ Expect a ~5-10 min tail naming the DELETED pod after you fix one: the 5m rate window
        # still holds its samples. First recurrence (2026-08-05 12:48, homelab#103) showed it.
        # Deliberately NOT suppressed with a join on kube_pod_status_phase — a join that fails
        # would make this MISS a real spin, and a stale name for five minutes is the cheaper fault.
        - alert: AgentEventInfraSpinning
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="agent-coordinator", pod=~".*-(sensor|eventsource)-.*", container!=""}[5m])) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo Events infra pod {{ $labels.pod }} is burning CPU (idle baseline is ~5m)"
            description: "{{ $labels.pod }} in agent-coordinator has held >0.5 cores for 15m; these pods idle near zero, so this is a spin, not load. THE LOG MAY BE COMPLETELY EMPTY — the 2026-08-05 12:48 recurrence logged nothing at all while burning 1692m, so an empty log is NOT evidence the pod is fine. If it does log, look for `AckSync() on message: nats: timeout` with one event id retriggering (a redelivery loop, whose CPU outlives it). Fix: delete the pod, the Deployment recreates it; then check for spurious workflows it submitted (`kubectl -n agent-coordinator get wf --sort-by=.metadata.creationTimestamp`). It RECURS — homelab#103, a restart is palliative."

        # The SECOND half of homelab#103, and the worse half: a wedged coordinate workflow holds
        # the `coordinator-scan` mutex, and every later tick queues behind it Pending. The loop
        # stops dispatching and NOTHING says so — `get wf` shows activity, and the Pending reason
        # ("Waiting for .../Mutex/coordinator-scan") reads as normal serialization. On 2026-08-05
        # a spin artifact wedged mid-`git clone` (zero log bytes in 75s) and held the lock ~24 min
        # across three queued twins plus the 13:00 cron tick; it surfaced only because a watch was
        # explicitly looking for a missing tick.
        # ⚠ THE DEADLINE IS NOT THE LEVER, and the obvious tightening is a trap. `activeDeadlineSeconds`
        # is already 1800 on both coordinate paths, and it cannot go much lower: over 7d/2474 runs the
        # duration distribution is p50 29s, p95 45s, p99 302s — but the tail reaches 1458s, so a "matched
        # to the natural bound" 600s would kill ~9 legitimate scans a week. The wedge hides IN that tail,
        # which is exactly why no timeout distinguishes stuck from busy. So: alert at 900s (measured —
        # 1 legitimate run in 2474 exceeds it) and let the 1800s deadline stay the containment behind it.
        # Verified against the incident's own history (fires on coordinate-perstack-lvsmt, 12:48-13:12)
        # and against the preceding 7 days (fires on NOTHING else — zero false positives).
        #
        # ── RE-KEYED ON THE SCAN PHASE (FU-145, homelab#283) ────────────────────────────────────
        # The 900s threshold above is measured and stays; the SUBJECT is what was wrong. Pod lifetime
        # is not scan duration: the moment the scan dispatches, `coordinator-session.sh` streams the
        # item session synchronously (verified live inside `coordinator-081840`: PID 512 =
        # `kubectl logs -f agent-circles-issue-30-r1`), so any healthy ride >15m fired this alert, on
        # every stack — twice in one hour on 2026-08-06, two false issues minted (#120, #134).
        # `agents/coordinator-scan.sh` now pushes the phase it is in (`scan_phase`, pushgateway job
        # `agent_scan_phase`, grouped by namespace with the pod as a metric label), and the two
        # branches below are the same question asked of a phase instead of a pod:
        #   (1) NO MARKER — the scan has not reached its first dispatch, so pod lifetime IS the
        #       deterministic phase's duration. This is the branch that catches the 2026-08-05 shape
        #       (homelab#103: zero log bytes, stuck in `git clone`, holding the mutex with twins
        #       Pending) and every wedge that dies before the script can push anything.
        #   (2) MARKER SAYS DETERMINISTIC — the scan came back from a dispatch and wedged in the
        #       deterministic pass afterwards. The clock restarts at the phase, never at the pod.
        # A pod whose marker says `in_deterministic 0` is streaming a ride: that is WORK, and it is
        # bounded by the workflow's `activeDeadlineSeconds: 1800`, not by this alert.
        # ⚠ NOT covered, same cause, different defect: a long-lived scan pod also suppresses the
        # `concurrencyPolicy: Forbid` cron tick, so the level-triggered backstop is disabled exactly
        # while a ride is in flight. Re-keying the alert does not touch that half — the pod really is
        # alive (§Part A″, still open).
        # Behaviour is pinned as an executed test, not as prose: `agents/scan-wedge-alert-test.sh`
        # (registered as a clause-replay fixture) extracts THIS expr and replays the 2026-08-06
        # healthy-ride shape against it plus both wedge shapes.
        - alert: AgentCoordinateScanWedged
          expr: |
            (
                (time() - kube_pod_start_time{pod=~"coordinate-.*"}) > 900
              and on(namespace,pod)
                kube_pod_status_phase{phase="Running"} == 1
              unless on(pod)
                agent_scan_phase_start_timestamp
            )
            or
            (
                (time() - agent_scan_phase_start_timestamp) > 900
              and on(pod)
                agent_scan_in_deterministic == 1
              and on(pod)
                kube_pod_status_phase{phase="Running"} == 1
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "coordinate scan {{ $labels.pod }} has been in its DETERMINISTIC phase >15m in {{ $labels.namespace }} (p99 of a whole scan is 5m)"
            description: "{{ $labels.pod }} has spent over 15 minutes in the deterministic pass — the cheap gh/kubectl half that should finish in seconds. SYMPTOM ONLY; this says nothing about any ride the pod may have dispatched (that phase is excluded by construction — FU-145). STEP 1, the pod's own log: near-zero bytes and stuck before/inside the `git clone` is the known wedge (homelab#103, 2026-08-05). STEP 2, `kubectl -n {{ $labels.namespace }} get wf` — a wedged scan holds the `coordinator-scan` mutex with twins Pending behind it, which is what makes ONE stuck pod stop the whole loop from dispatching. Containment: delete the workflow + its queued twins so the next cron tick takes the lock; the 1800s activeDeadlineSeconds is the belt behind that. `unit=-` with duplicate submissions → look upstream at the Sensor (AgentEventInfraSpinning, homelab#103). If the pod is instead streaming a dispatched session this alert is silent by design — read `agent_scan_in_deterministic{pod=\"{{ $labels.pod }}\"}` on the pushgateway to see which phase it reported last."
