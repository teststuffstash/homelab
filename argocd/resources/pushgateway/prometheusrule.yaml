# Agent-run data-quality + stall alerts (FU-057 polish, 2026-07-10). Prometheus picks up
# PrometheusRules cluster-wide; Alertmanager routes to the HA webhook (tofu/monitoring.tf).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-runs
  labels:
    app: pushgateway
spec:
  groups:
    - name: agent-runs
      rules:
        # A negative cost is a DATA-QUALITY bug, never a discount — the probe-fails-into-a-value
        # class (agent-runtime#12 fixed the known instance; this alert catches regressions and any
        # new path that subtracts against a failed read).
        - alert: AgentRunNegativeCost
          expr: agent_run_cost_usd < 0
          labels:
            severity: warning
          annotations:
            summary: "Agent run reported NEGATIVE cost ({{ $labels.project }} issue {{ $labels.issue }})"
            description: "agent_run_cost_usd={{ $value }} for pod-pushed run (model {{ $labels.model }}, round {{ $labels.round }}) — a probe failed into a value somewhere in the cost pipeline. See agent-runtime#12 for the class."
        # An infra-death burst: ≥3 non-clean terminal runs in an hour on one project means a wall,
        # not bad luck — the meta-2 pattern (three attempts, three walls) as an alert.
        # Pushgateway serves every pushed group FOREVER, so the rule must gate on push freshness:
        # the old count_over_time form counted SCRAPES of stale gauges (~120/h each), and one
        # 3-day-old auth-storm residue (sleep-tracking#20, the FU-021 acceptance test) kept it
        # firing for 2+ days (found 2026-07-12). A run-group is keyed (project, issue, role,
        # round) and holds one agent_run_total series, so "runs in the last hour" = groups whose
        # push_time_seconds is <1h old.
        - alert: AgentRunInfraDeathBurst
          expr: |
            count by (project) (
                agent_run_total{exit_status!~"clean|ci-failed"}
              and on (project, issue, role, round)
                (time() - push_time_seconds{job="agent_run"}) < 3600
            ) >= 3
          labels:
            severity: warning
          annotations:
            summary: "3+ non-clean agent runs in 1h on {{ $labels.project }}"
            description: "Repeated infra-class terminals (auth-storm/no-artifact/harness-death/…) — check the strike comments on the active issue before more budget burns."
        # FU-020 enforcement made loud: a worker egress miss under deny-all manifests as a HANG
        # (devbox install against a blocked FQDN — the nix-cache finding), which the run classifier
        # only names `timeout` much later. This alert names the CAUSE within minutes. `source` is
        # the namespace (hubble drop metric runs sourceContext=namespace, tofu/cilium.tf); scoped to
        # worker namespaces via the AgentStack-claim convention ns==repo — extend the regex when a
        # new stack's fixer repo onboards (or it enforces before its alert exists).
        - alert: AgentWorkerEgressDropped
          # homelab added 2026-08-05: its fixer block (FU-068) enforces egress, and the regex had
          # not followed — exactly the drift the line above warns about. circles stays OUT until
          # its `enforce: false` flips; in monitor mode Cilium never emits a DROPPED verdict.
          expr: sum by (source) (rate(hubble_drop_total{reason="POLICY_DENIED", source=~"oracle-fleet|sleep-tracking|openrouter-operator|homelab"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Worker egress DROPPED by netpol in {{ $labels.source }}"
            description: "Sustained POLICY_DENIED drops from namespace {{ $labels.source }}. SYMPTOM ONLY — observed causes so far: tool phone-home noise (jetify update+telemetry, 2026-07-21/22 — rides ran fine throughout) and genuine allowlist misses; a drop does not imply a hung ride. Identify the flows: `devbox run hubble -- --namespace {{ $labels.source }} --verdict DROPPED` (+ `--protocol dns` for the FQDN). Legit destination → the claim's egress.extraFQDNs; phone-home → kill at the tool (agent-session.sh env), never widen policy."
        # 2026-08-05: the coordinator Sensor hit a JetStream AckSync timeout, redelivered the same
        # event in a loop, then kept spinning at ~2-4 cores AFTER the loop went silent — a leaked
        # goroutine. It ate 65% of wk-01 for ~50 min and surfaced only as NodeSystemSaturation,
        # whose triage blamed "burst Job pods with no CPU requests" (they have requests; nothing
        # ran `top`). A wrong diagnosis on a node symptom is the second of its kind (homelab#94),
        # so the guard names the CULPRIT instead of the node. Separation is not a guess: the five
        # infra pods idle at 0-5m, the fault sat at 1887m — this threshold is 100x baseline and
        # 4x below the observed fault. Deleting the pod is the fix; the Deployment recreates it.
        # ⚠ Expect a ~5-10 min tail naming the DELETED pod after you fix one: the 5m rate window
        # still holds its samples. First recurrence (2026-08-05 12:48, homelab#103) showed it.
        # Deliberately NOT suppressed with a join on kube_pod_status_phase — a join that fails
        # would make this MISS a real spin, and a stale name for five minutes is the cheaper fault.
        - alert: AgentEventInfraSpinning
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="agent-coordinator", pod=~".*-(sensor|eventsource)-.*", container!=""}[5m])) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo Events infra pod {{ $labels.pod }} is burning CPU (idle baseline is ~5m)"
            description: "{{ $labels.pod }} in agent-coordinator has held >0.5 cores for 15m; these pods idle near zero, so this is a spin, not load. Read its log for `AckSync() on message: nats: timeout` and repeated `Triggering actions after receiving dependency` on ONE event id — that is a redelivery loop, and the CPU can outlive it. Check for spurious workflows it submitted (`kubectl -n agent-coordinator get wf --sort-by=.metadata.creationTimestamp`)."
