# Agent-run data-quality + stall alerts (FU-057 polish, 2026-07-10). Prometheus picks up
# PrometheusRules cluster-wide; Alertmanager routes to the HA webhook (tofu/monitoring.tf).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-runs
  labels:
    app: pushgateway
spec:
  groups:
    - name: agent-runs
      rules:
        # ADR-103 rule 3 needs a weekly KPI datum, and the only honest success signal is a retro
        # REPORT landing (the harvest step pushes this timestamp on PR-create; the cron's
        # trigger counter increments on guard-refused runs too — the 2026-08-10 Monday fired at
        # 05:00Z, was refused, and nothing said so until the operator read meta-state 13h later).
        # `or vector(0)` makes never-pushed read as epoch 0, so a retro that has never succeeded
        # fires rather than staying silent forever. severity=warning (info is inhibited
        # cluster-wide); first datum landed 2026-08-17 as expected.
        #
        # ── RESTART-GAP HARDENED (homelab#591, 2026-08-19) ──────────────────────────────────────
        # The lane it belongs to is renamed the PLATFORM retro (homelab#588) and its harvest now
        # pushes under job/platform-retro/series/${STACK} (was job/retro-session/stack/${STACK});
        # the metric NAME here is unchanged, so this expr keeps aggregating both old and new
        # grouping keys with `max(...)` and needs no migration step.
        # A bare `max(retro_report_last_success_timestamp)` reads the CURRENT scrape only — the
        # 2026-08-17 pushgateway emptyDir/PVC wipe erased the gauge's one-shot push (the store is
        # destroyed on a reschedule, AgentRunPhaseSlow's header documents the same dependency),
        # the series went ABSENT, `max(...)` returned nothing, `or vector(0)` fell back to epoch
        # 0, and `time() - 0` is always > 8 days on any real calendar date — so the alert false-
        # fired for 19h even though the last success was under a day old. `max_over_time(...[8d])`
        # reads Prometheus's OWN 8-day retention instead of the live scrape: a genuinely <8d-old
        # success SURVIVES a gateway wipe (the sample is still in the TSDB, just no longer being
        # re-served by the gateway), and only a success that is ACTUALLY >8d stale — pushed
        # nothing at all, or pushed something that has since aged out of the 8d window too — still
        # falls through to the `or vector(0)` branch. Behaviour pinned as an executed test:
        # retro-report.promtool-test (case (b) is the restart-gap shape, verified to RED on the
        # old bare-`max` expr before this hardening — see that file's header).
        - alert: RetroReportOverdue
          expr: (time() - (max(max_over_time(retro_report_last_success_timestamp[8d])) or vector(0))) > 8 * 86400
          for: 6h
          labels:
            severity: warning
            # homelab#239, and this alert is why the label exists. The responder's
            # self-referential gate inferred "loop machinery" from the namespace or an `Agent*`
            # name, and a pushgateway-derived alert has neither: this one sailed through on
            # 2026-08-11, took a `fix` verdict, and dispatched a worker at the retro belt — a
            # CronWorkflow whose re-fire is an argo mutation and whose manifests only a human
            # merges. It ended in an agent/error latch (homelab#237). The label caps the outcome
            # at "author a PR, never auto-merge"; it does NOT silence triage (that is `triage:
            # none`, which this alert must not have — the overdue state is worth diagnosing).
            platform_machinery: "true"
          annotations:
            summary: "No retro report has landed in >8 days — ADR-103 weekly KPI scoring is not producing data"
            description: "The Monday 05:00Z retro-session CronWorkflow (the platform series, stack=platform since homelab#588) has not landed a report PR in over 8 days (or has never landed one since the belt shipped 2026-08-10). This can mean the cron is firing and guard-refusing, OR that a genuinely recent success just cannot be SEEN — as of homelab#591 the expr bridges a pushgateway wipe via Prometheus's own 8d retention, so if this fires the last landed report really is stale. Check the newest retro-session workflow in ns agent-coordinator and re-fire via: argo -n agent-coordinator submit --from cronworkflow/retro-session. KPI spec: docs/agents/retros/BRIEF.md; belt design: FU-058."
        # A negative cost is a DATA-QUALITY bug, never a discount — the probe-fails-into-a-value
        # class (agent-runtime#12 fixed the known instance; this alert catches regressions and any
        # new path that subtracts against a failed read).
        - alert: AgentRunNegativeCost
          expr: agent_run_cost_usd < 0
          labels:
            severity: warning
          annotations:
            summary: "Agent run reported NEGATIVE cost ({{ $labels.project }} issue {{ $labels.issue }})"
            description: "agent_run_cost_usd={{ $value }} for pod-pushed run (model {{ $labels.model }}, round {{ $labels.round }}) — a probe failed into a value somewhere in the cost pipeline. See agent-runtime#12 for the class."
        # An infra-death burst: ≥3 non-clean terminal runs in an hour on one project means a wall,
        # not bad luck — the meta-2 pattern (three attempts, three walls) as an alert.
        # Pushgateway serves every pushed group FOREVER, so the rule must gate on push freshness:
        # the old count_over_time form counted SCRAPES of stale gauges (~120/h each), and one
        # 3-day-old auth-storm residue (sleep-tracking#20, the FU-021 acceptance test) kept it
        # firing for 2+ days (found 2026-07-12). A run-group is keyed (project, issue, role,
        # round) and holds one agent_run_total series, so "runs in the last hour" = groups whose
        # push_time_seconds is <1h old.
        # `issue!~"scout-.*"` excludes MODEL-SCOUT CANARY rides (homelab#235, 2026-08-10): the weekly
        # scout runs MAX_CANARIES=3 trivial probes per tick in CANARY_PROJECT (defaults to
        # `openrouter-operator`, agents/model-scout.sh:37) against brand-new, unproven models, and
        # `agents/model-scout.sh` already treats a canary failure as expected — "a canary failure never
        # fails the tick". Three of them failing in one 6-minute tick is ONE scout-infra datum, not a
        # fleet infra-death burst (docs/agents/model-routing.md §M7 rule 4, common-cause rule; FU-161),
        # yet it tripped this alert on a project where nothing was broken. `issue` is a PUSHGATEWAY
        # GROUPING-KEY label = `AGENT_TASK` with a leading `issue-` stripped, and canaries push
        # `--task "scout-<mangled-id>"` (model-scout.sh:55), which never starts with `issue-` — so the
        # `scout-` prefix is a sound discriminator, and PromQL's full anchoring makes the matcher mean
        # exactly "does not START with scout-". It also fails OPEN: a series with no `issue` label at
        # all is retained (empty ≠ `scout-.*`), so a push-path change cannot silently mute this alert.
        # ⚠ Nothing else now watches canary deaths — re-typing those verdicts is FU-161 legs 3–4.
        # `blocked-deliberate` joins the exclusion (homelab#314, found by the #288 fixtures with 4
        # such series live in the gateway): it is a HUMAN GATE APPLIED ON PURPOSE — the worker read
        # the issue, judged it unworkable, emitted its structured stop report and exited 0
        # (agent-finalize `classify()`: "That is a DECISION, not a death"). Three of them on one
        # project in an hour raised an infra-death page with no infra death.
        # It is the ONLY deliberate terminal, and that is checked, not assumed: the emitter's closed
        # set is clean | ci-failed | no-artifact | harness-death | auth-storm | budget-403 | timeout
        # | blocked-deliberate | failed, of which DEATH_EXIT_STATUSES = harness-death, auth-storm,
        # budget-403, timeout. `no-artifact` (green in-pod, no PR — dead token / unpushed branch)
        # and `failed` (nonzero exit / no output) are neither deliberate nor healthy, so they STAY
        # counted; the description names `no-artifact` for exactly that reason.
        # DENYLIST, not an allowlist, deliberately — same doctrine as `issue!~"scout-.*"` above: a
        # new terminal the emitter grows is counted by default, so a push-path change cannot
        # silently mute this alert. `exit_status=~"harness-death|auth-storm|budget-403|timeout"`
        # would be tighter and fails CLOSED — a new infra terminal would go unwatched until someone
        # remembered this file. Widening the exclusion by one named value keeps the fail-open.
        - alert: AgentRunInfraDeathBurst
          expr: |
            count by (project) (
                agent_run_total{exit_status!~"clean|ci-failed|blocked-deliberate", issue!~"scout-.*"}
              and on (project, issue, role, round)
                (time() - push_time_seconds{job="agent_run"}) < 3600
            ) >= 3
          labels:
            severity: warning
          annotations:
            summary: "3+ non-clean agent runs in 1h on {{ $labels.project }}"
            description: "Repeated infra-class terminals (auth-storm/no-artifact/harness-death/…) — check the strike comments on the active issue before more budget burns. Deliberate stops (exit_status=blocked-deliberate) and model-scout canary rides (issue=scout-*) are excluded by design and cannot raise this."
        # FU-160 (homelab#287; spike: docs/spikes/ride-latency-breakdown.md): ride phase timings
        # stopped being archaeology. `agents/agent-session.sh` pushes
        # `agent_run_phase_seconds{phase=dispatch-gates|pod-spinup}` per ride, and this is the belt
        # over them: a degraded image cache adding minutes to every dispatch otherwise presents
        # only as "the loop feels slow", which is exactly what happened to the 2026-08-09 specimen
        # — by the time anyone asked whether its image was node-cached, the pod events had aged out
        # and the question was unanswerable.
        #
        # TWO EMITTERS, ONE METRIC, and the expr reads both. `agent-finalize` (agent-runtime#66)
        # pushes `phase=clone|devbox-install|llm-loop|finalize` into a sibling group under the same
        # job with `source="in-pod"`; `quantile by (phase)` therefore covers six phases, not two,
        # and the `and on (project, issue, round, role)` join keeps matching because the extra
        # label sits outside it. That is intended: the in-pod rows are the ones present on EVERY
        # ride, so they are the better half of this alert's input, not an accident in it.
        # ⚠ `ride` and `bookkeeping` were REMOVED from the launcher on 2026-08-12 (homelab#324) —
        # the launcher is normally killed mid-follow and closed them on 5 of 24 measured rides, so
        # their p50 here was a median over the rides that happened to let their launcher live. Old
        # `ride`/`bookkeeping` groups linger in the gateway until it reschedules; with nothing fresh
        # to compare, the left-hand side of the split is empty for them and they simply never fire.
        #
        # THE BASELINE IS THE GATEWAY'S OWN HISTORY, not a number someone guessed. There is no
        # measured baseline to hard-code: this alert ships in the same PR as the emitter, so every
        # threshold would be a fiction on merge day. Instead the expr splits the SAME metric on
        # push freshness — the last hour of rides against everything older still held in the
        # gateway — and fires when the recent median doubles. Rewrite it as a fixed seconds
        # threshold only once real data says what the phases cost.
        #
        # Three guards, each answering a way this shape goes wrong:
        #   (1) THE FRESHNESS SPLIT, not a range selector. Pushgateway groups are served FOREVER
        #       and re-scraped every 30s, so `quantile_over_time(...[1h])` would weight a ride by
        #       how long its value sat there — the residue class that kept AgentRunInfraDeathBurst
        #       ringing for two days (FU-021). An INSTANT quantile counts each group exactly once,
        #       which is per-ride, which is what "p50 over 1h" has to mean.
        #   (2) `>= 3` FRESH RIDES. With one ride in the window the p50 IS that ride, and a single
        #       cold-node dispatch would fire this every time. Three is the same "a wall, not bad
        #       luck" line AgentRunInfraDeathBurst draws.
        #   (3) A 60s FLOOR on the recent median. `dispatch-gates`, `clone` and `finalize` are
        #       seconds long, so a 3s→7s wobble is a 2.3× ratio and means nothing. The floor keeps
        #       this alert about phases that got slow in a way a human would notice.
        # THE DISPATCH ROWS ABOVE THE LAUNCHER ARE NOT IN HERE, and that is a decision rather than
        # an omission (FU-160 coordinator half, homelab#319). They are a SEPARATE metric family,
        # `agent_dispatch_phase_seconds{phase=ring-to-scan|scan|coordinator-spinup|coordinator-
        # session}` pushed by agents/coordinator-scan.sh and agents/coordinator-session.sh, and
        # every guard below would misfire on them: their group is keyed (project, role) with one
        # group per STACK, overwritten at the next dispatch — so there is no older half to be a
        # baseline and no ≥3 fresh RIDES to count, and three of the four rows are seconds long,
        # i.e. under the 60s floor by design. Extending this expr to cover them would produce an
        # alert that is silent for a structural reason while LOOKING like coverage, which is worse
        # than the honest gap. What they get instead is the `Dispatch phase breakdown` panel on the
        # `agent-issue` dashboard; alerting them needs a per-dispatch history this deliberately
        # does not keep (the pushgateway serves every group forever — a per-dispatch key leaks one
        # group per ride).
        # ⚠ FAILS SILENT BY CONSTRUCTION, and that is the accepted trade: no older half (a fresh
        # pushgateway — the store is an emptyDir + persistence file, so a reschedule empties it)
        # means an empty right-hand vector and no alert until history rebuilds. An observability
        # belt that invents a baseline is worse than one that waits for it. `platform_machinery`
        # for the homelab#239 reason: the subject IS the launcher, so a responder may author a PR
        # here and must never auto-merge one.
        #
        # ⚠ DELIBERATELY NOT RESTART-GAP BRIDGED (homelab#336). This alert was listed as a
        # single-replica candidate for the #288 bridge, and the honest answer is that the bridge
        # does not fit the hole — twice over:
        #   (1) THE DEPENDENCY IS THE PUSHGATEWAY, and its failure is DESTRUCTION, not a gap. A
        #       group pushed into the gateway is served forever, so nothing here goes stale on a
        #       ride's own timescale; what removes the data is a gateway RESCHEDULE, which empties
        #       the emptyDir-backed persistence file outright. `max_over_time(…[10m])` over an
        #       emptied gateway is still empty — the range would bridge ten minutes of a loss that
        #       lasts until an hour of new rides has rebuilt both halves of the split.
        #   (2) THE HOLE FAILS IN THE SAFE DIRECTION ALREADY, and it is documented above as such:
        #       no older half means an empty right-hand vector and NO alert. This one goes quiet,
        #       not red — so the `for: 30m` window it restarts was never protecting a firing alert,
        #       and there is no false resolve to repair. Compare AgentCoordinateScanWedged below,
        #       which #333 DID bridge: its conjuncts read kube-state-metrics, a mirror that
        #       republishes the same facts after a restart, so the condition genuinely outlived the
        #       hole. Nothing here does.
        # The emptyDir is a real defect and it is NOT this class's: it is a DURABILITY bug in
        # argocd/resources/pushgateway/deployment.yaml that silently resets this alert's baseline
        # (and destroys RegistryMirrorDanglingLinks' datum, see that file). #336 names it as its
        # own finding in the PR body instead of absorbing it into a range selector, which is what
        # that issue's acceptance asks for.
        #
        # ── SUBJECT-COLLISION DECISION (homelab#724) ───────────────────────────────────────────
        # This alert is a FLEET-LEVEL signal, not a per-project one. The PromQL groups by (phase),
        # not by (project), and the `count by (phase) >= 3` guard would split meaningfully under
        # per-project regrouping — a project with few rides would never meet the threshold, so the
        # alert would be silent for a structural reason while LOOKING like coverage, which the
        # header above already rejects as worse than the honest gap. The one live firing (#500) was
        # fleet-wide by cause (nix-cache at its eviction ceiling, hitting every agent pod's
        # devbox-install), not one project. The responder therefore uses the catch-all
        # `alert:AgentRunPhaseSlow` subject, and two projects tripping this alert in one window
        # subject-dedupe into one triage — that is accepted because the signal IS fleet-level.
        - alert: AgentRunPhaseSlow
          expr: |
            (
              (
                quantile by (phase) (0.5,
                    agent_run_phase_seconds
                  and on (project, issue, round, role)
                    (time() - push_time_seconds{job="agent_run_phase"}) < 3600
                ) > 60
              )
              >
              2 * quantile by (phase) (0.5,
                  agent_run_phase_seconds
                and on (project, issue, round, role)
                  (time() - push_time_seconds{job="agent_run_phase"}) >= 3600
              )
            )
            and on (phase)
            (
              count by (phase) (
                  agent_run_phase_seconds
                and on (project, issue, round, role)
                  (time() - push_time_seconds{job="agent_run_phase"}) < 3600
              ) >= 3
            )
          for: 30m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Ride phase {{ $labels.phase }} p50 is {{ $value }}s — over 2× its own baseline"
            description: "SYMPTOM ONLY, and deliberately so — this says a ride phase got slower, never why. `pod-spinup` = schedule + image pull + container start, and the first thing to check is whether the node had the image (a `:latest` tag defeats the node cache — agents/README.md pinned-versions warning, seen live 2026-08-09); `dispatch-gates` = the launcher's deterministic pre-flight, so a slow gh/kubectl API or a pre-flight that started making more calls. Those two are ALL the launcher emits (homelab#324) — everything after pod-Ready carries `source=\"in-pod\"` and is agent-finalize's: `clone`, `devbox-install` (the nix-cache mirror is the first suspect), `llm-loop` (the model, not the platform — a slow provider raises this and no infra change will lower it) and `finalize`. Compare against the fleet: `sum by (phase) (agent_run_phase_seconds)` and the `Ride phase breakdown` panel on the `agent-issue` dashboard. Baseline is this metric's own pre-1h history in the pushgateway, so a gateway reschedule (emptyDir) resets it and this alert goes quiet, not red. Subject-collision note (homelab#724): this is a fleet-level signal — the responder uses the catch-all `alert:AgentRunPhaseSlow` subject, and two projects tripping it in one window subject-dedupe into one triage (accepted: the one live firing was fleet-wide)."
        # 017790c doctrine (ADR-106 (5), the A2 famine chunk): ALL events have doorbells — the
        # cron is a FAILURE DETECTOR, so a dispatch the cron serviced is a dead doorbell edge
        # with an id, not background noise. The scan stamps epoch-valued wake gauges per dispatch
        # (agents/coordinator-scan.sh `dp_wake`: two metric NAMES, not a source label — a
        # pushgateway POST replaces per name, and one name per source keeps an edge dispatch from
        # deleting the record of the last cron one). `changes()` over an epoch gauge counts
        # dispatches, so "% edge-woken" is `changes(edge[7d]) / (changes(edge[7d]) +
        # changes(cron[7d]))` on the dashboard, and THIS alert is the regression tooth: fires on
        # a SECOND cron-woken dispatch inside 24h PER STACK (`sum by (project)` — the pushgateway
        # group key; the tolerance is per stack, so two unrelated stacks each hitting the single
        # tolerated race in one window must NOT sum to a false page — bot review, PR#393): the
        # charter's acceptance is "≈ 0, alerted on regression" — one event in isolation is the
        # tolerated mid-scan race, recurrence means some transition's emitter is dead or
        # mis-routed. (A brand-new series appearing counts 0
        # in changes(), so the very first cron-woken dispatch after this ships is invisible here
        # — the accepted cost of an epoch-gauge design; the second one fires.)
        # FU-176: the sentinel's health belt, keyed on its per-tick heartbeat (pushed on EVERY
        # tick since the fix, zero-PR ticks included — before it, an empty push REPLACED the
        # job/iac-sentinel group and a healthy quiet tick read as "sentinel blind"). The check
        # is enforcement-critical since the G01 flip (it gates -iac merges), so its silence must
        # page: the sentinel cron ticks every few minutes, 30m of no heartbeat is a dead lane.
        # `absent()` covers the never-pushed / group-deleted case; `for: 15m` rides out a deploy.
        # platform_machinery for the homelab#239 reason (pushgateway metric — no meaningful
        # namespace, name not Agent*, so neither responder belt catches it unstamped).
        - alert: IacSentinelSilent
          expr: absent(iac_sentinel_last_run_timestamp_seconds) or (time() - max(iac_sentinel_last_run_timestamp_seconds) > 1800)
          for: 15m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "iac-sentinel heartbeat silent >30m — the required -iac merge gate is not evaluating"
            description: "SYMPTOM ONLY — no iac_sentinel_last_run_timestamp_seconds push for >30m (the sentinel CronWorkflow ticks every few minutes; scripts/iac-sentinel.sh pushes the heartbeat on every tick, zero-PR ticks included, FU-176). While silent, open -iac PRs wait on a required `iac-sentinel` commit status nobody posts — merges stall rather than bypass (fail-closed). Look at the `iac-sentinel` CronWorkflow runs in ns agent-coordinator (argo.teststuff.net or `kubectl -n agent-coordinator get workflows`), then the newest run's logs; a wedged/suspended cron, an image pull failure, or a pushgateway outage are the observed-plausible causes to check in that order."
        # platform_machinery for the homelab#239 reason.
        - alert: AgentDispatchCronWoken
          expr: sum by (project) (changes(agent_dispatch_cron_woken_timestamp[24h])) >= 2
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "{{ $value }} cron-woken coordinator dispatches on stack {{ $labels.project }} in 24h — a doorbell edge is dead"
            description: "SYMPTOM ONLY — real work reached dispatch via the level-triggered cron sweep instead of an edge, at least twice in 24h. Some transition that should ring /coordinate is not ringing (dead emitter, mis-routed payload, latched-then-forgotten ring, or a collapse/fan-out defect — agents/coordinator-scan.sh §doorbell-collapse/§doorbell-fanout). WHICH stack: `agent_dispatch_cron_woken_timestamp` carries the pushgateway group's project label — `changes(agent_dispatch_cron_woken_timestamp[24h]) > 0` names it. Then reconstruct what the dispatch was from that stack's coordinate workflow logs (Loki, ns <stack>-agents) and walk the emitter inventory in docs/agents/workflow.md §Triggers for the transition that produced it. The tolerated single race: a ring landing mid-scan after the re-list point is absorbed nowhere and falls to the cron once — one event in isolation is that race, recurrence is a defect (017790c)."
        # (devbox install against a blocked FQDN — the nix-cache finding), which the run classifier
        # only names `timeout` much later. This alert names the CAUSE within minutes. `source` is
        # the namespace (hubble drop metric runs sourceContext=namespace, tofu/cilium.tf); scoped to
        # worker namespaces via the AgentStack-claim convention ns==repo — extend the regex when a
        # new stack's fixer repo onboards (or it enforces before its alert exists).
        - alert: AgentWorkerEgressDropped
          # homelab added 2026-08-05: its fixer block (FU-068) enforces egress, and the regex had
          # not followed — exactly the drift the line above warns about. circles stays OUT until
          # its `enforce: false` flips; in monitor mode Cilium never emits a DROPPED verdict.
          # WIDENED 2026-09-01 (homelab#1056): loop namespaces (<stack>-agents) and agent-coordinator
          # now carry monitor-mode CNPs — the regex must cover them before any enforce flip.
          expr: sum by (source) (rate(hubble_drop_total{reason="POLICY_DENIED", source=~"oracle-fleet|sleep-tracking|openrouter-operator|homelab|agent-runtime|agent-coordinator|.*-agents"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Worker egress DROPPED by netpol in {{ $labels.source }}"
            # The first instruction must be a read that works from an IN-CLUSTER responder pod: the
            # agent-coordinator image carries no `hubble`/`cilium` binary and agent-read-infra has no
            # pods/portforward, so the old `devbox run hubble` first step sent the responder into a
            # wall (homelab#125, #137). Prometheus is also usually the whole answer — `destination`
            # already IS the FQDN (drop:destinationContext=dns|ip, tofu/cilium.tf). Full runbook:
            # docs/agents/roles.md §responder; keep the two in sync.
            description: >-
              Sustained POLICY_DENIED drops from namespace {{ $labels.source }}. SYMPTOM ONLY — observed causes so far:
              tool phone-home noise (jetify update+telemetry, 2026-07-21/22 — rides ran fine throughout) and genuine
              allowlist misses; a drop does not imply a hung ride.
              STEP 1, name the destination (works from anywhere, and usually the whole answer): `curl -sG
              http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query --data-urlencode
              'query=topk(10, sum by (source,destination,protocol) (increase(hubble_drop_total{reason="POLICY_DENIED",source="{{ $labels.source }}"}[6h])) > 0)'`
              — in-cluster service DNS, NOT the 192.168.40.13 LAN VIP. `destination` already resolves to the FQDN
              whenever the DNS proxy knew the name (drop:destinationContext=dns|ip, tofu/cilium.tf); widen [6h] to
              [24h]/[7d] before concluding nothing is there, and a bare-IP destination is a finding, not a dead end.
              STEP 2, per-flow detail only (port, timing, exact pod): in-cluster
              `kubectl exec -n kube-system ds/cilium -- hubble observe --namespace {{ $labels.source }} --verdict DROPPED`
              (⚠ ONE node's ring buffer — an absence is not evidence); from a JAIL SESSION ONLY, `devbox run hubble --
              --namespace {{ $labels.source }} --verdict DROPPED` (+ `--protocol dns`). Full runbook:
              docs/agents/roles.md §responder.
              Legit destination → the claim's egress.extraFQDNs; phone-home → kill at the tool (agent-session.sh env),
              never widen policy.
        # 2026-08-05: the coordinator Sensor hit a JetStream AckSync timeout, redelivered the same
        # event in a loop, then kept spinning at ~2-4 cores AFTER the loop went silent — a leaked
        # goroutine. It ate 65% of wk-01 for ~50 min and surfaced only as NodeSystemSaturation,
        # whose triage blamed "burst Job pods with no CPU requests" (they have requests; nothing
        # ran `top`). A wrong diagnosis on a node symptom is the second of its kind (homelab#94),
        # so the guard names the CULPRIT instead of the node. Separation is not a guess: the five
        # infra pods idle at 0-5m, the fault sat at 1887m — this threshold is 100x baseline and
        # 4x below the observed fault. Deleting the pod is the fix; the Deployment recreates it.
        # ⚠ Expect a ~5-10 min tail naming the DELETED pod after you fix one: the 5m rate window
        # still holds its samples. First recurrence (2026-08-05 12:48, homelab#103) showed it.
        # Deliberately NOT suppressed with a join on kube_pod_status_phase — a join that fails
        # would make this MISS a real spin, and a stale name for five minutes is the cheaper fault.
        - alert: AgentEventInfraSpinning
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="agent-coordinator", pod=~".*-(sensor|eventsource)-.*", container!=""}[5m])) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo Events infra pod {{ $labels.pod }} is burning CPU (idle baseline is ~5m)"
            description: "{{ $labels.pod }} in agent-coordinator has held >0.5 cores for 15m; these pods idle near zero, so this is a spin, not load. THE LOG MAY BE COMPLETELY EMPTY — the 2026-08-05 12:48 recurrence logged nothing at all while burning 1692m, so an empty log is NOT evidence the pod is fine. If it does log, look for `AckSync() on message: nats: timeout` with one event id retriggering (a redelivery loop, whose CPU outlives it). Fix: delete the pod, the Deployment recreates it; then check for spurious workflows it submitted (`kubectl -n agent-coordinator get wf --sort-by=.metadata.creationTimestamp`). It RECURS — homelab#103, a restart is palliative."

        # AgentAttentionStanding (homelab#892 — leg 5 belt): `who="operator"` rows standing > 4h.
        # The board's machine mode classifies items into `who=operator` rows (parked, held-by-ghost,
        # phantom, merged-unlinked) that the operator's seat attends to. An active seat drains the
        # board long before 4h passes; this alert exists only for the no-seat case. The annotation
        # links to the BIG PICTURE (the Grafana attention table, or `board.teststuff.net` once leg 6
        # lands) — never an individual issue. Description is a symptom, not a guessed cause.
        # ⚠ Deploy silences `for:` — if the pushgateway is redeployed during a standing alert, the
        # `for:` window restarts. That is accepted: a gateway redeploy is rare, and the alert is
        # slow by design (4h standing) so a reset window is at most a few hours of missed page.
        - alert: AgentAttentionStanding
          expr: |
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="parked-blocked",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="parked-infeasible",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="strike-held",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="footprint-held",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="cap-held",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="blockpark",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="queued-held-by-ghost",who="operator"}[5m]))) > 4 * 3600
            or
            (time() - max by (repo, item) (max_over_time(agent_item_class_since_timestamp_seconds{class="phantom",who="operator"}[5m]))) > 4 * 3600
          for: 1h
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "Operator-attention items (who=operator) have been standing >4h on {{ $labels.repo }}"
            description: "SYMPTOM ONLY — the board's who=operator class contains items that need the operator's attention (strike-held, footprint-held, cap-held, blockpark, queued-held-by-ghost, phantom). An active seat drains the board long before 4h; this alert exists for the no-seat case. Check the BIG PICTURE at the Grafana attention table (board.teststuff.net once leg 6 lands). Deploy silences the `for:` window — a pushgateway redeploy during an active standing resets the timer, accepted because the design is slow enough that a reset window is tolerable."
        # The SECOND half of homelab#103, and the worse half: a wedged coordinate workflow holds
        # the `coordinator-scan` mutex, and every later tick queues behind it Pending. The loop
        # stops dispatching and NOTHING says so — `get wf` shows activity, and the Pending reason
        # ("Waiting for .../Mutex/coordinator-scan") reads as normal serialization. On 2026-08-05
        # a spin artifact wedged mid-`git clone` (zero log bytes in 75s) and held the lock ~24 min
        # across three queued twins plus the 13:00 cron tick; it surfaced only because a watch was
        # explicitly looking for a missing tick.
        # ⚠ THE DEADLINE IS NOT THE LEVER, and the obvious tightening is a trap. `activeDeadlineSeconds`
        # is already 1800 on both coordinate paths, and it cannot go much lower: over 7d/2474 runs the
        # duration distribution is p50 29s, p95 45s, p99 302s — but the tail reaches 1458s, so a "matched
        # to the natural bound" 600s would kill ~9 legitimate scans a week. The wedge hides IN that tail,
        # which is exactly why no timeout distinguishes stuck from busy. So: alert at 900s (measured —
        # 1 legitimate run in 2474 exceeds it) and let the 1800s deadline stay the containment behind it.
        # Verified against the incident's own history (fires on coordinate-perstack-lvsmt, 12:48-13:12)
        # and against the preceding 7 days (fires on NOTHING else — zero false positives).
        #
        # ── RE-KEYED ON THE SCAN PHASE (FU-145, homelab#283) ────────────────────────────────────
        # The 900s threshold above is measured and stays; the SUBJECT is what was wrong. Pod lifetime
        # is not scan duration: the moment the scan dispatches, `coordinator-session.sh` streams the
        # item session synchronously (verified live inside `coordinator-081840`: PID 512 =
        # `kubectl logs -f agent-circles-issue-30-r1`), so any healthy ride >15m fired this alert, on
        # every stack — twice in one hour on 2026-08-06, two false issues minted (#120, #134).
        # `agents/coordinator-scan.sh` now pushes the phase it is in (`scan_phase`, pushgateway job
        # `agent_scan_phase`, grouped by namespace with the pod as a metric label), and the two
        # branches below are the same question asked of a phase instead of a pod:
        #   (1) NO MARKER — the scan has not reached its first dispatch, so pod lifetime IS the
        #       deterministic phase's duration. This is the branch that catches the 2026-08-05 shape
        #       (homelab#103: zero log bytes, stuck in `git clone`, holding the mutex with twins
        #       Pending) and every wedge that dies before the script can push anything.
        #   (2) MARKER SAYS DETERMINISTIC — the scan came back from a dispatch and wedged in the
        #       deterministic pass afterwards. The clock restarts at the phase, never at the pod.
        # A pod whose marker says `in_deterministic 0` is streaming a ride: that is WORK, and it is
        # bounded by the workflow's `activeDeadlineSeconds: 1800`, not by this alert.
        # ⚠ NOT covered, same cause, different defect: a long-lived scan pod also suppresses the
        # `concurrencyPolicy: Forbid` cron tick, so the level-triggered backstop is disabled exactly
        # while a ride is in flight. Re-keying the alert does not touch that half — the pod really is
        # alive (§Part A″, still open).
        # Behaviour is pinned as an executed test, not as prose: `agents/scan-wedge-alert-test.sh`
        # (registered as a clause-replay fixture) extracts THIS expr and replays the 2026-08-06
        # healthy-ride shape against it plus both wedge shapes.
        #
        # ── KSM RESTART-GAP BRIDGED, AT [5m] AND DELIBERATELY NOT [10m] (homelab#333) ───────────
        # Every conjunct below that is not a pushgateway marker comes from ONE workload:
        # kube-state-metrics, `replicas: 1` (the kube-prometheus-stack default — values/ overrides
        # only resources), live a SINGLE scrape target. That makes it a dependency SHARED with
        # RegistryGCMirrorsStale/Suspended, and #333 decided it once for all three rather than
        # three times: the verdict and the "KSM is a MIRROR, not a source" reasoning live in
        # argocd/resources/registry-cache/prometheusrule.yaml's header. It applies unchanged here —
        # a fresh KSM re-lists the API and republishes the same pod start time and phase, so the
        # wedge outlives the hole and only the measurement of it went away.
        # Two halves, and #288 proved either alone still resets `for:` at one replica:
        #   (1) IDENTITY CHURN → `max by (...)`. KSM's ServiceMonitor sets honor_labels (verified
        #       live: no `exported_pod` anywhere), so on `kube_pod_*` the SUBJECT pod keeps
        #       `namespace`/`pod`/`uid` — but `instance` (KSM's own pod IP), `job`, `service`,
        #       `endpoint` and `container` are KSM's and they ride onto this alert. A KSM
        #       reschedule changes `instance`, which makes a FIRING alert a different alert
        #       instance: a spurious resolve and a re-fire 2m later on a wedge that never stopped.
        #       `by (namespace,pod,uid)` keeps exactly the subject's identity — what the
        #       annotations read — and drops exactly KSM's. Arm 2 joins `on(pod)`, so `by (pod)`
        #       there is the join key itself.
        #   (2) A REAL HOLE → `max_over_time(...[5m])`. At one replica a KSM reschedule empties
        #       every kube_* series and the staleness markers make that instant.
        # ⚠ [5m], NOT the [10m] of #288/#313/#332, and the difference is this alert's `for: 2m`.
        # The range is ALSO how long the alert keeps ringing after the pod it names is gone — and
        # the containment for THIS alert is "delete the workflow", so the bridge is paid on every
        # true firing while the hole it covers is rare. Measured against KSM's real behaviour
        # (2026-08-12, the 8 days Prometheus retains): 11519 of 11521 scrape minutes present, worst
        # hole 120s, twice, one pod generation, 0 restarts, pod 15d old. #288 measured this class
        # on this cluster at 69-116s across 10 pod generations. [5m] is ~2.5-4x that. [10m] would
        # be five times the alert's entire window and would outlive the fix by five times its own
        # patience; a 120s hole, meanwhile, already resets a 2m window unaided, which is what made
        # the identity half insufficient on its own here.
        # CEILING, accepted and asserted rather than assumed: a KSM hole longer than 5m
        # (crash-loop, cold image pull, node drain) still resets the 2m window.
        # ⚠ DOES NOT TOUCH THE FU-145 RE-KEY (#283). Both branches still ask their question of the
        # SCAN PHASE: arm 2's clock is still `agent_scan_phase_start_timestamp` and its gate is
        # still `agent_scan_in_deterministic`, neither of which is a KSM series and neither of
        # which is bridged. Only the KSM liveness conjunct changed, in both arms.
        # The pushgateway's own restart gap is a DIFFERENT dependency and out of #333's scope —
        # carried in the PR body as a finding, which became #353 and is decided directly below.
        #
        # ── THE PUSHGATEWAY HALF, DECIDED PER ARM (homelab#353) ─────────────────────────────────
        # The markers are this alert's SECOND single-replica dependency (`replicas: 1`, store on an
        # emptyDir behind `--persistence.interval=5m` — deployment.yaml), and #332's test gives them
        # a different answer than it gave KSM, which is why #347 refused to fold them in.
        # WHY THE KSM VERDICT DOES NOT TRANSFER: KSM is a MIRROR, so a fresh replica republishes the
        # same facts and a range selector bridges a hole that ENDS. The gateway is a STORE and the
        # scan pushes once per phase TRANSITION, so what the gateway loses nothing republishes. The
        # failure therefore splits in two and only one half is bridgeable:
        #   (a) SCRAPE GAP or CONTAINER RESTART — the data RETURNS, identical (the persistence file
        #       survives a container restart, losing at most one 5m interval of pushes). #332's case
        #       in its pure form; `max_over_time(...[5m])` is straightforwardly right. Measured
        #       2026-08-12 over the 8d Prometheus retains: 11461 of 11461 scrape-minutes present,
        #       ZERO gaps >60s, 0 restarts, one pod generation, process up 15.5d — quieter than KSM
        #       itself (2x120s in the same window, #347). [5m] here is headroom, not a fit.
        #   (b) POD RESCHEDULE — the emptyDir goes with the pod and every group is DESTROYED. No
        #       range fixes that: [5m] postpones the consequence by five minutes and the data is
        #       still gone, until a phase transition repushes it — which for a pod streaming a ride
        #       can be the rest of its life. A range sized to "cover" (b) would be a fiction.
        # [5m] and not [10m] for #347's reason unchanged: `for:` is 2m, and the range is also how
        # long this alert rings after the pod it names is gone, while deleting the workflow is this
        # alert's own containment.
        #
        # ARM 1 — THE EXCLUSION, WHICH FAILS **OPEN** (a false page). `unless on(pod) <marker>` is a
        # GUARD, so losing the marker does not silence this alert, it removes the thing that keeps a
        # healthy >15m ride from raising it — the exact pre-FU-145 behaviour #283 exists to kill
        # (2026-08-06: two false issues, #120 and #134, in one hour). One mechanism per class:
        #   (a) `max_over_time(agent_scan_phase_start_timestamp[5m])` — the exclusion outlives a gap.
        #       ⚠ The wrinkle, stated: a marker that legitimately went away keeps suppressing arm 1
        #       for up to 5m (a new scan's push REPLACES the namespace group — two generations of
        #       platform-agents markers were visible in one 5m window, live 2026-08-12). That can
        #       only DELAY a firing, and only for a pod that had already pushed a marker.
        #   (b) `kube_pod_start_time >= <the gateway's own process start>` — for the destructive
        #       class, because what (b) needs is not a longer range but a way to KNOW the store was
        #       emptied. Absence of a marker is only EVIDENCE if the store has been up since before
        #       the pod could have pushed into it; if the gateway's current process started after
        #       the pod did, "no marker" means nothing and arm 1 must not read it as a wedge.
        #       `process_start_time_seconds` moves on a container restart too, which is right — a
        #       restart can lose one persistence interval of pushes.
        #       ⚠ POSITIVE EVIDENCE ONLY: `or vector(0)` makes an ABSENT gateway self-metric read as
        #       "no roll observed" — i.e. exactly today's behaviour — never as suppression. A guard
        #       that silenced this alert whenever its own input went missing would trade a rare
        #       false page for an unbounded silent one, and nothing watches the guard.
        #       ACCEPTED RESIDUAL — DECIDED 2026-08-18 (homelab#371, operator seat ruling), not left
        #       implicit: a gateway that is entirely GONE for longer than the 5m bridge leaves arm 1
        #       unguarded again. Accepted because the same outage fires a TargetDown-class alert, so
        #       this is a redundant false page during a total gateway outage — never a silent miss
        #       and never a new operator wake. Closing it with
        #       `absent(up{job="prometheus-pushgateway"})` was weighed and rejected: the term is true
        #       in every fixture with no pushgateway series, redding agents/scan-wedge-alert-test.sh
        #       (this alert's behaviour home, in #371's Touches), for a window that has never
        #       occurred inside retention — 11461/11461 scrape-minutes present, zero gaps >60s, one
        #       pod generation (measured 2026-08-12). The `or vector(0)` positive-evidence default
        #       therefore STANDS, unchanged.
        #   The guard is arm 1's ALONE: arm 2 reads the markers positively, so a lost store silences
        #   it rather than mis-firing it, and there is nothing for a guard to add.
        # ARM 2 — THE CLOCK AND THE GATE, WHICH FAIL **CLOSED** (a missed page). Both are required
        # conjuncts, so a hole means arm 2 cannot fire at all and a genuinely wedged deterministic
        # scan goes unalerted. Bridged at [5m] for class (a) — the wedge outlives the gap and the
        # marker comes back unchanged. For class (b) the bridge buys five minutes and no more, and
        # this alert then goes SILENT for that pod: arm 2 has no data and arm 1 is suppressed by its
        # own guard. That is the accepted cost, and it is ASSERTED rather than assumed
        # (scan-wedge-pgw-witness.promtool-test row 4). It is bounded by the scan pod's own life
        # (`activeDeadlineSeconds: 1800`) and every pod started after the new gateway generation is
        # covered again. The alternative was refusing the guard — but then the SAME gateway roll
        # pages on a healthy ride (witness row 1) and on this wedge (row 4) with identical
        # gateway-side inputs, so that page cannot be told from the false one. Silence that ends
        # with the pod beats a page that means nothing.
        #   `last_over_time` on the GATE and `max_over_time` on the clock, deliberately: the clock is
        #   a monotone epoch, so max IS the newest transition, while the gate is a STATE and
        #   `max_over_time(...) == 1` would read "was deterministic at some point in the last 5m" —
        #   a fail-open reading of the one conjunct that keeps a streaming ride out. Today the clock
        #   conjunct masks the difference (both are pushed together, so a dispatch moves the
        #   timestamp too and the >900s test fails first), so no fixture row can separate them: the
        #   choice is made on meaning, not on a red row.
        # NO `max by (...)` on the marker reads, and that is not an oversight — unlike KSM's series
        # they carry NO `instance` (verified live 2026-08-12: the gateway serves pushed groups with
        # an empty instance and honorLabels keeps it), so there is no #288 identity churn to
        # aggregate away, and aggregating would drop `job` from the alert's published labels.
        # The emptyDir itself is a DURABILITY defect rather than an expr defect; its home is
        # AgentRunPhaseSlow's block above (#336), which names it instead of absorbing it into a
        # range selector. #353 does the same and carries it to the PR body.
        - alert: AgentCoordinateScanWedged
          expr: |
            (
                (time() - max by (namespace,pod,uid) (max_over_time(kube_pod_start_time{pod=~"(coordinate|switchboard)-.*"}[5m]))) > 900
              and on(namespace,pod)
                max by (namespace,pod,uid) (max_over_time(kube_pod_status_phase{phase="Running"}[5m])) == 1
              and on(namespace,pod)
                max by (namespace,pod,uid) (max_over_time(kube_pod_start_time{pod=~"(coordinate|switchboard)-.*"}[5m]))
                  >= scalar(max(max_over_time(process_start_time_seconds{job="prometheus-pushgateway"}[5m])) or vector(0))
              unless on(pod)
                max_over_time(agent_scan_phase_start_timestamp[5m])
            )
            or
            (
                (time() - max_over_time(agent_scan_phase_start_timestamp[5m])) > 900
              and on(pod)
                last_over_time(agent_scan_in_deterministic[5m]) == 1
              and on(pod)
                max by (pod) (max_over_time(kube_pod_status_phase{phase="Running"}[5m])) == 1
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "coordinate scan {{ $labels.pod }} has been in its DETERMINISTIC phase >15m in {{ $labels.namespace }} (p99 of a whole scan is 5m)"
            description: "{{ $labels.pod }} has spent over 15 minutes in the deterministic pass — the cheap gh/kubectl half that should finish in seconds. SYMPTOM ONLY; this says nothing about any ride the pod may have dispatched (that phase is excluded by construction — FU-145). STEP 1, the pod's own log: near-zero bytes and stuck before/inside the `git clone` is the known wedge (homelab#103, 2026-08-05). STEP 2, `kubectl -n {{ $labels.namespace }} get wf` — a wedged scan holds the `coordinator-scan` mutex with twins Pending behind it, which is what makes ONE stuck pod stop the whole loop from dispatching. Containment: delete the workflow + its queued twins so the next cron tick takes the lock; the 1800s activeDeadlineSeconds is the belt behind that. `unit=-` with duplicate submissions → look upstream at the Sensor (AgentEventInfraSpinning, homelab#103). If the pod is instead streaming a dispatched session this alert is silent by design — read `agent_scan_in_deterministic{pod=\"{{ $labels.pod }}\"}` on the pushgateway to see which phase it reported last. If that marker is MISSING, check `time() - process_start_time_seconds{job=\"prometheus-pushgateway\"}` before concluding anything: a gateway younger than the pod means its emptyDir store was destroyed with its last pod, so the markers for pods older than it are gone and this alert is deliberately degraded for them until they end (homelab#353)."
