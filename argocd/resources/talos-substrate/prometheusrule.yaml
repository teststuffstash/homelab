# The substrate belt (FU-235 / FU-254): does the fleet actually run what git declares?
#
# Two detectors exist for this, deliberately on different transports. The BOX's probe
# (mgmt/scripts/mgmt-probe.sh check_nodes) has the declaration in hand, so it compares per node —
# reachable, version, schematic, plus the Kubernetes-facing axes — and publishes mgmt_node_drift
# through the box's node_exporter textfile (job mgmt-node; its alerts are in
# argocd/resources/mgmt-metrics/, docs/management-box.md §MB2). The VERSION axis is alerted here,
# not there: this rule needs no box and no declaration.
#
# This rule is the half that needs NO new transport. kube_node_info is already scraped and carries
# os_image = "Talos (vX.Y.Z)", so the cluster can see one thing on its own: the fleet is not all on
# one version. It cannot see WHICH version is declared — that is the box's half — but every real
# case of the class shows up here first, because a rollout that stalls leaves a split behind.
#
# Threshold. `for: 24h` is the "rollout in progress" filter, and it is doing real work: a node at a
# time, with a drain and a Longhorn rebuild between, the fleet is legitimately split for hours. The
# worked example is the one that made this rule: the workers moved to v1.13.10 on 2026-09-16 and
# five nodes were still on v1.13.2 five days later (hp-01, m70s, wk-metal-04 waiting on their
# windows; cp-01, cp-02 blocked on the substrate fork, FU-263). Nothing alerted — the rollout
# simply stopped being anyone's turn, which is exactly what FU-254 says is undetected today.
#
# Shape. `unless topk(1, …)` leaves one series per NON-majority version, so the alert carries the
# trailing version in its own label and the node count as its value, instead of one opaque
# "there are 2 versions" series. A tie splits arbitrarily and fires for the other half — harmless.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talos-substrate
  namespace: monitoring
  labels:
    app: talos-substrate
spec:
  groups:
    - name: talos-substrate
      rules:
        - alert: TalosFleetVersionSplit
          expr: |
            count by (os_image) (kube_node_info{os_image=~"Talos.*"})
              unless topk(1, count by (os_image) (kube_node_info{os_image=~"Talos.*"}))
          for: 24h
          # triage none: rollout state; the reconciler alerts (Parked, InstallDrift) carry the cause
          labels: { severity: warning, triage: none }
          annotations:
            summary: "{{ $value }} node(s) have run {{ $labels.os_image }} for 24 h while the rest of the fleet is on another version"
            description: >-
              More than one Talos version has been running in the fleet for 24 h. This is the
              symptom only: it can be a rollout still in flight, a rollout parked on a blocker, or
              a node that came back on an image nobody declared. What says which — the per-node
              declared-vs-live diff on the management box (`devbox run mgmt-probe`, the
              `mgmt_node_drift` series) and whichever tracker item owns the rollout. Upgrade
              recipe: docs/provisioning.md §"Upgrading a node's Talos" (control planes via
              `devbox run cp-upgrade`).
    # ── control-plane-health: can this chassis hold a control-plane member? ──────────────────────
    #
    # THE 2026-10-05 04:28Z CLASS. wk-metal-02 (ThinkPad X250, 7.45 GiB, a control plane under
    # ADR-133's one-CP-per-chassis) ran its kube-apiserver at a 3.5–3.8 GiB working set for the whole
    # night (cp-01 3.9, cp-02 3.4 — the apiserver's size is the object set, 7.3k objects over 289
    # resource types / 234 CRDs, the #1687 class that grew cp-01 to 12 GiB). MemAvailable sat at
    # 25–29 % of the node for 17+ h, then Talos's userspace OOMController (docs/spikes/talos-psi-
    # thresholds.md, FU-155) SIGKILLed the apiserver cgroup; controller-manager and scheduler fell
    # with it, the node was NotReady 04:24:30–04:29:00Z and the CP VIP left it. What fired:
    # PodSigkilled (triage dig — unread while the responder is paused, dependency-upgrades.md G7).
    # What did not: every node-level belt — KubeNodeNotReady/KubeletDown/KubeAPIDown are `for: 15m`
    # and the member was back in 5. Two belts, both replayed on the event:
    #
    #   ControlPlaneNodeMemoryLow     the standing condition BEFORE the kill. Available memory on a
    #                                 control-plane node under 35 % for 30 m. Replay 10-04 12:00Z →
    #                                 10-05 04:00Z: wk-metal-02 25–29 % every hour (fires), cp-01
    #                                 58–63 %, cp-02 68–72 % (silent). 35 % is headroom, not the
    #                                 OOMController's trigger (that is PSI, which showed ~0 until the
    #                                 kill): the apiserver's set only grows, and a member must also
    #                                 absorb the restart burst of the other two components.
    #   ControlPlaneComponentRestarted the event itself — a kube-system static pod of the control
    #                                 plane (apiserver / controller-manager / scheduler) restarted in
    #                                 the last 30 m. Replay at 04:35Z: all three wk-metal-02 pods
    #                                 (apiserver 1, controller-manager 2, scheduler 1); silent at
    #                                 04:20Z and 05:05Z. `now`, not `dig`: a control-plane member
    #                                 going dark is the one restart class where the second one within
    #                                 the hour decides etcd quorum, and the restart counter resets on
    #                                 a config re-render (new mirror pod), so a planned Talos apply
    #                                 does not trip it — only a crash or a kill does.
    #
    # Node identity: node-exporter speaks `instance=<ip>:9100`, kube-state-metrics speaks `node`;
    # kube_node_info carries both (internal_ip), so the join rewrites its instance to node-exporter's
    # form and the role filter is kube_node_role. `max by (internal_ip, node)` first, the repo's
    # established shape for this join (mgmt-metrics `mgmt:node_rollout_settled:since`): kube_node_info
    # carries os_image, and a node mid-upgrade emits two series — unreduced, the group_left is
    # many-to-many and the rule errors out exactly during a rollout. The join fails CLOSED (no kube_node_info → no
    # alert) — acceptable here because a role filter is what keeps this off the 8 GB worker laptops,
    # and kube-state-metrics' own absence has its own stock belts (KubeStateMetrics*, TargetDown).
    #
    # It lives in this CR because the fact it watches is a SUBSTRATE sizing fact — which chassis
    # can be a member — and this directory already carries the fixture + drift-pin harness that the
    # values-embedded node-health group (kube-prometheus-stack.yaml) does not. The sizing decision
    # the first alert drives is FU-304.
    - name: control-plane-health
      rules:
        - alert: ControlPlaneNodeMemoryLow
          expr: |
            (
              node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.35
            )
              * on (instance) group_left (node)
                label_replace(max by (internal_ip, node) (kube_node_info{job="kube-state-metrics"}), "instance", "$1:9100", "internal_ip", "(.*)")
              and on (node) kube_node_role{job="kube-state-metrics", role="control-plane"}
          for: 30m
          # triage dig: a standing headroom condition — the fix is a sizing/role decision by PR
          labels: { severity: warning, triage: dig }
          annotations:
            summary: "control plane {{ $labels.node }} has {{ $value | humanizePercentage }} of its memory available (30 m under 35 %)"
            description: >-
              A control-plane node has had under 35 % of its memory available for 30 minutes. On this
              fleet that is the kube-apiserver's working set (the object set: 3.5–4 GiB on every
              member, growing with CRDs and objects) against the chassis — on 2026-10-05 wk-metal-02
              (7.45 GiB) sat at 27 % for 17 h and then Talos's OOMController killed the apiserver.
              Read `container_memory_working_set_bytes{container="kube-apiserver",node="{{ $labels.node }}"}`
              against `node_memory_MemTotal_bytes`; the levers are the apiserver's size (object set,
              `cluster.apiServer.env` GOMEMLIMIT / `resources`), the member's RAM, or the member role
              (ADR-133). Tracked: FU-304.
        - alert: ControlPlaneComponentRestarted
          expr: |
            increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace="kube-system", container=~"kube-apiserver|kube-controller-manager|kube-scheduler"}[30m]) > 0
          for: 0m
          # triage now: a member went dark; a second one inside the hour is an etcd-quorum question
          labels: { severity: warning, triage: now }
          annotations:
            summary: "{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }}× in 30 m — a control-plane member went dark"
            description: >-
              A control-plane static pod in kube-system restarted. A crash or a kill, not a config
              apply (a re-rendered static pod is a new mirror pod with a fresh counter). On
              2026-10-05 this was Talos's OOMController taking the apiserver on wk-metal-02, with
              controller-manager and scheduler following; the node was NotReady for 5 minutes —
              under every stock node belt's `for: 15m`. Read the pod's `lastState.terminated`
              (PodSigkilled's description separates the three exit-137 causes), the kernel log for the node
              in Loki (`{container="kmsg-reader", node="<node>"} |~ "OOM controller"`), and the node's
              memory (`container_memory_working_set_bytes{container="kube-apiserver"}` against
              `node_memory_MemTotal_bytes`) — a restart with none of those is a config push, a cert
              rotation or a hand kill, whatever else happens to be standing on the node.
