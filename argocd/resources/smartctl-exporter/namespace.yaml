# Disk health metering (FU-284). Its own namespace because the exporter needs a PRIVILEGED pod:
# smartctl issues ATA/NVMe passthrough ioctls on the raw device nodes, which needs CAP_SYS_RAWIO
# and root. Same shape as node-fstrim's `node-maintenance` namespace — the privilege is declared
# here, in one small object, rather than widened anywhere else.
#
# ⚠ Measured, not assumed: `runAsUser: 0` is REQUIRED. The upstream image runs as `nobody`, and a
# privileged container as nobody still gets `Permission denied` opening /dev/sda (probed on hp-01,
# 2026-09-23). privileged alone is not enough.
apiVersion: v1
kind: Namespace
metadata:
  name: disk-health
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
