# AgentStack XRD (FU-048 / ADR-085) — the agents framework published as a platform capability.
# A stack declares ONE cluster-scoped `AgentStack` in its -iac repo (its POLICY: repos, models,
# budgets, egress); homelab's Composition (composition.yaml) renders the per-repo fixer infra
# (the MECHANISM). The schema descriptions below ARE the in-cluster documentation — they render
# through `kubectl explain agentstacks.spec --recursive`; the quickstart for kubectl-only agents
# lives in the `agentstack-docs` ConfigMap (crossplane-system), pointed at by the annotations.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: agentstacks.platform.teststuff.net
  annotations:
    platform.teststuff.net/docs-url: https://github.com/teststuffstash/homelab/blob/master/docs/agents/agentstack.md
    platform.teststuff.net/docs-configmap: crossplane-system/agentstack-docs
spec:
  scope: Cluster # a stack spans repo namespaces, so the XR itself is cluster-scoped (no claim — v2 style)
  group: platform.teststuff.net
  names:
    kind: AgentStack
    plural: agentstacks
    singular: agentstack
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: MAIN-REPO
          type: string
          jsonPath: .spec.mainRepo
        - name: WORKER-MODEL
          type: string
          jsonPath: .spec.workerModel
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            AgentStack declares one stack's agentic-delivery policy: which repos its coordinator
            watches, which models its workers run, and per-repo fixer infrastructure (budget key,
            git token, worker egress policy). The platform Composition renders the mechanism from
            it. Start here: kubectl get configmap -n crossplane-system agentstack-docs
            -o jsonpath='{.data.USAGE\.md}'. Owned by the stack's -iac repo, GitOps-applied.
          properties:
            spec:
              type: object
              # workerModel became OPTIONAL 2026-08-03 (ADR-096 P5 pilot): a claim with NO
              # workerModel is a CHAINLESS stack — the router's rotation universe (model_tiers ∩
              # rankings, floors/strikes/cooldowns applied) supplies candidates per dispatch.
              # Requires routerMode: authoritative (the launcher refuses a chainless dispatch in
              # shadow/off — no static model exists to fall back to).
              required: [repos]
              # FU-080 ownership invariant, ENFORCED 2026-08-05 after it was violated by hand.
              # Exactly one scanner may dispatch a stack. Who dispatches:
              #   global belt   = coordinator.enabled AND NOT loop.graduated
              #   per-stack loop = coordinator.enabled AND loop.perStack
              # so the two failure states are:
              #   perStack + enabled + NOT graduated -> BOTH dispatch (the #134 label-race class;
              #     happened live on circles#17, 2026-08-05: three coordinator sessions in four
              #     minutes, saved from two concurrent rides only by the launcher's WIP pre-flight)
              #   graduated + NOT perStack           -> NEITHER dispatches, silently
              # Both collapse to one equality. The `graduated` description below has said this in
              # prose since FU-080; prose is what got ignored, so it is a rule now — the
              # iac-lane.md doctrine: replace the owner with a rule, never just remove the owner.
              # Deliberately permits the bring-up state (perStack rendered, coordinator off,
              # global belt driving) — that is graduated == (true && false) == false.
              x-kubernetes-validations:
                - rule: >-
                    ((has(self.loop) && has(self.loop.graduated)) ? self.loop.graduated : false)
                    ==
                    (((has(self.loop) && has(self.loop.perStack)) ? self.loop.perStack : false)
                     && ((has(self.coordinator) && has(self.coordinator.enabled)) ? self.coordinator.enabled : false))
                  message: >-
                    loop.graduated must equal (loop.perStack && coordinator.enabled) — FU-080
                    single-owner rule. graduated=false with both others true makes the global
                    belt AND the per-stack loop dispatch the same issue (double-run);
                    graduated=true without them leaves nothing scanning the stack at all.
                    Flip coordinator.enabled and loop.graduated together.
              properties:
                mainRepo:
                  type: string
                  default: homelab
                  description: >-
                    The coordinator's cwd — the repo whose CLAUDE.md and specs load as the
                    session's natural context (the stack's home of coordination knowledge).
                    Default homelab, for stacks whose coordination knowledge has not migrated
                    out of the platform docs yet.
                coordinatorModel:
                  type: string
                  default: sonnet
                  description: >-
                    Claude model alias for the stack's coordinator sessions (sonnet/opus).
                    The coordinator is subscription-run; workers use OpenRouter (workerModel).
                coordinator:
                  type: object
                  default: {}
                  description: >-
                    The stack's coordinator loop — dispatches workers, spends budget (FU-080).
                    Rendered as a PER-STACK coordinator CronWorkflow (ADR-093) in <stack>-agents,
                    running as the stack loop SA, so the stack owns its own loop instead of a
                    global reflex driving every stack. This is the FU-050 autonomy switch made
                    per-stack: enable a proven stack while newer ones stay off.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: >-
                        Opt THIS stack in to autonomous coordination. Default OFF — the
                        CronWorkflow renders suspended; flip per stack when you trust its loop.
                reviewer:
                  type: object
                  default: {}
                  description: >-
                    The stack's PR review (the ADR-093 edge-trigger + backstop). Default ON —
                    reviewing green, unapproved PRs is SAFE (it never dispatches new work or
                    spends worker budget). Set enabled:false only to opt a stack out entirely.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: Auto-review this stack's PRs. Default on.
                    goalModel:
                      type: string
                      default: sonnet
                      description: >-
                        Claude model alias for the ASSEMBLY review only — a PR whose head is
                        goal/** (the goal→master shape, review-goal.md). Rendered into the
                        per-stack review reflex as REVIEW_GOAL_MODEL; every other PR keeps
                        the reviewer default (sonnet). NB must DIFFER from the model that
                        decomposed the goal (goal-decompose runs GOAL_MODEL, default opus) —
                        model-routing.md §M10.
                slo:
                  type: object
                  description: >-
                    FU-104 — the stack's availability contract as CLAIM POLICY. When declared,
                    the platform renders: a blackbox Probe on the endpoint (the FU-099
                    exporter), an EndpointProbeFailing alert stamped stack:<name> (routes the
                    responder to THIS stack's -iac), an ErrorBudgetBurnt alert — and the TEETH:
                    while the budget is burnt, the review reflex parks this stack's auto-merge
                    lane (PRs wait for a HUMAN approval; "harder to ship something that breaks"
                    by contract). Probe-content rule (meta-11): the endpoint must exercise the
                    deepest dependency path — never a parent-process ping.
                  properties:
                    endpoint:
                      type: string
                      description: "The probed URL (e.g. https://mcp.oracle.teststuff.net/mcp)."
                    module:
                      type: string
                      default: http_2xx_lan
                      description: "Blackbox module (argocd/resources/blackbox: http_2xx_lan | mcp_post)."
                    availability:
                      type: number
                      default: 0.99
                      description: "30-day availability target; 1 - this = the error budget."
                  required: [endpoint]
                mcp:
                  type: object
                  description: >-
                    MCP (Model Context Protocol) tool server endpoint for agent sessions
                    (stack-wide). When present, the Composition renders the endpoint's HOST
                    (derived from the URL) into every fixer repo's worker egress CNP
                    (toFQDNs leg) — the agent session connects to this server for tool calls
                    (statute, search, give_feedback).
                    NO default on this object ON PURPOSE: an omitted defaulted object is
                    stamped into the stored claim by the API server and permanently OutOfSyncs
                    every claim file that does not carry it (the 2026-07-16 claudeTier lesson).
                    Absent = no MCP attached. The endpoint field takes a URL (scheme + host +
                    path, e.g. https://mcp.oracle.teststuff.net/mcp); the Composition derives
                    the bare HOST from it for the CNP toFQDNs leg. That host must be an FQDN,
                    never a service VIP (FU-072/kata: kata guests cannot reach service VIPs).
                    This is DISTINCT from spec.slo.endpoint (which is the blackbox probe target
                    for FU-104 availability monitoring); they may share a URL for a given stack
                    but serve different consumers and must not be conflated.
                  properties:
                    endpoint:
                      type: string
                      description: "The MCP server URL — scheme + host + path (e.g. https://mcp.oracle.teststuff.net/mcp). The launcher passes it verbatim to the harness's attach flag (claude --mcp-config file / goose --with-streamable-http-extension); the Composition derives the bare HOST from it for the worker CNP toFQDNs leg. That host must be an FQDN, never a service VIP (kata guests cannot reach service VIPs, FU-072)."
                    tools:
                      type: array
                      items:
                        type: string
                      default: []
                      description: "Tool names this MCP endpoint exposes (statute, search, give_feedback, etc.). Informational — the Composition does not consume this field."
                  required: [endpoint]
                prober:
                  type: object
                  description: >-
                    FU-102 — the agentic canary (roles.md §prober), scheduled leg. NO default on
                    this object ON PURPOSE: an omitted defaulted object is stamped into the
                    stored claim by the API server and permanently OutOfSyncs every claim file
                    that does not carry it (the 2026-07-16 claudeTier lesson). Absent = no
                    prober rendered. When enabled: a probe-<stack> CronWorkflow in the loop ns
                    runs the brief at <mainRepo>/.agents/probe.md on the SUBSCRIPTION
                    (claude/<model>, operator direction 2026-08-07) — prod-read, REPORT-ONLY BY
                    CONSTRUCTION (the pod holds no git/gh credential). Brief LOCATION is the
                    only contract; its content shape deliberately waits for a second stack's
                    probe (the ≥2-projects rule). Requires loop.perStack (renders into the loop
                    ns). Deep post-deploy acceptance composes with FU-044; the sync-succeeded
                    edge is FU-102's remaining machinery.
                  properties:
                    enabled:
                      type: boolean
                      description: Render the probe cron. Omit the whole block to keep the stack prober-free.
                    schedule:
                      type: string
                      default: "41 */6 * * *"
                      description: Cron for the scheduled leg (Argo CronWorkflow syntax, UTC).
                    model:
                      type: string
                      default: haiku
                      description: Claude model alias for the probe session (subscription rail).
                lenses:
                  type: object
                  description: >-
                    Per-stack knob graduating a named lens from advisory to blocking (FU-101).
                    Each key is a lens name (e.g. k8s-prod, helm); the value is the posture.
                    Absent = every lens stays advisory. NO default on this object on purpose:
                    an omitted defaulted object is stamped into the stored claim by the API
                    server and permanently OutOfSyncs every claim that does not carry it
                    (the 2026-07-16 claudeTier lesson — same rule as prober).
                  additionalProperties:
                    type: string
                    enum: [advisory, blocking]
                    description: >-
                      advisory — lens findings are Follow-ups, never the verdict.
                      blocking — lens findings MAY determine the verdict (the lens text
                      carries the posture line so the reviewer knows it matters).
                      NOTE: CRD structural-schema defaulting does NOT synthesize absent map
                      keys under additionalProperties. The fallback is the shell `// "advisory"`
                      in reviewer-session.sh (replay-pinned).
                responder:
                  type: object
                  description: >-
                    The graduated imperative-remediation knob (roles.md §responder). NO default
                    on this object ON PURPOSE: an omitted defaulted object is stamped into the
                    stored claim by the API server and permanently OutOfSyncs every claim file
                    that does not carry it (the 2026-07-16 claudeTier lesson). Absent = no
                    remediation Role rendered — the responder keeps its report-only breakers
                    ("no kubectl mutations", one-issue-max, inert labels). Enabling the dial
                    does not by itself make the responder mutate anything; a consumer must be
                    wired to read the grant and act on it (this PR ships NO consumer — report-only
                    remains the default posture; see goal #818 §assembly).
                  properties:
                    enabled:
                      type: boolean
                      description: >-
                        Render a scoped remediation Role + RoleBinding in every stack namespace,
                        granting the declared verb/resource pairs to the responder's identity
                        (agentstack-loop SA). Default OFF — the responder stays breaker-gated;
                        even when enabled, nothing reads the dial yet (no consumer in this PR).
                    verbs:
                      type: array
                      description: >-
                        Remediation verb/resource pairs the Role grants. Each entry declares
                        one resource (plural) and one verb. The rendered Role grants exactly
                        these pairs and no others, scoped to every namespace the stack owns
                        (the loop namespace + each fixer-enabled repo namespace). Define only
                        the minimum needed for the alert class being remediated. The escalation
                        check mirror (rbac.yaml) pre-grants common remediation verbs so the
                        compose passes for any reasonable whitelist — see the comment there.
                      items:
                        type: object
                        required: [resource, verb]
                        properties:
                          resource:
                            type: string
                            # One resource name only. The pattern is load-bearing, not cosmetic:
                            # the Composition splices this value into a rendered Role rule, and a
                            # comma ("pods, secrets") would render a VALID multi-resource rule —
                            # widening past the declared pair and past the deliberate secrets
                            # carve-out (rbac.yaml). Belt to the template's `| quote`.
                            pattern: "^[a-z0-9.-]+(/[a-z]+)?$"
                            description: "Kubernetes resource name, plural, core API group only (e.g. pods, configmaps). One name — no lists."
                          verb:
                            type: string
                            pattern: "^[a-z]+$"
                            description: "Kubernetes verb (e.g. get, list, patch, delete). One verb — no lists."
                loop:
                  type: object
                  default: {}
                  description: >-
                    FU-080 per-stack loop isolation. perStack:true renders the stack's OWN
                    coordinate CronWorkflow in <stack>-agents (running as agentstack-loop,
                    git creds fetched per-op from the egress proxy's TokenReview-gated
                    /loop-git-token — no Secret ever sits in the loop namespace) + the
                    centrally-minted loop-git token legs. Default OFF: the global reflexes
                    in agent-coordinator drive this stack (and keep running as the backstop
                    belt during migration either way). Graduate like autonomy: oracle first.
                  properties:
                    perStack:
                      type: boolean
                      default: false
                      description: Render the per-stack loop machinery. Default off.
                    graduated:
                      type: boolean
                      default: false
                      description: >-
                        FU-080 cutover. graduated:true RETIRES the migration belt for this stack:
                        the GLOBAL coordinator scan skips it (coordinator-scan.sh) and the
                        /coordinate doorbell edge routes to <stack>-agents (the emitters carry
                        {stack,loop_ns}, the coordinator Sensor inlines a per-stack Workflow). Set
                        it ONLY with perStack:true and coordinator.enabled:true — otherwise the
                        global belt is the only thing running this stack and skipping it silences
                        the loop. Default off (perStack renders the loop; graduated retires the
                        belt — soak the former before the latter). oracle stays perStack-only for
                        now; sleep is the first fully-graduated stack (2026-07-26).
                workerModel:
                  type: string
                  description: >-
                    Primary model for worker (fixer) sessions. OpenRouter models as
                    "openrouter/<vendor>/<model>"; "claude/<model>" (e.g. "claude/haiku")
                    selects the SUBSCRIPTION claude-code harness instead (FU-066 — the
                    launcher derives --harness claude from the prefix; repos running it
                    need fixer.claudeTier=true so the session secret renders). Chain
                    policy: paid-cached-fast first — free tiers rate-limit below the
                    platform's freshness windows (git-token TTL, budget pacing); they are
                    scout-canary material. OMIT the field entirely for a chainless stack
                    (router-routed per dispatch — see routerMode).
                modelDeny:
                  type: array
                  items:
                    type: string
                  default: []
                  description: >-
                    Per-stack model deny list (ADR-096): ids here are excluded from every
                    /route decision for this stack (skip reason claim-deny) — the launcher
                    passes the stacks.json mirror row's list on each consult. Was consumed by
                    agent-session.sh without being declared here (found 2026-08-03).
                routerMode:
                  type: string
                  enum: [shadow, authoritative, "off"]
                  default: shadow
                  description: >-
                    ADR-096 P4 knob, per stack: shadow = consult /route + log divergence,
                    dispatch the static chain (fleet default during the soak); authoritative =
                    the routed decision picks the model (REQUIRED for a chainless stack);
                    off = no consult. The launcher reads this from the stacks.json mirror row
                    (explicit AGENT_ROUTER env still overrides — jail experiments).
                workerModelFallbacks:
                  type: array
                  items:
                    type: string
                  default: []
                  description: >-
                    Ordered fallback models tried when the primary fails a round. Same
                    format as workerModel without the "openrouter/" prefix requirement.
                repos:
                  type: array
                  description: >-
                    Every repo the stack's coordinator watches (issues/PRs), in scan order.
                    A repo WITH a `fixer` block also gets worker infrastructure rendered into
                    the namespace named after it (namespace must already exist — it is owned
                    by the repo's own deployment, never by this XR). A repo without `fixer`
                    is context-only (e.g. an -iac deploy target: CI deploys it, agents never
                    run pods in it).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: >-
                          GitHub repo name in the teststuffstash org; doubles as the worker
                          namespace name for fixer-enabled repos.
                      storage:
                        type: object
                        description: >-
                          Per-tier storage caps for namespace <name> (ADR-089 quota-as-contract).
                          The platform advertises the tiers + pool ceilings in SERVICES.md; the
                          claim states what this repo's namespace may provision; a ResourceQuota
                          enforces it at PVC-creation time — over-cap provisioning fails fast
                          with a legible quota error instead of wedging unschedulable in
                          Longhorn. A granted cap is a real promise (the platform keeps the sum
                          of grants within pool capacity and runs over-provisioning at 100%).
                          Omit = no quota (legacy-open); prefer declaring even a small cap.
                        properties:
                          standard:
                            type: string
                            default: "0"
                            description: >-
                              Cap for StorageClass `longhorn` (the default; replicated across
                              the small always-on disks), e.g. "10Gi". "0" = none provisionable.
                          bulk:
                            type: string
                            default: "0"
                            description: >-
                              Cap for StorageClass `longhorn-bulk` (large 2-replica volumes on
                              the big-disk tier; S3 data, backups, datasets), e.g. "150Gi".
                          fast:
                            type: string
                            default: "0"
                            description: >-
                              Cap for StorageClass `longhorn-fast` (Optane scratch, replica=1,
                              pinned to one node), e.g. "5Gi".
                          scratch:
                            type: string
                            default: "0"
                            description: >-
                              Cap for StorageClass `longhorn-scratch` (per-ride throwaway
                              volumes, replica=1 on the bulk disks; the docker-mode dind
                              /var/lib/docker block PVC, FU-081), e.g. "40Gi" — size for
                              20Gi × concurrent docker rides.
                      argo:
                        type: object
                        description: >-
                          Opt namespace <name> in to run Argo Workflows (ADR-093 — the platform
                          orchestration engine). The platform renders the workflow ServiceAccount +
                          `workflowtaskresults` RBAC so the stack's own WorkflowTemplates/CronWorkflows
                          (authored in its `-iac` repo) run here. MECHANISM only — the DAG + step
                          images are stack policy (ADR-085). First consumer: oracle-fleet ingestion
                          (snapshot→parse→build→publish, ING-RT-STEP-CONTRACTS). The S3 artifact
                          repository (Garage bucket + key + default configmap) is rendered too once a
                          multi-step DAG needs inter-step handoff — not yet (single-step snapshot
                          writes straight to oracle's own data bucket).
                        properties:
                          enabled:
                            type: boolean
                            default: false
                            description: Render the workflow SA + workflowtaskresults RBAC into this namespace.
                          artifacts:
                            type: object
                            description: >-
                              Render the per-namespace Argo S3 artifact repository (oracle-iac#40
                              deliverable 2): a Garage bucket `argo-artifacts-<repo>` + ONE rw key
                              (provider-terraform Workspace, ADR-076, CREATE-pattern like the
                              transcripts/loki workspaces), the connection Secret
                              `argo-artifacts-s3` in-namespace, and the default
                              `artifact-repositories` ConfigMap Argo resolves for inter-step
                              handoff. Boundary (ING-RT-STEP-CONTRACTS): SMALL step outputs only —
                              manifests, checksum records, census reports; large objects pass by
                              REFERENCE to the stack's own data buckets, so the cap stays small.
                            properties:
                              enabled:
                                type: boolean
                                default: false
                                description: Render the bucket + key + configmap.
                              capGi:
                                type: integer
                                default: 2
                                minimum: 1
                                description: >-
                                  Bucket max_size in Gi (ADR-089 quota-as-contract — every bucket
                                  claim states its cap; count it against the bulk-tier budget).
                      labels:
                        type: object
                        description: >-
                          Present = this repo's GitHub label set is CLAIM-OWNED (FU-068, the
                          Issues permission tier): the Composition renders an AUTHORITATIVE
                          IssueLabels — the platform taxonomy (GitHub defaults + the agent
                          state machine + the merge-path lanes) plus `extra` below becomes the
                          repo's ENTIRE label set; any label not in it is DELETED on sync.
                          Migration is claim-first: add this block, verify the composed
                          IssueLabels synced (`kubectl get issuelabels <repo>-labels`), THEN
                          remove the repo from tofu/github label_repos — two managers fight
                          and the authoritative one wins by deleting. Requires the
                          homelab-labels App credential
                          (scripts/github-app-bootstrap.sh homelab-labels). Diff the repo's live
                          labels (gh label list) against the taxonomy before enabling — any
                          human label you want to keep goes in `extra`.
                        properties:
                          extra:
                            type: array
                            default: []
                            description: >-
                              Stack-specific labels beyond the platform taxonomy (e.g. the
                              oracle track/* lane labels). name + 6-hex color (no '#') +
                              optional description. QUOTE the color in YAML — a bare hex like
                              5319e7 parses as scientific notation (found live on the first
                              migration, oracle-iac#12→#13).
                            items:
                              type: object
                              required: [name, color]
                              properties:
                                name:
                                  type: string
                                color:
                                  type: string
                                description:
                                  type: string
                      fixer:
                        type: object
                        description: >-
                          Present = render fixer-flow infra into namespace <name>: the
                          OpenRouterKey standing budget key (the operator mints it and writes
                          Secret <name>-openrouter), the agent-git-token ExternalSecret trio
                          (repo-scoped ~1h GitHub App installation token, label-served by the
                          egress broker per ADR-087 leg B), the worker egress
                          CiliumNetworkPolicy (see egress), and the openrouter-proxy
                          session-key RBAC (ADR-087 leg A). Omit for context-only repos.
                        properties:
                          budgetUSD:
                            type: number
                            default: 5
                            description: >-
                              Standing weekly/monthly funding ceiling (USD) for the repo's
                              agents — the per-session ephemeral keys budget underneath it.
                          resetInterval:
                            type: string
                            default: weekly
                            enum: [daily, weekly, monthly]
                            description: Budget reset cadence for budgetUSD.
                          guardrail:
                            type: string
                            default: only-free
                            enum: [only-free, none]
                            description: >-
                              only-free = the egress proxy 403s paid-model completions on
                              this key BEFORE spend (FU-024). Ephemeral session keys carry
                              their own guardrail; this is the standing key's.
                          claudeTier:
                            type: boolean
                            default: false
                            description: >-
                              true = this repo's workers may run the SUBSCRIPTION
                              claude-code harness (FU-066): renders the `claude-session`
                              ExternalSecret into the namespace (Infisical
                              COORDINATOR_CLAUDE_OAUTH_TOKEN → data key AUTH_TOKEN,
                              session-key-labeled). A claude ride's pod holds only
                              ref:<name>/claude-session; the egress proxy's /anthropic
                              upstream resolves it and injects the oauth token + beta
                              header (ADR-087 leg A). Select the tier per dispatch via
                              the workerModel notation "claude/<alias>" (primary or any
                              chain position). Rides run on agent-base like every other
                              harness (devbox toolchain + docker mode included,
                              agent-runtime#14).
                          docker:
                            type: boolean
                            default: false
                            description: >-
                              true = this repo's workers need a real Docker daemon (its CI
                              gate runs kind/k3d/testcontainers, e.g. `devbox run ci` with a
                              nested cluster). Worker rides then run as kata microVM pods
                              (RuntimeClass kata, the 3 kata-labeled laptops) with a dind
                              sidecar: DOCKER_HOST is wired for the repo's own docker CLI
                              (bring it via devbox.json). The counterpart of a CI workflow
                              choosing the Docker-capable VM runner over an ephemeral
                              in-cluster runner. Costs: ~5Gi VM per ride (one per node —
                              the 8G-laptop ceiling), in-cluster services ride resolved
                              endpoint IPs until FU-072, and the `ghcr.io` FQDN stays on the
                              egress allowlist because dockerd's `registry-mirrors` is Hub-only
                              (the docker.io/ghcr pull-through mirrors themselves are BASELINE
                              egress for every ride — homelab#520 — not gated by docker=true).
                          egress:
                            type: object
                            description: >-
                              Worker-pod egress lockdown (FU-020/ADR-081): a
                              CiliumNetworkPolicy allowing only DNS, the agent-egress
                              proxy+broker (the ONLY LLM/credential exit), the nix cache,
                              garage (transcripts), monitoring (run metrics), and the
                              baseline FQDNs (github.com + *.githubusercontent.com +
                              cache.nixos.org) plus profile/extraFQDNs. Rollout: create
                              with enforce=false (monitor), harvest Hubble flows over real
                              rides, flip enforce=true after clean rides.
                            properties:
                              profile:
                                type: string
                                default: none
                                enum: [none, python, node]
                                description: >-
                                  Ecosystem FQDN set added to the baseline. python =
                                  pypi.org + files.pythonhosted.org (uv/pip); node =
                                  registry.npmjs.org; none = baseline only.
                              extraFQDNs:
                                type: array
                                items:
                                  type: string
                                default: []
                                description: >-
                                  Stack-specific additional FQDNs (port 443), exact names
                                  (no wildcards; a wildcard need = extend the Composition).
                                  Earn each entry from a monitor-phase harvest, not
                                  speculation.
                              enforce:
                                type: boolean
                                default: false
                                description: >-
                                  false = MONITOR: the policy attaches with
                                  enableDefaultDeny.egress=false — DNS visibility + the
                                  allowlist evaluated, nothing blocked; diff Hubble flows
                                  against the allowlist (verdicts three-valued:
                                  ALLOWED/WOULD-DROP/PROBE-FAILED). true = deny-all
                                  ENFORCED. Flip only after clean monitored rides; drops
                                  manifest as worker HANGS, watch
                                  hubble_drop_total{reason=POLICY_DENIED}.
            status:
              type: object
              properties:
                repos:
                  type: array
                  items:
                    type: string
                  description: Names of the repos this stack watches (mirror for quick kubectl reads).
