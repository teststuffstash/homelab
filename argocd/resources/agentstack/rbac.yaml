# Crossplane core composes ARBITRARY k8s kinds (v2), but its SA only holds RBAC for kinds it
# defines itself — every kind the AgentStack Composition renders must be granted explicitly.
# Aggregated into the core `crossplane` ClusterRole via the label (the supported extension point).
# Includes /status: composed-resource readiness reads it.
#
# ⚠ ESCALATION CHECK (FU-080, learned live): to COMPOSE a Role/RoleBinding that GRANTS verb V on
# resource R, Crossplane's own SA must already HOLD V on R (k8s privilege-escalation prevention) —
# otherwise the compose fails "attempting to grant RBAC permissions not currently held". The proxy
# Role (secrets:get) passed because core holds it; the FU-080 agentstack-loop Role grants
# pods/pods-exec/pvc, so those verbs are mirrored below purely to satisfy the check (Crossplane
# never USES them — they exist so it can hand them to the loop SA).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-agentstack-composed
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  # FU-080 escalation-check mirror for the composed agentstack-loop Role (see header).
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete] # get/list = loop-Role mirror; write = FU-080 loop transcripts PVC compose
  # FU-140 crash-net: the Composition composes a per-loop-ns CronJob (PR#294) — every kind the
  # Composition renders must be granted here (this header's own rule; missed at merge, caught by
  # the closeout: all four claims Synced=False on "cannot patch cronjobs", homelab#286).
  - apiGroups: [batch]
    resources: [cronjobs, cronjobs/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumnetworkpolicies/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, externalsecrets/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [generators.external-secrets.io]
    resources: [githubaccesstokens, githubaccesstokens/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [openrouter.teststuff.net]
    resources: [openrouterkeys, openrouterkeys/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # ADR-093 argo.enabled: the composed workflow Role GRANTS workflowtaskresults, so — per the
  # escalation-check gotcha above — crossplane must itself hold it. serviceaccounts: compose the
  # workflow SA. (No agentstack CR uses these; they exist to hand to the composed Role/SA.)
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch, get, list, watch, delete]
  # FU-080 loop.perStack: the Composition composes the per-stack coordinate CronWorkflow.
  - apiGroups: [argoproj.io]
    resources: [cronworkflows]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-080 doorbell: the composed sensor-submit-coordinate Role GRANTS workflows-create to the
  # global Sensor (so it can submit a per-stack coordinate Workflow into <loop_ns>) — the same
  # escalation-check gotcha, so crossplane must itself hold these verbs to compose that Role.
  # `delete` joined 2026-08-17: the ADR-106(5)/A2 doorbell-collapse gave the composed
  # `agentstack-loop-workflow` Role workflows-DELETE (a starting scan absorbs Pending sibling
  # coordinate workflows by deleting them), and the claim sat Synced=False on the escalation
  # check — the fourth instance of this class, found on the platform claim's workerModel edit.
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-104: the Composition composes the SLO Probe + PrometheusRule (blackbox belt) —
  # Crossplane must hold every composed kind's verbs (the FU-080 workflows/endpoints lesson:
  # a missing kind grant surfaces as "failed waiting for Informer to sync" on the whole XR).
  - apiGroups: [monitoring.coreos.com]
    resources: [probes, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-080 loop-home: the Composition composes the per-stack <stack>-agents Namespace.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Responder graduation dial (goal#818 / FU-103): the Composition composes per-namespace
  # Role + RoleBinding granting the claim-declared verb/resource pairs to the responder
  # identity (agentstack-loop SA). To COMPOSE a Role that grants verb V on resource R,
  # Crossplane's own SA must already HOLD V on R (k8s privilege-escalation prevention).
  # The common remediation verbs below are pre-granted so the compose passes for any
  # reasonable whitelist. Crossplane never USES these verbs — they exist so it can hand
  # them to the responder Role. If a claim declares a verb/resource pair NOT listed here,
  # the compose fails with "attempting to grant RBAC permissions not currently held" and
  # the claim engineer must add the missing pair to this block.
  #
  # NOTE — secrets is deliberately NOT pre-granted here. It is a materially more sensitive
  # class than the other remediation targets (pods, configmaps, deployments), and no claim
  # today declares a secrets remediation pair. If a claim does, the compose will fail with
  # "attempting to grant RBAC permissions not currently held" — a loud, self-describing
  # failure that tells the claim engineer to add the missing pair. A silent standing grant
  # has no such tell. Add secrets here only when a consumer exists and the minimal-privilege
  # case has been reviewed.
  #
  # SCOPE — CORE GROUP ONLY, matching what the Composition can render: the responder Role
  # template hardcodes `apiGroups: [""]` (composition.yaml), so a non-core pair (deployments,
  # jobs, CNPs) is structurally unrenderable today and pre-granting for it would be a standing
  # cluster-wide grant nothing can consume (the 2026-08-30 assembly read dropped exactly those
  # rows). When a consumer needs a non-core pair, the verbs schema grows an `apiGroup` field
  # and its pre-grant row lands here in the same change — same one-change discipline as secrets.
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, endpoints, events, persistentvolumeclaims, persistentvolumeclaims/status, services]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch]
  # ADR-089 quota-as-contract: the Composition has been able to compose a per-repo ResourceQuota
  # since the tier work landed, but the block is gated on `{{- if $r.storage }}` and NO claim had
  # ever set `storage` — so this grant was never needed and its absence never showed. Arming the
  # first claim on 2026-08-07 immediately took ALL FOUR composites to
  # `ReconcileError: ... failed waiting for *unstructured.Unstructured Informer to sync`,
  # exactly the failure the FU-104 comment above warns about, and it breaks the whole XR rather
  # than just the new resource. The general shape, third time now (endpoints, IAC-G03 reads, this):
  # a Composition branch that has never executed carries no evidence that its RBAC exists.
  - apiGroups: [""]
    resources: [resourcequotas, resourcequotas/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-080 perStack: the Composition composes the per-stack claims-read ClusterRoleBinding.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-068 labels tier: the Composition composes provider-upjet-github's IssueLabels.
  - apiGroups: [repo.github.upbound.io]
    resources: [issuelabels, issuelabels/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-072: agentstack-claims-read (bound per-stack) also grants endpoints get/list (the loop SA's
  # kata endpoint-IP rewrites), so crossplane must hold it to compose that binding. Latent since the
  # FU-072 grant landed — oracle's existing CRB masked it; graduating sleep (a NEW CRB) surfaced it.
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list]
  # IAC-G03 (2026-08-02) widened agentstack-claims-read with argocd-app + Workspace reads for the
  # -iac merged-closeout — the SAME latent class as the endpoints lesson above: existing CRBs
  # masked it, the first NEW stack CRB after the widening (circles, 2026-08-03) hit the
  # escalation check. Mirrored here so crossplane can compose the binding; it never uses them.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [tf.upbound.io]
    resources: [workspaces]
    verbs: [get, list]
---
# FU-080 perStack: the loop SA reads AgentStack claims (the stack-list/knob source of truth) —
# without this the per-stack scan PROBE-FAILS onto the stacks.json belt (seen live 2026-07-18,
# first oracle-agents tick). Read-only; bound per stack by the Composition.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentstack-claims-read
rules:
  - apiGroups: [platform.teststuff.net]
    resources: [agentstacks]
    verbs: [get, list, watch]
  # ⚠ endpoints-read was the launcher's FU-072 kata endpoint-IP rewrite (`resolve_ep`, deleted
  # 2026-09-04). Kept in step with agents/coordinator/rbac.yaml — drop both together once no
  # other launcher path reads endpoints. Effectively this ClusterRole = "loop cluster reads",
  # not claims alone.
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list]
  # IAC-G03 (2026-08-02): the -iac merged-closeout verifies the CLUSTER, not GitHub — the play
  # reads the app's Synced-revision + Health and the composed claims' Ready. Read-only, and only
  # what the closeout needs (no secrets, no writes).
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [tf.upbound.io]
    resources: [workspaces]
    verbs: [get, list]
