# AgentStack XR health belt (homelab#1620 closeout, 2026-09-14).
#
# Source metric: kube-state-metrics custom-resource-state on `.status.conditions` of every
# AgentStack (argocd/platform/values/kube-prometheus-stack.yaml → `kube-state-metrics.customResourceState`).
# Synced=False is the condition every missed-RBAC compose has parked a claim in so far
# (rbac.yaml header: pods/exec, workflows, endpoints, resourcequotas, clustersecretstores), and the
# XR stays there silently — Ready keeps its last True, the stack's workloads run on stale renders,
# and the operator notices when a consumer waits on a Secret that never came.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentstack-health
  namespace: monitoring
  labels:
    app: agentstack
spec:
  groups:
    - name: agentstack-health
      rules:
        # `for: 15m` rides out the transient Synced=False flips a reconcile-error storm produces
        # (an apiserver eviction window, the crossplane circuit breaker's own re-opens).
        - alert: AgentStackNotSynced
          expr: |
            kube_agentstack_status_condition{type="Synced"} == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "AgentStack {{ $labels.name }} has been Synced=False ({{ $labels.reason }}) for 15m"
            description: >-
              Crossplane cannot reconcile the {{ $labels.name }} claim: nothing it renders changes
              until this clears, so a claim edit (a new grant, a knob) is silently not live.
              Read the message with `kubectl get agentstack {{ $labels.name }} -o
              jsonpath='{.status.conditions}'` and `kubectl get events --field-selector
              involvedObject.name={{ $labels.name }}`. "failed waiting for Informer to sync" or
              "attempting to grant RBAC permissions not currently held" = a composed kind or verb
              missing from argocd/resources/agentstack/rbac.yaml (docs/agents/agentstack.md
              §gotchas); a "cannot apply composed resource … not found" on a RoleBinding is the
              Role-before-binding ordering and clears on its own.
        # The "green that saw nothing" guard (FU-125/FU-108 class): if the custom-resource-state
        # config stops producing the series (chart bump drops it, KSM RBAC lost), the belt above
        # goes quiet rather than firing — this one says so.
        - alert: AgentStackHealthMetricAbsent
          expr: |
            absent(kube_agentstack_status_condition{type="Synced"})
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "No AgentStack Synced condition series for 30m — the XR health belt is blind"
            description: >-
              kube-state-metrics is not exporting kube_agentstack_status_condition. Check the
              kube-state-metrics pod args carry --custom-resource-state-config-file, that its
              ClusterRole still lists agentstacks.platform.teststuff.net (rbac.extraRules in the
              kube-prometheus-stack values), and that at least one AgentStack claim exists.
    # GitHub-token mirror belt (oracle handoff 2026-09-22; oracle-fleet's 02:30Z retention cron
    # 401'd on 09-21 + 09-22). A GithubAccessToken generator's central ES in agent-coordinator
    # mints a 60-min App token; a kubernetes-provider MIRROR ES copies that Secret into a consumer
    # namespace (the composition's readOnlyGrants mirror, agents/coordinator/retro-git.yaml's).
    # Two independent refresh clocks: a mirror that refreshes φ minutes after each mint holds a
    # token aged φ..φ+interval — with 45m/45m, φ > 15m = a dead copy for a fixed window of every
    # cycle while both ES read SecretSynced. The observable: the mirror's last refresh PRECEDES the
    # latest mint of the Secret it copies. A healthy mirror catches up within its own (short)
    # interval; still behind after 10m = it serves a token ≥ central interval + 10m old.
    # Source: kube-state-metrics custom-resource-state (kube-prometheus-stack values).
    - name: github-token-mirrors
      rules:
        - alert: GithubTokenMirrorBehind
          expr: |
            (
                max by (remote_key) (
                  label_replace(
                    kube_externalsecret_refresh_time{namespace="agent-coordinator", generator_kind="GithubAccessToken"},
                    "remote_key", "$1", "target", "(.+)"))
              - on (remote_key) group_right
                kube_externalsecret_refresh_time{namespace!="agent-coordinator", remote_key!=""}
            ) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} still holds the token before the latest mint of {{ $labels.remote_key }} (10m+)"
            description: >-
              The mirror ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} last synced
              {{ $value | humanizeDuration }} before agent-coordinator/{{ $labels.remote_key }}
              minted its current GitHub App token and has not caught up for 10m — the Secret in
              {{ $labels.namespace }} carries the PREVIOUS token, now at least the central
              refreshInterval + 10m old; past 60m every GitHub call with it is 401, and both ES
              may still read SecretSynced. Check both: is the mirror syncing at all (`kubectl -n
              {{ $labels.namespace }} describe externalsecret {{ $labels.name }}` — an error
              condition, a store whose SA lost read access), and is its refreshInterval short
              (minutes) next to the central's, with the central's ≤ 60m minus the mirror's (a
              long mirror interval lags by the refresh-clock phase every cycle). Probe the token
              without echoing it (value into a header file, curl
              api.github.com/installation/repositories); annotating the mirror ES
              `force-sync=$(date +%s)` forces one sync attempt.
        # The mint itself stalled (generator erroring, ESO down): the served token dies at 60m.
        - alert: GithubTokenMintStale
          expr: |
            time() - kube_externalsecret_refresh_time{generator_kind="GithubAccessToken"} > 3300
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} has not minted a GitHub token for 55m+ — it expires within minutes"
            description: >-
              The GithubAccessToken-driven ExternalSecret {{ $labels.namespace }}/{{ $labels.name }}
              last synced {{ $value | humanizeDuration }} ago; GitHub App installation tokens live
              60m, so everything reading Secret {{ $labels.target }} (and its mirrors) is about to
              401. Read `kubectl -n {{ $labels.namespace }} describe externalsecret
              {{ $labels.name }}` for the generator error, then the external-secrets controller log.
        # Blind-belt guard (FU-125/FU-108 class): if the series stop, both rules above go quiet.
        - alert: GithubTokenMirrorMetricAbsent
          expr: |
            absent(kube_externalsecret_refresh_time{generator_kind="GithubAccessToken"})
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "No GithubAccessToken ExternalSecret refresh_time series for 30m — the token mirror belt is blind"
            description: >-
              kube-state-metrics is not exporting kube_externalsecret_refresh_time. Check its
              custom-resource-state config still carries the external-secrets.io ExternalSecret
              resource and its ClusterRole lists externalsecrets (rbac.extraRules in the
              kube-prometheus-stack values).
