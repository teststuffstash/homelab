# AgentStack Composition (FU-048 / ADR-085) — renders the per-repo fixer MECHANISM from a stack's
# AgentStack POLICY. For every spec.repos[] entry with a `fixer` block, into namespace <repo.name>
# (which must already exist — the repo's own deployment owns it, never this XR):
#   1. agentstack-worker ServiceAccount        — FU-089: the worker pod's TokenReview identity for
#                                                the proxy's /git-token (no RBAC grants). The App
#                                                private key + per-repo generator + agent-git-<repo>
#                                                ExternalSecret live CENTRALLY in agent-coordinator
#                                                (rendered below into that ns, never a fixer ns —
#                                                a standing key in a workbench-admin ns was the
#                                                cross-stack escalation FU-089 closed); the proxy's
#                                                TokenReview-gated /git-token serves it (ADR-087 leg B)
#   4. OpenRouterKey <repo>                    — standing budget key; operator writes <repo>-openrouter
#   5. agent-worker-egress CiliumNetworkPolicy — FU-020 lockdown, tiered legs (baseline /
#                                                capability-gated / profile / earned — the tier
#                                                table in docs/agents/agentstack.md), with the
#                                                monitor→enforce dial (enableDefaultDeny.egress)
#   6. agentstack-proxy-session-keys Role+Binding — ADR-087 leg A: the egress proxy resolves opaque
#                                                refs by reading LABELED session Secrets in this ns.
#                                                Named agentstack-* (NOT openrouter-proxy-session-keys)
#                                                so migration never collided with the retired
#                                                hand-list's same-named Roles (gapless handoff).
#   7. agent-transcripts-s3 ExternalSecret      — FU-080 a: write-only transcripts key mirrored in-ns
#                                                (ClusterSecretStore agent-transcripts) so no launcher
#                                                reads Secret values cross-namespace.
#   8. agentstack-loop SA + Role + Binding      — FU-080: the per-stack loop identity + NAMESPACED
#                                                launch grants (pods/exec/pvc/openrouterkeys), ready
#                                                for a per-stack coordinator/reviewer to run in-ns.
#                                                Additive; the reflex CronJob move is the remaining step.
#   9. argo-workflow SA + Role + Binding         — ADR-093, gated on repos[].argo.enabled: the
#                                                workflow identity + workflowtaskresults RBAC so the
#                                                stack's WorkflowTemplates/CronWorkflows run in-ns
#                                                (first: oracle-fleet ingestion). Artifact repo later.
# Mirrors (and supersedes, per migrated repo) agents/fixer/<repo>/ and <stack>-iac//<repo>/agent/.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agentstack
  annotations:
    platform.teststuff.net/docs-url: https://github.com/teststuffstash/homelab/blob/master/docs/agents/agentstack.md
    platform.teststuff.net/docs-configmap: crossplane-system/agentstack-docs
spec:
  compositeTypeRef:
    apiVersion: platform.teststuff.net/v1alpha1
    kind: AgentStack
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $profileFQDNs := dict
                  "python" (list "pypi.org" "files.pythonhosted.org")
                  "node"   (list "registry.npmjs.org")
                  "none"   (list) }}
            {{- /* FU-068: the platform label taxonomy — a claim-owned repo's ENTIRE label set is
                 this list + the repo's labels.extra (IssueLabels is AUTHORITATIVE: anything else
                 gets deleted). Three tiers: GitHub defaults (humans use them), the agent state
                 machine (mirror of tofu/github labels.tf — keep in sync until every repo is
                 claim-owned and labels.tf dies), the merge-path/Renovate lanes.
                 ⚠ The list below is ONE go-template action: a `{{`-delimited comment placed
                 between two `(dict …)` entries terminates it. Annotate here, never inline.
                 The ADR-102 goal-lifecycle block (homelab#208) is the fourth tier —
                 `goal/post-launch` is written by the scan at assembly merge, the three VERDICTS
                 are written by a HUMAN and the scan only reacts to them (it refuses a Bot-applied
                 one). They must be provisioned HERE or neither half works: IssueLabels is
                 AUTHORITATIVE, so a runtime `gh label create` self-destructs on the next sync,
                 `gh issue edit --add-label` errors on a label that does not exist, and the verdict
                 authority cannot apply one from the UI either. github-exporter.py already maps the
                 three verdicts onto the goal-registry panel's verdict column and says it "needs no
                 code change the day the labels land" — this is that day. */}}
            {{- $platformLabels := list
                  (dict "name" "bug" "color" "d73a4a" "description" "Something isn't working")
                  (dict "name" "documentation" "color" "0075ca" "description" "Improvements or additions to documentation")
                  (dict "name" "duplicate" "color" "cfd3d7" "description" "This issue or pull request already exists")
                  (dict "name" "enhancement" "color" "a2eeef" "description" "New feature or request")
                  (dict "name" "good first issue" "color" "7057ff" "description" "Good for newcomers")
                  (dict "name" "help wanted" "color" "008672" "description" "Extra attention is needed")
                  (dict "name" "invalid" "color" "e4e669" "description" "This doesn't seem right")
                  (dict "name" "question" "color" "d876e3" "description" "Further information is requested")
                  (dict "name" "wontfix" "color" "ffffff" "description" "This will not be worked on")
                  (dict "name" "agent-fix" "color" "0e8a16" "description" "Opt-in: this issue is fair game for the agent fixer")
                  (dict "name" "agent/queued" "color" "fbca04" "description" "Ready to dispatch a worker")
                  (dict "name" "agent/in-progress" "color" "1d76db" "description" "A worker pod is running this round")
                  (dict "name" "agent/review" "color" "5319e7" "description" "PR open, awaiting review (human or agent)")
                  (dict "name" "agent/blocked" "color" "b60205" "description" "Needs a human — budget escalate / max rounds / ambiguous")
                  (dict "name" "agent/done" "color" "0b6b3a" "description" "Merged")
                  (dict "name" "agent/error" "color" "b60205" "description" "Automation anomaly — circuit breaker; agents skip this item until a human clears it")
                  (dict "name" "agent/arbitrate" "color" "d93f0b" "description" "rounds exhausted / flip-flop — coordinator tie-break (merge-path escalation table)")
                  (dict "name" "agent-budget/xs" "color" "c5def5" "description" "Estimator cap-tier override: xs")
                  (dict "name" "agent-budget/sm" "color" "c5def5" "description" "Estimator cap-tier override: sm")
                  (dict "name" "agent-budget/md" "color" "c5def5" "description" "Estimator cap-tier override: md")
                  (dict "name" "agent-budget/lg" "color" "c5def5" "description" "Estimator cap-tier override: lg")
                  (dict "name" "task/fix" "color" "bfdadc" "description" "Fixer task class: fix a bug (default recipe .agents/fix.yaml) — FU-114 L3")
                  (dict "name" "task/build" "color" "bfdadc" "description" "Fixer task class: build a deliverable (recipe .agents/build.yaml) — FU-114 L3")
                  (dict "name" "task/goal" "color" "5319e7" "description" "Routes to the coordinator's goal-decompose play, not a worker recipe — FU-090 leg (c)")
                  (dict "name" "goal/post-launch" "color" "d4c5f9" "description" "Assembly merged — built as specified. MIDPOINT: goal stays OPEN, shipping to production (ADR-102)")
                  (dict "name" "goal/validated" "color" "0b6b3a" "description" "Verdict: production confirms the idea — goal closed met + close sweep (ADR-102; human-applied)")
                  (dict "name" "goal/reverted" "color" "d93f0b" "description" "Verdict: production refutes it — closed successfully-refuted, descendants close with it (ADR-102)")
                  (dict "name" "goal/abandoned" "color" "6a737d" "description" "Verdict: budget out before a verdict — closed not-planned, descendants left open but inert (ADR-102)")
                  (dict "name" "platform-request" "color" "1d76db" "description" "Capability-request lane (ADR-119): intent-level platform demand - pull-only, disposition always")
                  (dict "name" "merge-conflict" "color" "e11d21" "description" "PR branch conflicts with master — updater can't auto-resolve; needs a worker re-run or rebase")
                  (dict "name" "major" "color" "b60205" "description" "MAJOR dependency bump — human-gated, coordinator-owned (not the review reflex)")
                  (dict "name" "major/awaiting-human" "color" "d93f0b" "description" "Major bump: migration documented, CI green, reviewer-approved — a human merges")
                  (dict "name" "direction-change" "color" "b60205" "description" "Human reversed direction — sweep (re-scope/close+delete-branch) before any dispatch (C10)")
                  (dict "name" "dependencies" "color" "ededed" "description" "Dependency bump (Renovate)")
                  (dict "name" "automerge" "color" "ededed" "description" "Mechanical dep lane: CI-only approval, no LLM review")
                  (dict "name" "deps-review" "color" "ededed" "description" "Reviewable dep lane: armed + LLM-reviewed (FU-046)") }}
            ---
            # FU-080 loop-home: the stack's <stack>-agents namespace — where the per-stack
            # coordinator/reviewer will run, OUT of the project namespaces (the airlock's real
            # close). Today: namespace + identity only, nothing scheduled here yet; the
            # cross-ns RoleBindings below already let this SA dispatch workers into every fixer
            # ns of the stack — the namespaced replacement for the global coordinator's
            # cluster-scoped grant. Remaining legs (FU-080): cred ref-rail into this ns
            # (loop-git ExternalSecret; coordinator-claude needs NO rail — the opaque
            # `ref:agent-coordinator/coordinator-claude` resolves at the egress proxy from any
            # ns) + the per-stack coordinate/review CronWorkflows + session-script ns plumbing.
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $xr.metadata.name }}-agents
              labels:
                platform.teststuff.net/agentstack: {{ $xr.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $xr.metadata.name }}-loop-ns
                gotemplating.fn.crossplane.io/ready: "True"
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: agentstack-loop
              namespace: {{ $xr.metadata.name }}-agents
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $xr.metadata.name }}-loop-home-sa
                gotemplating.fn.crossplane.io/ready: "True"
            {{- if $xr.spec.slo }}
            {{- $slo := $xr.spec.slo }}
            {{- $sloStack := $xr.metadata.name }}
            ---
            # FU-104: the stack's SLO as claim policy — blackbox Probe (FU-099 exporter) on the
            # declared endpoint. Probe-content rule (meta-11): the endpoint must exercise the
            # deepest dependency path; a parent-process ping is not an SLO probe.
            apiVersion: monitoring.coreos.com/v1
            kind: Probe
            metadata:
              name: slo-{{ $sloStack }}
              namespace: monitoring
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $sloStack }}-slo-probe
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              jobName: slo-{{ $sloStack }}
              interval: 60s
              module: {{ default "http_2xx_lan" (get $slo "module") }}
              prober: { url: blackbox-exporter.monitoring.svc:9115 }
              targets:
                staticConfig:
                  static:
                    - {{ $slo.endpoint }}
            ---
            # FU-104: symptom alert (stack-labeled → the responder routes to THIS stack's -iac)
            # + the error-budget recording rule the review reflex queries for the TEETH (budget
            # burnt ⇒ the stack's auto-merge lane parks until it recovers).
            apiVersion: monitoring.coreos.com/v1
            kind: PrometheusRule
            metadata:
              name: slo-{{ $sloStack }}
              namespace: monitoring
              labels: { app: agentstack-slo }
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $sloStack }}-slo-rules
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              groups:
                - name: slo-{{ $sloStack }}
                  rules:
                    - record: stack:error_budget_burnt:bool
                      expr: ((1 - avg_over_time(probe_success{job="slo-{{ $sloStack }}"}[30d])) > (1 - {{ default 0.99 (get $slo "availability") }})) or vector(0)
                      labels:
                        stack: {{ $sloStack }}
                    # ⚠ RESTART-GAP BRIDGED (homelab#336). THE SECOND OF TWO COPIES — the first is
                    # in argocd/resources/blackbox/blackbox.yaml, which carries the whole argument
                    # (hole half only, `min_over_time` because low is bad, [5m] because #349's
                    # bound makes the class's [10m] page on a two-probe flake). Do not restate it
                    # here: this text is rendered into EVERY stack's manifest. Do not change one
                    # copy without the other either — they are one alert in two files, and
                    # blackbox/probes.promtool-test executes this one as a hand-rendered copy.
                    # This is the platform's templated lane: the edit changes what every
                    # AgentStack renders, not just oracle's.
                    - alert: EndpointProbeFailing
                      expr: min_over_time(probe_success{job="slo-{{ $sloStack }}"}[5m]) == 0
                      for: 10m
                      labels:
                        severity: warning
                        stack: {{ $sloStack }}
                      annotations:
                        summary: "Synthetic probe failing: {{ "{{" }} $labels.instance {{ "}}" }}"
                        description: "SLO endpoint has failed its blackbox probe for 10m. Symptom only. ⚠ homelab#336: the expr reads a 5m range, so this is at least one failure in every 5m window across those ten minutes and up to 5m may have passed since the last — check probe_success before concluding it is still down."
                    - alert: ErrorBudgetBurnt
                      expr: stack:error_budget_burnt:bool{stack="{{ $sloStack }}"} == 1
                      for: 30m
                      labels:
                        severity: warning
                        stack: {{ $sloStack }}
                        triage: none # self-describing policy state — the TEETH act on it (reflex parks the lane); a triage session would only restate it
                      annotations:
                        summary: "{{ $sloStack }} error budget burnt — auto-merge lane parked"
                        description: "30d availability is below the claim's target; the review reflex parks this stack's auto-merge lane (PRs wait for a human) until the budget recovers (FU-104)."
            {{- end }}
            {{- if and $xr.spec.responder (default false (get $xr.spec.responder "enabled")) }}
            {{- $resp := $xr.spec.responder }}
            {{- $stack := $xr.metadata.name }}
            {{- $loopns := printf "%s-agents" $stack }}
            ---
            # Responder remediation Role (FU-103 / goal#818) — the graduated imperative-remediation
            # dial. Renders ONLY when the claim carries responder.enabled: true (no XRD default on
            # the object: absent = nothing rendered, the responder stays breaker-gated). Grants
            # exactly the declared verb/resource pairs and no others, scoped to every namespace
            # the stack owns. Both the loop namespace and each fixer-enabled repo namespace get
            # a Role + RoleBinding, bound to the agentstack-loop SA (the responder's identity).
            # A consumer must be wired to read the grant and act on it — this PR ships NO consumer;
            # report-only remains the default posture (goal #818 §assembly).
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-responder
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-responder-role-loop
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
            {{- range $v := $resp.verbs }}
              - apiGroups: [""]
                resources: [{{ $v.resource | quote }}]
                verbs: [{{ $v.verb | quote }}]
            {{- end }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-responder
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-responder-rb-loop
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-responder }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $loopns }} }
            {{- range $r := $xr.spec.repos }}
            {{- if $r.fixer }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-responder
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-responder-role-{{ $r.name }}
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
            {{- range $v := $resp.verbs }}
              - apiGroups: [""]
                resources: [{{ $v.resource | quote }}]
                verbs: [{{ $v.verb | quote }}]
            {{- end }}
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-responder
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-responder-rb-{{ $r.name }}
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-responder }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $loopns }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $xr.spec.loop (get $xr.spec.loop "perStack") }}
            {{- $stack := $xr.metadata.name }}
            {{- $loopns := printf "%s-agents" $stack }}
            ---
            # FU-080 loop-token legs (perStack): minted CENTRALLY in agent-coordinator (the App
            # private keys never enter a stack-reachable namespace — deliberately NOT the per-repo
            # agents-github-app pattern) and served ONLY by the egress proxy's TokenReview-gated
            # /loop-git-token. No Secret ever sits in {{ $loopns }}.
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: GithubAccessToken
            metadata:
              name: loop-git-{{ $stack }}-gen
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-git-gen
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              appID: "4150968"       # homelab-agents App (org constants; repositories does the scoping)
              installID: "142724430"
              auth:
                privateKey:
                  secretRef: { name: agents-github-app, key: privateKey }
              permissions:           # the coordinator set (mirror agents/coordinator/git-token.yaml)
                contents: write
                pull_requests: write
                issues: write
                checks: read
                statuses: read
                # WRITE since 2026-08-09 (the FU-148 grant, extended to the per-stack loop): the
                # ci-red/arbitrate play's retry terminal is `gh run rerun --failed`, and the
                # coordinate pods mint THIS token — a 403 here wedged oracle PR#234 into a 5x
                # arbitrate re-fire loop (the App-level grant existed; this mint site still
                # downscoped to read). Workers keep no Actions verb — this block is loop-git only.
                actions: write
              repositories:
                {{- range $rr := $xr.spec.repos }}
                - {{ $rr.name }}
                {{- end }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: loop-git-{{ $stack }}
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-git-es
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              refreshInterval: 45m
              target:
                name: loop-git-{{ $stack }}
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  metadata:
                    labels:
                      homelab.teststuff.net/loop-git-token: "true"
                      platform.teststuff.net/loop-ns: {{ $loopns }}
                  data:
                    GH_TOKEN: {{ `'{{ .token }}'` }}
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: GithubAccessToken
                      name: loop-git-{{ $stack }}-gen
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: GithubAccessToken
            metadata:
              name: loop-reviewer-git-{{ $stack }}-gen
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-reviewer-git-gen
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              appID: "4199252"       # homelab-reviewer App — DISTINCT identity, self-approval stays blocked
              installID: "143941082"
              auth:
                privateKey:
                  secretRef: { name: reviewer-github-app, key: privateKey }
              permissions:           # the reviewer set (mirror agents/coordinator/reviewer-git.yaml)
                contents: write
                pull_requests: write
                issues: read    # resolve the issue a PR claims to fix + the depth-rule parent walk — the mint omitted it while the App grant existed, homelab#1038 (4 false scope-authorization blocks on sleep-tracking#137)
                checks: read
                statuses: read
                actions: read   # the reviewer never reruns workflows — the FU-148 write is COORDINATOR-only (the 2026-08-09 flip here was wrong; github-apps-lint caught it on PR#199)
              repositories:
                {{- range $rr := $xr.spec.repos }}
                - {{ $rr.name }}
                {{- end }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: loop-reviewer-git-{{ $stack }}
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-reviewer-git-es
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              refreshInterval: 45m
              target:
                name: loop-reviewer-git-{{ $stack }}
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  metadata:
                    labels:
                      homelab.teststuff.net/loop-git-token: "true"
                      platform.teststuff.net/loop-ns: {{ $loopns }}
                  data:
                    GH_TOKEN: {{ `'{{ .token }}'` }}
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: GithubAccessToken
                      name: loop-reviewer-git-{{ $stack }}-gen
            ---
            # THE one documented Secret exception in {{ $loopns }}: the WRITE-ONLY transcripts S3
            # key (append-to-bucket only — a leak cannot cross the stack boundary; git/subscription
            # creds stay ref/broker-only). Same rail as the fixer namespaces.
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: agent-transcripts-s3
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-transcripts-es
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: agent-transcripts, kind: ClusterSecretStore }
              target:
                name: agent-transcripts-s3
                creationPolicy: Owner
              data:
                - secretKey: writer_access_key_id
                  remoteRef: { key: agent-transcripts-s3, property: writer_access_key_id }
                - secretKey: writer_secret_access_key
                  remoteRef: { key: agent-transcripts-s3, property: writer_secret_access_key }
            ---
            # Loop transcripts PVC (the coordinator-transcripts mirror — tick pods hard-require it).
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: coordinator-transcripts
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-transcripts-pvc
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              accessModes: [ReadWriteMany]
              # FU-132: repl=1 by class, so a new stack cannot re-arm the homelab#94 wedge (a
              # 2-replica volume with one schedulable `std` disk never places, and the tick hangs on
              # the attach). Safe because the record is Garage, not this volume — the session exit
              # trap uploads every file. storageClassName is IMMUTABLE: an existing PVC must be
              # deleted to move, which is why this is worth getting right at scaffold time.
              storageClassName: longhorn-single
              resources:
                requests:
                  storage: 2Gi
            ---
            # FU-140 crash-net for the PVC above: the nightly sweep that covers what the exit trap
            # never saw. The tick/item pods write their Claude JSONL onto coordinator-transcripts
            # (coordinator-session.sh mounts it at ~/.claude/projects) and the launcher's exit trap
            # uploads the session's files at the end — so a tick that dies BEFORE the trap (OOM
            # kill, node reboot, activeDeadlineSeconds) leaves the ONLY copy of its transcript on
            # this volume, and for an exec-run session that transcript IS the log. agent-coordinator
            # has had this net since §A1 (agents/coordinator/transcripts-sync.yaml); the four
            # <stack>-agents PVCs had nothing. This is that job, rendered per loop ns.
            #
            # ⚠ WHY IT IS NOT A COPY OF THAT JOB: the loop-ns S3 key is WRITE-ONLY (the
            # ExternalSecret above mirrors writer_* only — that a leak here cannot READ the bucket
            # is what makes the one Secret exception in this namespace acceptable). So there is no
            # list-then-diff, and `s5cmd sync` is out too because sync LISTS the destination. Two
            # things stand in for the read the coordinator's copy does:
            #   1. the S3 key carries the file's MTIME, so re-uploading a file writes the SAME
            #      path — the PUT is idempotent, never a second copy; and
            #   2. a marker file per (basename, mtime) on the PVC skips the re-upload entirely.
            # (2) is the optimisation, (1) is the correctness: if the marker dir is unwritable the
            # job says so and degrades to unconditional PUT rather than silently skipping work.
            #
            # Key layout stays in the exit trap's family (<mainRepo>/_ticks/coordinator-r1-…) so a
            # recovered file joins the SAME viewer group as trap-uploaded ones — the FU-061 sync
            # keys on the manifest's project+task and writes by basename, so a file the trap also
            # got resolves to one entry instead of forking a second tree. Files younger than 60min
            # are left alone: that is a live session whose trap has not run yet, and the trap is the
            # better record (it knows model/pod/task attribution this job cannot recover).
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: transcripts-crashnet
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-transcripts-crashnet
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              # Nightly, offset from the agent-coordinator sweep (40 3) and the janitor tick (47 5).
              schedule: "23 4 * * *"
              concurrencyPolicy: Forbid
              startingDeadlineSeconds: 3600
              successfulJobsHistoryLimit: 1
              failedJobsHistoryLimit: 3
              jobTemplate:
                spec:
                  backoffLimit: 1
                  activeDeadlineSeconds: 900
                  template:
                    metadata:
                      labels: { app: transcripts-crashnet }
                    spec:
                      restartPolicy: Never
                      terminationGracePeriodSeconds: 5
                      # No apiserver call in this job — the only credentials it needs are the two
                      # writer keys below.
                      automountServiceAccountToken: false
                      securityContext:
                        fsGroup: 1000
                      containers:
                        - name: crashnet
                          # The coordinator image (bash + jq + s5cmd), same pin as the loop
                          # CronWorkflows above — the deploy-pin sweep bumps them together.
                          image: ghcr.io/teststuffstash/agent-coordinator:2026.8.7-gd6dc9ced82f2
                          command: ["bash", "-lc"]
                          args:
                            - |
                              set -u
                              command -v s5cmd >/dev/null 2>&1 || { echo "FATAL: s5cmd not in this image — bump AGENT_COORDINATOR_IMAGE"; exit 1; }
                              export AWS_ACCESS_KEY_ID="$WRITER_ID" AWS_SECRET_ACCESS_KEY="$WRITER_SECRET" AWS_REGION=garage
                              MARKS=/transcripts/.crashnet
                              if mkdir -p "$MARKS" 2>/dev/null; then
                                USE_MARKS=1
                              else
                                USE_MARKS=0
                                echo "WARN: $MARKS not writable — no skip rail this run; every file is re-PUT to its"
                                echo "  mtime-derived path (idempotent, so correct — just more bytes than needed)."
                              fi
                              N=0 SKIP=0 FAIL=0
                              while read -r f; do
                                [ -n "$f" ] || continue
                                B=$(basename "$f")
                                MT=$(date -u -r "$f" +%Y%m%dT%H%M%SZ)
                                M="$MARKS/${B%.jsonl}.${MT}"
                                if [ "$USE_MARKS" = 1 ] && [ -e "$M" ]; then SKIP=$((SKIP+1)); continue; fi
                                # Same tree as the trap; -crashnet-<8> keeps two same-mtime files
                                # from sharing a run dir (and so a manifest).
                                P="s3://agent-transcripts/${MAIN_REPO}/_ticks/coordinator-r1-${MT}-crashnet-$(printf %s "$B" | cut -c1-8)"
                                jq -n --arg project "$MAIN_REPO" --arg stack "$STACK" --arg f "$B" --arg mt "$MT" \
                                  '{role:"coordinator", project:$project, task:"_ticks", stack:$stack, round:1,
                                    source:"pvc-crashnet", session_key:"claude-session", mtime:$mt, files:[$f]}' > /tmp/manifest.json
                                if s5cmd --endpoint-url "$AGENT_TS_ENDPOINT" cp "$f" "${P}/${B}"; then
                                  s5cmd --endpoint-url "$AGENT_TS_ENDPOINT" cp /tmp/manifest.json "${P}/manifest.json" \
                                    || echo "manifest upload FAILED for ${B} (the jsonl landed; the viewer will not group it)"
                                  if [ "$USE_MARKS" = 1 ]; then : > "$M" || echo "marker write FAILED for ${B} — it re-uploads next run"; fi
                                  echo "crash-net: ${B} → ${P}/"
                                  N=$((N+1))
                                else
                                  echo "upload FAILED: $f"
                                  FAIL=$((FAIL+1))
                                fi
                              done < <(find /transcripts -name '*.jsonl' -mmin +60 2>/dev/null)
                              echo "transcripts-crashnet: ${N} uploaded, ${SKIP} already marked, ${FAIL} failed"
                              # Fail the Job on a real upload failure — a crash-net that reports
                              # green while dropping files is the FU-125 class this repo keeps paying for.
                              [ "$FAIL" = 0 ]
                          env:
                            - { name: HOME, value: "/home/node" }
                            - { name: AGENT_TS_ENDPOINT, value: "http://garage.garage.svc.cluster.local:3900" }
                            - { name: MAIN_REPO, value: {{ $xr.spec.mainRepo | quote }} }
                            - { name: STACK, value: {{ $stack | quote }} }
                            # WRITE-ONLY pair — there is no reader key in this namespace, by design.
                            # Not optional: the pod parks in CreateContainerConfigError until ESO has
                            # reconciled the Secret (same pattern as the coordinator's sweep).
                            - name: WRITER_ID
                              valueFrom:
                                secretKeyRef: { name: agent-transcripts-s3, key: writer_access_key_id }
                            - name: WRITER_SECRET
                              valueFrom:
                                secretKeyRef: { name: agent-transcripts-s3, key: writer_secret_access_key }
                          volumeMounts:
                            # READ-WRITE, unlike the coordinator's copy: the marker rail is the
                            # write-only key's substitute for listing the bucket, and it lives here.
                            # Markers go in a dot-dir the `find` above never matches.
                            - { name: transcripts, mountPath: /transcripts }
                          securityContext:
                            runAsNonRoot: true
                            runAsUser: 1000
                            runAsGroup: 1000
                            allowPrivilegeEscalation: false
                            capabilities: { drop: ["ALL"] }
                            seccompProfile: { type: RuntimeDefault }
                          resources:
                            requests: { cpu: "50m", memory: "128Mi" }
                            limits:   { cpu: "1",   memory: "512Mi" }
                      volumes:
                        - name: transcripts
                          persistentVolumeClaim: { claimName: coordinator-transcripts }
            ---
            # Launch RBAC IN the loop home itself — the item/tick coordinator pods run here
            # (found live on the first dispatching tick: the SA could reach the fixer namespaces
            # but not its own).
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-loop-home
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-home-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [""]
                resources: [pods, pods/log]
                verbs: [get, list, watch, create, delete]
              - apiGroups: [""]
                resources: [pods/exec]
                verbs: [create]
              - apiGroups: [""]
                resources: [persistentvolumeclaims]
                verbs: [get, list]
              - apiGroups: [openrouter.teststuff.net]
                resources: [openrouterkeys, openrouterkeys/status]
                verbs: [get, list, watch, create, update, patch, delete]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-loop-home
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-home-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-loop-home }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $loopns }} }
            ---
            # Claims read for the loop SA (the stack-list/knob source of truth — without it the
            # per-stack scan PROBE-FAILS onto the stacks.json belt; seen live on the first tick).
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: agentstack-loop-claims-read-{{ $stack }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-claims-crb
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agentstack-claims-read }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $loopns }} }
            ---
            # Argo workflow execution RBAC in the loop home (the argo-workflows-workflow mirror).
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-loop-workflow
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-wf-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [argoproj.io]
                resources: [workflowtaskresults]
                verbs: [create, patch]
              # ADR-106 (5) + FU-160: the per-stack scan reads its own Workflow (wake source +
              # ring epoch — this read had been silently failing fail-open, no grant existed)
              # and absorbs PENDING sibling `coordinate*` rings at scan start (the collapse).
              - apiGroups: [argoproj.io]
                resources: [workflows]
                verbs: [get, list, delete]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-loop-workflow
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-wf-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-loop-workflow }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $loopns }} }
            ---
            # The stack's OWN coordinate backstop (FU-080 endgame shape): scan scoped to this
            # stack (SCAN_STACK), running in {{ $loopns }} as agentstack-loop, git creds fetched
            # per-op from the proxy (TokenReview) — zero Secrets in this namespace. This cron IS
            # the level-triggered failure detector for the stack (ADR-120: the global
            # coordinator-reflex retired 2026-08-31 — the global surface is the SWITCHBOARD,
            # Sensor-edge-only resolver; an UNGRADUATED stack therefore has NO scan path until
            # loop.perStack/graduated flip — the switchboard warns per ring). The doorbell edge
            # routes here (the global `coordinator` Sensor inlines a per-stack Workflow from the
            # emitter body — see coordinate-argo.yaml §per-stack routing).
            apiVersion: argoproj.io/v1alpha1
            kind: CronWorkflow
            metadata:
              name: coordinate-{{ $stack }}
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-cron
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              schedules:
                # FU-086(2) 2026-08-02: */10 → */30. The doorbell edge (worker-exit /coordinate)
                # + the exporter's event edges are the PRIMARY triggers — proven through meta-9/10
                # and the 2026-08-02 sessions (every dispatch this week rode an edge or a tick that
                # an edge would also have covered). The cron is the level-triggered backstop; at
                # */30 a fully-missed edge still bounds staleness at 30min.
                - "*/30 * * * *"
              concurrencyPolicy: Forbid
              startingDeadlineSeconds: 60
              workflowSpec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 1800
                ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
                # homelab#103 soft hostname spread — canonical copy + rationale on the `coordinate`
                # WorkflowTemplate (agents/coordinator/coordinate-argo.yaml); mirrored here 2026-08-12
                # (the #103 residual leg) so per-stack loop pods spread like the platform's own.
                podSpecPatch: |
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchExpressions:
                          - { key: workflows.argoproj.io/workflow, operator: Exists }
                # Serialize the */10 cron tick against the doorbell edge's inline Workflow (both
                # take this namespaced mutex) so a graduated stack can't double-scan itself. A
                # no-op for a non-graduated stack (the cron is the sole contender). Per-stack
                # capacity stays subscription-latch only (FU-080 (5): ConfigMap semaphores can't cross ns).
                synchronization:
                  mutexes:
                    - name: coordinator-scan
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator:2026.8.7-gd6dc9ced82f2
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                          GH_TOKEN="$(curl -fsS -H "Authorization: Bearer ${SA_TOKEN}" \
                            "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/loop-git-token?ns={{ $loopns }}&role=coordinator")" \
                            || { echo "FATAL: loop-git token fetch refused/failed — not scanning blind"; exit 1; }
                          export GH_TOKEN
                          rm -rf /work/homelab
                          timeout 120 git clone --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab || { echo "FATAL: homelab clone timed out/failed — not running blind (homelab#134)"; exit 1; }
                          export SCAN_STACK={{ $stack }} LOOP_NS={{ $loopns }}
                          exec bash /work/homelab/agents/coordinator-scan.sh --spawn
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: ORG, value: "teststuffstash" }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "512Mi" }
            {{- if get $xr.spec.loop "graduated" }}
            ---
            # FU-080 per-stack REVIEW backstop: the stack's OWN review reflex — SCAN_STACK-scoped, dispatching
            # reviewer pods INTO {{ $loopns }} as agentstack-loop (reviewer-session.sh --loop-ns; the
            # review-bot token fetched per-run from the broker role=reviewer). Mirrors the global review
            # cron but per-stack; the polling token is broker role=coordinator (read). The GLOBAL review
            # reflex SKIPS graduated stacks (review-reflex.sh) so exactly one reflex reviews this stack.
            apiVersion: argoproj.io/v1alpha1
            kind: CronWorkflow
            metadata:
              name: review-{{ $stack }}
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-review-cron
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              schedules:
                - "*/15 * * * *"
              concurrencyPolicy: Forbid
              startingDeadlineSeconds: 60
              workflowSpec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 1800
                ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
                # homelab#103 soft hostname spread — canonical copy + rationale on the `coordinate`
                # WorkflowTemplate (agents/coordinator/coordinate-argo.yaml); mirrored here 2026-08-12
                # (the #103 residual leg) so per-stack loop pods spread like the platform's own.
                podSpecPatch: |
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchExpressions:
                          - { key: workflows.argoproj.io/workflow, operator: Exists }
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator:2026.8.7-gd6dc9ced82f2
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          export GH_TOKEN="$(curl -fsS -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                            "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/loop-git-token?ns={{ $loopns }}&role=coordinator")" \
                            || { echo "FATAL: loop-git token fetch refused/failed — not polling blind"; exit 1; }
                          rm -rf /work/homelab
                          timeout 120 git clone --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab || { echo "FATAL: homelab clone timed out/failed — not running blind (homelab#134)"; exit 1; }
                          export SCAN_STACK={{ $stack }}
                          exec bash /work/homelab/agents/review-reflex.sh
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: ORG, value: "teststuffstash" }
                        # reviewer.goalModel → the ASSEMBLY review's model (head goal/**, the
                        # goal→master shape) — review-reflex.sh routes on it; all other PRs
                        # keep the reviewer default. Claim-owned; see model-routing.md §M10.
                        - { name: REVIEW_GOAL_MODEL, value: {{ default "sonnet" (get (default dict (get $xr.spec "reviewer")) "goalModel") | quote }} }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "512Mi" }
            ---
            # FU-086(4) janitor tick: the ~daily REPORT-ONLY judgment sweep (ADR-094 (4) — the
            # board-level breadth the deterministic scan clauses can't have; brief in the
            # coordinator README §The janitor tick). Same scan entrypoint with SCAN_JANITOR=1:
            # the scan prints its report, then spawns ONE report-only session for the stack
            # (capacity-latched; dispatches nothing; only write = inert spec-gap drafts under
            # breaker #1). Shares the coordinator-scan mutex so it never overlaps a real tick.
            apiVersion: argoproj.io/v1alpha1
            kind: CronWorkflow
            metadata:
              name: janitor-{{ $stack }}
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-janitor-cron
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              schedules:
                - "47 5 * * *"
              concurrencyPolicy: Forbid
              startingDeadlineSeconds: 3600
              workflowSpec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 3600
                ttlStrategy: { secondsAfterCompletion: 21600, secondsAfterFailure: 86400 }
                # homelab#103 soft hostname spread — canonical copy + rationale on the `coordinate`
                # WorkflowTemplate (agents/coordinator/coordinate-argo.yaml); mirrored here 2026-08-12
                # (the #103 residual leg) so per-stack loop pods spread like the platform's own.
                podSpecPatch: |
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchExpressions:
                          - { key: workflows.argoproj.io/workflow, operator: Exists }
                synchronization:
                  mutexes:
                    - name: coordinator-scan
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator:2026.8.7-gd6dc9ced82f2
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                          GH_TOKEN="$(curl -fsS -H "Authorization: Bearer ${SA_TOKEN}" \
                            "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/loop-git-token?ns={{ $loopns }}&role=coordinator")" \
                            || { echo "FATAL: loop-git token fetch refused/failed — not sweeping blind"; exit 1; }
                          export GH_TOKEN
                          rm -rf /work/homelab
                          timeout 120 git clone --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab || { echo "FATAL: homelab clone timed out/failed — not running blind (homelab#134)"; exit 1; }
                          export SCAN_STACK={{ $stack }} LOOP_NS={{ $loopns }} SCAN_JANITOR=1
                          exec bash /work/homelab/agents/coordinator-scan.sh --spawn
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: ORG, value: "teststuffstash" }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "512Mi" }
            {{- end }}
            ---
            # FU-080 doorbell RBAC: let the GLOBAL `coordinator` Sensor (sensor-review SA in
            # agent-coordinator) SUBMIT a per-stack coordinate Workflow into {{ $loopns }} when a
            # graduated repo's edge fires. A per-stack Sensor is impossible without a per-stack
            # EventBus (Argo Events buses are namespaced — decision (4) rejected 3×1Gi JetStreams),
            # so the platform Sensor reaches in (platform→stack direction, airlock-aligned). Inert
            # until the routing trigger in coordinate-argo.yaml targets this ns.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: sensor-submit-coordinate
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-sensor-submit-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [argoproj.io]
                resources: [workflows]
                verbs: [create, get, list, watch]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: sensor-submit-coordinate
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-sensor-submit-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sensor-submit-coordinate }
            subjects:
              - { kind: ServiceAccount, name: sensor-review, namespace: agent-coordinator }
            ---
            # FU-020/ADR-081 loop-ns egress (FU-080 loop-home). Selector hits Argo Workflow pods
            # (coordinator, reviewer, prober) via the built-in workflows.argoproj.io/workflow label.
            # MONITOR phase: rules attach (DNS visibility for the Hubble harvest) but the default
            # deny does not. Flip to enforce after clean harvested rides (Goal #1162 acceptance 3).
            apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: agent-loop-egress
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-egress-cnp
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              endpointSelector:
                matchExpressions:
                  - { key: workflows.argoproj.io/workflow, operator: Exists }
              enableDefaultDeny:
                egress: false
              egress:
                # Kubernetes API — loop pods kubectl read (agent-read-infra/agent-read-app RBAC)
                - toEntities:
                    - kube-apiserver
                  toPorts:
                    - ports:
                        - { port: "6443", protocol: TCP }
                        - { port: "443", protocol: TCP }
                # DNS
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: kube-system
                        k8s-app: kube-dns
                  toPorts:
                    - ports:
                        - { port: "53", protocol: UDP }
                        - { port: "53", protocol: TCP }
                      rules:
                        dns:
                          - matchPattern: "*"
                # Registry mirrors — BASELINE (read-only pull-through caches, ADR-091)
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: registry-cache
                - toCIDR:
                    - 192.168.40.20/32 # docker.io mirror VIP
                    - 192.168.40.21/32 # ghcr mirror VIP
                    - 192.168.40.31/32 # mcr.microsoft.com mirror VIP
                  toPorts:
                    - ports:
                        - { port: "80", protocol: TCP }
                # Egress proxy + git-cred broker — the ONLY LLM/credential exit
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: agent-egress
                # nix-cache — devbox installs
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: nix-cache
                # devbox-search — devbox add resolves
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: devbox-search
                # garage — transcript uploads (agent-finalize)
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: garage
                # monitoring/pushgateway — run metrics (FU-057)
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: monitoring
                # Baseline FQDNs — git over TLS + nix upstream fallback
                - toFQDNs:
                    - { matchName: github.com }
                    - { matchName: api.github.com }
                    - { matchName: codeload.github.com }
                    - { matchPattern: "*.githubusercontent.com" }
                    - { matchName: cache.nixos.org }
                  toPorts:
                    - ports:
                        - { port: "443", protocol: TCP }
            {{- if and $xr.spec.prober (default false (get $xr.spec.prober "enabled")) }}
            {{- $pr := $xr.spec.prober }}
            ---
            # FU-102 prober (the agentic canary) — scheduled leg, stage 1. DISABLED unless the
            # claim carries prober.enabled (no XRD default on the object: an omitted defaulted
            # object is API-server-stamped and OutOfSyncs every claim — the 2026-07-16 lesson).
            # SUBSCRIPTION rail by operator direction 2026-08-07 (platform roles ride the
            # subscription): claude/<model, default haiku> via ref:<loopns>/claude-session — the
            # ES below renders it into the loop ns. REPORT-ONLY BY CONSTRUCTION: the pod holds no
            # git/gh credential at all, so the session can read prod and write nothing; 🌱 issue
            # filing is flip-time work once a brief exists (roles.md §prober). The brief lives at
            # .agents/probe.md in mainRepo — LOCATION is the only contract; content shape waits
            # for a second stack's probe (the ≥2-projects rule). Missing brief = loud no-op.
            # The post-deploy edge (sync-succeeded doorbell) is FU-102's remaining machinery.
            apiVersion: argoproj.io/v1alpha1
            kind: CronWorkflow
            metadata:
              name: probe-{{ $stack }}
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-probe-cron
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              schedules:
                - {{ default "41 */6 * * *" (get $pr "schedule") | quote }}
              concurrencyPolicy: Forbid
              startingDeadlineSeconds: 300
              workflowSpec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 1800
                ttlStrategy: { secondsAfterCompletion: 86400, secondsAfterFailure: 172800 }
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator:2026.8.7-gd6dc9ced82f2
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          rm -rf /work/homelab /work/main
                          timeout 120 git clone --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab || { echo "FATAL: homelab clone timed out/failed — not running blind (homelab#134)"; exit 1; }
                          if ! SUBSCRIPTION_TIER=dispatch bash /work/homelab/agents/subscription-latch.sh; then
                            echo "probe DEFERRED — subscription limited (FU-088); next cron tick retries"; exit 0
                          fi
                          git clone --depth 1 https://github.com/teststuffstash/{{ $xr.spec.mainRepo }}.git /work/main
                          if [ ! -f /work/main/.agents/probe.md ]; then
                            echo "NO PROBE BRIEF: {{ $xr.spec.mainRepo }}/.agents/probe.md does not exist — the prober is enabled but has nothing to run. Write the brief (roles.md §prober; oracle UC-1 probe-e2e is the donor shape)."; exit 0
                          fi
                          # Run the probe session, capturing the full report
                          CLAUDE_EXIT=0
                          claude -p "You are the PROBER for stack {{ $stack }} (homelab docs/agents/roles.md §prober): an agentic canary probing the LIVE product contract, prod-READ and report-only. Your brief follows between the BEGIN/END markers. You hold NO git or GitHub credentials by construction — your entire output is this session's stdout report: state what you probed, what answered correctly, and what broke, with evidence. Never mutate anything.
                          ----BEGIN BRIEF----
                          $(cat /work/main/.agents/probe.md)
                          ----END BRIEF----" \
                            --model "$PROBE_MODEL" --permission-mode bypassPermissions --max-turns 30 </dev/null \
                            > /work/report.md 2>&1 || CLAUDE_EXIT=$?
                          cat /work/report.md
                          if [ "$CLAUDE_EXIT" -ne 0 ]; then
                            echo "WARN: probe session failed (exit $CLAUDE_EXIT) — the contract state is UNKNOWN, not good (next tick retries)"
                          fi
                          # Upload the report to S3 for durable storage (homelab#1275)
                          command -v s5cmd >/dev/null 2>&1 || { echo "FATAL: s5cmd not in this image — cannot upload probe report"; exit 1; }
                          export AWS_ACCESS_KEY_ID="$WRITER_ID" AWS_SECRET_ACCESS_KEY="$WRITER_SECRET" AWS_REGION=garage
                          TS=$(date -u +%Y%m%dT%H%M%SZ)
                          DEST="s3://agent-transcripts/{{ $stack }}/probe/${TS}/report.md"
                          if s5cmd --endpoint-url "$AGENT_TS_ENDPOINT" cp /work/report.md "$DEST"; then
                            echo "probe report uploaded: ${DEST}"
                          else
                            echo "FATAL: probe report upload FAILED — the report is the product (homelab#1275)"
                            exit 1
                          fi
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: PROBE_MODEL, value: {{ default "haiku" (get $pr "model") | quote }} }
                        - { name: ANTHROPIC_BASE_URL, value: "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/anthropic" }
                        - { name: ANTHROPIC_AUTH_TOKEN, value: "ref:{{ $loopns }}/claude-session" }
                        - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
                        - { name: AGENT_TS_ENDPOINT, value: "http://garage.garage.svc.cluster.local:3900" }
                        - name: WRITER_ID
                          valueFrom:
                            secretKeyRef: { name: agent-transcripts-s3, key: writer_access_key_id }
                        - name: WRITER_SECRET
                          valueFrom:
                            secretKeyRef: { name: agent-transcripts-s3, key: writer_secret_access_key }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "1Gi" }
            ---
            # The probe session's subscription rail: claude-session in the LOOP ns (the per-repo
            # copies render off fixer.claudeTier; the prober is stack-scoped, so it gets its own).
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: claude-session
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-claude-session-es
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: infisical, kind: ClusterSecretStore }
              target:
                name: claude-session
                creationPolicy: Owner
                template:
                  metadata:
                    labels:
                      openrouter.teststuff.net/session-key: "true"
              data:
                - secretKey: AUTH_TOKEN
                  remoteRef: { key: COORDINATOR_CLAUDE_OAUTH_TOKEN }
            ---
            # ADR-087 leg A (loop-ns variant): the egress proxy resolves ref:<loopns>/<secret> by
            # reading LABELED session Secrets here. Same Role+RoleBinding as the fixer-ns variant
            # below, but rendered into {{ $loopns }} so the prober's ref:{{ $loopns }}/claude-session
            # resolves (homelab#1085 — the fixer-ns variant never renders into the loop ns).
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-proxy-session-keys
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-proxy-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [""]
                resources: [secrets]
                verbs: [get]
              # FU-138: the proxy reads the OpenRouterKey CR that OWNS a session Secret, because
              # the CR (rendered from this claim) is the authoritative guardrail — the Secret's
              # GUARDRAIL is only written when the operator mints, so it goes stale silently.
              # list-only, namespaced: a CR spec carries budget/guardrail, never the key itself.
              - apiGroups: [openrouter.teststuff.net]
                resources: [openrouterkeys]
                verbs: [list]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-proxy-session-keys
              namespace: {{ $loopns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $stack }}-loop-proxy-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-proxy-session-keys }
            subjects:
              - { kind: ServiceAccount, name: openrouter-proxy, namespace: agent-egress }
            {{- end }}
            {{- end }}
            {{- range $r := $xr.spec.repos }}
            {{- if $r.storage }}
            ---
            # ADR-089 quota-as-contract: the claim's per-tier caps become a ResourceQuota, so an
            # over-cap PVC fails at CREATE with a legible error (instead of wedging unschedulable
            # in Longhorn). Per-StorageClass quota counts PVCs by their RESOLVED class, so
            # default-class PVCs are counted under `longhorn` too.
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: agentstack-storage
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-storage-quota
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              hard:
                longhorn.storageclass.storage.k8s.io/requests.storage: {{ default "0" (get $r.storage "standard") | quote }}
                longhorn-bulk.storageclass.storage.k8s.io/requests.storage: {{ default "0" (get $r.storage "bulk") | quote }}
                longhorn-fast.storageclass.storage.k8s.io/requests.storage: {{ default "0" (get $r.storage "fast") | quote }}
                longhorn-scratch.storageclass.storage.k8s.io/requests.storage: {{ default "0" (get $r.storage "scratch") | quote }}
            {{- end }}
            {{- if $r.labels }}
            ---
            # FU-068 (Issues tier): the repo's AUTHORITATIVE label set — platform taxonomy + the
            # claim's labels.extra. Any label outside this list is DELETED on sync (that is the
            # point: label truth lives here, not in hand-driven tofu). external-name = the repo,
            # so the provider adopts the live set instead of erroring on "exists".
            apiVersion: repo.github.upbound.io/v1alpha1
            kind: IssueLabels
            metadata:
              name: {{ $r.name }}-labels
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-issue-labels
                crossplane.io/external-name: {{ $r.name }}
            spec:
              providerConfigRef:
                name: github-labels
              forProvider:
                repository: {{ $r.name }}
                label:
                  {{- range $l := concat $platformLabels (default (list) (get $r.labels "extra")) }}
                  - name: {{ get $l "name" | quote }}
                    color: {{ get $l "color" | quote }}
                    {{- if get $l "description" }}
                    description: {{ get $l "description" | quote }}
                    {{- end }}
                  {{- end }}
            {{- end }}
            {{- if $r.fixer }}
            {{- $fx := $r.fixer }}
            {{- /* nested schema defaults only apply when the parent key exists — re-default here */}}
            {{- $eg := default (dict) $fx.egress }}
            {{- $profile := default "none" (get $eg "profile") }}
            {{- $extra := default (list) (get $eg "extraFQDNs") }}
            {{- $enforce := default false (get $eg "enforce") }}
            {{- $docker := default false (get $fx "docker") }}
            {{- $mcp := $xr.spec.mcp }}
            ---
            # Transcript-capture WRITE-ONLY S3 key, mirrored in-namespace (FU-080 a): worker pods
            # secretKeyRef it locally, so no launcher reads key material and no cross-namespace
            # exception is needed. Source of truth stays the Crossplane-terraform-minted Secret in
            # agent-coordinator (transcripts-store.yaml holds the mirror store).
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: agent-transcripts-s3
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-transcripts-es
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: agent-transcripts, kind: ClusterSecretStore }
              target:
                name: agent-transcripts-s3
                creationPolicy: Owner
              data:
                - secretKey: writer_access_key_id
                  remoteRef: { key: agent-transcripts-s3, property: writer_access_key_id }
                - secretKey: writer_secret_access_key
                  remoteRef: { key: agent-transcripts-s3, property: writer_secret_access_key }
            ---
            # FU-089: the worker git token is minted CENTRALLY in agent-coordinator (the FU-080
            # loop-token pattern) — the App PRIVATE KEY never enters a stack-reachable namespace,
            # where the namespace-admin workbench SA could read it and mint cross-stack tokens.
            # The key Secret `agents-github-app` in agent-coordinator is the hand-applied
            # agents/coordinator/git-token.yaml one; the proxy serves this token to worker pods
            # via /git-token (label-checked, ns bound by platform.teststuff.net/worker-ns).
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: GithubAccessToken
            metadata:
              name: agent-git-{{ $r.name }}-gen
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-central-git-gen
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              appID: "4150968"
              installID: "142724430"
              auth:
                privateKey:
                  secretRef: { name: agents-github-app, key: privateKey }
              permissions:
                contents: write
                pull_requests: write
                issues: write # fixer reads the issue; agent-finalize posts strike/stats IN-POD (FU-064/043)
                workflows: write # fleet#134: track/chassis issues may edit .github/workflows/ci.yaml (App grant 2026-07-26, github-apps.yaml)
              repositories:
                - {{ $r.name }}
            ---
            # Drive the generator → the Secret the broker serves (key: token). refresh < the ~1h TTL.
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: agent-git-{{ $r.name }}
              namespace: agent-coordinator
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-central-git-es
            spec:
              refreshInterval: 45m
              target:
                name: agent-git-{{ $r.name }}
                creationPolicy: Owner
                template:
                  metadata:
                    labels:
                      # ADR-087 leg B: proxy /git-token serves this to worker pods (label-checked).
                      homelab.teststuff.net/agent-git-token: "true"
                      platform.teststuff.net/worker-ns: {{ $r.name }}
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: GithubAccessToken
                      name: agent-git-{{ $r.name }}-gen
            ---
            # FU-089: the worker pod's identity for the proxy's TokenReview on /git-token.
            # No RBAC grants — the SA exists purely so a worker can PROVE "I am a worker pod in
            # <ns>" with its projected token (mandatory verification once agent-runtime's
            # credential helper sends it).
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: agentstack-worker
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-worker-sa
                gotemplating.fn.crossplane.io/ready: "True"
            {{- if default false (get $fx "claudeTier") }}
            ---
            # FU-066 leg (a): the claude-tier session secret — the subscription oauth token,
            # Infisical → Secret, session-key-labeled so the egress proxy's /anthropic upstream
            # resolves ref:<ns>/claude-session and injects it (ADR-087 leg A; the pod never holds
            # the token). Replaced the operator-imperative `kubectl create secret` (oracle-fleet
            # was the only one) — observed on the 2026-07-16 cutover: ESO creationPolicy Owner
            # ADOPTED the pre-existing hand-made Secret in place (ownerRef + managed label set,
            # no deletion needed) — unlike Crossplane, which refuses to adopt (agentstack.md
            # §Operational notes still applies to composed non-ESO kinds). Real Ready condition
            # kept (like agent-git-token): AgentStack READY ⇒ the token materialized.
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: claude-session
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-claude-session-es
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: infisical, kind: ClusterSecretStore }
              target:
                name: claude-session
                creationPolicy: Owner
                template:
                  metadata:
                    labels:
                      openrouter.teststuff.net/session-key: "true"
              data:
                - secretKey: AUTH_TOKEN
                  remoteRef: { key: COORDINATOR_CLAUDE_OAUTH_TOKEN }
            {{- end }}
            ---
            # Standing funding ceiling — the operator mints the key and writes Secret <repo>-openrouter;
            # per-session ephemeral keys budget underneath it.
            apiVersion: openrouter.teststuff.net/v1alpha1
            kind: OpenRouterKey
            metadata:
              name: {{ $r.name }}
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-openrouter-key
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              project: {{ $r.name }}
              budgetUSD: {{ default 5.0 (get $fx "budgetUSD") }}
              resetInterval: {{ default "weekly" (get $fx "resetInterval") }}
              # FU-138: render the guardrail ALWAYS, `none` included. Omitting it made the opened
              # state inexpressible on the CR, so the only record of it was a hand-patched Secret
              # field — and the proxy now reads the CR as authoritative (openrouter-proxy.py
              # _cr_guardrail). `none` is inert on the OpenRouter side either way: the operator
              # copies the string into the Secret and the proxy rejects only on `only-free`.
              guardrail: {{ default "only-free" (get $fx "guardrail") }}
            ---
            # FU-020/ADR-081 worker egress. Selector hits ONLY agent pods; the app's own workloads are
            # untouched. enforce=false → monitor (allowlist evaluated + DNS visibility, nothing blocked).
            apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: agent-worker-egress
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-egress-cnp
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              endpointSelector:
                matchLabels:
                  app: agent-session
              {{- if not $enforce }}
              # MONITOR phase: rules attach (DNS visibility for the Hubble harvest) but the default
              # deny does not. Flip spec...egress.enforce=true in the AgentStack after clean rides.
              enableDefaultDeny:
                egress: false
              {{- end }}
              egress:
                # TIERED legs. The tier table and each leg's rationale live in
                # docs/agents/agentstack.md §The egress dial — one home per fact; keep this block
                # in sync with that table leg-by-leg. Baseline legs below are open to every ride
                # (every stack); the capability-gated legs sit in the docker-gated blocks
                # (fixer.docker: true) with their reason written at the leg; the claim-selected
                # profile and the harvest-earned extraFQDNs ride in the toFQDNs block.
                # The Kubernetes API. Added 2026-08-04 (homelab#97): the platform lane started
                # granting workers READ RBAC (agent-read-app / agent-read-infra — pods, events,
                # PVCs, Longhorn volumes) so a fixer can SEE the thing it is fixing, and that
                # permission was decorative without a network path — kubectl from the pod had
                # nowhere to go. The first homelab ride found it and correctly refused to dispatch
                # rather than guess. Read verbs are still bounded by RBAC, which is where the
                # boundary belongs; this only makes the apiserver reachable, never `secrets`
                # readable. NB in-cluster consumers must use service DNS
                # (kube-prometheus-stack-prometheus.monitoring:9090), NOT the LAN VIP. A VIP may
                # in fact answer (pod→LB-VIP is DNAT'd to the backend BEFORE policy evaluation —
                # the registry-mirror note below, Hubble-verified; #125 saw .40.13:9090 return
                # 200): that reachability is a DNAT incidental, not an allow — do not rely on it
                # (homelab#138 ruling: service DNS is the rule, option a).
                - toEntities:
                    - kube-apiserver
                  toPorts:
                    - ports:
                        - { port: "6443", protocol: TCP }
                        - { port: "443", protocol: TCP }
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: kube-system
                        k8s-app: kube-dns
                  toPorts:
                    - ports:
                        - { port: "53", protocol: UDP }
                        - { port: "53", protocol: TCP }
                      rules:
                        dns:
                          - matchPattern: "*"
                # Registry mirrors — BASELINE (moved out of the docker gate by homelab#520):
                # read-only pull-through caches (ADR-091), open to every ride (rationale:
                # docs/agents/agentstack.md §The egress dial). The identity rule is the primary
                # match — pod→LB-VIP is DNAT'd to the backend BEFORE policy evaluation,
                # Hubble-verified 2026-07-14; the VIP CIDRs stay as a belt for any untranslated
                # path.
                - toEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: registry-cache
                - toCIDR:
                    - 192.168.40.20/32 # docker.io mirror VIP
                    - 192.168.40.21/32 # ghcr mirror VIP
                    - 192.168.40.31/32 # mcr.microsoft.com mirror VIP (2026-08-26, the Playwright image)
                  toPorts:
                    - ports:
                        - { port: "80", protocol: TCP }
                {{- if $docker }}
                # docker=true: kata worker pods run dnsPolicy None + the LAN resolver (the FU-072
                # service-VIP gap), so DNS leaves to the router — keep the L7 dns rule so toFQDNs
                # visibility/allowlisting still works on that path.
                - toCIDR:
                    - 192.168.2.1/32
                  toPorts:
                    - ports:
                        - { port: "53", protocol: UDP }
                        - { port: "53", protocol: TCP }
                      rules:
                        dns:
                          - matchPattern: "*"
                # docker=true: kata rides install via the nix-cache/devbox-search LAN-VIPs (the
                # FU-072 service-VIP gap). The identity rules above cover the DNAT'd path — this
                # belt is for any untranslated path.
                - toCIDR:
                    - 192.168.40.23/32 # nix-cache VIP (FU-073e) — kata rides install via it
                    - 192.168.40.27/32 # devbox-search VIP (FU-118b) — kata rides `devbox add` via it
                  toPorts:
                    - ports:
                        - { port: "80", protocol: TCP }
                {{- end }}
                - toEndpoints: # the proxy + git-cred broker: the ONLY LLM/credential exit
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: agent-egress
                - toEndpoints: # devbox installs via the in-cluster pull-through cache (ADR-083)
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: nix-cache
                - toEndpoints: # `devbox add` resolves via the search proxy (FU-118b)
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: devbox-search
                - toEndpoints: # transcript uploads (agent-finalize)
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: garage
                - toEndpoints: # pushgateway run metrics (FU-057)
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: monitoring
                - toFQDNs:
                    # baseline: git over TLS + nix upstream fallback. NO openrouter.ai — direct LLM
                    # egress is the thing this policy forbids.
                    - { matchName: github.com }
                    - { matchName: api.github.com }
                    - { matchName: codeload.github.com }
                    - { matchPattern: "*.githubusercontent.com" }
                    - { matchName: cache.nixos.org }
                    {{- range $f := get $profileFQDNs $profile }}
                    - { matchName: {{ $f }} } # profile: {{ $profile }}
                    {{- end }}
                    {{- range $f := $extra }}
                    - { matchName: {{ $f }} } # extraFQDNs (earned from a monitor-phase harvest)
                    {{- end }}
                    {{- if $mcp }}
                    {{- $mcpHost := $mcp.endpoint | trimPrefix "https://" | trimPrefix "http://" | splitList "/" | first | splitList ":" | first }}
                    # MCP endpoint HOST, derived from spec.mcp.endpoint. The knob holds a URL —
                    # the launcher's harness attach flag needs the whole thing (#1041) — but toFQDNs
                    # matches a DNS query name, so the leg takes the bare host. That host must be
                    # an FQDN, never a service VIP (FU-072/kata).
                    - { matchName: {{ $mcpHost }} }
                    {{- end }}
                    {{- if $docker }}
                    # docker=true: docker.io pulls ride the FU-073 mirror (toCIDR above) since
                    # 2026-07-14 — the registry-1/auth/CDN FQDNs are gone (that tightening is the
                    # point of the mirrors; mirror down ⇒ pulls drop loudly, not fall back).
                    # ghcr.io stays: dockerd's registry-mirrors is Hub-only, so the dind's own
                    # pulls of ghcr images (k3d-proxy/k3d-tools) go direct until the gate configs
                    # route ghcr through the mirror per-tool.
                    - { matchName: ghcr.io }
                    {{- end }}
                  toPorts:
                    - ports:
                        - { port: "443", protocol: TCP }
            ---
            # ADR-087 leg A: the egress proxy resolves ref:<ns>/<secret> by reading LABELED session
            # Secrets here. Verb is get only; the proxy code additionally checks the session-key label.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-proxy-session-keys
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-proxy-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [""]
                resources: [secrets]
                verbs: [get]
              # FU-138: the proxy reads the OpenRouterKey CR that OWNS a session Secret, because
              # the CR (rendered from this claim) is the authoritative guardrail — the Secret's
              # GUARDRAIL is only written when the operator mints, so it goes stale silently.
              # list-only, namespaced: a CR spec carries budget/guardrail, never the key itself.
              - apiGroups: [openrouter.teststuff.net]
                resources: [openrouterkeys]
                verbs: [list]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-proxy-session-keys
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-proxy-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-proxy-session-keys }
            subjects:
              - { kind: ServiceAccount, name: openrouter-proxy, namespace: agent-egress }
            ---
            # FU-080: the per-stack LOOP identity + launch RBAC, rendered INTO the fixer namespace.
            # Today ONE global coordinator (ns agent-coordinator) holds a CLUSTER-scoped grant to
            # create pods + mint OpenRouterKeys in every namespace (agents/coordinator/rbac.yaml).
            # The endgame (agentstack.md §Decisions revisit): a per-stack coordinator/reviewer run
            # HERE as this SA, so the stack jail's namespace-admin workbench controls its whole loop
            # by construction — no cluster-scoped grant, no cross-ns reach. This renders the identity
            # + a NAMESPACED Role mirroring the global launcher grants (pods, exec, pvc read,
            # openrouterkeys lifecycle) so it's ready the moment the reflexes move in-namespace.
            # Additive: nothing binds a pod to it yet (the CronJob move is the remaining step).
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: agentstack-loop
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-loop-sa
                gotemplating.fn.crossplane.io/ready: "True"
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: agentstack-loop
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-loop-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [""]
                resources: [pods, pods/log]
                verbs: [get, list, watch, create, delete]
              - apiGroups: [""]
                resources: [pods/exec]
                verbs: [create]
              - apiGroups: [""]
                resources: [persistentvolumeclaims]
                verbs: [get, list]
              - apiGroups: [openrouter.teststuff.net]
                resources: [openrouterkeys, openrouterkeys/status]
                verbs: [get, list, watch, create, update, patch, delete]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: agentstack-loop
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-loop-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agentstack-loop }
            subjects:
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $r.name }} }
              # FU-080 cross-ns dispatch: the STACK loop (ns <stack>-agents) may launch workers
              # in this fixer ns — namespaced grants only, no cluster-scoped reach.
              - { kind: ServiceAccount, name: agentstack-loop, namespace: {{ $xr.metadata.name }}-agents }
            {{- end }}
            {{- if and $r.argo (get $r.argo "enabled") }}
            ---
            # ADR-093 argo.enabled: workflow identity + `workflowtaskresults` RBAC so the stack's
            # WorkflowTemplates/CronWorkflows run in this namespace (the argo controller is
            # cluster-wide; the executor needs this grant in-ns to report step results). The stack
            # authors the DAG + step images in its -iac/app repos — mechanism here, policy there
            # (ADR-085). First consumer: oracle-fleet ingestion. The S3 artifact repo (Garage bucket
            # + key + default configmap) renders here too once a multi-step DAG needs it.
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: argo-workflow
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-argo-sa
                gotemplating.fn.crossplane.io/ready: "True"
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: argo-workflow
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-argo-role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [argoproj.io]
                resources: [workflowtaskresults]
                verbs: [create, patch]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: argo-workflow
              namespace: {{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-argo-rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflow }
            subjects:
              - { kind: ServiceAccount, name: argo-workflow, namespace: {{ $r.name }} }
            {{- $art := get $r.argo "artifacts" }}
            {{- if and $art (get $art "enabled") }}
            ---
            # argo.artifacts (oracle-iac#40): the per-namespace S3 artifact repository — Garage
            # bucket + ONE rw key (Workspace-minted, ADR-076 CREATE-pattern like the transcripts
            # workspace), connection Secret written IN-NAMESPACE, and the default
            # `artifact-repositories` ConfigMap Argo resolves. ING-RT-STEP-CONTRACTS boundary:
            # small step outputs only; large objects pass by reference to the stack's data buckets.
            apiVersion: tf.upbound.io/v1beta1
            kind: Workspace
            metadata:
              # cluster-scoped CRD — no namespace; the connection secret below lands in-ns
              name: argo-artifacts-{{ $r.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-argo-artifacts-ws
            spec:
              providerConfigRef:
                name: default
              forProvider:
                source: Inline
                module: |
                  resource "garage_bucket" "artifacts" {
                    global_alias = "argo-artifacts-{{ $r.name }}"
                    max_size     = {{ mul (get $art "capGi" | default 2) 1073741824 }} # {{ get $art "capGi" | default 2 }}Gi — ADR-089 quota-as-contract
                  }
                  resource "garage_key" "rw" { name = "argo-artifacts-{{ $r.name }}-rw" }
                  resource "garage_bucket_permission" "rw" {
                    bucket_id     = garage_bucket.artifacts.id
                    access_key_id = garage_key.rw.id
                    read  = true
                    write = true
                    owner = false
                  }
                  output "bucket" { value = garage_bucket.artifacts.global_alias }
                  output "access_key_id" { value = garage_key.rw.id }
                  output "secret_access_key" {
                    value     = garage_key.rw.secret_access_key
                    sensitive = true
                  }
              writeConnectionSecretToRef:
                namespace: {{ $r.name }}
                name: argo-artifacts-s3
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: artifact-repositories
              namespace: {{ $r.name }}
              annotations:
                workflows.argoproj.io/default-artifact-repository: default-v1
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $r.name }}-argo-artifacts-cm
                gotemplating.fn.crossplane.io/ready: "True"
            data:
              default-v1: |
                s3:
                  endpoint: garage.garage.svc.cluster.local:3900
                  insecure: true
                  bucket: argo-artifacts-{{ $r.name }}
                  accessKeySecret: { name: argo-artifacts-s3, key: access_key_id }
                  secretKeySecret: { name: argo-artifacts-s3, key: secret_access_key }
            {{- end }}
            {{- end }}
            {{- end }}
            ---
            # Mirror the watched-repo list into status for quick kubectl reads.
            apiVersion: platform.teststuff.net/v1alpha1
            kind: AgentStack
            status:
              repos:
                {{- range $r := $xr.spec.repos }}
                - {{ $r.name }}
                {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
