# github-exporter — the ONE GitHub polling mechanism (CI conclusions + billing → Prometheus).
# Migrated from tofu (2026-07-07, minimize-tofu direction): plain k8s resources with no
# bootstrap-order role, so ArgoCD owns them. configMapGenerator hash-names roll the exporter
# pod on script edits (what the tofu checksum annotation used to do) and version the dashboard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - rl-tokens.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: github-exporter-script
    files:
      - github-exporter.py
      # FU-098: the declared App-permission state — GENERATED from docs/github-apps.yaml
      # (yq -o=json; github-apps-lint enforces the sync). collect_app_permission_drift reads it.
      - github-apps.json
  - name: grafana-dashboard-github
    files:
      - github.json=dashboard-github.json
    options:
      labels:
        grafana_dashboard: "1" # the Grafana sidecar discovers this label across ALL namespaces
  # ADR-102 goal registry + convergence panel (#209). Lives HERE, beside the collector that emits
  # its series, rather than in tofu/dashboards/ — the three aggregate agent dashboards there each
  # need a `for_each` entry in tofu/monitoring.tf and an operator `tofu apply` to move, while the
  # sidecar picks this ConfigMap up on ArgoCD sync. Same pattern as pushgateway's agent-issue
  # drill-down, which this dashboard's tree table links into.
  - name: grafana-dashboard-agent-goals
    files:
      - agent-goals.json=dashboard-agent-goals.json
    options:
      labels:
        grafana_dashboard: "1"
