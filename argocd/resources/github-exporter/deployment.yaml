# The poller pod. Stock python image + the script from the generated ConfigMap — no custom
# image pipeline. Parks in CreateContainerConfigError until ESO materialises the token Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter
  labels:
    app: github-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-exporter
  template:
    metadata:
      labels:
        app: github-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.13-slim
          command: ["python3", "/app/github-exporter.py"]
          env:
            - name: GITHUB_ORG
              value: teststuffstash
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-exporter-token
                  key: token
            # ADR-093 review edge-trigger: POST reviewable PRs to the Argo Events webhook so a
            # review Workflow fires near-instantly (reusing this poll — the one-poller doctrine),
            # instead of the review-reflex CronJob's */5 GraphQL poll. Runs alongside the CronJob
            # (safely parallel via the reviewer-pod idempotency guard). Empty = disabled.
            - name: REVIEW_WEBHOOK_URL
              value: "http://agent-loop-eventsource-svc.agent-coordinator.svc.cluster.local:12000/review"
          ports:
            - name: http-metrics
              containerPort: 9504
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9504
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            # FU-084: one file per probe-token identity (rl-tokens.yaml); optional so a missing
            # Secret degrades to fewer series, never a stuck pod.
            - name: rl-tokens
              mountPath: /var/run/rl-tokens
              readOnly: true
            # FU-098: App private keys for the permission-drift belt (subdir per DECLARED slug —
            # collect_app_permission_drift matches on docs/github-apps.yaml slugs). Optional:
            # a missing key degrades to that App riding the offline verify leg only.
            - name: app-keys
              mountPath: /var/run/app-keys
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: github-exporter-script # kustomize rewrites to the hashed name
        - name: rl-tokens
          projected:
            sources:
              - secret:
                  name: rl-token-coordinator-git
                  optional: true
                  items: [{ key: token, path: coordinator-git }]
              - secret:
                  name: rl-token-reviewer-git
                  optional: true
                  items: [{ key: token, path: reviewer-git }]
              - secret:
                  name: rl-token-merge-git
                  optional: true
                  items: [{ key: token, path: merge-git }]
              - secret:
                  name: rl-token-deploy-git
                  optional: true
                  items: [{ key: token, path: deploy-git }]
              - secret:
                  name: rl-token-renovate-git
                  optional: true
                  items: [{ key: token, path: renovate-git }]
              - secret:
                  name: rl-token-labels-git
                  optional: true
                  items: [{ key: token, path: labels-git }]
        - name: app-keys
          projected:
            sources:
              - secret:
                  name: rl-agents-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-agents/privateKey }]
              - secret:
                  name: rl-reviewer-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-reviewer/privateKey }]
              - secret:
                  name: rl-renovate-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-renovate/privateKey }]
              - secret:
                  name: rl-merge-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-merge/privateKey }]
              - secret:
                  name: rl-deploy-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-deploy/privateKey }]
              - secret:
                  name: rl-labels-github-app
                  optional: true
                  items: [{ key: privateKey, path: homelab-labels/privateKey }]
