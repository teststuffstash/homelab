# GitHub CI + billing alerts — replaces GitHub's failed-workflow emails (Alertmanager routes
# everything to the Home Assistant webhook, tofu/monitoring.tf). Prometheus picks up
# PrometheusRules cluster-wide (ruleSelectorNilUsesHelmValues=false).
#
# Only master/main run failures alert: PR-branch CI red is the agent breaker/fixer loop's
# domain (docs/agents/), and armed PRs can't merge red anyway (require_passed_checks).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: github-exporter
  labels:
    app: github-exporter
spec:
  groups:
    # ADR-102 goal registry (#209). `goal_spent_usd` is a JOIN, not a poll: the exporter holds
    # GitHub tokens only (no bucket credentials — it cannot read the ledger's _ledger.jsonl) and
    # spend is already a Prometheus fact, pushed per run by the launcher's finalize leg. So the
    # exporter emits MEMBERSHIP (goal_descendant_info, one series per goal→descendant edge incl.
    # the goal itself at depth 0) and the money is attributed here.
    #
    # Rule order inside the group is evaluation order — goal_spent_usd is recorded before the two
    # rules that read it.
    - name: agent-goals
      rules:
        # Σ(every run charged to any issue in the goal's descendant tree). The inner
        # `sum by (project, issue)` collapses the pushgateway's job/role/round/model dimensions
        # FIRST so the vector match is one-to-many with the MEMBERSHIP side as the "many" — which
        # is what makes a nested goal (a goal that is itself a sub-issue of another goal) attribute
        # its spend to BOTH ancestors instead of failing the whole rule on a many-to-many match.
        # No push_time gating: a goal's burn-down is all-time spend against its `Budget:` line,
        # unlike the cost dashboard's rolling 24h/7d windows.
        - record: goal_spent_usd
          expr: >-
            sum by (owner, project, stack, goal) (
              sum by (project, issue) (agent_run_cost_usd)
              * on (project, issue) group_right () goal_descendant_info
            )
        # ⚠ THE OPERANDS DO NOT SHARE A LABEL SET, and this comment asserted for months that they
        # did (homelab#348). `goal_spent_usd` is the aggregate ABOVE — `sum by (…)` leaves it with
        # exactly (owner, project, stack, goal). `goal_budget_usd` is scraped straight off the
        # exporter, so it carries the target labels too (container, endpoint, instance, job,
        # namespace, pod, service). A plain binary operator matches on the FULL label set of both
        # sides, so 4 labels never matched 11: both rules evaluated to NOTHING, for every goal,
        # from #209 until #348 — and the panel that reads goal_budget_ratio read "No data" while
        # the registry table beside it looked healthy (it reads the two families SEPARATELY).
        # Silent exactly like #312/#330: an expr that evaluates to nothing is indistinguishable
        # from a condition that is not happening.
        #
        # The fix collapses the SCRAPED side to the aggregate's label set, rather than writing an
        # explicit `on (owner, project, stack, goal) group_left ()`. Both return the right three
        # series today (verified live, 2026-08-12), but they differ on the roll: `replicas: 1`
        # with the default RollingUpdate surges to two Ready pods, so both generations are scraped
        # and goal_budget_usd briefly carries TWO series per goal. As the "one" side of a
        # group_left that is a duplicate-match error, and a rule that errors records nothing — for
        # EVERY goal, not just the doubled one. `max by (…)` collapses the generations instead.
        # Same reasoning as claim (iii) of the restart-gap block in the `github` group below, and
        # both shapes are executed against a two-generation input in agent-goals.promtool-test.
        #
        # ABSENCE, in the two directions this pair can be blind:
        #  - No parsable `Budget:` line ⇒ no goal_budget_usd ⇒ no ratio, no remaining. Absent, not
        #    a fake 0/∞ — unfunded-unknown is not funded-zero (the exporter's rule, kept here).
        #  - A budget but NO goal_spent_usd ⇒ still absent, and that is DECIDED, not inherited
        #    (#348). Goal #278 is the live case: ~26 rides, all `claude/haiku` on the subscription
        #    rail, which pushes agent_run_total but no agent_run_cost_usd — so it has a $60 budget
        #    and no spend series at all. `or vector(0)` would render it as 0% burn. Rejected: this
        #    rule cannot tell a subscription-rail goal from one whose cost pushes were LOST (the
        #    FU-131 harvest gap — killed pods), and agents/goal-budget.sh, the arithmetic that
        #    actually gates a dispatch, reads that same state fail-CONSERVATIVE (a child that has
        #    ridden with nothing in the ledger is charged its full cap). A panel printing 0% burn
        #    for precisely the state the gate prices at maximum would put the two in contradiction
        #    on one screen, and 0 is a claim this rule has no evidence for. Absent is honest; that
        #    it is also INVISIBLE is the real residue, and it is written up in #348's PR body
        #    rather than papered over with a zero.
        - record: goal_budget_ratio
          expr: goal_spent_usd / max by (owner, project, stack, goal) (goal_budget_usd)
        - record: goal_budget_remaining_usd
          expr: max by (owner, project, stack, goal) (goal_budget_usd) - goal_spent_usd

    - name: github
      rules:
        # ── THE #288 RESTART-GAP CLASS, ported to five alerts in this group (homelab#331) ───────
        # The class, its two halves and the [10m] sizing are written out ONCE, at
        # GithubExporterStale below (homelab#313) — read that first. This block records only what
        # porting it to five more persistent-condition alerts needed BEYOND the mechanical
        # substitution. Ported: GithubAppPermissionDrift, GithubVendorOutage, GithubRateLimitLow,
        # GithubPaidUsage, GithubActionsMinutesHigh — each carries a ⚠ note with its own price,
        # and every claim below is executed in loop-health.promtool-test against the pre-#331
        # exprs kept as loop-health.promtool-rules §regression-witness-pre-331.
        #
        # (i)  THE HOLE IS WIDER THAN A ROLL for these five. `replicas: 1` (deployment.yaml) makes
        #      a poller roll empty the vector, as everywhere else — but poll_forever() also
        #      REPUBLISHES the whole exposition every 120s, and a collector that raises simply is
        #      not in the new body (github-exporter.py: the `for collector in (…)` loop catches,
        #      logs, sets ok=False and moves on). So an upstream 5xx inside collect_billing /
        #      collect_vendor_status / collect_app_permission_drift — or one failing token probe
        #      in collect_rate_limits, which `continue`s past it — deletes that family for a poll
        #      cycle while the pod stays healthy and `up` stays 1. Same shape #330 measured on the
        #      GraphQL walk, and neither GithubExporterDown nor GithubExporterStale can see it.
        # (ii) THE DIRECTION IS NOT AUTOMATIC. `max_over_time` is the alert-PRESERVING function
        #      only where HIGH is the bad reading. GithubRateLimitLow is a LOW-is-bad ratio, so it
        #      bridges with `min_over_time` on the numerator; bridging it with `max` would hold
        #      the healthiest sample of the last 10m and delay the page by up to 10m — twice that
        #      alert's whole `for:` window.
        # (iii) A LABEL-LESS `sum()` DOES NOT MEAN "no identity half needed". What is summed still
        #      carries `pod`/`instance`, so a bare `sum(max_over_time(…))` counts BOTH pod
        #      generations for the ≤10m the range holds them — the two billing alerts drop
        #      identity inside the sum for that reason, priced at GithubPaidUsage.
        # (iv) THE PRICE IS ALWAYS THE SAME SHAPE: a bridged expr believes a condition for up to
        #      10m after it genuinely ends, so each of the five resolves up to 10m late and
        #      `{{ $value }}` reports the window's worst sample rather than the newest one. It
        #      also shortens what `for:` demands — a condition true for two scrapes and then gone
        #      keeps the expr true for the following 10m, so a flap that used to be ridden out can
        #      now reach a `for:` of ≤10m. Priced per alert, asserted per alert.
        # (v) NOT PORTED, deliberately: GithubExporterDown (`up == 0` needs a live target, and a
        #      replaced target restarting the window is a genuinely new attempt at being scraped),
        #      GithubWorkflowRunFailed / AgentReviewLoop / AgentErrorFlagged (no `for:` — no
        #      window to restart), GithubStorageHeldHigh (`increase(…[24h])` already spans any
        #      hole this class is about) and AgentQueueStalled (#330 — bridged per conjunct, and
        #      deliberately not wholesale).
        # (vi) PORTED AT A DIFFERENT SIZE: CiDispatchStalled (homelab#335) takes the hole half at
        #      [5m], not [10m], because its `for: 10m` is itself sized on a phantom the bridge
        #      extends. The range is not free there the way it is here — the arithmetic of that
        #      interaction is written out at the alert.
        #
        # FU-098: fires while an App's LIVE permissions differ from docs/github-apps.yaml in
        # EITHER direction. This IS the change flow's turn signal: a permission PR rings it
        # until the operator's UI click + install approval land; a click nobody PR'd rings it
        # until declared. 30m for-window: a scrape blip is not drift.
        # ⚠ RESTART-GAP HARDENED (homelab#331 — the class block at the top of this group). BOTH
        # halves: the gauge is scraped, so `pod`/`instance` sat on the alert and a roll re-clocked
        # `for: 30m` under a new identity; and at `replicas: 1` the roll empties the vector
        # outright. `app` is the label that must survive — it names the App the operator has to
        # act on, and `github_app_permission_mismatch{app=…}` is keyed on it too. Price: drift
        # that CLEARS (the UI click + install approval, or the declaring PR) keeps ringing for
        # ≤10m. Against a 30m window on a human-driven fix that is invisible, and it is the safe
        # direction: this alert exists to nag until the change flow finishes.
        - alert: GithubAppPermissionDrift
          expr: max by (app) (max_over_time(github_app_permission_drift[10m])) == 1
          for: 30m
          labels:
            severity: warning
            # homelab#239: the Apps ARE the loop's machinery — one of them mints the fixer's own
            # git token — and closing this drift needs either an operator UI click plus an
            # install approval or a declaration PR; neither is a surface a worker can land by
            # itself. Fires in ns `monitoring` with a non-`Agent*` name, so the gate's two older
            # keys both miss it.
            platform_machinery: "true"
          annotations:
            summary: "GitHub App {{ $labels.app }} permissions differ from the declared state"
            description: "Live permissions of {{ $labels.app }} do not match docs/github-apps.yaml (github_app_permission_mismatch{app=\"{{ $labels.app }}\"} carries the per-permission detail: declared vs live). Either finish the pending grant (UI click + approve on each installation) or PR the declaration."

        - alert: GithubWorkflowRunFailed
          expr: (time() - github_workflow_run_updated_timestamp{conclusion=~"failure|startup_failure|timed_out", branch=~"master|main"}) < 3600
          labels:
            severity: warning
          annotations:
            summary: "GitHub workflow {{ $labels.repo }}/{{ $labels.workflow }} failed"
            description: "Run #{{ $labels.number }} ({{ $labels.event }} on {{ $labels.branch }}) concluded {{ $labels.conclusion }}: https://github.com/{{ $labels.owner }}/{{ $labels.repo }}/actions/runs/{{ $labels.id }} — auto-resolves 1h after the run."

        # FU-150 (vendor half): GitHub's OWN status page as an alert, because during the
        # 2026-08-07 Actions outage every in-cluster signal looked like ours (idle runners,
        # frozen queues, ZERO failures — a queued run never fails) and the operator had to
        # check githubstatus.com by hand. `triage: none` — a vendor outage is self-describing
        # and unfixable from here; a triage session would spend budget restating this
        # annotation. The responder prompt already tells sessions to consult this signal.
        # >= 2 = partial_outage or worse (1 = degraded_performance happens weekly, not
        # actionable); 10m `for:` rides out statuspage flaps.
        # ⚠ RESTART-GAP HARDENED (homelab#331 — the class block at the top of this group). BOTH
        # halves; `component` is the surviving label (the summary names it, and one component's
        # outage must not be merged with another's). The price is the one worth naming here,
        # because it lands on the `for:` this alert was tuned around: with the bridge, a ≥2
        # reading that lasts two scrapes and then clears keeps the expr true for the next 10m and
        # DOES page, where the bare form could not. Asserted in the fixture rather than argued
        # here. Accepted because the two errors are not symmetric — this alert is `triage: none`,
        # so a false page costs one operator glance and dispatches nobody, while the miss it
        # exists for is 2026-08-07: five hours in which every in-cluster signal looked like ours.
        # A partial_outage on GitHub's own status page is a state GitHub SET, not scrape noise.
        # `{{ $value }}` now reads the worst status of the last 10m, which is the right one to
        # print for a component that is degrading.
        - alert: GithubVendorOutage
          expr: >-
            max by (component) (max_over_time(github_vendor_component_status{component=~"Actions|API Requests|Git Operations|Webhooks|Packages"}[10m])) >= 2
          for: 10m
          labels:
            severity: warning
            triage: none
          annotations:
            summary: "GitHub-side outage: {{ $labels.component }}"
            description: "githubstatus.com reports {{ $labels.component }} at status index {{ $value }} (2=partial_outage, 3=major_outage). Vendor-side — in-cluster CI signals will LOOK broken (idle runners, frozen queues, no failures). Do NOT re-run queued work (re-runs deepen a dead queue) and do NOT change capacity settings off this state. https://www.githubstatus.com"

        # FU-150 (the OURS half, homelab#284): "CI cannot dispatch" as QUEUED-AGE — the throughput
        # signal, deliberately CAUSE-AGNOSTIC. GithubWorkflowRunFailed needs a run to FAIL and a
        # queued run never does, which is why 2026-08-07 ran five hours with every belt green; the
        # `AutoscalingListener`-zero signal first proposed for this half was dropped because
        # 2026-08-11 starved the same queue with the listener ALIVE and scaling (a node had lost
        # its default route). Age of the oldest run still waiting for a runner catches both, and
        # anything else that stops dispatch, without naming a cause.
        #
        # 1800s, measured rather than guessed (474 self-hosted jobs, 2026-08-04→11, the two
        # incident windows EXCLUDED because their waits are the signal, not the baseline):
        # p50 18s, p90 64s, p95 186s, p99 830s, max 1134s. The legitimate tail is scheduled-cron
        # pileup against maxRunners=4 (four repos firing at 12:00), so a threshold near p99 would
        # ring on a busy Saturday: 30 minutes is 2.2x p99 and 1.6x the worst honest wait in a
        # week, and with `for: 10m` a run must sit queued ~40 min (2.9x p99) before this fires.
        # It still catches both incidents by a mile — inside their windows 9 samples exceeded
        # 25 minutes and the longest wait was 10.9h — and fires ~40 min in against the 2h (08-11,
        # ~09:02→11:00) and 5h (08-07, 01:05→03:25) the humans took.
        # `for: 10m` is not padding: the apparent age keeps climbing after the run is actually
        # picked up, because the exporter serves a CACHED exposition between its 120s polls (so a
        # run reads as queued for up to 2 minutes after it starts) — and, absent a staleness
        # marker, PromQL's 5m lookback would extend that further still. On the 1m evaluation grid
        # the longest phantom a healthy pickup can produce is four consecutive pending
        # evaluations, so any window above 5m makes that false positive unrepresentable rather
        # than unlikely. The promtool fixture beside this file pins exactly that boundary: it
        # models the longer (no-staleness-marker) tail and goes red at `for: 3m`.
        # runner!="hosted" — not `="self-hosted"`: an unclassifiable run that cannot get a runner
        # is precisely this alert's blind spot (`unknown` is what _runner_class returns when the
        # jobs probe fails), and hosted queueing is GitHub's, i.e. GithubVendorOutage's.
        # max by (owner, runner) — ONE alert for a stalled fleet, not one per stuck run: a wedged
        # dispatcher stalls every repo at once, and per-run series would file N issues for one
        # root cause (the FU-133 class). The drill-down query rides the description.
        # platform_machinery (homelab#239): a dispatched worker's own PR would sit in the very
        # queue this alert says is dead, and the remedies are imperative cluster surgery (rebuild
        # the listener, cordon/reboot a node) — not a manifest a fixer can PR. Fires in ns
        # `monitoring` with a non-`Agent*` name, so both older gate keys miss it.
        #
        # ⚠ RESTART-GAP HARDENED (homelab#335) — and NOT by the mechanical port. The identity half
        # shipped with the alert (`max by (owner, runner)` above, #284); this adds the hole half at
        # [5m] rather than the class's [10m], because the two interact. THE COMPOSITION QUESTION,
        # ANSWERED: the bridge and the `for:` window neither compose freely nor multiply — the
        # tails MAX rather than add, and the bridge SPENDS the window's phantom margin.
        #   • The phantom tail is how long the last stale sample stays READABLE after the run is
        #     really picked up: ≤120s of cached exposition (the run only leaves the body at the
        #     next poll), plus whatever keeps the vanished series readable afterwards — nothing in
        #     production (Prometheus staleness-marks it), the 5m lookback in the fixture's model.
        #   • `min_over_time(…[B])` REPLACES that second term with exactly B: a range selector
        #     takes the raw samples in (t−B, t] and no lookback applies to a range vector. So the
        #     composed phantom is 120s + B — not 120s + 5m + B, and not the 10m + 10m = 20m the
        #     issue asked about. The alert survives it iff `for:` > 120s + B, i.e. B < 8m here.
        #   • At the class's [10m] that is 12m > 10m and the false positive #284 made
        #     UNREPRESENTABLE becomes representable again: a run picked up just under the 30m
        #     threshold pages ~11 min after CI recovered, when every check in the description below
        #     reads healthy. Executed, not argued — `witness-bridge-10m` in the .promtool-rules
        #     copy fires on exactly the pickup where the shipped expr stays silent.
        #   • [5m] is the size that costs the window nothing it was not already priced for: it
        #     reproduces EXACTLY the 5m-lookback tail the phantom guard has modelled since #284
        #     (deliberately "a STRICTLY LONGER tail than production can produce"). That guard's
        #     assertions do not move by one second under this expr, which is why `for: 10m` is
        #     kept as measured rather than resized — the design point is unchanged, not restored.
        #   • The fixture pins [5m] from BOTH sides, so the range is a checked interval rather than
        #     a preference: at [10m] the late-pickup case goes red, at [3m] the roll case does (its
        #     modelled hole is a 4-minute sample gap — one failed 120s poll plus scrape alignment).
        # WHAT [5m] BUYS, i.e. the hole: `replicas: 1` (deployment.yaml), so a poller roll empties
        # the vector outright (69-116s over 10 pod generations, #288) — and collect_workflow_runs
        # is the FIRST collector and fails WHOLESALE, so one 5xx on any repo's runs page drops the
        # entire queued family for a 120s poll cycle while the pod stays healthy and `up` stays 1.
        # That failure is CORRELATED with the vendor outage half of what this alert exists to
        # catch, which is what makes the hole worth bridging at all rather than merely possible.
        # CEILING, asserted rather than assumed (#328's shape): a hole wider than 5m — two
        # consecutive failed polls, a crash-loop, a cold-mirror image pull, a node drain — still
        # empties the range and restarts `for: 10m`, so the page slips by hole + 10m. Accepted.
        # PRICE, and the second half is unique to this alert: (1) a real stall resolves up to
        # 120s+5m late; (2) `$value` does NOT freeze at the worst sample seen, the way it does for
        # every other alert of this class — `time()` keeps advancing against a HELD timestamp, so
        # through the tail the summary reports a queue age nobody ever observed and it keeps
        # climbing. Both are asserted in queued-age.promtool-test.
        # DIRECTION (class rule ii): this metric is a TIMESTAMP where LOW is bad, so the
        # alert-preserving function is `min_over_time`, not the class's `max_over_time`. Per series
        # the two coincide today — created_at never changes, so a run's gauge is constant — so this
        # is the rule kept correct for the day that stops being true, not a bug fixed.
        - alert: CiDispatchStalled
          expr: max by (owner, runner) (time() - min_over_time(github_workflow_run_queued_since_timestamp{runner!="hosted"}[5m])) > 1800
          for: 10m
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "CI cannot dispatch: {{ $labels.runner }} runs queued {{ $value | humanizeDuration }}"
            description: 'The oldest {{ $labels.runner }} workflow run in {{ $labels.owner }} has waited {{ $value | humanizeDuration }} for a runner (normal pickup ~20s). A queued run never fails, so no CI-failure alert can see this. Which runs: github_workflow_run_queued_since_timestamp{runner!="hosted"}. Check in this order: (1) githubstatus.com / GithubVendorOutage — vendor-side, and do NOT re-run queued work; (2) saturation vs breakage — a saturated pool has jobs RUNNING, a broken one has workers WAITING (maxRunners is 4, argocd/platform/arc-runners.yaml); (3) kubectl -n arc-runners get pods,ephemeralrunnersets,autoscalinglisteners, then the LISTENER POD''s own log — the 2026-08-07 wedge (docs/incidents/2026-08-07-arc-listener-wedge.md) was visible ONLY there; (4) WAN reachability from each runner node — 2026-08-11 (docs/incidents/2026-08-11-wk-metal-02-default-route-loss.md) was one node''s missing default route with the listener healthy.'

        # METERED usage only — the Team-plan seat license ($4/mo) is a subscription and never
        # shows in the usage API. Metered spend should stay $0 inside included usage (hosted
        # minutes discounted to $0, self-hosted runners and public ghcr free; the org's 2026-07
        # statement: gross $0.54 / billed $0). Net >$1 month-to-date = a surprise (runaway
        # private-repo cron, storage overage) — catch it pre-invoice.
        # ⚠ The three billing alerts below carry `platform_machinery: "true"` (homelab#239). They
        # are spend probes on the org's OWN account, and each `sum()`s every repo/SKU dimension
        # away by design — so the alert states a fleet-wide money fact and names no owner, no
        # repo and no file. There is nothing for a dispatched worker to edit; the next step is an
        # operator reading the per-SKU breakdown each description already gives. The label caps
        # the outcome at report/PR-without-auto-merge; triage still runs, which is the point.
        # ⚠ The FIRST TWO of the three are RESTART-GAP HARDENED (homelab#331 — the class block at
        # the top of this group). The hole is the reason: `sum()` over an EMPTY vector is empty,
        # not 0, so one missing exposition (a roll, or a 5xx inside collect_billing) resolved them
        # and threw away a full hour of `for:`. Bridged per series BEFORE the sum, the way
        # AgentQueueStalled's queued conjunct is.
        # …but `max_over_time` ALONE is wrong here, and this is the one place in this PR where the
        # mechanical port would have shipped a defect. `sum()` being label-less says nothing about
        # what is being summed: the samples carry `pod`/`instance`, so for the ≤10m the range
        # holds BOTH pod generations the sum counts each SKU twice — a money figure reported at 2x
        # and, at the threshold, a page a roll invented. So identity is dropped INSIDE the sum
        # first. `without (instance, pod)` rather than a positive `by (org, product, sku, unit,
        # repo, visibility)` list on purpose: `without` keeps any billing dimension the exporter
        # adds later, where a stale `by` list would silently `max` two SKUs into one and
        # UNDER-report the bill — the wrong direction to fail on a spend alert. Both readings are
        # asserted at the overlap instant in loop-health.promtool-test.
        # Otherwise free in both directions, unlike the other three ports: both metrics are
        # month-to-date CUMULATIVE, so the 10m high-water IS the newest value and the range can
        # neither delay a page nor hold one — the single moment it shows is the month rollover,
        # where the old month's total is believed for ≤10m under a 1h window.
        # GithubStorageHeldHigh needs nothing: `increase(…[24h])` already spans any hole this
        # class is about.
        - alert: GithubPaidUsage
          expr: sum(max without (instance, pod) (max_over_time(github_billing_net_amount[10m]))) > 1
          for: 1h
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "GitHub is billing real money this month"
            description: 'Month-to-date net spend is ${{ $value | printf "%.2f" }} (expected $0 — everything inside included usage). Break it down by SKU: sum by (product, sku, repo) (github_billing_net_amount).'

        # Included-quota burn — the Team plan includes 3000 hosted min/month (UI 2026-07:
        # "179 min used / 3,000 min included"); alert at 80%. unit=Min.* matches the API's
        # "Minutes" and excludes the GigabyteHours storage SKUs under the same product.
        - alert: GithubActionsMinutesHigh
          expr: >-
            sum(max without (instance, pod) (max_over_time(github_billing_usage{product=~"(?i)actions", unit=~"(?i)min.*", visibility="private"}[10m]))) > 2400
          for: 1h
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "GitHub Actions hosted minutes at 80% of included quota"
            description: '{{ $value | printf "%.0f" }} hosted-runner minutes this month (3000 included, resets monthly). Per repo: sum by (repo, sku) (github_billing_usage{product=~"(?i)actions", unit=~"(?i)min.*"}).'

        # Held Actions/Packages storage, derived: GB-hr is cumulative month-to-date, so its
        # 24h increase ÷ 24 = average GB currently held. Quota is 2 GB (the UI's "used" is the
        # month AVERAGE, so a spike shows there far too late — 2026-07-07 case: 6.2 GB of dead
        # image artifacts read as "1.2 GB used" while tripling the quota pace). Alert at 1.6 GB.
        - alert: GithubStorageHeldHigh
          expr: sum(increase(github_billing_usage{unit=~"(?i)gigabytehour.*"}[24h])) / 24 > 1.6
          for: 6h
          labels:
            severity: warning
            platform_machinery: "true"
          annotations:
            summary: "GitHub Actions/Packages storage at 80% of quota pace"
            description: '~{{ $value | printf "%.1f" }} GB held over the last day (2 GB included as a monthly average). Find it: per-repo github_billing_usage{unit=~"(?i)gigabytehour.*"}, then the repo''s /actions/artifacts — usually forgotten upload-artifact output (set retention-days, or push images to ghcr instead).'

        # Agent-loop guards (docs/agents/merge-path.md §Runaway dispatch). The detection layer
        # INDEPENDENT of the review-reflex's in-band circuit breaker: the 2026-07-12 oracle-fleet#13
        # loop posted 12 duplicate approvals over 90 min and NOTHING alerted — the operator noticed a
        # failed pod by hand. Trailing-1h per-author count (the PAT can't see commit objects, so
        # since-head isn't computable): a healthy worker↔reviewer iteration tops ~3 verdicts/h
        # (CI ~5min + reflex tick 5min + review ~6min per cycle); the incident ran ~8/h. >3 splits
        # the two with margin, and the series vanishing when the PR goes quiet self-resolves it.
        - alert: AgentReviewLoop
          expr: github_pull_request_reviews_recent > 3
          labels:
            severity: warning
          annotations:
            summary: "Review loop on {{ $labels.repo }}#{{ $labels.number }}"
            description: "{{ $labels.author }} has posted {{ $value }} verdict reviews in the last hour on https://github.com/{{ $labels.owner }}/{{ $labels.repo }}/pull/{{ $labels.number }} — that cadence is a dispatch loop, not iteration. Halt it: add the agent/error label (all agent automation skips it), then check the review-reflex breaker (agents/review-reflex.sh)."

        - alert: AgentErrorFlagged
          expr: github_pull_request_label{label="agent/error"} == 1
          labels:
            severity: warning
          annotations:
            summary: "agent/error on {{ $labels.repo }}#{{ $labels.number }} — automation halted"
            description: "A circuit breaker tripped or an agent flagged an anomaly on https://github.com/{{ $labels.owner }}/{{ $labels.repo }}/pull/{{ $labels.number }}; agent automation skips it until a human removes the label. Read the AGENT_ERROR comment(s) on the PR for what was observed."

        - alert: GithubExporterDown
          expr: up{job="github-exporter"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "github-exporter is not being scraped"
            description: "The GitHub poller pod is down or unreachable for 15m — no CI-failure or billing alerts until it's back. Usually the token Secret is missing (ExternalSecret github-exporter-token) or the pod crashed."

        # Fine-grained PATs expire (≤1y) — this is the rotation reminder. Also catches a
        # revoked token or a GitHub API outage while the pod itself stays healthy.
        #
        # ⚠ RESTART-GAP HARDENED (homelab#313, the #288 class in its second alert). The plain
        #   `time() - github_exporter_last_success_timestamp > 1800`
        # form restarted its 30m window every time the poller rolled mid-staleness, because the
        # gauge is SCRAPED: `pod`/`instance` sit on the series and therefore on the alert. Same two
        # mechanisms, same two halves — either alone still resets the window (#288 proved that at
        # one replica):
        #   (1) IDENTITY CHURN → `max by (job)`. A new pod was a new alert instance with its own
        #       `for:` clock. `job` is the one label here that does not churn.
        #   (2) A REAL HOLE → `max_over_time([10m])`. This Deployment is `replicas: 1`
        #       (deployment.yaml), so during a roll the vector is genuinely EMPTY — nothing left to
        #       aggregate over — and the staleness marker makes that instant rather than
        #       lookback-cushioned.
        # [10m] is #288's measured size (its 10 pod generations gapped 69-116s of raw samples,
        # ~5x margin); a roll longer than 10m still resets the window, which is the accepted
        # ceiling, asserted in the fixture rather than assumed. Unlike #288 the range costs
        # nothing on the way down: this gauge only changes value when a poll SUCCEEDS, and any
        # success inside the last 10m already puts the age under the 1800s threshold — so
        # `max_over_time` can neither delay a page nor keep one ringing after recovery.
        # ACCEPTED, and the reverse face of the same coin: aggregating means one healthy instance
        # masks a stuck one. Unreachable at `replicas: 1`, and it is exactly what makes a roll
        # safe (a fresh pod publishes `..._last_success_timestamp 0` until its first successful
        # poll, and the outgoing pod's real value outranks it). Revisit if this ever scales out.
        # Both halves and the ceiling are pinned as executed tests in loop-health.promtool-test,
        # against the pre-#313 expr kept as a regression witness in loop-health.promtool-rules.
        - alert: GithubExporterStale
          expr: time() - max by (job) (max_over_time(github_exporter_last_success_timestamp[10m])) > 1800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "github-exporter polls are failing"
            description: "No fully successful GitHub poll for 30m+ — likely the PAT expired/was revoked. Re-mint: scripts/github-exporter-pat-bootstrap.sh (docs/github-setup.md §Tokens)."

        # FU-091: queued work + a fully idle loop for 2h = a wedged dispatcher (the 2026-07-21
        # finding: a sidecar zombie held project-WIP for 3 days; every scan said so in logs
        # nobody reads). Different code + token than the scan — fires even when the scan IS the
        # wedged layer. Worker-pod regex: deterministic task keys + legacy timestamp names;
        # eventsource/sensor infra pods deliberately don't match.
        # ⚠ The three conjuncts do TWO different jobs and needed TWO different repairs (#312, then
        # #330). Read them separately — the second repair deliberately does NOT generalise to all
        # three, and porting it wholesale would weaken the alert.
        #
        # (1) THE EVIDENCE conjunct, `... > 0`, and the ONLY one whose absence can empty the whole
        #     chain: `and` yields nothing when its LHS is empty, an empty expr is a RESOLVED alert,
        #     and a resolved alert restarts `for: 2h` — the longest window in this repo, so the one
        #     that most needs to survive a hole. #312's `or vector(0)` cannot reach it (#330): the
        #     default would make it evaluate `0 > 0`, i.e. the same silence by another route.
        #     The hole is ordinary, not a rare roll: when the GraphQL walk fails this exporter
        #     emits NO series for the family rather than a zero (github-exporter.py
        #     collect_agent_issues, "absent ≠ zero" — the same honesty rule as the subscription
        #     gauges), so a plain upstream 502/504 drops it for a scrape and Prometheus writes
        #     staleness markers. Measured live 2026-08-11, TWICE inside one hour, with
        #     `github_exporter_last_success_timestamp` staying fresh throughout — so
        #     GithubExporterStale cannot cover for it and `up` is 1 the whole time.
        #     Repair = the #288/#313 bridge, `max_over_time(...[10m])`, and ONLY that half of it:
        #     the `max by (<a label that does not churn>)` half exists to stop pod/instance
        #     identity from splitting the `for:` clock, and `sum()` already drops every label here,
        #     so this alert's identity is `{severity}` with or without it. [10m] is #288's measured
        #     size, carried unchanged; the ceiling (a longer hole DOES still reset the window) is
        #     asserted in the fixture, not assumed.
        #     What bridging MEANS here: "queued work seen in the last 10m counts as queued now",
        #     which is the intended reading. Its price is the mirror image — for up to 10m after
        #     the queue genuinely drains, the alert still believes it, and because the range is
        #     per-series-then-summed `{{ $value }}` reports the 10m HIGH-WATER count, so a partial
        #     drain over-reads for one range window. Both are ≤10m of slack on a 2h condition.
        # (2)/(3) THE IDLE conjuncts, `(sum(...) or vector(0)) == 0` — deliberately NOT bridged.
        #     They aggregate metrics emitted PER OBJECT (one series per live worker pod, one per
        #     OPEN PR), so the idle state this alert exists to catch produces ZERO series and
        #     `sum()` over no series is EMPTY, not 0. #312's default is what makes them firable at
        #     all (measured 2026-08-11: the worker-pod aggregate was present at only 343 of 865 5m
        #     steps over three days, absent exactly while idle); same idiom as RetroReportOverdue
        #     in argocd/resources/pushgateway/prometheusrule.yaml, and the parens are required —
        #     `or` binds looser than `==`.
        #     That default is also why a hole here is NOT the #330 defect: absence resolves to 0,
        #     the conjunct stays TRUE, the chain still matches and the window keeps running. A gap
        #     can only make a BUSY loop read idle for a few scrapes, and that direction cannot
        #     produce a false page — firing needs all ~120 evaluations in the window to read idle,
        #     so any single scrape carrying the real series resets the clock.
        #     Suppression-by-recent-activity is defensible on (2) — a worker pod alive 5m ago IS
        #     evidence the loop is not wedged — but it repairs nothing and blunts the alert: it
        #     would restate "idle continuously for 2h" as "idle for 2h bar a 10m grace" and delay
        #     by 10m the moment the loop becomes eligible after the last worker exits. On (3) it is
        #     weaker still: an open PR is a work-in-flight SUPPRESSOR, not activity — one can sit
        #     open and untouched for days, which is itself a wedge shape — so widening its reach
        #     buys silence, not signal. Bridge the conjunct that loses the window; leave the ones
        #     that only ever hold it.
        # `{{ $value }}` reads the queued count: `and` returns its LHS. Every claim above is
        # executed in loop-health.promtool-test (1/5 + 2/5 pin #312; the gap, ceiling and
        # pre-#330 regression witness pin this).
        - alert: AgentQueueStalled
          expr: >-
            sum(max_over_time(github_agent_issue_labels{label="agent/queued"}[10m])) > 0
            and (sum(kube_pod_status_phase{phase=~"Running|Pending", pod=~"agent-.+-(issue|pr)-[0-9]+-r[0-9]+|agent-.+-[0-9]{6}"}) or vector(0)) == 0
            and (sum(github_pull_request_open) or vector(0)) == 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Agent queue stalled — queued issues but a fully idle loop"
            description: '{{ $value }} agent/queued issue(s) with zero live workers and zero open PRs for 2h — check the coordinate ticks (kubectl -n oracle-agents get wf), the WIP holds in the scan report, and agents/coordinator/TICK-LOG.md for the last incident shape.'
        # FU-084: the 2026-07-17 class — an installation's pool (GraphQL was the invisible one)
        # drains and consumers start FATAL-aborting. Symptom-only; per token identity + resource.
        # ⚠ RESTART-GAP HARDENED (homelab#331 — the class block at the top of this group), the
        # RANGE half ONLY: `min by (token, resource)` already drops pod/instance, so this alert's
        # identity never churned and the aggregation half was done before the class was named.
        # The hole is real all the same — `replicas: 1`, plus collect_rate_limits `continue`s past
        # a token whose probe fails, so one bad token deletes that token's series for the poll —
        # and `for: 5m` is the shortest window of the five, so a 70-120s roll eats a third of it.
        # LOW is the bad reading here, which is why this one does NOT use `max_over_time`: the
        # alert-preserving direction is `min_over_time` on the numerator. The denominator gets
        # `max_over_time` because bridging one side of a division leaves the other side empty and
        # takes the ratio with it (pool limits are constant, so that max IS the limit; if a pool
        # is ever resized mid-window, the larger denominator is the conservative read).
        # Price: a pool that RESETS keeps reading drained for ≤10m, and `{{ $value }}` reports the
        # window's low-water ratio. Both are asserted in loop-health.promtool-test.
        - alert: GithubRateLimitLow
          expr: >-
            min by (token, resource) (
              min_over_time(github_rate_limit_remaining[10m]) / max_over_time(github_rate_limit_limit[10m])
            ) < 0.10
          for: 5m
          labels:
            severity: warning
            # homelab#239, and the most literally self-referential of the set: the drained pool
            # belongs to an installation the fixer's own git token is minted from, so a worker
            # dispatched at this alert spends the pool it is reporting on and FATAL-aborts inside
            # it (the 2026-07-17 class this alert was built for). `token`/`resource` name an
            # identity, never a file.
            platform_machinery: "true"
          annotations:
            summary: "GitHub rate-limit pool under 10% ({{ $labels.token }}/{{ $labels.resource }})"
            description: '{{ $labels.token }} has {{ $value | humanizePercentage }} of its {{ $labels.resource }} pool left — consumers of this installation will start erroring "API rate limit exceeded" when it reaches 0; the pool resets at github_rate_limit_reset_timestamp.'
