      remoteRef: { key: REVIEWER_GH_APP_PRIVATE_KEY }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: rl-reviewer-git-gen
  namespace: monitoring
spec:
  appID: "4199252" # homelab-reviewer
  installID: "143941082"
  auth:
    privateKey:
      secretRef: { name: rl-reviewer-github-app, key: privateKey }
  permissions:
    metadata: read
  repositories: [oracle-fleet]
---
apiVersion: external-secrets.io/v1
