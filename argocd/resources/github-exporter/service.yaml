# Scraped via the ServiceMonitor next to this file; the Service name becomes the Prometheus
# job label ("github-exporter") — the alert exprs in prometheusrule.yaml depend on it.
apiVersion: v1
kind: Service
metadata:
  name: github-exporter
  labels:
    app: github-exporter
    # FU-098: LAN exposure of the /apps page — apps.teststuff.net rides HAProxy 3.25 → this
    # LB VIP (ip-plan mirror convention 3.25↔40.25; entries in ansible/group_vars/opnsense.yml).
    bgp: advertise
  annotations:
    lbipam.cilium.io/ips: "192.168.40.25"
spec:
  type: LoadBalancer
  selector:
    app: github-exporter
  ports:
    - name: http-metrics
      port: 9504
      targetPort: 9504
