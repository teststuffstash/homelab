# Inject the Garage admin credentials into the provider-terraform pod, so every
# Workspace's `provider "garage" {}` (configured in providerconfig.yaml) authenticates.
# GARAGE_ENDPOINT is the ClusterIP-only admin API on garage-0 (headless-svc DNS, :3903);
# GARAGE_TOKEN comes from the ESO-delivered garage-admin secret.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: terraform-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              # FU-082: provider-terraform runs `tofu` subprocesses — ~100Mi steady, spikes on
              # plan/apply. Requests lift it out of BestEffort; limit has real headroom so a big
              # plan degrades rather than OOM-kills mid-reconcile.
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits: { memory: "512Mi" }
              env:
                - name: GARAGE_ENDPOINT
                  value: http://garage-0.garage-headless.garage.svc.cluster.local:3903
                - name: GARAGE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: garage-admin
                      key: GARAGE_TOKEN
                # Infisical write creds — so app Workspaces can publish their generated
                # keys into Infisical (infisical_secret). Identity: crossplane-tf-writer
                # (tofu/infisical), project member. Host is set in the provider block.
                # FU-039 public ingress: the scoped Cloudflare write token (ESO ←
                # CLOUDFLARE_INGRESS_WRITE). OPTIONAL: until the operator arms the Infisical
                # key, the secret is absent and the provider still runs — only cloudflare
                # Workspaces fail (loudly). Arming this credential IS the human gate.
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-ingress-write
                      key: token
                      optional: true
                - name: INFISICAL_UNIVERSAL_AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: infisical-tf-writer
                      key: clientId
                - name: INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: infisical-tf-writer
                      key: clientSecret
