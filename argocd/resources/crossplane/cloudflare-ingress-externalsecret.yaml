# Scoped Cloudflare write token → provider-terraform (FU-039 public ingress). Stays NotReady
# until the operator stores CLOUDFLARE_INGRESS_WRITE in Infisical (minted by
# tofu/cloudflare-token/ingress-write.tf; the store script does the bookkeeping) — that single
# act arms the PublicRoute capability. Claims never see this secret; the composition is the
# privilege boundary (docs/cloudflare.md §Token matrix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ingress-write
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-ingress-write
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_INGRESS_WRITE
