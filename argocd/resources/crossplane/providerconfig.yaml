# Base Terraform config injected into every Garage Workspace: the jkossis/garage provider
# (reads GARAGE_ENDPOINT/GARAGE_TOKEN from the pod env, set by runtimeconfig.yaml) and a
# kubernetes backend for state (provider-terraform doesn't persist state itself — each
# workspace's state is a Secret in crossplane-system).
#
# Provider versions are PINNED (#1315, 2026-09-03): unpinned meant "latest at init", i.e. a
# Workspace's provider could change under it on any reconcile, and nothing in CI could validate
# against "whatever resolves today". The cloudflare pin is read by scripts/publicroute-tf-validate.sh
# and must equal the nix-packaged provider in devbox.json (the gate reds on a mismatch) — bump
# the two together. Note the engine is Terraform 1.5.5 (embedded in provider-terraform v1.1.1),
# so providers are pulled from registry.terraform.io by the reconciler.
apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  configuration: |
    terraform {
      required_providers {
        garage = {
          source  = "jkossis/garage"
          version = "1.0.5"
        }
        infisical = {
          source  = "Infisical/infisical"
          version = "0.19.30"
        }
        cloudflare = {
          source  = "cloudflare/cloudflare"
          version = "5.23.0"
        }
      }
      backend "kubernetes" {
        secret_suffix     = "garage"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }

    provider "garage" {}

    # PublicRoute Workspaces (FU-039 public ingress) — ROUTED THROUGH cf-api-proxy (operator
    # design session 2026-08-09): the reconciler holds NO Cloudflare credential; the proxy owns
    # the ingress-write token and enforces a method+path allowlist in git
    # (argocd/resources/cf-api-proxy). api_token is a non-empty placeholder the provider
    # requires — the proxy REPLACES the Authorization header. Unarmed now means: proxy absent
    # or its Infisical key missing → cloudflare Workspaces fail loudly, Cloudflare untouched.
    provider "cloudflare" {
      base_url  = "http://cf-api-proxy.cf-api-proxy.svc.cluster.local/client/v4"
      api_token = "XXXXXXXXXXXXXXroutedviacfapiproxyXXXXXXX" # 40-char dummy — the provider regex/length-validates; the proxy replaces the header
    }

    # App Workspaces can publish keys to Infisical. Auth via the crossplane-tf-writer
    # Universal-Auth creds in the pod env (INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET).
    # Only invoked by workspaces that declare infisical_* resources (others ignore it).
    provider "infisical" {
      host = "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080"
      auth = {
        universal = {}
      }
    }
