# CNPG belts that the instance belts cannot see (the rest of the CNPG rules live in
# argocd/platform/values/kube-prometheus-stack.yaml; this one is a CR so its fixture is drift-pinned —
# cnpg-availability.promtool-{rules,test}).
#
# The -rw Service is a cluster's ONLY write path, and CNPG empties it the moment a switchover starts
# (the old primary is labelled unhealthy) — every instance can stay Ready meanwhile. Found 2026-10-03
# (the ADR-147 rollout): a switchover deadlocked on WAL archiving left grafana-pg 10:23–10:33Z and
# forgejo-pg 10:35–10:45Z with no writable primary and nothing fired. Replay of this expr: exactly
# those two windows, and nothing else in 7 days but 1-minute cluster bootstraps (`for` absorbs them).
# An EMPTY EndpointSlice exports kube_endpointslice_info but no kube_endpointslice_endpoints at all,
# hence `unless`; `cnpg_collector_up` restricts it to namespaces that run CNPG.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-availability
  namespace: monitoring
  labels:
    app: pg-backup
spec:
  groups:
    - name: cnpg-availability
      rules:
        - alert: CNPGNoWritablePrimary
          expr: |
            (
              kube_endpointslice_info{endpointslice=~".+-rw-[a-z0-9]{5}"}
                unless on (namespace, endpointslice) kube_endpointslice_endpoints{ready="true"}
            )
            and on (namespace) count by (namespace) (cnpg_collector_up)
          for: 3m
          labels:
            severity: critical
            # triage: writes failing now; the CNPG Cluster status, pods and operator logs say why
            triage: now
          annotations:
            summary: "CloudNativePG cluster in {{ $labels.namespace }} has no writable primary"
            description: >-
              The {{ $labels.endpointslice }} Service in {{ $labels.namespace }} has had no ready
              endpoint for 3m — the CNPG cluster has no writable primary and its apps cannot write.
              Read the Cluster status (currentPrimary vs targetPrimary, phase) and the operator log;
              a switchover waiting on the old primary is the known shape (docs/postgres.md §Backups).

        # WAL archiving is failing on a primary. Postgres keeps every unarchived segment, so a dead
        # backup target fills the data volume and then stops the database (incident
        # 2026-11-20-nx-02-boot-disk: grafana-pg down ~8 h, nothing alerted on the cause). The expr is
        # upstream's (cloudnative-pg docs/src/samples/monitoring/prometheusrule.yaml,
        # LastFailedArchiveTime) — the operator chart ships no rules, the cluster chart has no archive
        # rule. Ours: every namespace (the instance rules' namespace list misses stacks), `for: 5m`
        # instead of 1m (the 11-21 reboot left two 1-minute blips). Replay 11-03→11-21: fires
        # 06:51Z on 11-20 on forgejo/infisical/grafana-pg (the target died 06:50Z), nothing else
        # beyond the blips. A cluster with no completed segment has nothing to fail on, so it joins
        # late (oracle-pg 02:17Z next day) — correct: nothing is lost until a segment waits.
        - alert: CNPGWALArchivingFailing
          expr: |
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
            and on (namespace, pod) cnpg_pg_replication_in_recovery == 0
          for: 5m
          labels:
            severity: warning
            # triage: the WAL is piling up on the volume now; the backup target (docs/postgres.md
            # §Backups) and the primary's archiver log say why — a fix is "bring the target back"
            triage: now
          annotations:
            summary: "WAL archiving failing on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >-
              The primary {{ $labels.pod }} has failed to archive WAL since its last success, so every
              new segment stays on its volume until the archive works again — at about 16 MB per
              archive_timeout it fills the volume, and a full volume stops the database. Check the
              backup Garage (docs/postgres.md §Backups, docs/longhorn-backup.md §The target) and the
              Cluster's ContinuousArchiving condition.
