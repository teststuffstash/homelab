# Pod admission — a pod the platform (or a stack) declared was REFUSED by PodSecurity.
#
# WHY THIS EXISTS (homelab#1845, 2026-09-21): wk-metal-02 became the third control plane
# (ADR-133) without the cluster-scoped CP patch talos.tf gives the VMs, so its apiserver ran
# PodSecurity WITHOUT `exemptions.runtimeClasses: [kata]`. A request reaching that apiserver —
# the endpoint VIP's holder — refused every kata+dind fixer ride with `violates PodSecurity
# "baseline:latest": privileged`, fleet-wide, and the platform learned it from a stack's issue.
# The signal was in Prometheus the whole time: `pod_security_evaluations_total{decision="deny",
# mode="enforce"}` on that one apiserver instance, and nowhere else in the prior 7 days.
#
# Every pod here is declared in git, so an ENFORCE-mode denial is never routine: it is drift
# between git and an apiserver's admission config, or a manifest regressing its securityContext.
#
# ⚠ THE NEW-SERIES BRANCH IS LOAD-BEARING. The deny counter is BORN at the first denial (the
# apiserver exports no zero series), and increase() needs two samples of a series — so on its own
# it cannot see the very first deny, which is the #1845 shape exactly (series born 15:39Z at 1,
# the next deny minutes later). `X unless X offset 10m` is "this series did not exist 10 min ago",
# i.e. its birth. Replayed 2026-09-21 over 09-14..09-21: fires at 15:39Z on the #679 rejection,
# never before.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-admission
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: pod-admission
      rules:
        - alert: PodSecurityEnforceDenied
          expr: |
            (
              sum by (instance, policy_level, resource) (
                increase(pod_security_evaluations_total{decision="deny",mode="enforce"}[10m])
              ) > 0
            )
            or
            (
              sum by (instance, policy_level, resource) (
                pod_security_evaluations_total{decision="deny",mode="enforce"}
                  unless pod_security_evaluations_total{decision="deny",mode="enforce"} offset 10m
              ) > 0
            )
          labels: { severity: warning }
          annotations:
            summary: "apiserver {{ $labels.instance }} refused a {{ $labels.resource }} under PodSecurity {{ $labels.policy_level }}"
            description: >-
              An enforce-mode PodSecurity denial on {{ $labels.instance }} — a declared {{
              $labels.resource }} was not admitted. SYMPTOM ONLY. First read: does the same pod
              pass on the OTHER apiservers? `kubectl --server=https://<cp-ip>:6443 apply
              --dry-run=server -f <pod>` per control plane. If only one instance denies, its
              machine config's admission block has drifted from the others (compare
              `talosctl -n <cp> get machineconfig -o yaml`, section admissionControl) — the
              2026-09-21 wk-metal-02 case. If all deny, a manifest's securityContext regressed or
              a namespace's `pod-security.kubernetes.io/enforce` label tightened.
