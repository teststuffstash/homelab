# The backup-puller's OPNsense API key (FU-013). Minted on the router by
# scripts/opnsense-api-users.sh (ansible/roles/opnsense-users), which stores the pair in the
# wallet (opnsense-backup-puller-api-{key,secret}, canonical) and in Infisical — ESO brings it here.
# The user holds page-diagnostics-configurationhistory + user-config-readonly only: it can read
# the revision history and download config.xml, and revertBackup/deleteBackup refuse it.
#
# Until the prod mint runs, this ES sits SecretSyncedError (the github-providerconfig precedent)
# and the CronJob stays suspended — see cronjob.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-backup-puller
  namespace: opnsense-config-backup
spec:
  refreshInterval: 1h
  secretStoreRef: { name: infisical, kind: ClusterSecretStore }
  target:
    name: opnsense-backup-puller
  data:
    - secretKey: api_key
      remoteRef: { key: OPNSENSE_BACKUP_PULLER_API_KEY }
    - secretKey: api_secret
      remoteRef: { key: OPNSENSE_BACKUP_PULLER_API_SECRET }
