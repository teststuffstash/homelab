apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - workspace.yaml
  - externalsecret.yaml
  - cronjob.yaml
  - networkpolicy.yaml
  - prometheusrule.yaml

# backup.py is ONE file shipped as a generated ConfigMap (hash-suffixed; kustomize rewrites the
# CronJob's volume reference) — the garage-write-probe shape.
configMapGenerator:
  - name: opnsense-config-backup
    namespace: opnsense-config-backup
    files:
      - backup.py
