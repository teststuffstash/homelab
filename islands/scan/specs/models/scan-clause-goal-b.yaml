# Trigger (b) hold of SCAN-CLAUSE-GOAL — the one model of its cases (goal #3656 child 3).
# One entry per case; every fact is stated once. `scripts/render_model.py` renders the page table
# (specs/scan-decision.md, between the generated markers) and trial/checkpoint-b-view.md from this file.
# The cell texts are the page's, verbatim: the legends on the page define what the literals state.
question: "Does trigger (b) fire while an assembly pull request is open?"
cases:
  - id: "child-set-complete"
    world: "goal-checkpoint"
    open_assembly_pr: "none"
    b_markers_on_it: "—"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-no-pr"
      marker_write: "none"
      b_next_wake: "fires-no-pr"
  - id: "lane-lost-stays-eligible ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "none"
    fault: "—"
    lane_winner: "another unit"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "none"
      b_next_wake: "fires-unmarked"
  - id: "selected-marks ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "none"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "on A"
      b_next_wake: "held"
  - id: "goal-checkpoint-b-held"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "the marker for A"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "held"
      marker_write: "none"
      b_next_wake: "held"
  - id: "old-fold-markers-not-identity ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "the ten recorded on #3270, none of them the marker for A"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "on A"
      b_next_wake: "held"
  - id: "marker-write-refused ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "none"
    fault: "the comment write answers 403"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "refused"
      b_next_wake: "fires-unmarked"
  - id: "marker-read-fails ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "the marker for A"
    fault: "the read of A's comments fails"
    lane_winner: "another unit"
    expect:
      b_this_wake: "fires-unreadable"
      marker_write: "none"
      b_next_wake: "held"
  - id: "pr-list-unreadable ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "none"
    fault: "the open-list read fails"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "no-decision"
      marker_write: "none"
      b_next_wake: "fires-unmarked"
  - id: "goal-checkpoint-b-replaced-releases"
    world: "goal-checkpoint"
    open_assembly_pr: "B (A is closed: not in the open list)"
    b_markers_on_it: "none on B; the marker for A stays on A"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "on B"
      b_next_wake: "held"
  - id: "quoted-marker-is-inert ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A"
    b_markers_on_it: "the marker for A, quoted (each line starts `> `)"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-unmarked"
      marker_write: "on A"
      b_next_wake: "held"
  - id: "head-not-goal-branch-is-no-assembly-pr ⚖"
    world: "goal-checkpoint"
    open_assembly_pr: "A, its head branch is not a `goal/**` branch"
    b_markers_on_it: "none"
    fault: "—"
    lane_winner: "this Goal"
    expect:
      b_this_wake: "fires-no-pr"
      marker_write: "none"
      b_next_wake: "fires-no-pr"
