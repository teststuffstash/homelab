[project]
name = "scan-island"
version = "0.1.0"
description = "The scan island (homelab islands/scan, goal #3389): built fresh against its specs, beside the old scripts. Provisional — nothing live reads it."
requires-python = ">=3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "allure-pytest>=2.16,<3",
    "jsonschema>=4.23,<5",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_island"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raw Allure results for every run; no publisher exists for this spec root yet (goal #3389 pin 6).
addopts = "--alluredir=allure-results --clean-alluredir --allure-no-capture"
# Case ids are the fixture row ids / spec description cells verbatim.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers = [
    "rule(id): the spec requirement this decision table proves (SCAN-…); fails at collection when specs/ has no such heading",
]

[tool.ruff]
line-length = 110
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
# ADR-143 floor (lock-intake-lint): a resolved version must be ≥ 7 days old. Bump this date when relocking.
exclude-newer = "2026-10-08T00:00:00Z"
