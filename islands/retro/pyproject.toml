[project]
name = "retro-island"
version = "0.1.0"
description = "Retro island (homelab islands/retro, Goal #3384): rows proven over the replay oracle. Not a package yet — no src/ and no build-system until the first component lands."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "allure-pytest>=2.16,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rule(id): the spec rule a case proves"]
pythonpath = ["tests"]
addopts = "--alluredir=allure-results --clean-alluredir --allure-no-capture"
# Row ids ARE the spec's description cells (they carry `⚖`); keep them unescaped in case ids.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.ruff]
line-length = 140
