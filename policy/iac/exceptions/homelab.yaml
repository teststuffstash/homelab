# The homelab (platform-repo) baseline for iac-no-cluster-scoped — the G01 enforcement flip's
# enabling piece (iac-lane.md §L0b / §The platform lane). The tenancy fence reads "cluster-scoped
# power objects are platform-owned and arrive via the homelab repo" — so on homelab itself the
# policy's job changes from "never" to "only the grants the platform already owns". This file IS
# that ownership list: every cluster-scoped resource homelab ships today, BY NAME. A PR adding a
# NEW ClusterRole/Namespace/CRD still goes red until the name is added here — and this file lives
# under /policy/, a tier-3 CODEOWNERS path, so widening the baseline always crosses the operator.
# The sentinel passes this file per-repo (--exceptions, matched on the repo it evaluates); the
# scanned PR tree's own copy is never read — rules and exceptions come from homelab master only.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: homelab-platform-baseline
spec:
  exceptions:
    - policyName: iac-no-cluster-scoped
      ruleNames:
        - no-cluster-scoped-power-kinds
  match:
    any:
      - resources:
          kinds:
            - Namespace
          names:
            - agent-coordinator
            - agent-egress
            - agent-runtime
            - arc-runners
            - cf-api-proxy
            - circles
            - circles-iac
            - dummy-apps # tests/kind-kargo/fixtures/apps.yaml — the kind e2e's target namespace, never synced to prod
            - homelab
            - node-maintenance
            - oracle-fleet
            - oracle-iac
            - oracle-kargo # the Kargo Project namespace (argocd/platform/kargo.yaml) — platform-precreated so the kargo SAs hold no namespace create
            - secrets-demo
            - sleep-iac
            - sleep-tracking
            - snore-recorder
      - resources:
          kinds:
            - ClusterRole
          names:
            - agent-coordinator
            - agent-gateway-tokenreview # FU-270: the agent-gateway's GW-SESSIONS-PULL TokenReview (create only — validates, cannot read or mint)
            - agent-read-app
            - agent-read-infra
            - agentstack-claims-read
            - alloy-logs-reader
            - crossplane-agentstack-composed
            - eso-transcripts-reader-ssrr
            - kps-lease-crds # ADR-150: the kube-prometheus-stack PostSync hook reads the monitoring.coreos.com CRDs' operator version (get/list only)
            - loki-rbac-proxy-authn
            - loki-tenant-reader
            - openrouter-proxy-semaphore
            - openrouter-proxy-tokenreview
            - pg-backup
            # Kargo (argocd/resources/kargo/rbac-cluster.yaml): the hand-written cluster grants that
            # REPLACE the chart's ClusterRoleBindings (kargo.yaml) — reads + per-Project writes,
            # admission-guarded by kargo-write-guard.
            - platform-kargo-api
            - platform-kargo-controller
            - platform-kargo-garbage-collector
            - platform-kargo-management-controller
            - platform-kargo-webhooks-server
      - resources:
          kinds:
            - ClusterRoleBinding
          names:
            - agent-coordinator
            - agent-coordinator-read-infra
            - agent-gateway-tokenreview # FU-270 (see the ClusterRole above)
            - agentstack-loop-read-infra
            - alloy-logs-reader
            - eso-retro-git-reader-ssrr
            - eso-kargo-git-reader-ssrr # kargo git-token mirror (argocd/resources/kargo-prod/git-token.yaml) → the eso-transcripts-reader-ssrr role
            - eso-transcripts-reader-ssrr
            - kps-lease-crds # ADR-150 (see the ClusterRole above)
            - loki-rbac-proxy-authn
            - openrouter-proxy-semaphore
            - openrouter-proxy-tokenreview
            - pg-backup
            - platform-kargo-api # Kargo (see the ClusterRoles above)
            - platform-kargo-controller
            - platform-kargo-garbage-collector
            - platform-kargo-management-controller
            - platform-kargo-webhooks-server
      - resources:
          kinds:
            - MutatingAdmissionPolicy
            - MutatingAdmissionPolicyBinding
          names:
            - pg-backup-default # ADR-147: CNPG Clusters wired to their namespace's backup store
      - resources:
          kinds:
            - ValidatingAdmissionPolicy
            - ValidatingAdmissionPolicyBinding
          names:
            - kargo-write-guard # argocd/resources/kargo/admission-policy.yaml: the belt over every kargo-SA write
      - resources:
          kinds:
            - PriorityClass
          names:
            - node-maintenance # the node-pinned maintenance CronJobs (node-fstrim) — preempt instead of OutOfcpu at kubelet admission (2026-10-09)
