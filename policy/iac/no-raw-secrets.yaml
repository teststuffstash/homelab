# IAC-G04 rule 1 — secret REFERENCES, never values (ADR-062/ADR-076, docs/agents/iac-lane.md L0).
# A rendered/committed v1 Secret in an -iac repo means secret material is riding git or a PR
# diff. The platform shape is ExternalSecret (Infisical via ESO) or a Crossplane connection
# secret written in-cluster — a raw Secret manifest is always wrong here.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: iac-no-raw-secrets
  annotations:
    policies.kyverno.io/description: "-iac repos carry secret references, never Secret values"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: no-v1-secret-manifests
      match:
        any:
          - resources:
              kinds: [Secret]
      validate:
        message: >-
          Raw v1/Secret manifests are forbidden in -iac repos (ADR-062: values live in
          KeePass/Infisical; delivery is ExternalSecret/ESO or a Crossplane
          writeConnectionSecretToRef — never git).
        deny: {}
