# VENDORED VERBATIM from github.com/kyverno/policies — best-practices-vpol/require-pod-requests-limits/require-pod-requests-limits.yaml
# Pin: commit 879f0814edec2bdf43b6940f9c5c0c1635c85e6a (main, 2026-10-25). The library publishes NO release tags (verified
# `gh api repos/kyverno/policies/tags` → [] and no releases), so the pin is a commit SHA; the same
# SHA is in every policy/component/ header and in scripts/component-check.sh's KYVERNO_POLICIES_SHA
# (Renovate: no customManager covers this yet — docs/renovate.md). Re-vendor = curl the raw file at
# a new SHA, replace everything below this header, update every pin line in one commit.
# Evaluated report-only by scripts/component-check.sh (validationActions: Audit upstream too).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      This policy validates that all containers have CPU and memory resource
      requests and memory limits defined.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/title: Require Requests and Limits
  name: require-requests-limits
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validationActions:
    - Audit
  validations:
    - expression: >-
        variables.allContainers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.requests.memory) &&
        c.resources.requests.memory != '' && has(c.resources.requests.cpu) &&
        c.resources.requests.cpu != '' && has(c.resources.limits) &&
        has(c.resources.limits.memory) && c.resources.limits.memory != '')
      message: >-
        CPU and memory resource requests and memory limits are required for
        containers.
  variables:
    - expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
      name: allContainers
