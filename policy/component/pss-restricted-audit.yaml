# LOCAL (not from kyverno/policies): the Pod Security Standards `restricted` profile as ONE audit
# view per workload, via Kyverno's native `validate.podSecurity` subrule — one finding lists every
# control a pod misses (allowPrivilegeEscalation, capabilities.drop, runAsNonRoot, seccompProfile…),
# where the library's pod-security-vpol/restricted/ set is seven separate policies and seven rows
# per pod. The subrule exists only on the kyverno.io/v1 ClusterPolicy API (deprecated in favour of
# CEL policies — the CLI still evaluates it; policy/iac/*.yaml is on the same API). This is the
# report-only AUDIT view for cluster-wide `restricted`; the per-namespace admission labels
# (require-namespace-pss-labels.yaml) carry whatever level each namespace actually enforces.
# Evaluated by scripts/component-check.sh; autogen covers Deployments/StatefulSets/DaemonSets/
# Jobs/CronJobs (kyverno autogen-* rules in the output).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: component-pss-restricted-audit
  annotations:
    policies.kyverno.io/description: "Pod Security Standards `restricted` as an audit view over every rendered workload"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: pss-restricted
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        podSecurity:
          level: restricted
          version: latest
