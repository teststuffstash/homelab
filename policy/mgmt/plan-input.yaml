# The management box's input allowlist (ADR-131, docs/management-box.md §MB3). READ FROM MASTER by
# the box (`git show origin/master:policy/mgmt/plan-input.yaml`), never from the PR under judgment —
# the sentinel principle. Codeowner-gated (/policy/): a PR that needs a wider allowlist lands the
# widening FIRST as its own change (the policy/iac/exceptions ordering rule), or it stays red —
# unless a human who has READ the diff orders the plan: `devbox run mgmt-human-plan -- <pr>` from
# the jail (docs/management-box.md §MB3 "When the box refuses"). The timer never plans a refused head.
#
# Why this file exists at all: unlike the iac-sentinel (PR tree as data), `tofu plan` EXECUTES the
# PR's chosen provider binaries and data sources with the root's credentials in the environment.
# Stage 1 (this file, over the PR tree as DATA) is what makes stage 2 (the plan) safe to run.
roots:                      # what the box plans; a PR path under the root's dir selects it
  main:         { dir: tofu,              apply: true,     # everything under tofu/ not claimed by another entry
                  inputs: [machines/machines.yaml],
                  apply_controlplane_config: false }
                  # `apply_controlplane_config` — the FU-097 auto-apply TOGGLE for Talos config applies on
                  # nodes whose declared role (node_install_targets, from the plan) is controlplane. false =
                  # a CP config change stays a human `mgmt-tf apply` even when it passes every other part
                  # of the precondition (scripts/mgmt-lib.sh mgmt_talos_gate): on 2026-09-20 a CP config
                  # apply took the API path down while every node read Ready. The OPERATOR flips it.
                  # `inputs`: files OUTSIDE the dir the root reads at plan time (locals.tf yamldecodes the
                  # inventory — every metal node, flag, zone and taint). A PR touching only one of these
                  # selected NO root before 2026-09-21 and got "no box-held surface touched" — #1716
                  # onboarded nx-01 that way, unplanned. Pure DATA (yamldecode, no path/exec surface), so
                  # stage 1 does not judge it; it only makes the plan — and its install-impact line — run.
  provisioning: { dir: tofu/provisioning, apply: false }
  github:       { dir: tofu/github,       apply: false,   # read-only PAT + Garage state, FU-238; applies stay on the host
                  plan_exclude_types: [github_repository, github_organization_ruleset],
                  plan_exclude_note: "GitHub returns these only to an admin-WRITE token; the box holds a read-only one — a change to them is judged by the host's github-tofu plan" }
                  # github_repository: GitHub hides repo merge settings (allow_*_merge, delete_branch_on_merge)
                  # from any token without admin WRITE → a read-only plan diffs all 13 repos forever.
                  # github_organization_ruleset: the endpoint requires org Administration WRITE for a
                  # fine-grained PAT (docs.github.com/rest/orgs/rules — "Get all organization repository
                  # rulesets"; 403 verified 2026-09-13 with read). Both stay host-only; REPO rulesets (the
                  # pinned required checks, ADR-130), org secrets and deploy keys read fine — the gate's parts.
  cloudflare:   { dir: tofu/cloudflare,   apply: false,   # read-only token (mgmt-read.tf), Garage state, FU-238; applies stay in the jail
                  plan_exclude_types: [data.cloudflare_zero_trust_tunnel_cloudflared_token],
                  plan_exclude_note: "the tunnel TOKEN is a credential read no Read group covers (401 under the read-all token) — its two in-cluster dependents, the cloudflared Secret and Deployment, drop out with it; a change to them is judged by the jail's plan" }
                  # ⚠ not cone-clean for the BELT (mgmt-probe.sh): half the root rides the kubernetes provider,
                  # so its plan asserts the cluster is up — the sentinel plans it per PR head, the belt does not.
foreign_roots:              # planned elsewhere (host / jail) — a PR touching only these gets "no box-held surface"
  - tofu/cloudflare-token
  - tofu/infisical
deny_paths:                 # basename globs a PR may not touch inside a root (stage 1) — provider/backend/CLI surface
  - ".terraform.lock.hcl"
  - "versions.tf"
  - "providers.tf"
  - "backend.tf"
  - "*.tfvars"
  - "*.tfvars.json"      # auto-loaded like tfvars (review finding, #1619)
  - "*.auto.tfvars*"
  - "*.tf.json"          # config in JSON evades the ERE patterns below
  - "*.tfrc"
  - ".terraformrc"
  - "*.sh"
deny_patterns:              # ERE over the ADDED lines of the PR diff inside a root (stage 1)
  - 'data[[:space:]]+"external"'
  - 'data[[:space:]]+"http"'
  # Word-bounded + the type string: the bare `provisioner[[:space:]]` matched every
  # `storage_provisioner = "driver.longhorn.io"` (a StorageClass refused on #1843).
  - '(^|[^_[:alnum:]])provisioner[[:space:]]+"'
  - 'required_providers'
  - 'backend[[:space:]]+"'
  - 'encryption[[:space:]]*\{'
  - '(file|fileset|filebase64|templatefile)\([[:space:]]*"(/|\.\.)'
  - 'path\.cwd'
  - 'local-exec|remote-exec'
  - 'source[[:space:]]*=[[:space:]]*"(git|hg|s3|gcs|https?)::?'   # remote module sources: init would FETCH them
  # A `provider "x" {}` block is endpoint + credential surface (a second instance can point the
  # root's token at any host), and the basename deny on providers.tf covers only the conventional
  # file — probed 2026-09-16: the same block inside tofu/nx02.tf passed stage 1. The `provider =`
  # META-ARGUMENT on a resource (an alias reference) stays allowed: no `"` follows the word.
  - '^[[:space:]]*provider[[:space:]]+"'
  # A plan READS what a data source or an import block names, with the root's credentials — for
  # the kubernetes provider that is the cluster-admin kubeconfig (no scoped variant yet, FU-012),
  # and a "not found" error quoted back would make the sentinel an existence oracle for any
  # object in any namespace, from any PR (review finding on homelab#1635 — it applied to `main`
  # since day one, not only to the cloudflare root). New ones land as their own change, planned
  # by a human in the jail; the resources the roots already declare plan as before.
  - 'data[[:space:]]+"kubernetes_'
  - '^[[:space:]]*import[[:space:]]*\{'
apply_addresses:            # resource addresses (globs) the box may APPLY unattended — the residue (operator, 2026-09-13)
  main:
    - "kubernetes_config_map.*"
    - "kubernetes_namespace.*"
    - "kubernetes_deployment.ha"
    - "kubernetes_service.ha"
    - "kubernetes_persistent_volume_claim.ha"
    - "kubernetes_deployment.unifi"
    - "kubernetes_deployment.mongo"
    - "kubernetes_service.unifi"
    - "kubernetes_service.mongo"
    - "kubernetes_persistent_volume_claim.mongo"
    - "kubernetes_persistent_volume_claim.config"
    # Seed images (ADR-014 nocloud/metal images, the ci-runner cloud image): a download is inert until
    # a VM names it, and a VM that re-points at a new one is a proxmox_virtual_environment_vm change —
    # outside this list, so that plan is refused whole (operator, 2026-09-22).
    - "proxmox_download_file.*"
    # Talos machine-config applies (FU-097's first toggle, 2026-09-22) — inside the allowlist is NOT
    # enough: every change must also pass mgmt_talos_gate (in-place update, apply_mode = no_reboot,
    # a worker unless apply_controlplane_config above), and the apply is bracketed by the health
    # gate (docs/management-box.md §MB3 "Talos config applies"). `\[` = a literal `[` (case glob).
    - 'talos_machine_configuration_apply.node\[*'
    - 'talos_machine_configuration_apply.metal\[*'
