# Baked into the ARC runner image (FU-015). The first substituter is the in-cluster
# pull-through mirror of cache.nixos.org (argocd/resources/nix-cache, BGP VIP — reachable from
# runner pods without relying on cluster DNS search paths). Bodies pass through byte-for-byte,
# so upstream signatures stay valid — no extra trusted key. WAN cache is the fallback.
experimental-features = nix-command flakes
substituters = http://192.168.40.23 https://cache.nixos.org
