# deploy-revert-argo — FU-044's DETERMINISTIC half: auto-rollback of a broken deploy.
#
# argocd-notifications POSTs a post-sync Degraded app to /deploy-degraded (tofu/argocd.tf,
# oncePer revision) → this Sensor → a script (no LLM): if the app's source is a *-iac repo and
# a deploy/* bump PR merged there within the window, `git revert` that squash commit as a new
# auto-merging PR — the ADR-084 CI-only lane IS the rollback authority (ArgoCD re-syncs the
# previous pin; sharpened by meta-11: ArgoCD health alone is NOT the acceptance gate — the
# FU-102 prober is the deep post-deploy check; this path only catches what Degraded DOES see).
# Roll-FORWARD (dispatch a worker against the app repo) stays the LLM half — the responder /
# coordinator lanes own it; a revert PR here never blocks that (revert-then-fix composes).
#
# PLATFORM SCOPE (IAC-G09, operator 2026-08-04): homelab is wired in too, but NOT under the blanket
# rule — only for the REVERSIBLE CLASS. A candidate merge qualifies only if every content line of
# its diff is a first-party image pin; chart bumps, values edits and anything with CRD/schema or
# data-layer coupling drop to report-only. Reverting garage or CNPG can be worse than the failure it
# answers, and on the platform there is no second net if the revert fails too.
#
# Idempotency: branch name revert-<app>-<sha8> (deterministic; second attempt hits
# already-exists), plus the responder-seen cm ledger keyed deploy-<app>-<revision>. Guards:
# non--iac sources exit report-only; no recent bump = "degraded without a deploy" report-only
# (not a rollback case); every probe failure is loud and fail-closed (no revert on bad data).
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: deploy-revert
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review
    # homelab#103: was BestEffort — no requests at all. Same values as the coordinate/review
    # Sensors. CPU requests only (no CPU limit), memory limited — this file set's norm.
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  dependencies:
    - name: degraded-dep
      eventSourceName: agent-loop
      eventName: deploy-degraded
    # FU-1990 part 2: the pin-revert chain — Alertmanager POSTs GithubWorkflowRunFailed here when
    # a master-branch CI run fails. The workflow checks whether the newest merged PR was pin-only
    # (scripts/pin-only-lint.sh third shape: `uses: owner/repo@sha # tag`) and reverts it if so.
    - name: workflow-failed-dep
      eventSourceName: agent-loop
      eventName: workflow-failed
    # #1988's class row (2026-09-28): KubeDeploymentRolloutStuck on a tofu-managed Deployment —
    # the tofu-image-revert chain (the third template below).
    - name: rollout-stuck-dep
      eventSourceName: agent-loop
      eventName: rollout-stuck
    # S9 #1988 (2026-10-04): MgmtApplyErroredOnNewProvider — the box's first changing apply under a
    # new provider version errored; the tofu-provider-revert chain (the fourth template below).
    - name: provider-errored-dep
      eventSourceName: agent-loop
      eventName: provider-errored
  triggers:
    - rateLimit: { unit: Minute, requestsPerUnit: 4 }
      template:
        name: submit-deploy-revert
        conditions: "degraded-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: deploy-revert-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: deploy-revert }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: degraded-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
    # FU-1990 part 2: the pin-revert trigger — fires on workflow-failed-dep, submits the
    # workflow-pin-revert WorkflowTemplate. Rate-limited separately from the deploy-revert trigger.
    - rateLimit: { unit: Minute, requestsPerUnit: 4 }
      template:
        name: submit-workflow-pin-revert
        conditions: "workflow-failed-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: workflow-pin-revert-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: workflow-pin-revert }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: workflow-failed-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
    # #1988's class row: the tofu-image-revert trigger — fires on rollout-stuck-dep, submits the
    # tofu-image-revert WorkflowTemplate. Rate-limited separately.
    - rateLimit: { unit: Minute, requestsPerUnit: 4 }
      template:
        name: submit-tofu-image-revert
        conditions: "rollout-stuck-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tofu-image-revert-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: tofu-image-revert }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: rollout-stuck-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
    # S9 #1988: the tofu-provider-revert trigger — fires on provider-errored-dep. Rate-limited separately.
    - rateLimit: { unit: Minute, requestsPerUnit: 4 }
      template:
        name: submit-tofu-provider-revert
        conditions: "provider-errored-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tofu-provider-revert-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: tofu-provider-revert }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: provider-errored-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deploy-revert
  namespace: agent-coordinator
spec:
  entrypoint: revert
  serviceAccountName: agent-coordinator
  # homelab#103 soft hostname spread — rationale on the `switchboard` WorkflowTemplate (coordinate-argo.yaml — was `coordinate`, ADR-120)
  # (coordinate-argo.yaml). Verbatim copy; keep in sync.
  # homelab#867 soft Longhorn-disk de-preference — same rationale.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: revert
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: deploy-revert-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
          # Only bumps merged within this window are revert candidates — an app that degrades a
          # day after a deploy is an incident (responder lane), not a rollback.
          - { name: REVERT_WINDOW_MIN, value: "120" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            printf '%s' "$PAYLOAD" > /tmp/degraded.json
            APP="$(jq -r '.app // empty' /tmp/degraded.json)"
            REVISION="$(jq -r '.revision // empty' /tmp/degraded.json)"
            REPO_URL="$(jq -r '.repo // empty' /tmp/degraded.json)"
            APP_PATH="$(jq -r '.path // empty' /tmp/degraded.json)"
            [ -n "$APP" ] || { echo "no app in payload — nothing to do"; exit 0; }
            SLUG="$(printf '%s' "$REPO_URL" | sed -E 's#^https://github.com/##; s#\.git$##')"
            # homelab is the platform's own -iac, but it does NOT get the blanket rule: IAC-G09
            # (operator, 2026-08-04) scopes auto-revert here to the REVERSIBLE CLASS only. The
            # predicate is enforced below, after a candidate exists.
            REVERSIBLE_ONLY=0
            BODY_EXTRA=""   # set -u: the PR body interpolates this unconditionally
            case "$SLUG" in
              teststuffstash/*-iac)   : ;;
              teststuffstash/homelab) REVERSIBLE_ONLY=1 ;;
              *) echo "→ $APP degraded but source '$SLUG' is not a *-iac repo — not a rollback case (report-only)"; exit 0;;
            esac

            # Ledger: one revert decision per (app, revision).
            KEY="deploy-$(printf '%s' "${APP}-${REVISION}" | sha256sum | cut -c1-16)"
            SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.$KEY}" 2>/dev/null || true)"
            [ -n "$SEEN" ] && { echo "→ $APP@${REVISION:0:8}: already handled ($SEEN) — skip"; exit 0; }
            kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"$KEY\":\"$(date -u +%Y-%m-%dT%H:%MZ)\"}}" >/dev/null 2>&1 \
              || echo "WARN: ledger patch failed — branch-name idempotency is the remaining belt"

            # The revert candidate: newest -iac merge within the window whose files touch the
            # app's path. IAC-G02 (2026-08-02): ANY -iac merge, not only deploy/* bumps — a
            # fixer-issue merge (IAC-T03) that degrades the stack was invisible to this chain.
            # revert-* branches excluded (never revert a revert — that ping-pongs).
            # Fail-closed: no candidate = report-only.
            # >>>REPLAY:deploy-revert-candidate>>>
            # ⚠ `gh … --jq` takes ONLY the expression — it is not jq's CLI, so `--jq --arg cutoff …`
            # is "unknown arguments" and, behind `2>/dev/null || true`, read as "no candidate" on
            # every run (the 2026-09-27 rollback drill on agent-coordinator found it, homelab#1990;
            # this chain had never found a candidate either). The cutoff is embedded in the
            # expression. CUTOFF is overridable so a replay can pin the date.
            CUTOFF="${CUTOFF:-$(date -u -d "-${REVERT_WINDOW_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)}"
            CAND="$(gh pr list --repo "$SLUG" --state merged --limit 10 \
              --json number,title,headRefName,mergedAt,mergeCommit \
              --jq "[.[] | select((.headRefName | startswith(\"revert-\")) | not) | select(.mergedAt >= \"$CUTOFF\")] | sort_by(.mergedAt) | last | select(.)" 2>/dev/null || true)"
            [ -n "$CAND" ] || { echo "→ $APP degraded with NO -iac merge in the last ${REVERT_WINDOW_MIN}m — not a rollback case (responder/operator lane owns it)"; exit 0; }
            # <<<REPLAY:deploy-revert-candidate<<<
            PRNUM="$(printf '%s' "$CAND" | jq -r .number)"
            SHA="$(printf '%s' "$CAND" | jq -r .mergeCommit.oid)"
            TITLE="$(printf '%s' "$CAND" | jq -r .title)"
            # Path affinity: the bump must touch the degraded app's path (multi-app -iac repos).
            if [ -n "$APP_PATH" ] && ! gh pr view "$PRNUM" --repo "$SLUG" --json files --jq '.files[].path' 2>/dev/null | grep -q "^${APP_PATH}/"; then
              echo "→ bump PR #$PRNUM does not touch ${APP_PATH}/ — not this app's deploy (report-only)"; exit 0
            fi

            # ── IAC-G09: the reversible-class predicate (homelab only) ────────────────────────
            # The ruling is a PRECONDITION, not an app list, so it survives new apps: revert
            # automatically only where the change is a PIN and the rollback is provably as safe as
            # the roll-forward. Mechanically that means every content line of the candidate diff is
            # a first-party image pin. A chart-version bump, a values edit, a CRD or anything with
            # data-layer coupling fails this and drops to report-only — reverting garage or CNPG can
            # be worse than the failure it answers, and here there is no second net.
            # Same shape as scripts/pin-only-lint.sh, and deliberately so: a regex cannot be talked
            # past. Empty/unreadable diff is fail-closed, never "no offending lines found".
            if [ "$REVERSIBLE_ONLY" = 1 ]; then
              DIFF="$(gh pr diff "$PRNUM" --repo "$SLUG" 2>/dev/null || true)"
              if [ -z "$DIFF" ]; then
                echo "→ cannot read the diff of $SLUG#$PRNUM — refusing to classify it (report-only)"; exit 0
              fi
              OFFENDING="$(printf '%s\n' "$DIFF" | grep -E '^[-+][^-+]' \
                | grep -Ev '^[-+][[:space:]]*image:[[:space:]]*ghcr\.io/teststuffstash/[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+$' || true)"
              if [ -n "$OFFENDING" ]; then
                echo "→ $SLUG#$PRNUM is NOT a first-party pin bump — outside the reversible class (IAC-G09), report-only:"
                printf '%s\n' "$OFFENDING" | head -20
                exit 0
              fi
              echo "→ IAC-G09: $SLUG#$PRNUM is pin-only — inside the reversible class"
              # No special merge handling: homelab's CODEOWNERS still applies to the revert PR. On
              # the un-owned pin paths (scripts/pin-only-lint.sh stands in for the owner there) it
              # auto-merges; on an owned path it simply waits for a human. Both are correct — the
              # thing we refuse to do is bypass the gate to make the rollback faster.
              # printf, not a multi-line shell string: a literal newline at column 0 would close
              # this YAML block scalar, and indenting it instead would emit a markdown code block.
              BODY_EXTRA="$(printf '\n\n**Scope:** IAC-G09 reversible class — every changed line in #%s is a first-party image pin, so this rollback is provably as safe as the roll-forward. Chart bumps, values edits and anything with CRD/schema or data-layer coupling never reach this path.' "$PRNUM")"
            fi

            echo "→ REVERTING $SLUG#$PRNUM ($TITLE) — $APP Degraded on revision ${REVISION:0:8} within ${REVERT_WINDOW_MIN}m of the merge"
            BR="revert-${APP}-$(printf '%s' "$SHA" | cut -c1-8)"
            rm -rf /work/iac
            # >>>REPLAY:deploy-revert-token-clone>>>
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
            # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
            # old anonymous behavior (degrade, never a new hard dependency).
            _cu="https://github.com/${SLUG}.git"
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            # <<<REPLAY:deploy-revert-token-clone<<<
            git clone -c "$_ah" --depth 30 "$_cu" /work/iac
            cd /work/iac
            git config user.name "deploy-revert (FU-044)"
            git config user.email "noreply@teststuff.net"
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "→ branch $BR already exists — a racing instance owns it (idempotent exit)"; exit 0
            fi
            git checkout -b "$BR"
            git revert --no-edit "$SHA" || { echo "FATAL: git revert conflicted — human/coordinator lane (no blind force)"; exit 1; }
            git push origin "$BR"
            PR="$(gh pr create --repo "$SLUG" --base master --head "$BR" \
              --title "revert: ${TITLE} (auto-rollback — ${APP} Degraded post-deploy)" \
              --body "FU-044 deterministic rollback: ArgoCD app **${APP}** went Degraded on revision \`${REVISION:0:8}\` within ${REVERT_WINDOW_MIN}m of #${PRNUM} merging. Reverting the bump restores the previous pin (ArgoCD re-syncs on merge). Roll-FORWARD (a worker fixing the app repo) composes on top — this only stops the bleeding. CI-only lane; no approval gate by design (ADR-084).${BODY_EXTRA}" \
              | grep -oE '[0-9]+$')"
            gh pr merge --auto --squash "$PR" --repo "$SLUG"
            echo "→ revert PR $SLUG#$PR armed (auto-merges on CI green)"
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { memory: "512Mi" }
---
# workflow-pin-revert — FU-1990 part 2: deterministic revert of a pin-only workflow PR whose CI
# just failed on master. The trigger is GithubWorkflowRunFailed on master/main branch; the workflow
# finds the newest merged PR within the revert window whose files touch `.github/workflows/`, checks
# if every changed line is a `uses:` pin (the third shape from scripts/pin-only-lint.sh), and if so:
#   (a) reverts the merge commit as a new auto-merging PR
#   (b) records the reverted pins (the versions reverted FROM) as a machine-readable
#       `reverted-pins:` line in the revert PR body. Renovate re-proposes a merged-then-reverted
#       version on its next run (a MERGED PR is not a rejected one), and that re-opened PR does
#       not exist yet at revert time — so the refusal happens later, in scripts/pin-only-lint.sh
#       check (e), inside every platform repo's required `ci`: a Renovate PR that re-adds a pin
#       listed on a merged `revert-wf-*` PR of the last 30 days stays RED until Renovate moves it
#       to a newer release (one gate for the mechanical and the lens-reviewed lane alike).
#   (c) the revert PR follows the same pattern as deploy-revert (branch name, commit message, body)
#       and carries `automerge` + `dependencies`: the platform repos require ONE approving review
#       (tofu/github protected_repos), and the renovate-approve reflex posts it for exactly that
#       label pair — without the labels the revert would sit BLOCKED on a human forever.
#
# COMPOSITION with the responder lane: Alertmanager routes GithubWorkflowRunFailed to BOTH
# deploy-pin-revert (this workflow) AND agent-responder (the triage lane, when not paused). The
# revert stops the bleeding deterministically; the triage investigates the root cause. The two
# paths are independent and compose — a revert does not prevent a triage, and a triage does not
# prevent a revert.
#
# IDEMPOTENCY: branch name revert-wf-<sha8> (deterministic; second attempt hits already-exists),
# plus the responder-seen cm ledger keyed wf-<repo>-<sha>. Guards: non-master/main = report-only;
# no recent workflow-pin merge = report-only; every probe failure is loud and fail-closed (no revert
# on bad data). The pin-only predicate is fail-closed: empty/unreadable diff = FAIL, never "no
# offending lines found".
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: workflow-pin-revert
  namespace: agent-coordinator
spec:
  entrypoint: revert
  serviceAccountName: agent-coordinator
  # Same podSpecPatch as deploy-revert (homelab#103 soft hostname spread, homelab#867 soft Longhorn-
  # disk de-preference). Verbatim copy; keep in sync.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: revert
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: workflow-pin-revert-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
          # Only bumps merged within this window are revert candidates — a failure a day after a
          # merge is an incident (responder lane), not a rollback.
          - { name: REVERT_WINDOW_MIN, value: "120" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            printf '%s' "$PAYLOAD" > /tmp/alert.json

            # Alertmanager POSTs an array of alerts; we only care about firing ones on master/main.
            # The payload structure: {"alerts": [{"status": "firing"|"resolved", "labels": {...}, ...}]}
            ALERT="$(jq -c '.alerts[] | select(.status == "firing") | select(.labels.branch == "master" or .labels.branch == "main") | .labels' /tmp/alert.json 2>/dev/null | head -1)"
            [ -n "$ALERT" ] || { echo "→ no firing master/main alert in payload — nothing to do"; exit 0; }

            OWNER="$(printf '%s' "$ALERT" | jq -r '.owner // empty')"
            REPO="$(printf '%s' "$ALERT" | jq -r '.repo // empty')"
            WF="$(printf '%s' "$ALERT" | jq -r '.workflow // empty')"
            BRANCH="$(printf '%s' "$ALERT" | jq -r '.branch // empty')"
            SLUG="${OWNER}/${REPO}"

            [ -n "$OWNER" ] && [ -n "$REPO" ] || { echo "→ no owner/repo in alert — nothing to do"; exit 0; }
            echo "→ $SLUG workflow '$WF' failed on $BRANCH"

            # Ledger: one revert decision per (repo, merge-sha). Keyed on the merge commit, not the
            # alert fingerprint — a flapping workflow that fails, succeeds, fails again should not
            # mint multiple revert PRs for the same merge.
            # We compute the key AFTER finding the candidate below.

            # The revert candidate: newest merge within the window whose files touch .github/workflows/.
            # revert-* branches excluded (never revert a revert — that ping-pongs).
            # Fail-closed: no candidate = report-only.
            # >>>REPLAY:workflow-pin-revert-candidate>>>
            # ⚠ `gh … --jq` takes ONLY the expression (not jq's CLI): `--jq --arg cutoff …` was
            # "unknown arguments" and, behind `2>/dev/null || true`, read as "no candidate" on every
            # run — the 2026-09-27 drill (agent-coordinator#20, homelab#1990) fired the whole chain
            # and the workflow exited 0 here, report-only. The cutoff is embedded; CUTOFF is
            # overridable so a replay can pin the date. Same fix in deploy-revert above.
            CUTOFF="${CUTOFF:-$(date -u -d "-${REVERT_WINDOW_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)}"
            CAND="$(gh pr list --repo "$SLUG" --state merged --limit 10 \
              --json number,title,headRefName,mergedAt,mergeCommit,files \
              --jq "[.[] | select((.headRefName | startswith(\"revert-\")) | not) | select(.mergedAt >= \"$CUTOFF\") | select(.files[]?.path | startswith(\".github/workflows/\"))] | sort_by(.mergedAt) | last | select(.)" 2>/dev/null || true)"
            [ -n "$CAND" ] || { echo "→ $SLUG: NO workflow-touching merge in the last ${REVERT_WINDOW_MIN}m — not a rollback case (responder/operator lane owns it)"; exit 0; }

            PRNUM="$(printf '%s' "$CAND" | jq -r .number)"
            SHA="$(printf '%s' "$CAND" | jq -r .mergeCommit.oid)"
            TITLE="$(printf '%s' "$CAND" | jq -r .title)"
            echo "→ candidate: $SLUG#$PRNUM @ ${SHA:0:8} ($TITLE)"
            # <<<REPLAY:workflow-pin-revert-candidate<<<

            # Ledger check (now that we have the SHA).
            KEY="wf-$(printf '%s' "${SLUG}-${SHA}" | sha256sum | cut -c1-16)"
            SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.$KEY}" 2>/dev/null || true)"
            [ -n "$SEEN" ] && { echo "→ $SLUG@$SHA: already handled ($SEEN) — skip"; exit 0; }
            kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"$KEY\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" >/dev/null 2>&1 \
              || echo "WARN: ledger patch failed — branch-name idempotency is the remaining belt"

            # ── THE PIN-ONLY PREDICATE (scripts/pin-only-lint.sh third shape) ───────────────────
            # Every changed line in the diff must be a `uses:` pin line:
            #   `uses: <owner>/<repo>@<40-hex sha> # <tag>`
            # where tag is `v<digits>` with up to two `.<digits>` groups. Leading YAML indentation
            # and an optional `- ` list marker allowed. Nothing else.
            # Fail-closed: empty/unreadable diff = FAIL, never "no offending lines found".
            DIFF="$(gh pr diff "$PRNUM" --repo "$SLUG" 2>/dev/null || true)"
            if [ -z "$DIFF" ]; then
              echo "→ cannot read the diff of $SLUG#$PRNUM — refusing to classify it (report-only)"; exit 0
            fi

            # Extract content lines only (strip +++ / --- headers, keep real additions/removals).
            CONTENT_LINES="$(printf '%s\n' "$DIFF" | grep -E '^[-+][^-+]' || true)"
            if [ -z "$CONTENT_LINES" ]; then
              echo "→ $SLUG#$PRNUM has no content lines in the diff — not a pin bump (report-only)"; exit 0
            fi

            # The pin-line regex (same grammar as scripts/pin-only-lint.sh WORKFLOW_PIN_LINE).
            PIN_LINE_RE='^[-+][[:space:]]*(- )?uses:[[:space:]]*[A-Za-z0-9-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]+v[0-9]+(\.[0-9]+){0,2}$'
            OFFENDING="$(printf '%s\n' "$CONTENT_LINES" | grep -Ev "$PIN_LINE_RE" || true)"
            if [ -n "$OFFENDING" ]; then
              echo "→ $SLUG#$PRNUM is NOT pin-only — outside the revert class, report-only:"
              printf '%s\n' "$OFFENDING" | head -20
              exit 0
            fi

            echo "→ $SLUG#$PRNUM is pin-only — inside the revert class"

            # ── THE REVERTED PINS (for the CI refusal, pin-only-lint check (e)) ────────────────────────────────
            # In the ORIGINAL PR's diff the `+` lines are the versions this revert removes again.
            # They go into the revert PR body as one `reverted-pins:` line; pin-only-lint check (e)
            # refuses a Renovate PR that re-adds any of them (header note (b)). The refusal
            # cannot happen here: Renovate re-creates the PR only AFTER this revert merges.
            # >>>REPLAY:workflow-pin-revert-reverted-pins>>>
            REVERTED_PINS="$(printf '%s\n' "$CONTENT_LINES" | grep '^+' | sed -E 's/^[-+][[:space:]]*(- )?uses:[[:space:]]*([A-Za-z0-9-]+\/[A-Za-z0-9_.-]+@[0-9a-f]{40}).*/\2/' | sort -u | tr '\n' ' ' | sed 's/ $//' || true)"
            echo "→ reverted pins: ${REVERTED_PINS:-<none>}"
            # <<<REPLAY:workflow-pin-revert-reverted-pins<<<

            echo "→ REVERTING $SLUG#$PRNUM ($TITLE) — workflow '$WF' failed on $BRANCH within ${REVERT_WINDOW_MIN}m of the merge"
            BR="revert-wf-$(printf '%s' "$SHA" | cut -c1-8)"
            rm -rf /work/repo
            # >>>REPLAY:deploy-revert-token-clone>>>
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst.
            _cu="https://github.com/${SLUG}.git"
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            # <<<REPLAY:deploy-revert-token-clone<<<
            git clone -c "$_ah" --depth 30 "$_cu" /work/repo
            cd /work/repo
            git config user.name "workflow-pin-revert (FU-1990)"
            git config user.email "noreply@teststuff.net"
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "→ branch $BR already exists — a racing instance owns it (idempotent exit)"; exit 0
            fi
            git checkout -b "$BR"
            git revert --no-edit "$SHA" || { echo "FATAL: git revert conflicted — human/coordinator lane (no blind force)"; exit 1; }
            git push origin "$BR"
            # Compute the PR body — printf, not a multi-line shell string: a literal newline at column 0
            # would close this YAML block scalar, and indenting it instead would emit a markdown code block.
            RUN_NUM="$(printf '%s' "$ALERT" | jq -r '.number')"
            BODY="$(printf 'FU-1990 deterministic rollback: workflow **%s** failed on `%s` within %sm of #%s merging. The merge was pin-only (every changed line is a `uses:` pin), so reverting restores the previous action SHAs. A Renovate PR that re-proposes a reverted pin is refused by pin-only-lint check (e) in ci (it stays red until Renovate proposes a newer release). Mechanical lane: `automerge` + `dependencies` → the reflex approves, CI is the gate (ADR-100).\n\n**Reverted PR:** #%s — %s\n**Failed workflow:** %s on %s (run #%s)\n\nreverted-pins: %s' \
              "$WF" "$BRANCH" "$REVERT_WINDOW_MIN" "$PRNUM" "$PRNUM" "$TITLE" "$WF" "$BRANCH" "$RUN_NUM" "$REVERTED_PINS")"
            PR="$(gh pr create --repo "$SLUG" --base master --head "$BR" \
              --title "revert: ${TITLE} (auto-rollback — workflow '${WF}' failed post-merge)" \
              --body "$BODY" \
              | grep -oE '[0-9]+$')"
            # >>>REPLAY:workflow-pin-revert-merge-lane>>>
            # The MECHANICAL lane, same as the deploy-pin job: the platform repos require one
            # approving review and the renovate-approve reflex posts it ONLY for this label pair
            # (Bot author + automerge + dependencies). Labels BEFORE arming — the `labeled` event is
            # what fires the reflex. Fail loudly: an unlabelled revert waits on a human, silently.
            gh pr edit "$PR" --repo "$SLUG" --add-label automerge --add-label dependencies \
              || { echo "FATAL: could not label $SLUG#$PR — the reflex will not approve it (a human must)"; exit 1; }
            gh pr merge --auto --squash "$PR" --repo "$SLUG"
            echo "→ revert PR $SLUG#$PR labelled automerge+dependencies and armed (reflex approves, auto-merges on CI green)"
            # <<<REPLAY:workflow-pin-revert-merge-lane<<<
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { memory: "512Mi" }
---
# tofu-image-revert — #1988's class row (2026-09-28, ADR-141 amended): deterministic revert of an
# IMAGE-LINE-ONLY tofu PR whose Deployment rollout is STUCK after the management box applied it.
# The trigger is KubeDeploymentRolloutStuck (kube-prometheus default: Progressing=false for 15m; the
# Deployment's own progressDeadlineSeconds=600 sets the condition — a bad tag is ImagePullBackOff or
# a crash-looping new ReplicaSet, and with RollingUpdate max_unavailable=0 the OLD pods keep serving
# meanwhile, ADR-140 as amended). The workflow walks the merges under tofu/ in the window
# NEWEST-FIRST and takes the first whose EVERY changed line is `image = "<ref>"` (the fourth pin
# shape, scripts/pin-only-lint.sh check (f)) — a later, unrelated tofu merge never masks the bump —
# and whose changed files DECLARE the stuck Deployment (a newer bump on ANOTHER Deployment is walked
# past too), and if so:
#   (1) reverts the merge commit on a `revert-img-<sha8>` branch,
#   (2) records the reverted image refs on a `reverted-images:` body line — pin-only-lint check (f)
#       refuses a Renovate PR that re-adds any of them for REVERT_MEMORY_DAYS, so the lane never
#       loops merge → stuck → revert → re-propose → merge,
#   (3) opens the revert as `automerge`+`dependencies` and arms it — the reflex approves, CI is the
#       gate, the box applies the revert on its next pull (kubernetes_deployment.* is allowlisted).
# COMPOSITION: Alertmanager routes KubeDeploymentRolloutStuck to BOTH this chain and the responder.
# SAFETY: fail-closed on every read (report-only, never a revert on bad data); the predicate is
# byte-strict; the coupling check is read from the tree, not inferred; the ledger + the deterministic
# branch name make it idempotent; a `revert-*` merge is never a candidate.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tofu-image-revert
  namespace: agent-coordinator
spec:
  entrypoint: revert
  serviceAccountName: agent-coordinator
  # Same podSpecPatch as deploy-revert (homelab#103 soft hostname spread, homelab#867 soft Longhorn-
  # disk de-preference). Verbatim copy; keep in sync.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: revert
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: tofu-image-revert-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
          # Only bumps merged within this window are revert candidates. Wider than the pin chain's
          # 120: the box pulls master hourly, the Deployment's progressDeadlineSeconds (600 s) sets
          # Progressing=false, and the alert holds `for: 15m` — merge → alert can take ~90 min.
          - { name: REVERT_WINDOW_MIN, value: "180" }
          # The repo whose tofu/ the management box applies (ADR-131/-132). One repo by design.
          - { name: REPO_SLUG, value: "teststuffstash/homelab" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            printf '%s' "$PAYLOAD" > /tmp/alert.json

            # Alertmanager POSTs an array of alerts; only a FIRING KubeDeploymentRolloutStuck counts.
            ALERT="$(jq -c '.alerts[] | select(.status == "firing") | select(.labels.alertname == "KubeDeploymentRolloutStuck") | .labels' /tmp/alert.json 2>/dev/null | head -1)"
            [ -n "$ALERT" ] || { echo "→ no firing KubeDeploymentRolloutStuck in payload — nothing to do"; exit 0; }
            NS="$(printf '%s' "$ALERT" | jq -r '.namespace // empty')"
            DEP="$(printf '%s' "$ALERT" | jq -r '.deployment // empty')"
            [ -n "$NS" ] && [ -n "$DEP" ] || { echo "→ no namespace/deployment on the alert — nothing to do"; exit 0; }
            SLUG="${REPO_SLUG:-teststuffstash/homelab}"
            echo "→ $NS/$DEP rollout stuck — looking for an image-line-only merge under tofu/ in $SLUG"

            # The checkout FIRST: the coupling read inside the walk needs the tree, and master's tree
            # is the right one (a Deployment's declaration does not move with the candidate).
            rm -rf /work/repo
            _cu="https://github.com/${SLUG}.git"
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git clone -c "$_ah" --depth 30 "$_cu" /work/repo
            cd /work/repo
            git config user.name "tofu-image-revert (#1988)"
            git config user.email "noreply@teststuff.net"
            # The COUPLING read: a changed file must declare the stuck Deployment — a
            # `resource "kubernetes_deployment[_v1]"` block whose OWN `metadata { name = "<dep>" }`
            # (depth 1 under the resource: never the pod template's metadata, a container name, a
            # volume name or a sibling resource's name — review finding on PR#2082: tofu/unifi.tf
            # declares two Deployments in one file and forgejo-runner.tf's containers are `dind` /
            # `runner`). Read from the tree, never inferred from the alert. Brace-depth walk; a
            # one-line `metadata { name = "x" }` is checked before its own braces are counted.
            # >>>REPLAY:tofu-image-revert-coupling>>>
            declares_dep() {
              awk -v dep="$1" '
                /^[[:space:]]*resource[[:space:]]+"kubernetes_deployment(_v1)?"[[:space:]]+"[^"]+"[[:space:]]*\{/ { in_res=1; depth=0; in_meta=0 }
                {
                  if (!in_res) next
                  if (depth==1 && $0 ~ /^[[:space:]]*metadata[[:space:]]*\{/) { in_meta=1; meta_depth=2 }
                  if (in_meta && $0 ~ ("name[[:space:]]*=[[:space:]]*\"" dep "\"")) found=1
                  depth += gsub(/\{/,"{") - gsub(/\}/,"}")
                  if (in_meta && depth < meta_depth) in_meta=0
                  if (depth <= 0) { in_res=0; in_meta=0 }
                }
                END { exit(found ? 0 : 1) }' "$2"
            }
            # couple_or_report <pr> <files, one per line>: 0 when a changed file declares $DEP
            # (prints the coupling line), 1 when none does (prints why) — the walk moves on.
            couple_or_report() {
              local pr="$1" files="$2" f coupled=""
              while read -r f; do [ -n "$f" ] && [ -f "$f" ] && declares_dep "$DEP" "$f" && coupled="$f" && break; done <<< "$files"
              if [ -z "$coupled" ]; then
                echo "→ $SLUG#$pr changed no file whose kubernetes_deployment metadata names \"$DEP\" — not the stuck $NS/$DEP's merge; next"; return 1
              fi
              echo "→ coupling: $SLUG#$pr declares Deployment \"$DEP\" in $coupled"; return 0
            }
            # <<<REPLAY:tofu-image-revert-coupling<<<

            # The revert candidate: the NEWEST image-line-only merge under tofu/ within the window
            # THAT DECLARES THE STUCK DEPLOYMENT — walked newest-first, so a later, unrelated tofu
            # merge (a doc-and-tofu PR, a `wait_for_rollout` toggle — the drill's own follow-up,
            # 2026-09-28) or a newer image bump on ANOTHER Deployment (review on PR#2087) never masks
            # the bump that stuck. revert-* heads never qualify (never revert a revert). Fail-closed:
            # no qualifying merge = report-only; an UNREADABLE diff ABORTS the whole walk (report-only)
            # — trying an older, different merge in its place could revert the wrong one, and this
            # lane merges its revert with no human in the loop (the IAC-G09 rule, same file above).
            # >>>REPLAY:tofu-image-revert-candidate>>>
            # ⚠ `gh … --jq` takes ONLY the expression: the cutoff is embedded (homelab#2006's lesson);
            # CUTOFF is overridable so a replay can pin the date.
            CUTOFF="${CUTOFF:-$(date -u -d "-${REVERT_WINDOW_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)}"
            CANDS="$(gh pr list --repo "$SLUG" --state merged --limit 10 \
              --json number,title,headRefName,mergedAt,mergeCommit,files \
              --jq "[.[] | select((.headRefName | startswith(\"revert-\")) | not) | select(.mergedAt >= \"$CUTOFF\") | select(.files[]?.path | startswith(\"tofu/\"))] | sort_by(.mergedAt) | reverse | .[] | tojson" 2>/dev/null || true)"
            [ -n "$CANDS" ] || { echo "→ $SLUG: NO tofu-touching merge in the last ${REVERT_WINDOW_MIN}m — not a rollback case (responder/operator lane owns it)"; exit 0; }
            # ── THE IMAGE-LINE PREDICATE (the fourth pin shape, scripts/pin-only-lint.sh check (f)) ──
            # Every changed line is `image = "<ref>"` — registry/path, optional :tag, optional
            # @sha256 digest, nothing else — the line Renovate's terraform manager rewrites on a
            # kubernetes_deployment. A values/locals/resource edit riding along puts the PR outside
            # the reversible class; so does any file that is not tofu/*.tf.
            IMAGE_LINE_RE='^[-+][[:space:]]*image[[:space:]]*=[[:space:]]*"[A-Za-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?"$'
            CAND=""; CONTENT_LINES=""
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              n="$(printf '%s' "$c" | jq -r .number)"
              if printf '%s' "$c" | jq -r '.files[]?.path' | grep -qvE '^tofu/.*\.tf$'; then
                echo "→ $SLUG#$n touches files outside tofu/*.tf — not the class, next"; continue
              fi
              d="$(gh pr diff "$n" --repo "$SLUG" 2>/dev/null || true)"
              [ -n "$d" ] || { echo "→ cannot read the diff of $SLUG#$n — a blind read classifies nothing: the walk ABORTS (report-only; the responder/operator lane owns it)"; exit 0; }
              cl="$(printf '%s\n' "$d" | grep -E '^[-+][^-+]' || true)"
              [ -n "$cl" ] || { echo "→ $SLUG#$n has no content lines in the diff — not an image bump, next"; continue; }
              if printf '%s\n' "$cl" | grep -qEv "$IMAGE_LINE_RE"; then
                echo "→ $SLUG#$n is NOT image-line-only — a later, unrelated tofu merge does not mask the bump; next"; continue
              fi
              couple_or_report "$n" "$(printf '%s' "$c" | jq -r '.files[]?.path')" || continue
              CAND="$c"; CONTENT_LINES="$cl"; break
            done <<< "$CANDS"
            [ -n "$CAND" ] || { echo "→ $SLUG: no image-line-only merge under tofu/ declaring $NS/$DEP in the last ${REVERT_WINDOW_MIN}m — not a rollback case (responder/operator lane owns it)"; exit 0; }
            PRNUM="$(printf '%s' "$CAND" | jq -r .number)"
            SHA="$(printf '%s' "$CAND" | jq -r .mergeCommit.oid)"
            TITLE="$(printf '%s' "$CAND" | jq -r .title)"
            FILES="$(printf '%s' "$CAND" | jq -r '.files[]?.path')"
            echo "→ candidate: $SLUG#$PRNUM @ ${SHA:0:8} ($TITLE) — image-line-only, declares $DEP, inside the revert class"
            # <<<REPLAY:tofu-image-revert-candidate<<<

            # Ledger: one revert decision per (repo, merge-sha).
            KEY="ri-$(printf '%s' "${SLUG}-${SHA}" | sha256sum | cut -c1-16)"
            SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.$KEY}" 2>/dev/null || true)"
            [ -n "$SEEN" ] && { echo "→ $SLUG@$SHA: already handled ($SEEN) — skip"; exit 0; }
            kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"$KEY\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" >/dev/null 2>&1 \
              || echo "WARN: ledger patch failed — branch-name idempotency is the remaining belt"

            # ── THE REVERTED IMAGES (for the CI refusal, pin-only-lint check (f)) ─────────────────
            # The `+` lines are the refs this revert removes again; they go into the revert PR body
            # as one `reverted-images:` line. Renovate re-proposes a merged-then-reverted version on
            # its next run, so the refusal happens later, in CI, not here.
            # >>>REPLAY:tofu-image-revert-reverted-images>>>
            REVERTED_IMAGES="$(printf '%s\n' "$CONTENT_LINES" | grep '^+' | sed -E 's/^\+[[:space:]]*image[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' | sort -u | tr '\n' ' ' | sed 's/ $//' || true)"
            echo "→ reverted images: ${REVERTED_IMAGES:-<none>}"
            # <<<REPLAY:tofu-image-revert-reverted-images<<<

            echo "→ REVERTING $SLUG#$PRNUM ($TITLE) — $NS/$DEP rollout stuck within ${REVERT_WINDOW_MIN}m of the merge"
            BR="revert-img-$(printf '%s' "$SHA" | cut -c1-8)"
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "→ branch $BR already exists — a racing instance owns it (idempotent exit)"; exit 0
            fi
            git checkout -b "$BR"
            git revert --no-edit "$SHA" || { echo "FATAL: git revert conflicted — human/coordinator lane (no blind force)"; exit 1; }
            git push origin "$BR"
            BODY="$(printf '#1988 deterministic rollback (ADR-141 as amended 2026-09-28): the rollout of **%s/%s** was STUCK (`KubeDeploymentRolloutStuck`) within %sm of #%s merging. The merge was image-line-only under tofu/ (every changed line is `image = "<ref>"`) and declares this Deployment, so reverting restores the previous image and the management box applies it on its next pull. A Renovate PR that re-proposes a reverted image is refused by pin-only-lint check (f) in ci (it stays red until Renovate proposes a newer version). Mechanical lane: `automerge` + `dependencies` → the reflex approves, CI is the gate.\n\n**Reverted PR:** #%s — %s\n**Stuck rollout:** %s/%s\n\nreverted-images: %s' \
              "$NS" "$DEP" "$REVERT_WINDOW_MIN" "$PRNUM" "$PRNUM" "$TITLE" "$NS" "$DEP" "$REVERTED_IMAGES")"
            PR="$(gh pr create --repo "$SLUG" --base master --head "$BR" \
              --title "revert: ${TITLE} (auto-rollback — ${NS}/${DEP} rollout stuck post-merge)" \
              --body "$BODY" \
              | grep -oE '[0-9]+$')"
            # >>>REPLAY:tofu-image-revert-merge-lane>>>
            # The MECHANICAL lane: labels BEFORE arming — the `labeled` event fires the reflex, and
            # the platform repos require one approving review it posts only for this label pair.
            gh pr edit "$PR" --repo "$SLUG" --add-label automerge --add-label dependencies \
              || { echo "FATAL: could not label $SLUG#$PR — the reflex will not approve it (a human must)"; exit 1; }
            gh pr merge --auto --squash "$PR" --repo "$SLUG"
            echo "→ revert PR $SLUG#$PR labelled automerge+dependencies and armed (reflex approves, auto-merges on CI green; the box applies the revert on its next pull)"
            # <<<REPLAY:tofu-image-revert-merge-lane<<<
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { memory: "512Mi" }
---
# tofu-provider-revert — S9 #1988 (2026-10-04): deterministic revert of a PROVIDER-PIN-ONLY merge
# when the management box's first CHANGING apply under the new version ERRORS. A provider pin plans
# EMPTY at merge (the sentinel's gate), so its create/update/delete code first runs on a later,
# unrelated apply — the box names the provider then (mgmt-apply.sh → mgmt_apply_errored_unexercised →
# MgmtApplyErroredOnNewProvider, docs/management-box.md §MB3). This workflow:
#   (1) reads root/provider/locked from the firing alert; only the box's apply root `main` (tofu/),
#   (2) confirms master's lockfile still pins provider@locked (a stale alert reverts nothing),
#   (3) finds the commit that moved the provider TO that version — mgmt_provider_pin_commit from the
#       cloned master's mgmt-lib.sh: it must be provider-pin-only, or the walk is report-only,
#   (4) reverts it on `revert-prov-<sha8>` with a `reverted-providers: <name>@<version>` body line —
#       pin-only-lint check (g) refuses a re-proposal of that version for REVERT_MEMORY_DAYS,
#   (5) opens it `automerge`+`dependencies`, armed: the reflex approves, CI + the box sentinel gate
#       it (a pin head may add NOTHING to master's own pending plan), the box applies on its pull.
# ON A CORRELATION, BY DESIGN: the alert proves only that the errored apply was the version's first
# changing one, not that the provider caused it. The revert is the probe — safe (state-compatible by
# gate) and cheap; a clean re-apply confirms the provider, a repeat error clears it.
# WHY A REVERT IS SAFE HERE: the sentinel refuses any pin that raises a stored schema/identity
# version (mgmt_schema_upgrades), so the old provider reads the state the errored apply left.
# COMPOSITION: Alertmanager routes the alert to BOTH this chain and the responder.
# SAFETY: fail-closed on every read (report-only, never a revert on bad data); idempotent by the
# ledger + the deterministic branch name; a revert-* commit is never a candidate (it is not a pin
# that INTRODUCED the locked version by moving it forward — and the walk stops at the introducer).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tofu-provider-revert
  namespace: agent-coordinator
spec:
  entrypoint: revert
  serviceAccountName: agent-coordinator
  # Same podSpecPatch as deploy-revert (homelab#103 soft hostname spread, homelab#867 soft Longhorn-
  # disk de-preference). Verbatim copy; keep in sync.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: revert
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: tofu-provider-revert-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
          # The repo whose tofu/ the management box applies (ADR-131/-132). One repo by design.
          - { name: REPO_SLUG, value: "teststuffstash/homelab" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            # >>>REPLAY:tofu-provider-revert-alert>>>
            printf '%s' "$PAYLOAD" > /tmp/alert.json
            ALERT="$(jq -c '.alerts[] | select(.status == "firing") | select(.labels.alertname == "MgmtApplyErroredOnNewProvider") | .labels' /tmp/alert.json 2>/dev/null | head -1)"
            [ -n "$ALERT" ] || { echo "→ no firing MgmtApplyErroredOnNewProvider in payload — nothing to do"; exit 0; }
            ROOT="$(printf '%s' "$ALERT" | jq -r '.root // empty')"
            PROV="$(printf '%s' "$ALERT" | jq -r '.provider // empty')"
            VER="$(printf '%s' "$ALERT" | jq -r '.locked // empty')"
            EXER="$(printf '%s' "$ALERT" | jq -r '.exercised // empty')"
            [ -n "$ROOT" ] && [ -n "$PROV" ] && [ -n "$VER" ] || { echo "→ alert lacks root/provider/locked — nothing to do"; exit 0; }
            # Only the box's apply root. Others plan only (policy/mgmt/plan-input.yaml `apply`), so an
            # apply error cannot come from them; an unexpected root is report-only, never guessed.
            case "$ROOT" in main) LOCK=tofu/.terraform.lock.hcl ;; *) echo "→ root '$ROOT' is not the box's apply root — report-only"; exit 0 ;; esac
            # <<<REPLAY:tofu-provider-revert-alert<<<
            SLUG="${REPO_SLUG:-teststuffstash/homelab}"
            echo "→ $ROOT: apply errored on $PROV $VER (last exercised: ${EXER:-?}) — looking for the provider-pin merge that introduced $VER"
            rm -rf /work/repo
            _cu="https://github.com/${SLUG}.git"
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            # Full history, blobs on demand: the introducing pin can be weeks old (it planned empty and
            # waited for the first changing apply) — a fixed depth would silently miss it.
            git clone -c "$_ah" --filter=blob:none "$_cu" /work/repo
            cd /work/repo
            [ -n "${GH_TOKEN:-}" ] && git config http.extraHeader "${_ah#http.extraHeader=}"   # on-demand blob fetches reuse the preemptive auth
            git config user.name "tofu-provider-revert (#1988)"
            git config user.email "noreply@teststuff.net"
            # shellcheck source=/dev/null
            . mgmt/scripts/mgmt-lib.sh
            NOW="$(_mgmt_lock_version_of "$PROV" < "$LOCK")"
            [ "$NOW" = "$VER" ] || { echo "→ master's $LOCK pins $PROV at '${NOW:-absent}', not $VER — the alert is stale (already reverted or bumped); nothing to do"; exit 0; }
            if ! CAND="$(mgmt_provider_pin_commit . HEAD "$LOCK" "$PROV" "$VER")"; then
              echo "→ no provider-pin-only merge introduced $PROV $VER (reason above) — not a rollback case (responder/operator lane owns it)"; exit 0
            fi
            SHA="$(printf '%s' "$CAND" | cut -f1)"; PREV="$(printf '%s' "$CAND" | cut -f2)"
            SUBJ="$(git log -1 --format=%s "$SHA")"
            PRNUM="$(printf '%s' "$SUBJ" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9' || true)"
            # >>>REPLAY:tofu-provider-revert-ref>>>
            # How the body names the reverted change: `#<pr>` when the squash subject carries one, else
            # the short sha. (The drill PR #2209 printed `#19761976` — `${PRNUM:-…}` re-expands PRNUM.)
            REF="#$PRNUM"; [ -n "$PRNUM" ] || REF="$(printf '%s' "$SHA" | cut -c1-8)"
            echo "→ reverted change: $REF"
            # <<<REPLAY:tofu-provider-revert-ref<<<
            echo "→ candidate: ${SHA:0:8} \"$SUBJ\" — moved $PROV $PREV → $VER, provider-pin-only"

            KEY="rp-$(printf '%s' "${SLUG}-${SHA}" | sha256sum | cut -c1-16)"
            SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.$KEY}" 2>/dev/null || true)"
            [ -n "$SEEN" ] && { echo "→ $SLUG@$SHA: already handled ($SEEN) — skip"; exit 0; }
            kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"$KEY\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" >/dev/null 2>&1 \
              || echo "WARN: ledger patch failed — branch-name idempotency is the remaining belt"

            BR="revert-prov-$(printf '%s' "$SHA" | cut -c1-8)"
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "→ branch $BR already exists — a racing instance owns it (idempotent exit)"; exit 0
            fi
            git checkout -b "$BR"
            git revert --no-edit "$SHA" || { echo "FATAL: git revert conflicted — human/coordinator lane (no blind force)"; exit 1; }
            git push origin "$BR"
            BODY="$(printf '#1988 deterministic rollback (S9, 2026-10-04) — on a CORRELATION, by design. The management box'"'"'s first CHANGING apply of `%s` under **%s %s** ERRORED (`MgmtApplyErroredOnNewProvider`; the last successful changing apply ran %s). That the provider caused it is not proven — the change may have. The revert is the cheap, safe probe: %s moved it %s → %s and was provider-pin-only, and the box sentinel refuses any pin that raises a stored schema/identity version, so %s reads the state back. If the box then applies clean, the provider was the cause; if the apply still errors, it was not, and the error stays with the responder/operator (the version is re-proposable after the 30-day memory, or by editing this body). pin-only-lint check (g) refuses a re-proposal of %s %s meanwhile. Mechanical lane: `automerge` + `dependencies` → the reflex approves, CI + `management-sentinel` gate.\n\n**Reverted:** %s\n**Errored apply:** root `%s` (journal: `journalctl -u mgmt-apply -n 80` on 192.168.2.53)\n\nreverted-providers: %s@%s' \
              "$ROOT" "$PROV" "$VER" "${EXER:-unknown}" "$REF" "$PREV" "$VER" "$PREV" "$PROV" "$VER" "${PRNUM:+#$PRNUM — }$SUBJ" "$ROOT" "$PROV" "$VER")"
            PR="$(gh pr create --repo "$SLUG" --base master --head "$BR" \
              --title "revert: ${SUBJ} (auto-rollback — ${ROOT} apply errored on ${PROV} ${VER})" \
              --body "$BODY" \
              | grep -oE '[0-9]+$')"
            # >>>REPLAY:tofu-provider-revert-merge-lane>>>
            # The MECHANICAL lane: labels BEFORE arming — the `labeled` event fires the reflex.
            gh pr edit "$PR" --repo "$SLUG" --add-label automerge --add-label dependencies \
              || { echo "FATAL: could not label $SLUG#$PR — the reflex will not approve it (a human must)"; exit 1; }
            gh pr merge --auto --squash "$PR" --repo "$SLUG"
            echo "→ revert PR $SLUG#$PR labelled automerge+dependencies and armed (reflex approves, auto-merges on green; the box applies on its next pull)"
            # <<<REPLAY:tofu-provider-revert-merge-lane<<<
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { memory: "512Mi" }
