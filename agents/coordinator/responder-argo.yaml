# responder-argo — the FU-103 responder role's activation machinery (roles.md §responder).
#
# V2 (operator direction 2026-07-27): TRIAGE-FIRST, ISSUES ONLY WHEN TRIAGE DECIDES. V1 filed one
# evidence issue per alert on homelab — rejected: machine-rate issue creation pollutes the tracker
# (one bug from 4000 issues overnight), and a stack workload's alert belongs to the STACK's ops
# surface (its -iac repo), reaching homelab only when the stack needs something from the platform.
# Now a firing alert fingerprint gets ONE inline LLM triage session (role: responder, resolved via
# /route; literals die at the deletion sweep — G-A 9, issue #782),
# whose cheapest-sufficient outcome is: report-only → GitOps quick fix on the stack's -iac
# (revert/pin PR through the CI-only auto-merge lane) → ONE issue in the stack's -iac/app repo →
# a homelab issue ONLY for platform namespaces or needs-platform. Same autonomy the jail
# meta-sessions exercise, scoped to GitOps verbs + issue writes (no kubectl mutations).
#
# Machinery inventory:
#   predicate  = Alertmanager firing (fan-out route in tofu/monitoring.tf)
#   edge       = /alert webhook (review-argo.yaml EventSource) → this Sensor
#   backstop   = NONE by design — alerts are level-triggered (repeat_interval refires ≤3h)
#   key        = TWO ledger keys in the responder-seen ConfigMap (24h window): the alert
#                fingerprint AND the FU-133 subject (the RESOURCE), because a fingerprint is
#                per-instance — one failing workflow mints a new one per run. Both are checked
#                before a session is spawned; the `alert-fp:<fp>` + `subject:<subj>` open-issue
#                searches in the brief are the belts BEHIND them, not the guard.
#   capacity   = Sensor rateLimit 6/min + subscription-capacity semaphore + the FU-088 latch
#                + the FU-149 DAILY BUDGET LATCH (agents/responder-budget.sh): a binding
#                RESPONDER_DAILY_MAX=12 sessions/day, checked before any per-alert work and again
#                before each spawn, fail-CLOSED, with a gauge on the pushgateway and an INFO alert
#                (ResponderTriageBudgetExhausted) when triage stops. It replaces the FU-113(c)
#                incident cap, which had an `INC_SEEN == 0` escape hatch and so was never binding.
#   breakers   = one issue max per session (brief + the fp belts); no agent labels on filed
#                issues (inert, breaker #1); loop-smell → report-only stop
#   dispatch   = SPLIT from triage (FU-133 dispatch half, 2026-08-07): the session's issue
#                carries a 'fix-verdict:' line, the shell applies agent-fix (inert — the scan
#                needs agent-fix ∧ agent/queued) and rings /fix-verdict; the fix-debounce
#                workflow (fix-debounce-argo.yaml) judges the whole pending SET before any
#                issue gets agent/queued. Replaces selfQueue (cb4ae5a).
#   routing    = the owner of the FIX, not the owner of the symptom (#124, operator amendment
#                2026-08-08). The claim lookup over the alert's namespace computes a DEFAULT;
#                when the triage names its fix surface — and it nearly always can — the repo
#                owning that surface wins. One night measured both failure directions: nine
#                oracle-fleet egress drops whose fix was one line in oracle's claim were filed
#                platform-side, while a uv failure whose SYMPTOM was oracle-fleet had its fix
#                platform-side. Namespace predicts where a symptom appears, not who fixes it.
#   toolbox    = what the brief may tell the session to RUN (#125, 2026-08-08). The lane spent a
#                night faulting sessions for not following a runbook that named the JAIL's tools:
#                'devbox run hubble' needs a binary this image does not carry, so a triage dutifully
#                reported "cannot name the FQDN" while the FQDN sat in Prometheus, one query away
#                — the drop metric resolves names already (destinationContext=dns|ip, tofu/cilium.tf),
#                so hubble was never needed to answer the question. Rule the brief now encodes:
#                name the read that works from THIS pod, name the fallback and its blind spot, and
#                do not let "I could not verify" stand on a query nobody ran. Runbook + the two
#                reads: docs/agents/roles.md §responder.
#   resolve    = keyed on the recorded verdict (#124, FU-133 leg c), then on ENGAGEMENT (#148).
#                'fix' means the DEFECT outlives its alert (egress drops fire per ride and clear
#                when the ride dies), so the clear neither closes nor comments; closure belongs
#                to the merged fix and its acceptance probe, or to a human. Alert state ≠ defect
#                state (iac-lane.md). 'report-only' splits: bots-only → comment + auto-close
#                (right for transient noise, unchanged); a HUMAN has spoken so the issue stays
#                open → no comment either, same single rewritten 'last-cleared:' line. ONE
#                comment per clear on a thread that never closes is unbounded by construction —
#                27 of homelab's 80 comments on 2026-08-08 were this leg, #63 taking four in ~2h
#                of PSI flapping. A comment is only worth posting where it is also the last word.
#   self-ref   = THREE keys (#239, 2026-08-11): the rule author's `platform_machinery: "true"`
#                alert label, plus the original namespace set and the `Agent*` name as belt.
#                Both older keys INFER machinery from something else and a pushgateway-derived
#                alert carries neither — RetroReportOverdue dispatched a ride at the retro belt
#                and latched agent/error (homelab#237). The label is declared where the fact is
#                known; the pairing is asserted in responder-behaviour-test.sh §#239.
#   identity   = ONE subject marker per thread (#149, 2026-08-08). The subject IS an issue's
#                identity and the dedup search greps COMMENTS, so a triage that comments its own
#                'subject:' onto a thread born of a DIFFERENT subject makes that thread the
#                org-wide search hit for two resources permanently — closing it does not help, the
#                comment stays indexed. Two live grafts that day: #103, a wk-01 CPU-containment
#                record, took a node-exporter subject that had no prior issue at all; #100, a
#                Longhorn disk-capacity issue, took a PodSigkilled occurrence as a third alert
#                class. Both sessions had the right instinct (FU-133 anti-fragmentation) and the
#                wrong mechanism: related-but-different correlates by LINK — its own issue plus a
#                'related: #N' line — and GROUPING happens at Alertmanager/filing (FU-133 leg a),
#                never by marker-attachment. Brief text below; behaviour test in
#                responder-behaviour-test.sh §#149.
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: responder
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review # same submit-only Role as review/coordinate Sensors
    # homelab#103: was BestEffort — no requests at all, so the scheduler placed this long-lived
    # Sensor pod as if it were free (and a spinning Sensor is exactly what saturated wk-01). Same
    # values as the coordinate/review Sensors and the agent-loop EventSource. No CPU limit: this
    # file set requests CPU and limits memory only (limits throttle, requests schedule).
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  dependencies:
    - name: alert-dep
      eventSourceName: agent-loop
      eventName: alert
  triggers:
    - rateLimit: { unit: Minute, requestsPerUnit: 6 } # dumb outer belt vs alert storms
      template:
        name: submit-respond
        conditions: "alert-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: respond-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: respond }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: alert-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
---
# The respond WorkflowTemplate — per NEW fingerprint: one inline triage session (model via /route
# role:responder; fallback sonnet when the proxy is unreachable — G-A 9, issue #782).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: respond
  namespace: agent-coordinator
spec:
  entrypoint: respond
  serviceAccountName: agent-coordinator
  # Queue behind the shared subscription pool like review/coordinate workflows (FU-088 Argo layer).
  synchronization:
    semaphores:
      - configMapKeyRef: { name: subscription-capacity, key: claude }
  # homelab#103 soft hostname spread — rationale on the `switchboard` WorkflowTemplate (coordinate-argo.yaml — was `coordinate`, ADR-120)
  # (coordinate-argo.yaml). Verbatim copy; keep in sync.
  # homelab#867 soft Longhorn-disk de-preference — same rationale.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: respond
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: respond-workflow }
      # FU-113(b): the responder must not trust the alert edge to refire — a latch-deferred
      # triage EXITS 1 and Argo re-runs it here with backoff (15m→2h, 6 tries ≈ the FU-088
      # window). The 24h fp ledger + deferred-markers keep retries idempotent; retries
      # exhausted = a Failed workflow, visible in Argo + the crosscheck belt.
      retryStrategy:
        limit: "6"
        retryPolicy: OnFailure
        backoff: { duration: "15m", factor: "2" }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          # Payload rides an env var, NOT shell interpolation — an apostrophe in an alert
          # annotation must not break quoting (k8s env delivery is byte-safe).
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          # Subscription auth via the ADR-087 ref rail (the reviewer pattern — never the raw token).
          - { name: ANTHROPIC_BASE_URL, value: "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/anthropic" }
          - { name: ANTHROPIC_AUTH_TOKEN, value: "ref:agent-coordinator/coordinator-claude" }
          - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
          # Cost attribution (2026-08-08 label audit): the responder was one of the roles whose
          # sessions exported NO telemetry — its subscription-equiv cost was invisible on the
          # agent-cost dashboard. Same attrs contract as coordinator/reviewer-session.sh.
          - { name: CLAUDE_CODE_ENABLE_TELEMETRY, value: "1" }
          - { name: OTEL_METRICS_EXPORTER, value: "otlp" }
          - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
          - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
          - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
          - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=claude-code,role=responder,stack=platform" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            printf '%s' "$PAYLOAD" > /tmp/alerts.json
            # ── RESOLVE LEG (FU-133, 2026-08-04) ────────────────────────────────────────────
            # "Alert cleared, issue remains" was never a bug in the triage — the event was never
            # DELIVERED: the responder receiver ran send_resolved = false, so nothing downstream
            # ever learned an alert stopped firing. Three issues (#77/#91/#92) outlived their
            # alerts by up to a day and were closed by hand.
            #
            # Deterministic, no LLM, no session: find the fingerprint's issue and record the clear.
            # Closing is conditional ON PURPOSE — a human comment means someone owns it, and
            # auto-closing under them is worse than leaving it open. A flapping alert cannot churn
            # issues either: the firing path's fp-issue belt REOPENS what this closed rather than
            # filing a new one.
            #
            # ── keyed on the RECORDED VERDICT (#124, 2026-08-08; FU-133 leg c) ────────────────
            # The condition above was still "did a human speak", which reads the alert as if it
            # were the defect. For a PERSISTENT cause with an INTERMITTENT symptom they diverge:
            # a worker's egress drops fire per ride and clear when the ride dies, so the clear
            # says only "the ride ended", never "the allowlist is fixed". One night showed both
            # halves of the damage — #118 was closed by this leg while its defect was latent (a
            # human reopened it), and #107 accumulated ~10 fire/clear comments that buried the
            # verdict its 00:37Z re-triage needed. So the leg keys on the verdict the triage
            # already records: 'report-only' → the engagement split below; 'fix' → no close, no
            # comment, at most a last-cleared line in the body. Closure then belongs to the fix
            # lane (merged fix + acceptance probe) or a human. No new state — it is the same
            # 'fix-verdict:' line the dispatch half at the bottom of this file already reads,
            # matched with the same regex.
            #
            # ── then keyed on ENGAGEMENT, because that cured the churn on ONE path (#148) ─────
            # The verdict split above fixed the 'fix' path and the disease survived on the other
            # one: report-only + a human engaged = comment every clear AND never close, i.e. one
            # comment per flap cycle, forever. Measured 2026-08-08 — 27 of the day's 80 homelab
            # issue comments were this leg's ✅-notices, #63 alone taking four in ~2h as a PSI
            # storm flapped, #103 five. The rule underneath both fixes: a per-clear COMMENT is
            # only earned where it is also the LAST word (the bots-only close below). Wherever
            # the issue stays OPEN, the clear is a fact ABOUT the issue, and a fact belongs in
            # the body — rewritten in place, exactly once.
            #
            # Both no-comment paths record it through this one helper, so "N clears stay 1 line"
            # is implemented once: drop every '^last-cleared:' line, append exactly one. GUARDED
            # on the marker that identifies the issue ($4) — a body that came back short or lost
            # that marker is NOT written, because a half-written body is worse than an unrecorded
            # clear. Reads $rname/$rfp from the resolve loop below.
            # Exit: 0 written, 1 edit failed, 2 guard refused.
            _record_clear() { # <repo> <number> <issue-json> <guard-regex> <tail-sentence>
              printf '%s' "$3" | jq -r '.body // ""' | grep -v '^last-cleared:' > /tmp/rbody.md || true
              printf 'last-cleared: %s — %s stopped firing (alert-fp:%s). %s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$rname" "$rfp" "$5" >> /tmp/rbody.md
              [ -s /tmp/rbody.md ] && grep -qi "$4" /tmp/rbody.md || return 2
              gh issue edit "$2" --repo "$1" --body-file /tmp/rbody.md >/dev/null 2>&1 || return 1
            }
            jq -r '.alerts[]? | select(.status == "resolved") | [(.fingerprint // ""), (.labels.alertname // "?")] | @tsv' \
              /tmp/alerts.json 2>/dev/null | while IFS="$(printf '\t')" read -r rfp rname; do
              [ -n "$rfp" ] || continue
              hit="$(gh search issues --owner "$ORG" "alert-fp:$rfp" --state open --json repository,number \
                     --limit 5 2>/dev/null | jq -r '.[] | "\(.repository.nameWithOwner)#\(.number)"' | head -1)"
              if [ -z "$hit" ]; then echo "→ resolved $rname ($rfp): no open issue — nothing to close"; continue; fi
              rrepo="${hit%#*}"; rnum="${hit#*#}"
              # ONE read serves both tests below (verdict + human engagement).
              rmeta="$(gh issue view "$rnum" --repo "$rrepo" --json body,comments 2>/dev/null || printf '{}')"
              # "$rmeta = {}" catches the `|| printf '{}'` fallback; the jq -e catches a read that
              # came back PARTIAL (truncated/interleaved output still exits 0), which would
              # otherwise fall through to the report-only branch with 0 humans and close blind.
              if [ "$rmeta" = "{}" ] || ! printf '%s\n' "$rmeta" | jq -e . >/dev/null 2>&1; then
                echo "→ resolved $rname ($rfp): could not read $hit — left alone (never close on a failed read)"; continue
              fi
              # The verdict split. Same regex the dispatch half uses, against the same body line.
              if printf '%s' "$rmeta" | jq -r '.body // ""' | grep -qi '^fix-verdict:[[:space:]]*fix[[:space:]]*$'; then
                # At most a last-cleared line: it carries the "not seen since" fact without adding
                # a comment to bury the verdict under. The guard is the verdict marker itself —
                # the line this branch was selected by.
                rc=0; _record_clear "$rrepo" "$rnum" "$rmeta" '^fix-verdict:' \
                  'The DEFECT closes this issue, not the alert.' || rc=$?
                case "$rc" in
                  0) echo "→ resolved $rname ($rfp): $hit is 'fix-verdict: fix' — OPEN, no comment, last-cleared line updated";;
                  1) echo "→ resolved $rname ($rfp): $hit is 'fix-verdict: fix' — OPEN, no comment (body edit failed, non-fatal)";;
                  *) echo "→ resolved $rname ($rfp): $hit is 'fix-verdict: fix' — OPEN, no comment (body unreadable, left untouched)";;
                esac
                continue
              fi
              # ── report-only (or no verdict recorded): split on ENGAGEMENT ────────────────────
              # Human engagement = anyone whose login is not a bot. gh renders App logins with a
              # [bot] suffix HERE (REST); the reviewer's REST-vs-GraphQL mismatch (FU-069) does not
              # apply to this endpoint, but the test stays suffix-tolerant on purpose.
              humans="$(printf '%s' "$rmeta" \
                        | jq -r '[.comments[]? | select((.author.login // "") | test("\\[bot\\]$") | not)] | length' 2>/dev/null || echo 0)"
              if [ "${humans:-0}" -eq 0 ]; then
                # Bots only → the comment is also the LAST word on the thread, so it is bounded by
                # the close that follows it. This half is unchanged.
                gh issue comment "$rnum" --repo "$rrepo" \
                  --body "✅ **Alert cleared** — \`$rname\` (alert-fp:\`$rfp\`) stopped firing at $(date -u +%Y-%m-%dT%H:%M:%SZ). Posted by the responder's resolve leg (FU-133); the issue does not have to be true any more just because it was filed." >/dev/null 2>&1 || true
                gh issue close "$rnum" --repo "$rrepo" --reason completed >/dev/null 2>&1 \
                  && echo "→ resolved $rname ($rfp): commented + CLOSED $hit (no human had engaged)" \
                  || echo "→ resolved $rname ($rfp): commented $hit, close failed (non-fatal)"
              else
                # A human owns it → the issue stays open, so a comment here is never anyone's last
                # word and repeats once per flap cycle (#148). Same single-line treatment as the
                # 'fix' verdict above; the guard is the alert-fp marker, which is what the firing
                # path's belt finds (and REOPENS) this issue by.
                rc=0; _record_clear "$rrepo" "$rnum" "$rmeta" '^alert-fp:' \
                  'A human is engaged, so the DEFECT closes this issue, not the alert.' || rc=$?
                case "$rc" in
                  0) echo "→ resolved $rname ($rfp): $hit left OPEN — $humans human comment(s), someone owns it; no comment, last-cleared line updated";;
                  1) echo "→ resolved $rname ($rfp): $hit left OPEN — $humans human comment(s), someone owns it; no comment (body edit failed, non-fatal)";;
                  *) echo "→ resolved $rname ($rfp): $hit left OPEN — $humans human comment(s), someone owns it; no comment (body carries no alert-fp marker, left untouched)";;
                esac
              fi
            done

            COUNT="$(jq -r '[.alerts[]? | select(.status == "firing")] | length' /tmp/alerts.json 2>/dev/null || echo 0)"
            [ "${COUNT:-0}" -gt 0 ] || { echo "no firing alerts in payload — resolve leg done, nothing to triage"; exit 0; }

            rm -rf /work/homelab
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
            # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
            # old anonymous behavior (degrade, never a new hard dependency).
            # Preemptive auth (the 2026-09-03 throttle recurrence): the token rides `http.extraHeader` on the
            # FIRST request. Token-in-URL still made two ANONYMOUS requests per clone (GET refs + POST
            # upload-pack → 401 → authenticated retry) — ~700 anonymous hits/day on GitHub's per-IP throttle
            # from an "authenticated" loop. `clone -c` persists it for later fetch/push. Empty = anonymous.
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git clone -c "$_ah" --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab

            TODAY="$(date -u +%Y-%m-%d)"
            # FU-113(a): every non-triaging outcome writes a LEDGER MARKER (value forms that do
            # NOT satisfy the triage dedup or consume the cap) — a silent defer/skip was
            # indistinguishable from a drop (2026-07-27 postmortem). (b): a latch defer exits 1
            # so Argo's retryStrategy re-runs THIS workflow — never trust the edge to refire.
            # homelab#439: --pick-rail mode — when ANY rail is clear the triage proceeds.
            rail="$(SUBSCRIPTION_TIER=dispatch bash /work/homelab/agents/subscription-latch.sh --pick-rail)" || rail=""
            if [ -z "$rail" ]; then
              jq -r '.alerts[]? | select(.status == "firing") | .fingerprint // empty' /tmp/alerts.json \
                | while read -r dfp; do [ -n "$dfp" ] && kubectl -n agent-coordinator patch cm responder-seen \
                    --type merge -p "{\"data\":{\"fp-$dfp\":\"deferred-$TODAY\"}}" >/dev/null 2>&1 || true; done
              echo "triage DEFERRED — both rails latched (FU-088); markers written, exit 1 → Argo retries with backoff (FU-113b)"; exit 1
            fi
            # Log which rail we're on (Go rail only when Anthropic is latched)
            case "$rail" in opencode-go/*) echo "→ Anthropic latched — serving triage on the Go rail ($rail)";; esac

            # ── FU-149: THE DAILY BUDGET, CHECKED FIRST AND BINDING ─────────────────────────
            # This runs BEFORE any per-alert work because it is the only gate that bounds the DAY.
            # Its predecessor (FU-113c) was subordinate: `N_TODAY >= 12 AND INC_SEEN == 0` blocks a
            # NEW incident once twelve are spent while leaving repeats of an already-seen incident
            # unbounded — so the ceiling could be passed without ever being hit. There is no escape
            # clause here: over budget means no session, whatever the alert is.
            # Exits 0, not 1: a day-long budget is not something Argo's 15m→2h retry can outwait,
            # and alerts are level-triggered (repeat_interval ≤3h) so nothing is lost by dropping.
            # Markers are written per FU-113(a) so a deliberate stop is distinguishable from a drop
            # — WITHOUT them meta-alert-crosscheck.sh would read this as stuck machinery.
            # The operator-facing signal is the ResponderTriageBudgetExhausted info alert, which
            # carries `triage: none` so it can never consume the budget it is reporting on.
            if ! RESPONDER_DAILY_MAX="${RESPONDER_DAILY_MAX:-12}" bash /work/homelab/agents/responder-budget.sh; then
              jq -r '.alerts[]? | select(.status == "firing") | .fingerprint // empty' /tmp/alerts.json \
                | while read -r bfp; do [ -n "$bfp" ] && kubectl -n agent-coordinator patch cm responder-seen \
                    --type merge -p "{\"data\":{\"fp-$bfp\":\"budget-$TODAY\"}}" >/dev/null 2>&1 || true; done
              echo "triage BLOCKED — daily LLM budget exhausted (FU-149); markers written, no session spawned"; exit 0
            fi

            kubectl -n agent-coordinator get cm responder-seen >/dev/null 2>&1 \
              || kubectl -n agent-coordinator create cm responder-seen >/dev/null 2>&1 || true

            # </dev/null on the claude call below: a piped while-read loop's stdin IS the
            # remaining alerts — claude eats them and a multi-alert group triages only its
            # first member (found live 2026-07-27 by meta-alert-crosscheck.sh, run 1).
            jq -c '.alerts[] | select(.status == "firing")' /tmp/alerts.json | while read -r a; do
              FP="$(printf '%s' "$a" | jq -r '.fingerprint // empty')"
              NAME="$(printf '%s' "$a" | jq -r '.labels.alertname // "unknown-alert"')"
              [ -n "$FP" ] || FP="$(printf '%s' "$a" | jq -r '.labels | tostring' | sha256sum | cut -c1-16)"

              # triage:none — the rule AUTHOR declared this alert self-describing (capacity
              # states, heartbeats): no session, no ledger slot, no daily-cap spend. The label
              # rides in the payload, so this costs zero lookups. Rule-side convention:
              # argocd/resources/*/prometheusrule.yaml.
              if [ "$(printf '%s' "$a" | jq -r '.labels.triage // empty')" = "none" ]; then
                kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"none-$TODAY\"}}" >/dev/null 2>&1 || true
                echo "→ $NAME ($FP): triage:none (self-describing by rule author) — marker written, skip"; continue
              fi

              # ── subject: key (FU-133) — the resource this alert is ABOUT ────────────────────
              # The lane deduped on FINGERPRINT, which is per-alert-instance: homelab#94 and #98
              # were the same PVC failing the same way 25 minutes apart, but different pod names
              # meant different fingerprints, so it filed twice. The subject is what makes a
              # recurrence findable — including one 8 days later, which no time window catches
              # (the ghcr mirror: #47 → #80 → #93, three issues, one resource).
              # Pod names are stripped of their generated suffixes, which is the whole trick:
              # coordinator-104803 and coordinator-110038 both become workload:platform-agents/coordinator.
              # ⚠ `namespace` is NOT universal, and everything below it degrades together when it
              # is absent (found 2026-08-08, #124). AgentWorkerEgressDropped aggregates
              # `sum by (source)`, so it carries a `source` label and NO namespace at all — while
              # hubble's `source` IS the namespace (sourceContext=namespace, tofu/cilium.tf), i.e.
              # the label was there under another name the whole time. Without it the subject fell
              # through to the catch-all `alert:<name>`: ONE subject shared by all four watched
              # namespaces, so oracle-fleet's releases.astral.sh drop subject-deduped onto
              # homelab's ghcr.io issue #107 — and the route (below) fell through to 'platform'.
              # Nine fires, nine symptom-only comments, no fix in any lane. Reading `source` as the
              # fallback namespace repairs subject, route, self-ref and ledger at their one origin.
              # ⚠ That fallback is SCOPED TO THIS ONE ALERT, and the scoping is the fix — a blanket
              # `.labels.namespace // .labels.source` was wrong (round 1 of #124 shipped it on the
              # false claim that no other rule uses `source`; caught in review). `source` is a
              # namespace only because THIS rule aggregates hubble by it. The counterexample is
              # RouterRotationStale (argocd/resources/openrouter-proxy/prometheusrule.yaml:58-59),
              # a bare selector on `router_rotation_age_seconds{source="openrouter-daily-rankings"}`
              # with no `triage: none`, so it flows through here carrying a `source` that is a FEED
              # name, not a namespace. Unscoped, its subject flipped from `alert:RouterRotationStale`
              # to `ns:openrouter-daily-rankings` — a marker discontinuity that files a duplicate on
              # the next fire, i.e. exactly the failure this issue exists to remove, relocated.
              # `.labels.namespace` stays the general path; the gate below mirrors the one
              # EGRESS_NOTE uses further down, so the two read as one idea. Any future rule whose
              # `source` really is a namespace opts in HERE, by name.
              # >>>REPLAY:responder-subject>>>
              _ns="$(printf '%s' "$a" | jq -r '.labels.namespace // empty')"
              case "$NAME" in
                AgentWorkerEgressDropped)
                  [ -n "$_ns" ] || _ns="$(printf '%s' "$a" | jq -r '.labels.source // empty')";;
                AgentDispatchCronWoken)
                  [ -n "$_ns" ] || _ns="$(printf '%s' "$a" | jq -r '.labels.project // empty')";;
                AgentRunNegativeCost)
                  [ -n "$_ns" ] || _ns="$(printf '%s' "$a" | jq -r '.labels.project // empty')";;
                AgentRunInfraDeathBurst)
                  [ -n "$_ns" ] || _ns="$(printf '%s' "$a" | jq -r '.labels.project // empty')";;
              esac
              _pvc="$(printf '%s' "$a" | jq -r '.labels.persistentvolumeclaim // empty')"
              _pod="$(printf '%s' "$a" | jq -r '.labels.pod // empty')"
              _node="$(printf '%s' "$a" | jq -r '.labels.node // empty')"
              _repo="$(printf '%s' "$a" | jq -r '.labels.repo // empty')"
              _wf="$(printf '%s' "$a" | jq -r '.labels.workflow // empty')"
              _strip() { printf '%s' "$1" | sed -E 's/-[a-z0-9]{5}$//; s/-[0-9]{4,}$//; s/-[a-f0-9]{8,10}$//'; }
              if   [ -n "$_pvc" ];                    then SUBJ="pvc:${_ns}/${_pvc}"
              elif [ -n "$_repo" ] && [ -n "$_wf" ];  then SUBJ="workflow:${_repo}/${_wf}"
              elif [ -n "$_pod" ];                    then SUBJ="workload:${_ns}/$(_strip "$_pod")"
              elif [ -n "$_node" ];                   then SUBJ="node:${_node}"
              elif [ -n "$_ns" ];                     then SUBJ="ns:${_ns}"
              else                                         SUBJ="alert:${NAME}"; fi
              echo "→ $NAME ($FP): subject=$SUBJ"
              # <<<REPLAY:responder-subject<<<

              # ── subject dedup (FU-133) — the GUARD the subject key never got ───────────────
              # The subject was computed 50 lines below this point and used only inside the LLM
              # brief, so it could stop a duplicate ISSUE but never a duplicate SESSION. During
              # the 2026-08-06 Actions outage GithubWorkflowRunFailed minted a fresh fingerprint
              # per failed run, so homelab#111 took THREE sonnet triages in 33 minutes — each one
              # correctly found the issue by subject, appended a ~3k-char comment, and burned a
              # session off the SAME subscription the loop dispatches from. One issue, N sessions.
              # The fingerprint ledger could not collapse them (different fp) and the daily cap
              # could not either (it only blocks a NEW incident once 12 are spent, so a repeat of
              # an already-seen incident is unbounded by construction).
              # Marker value is 'triaged-' prefixed so it starts with neither TODAY nor a bare
              # date — the cap's N_TODAY/INC_SEEN arithmetic cannot see it (FU-113a convention).
              SUBJ_KEY="subj-$(printf '%s' "$SUBJ" | sha256sum | cut -c1-16)"
              SUBJ_SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.$SUBJ_KEY}" 2>/dev/null || true)"
              if [ "$SUBJ_SEEN" = "triaged-$TODAY" ]; then
                kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"subjdup-$TODAY\"}}" >/dev/null 2>&1 || true
                echo "→ $NAME ($FP): subject $SUBJ already triaged today — skip (the open issue is the record; a second session would only re-comment)"; continue
              fi

              # Ledger dedup: one TRIAGE per fingerprint per 24h (value = date or date|incident;
              # marker values — deferred-/cap-/none-/subjdup-/budget- prefixed — deliberately do
              # NOT match, which is also what keeps them out of the FU-149 session count).
              SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.fp-$FP}" 2>/dev/null || true)"
              case "$SEEN" in "$TODAY"|"$TODAY|"*) echo "→ $NAME ($FP): triaged today — skip"; continue;; esac
              # The INCIDENT still names the ledger value (alertname/namespace) — it is what makes
              # a spawned session identifiable after the fact. It no longer GATES anything: the
              # `INC_SEEN == 0` clause it used to carry was the escape hatch that made the cap
              # non-binding (FU-149).
              INCIDENT="$NAME/${_ns:--}"
              # Re-checked per alert, not just once per workflow: a single Alertmanager group can
              # carry many firing alerts, and the pre-loop gate cannot see the budget being spent
              # BY THIS LOOP. The script re-reads the ledger, which already contains the entries
              # written by earlier iterations, so N alerts in one payload cannot overshoot.
              if ! RESPONDER_DAILY_MAX="${RESPONDER_DAILY_MAX:-12}" bash /work/homelab/agents/responder-budget.sh; then
                kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"budget-$TODAY\"}}" >/dev/null 2>&1 || true
                echo "⚠ daily LLM triage budget exhausted (FU-149) — $NAME ($FP) NOT triaged (marker written; raise RESPONDER_DAILY_MAX or fix the storm)"; continue
              fi
              kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"$TODAY|$INCIDENT\"}}" >/dev/null 2>&1 \
                || echo "WARN: ledger patch failed — fp-issue search is the remaining dedup belt"
              kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"$SUBJ_KEY\":\"triaged-$TODAY\"}}" >/dev/null 2>&1 \
                || echo "WARN: subject ledger patch failed — a repeat of $SUBJ may re-triage today"

              printf '%s' "$a" > /tmp/alert-one.json

              # OWNERSHIP: THIS LOOKUP COMPUTES THE DEFAULT — THE TRIAGE'S NAMED FIX SURFACE WINS.
              # Precedence for the default: explicit stack/owner alert label → namespace ∈
              # AgentStack claims (repos[].name = fixer/app namespaces; '<stack>-agents' = the loop
              # ns) → PLATFORM.
              # ⚠ node/system alerts carry the EXPORTER's namespace (e.g. monitoring) — such
              # namespaces are in no claim, so they fall through to platform correctly.
              # ⚠ This block used to read "ownership is a lookup, not a judgment — never the brief",
              # and that is no longer the whole rule (operator amendment 2026-08-08, #124). The
              # lookup answers "where did the symptom appear", which is a different question from
              # "who owns the fix". Both directions failed in one night: nine egress drops fixable
              # by one line in oracle's claim were filed platform-side, AND a uv failure whose
              # symptom was in oracle-fleet had its fix platform-side — routing purely by symptom
              # would have misfiled that one the other way. What both triages DID state correctly
              # was their fix surface, so that is the routing signal and this lookup is the
              # fallback for when triage cannot name one. STEP 1 of the brief is the binding text;
              # keep the two in sync (the 2026-08-07 SELF_NOTE drift below is the cautionary tale).
              ALERT_NS="$_ns"
              OWNER_LABEL="$(printf '%s' "$a" | jq -r '.labels.stack // .labels.owner // empty')"
              CLAIMS="$(kubectl get agentstacks.platform.teststuff.net -o json 2>/dev/null                 || jq '{items: [.stacks[] | {metadata: {name: .name}, spec: {repos: [.repos[] | {name: .}]}}]}' /work/homelab/agents/stacks.json)"
              ROUTE_STACK="$(printf '%s' "$CLAIMS" | jq -r --arg ns "$ALERT_NS" --arg ol "$OWNER_LABEL" '
                (if $ol != "" then [.items[] | select(.metadata.name == $ol)] else [] end) as $byl
                | (if ($byl | length) > 0 then $byl
                   else [.items[] | select($ns != "" and (([.spec.repos[].name] | index($ns)) or ($ns == .metadata.name + "-agents")))] end)
                | (first | .metadata.name) // "platform"')"
              if [ "$ROUTE_STACK" = "platform" ]; then
                ROUTE_REPO="teststuffstash/homelab"
              else
                ROUTE_REPO="teststuffstash/$(printf '%s' "$CLAIMS" | jq -r --arg s "$ROUTE_STACK"                   '[.items[] | select(.metadata.name == $s) | .spec.repos[].name | select(endswith("-iac"))] | first // ($s + "-iac")')"
              fi

              # ── observation-window hand-off (IAC-G10) ───────────────────────────────────────
              # Two entry points reach the same post-merge machinery: change-triggered (a merge
              # opens a window; Degraded ≤120m auto-reverts, FU-044) and symptom-triggered (this
              # lane). Undefined ownership means a deterministic revert racing an LLM fix at the
              # same symptom. Rule: inside an open window the -iac lane owns it — attach evidence,
              # dispatch nothing. 120m matches the revert chain's own bound.
              WIN=""
              if [ -n "$_ns" ]; then
                WIN="$(kubectl get applications.argoproj.io -n argocd -o json 2>/dev/null \
                  | jq -r --arg ns "$_ns" --argjson cut "$(( $(date -u +%s) - 7200 ))" '
                      [ .items[]
                        | select(.spec.destination.namespace == $ns)
                        | select(((.status.operationState.finishedAt // "") | if . == "" then 0 else (fromdateiso8601? // 0) end) > $cut)
                        | .metadata.name ] | first // empty' 2>/dev/null || true)"
              fi
              [ -n "$WIN" ] && echo "→ $NAME ($FP): INSIDE the observation window of ArgoCD app '$WIN' (synced <120m) — the -iac lane owns this symptom"

              # Self-referential gate (2026-08-04) — deterministic, never the model's judgment.
              # Of the 27 issues this lane has filed, the ones most likely to want a fixer are
              # exactly the ones that DISABLE it: the registry mirror, CNI/Longhorn, the ARC
              # runners that gate every agent PR, the token broker, the loop's own namespaces.
              # The cap is on MERGING, not on working — refined 2026-08-04 after the first live
              # firing (#99, the ghcr mirror at 90%). "Report-only" was too coarse: it conflated
              # "can the fixer run" with "can the fix land safely", and those differ. A fixer pod
              # pulls agent-base DIRECT from ghcr (Talos containerd does not use the mirror,
              # FU-073), so it starts fine and can absolutely author the one-line PVC bump. What
              # is unsafe is the merge path — CI runners, image pulls, volumes it needs may be the
              # broken thing, and a green check proves nothing while the substrate is sick.
              # So: PR + review yes, auto-merge no. The marker stays machine-readable so the
              # future selfQueue knob (FU-090) derives --no-arm without re-deriving any of this.
              # Widening this list is cheap; narrowing it after a loop has eaten its own outage is
              # not. Rationale + the corpus: docs/agents/roles.md §responder, FU-133.
              #
              # ── THIRD KEY: the rule author's own declaration (#239, 2026-08-11) ──────────────
              # Both keys above INFER machinery from something else — a namespace in the platform
              # set, or an `Agent*` name — so a platform-machinery alert derived from a PUSHGATEWAY
              # metric matches neither. RetroReportOverdue (metric
              # retro_report_last_success_timestamp: no meaningful namespace, name not Agent*)
              # sailed through this gate on 2026-08-11, took a 'fix' verdict, was debounce-queued,
              # and put a coordinator ride on the retro belt — a CronWorkflow whose re-fire is an
              # argo mutation and whose manifests only a human merges. It ended in an agent/error
              # latch (homelab#237). Name regexes rot one alert at a time; a LABEL is declared at
              # the rule site, which is the only place the machinery fact is actually known. Same
              # rule-author convention as `triage: none`, and the two compose rather than overlap:
              # `triage: none` means do not investigate, this means investigate but a human merges.
              # ⚠ Stamped where it is LOAD-BEARING, not everywhere it would be true: an alert the
              # two keys above already catch gains nothing and would pay a label-set change — a new
              # Alertmanager fingerprint and therefore a reset 24h ledger key. A `triage: none`
              # alert is skipped before this gate, so a stamp there is inert as well. Which alerts
              # carry it is asserted by responder-behaviour-test.sh §#239 against the real
              # PrometheusRules — the only check that can catch a dropped stamp, since
              # `manifest-lint` SKIPS the PrometheusRule kind (no local CRD schema).
              # >>>REPLAY:responder-selfref-gate>>>
              ANS="$_ns" # includes the alert-scoped `source` fallback — see the _ns derivation above (#124)
              SELF_REF=""; SELF_WHY=""
              case "$ANS" in
                kube-system|argocd|longhorn-system|registry-cache|arc-runners|agent-coordinator|agent-egress|*-agents) SELF_REF=1; SELF_WHY="namespace='$ANS'";;
              esac
              case "$NAME" in Agent*) SELF_REF=1; SELF_WHY="${SELF_WHY:+$SELF_WHY + }alertname='$NAME'";; esac
              # Exact-match on "true": a label carrying any other value is NOT a declaration, and
              # a truthy-ish test would make a future `platform_machinery: "false"` mean its own
              # opposite. The value rides in the payload, so this costs zero lookups.
              case "$(printf '%s' "$a" | jq -r '.labels.platform_machinery // empty')" in
                true) SELF_REF=1; SELF_WHY="${SELF_WHY:+$SELF_WHY + }platform_machinery='true'";;
              esac
              # ⚠ This text is the BINDING rule — the comment above and the echo below only describe
              # it. It drifted once (50b8418/60c2826 updated comment+echo but not this string, so
              # "report-only" kept running for 3 days after the cap-the-merge ruling; found 2026-08-07).
              SELF_NOTE=""
              [ -n "$SELF_REF" ] && SELF_NOTE="
            ⚠ SELF-REFERENTIAL ALERT (computed deterministically — matched: $SELF_WHY): this fires in the agent loop's OWN substrate or its own machinery — the fix's merge path (CI runners, image pulls, volumes, the git-token broker) may be the very thing that is broken, and a green check proves nothing while the substrate is sick; and where the machinery is the loop's own control files, they run from master, so a merge there is a human's call by ruleset. The cap is on MERGING, not on working: you MAY author a fix PR, but NEVER enable auto-merge on it — state in the PR body that a human must merge it. End any issue body you file with the line 'self-referential: true' on its own line."
              [ -n "$SELF_REF" ] && echo "→ $NAME ($FP): SELF-REFERENTIAL (matched: $SELF_WHY) — may PR + be reviewed, must NOT auto-merge"
              # <<<REPLAY:responder-selfref-gate<<<

              # ── the fix PAYLOAD for egress drops (#124) ─────────────────────────────────────
              # Deterministic (keys off the alertname alone), because this alert's fixable cause
              # has exactly one shape: a legitimate destination missing from the claim's
              # egress.extraFQDNs. Nine fires produced nine triages that named the destination and
              # stopped there — correct symptom reports that no lane could act on, because none
              # carried the claim path, the suggested line, or a probe. The one artifact that
              # moved anything was hand-filed by a human (oracle-iac#307, a one-line addition).
              # Naming the required payload is what turns "here is the drop" into a fixable issue.
              EGRESS_NOTE=""
              case "$NAME" in
                AgentWorkerEgressDropped)
                  EGRESS_NOTE="
            ⚠ EGRESS-DROP PAYLOAD — this alert has NO namespace label; hubble's 'source' IS the namespace, so the namespace is '$_ns' and the fix almost always belongs to whoever owns that namespace's claim (STEP 1 still decides). If your verdict is a fixable allowlist miss, the issue you file MUST carry all three of:
              (1) the DENIED DESTINATION(S) — the FQDN, not just a drop rate. YOU CAN GET THIS FROM WHERE YOU ARE; the rule's annotation names 'devbox run hubble', which is the JAIL's recipe and needs a binary this image does not carry, so do NOT stop at it. The read that works from this pod, in order:
                (1a) PROMETHEUS, and this is the whole answer in one query. The drop metric already resolves names — tofu/cilium.tf sets 'drop:sourceContext=namespace;destinationContext=dns|ip', so the 'destination' label IS the FQDN whenever the DNS proxy knew it. Use the in-cluster service DNS, not the LAN VIP (a LoadBalancer IP is a 'world' destination and is not a route you should depend on):
                  curl -sG http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query --data-urlencode 'query=topk(10, sum by (source,destination,protocol) (increase(hubble_drop_total{reason=\"POLICY_DENIED\",source=\"$_ns\"}[6h])) > 0)'
                Widen the window before you conclude nothing is there — a ride that hung hours ago is outside [6h]; [24h] and [7d] are cheap. A 'destination' that is a bare IP means the DNS proxy never saw a name for it (direct-to-IP, or the L7 dns rule is not on that path), which is itself a finding — report the IP and say so.
                (1b) HUBBLE, only when you need per-flow detail Prometheus cannot give (port, timing, the exact pod). There is no 'hubble' in this image and no port-forward verb, so exec it inside a cilium agent, which does carry the binary: 'kubectl exec -n kube-system ds/cilium -- hubble observe --namespace $_ns --verdict DROPPED --last 200'. ⚠ CAVEAT YOU MUST STATE IF YOU USE IT: that reads ONE node's ring buffer — the node whichever cilium pod ds/cilium picked — so an absence there is NOT evidence of no drops. Point it at the relay to get the fleet ('--server \$(kubectl get svc -n kube-system hubble-relay -o jsonpath={.spec.clusterIP}):80'), and if the relay is unreachable say which node you sampled.
              Only after (1a) and (1b) have both actually been RUN and failed may you say you cannot name the destination — and then say which one failed and how, never a bare 'could not verify'. Prefer report-only over a fix issue naming an FQDN you never saw; but an unrun query is not a blocked one.
              (2) the CLAIM PATH plus the exact suggested line: a stack's claim lives at <namespace>/agent/agentstack.yaml in that stack's -iac repo (oracle: oracle-fleet/agent/agentstack.yaml in oracle-iac; sleep: sleep-tracking/agent/agentstack.yaml in sleep-iac), the platform's at agents/fixer/openrouter-operator/agentstack.yaml in homelab, and the field is the repo's fixer.egress.extraFQDNs list.
              (3) the ACCEPTANCE PROBE: zero POLICY_DENIED drops for that source+destination pair on the next ride.
            A destination that is tool phone-home (telemetry, update pings) is NOT an allowlist miss: kill it at the tool (agents/agent-session.sh env), say so, and never widen policy for noise. A drop does not by itself imply a hung ride."
                  ;;
              esac

              # ── #228 (a): SNAPSHOT the closed marker-carrying threads BEFORE the session ────
              # The session below may REOPEN a closed issue on either belt — the FU-133 SUBJECT
              # match ("this resource has failed before") or the alert-fp flap belt ("this exact
              # fingerprint has a history"). `gh issue reopen` is the LLM's own verb, so there is
              # nothing else to observe a reopen BY: the only deterministic signal is which
              # marker-carrying threads were closed a moment ago and are open a moment later.
              # Hence a snapshot here and the comparison after the session, both in launcher-owned
              # shell (ADR-094 — the LLM judges, the shell acts; a strip written into the brief is
              # an instruction, not a guard).
              # `gh search` is right HERE and only here: these are OLD issues, so the index lag the
              # verdict half below deliberately avoids cannot bite, and a REST walk of every closed
              # issue in every claimed repo is not affordable. Both belts are snapshotted because
              # both reopen — the live #228 case came in on the subject one.
              # ⚠ FAIL-OPEN, stated so nobody reads it as a promise: a search that errors or lags
              # yields no candidates and no strip, and the FU-069 breaker is what catches the
              # contradiction then — exactly today's behaviour, never worse than it.
              # >>>REPLAY:responder-reopen-presnap>>>
              PRECLOSED=""
              for pq in "subject:$SUBJ" "alert-fp:$FP"; do
                for pc in $(gh search issues --owner "$ORG" --match body "$pq" --state closed \
                              --json repository,number --limit 20 2>/dev/null \
                            | jq -r '.[] | "\(.repository.nameWithOwner)#\(.number)"' 2>/dev/null || true); do
                  case " $PRECLOSED " in *" $pc "*) continue;; esac
                  PRECLOSED="$PRECLOSED $pc"
                done
              done
              [ -n "$PRECLOSED" ] && echo "→ $NAME ($FP): closed thread(s) a reopen could restore:$PRECLOSED"
              # <<<REPLAY:responder-reopen-presnap<<<

              echo "── triaging $NAME ($FP) — route default: stack=$ROUTE_STACK repo=$ROUTE_REPO (the named fix surface may move it)"
              claude -p "You are the RESPONDER (homelab docs/agents/roles.md): triage ONE firing Prometheus alert.

            THE ALERT (JSON): $(cat /tmp/alert-one.json)

            SUBJECT (computed deterministically — the RESOURCE this alert is about): $SUBJ
            Before filing anything, search ACROSS the agent repos for an issue containing 'subject:$SUBJ' — OPEN or CLOSED, regardless of age, and NOT just in the repo you intend to file on: 'gh search issues --owner teststuffstash --match body' plus the marker. Org-wide is required because STEP 1 routes by fix surface, so an earlier fire of this same resource may sit in a DIFFERENT repo than the one you pick today, and a per-repo search would file a duplicate instead of finding it. A match means this resource has failed before: comment there (reopening if closed) instead of filing a new issue, and say what is DIFFERENT this time.
            ⚠ ON A MATCH, READ THAT THREAD BEFORE YOU RE-DERIVE ANYTHING — 'gh issue view <n> --json title,body,comments' (the --json form; the plain view renders EMPTY under this token, so empty output means you have NOT read it). The prior triage is EVIDENCE, not noise: it already paid for the reads you are about to repeat, and it may simply contain the answer. This is not hypothetical — on 2026-08-08 a session hit three tool walls, concluded 'cannot name the FQDN', and filed that on a thread where a triage three hours earlier under the SAME fingerprint had named it ('releases.astral.sh'). Your triage must either CITE the prior verdict and say what changed, or state in one line why it is wrong. Re-deriving from scratch on a thread you were pointed at is the failure mode; a session that repeats a predecessor's dead end and reports it as new is worse than one that files nothing. One root cause owns one issue; the fingerprint belt below is the narrower same-alert check, this is the same-RESOURCE one. Whatever you FILE must carry the literal marker 'subject:$SUBJ' on its own line; a COMMENT carries it ONLY on a thread that already does — the boundary immediately below decides comment-vs-file.

            ⚠ ONE SUBJECT PER THREAD — comment ONLY on a matching marker, correlate by LINK (#149, 2026-08-08). Comment onto an existing issue ONLY when 'subject:$SUBJ' is ALREADY a marker on that thread (its body, or a comment you can point at). If the thread you found is about a DIFFERENT subject — another resource, another alert class on the same node, a shared cause you believe in — then it is RELATED, not the same: file your OWN issue and cross-reference by LINK, with a line 'related: #N — <why>' in its body (one comment on #N saying the same is fine, provided it carries NO subject marker of yours). NEVER attach your 'subject:' marker to a thread that does not already carry it. The reason is mechanical, not stylistic: an issue's identity IS its subject marker and the dedup search greps COMMENTS, so a second marker makes that thread the org-wide search hit for two resources FOREVER — closing it does not help, the comment stays indexed, and every later fire of either resource routes onto the wrong record. Both live grafts on 2026-08-08 came from the right instinct and the wrong mechanism: #103, born as a wk-01 CPU-containment record, took a NodeMemoryMajorPagesFaults triage carrying subject:workload:monitoring/kube-prometheus-stack-prometheus-node-exporter — a subject with no prior issue of its own — so node-exporter alerts on ANY node now search-hit wk-01's thread; #100, a Longhorn disk-capacity issue, took a PodSigkilled occurrence as its third alert class. Anti-fragmentation stays right (one root cause owns one issue), but 'same root cause' is a claim about CAUSE while the marker is IDENTITY: when the two disagree, identity wins and the link carries the cause. Grouping alerts together is Alertmanager's job at filing time (FU-133 leg a); a comment can never retrofit it.

            Context available: /work/homelab is a fresh homelab clone (docs/, agents/stacks.json). kubectl READS may work (degrade gracefully if RBAC-denied). gh is authenticated (issues + PRs + contents on the agent repos). Shallow-clone a stack repo under /work/ if you need code context.

            STEP 1 — ROUTE BY THE FIX SURFACE YOU NAME, NOT BY THE SYMPTOM'S NAMESPACE. A default is already computed deterministically from the symptom's namespace ('$_ns'): owner stack = '$ROUTE_STACK', default target repo = '$ROUTE_REPO'. Use that default ONLY when your diagnosis cannot name a fix surface. The moment it can — and STEP 2 requires you to try — the issue goes to the repo that OWNS the file a fix would edit, and the 'Touches:' line must be paths in THAT repo:
              - the fix is a stack's claim, manifests, workflows or CI (e.g. <namespace>/agent/agentstack.yaml) → that stack's -iac repo;
              - the fix is that stack's application code → the stack's app repo;
              - the fix is platform machinery — anything under agents/, argocd/, tofu/, ansible/, policy/ or docs/ in homelab, including the worker launcher's env card and this responder itself → teststuffstash/homelab.
            State in ONE line which surface you named and therefore which repo you chose; when that repo is not the computed default, that line is the whole audit trail for the re-route. If two surfaces are genuinely plausible, file on the one you would edit FIRST and name the other in the body — still exactly one issue. Never file on a repo that is not in a claim in /work/homelab/agents/stacks.json.
            Why this replaced the older 'the route is computed, do NOT re-derive': on the night of 2026-08-07 both directions failed at once. Nine egress-drop fires whose fix was ONE line in oracle's claim were filed platform-side, where no lane picked them up, while the fix would have been shipped within the hour by oracle's own live iac fixer; the same night a uv failure whose symptom appeared in oracle-fleet had its fix platform-side, so symptom-routing would have misfiled that one in the opposite direction. Both triages named their fix surface correctly. The namespace predicts where a symptom shows up; it does not predict who fixes it.

            STEP 2 — diagnose from the alert labels/annotations + whatever context you can actually reach. Say what you verified vs assumed.

            ⚠ SATURATED vs BROKEN — a steady-state COUNTER cannot tell them apart. 'running: 4, pending: 0' looks identical whether the pool is working at its ceiling or cannot pick up work at all, so a capacity diagnosis needs a THROUGHPUT signal, never a level one. Before blaming any cap (maxRunners, replicas, a semaphore, a connection pool), check that work is actually MOVING: a saturated pool has jobs RUNNING, a broken one has workers WAITING. For CI/runner-dispatch symptoms specifically ('not acquired by Runner', jobs stuck queued, acquirejob ServiceUnavailable) that means, and all three are cheap: (1) 'gh run list --status in_progress' across the repos — ZERO in_progress while runners idle is the broken signature, not contention; (2) the AGE of the ephemeral runner pods — they exit after ONE job, so a runner alive for an hour has acquired nothing; (3) https://www.githubstatus.com/api/v2/components.json for the 'Actions' component, because a vendor outage is invisible from inside the cluster and every in-cluster signal will look like ours. This exact misdiagnosis has been made twice, once by a responder session and once by the meta-coordinator (agents/coordinator/TICK-LOG.md, 2026-08-06). During a confirmed Actions outage the correct outcome is (a) transient: report it, do NOT re-run anything (re-runs deepen the dead queue) and do NOT propose a capacity change — an outage is not evidence about a cap.

            $SELF_NOTE
            $EGRESS_NOTE

            ${WIN:+⚠ OBSERVATION WINDOW: ArgoCD app '$WIN' synced into this namespace within the last 120 minutes, so a deploy is the prime suspect and the -iac lane already owns this symptom — its deterministic revert (FU-044) may be acting on it right now. Do NOT open a fix PR and do NOT propose one: a revert racing a fix at the same symptom is the failure this rule exists to prevent. Report your evidence, name the app, and stop.}

            STEP 3 — act with the CHEAPEST SUFFICIENT outcome:
            (a) transient / already-recovered / known-benign → report your reasoning to stdout, touch NOTHING.
            (b) a GitOps quick fix on the stack's -iac repo (bad pin → revert/bump PR; the CI-only lane auto-merges): do it now — branch, PR, 'gh pr merge --auto --squash' — and report.
            ⚠ HOW TO WRITE AN ISSUE OR COMMENT BODY — mechanical, and it has already destroyed one issue. Compose the body into a FILE and pass 'gh issue create --body-file <path>' (same for '--body-file' on 'gh issue comment'). NEVER build it as an interpolated double-quoted argument, and never put an unquoted \$(...) anywhere in it. On 2026-08-08 a body built that way executed its own diagnostic output into the text: ~360 lines of hubble flows and a --help dump landed in the issue (65KB), every inline code span was eaten so the RBAC verb, the VIP and the CRD name all rendered BLANK, and the newlines stayed literal — the four identifiers the fixer needed were the exact things deleted. A corrupted body is not cosmetic: the fixer's first act is to read it. Also keep raw tool output OUT of the body — quote the two or three lines that carry your evidence, fenced, and say where the rest came from. Re-read what you wrote before you file it: a code span that renders empty, or a literal backslash-n, means the body is corrupt and you must rewrite it.
            (c) needs real work → file EXACTLY ONE issue on the repo STEP 1's rule selects — the owner of your named fix surface, defaulting to '$ROUTE_REPO' when you named none: title '🚨 <alertname>: <one-line summary>', body = evidence + your diagnosis + the literal marker 'alert-fp:$FP' + a 'Touches:' line (ADR-097) declaring the write surface a fix would need, as repo-relative paths or globs — e.g. 'Touches: argocd/resources/registry-cache/**'. Declare the NARROWEST surface your diagnosis actually supports; it is the footprint the scan uses to avoid double-dispatch and the reviewer uses to flag escapes, so a vague one is worse than none. Then CLASSIFY it before you file: source '/work/homelab/agents/footprint.sh' and, with 'CLASSIFY_CODEOWNERS=/work/homelab/CODEOWNERS' set, call 'classify_touches \"<the Touches: value you just wrote>\"'. A 'codeowner-author' verdict (the operator-author set: '.github/', '.agents/', 'devbox.json'/'.lock', 'scripts/') or an intersection with '/work/homelab/scripts/pin-only-lint.sh's GUARDED set means no worker can ever land this as a PR, so say so in the body as ONE plain sentence naming the classifier and its verdict (e.g. 'classify_touches: codeowner-author — needs an operator push to master, not a PR') — never a new body line for it; the issue is inert anyway, so this sentence is the only place the verdict reaches the issue itself rather than sitting in the scan log alone (homelab#1207). If you genuinely cannot tell which paths a fix would touch, say so in the body and omit the line rather than guessing wide — an undeclared footprint is treated as exclusive, which is the safe default. ALSO end the body with a verdict line, exactly one of: 'fix-verdict: fix' (a code/manifest change in a repo would durably fix this) or 'fix-verdict: report-only' (transient, vendor-side, or needs a human decision first). The verdict is a DIAGNOSIS, not a dispatch — queueing is the platform's job, never yours. When your diagnosis identifies a SINGLE causing issue in the same repo — not a guess, an uncertainty, or a stack of suspects — include the line 'Cause: #<n>' in the body (exact format, one line, same repo only; the shell will bind it as a native sub-issue edge). Omit the line when uncertain; an honest standalone issue is better than a wrong lineage. NO agent labels — the issue is inert; the shell reads your verdict after.
            (d) whenever the repo you filed on is NOT the computed default '$ROUTE_REPO' — stack-ward or platform-ward, the rule is symmetric (see STEP 1) — the body must carry the one-line reason: the fix surface that took you there.

            HARD RULES: before filing, search the agent repos ORG-WIDE (same reason as the subject search above — the route can move between fires) for an issue containing 'alert-fp:$FP' — OPEN or CLOSED. Open: add ONE comment there, no new issue. CLOSED: the resolve leg closed it when the alert cleared and it is now firing again, so REOPEN that one (gh issue reopen) and comment — never file a second issue for a fingerprint that already has a history. That reopen is what stops a flapping alert from churning issues. Never more than one issue per session. No kubectl mutations. Never push to master. If anything smells like an automation loop (duplicate PRs, your own prior artifacts piling up), STOP and report only. Name your tool gaps as evidence, not lobbying (homelab#536): when a NAMED diagnostic or tool is unavailable in-pod — RBAC-denied verb, a binary this image lacks, an egress-blocked fetch — and its absence changed what you could verify, add ONE line to your issue body (or your stdout report, when report-only) whose FIRST characters are exactly 'TOOL_GAP: <tool-or-verb> — <what it was needed for, one clause>'. Once per session per tool; never a request for the grant itself — the janitor aggregates these into the operator's inventory, and a gap already ruled stays listed with its ruling.

            REMEDIATION-WOULD MARKER — when your verdict names a mechanical remediation you WOULD have performed had the dial been armed (an IMPERATIVE cluster action the #834 dial would have granted — delete a wedged pod, restart a crashlooping workload, clear a stuck resource; a GitOps quick fix — revert/bump PR — is ALREADY a sanctioned outcome of yours and takes NO marker), emit ONE structured line at the start of a line in your output:
              REMEDIATION-WOULD: <verb> <namespace>/<kind>/<name> — <one-clause reason>
            For example: 'REMEDIATION-WOULD: delete oracle-fleet/pod/ert-mock-7f9c4-x2v1b — CrashLoopBackOff on a config already fixed on master; a delete lets the ReplicaSet re-pull.'
            At most one per distinct remediation per session. Do NOT emit this line when your verdict is report-only or when no mechanical remediation applies." \
                --model "$(case "$rail" in opencode-go/*) echo "$rail";; *) bash /work/homelab/agents/resolve-model.sh --role responder --fallback sonnet;; esac)" --permission-mode bypassPermissions --max-turns 40 </dev/null \
                || echo "WARN: triage session failed for $NAME ($FP) — alert still routes to HA; refire re-triages tomorrow"

              # ── #228 (b): A REOPEN RESTORES A RECORD, NEVER A QUEUE ─────────────────────────
              # Live 2026-08-09. The subject belt reopened closed homelab#103 for a new same-subject
              # alert (NodeDiskIOSaturation, verdict report-only) and GitHub brought the thread back
              # wearing its PREVIOUS life's labels: `agent-fix`+`agent/queued` from a CPU fix that
              # had already merged, plus `agent/done` from its closeout. The next queued-dispatch
              # unit met `agent/queued ∧ agent/done` on merged work and refused via the FU-069
              # breaker. Nothing was harmed, and that is exactly the problem: the breaker is the
              # ANOMALY net, and a reopen-of-a-completed-issue is not an anomaly — it is the
              # designed behaviour of two belts that will fire again next week. A belt is not a
              # guard, and the guard belongs at the reopen site, which is here.
              #
              # Strip the WHOLE lifecycle set on EVERY reopen, unconditionally, and let the verdict
              # half below re-derive from the diagnosis this session just recorded — precisely what
              # it would do for an issue filed today. Unconditional is the operator's pre-decision
              # (#228): a conditional keep ("this one label is probably still true") is how the
              # next contradiction ships, and every label here is cheap to re-earn — `agent-fix`
              # from the verdict line, `agent/queued` from the debouncer's set-pass.
              #
              # Compare-then-write: only labels actually present are named in the edit, so a thread
              # that came back clean draws no call at all. And NO comment is posted — the reopened
              # thread stays OPEN, so a machine comment here would never be the last word on it and
              # would repeat once per flap cycle, which is the #148 rule the resolve leg at the top
              # of this file already turns on. The session's own comment is the record; this line
              # in the workflow log is the audit trail.
              # >>>REPLAY:responder-reopen-strip>>>
              for pc in $PRECLOSED; do
                prepo="${pc%#*}"; pnum="${pc#*#}"
                # One read, `state|labels` — a thread still CLOSED was not reopened and is not ours
                # to touch. A failed read yields an empty state and is skipped for the same reason
                # the resolve leg never closes on one: acting on an unread issue is the worse error.
                # This cannot tell OUR session's reopen from a human's in the same minute, and does
                # not try to: a reopened thread is a record either way, and the labels it needs are
                # the ones its next verdict earns — not the ones its last life ended with.
                pmeta="$(gh api "repos/$prepo/issues/$pnum" --jq '.state + "|" + ([.labels[]?.name] | join(","))' 2>/dev/null || true)"
                [ "${pmeta%%|*}" = open ] || continue
                plabels=",${pmeta#*|},"
                pstrip=""
                for pl in agent/queued agent/in-progress agent/done agent-fix; do
                  case "$plabels" in *",$pl,"*) pstrip="${pstrip:+$pstrip,}$pl";; esac
                done
                if [ -z "$pstrip" ]; then
                  echo "→ reopened $pc: no stale lifecycle labels — already a clean record"; continue
                fi
                gh issue edit "$pnum" --repo "$prepo" --remove-label "$pstrip" >/dev/null 2>&1 \
                  && echo "→ reopened $pc: stripped stale lifecycle labels ($pstrip) — a RECORD again; only a fresh verdict may re-queue it" \
                  || echo "→ reopened $pc: strip of ($pstrip) FAILED (non-fatal) — the FU-069 breaker is still behind this"
              done
              # <<<REPLAY:responder-reopen-strip<<<

              # ── verdict → agent-fix + doorbell (FU-133 dispatch half, 2026-08-07) ───────────
              # Replaces selfQueue (cb4ae5a), which labelled agent-fix+agent/queued per-issue and
              # so dispatched same-cause issues in parallel (iac-lane.md §"one root cause, N alert
              # issues"). Split: the session's issue carries 'fix-verdict: fix|report-only' (a
              # DIAGNOSIS — breaker #1 still keeps labels out of the session's hands); this shell
              # applies agent-fix, which is INERT by the scan's own predicate (dispatch requires
              # agent-fix ∧ agent/queued, coordinator-scan.sh:8); QUEUEING belongs to the
              # fix-debounce workflow (fix-debounce-argo.yaml), rung here via /fix-verdict.
              # REST reads, not `gh search` — the search index lags a just-filed issue; and REST
              # keeps this lane off the GraphQL pool the reflex drained on 2026-07-17 (FU-084).
              # One deterministic no-bell case: inside an observation window the -iac lane owns
              # the symptom; if the problem outlives the window the alert refires and re-rings.
              # Self-referential issues DO ring — the debouncer skips 'self-referential: true'
              # bodies at wake (dispatch onto broken substrate stays a human call), but the
              # agent-fix verdict is still the durable record.
              # The candidate list is no longer (default, platform): STEP 1 routes by the named fix
              # surface, so a session may legitimately land on ANY claimed repo. Searching only the
              # default would silently drop the verdict — the issue would sit unlabelled, the bell
              # would never ring, and the finding would look like a report-only triage. Order is
              # cheapest-first (the default is still the common case) and the loop breaks on the
              # first hit, so the extra REST reads only happen when the route actually moved.
              # ⚠ The candidates are ALL claimed repo names, NOT just the `-iac` ones (#154): STEP 1
              # also routes app-ward ("the fix is that stack's application code → the stack's app
              # repo"), and a workflow/CI file in a stack repo is app-repo surface. Filtering to
              # -iac here made those filings inert — oracle-fleet#228 carried 'fix-verdict: fix' and
              # sat unlabelled for ~6h until a human hand-queued it. (The -iac filter on ROUTE_REPO
              # above is a different question and stays: a stack's DEFAULT route is its -iac.)
              # >>>REPLAY:responder-verdict-dispatch>>>
              VREPOS=""
              for vr in "$ROUTE_REPO" "teststuffstash/homelab" \
                        $(printf '%s' "$CLAIMS" | jq -r '.items[]?.spec.repos[]?.name | "teststuffstash/" + .' 2>/dev/null || true); do
                case " $VREPOS " in *" $vr "*) continue;; esac # the default is usually also in the claim list
                VREPOS="$VREPOS $vr"
              done
              VHIT=""; VREPO=""
              for vrepo in $VREPOS; do
                VHIT="$(gh api "repos/$vrepo/issues?state=open&sort=updated&direction=desc&per_page=20" \
                        --jq "[.[] | select((.body // \"\") | contains(\"alert-fp:$FP\"))] | first | .number // empty" 2>/dev/null || true)"
                [ -n "$VHIT" ] && { VREPO="$vrepo"; break; }
              done
              if [ -z "$VHIT" ]; then
                echo "→ verdict: no open issue carries alert-fp:$FP (report-only triage or quick-fix PR) — nothing to label"
              else
                VBODY="$(gh api "repos/$VREPO/issues/$VHIT" --jq '.body // ""' 2>/dev/null || true)"
                if printf '%s' "$VBODY" | grep -qi '^fix-verdict:[[:space:]]*fix[[:space:]]*$'; then
                  gh api -X POST "repos/$VREPO/issues/$VHIT/labels" -f "labels[]=agent-fix" >/dev/null 2>&1 \
                    && echo "→ verdict: $VREPO#$VHIT labelled agent-fix (inert — queueing is the debouncer's)" \
                    || echo "→ verdict: labelling $VREPO#$VHIT failed (non-fatal) — stays unlabelled, backstop re-derives"
                  if [ -n "$WIN" ]; then
                    echo "→ verdict: NO bell — inside app '$WIN' observation window; a refire re-rings after it"
                  else
                    curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"repo\":\"$VREPO\",\"number\":$VHIT}" \
                      "${AGENT_LOOP_WEBHOOK:-http://agent-loop-eventsource-svc.agent-coordinator.svc.cluster.local:12000}/fix-verdict" >/dev/null 2>&1 \
                      && echo "→ verdict: rang /fix-verdict for $VREPO#$VHIT (debounce decides the set)" \
                      || echo "→ verdict: bell failed (non-fatal) — the debounce backstop cron re-derives the pending set"
                  fi
                else
                  echo "→ verdict: $VREPO#$VHIT carries no 'fix-verdict: fix' — stays inert (report-only diagnosis)"
                fi
              fi
              # <<<REPLAY:responder-verdict-dispatch<<<

              # ── bind-at-filing: if the issue names a causing issue, link it as a sub-issue ────
              # (ADR-094 S6): the session judges whether a single cause is identified; the shell
              # acts. If the issue body carries a line-anchored 'Cause: #<n>' marker (same repo
              # only; cross-repo causes are logged and left unbound), POST the native sub-issue
              # edge. Same pattern as .agents/fix.yaml: CID from the cause issue, POST to
              # repos/<slug>/issues/<cause>/sub_issues with sub_issue_id=$CID. Same-repo only:
              # sub-issues are same-owner; v1 stays narrow.
              # >>>REPLAY:responder-cause-line>>>
              if [ -n "$VHIT" ] && [ -n "$VREPO" ]; then
                CBODY="$(gh api "repos/$VREPO/issues/$VHIT" --jq '.body // ""' 2>/dev/null || true)"
                CAUSE_LINE="$(printf '%s' "$CBODY" | grep -E '^Cause: #[0-9]+' | head -1 || true)"
                if [ -n "$CAUSE_LINE" ]; then
                  CAUSE_NUM="$(printf '%s' "$CAUSE_LINE" | sed -E 's/^Cause: #([0-9]+).*/\1/')"
                  if printf '%s' "$CAUSE_NUM" | grep -qE '^[0-9]+$'; then
                    # Verify the cause issue exists and get its GH API ID for the sub-issue link
                    CAUSE_ID="$(gh api "repos/$VREPO/issues/$CAUSE_NUM" --jq '.id // empty' 2>/dev/null || true)"
                    if [ -n "$CAUSE_ID" ]; then
                      ISSUE_META="$(gh api "repos/$VREPO/issues/$VHIT" --jq '{id: .id, parent: .parent.id}' 2>/dev/null || true)"
                      if [ -n "$ISSUE_META" ]; then
                        NEW_ID="$(printf '%s' "$ISSUE_META" | jq -r '.id // empty')"
                        if [ -n "$NEW_ID" ]; then
                          CUR_PARENT="$(printf '%s' "$ISSUE_META" | jq -r '.parent // empty')"
                          if [ -n "$CUR_PARENT" ]; then
                            echo "→ bind-at-filing: $VREPO#$VHIT already linked as sub-issue (skip re-link)"
                          else
                            gh api -X POST "repos/$VREPO/issues/$CAUSE_NUM/sub_issues" -F sub_issue_id="$NEW_ID" >/dev/null 2>&1 \
                              && echo "→ bind-at-filing: $VREPO#$VHIT linked as sub-issue of $VREPO#$CAUSE_NUM" \
                              || echo "→ bind-at-filing: $VREPO#$VHIT has Cause: #$CAUSE_NUM but link POST failed (non-fatal, body is fallback)"
                          fi
                        else
                          echo "→ bind-at-filing: could not get API ID for $VREPO#$VHIT (skip link attempt)"
                        fi
                      else
                        echo "→ bind-at-filing: could not read $VREPO#$VHIT (skip link attempt)"
                      fi
                    else
                      echo "→ bind-at-filing: Cause: #$CAUSE_NUM not found or unreadable in $VREPO (skip link attempt)"
                    fi
                  fi
                fi
              fi
              # <<<REPLAY:responder-cause-line<<<
            done
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "1Gi" }
