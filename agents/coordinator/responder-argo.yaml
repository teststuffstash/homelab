# responder-argo — the FU-103 responder role's activation machinery (roles.md §responder).
#
# V2 (operator direction 2026-07-27): TRIAGE-FIRST, ISSUES ONLY WHEN TRIAGE DECIDES. V1 filed one
# evidence issue per alert on homelab — rejected: machine-rate issue creation pollutes the tracker
# (one bug from 4000 issues overnight), and a stack workload's alert belongs to the STACK's ops
# surface (its -iac repo), reaching homelab only when the stack needs something from the platform.
# Now a firing alert fingerprint gets ONE inline LLM triage session (sonnet, subscription-gated),
# whose cheapest-sufficient outcome is: report-only → GitOps quick fix on the stack's -iac
# (revert/pin PR through the CI-only auto-merge lane) → ONE issue in the stack's -iac/app repo →
# a homelab issue ONLY for platform namespaces or needs-platform. Same autonomy the jail
# meta-sessions exercise, scoped to GitOps verbs + issue writes (no kubectl mutations).
#
# Machinery inventory:
#   predicate  = Alertmanager firing (fan-out route in tofu/monitoring.tf)
#   edge       = /alert webhook (review-argo.yaml EventSource) → this Sensor
#   backstop   = NONE by design — alerts are level-triggered (repeat_interval refires ≤3h)
#   key        = alert fingerprint: responder-seen ConfigMap ledger (24h window) + an
#                `alert-fp:<fp>` open-issue search belt in the brief
#   capacity   = Sensor rateLimit 6/min + subscription-capacity semaphore + the FU-088 latch
#                + a mechanical 12-triages/day cap (unique-fp storms, e.g. label churn)
#   breakers   = one issue max per session (brief + the fp belts); no agent labels on filed
#                issues (inert, breaker #1); loop-smell → report-only stop
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: responder
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review # same submit-only Role as review/coordinate Sensors
  dependencies:
    - name: alert-dep
      eventSourceName: agent-loop
      eventName: alert
  triggers:
    - rateLimit: { unit: Minute, requestsPerUnit: 6 } # dumb outer belt vs alert storms
      template:
        name: submit-respond
        conditions: "alert-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: respond-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: respond }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: alert-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
---
# The respond WorkflowTemplate — per NEW fingerprint: one inline sonnet triage session.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: respond
  namespace: agent-coordinator
spec:
  entrypoint: respond
  serviceAccountName: agent-coordinator
  # Queue behind the shared subscription pool like review/coordinate workflows (FU-088 Argo layer).
  synchronization:
    semaphores:
      - configMapKeyRef: { name: subscription-capacity, key: claude }
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: respond
      inputs:
        parameters:
          - { name: payload }
      metadata:
        labels: { app: respond-workflow }
      # FU-113(b): the responder must not trust the alert edge to refire — a latch-deferred
      # triage EXITS 1 and Argo re-runs it here with backoff (15m→2h, 6 tries ≈ the FU-088
      # window). The 24h fp ledger + deferred-markers keep retries idempotent; retries
      # exhausted = a Failed workflow, visible in Argo + the crosscheck belt.
      retryStrategy:
        limit: "6"
        retryPolicy: OnFailure
        backoff: { duration: "15m", factor: "2" }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator:2026.7.25-g141235c93140
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          # Payload rides an env var, NOT shell interpolation — an apostrophe in an alert
          # annotation must not break quoting (k8s env delivery is byte-safe).
          - { name: PAYLOAD, value: "{{inputs.parameters.payload}}" }
          # Subscription auth via the ADR-087 ref rail (the reviewer pattern — never the raw token).
          - { name: ANTHROPIC_BASE_URL, value: "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/anthropic" }
          - { name: ANTHROPIC_AUTH_TOKEN, value: "ref:agent-coordinator/coordinator-claude" }
          - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            printf '%s' "$PAYLOAD" > /tmp/alerts.json
            # ── RESOLVE LEG (FU-133, 2026-08-04) ────────────────────────────────────────────
            # "Alert cleared, issue remains" was never a bug in the triage — the event was never
            # DELIVERED: the responder receiver ran send_resolved = false, so nothing downstream
            # ever learned an alert stopped firing. Three issues (#77/#91/#92) outlived their
            # alerts by up to a day and were closed by hand.
            #
            # Deterministic, no LLM, no session: find the fingerprint's issue and record the clear.
            # Closing is conditional ON PURPOSE — a human comment means someone owns it, and
            # auto-closing under them is worse than leaving it open. A flapping alert cannot churn
            # issues either: the firing path's fp-issue belt REOPENS what this closed rather than
            # filing a new one.
            jq -r '.alerts[]? | select(.status == "resolved") | [(.fingerprint // ""), (.labels.alertname // "?")] | @tsv' \
              /tmp/alerts.json 2>/dev/null | while IFS="$(printf '\t')" read -r rfp rname; do
              [ -n "$rfp" ] || continue
              hit="$(gh search issues --owner "$ORG" "alert-fp:$rfp" --state open --json repository,number \
                     --limit 5 2>/dev/null | jq -r '.[] | "\(.repository.nameWithOwner)#\(.number)"' | head -1)"
              if [ -z "$hit" ]; then echo "→ resolved $rname ($rfp): no open issue — nothing to close"; continue; fi
              rrepo="${hit%#*}"; rnum="${hit#*#}"
              # Human engagement = anyone whose login is not a bot. gh renders App logins with a
              # [bot] suffix HERE (REST); the reviewer's REST-vs-GraphQL mismatch (FU-069) does not
              # apply to this endpoint, but the test stays suffix-tolerant on purpose.
              humans="$(gh issue view "$rnum" --repo "$rrepo" --json comments \
                        --jq '[.comments[]? | select((.author.login // "") | test("\\[bot\\]$") | not)] | length' 2>/dev/null || echo 0)"
              gh issue comment "$rnum" --repo "$rrepo" \
                --body "✅ **Alert cleared** — \`$rname\` (alert-fp:\`$rfp\`) stopped firing at $(date -u +%Y-%m-%dT%H:%M:%SZ). Posted by the responder's resolve leg (FU-133); the issue does not have to be true any more just because it was filed." >/dev/null 2>&1 || true
              if [ "${humans:-0}" -eq 0 ]; then
                gh issue close "$rnum" --repo "$rrepo" --reason completed >/dev/null 2>&1 \
                  && echo "→ resolved $rname ($rfp): commented + CLOSED $hit (no human had engaged)" \
                  || echo "→ resolved $rname ($rfp): commented $hit, close failed (non-fatal)"
              else
                echo "→ resolved $rname ($rfp): commented $hit, left OPEN — $humans human comment(s), someone owns it"
              fi
            done

            COUNT="$(jq -r '[.alerts[]? | select(.status == "firing")] | length' /tmp/alerts.json 2>/dev/null || echo 0)"
            [ "${COUNT:-0}" -gt 0 ] || { echo "no firing alerts in payload — resolve leg done, nothing to triage"; exit 0; }

            rm -rf /work/homelab
            git clone --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab

            TODAY="$(date -u +%Y-%m-%d)"
            # FU-113(a): every non-triaging outcome writes a LEDGER MARKER (value forms that do
            # NOT satisfy the triage dedup or consume the cap) — a silent defer/skip was
            # indistinguishable from a drop (2026-07-27 postmortem). (b): a latch defer exits 1
            # so Argo's retryStrategy re-runs THIS workflow — never trust the edge to refire.
            if ! SUBSCRIPTION_TIER=dispatch bash /work/homelab/agents/subscription-latch.sh; then
              jq -r '.alerts[]? | select(.status == "firing") | .fingerprint // empty' /tmp/alerts.json \
                | while read -r dfp; do [ -n "$dfp" ] && kubectl -n agent-coordinator patch cm responder-seen \
                    --type merge -p "{\"data\":{\"fp-$dfp\":\"deferred-$TODAY\"}}" >/dev/null 2>&1 || true; done
              echo "triage DEFERRED — subscription limited (FU-088); markers written, exit 1 → Argo retries with backoff (FU-113b)"; exit 1
            fi

            kubectl -n agent-coordinator get cm responder-seen >/dev/null 2>&1 \
              || kubectl -n agent-coordinator create cm responder-seen >/dev/null 2>&1 || true

            # </dev/null on the claude call below: a piped while-read loop's stdin IS the
            # remaining alerts — claude eats them and a multi-alert group triages only its
            # first member (found live 2026-07-27 by meta-alert-crosscheck.sh, run 1).
            jq -c '.alerts[] | select(.status == "firing")' /tmp/alerts.json | while read -r a; do
              FP="$(printf '%s' "$a" | jq -r '.fingerprint // empty')"
              NAME="$(printf '%s' "$a" | jq -r '.labels.alertname // "unknown-alert"')"
              [ -n "$FP" ] || FP="$(printf '%s' "$a" | jq -r '.labels | tostring' | sha256sum | cut -c1-16)"

              # triage:none — the rule AUTHOR declared this alert self-describing (capacity
              # states, heartbeats): no session, no ledger slot, no daily-cap spend. The label
              # rides in the payload, so this costs zero lookups. Rule-side convention:
              # argocd/resources/*/prometheusrule.yaml.
              if [ "$(printf '%s' "$a" | jq -r '.labels.triage // empty')" = "none" ]; then
                kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"none-$TODAY\"}}" >/dev/null 2>&1 || true
                echo "→ $NAME ($FP): triage:none (self-describing by rule author) — marker written, skip"; continue
              fi

              # Ledger dedup: one TRIAGE per fingerprint per 24h (value = date or date|incident;
              # marker values — deferred-/cap-/none- prefixed — deliberately do NOT match).
              SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o jsonpath="{.data.fp-$FP}" 2>/dev/null || true)"
              case "$SEEN" in "$TODAY"|"$TODAY|"*) echo "→ $NAME ($FP): triaged today — skip"; continue;; esac
              # FU-113(c): the daily cap counts INCIDENTS (alertname/namespace), not raw
              # fingerprints — a label-churn storm collapses to one incident instead of eating
              # the cap. 12 distinct incidents/day.
              INCIDENT="$NAME/$(printf '%s' "$a" | jq -r '.labels.namespace // "-"')"
              N_TODAY="$(kubectl -n agent-coordinator get cm responder-seen -o json 2>/dev/null | jq -r --arg t "$TODAY" '[.data // {} | to_entries[] | select(.value | startswith($t)) | (.value | split("|") | .[1] // "-")] | unique | length')"
              INC_SEEN="$(kubectl -n agent-coordinator get cm responder-seen -o json 2>/dev/null | jq -r --arg v "$TODAY|$INCIDENT" '[.data // {} | to_entries[] | select(.value == $v)] | length')"
              if [ "${N_TODAY:-0}" -ge 12 ] && [ "${INC_SEEN:-0}" -eq 0 ]; then
                kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"cap-$TODAY\"}}" >/dev/null 2>&1 || true
                echo "⚠ responder daily incident cap (12) reached — $NAME ($FP) NOT triaged (marker written; raise the cap or fix the storm)"; continue
              fi
              kubectl -n agent-coordinator patch cm responder-seen --type merge -p "{\"data\":{\"fp-$FP\":\"$TODAY|$INCIDENT\"}}" >/dev/null 2>&1 \
                || echo "WARN: ledger patch failed — fp-issue search is the remaining dedup belt"

              printf '%s' "$a" > /tmp/alert-one.json

              # OWNERSHIP IS A LOOKUP, NOT A JUDGMENT (decision-free → script, never the brief).
              # Precedence: explicit stack/owner alert label → namespace ∈ AgentStack claims
              # (repos[].name = fixer/app namespaces; '<stack>-agents' = the loop ns) → PLATFORM.
              # ⚠ node/system alerts carry the EXPORTER's namespace (e.g. monitoring) — such
              # namespaces are in no claim, so they fall through to platform correctly.
              ALERT_NS="$(printf '%s' "$a" | jq -r '.labels.namespace // empty')"
              OWNER_LABEL="$(printf '%s' "$a" | jq -r '.labels.stack // .labels.owner // empty')"
              CLAIMS="$(kubectl get agentstacks.platform.teststuff.net -o json 2>/dev/null                 || jq '{items: [.stacks[] | {metadata: {name: .name}, spec: {repos: [.repos[] | {name: .}]}}]}' /work/homelab/agents/stacks.json)"
              ROUTE_STACK="$(printf '%s' "$CLAIMS" | jq -r --arg ns "$ALERT_NS" --arg ol "$OWNER_LABEL" '
                (if $ol != "" then [.items[] | select(.metadata.name == $ol)] else [] end) as $byl
                | (if ($byl | length) > 0 then $byl
                   else [.items[] | select($ns != "" and (([.spec.repos[].name] | index($ns)) or ($ns == .metadata.name + "-agents")))] end)
                | (first | .metadata.name) // "platform"')"
              if [ "$ROUTE_STACK" = "platform" ]; then
                ROUTE_REPO="teststuffstash/homelab"
              else
                ROUTE_REPO="teststuffstash/$(printf '%s' "$CLAIMS" | jq -r --arg s "$ROUTE_STACK"                   '[.items[] | select(.metadata.name == $s) | .spec.repos[].name | select(endswith("-iac"))] | first // ($s + "-iac")')"
              fi
              # ── subject: key (FU-133) — the resource this alert is ABOUT ────────────────────
              # The lane deduped on FINGERPRINT, which is per-alert-instance: homelab#94 and #98
              # were the same PVC failing the same way 25 minutes apart, but different pod names
              # meant different fingerprints, so it filed twice. The subject is what makes a
              # recurrence findable — including one 8 days later, which no time window catches
              # (the ghcr mirror: #47 → #80 → #93, three issues, one resource).
              # Pod names are stripped of their generated suffixes, which is the whole trick:
              # coordinator-104803 and coordinator-110038 both become workload:platform-agents/coordinator.
              _ns="$(printf '%s' "$a" | jq -r '.labels.namespace // empty')"
              _pvc="$(printf '%s' "$a" | jq -r '.labels.persistentvolumeclaim // empty')"
              _pod="$(printf '%s' "$a" | jq -r '.labels.pod // empty')"
              _node="$(printf '%s' "$a" | jq -r '.labels.node // empty')"
              _repo="$(printf '%s' "$a" | jq -r '.labels.repo // empty')"
              _wf="$(printf '%s' "$a" | jq -r '.labels.workflow // empty')"
              _strip() { printf '%s' "$1" | sed -E 's/-[a-z0-9]{5}$//; s/-[0-9]{4,}$//; s/-[a-f0-9]{8,10}$//'; }
              if   [ -n "$_pvc" ];                    then SUBJ="pvc:${_ns}/${_pvc}"
              elif [ -n "$_repo" ] && [ -n "$_wf" ];  then SUBJ="workflow:${_repo}/${_wf}"
              elif [ -n "$_pod" ];                    then SUBJ="workload:${_ns}/$(_strip "$_pod")"
              elif [ -n "$_node" ];                   then SUBJ="node:${_node}"
              elif [ -n "$_ns" ];                     then SUBJ="ns:${_ns}"
              else                                         SUBJ="alert:${NAME}"; fi
              echo "→ $NAME ($FP): subject=$SUBJ"

              # ── observation-window hand-off (IAC-G10) ───────────────────────────────────────
              # Two entry points reach the same post-merge machinery: change-triggered (a merge
              # opens a window; Degraded ≤120m auto-reverts, FU-044) and symptom-triggered (this
              # lane). Undefined ownership means a deterministic revert racing an LLM fix at the
              # same symptom. Rule: inside an open window the -iac lane owns it — attach evidence,
              # dispatch nothing. 120m matches the revert chain's own bound.
              WIN=""
              if [ -n "$_ns" ]; then
                WIN="$(kubectl get applications.argoproj.io -n argocd -o json 2>/dev/null \
                  | jq -r --arg ns "$_ns" --argjson cut "$(( $(date -u +%s) - 7200 ))" '
                      [ .items[]
                        | select(.spec.destination.namespace == $ns)
                        | select(((.status.operationState.finishedAt // "") | if . == "" then 0 else (fromdateiso8601? // 0) end) > $cut)
                        | .metadata.name ] | first // empty' 2>/dev/null || true)"
              fi
              [ -n "$WIN" ] && echo "→ $NAME ($FP): INSIDE the observation window of ArgoCD app '$WIN' (synced <120m) — the -iac lane owns this symptom"

              # Self-referential gate (2026-08-04) — deterministic, never the model's judgment.
              # Of the 27 issues this lane has filed, the ones most likely to want a fixer are
              # exactly the ones that DISABLE it: the registry mirror, CNI/Longhorn, the ARC
              # runners that gate every agent PR, the token broker, the loop's own namespaces.
              # The cap is on MERGING, not on working — refined 2026-08-04 after the first live
              # firing (#99, the ghcr mirror at 90%). "Report-only" was too coarse: it conflated
              # "can the fixer run" with "can the fix land safely", and those differ. A fixer pod
              # pulls agent-base DIRECT from ghcr (Talos containerd does not use the mirror,
              # FU-073), so it starts fine and can absolutely author the one-line PVC bump. What
              # is unsafe is the merge path — CI runners, image pulls, volumes it needs may be the
              # broken thing, and a green check proves nothing while the substrate is sick.
              # So: PR + review yes, auto-merge no. The marker stays machine-readable so the
              # future selfQueue knob (FU-090) derives --no-arm without re-deriving any of this.
              # Widening this list is cheap; narrowing it after a loop has eaten its own outage is
              # not. Rationale + the corpus: docs/agents/roles.md §responder, FU-133.
              ANS="$(printf '%s' "$a" | jq -r '.labels.namespace // empty')"
              SELF_REF=""
              case "$ANS" in
                kube-system|argocd|longhorn-system|registry-cache|arc-runners|agent-coordinator|agent-egress|*-agents) SELF_REF=1;;
              esac
              case "$NAME" in Agent*) SELF_REF=1;; esac
              SELF_NOTE=""
              [ -n "$SELF_REF" ] && SELF_NOTE="
            ⚠ SELF-REFERENTIAL ALERT (computed deterministically from namespace='$ANS'): this fires in the agent loop's OWN substrate, so any fix needs the very thing that is broken — pod scheduling, image pull, PVC attach, the git-token broker, or the CI runners that gate every agent PR. Your outcome is CAPPED AT REPORT-ONLY: do not open a PR and do not propose one as the next step; describe the fix in prose for a human instead. End any issue body you file with the line 'self-referential: true' on its own line."
              [ -n "$SELF_REF" ] && echo "→ $NAME ($FP): SELF-REFERENTIAL (ns=$ANS) — may PR + be reviewed, must NOT auto-merge"

              # ── selfQueue (FU-090) — the switch that makes an alert dispatch a fixer ──────────
              # DETERMINISTIC, never the model's judgment: breaker #1 says the session must not
              # label its own issue, so the session still files INERT and the shell decides after.
              # Three gates, all fail-closed — anything unclear leaves the issue inert for a human:
              #   1. not self-referential (a fixer would need the broken thing)
              #   2. the issue declares a Touches: footprint at all (ADR-097 — undeclared is
              #      treated as exclusive, and auto-dispatching an exclusive unit serialises the
              #      whole lane)
              #   3. that footprint touches no GOVERNANCE path, in any repo: agent machinery, CI
              #      definitions, policy, scripts. sleep-iac#28 self-merged an edit to
              #      .github/workflows/ in 38 seconds — that class must never auto-dispatch.
              SQ_DENY='^(agents/|scripts/|policy/|\.github/|tofu/github/|tofu/cloudflare/)'
              sq_decide() { # <repo> <issue-number>
                local body touches p
                body="$(gh issue view "$2" --repo "$1" --json body --jq .body 2>/dev/null || true)"
                touches="$(printf '%s' "$body" | sed -n 's/^[Tt]ouches:[[:space:]]*//p' | head -1)"
                [ -n "$touches" ] || { echo "no Touches: line (undeclared = exclusive)"; return 1; }
                for p in $(printf '%s' "$touches" | tr ',' ' '); do
                  case "$p" in ''|' ') continue;; esac
                  printf '%s' "$p" | grep -qE "$SQ_DENY" && { echo "footprint touches governance: $p"; return 1; }
                done
                return 0
              }
              if [ -n "$SELF_REF" ]; then
                echo "→ selfQueue: REFUSED for $FP — self-referential substrate"
              elif [ -n "$WIN" ]; then
                echo "→ selfQueue: REFUSED for $FP — inside app '$WIN' observation window; the -iac lane owns it"
              else
                sq="$(gh search issues --owner "$ORG" "alert-fp:$FP" --state open --json repository,number --limit 3 2>/dev/null \
                      | jq -r '.[] | "\(.repository.nameWithOwner) \(.number)"' | head -1)"
                if [ -z "$sq" ]; then
                  echo "→ selfQueue: no open issue for $FP (triage was report-only) — nothing to queue"
                else
                  sqrepo="${sq%% *}"; sqnum="${sq##* }"
                  if gh issue view "$sqnum" --repo "$sqrepo" --json labels --jq '[.labels[].name]|index("agent-fix")' 2>/dev/null | grep -qv null; then
                    echo "→ selfQueue: $sqrepo#$sqnum already adopted — leaving it alone"
                  elif why="$(sq_decide "$sqrepo" "$sqnum")"; then
                    gh issue edit "$sqnum" --repo "$sqrepo" --add-label agent-fix --add-label agent/queued >/dev/null 2>&1 \
                      && echo "→ selfQueue: QUEUED $sqrepo#$sqnum for dispatch" \
                      || echo "→ selfQueue: labelling $sqrepo#$sqnum failed (non-fatal) — stays inert"
                  else
                    echo "→ selfQueue: left $sqrepo#$sqnum inert — $why"
                  fi
                fi
              fi
              echo "── triaging $NAME ($FP) — route: stack=$ROUTE_STACK repo=$ROUTE_REPO (deterministic)"
              claude -p "You are the RESPONDER (homelab docs/agents/roles.md): triage ONE firing Prometheus alert.

            THE ALERT (JSON): $(cat /tmp/alert-one.json)

            SUBJECT (computed deterministically — the RESOURCE this alert is about): $SUBJ
            Before filing anything, search the target repo for an issue containing 'subject:$SUBJ' — OPEN or CLOSED, and regardless of age. A match means this resource has failed before: comment there (reopening if closed) instead of filing a new issue, and say what is DIFFERENT this time. One root cause owns one issue; the fingerprint belt below is the narrower same-alert check, this is the same-RESOURCE one. Whatever you file or comment on must carry the literal marker 'subject:$SUBJ' on its own line.

            Context available: /work/homelab is a fresh homelab clone (docs/, agents/stacks.json). kubectl READS may work (degrade gracefully if RBAC-denied). gh is authenticated (issues + PRs + contents on the agent repos). Shallow-clone a stack repo under /work/ if you need code context.

            STEP 1 — the route is ALREADY COMPUTED deterministically: owner stack = '$ROUTE_STACK', target repo for any issue/PR = '$ROUTE_REPO'. Do NOT re-derive or re-route to a different stack. The ONE allowed override: escalate platform-ward (file on teststuffstash/homelab instead) when your diagnosis shows the fix needs something only the platform can change — and state that reason in the issue.

            STEP 2 — diagnose from the alert labels/annotations + whatever context you can actually reach. Say what you verified vs assumed.

            ⚠ SATURATED vs BROKEN — a steady-state COUNTER cannot tell them apart. 'running: 4, pending: 0' looks identical whether the pool is working at its ceiling or cannot pick up work at all, so a capacity diagnosis needs a THROUGHPUT signal, never a level one. Before blaming any cap (maxRunners, replicas, a semaphore, a connection pool), check that work is actually MOVING: a saturated pool has jobs RUNNING, a broken one has workers WAITING. For CI/runner-dispatch symptoms specifically ('not acquired by Runner', jobs stuck queued, acquirejob ServiceUnavailable) that means, and all three are cheap: (1) 'gh run list --status in_progress' across the repos — ZERO in_progress while runners idle is the broken signature, not contention; (2) the AGE of the ephemeral runner pods — they exit after ONE job, so a runner alive for an hour has acquired nothing; (3) https://www.githubstatus.com/api/v2/components.json for the 'Actions' component, because a vendor outage is invisible from inside the cluster and every in-cluster signal will look like ours. This exact misdiagnosis has been made twice, once by a responder session and once by the meta-coordinator (agents/coordinator/TICK-LOG.md, 2026-08-06). During a confirmed Actions outage the correct outcome is (a) transient: report it, do NOT re-run anything (re-runs deepen the dead queue) and do NOT propose a capacity change — an outage is not evidence about a cap.

            $SELF_NOTE

            ${WIN:+⚠ OBSERVATION WINDOW: ArgoCD app '$WIN' synced into this namespace within the last 120 minutes, so a deploy is the prime suspect and the -iac lane already owns this symptom — its deterministic revert (FU-044) may be acting on it right now. Do NOT open a fix PR and do NOT propose one: a revert racing a fix at the same symptom is the failure this rule exists to prevent. Report your evidence, name the app, and stop.}

            STEP 3 — act with the CHEAPEST SUFFICIENT outcome:
            (a) transient / already-recovered / known-benign → report your reasoning to stdout, touch NOTHING.
