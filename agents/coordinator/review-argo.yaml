# Review reflex on Argo (ADR-093 Phase 1) — the event-driven half of the merge path, replacing the
# */5 GraphQL-polling review-reflex CronJob's latency with a near-instant trigger (the ADR-084
# sync.yaml-webhook pattern, generalized). PROVEN 2026-07-17: POST {repo,number} → JetStream
# EventBus → Sensor maps the body into workflow params → Argo submits a `review` Workflow →
# reviewer-session.sh reviews that exact PR. Runs ALONGSIDE the CronJob (agents/coordinator/
# review-reflex.yaml) which stays as instant rollback + the level-triggered backstop; double-review
# is prevented by reviewer-session.sh STEP 0's self-guard. DORMANT until a trigger source POSTs to
# the webhook (next increment: the github-exporter emits on a PR→reviewable transition, in-cluster,
# reusing the one poller — no per-repo CI edits, collapses the FU-084 GraphQL burn). FU-080 renders
# this per-stack from the AgentStack Composition (two knobs: coordinator.enabled off / reviewer.enabled on).
---
# JetStream EventBus — the stateful trigger bus (FU-082 requests; 3 replicas for quorum, 1Gi PVCs).
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: agent-coordinator
spec:
  jetstream:
    version: latest # → nats:2.10.10, pinned by the argo-events 2.4.23 controller config
    replicas: 3
    persistence:
      volumeSize: 1Gi
      storageClassName: longhorn
    containerTemplate:
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits: { memory: "256Mi" }
---
# Webhook EventSource — an in-cluster POST /review {repo,number} endpoint (svc :12000).
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: agent-loop
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  service:
    ports:
      - { port: 12000, targetPort: 12000 }
  webhook:
    review:
      port: "12000"
      endpoint: /review
      method: POST
    # FU-085: the coordinator doorbell — POST /coordinate {repo} wakes the scan in seconds where
    # the */10 cron would wait minutes. Consumed by the `coordinator` Sensor (coordinate-argo.yaml).
    coordinate:
      port: "12000"
      endpoint: /coordinate
      method: POST
    # FU-103: the responder edge — Alertmanager webhook_configs POST here on firing alerts.
    # Consumed by the `responder` Sensor (responder-argo.yaml). Alerts are level-triggered, so
    # this edge has NO cron backstop by design (a missed delivery refires on the next group
    # interval).
    alert:
      port: "12000"
      endpoint: /alert
      method: POST
    # FU-044: the deterministic-revert edge — argocd-notifications POSTs a post-sync Degraded
    # app here (tofu/argocd.tf notifications block). Consumed by the `deploy-revert` Sensor
    # (deploy-revert-argo.yaml). oncePer revision upstream; missed delivery = the app stays
    # Degraded and the notification refires on the next state transition (plus the responder
    # lane sees any alert-shaped symptom).
    deploy-degraded:
      port: "12000"
      endpoint: /deploy-degraded
      method: POST
    # FU-133 dispatch half: the responder rings this after applying an agent-fix VERDICT label.
    # Consumed by the `fix-debounce` Sensor (fix-debounce-argo.yaml) — suspend N minutes, then
    # judge the whole pending set (agent-fix without agent/queued) before any issue is queued.
    # Missed delivery = the backstop cron in the same file re-derives the set from GitHub.
    fix-verdict:
      port: "12000"
      endpoint: /fix-verdict
      method: POST
    # homelab#650: the iac-sentinel head-changed edge — the github-exporter POSTs {repo, pr, head}
    # when a new head sha appears on an open PR of a sentinel-covered repo. Consumed by the
    # `sentinel` Sensor (sentinel-argo.yaml); the reflexes-argo.yaml cron is the backstop.
    sentinel:
      port: "12000"
      endpoint: /sentinel
      method: POST
    # ADR-111 (homelab#744): the updater doorbell — the github-exporter POSTs {repo} when an
    # armed green PR goes BEHIND (maybe_dispatch_behind, #743). Consumed by the `update-pr`
    # Sensor (update-pr-argo.yaml); the */15 CronWorkflow in the same file is the backstop.
    update-pr:
      port: "12000"
      endpoint: /update-pr
      method: POST
---
# Sensor — on a review event, submit a `review` Workflow with repo/number from the event body.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: review
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  dependencies:
    - name: review-dep
      eventSourceName: agent-loop
      eventName: review
    # FU-100 per-stack review edge routing: the SAME review event, matched only when the exporter
    # carried a non-empty loop_ns (a GRADUATED repo — github-exporter.py graduated_loop_ns, from
    # agents/stacks.json). Mirrors coordinate-perstack (coordinate-argo.yaml): the ".+" regex
    # data-filter fails on a missing/empty loop_ns, so plain {repo,number} POSTs take the global
    # trigger ALONE. A graduated POST satisfies BOTH deps: the global review workflow defers it
    # (stacks.json guard below) and this trigger reviews it in its own ns.
    - name: review-perstack
      eventSourceName: agent-loop
      eventName: review
      filters:
        data:
          # Argo string data-filter values are REGEXes (""/"!=" rejected — the coordinate-argo
          # lesson). ".+" = any non-empty loop_ns; missing/empty extracts to "" and fails.
          - path: body.loop_ns
            type: string
            comparator: "="
            value:
              - ".+"
  triggers:
    - template:
        name: submit-review
        conditions: "review-dep" # scope to the global dep so a graduated POST can't gate it
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: review-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: review }
                arguments:
                  parameters:
                    - { name: repo, value: "OVERRIDE" }
                    - { name: number, value: "OVERRIDE" }
          parameters:
            - src: { dependencyName: review-dep, dataKey: body.repo }
              dest: spec.arguments.parameters.0.value
            - src: { dependencyName: review-dep, dataKey: body.number }
              dest: spec.arguments.parameters.1.value
    # FU-100: submit an inline review Workflow INTO <loop_ns> as agentstack-loop — the
    # coordinate-perstack routing applied to reviews, closing the ~15-min cron-only latency for
    # graduated stacks. Inlined (not a per-stack WorkflowTemplate) so the agentstack Composition
    # stays byte-identical per stack; RBAC = the composed sensor-submit-coordinate Role/Binding
    # in <loop_ns> (generic `workflows create` for the sensor-review SA — already rendered).
    # No rateLimit, matching the global review trigger: the exporter dedups per reviewable head,
    # so bursts are structurally bounded. Capacity = reviewer-session's subscription latch
    # (ConfigMap semaphores can't cross ns — the composition's FU-080 (5) note); idempotency =
    # the reviewer-pod check below + STEP-0, same belts as the global path + the */15 cron.
    - template:
        name: submit-review-perstack
        conditions: "review-perstack"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: review-perstack-
                namespace: PLACEHOLDER # ← body.loop_ns (parameters below)
              spec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 1800 # matches the review-<stack> cron's belt
                ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
                # homelab#103 soft hostname spread — rationale on the `coordinate` WorkflowTemplate
                # (coordinate-argo.yaml). Applies inside <loop_ns>.
                # homelab#867 soft Longhorn-disk de-preference — same rationale.
                podSpecPatch: |
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchExpressions:
                          - { key: workflows.argoproj.io/workflow, operator: Exists }
                  affinity:
                    nodeAffinity:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 10
                          preference:
                            matchExpressions:
                              - key: node.longhorn.io/create-default-disk
                                operator: NotIn
                                values:
                                  - "true"
                arguments:
                  parameters:
                    - { name: repo, value: PLACEHOLDER }
                    - { name: number, value: PLACEHOLDER }
                    - { name: loop_ns, value: PLACEHOLDER }
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    metadata:
                      labels: { app: review-perstack-workflow }
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          REPO="{{workflow.parameters.repo}}"; PR="{{workflow.parameters.number}}"; NS="{{workflow.parameters.loop_ns}}"
                          echo "review(perstack): ${REPO}#${PR} ns=${NS} (exporter edge)"
                          # Same idempotency guard as the global review workflow, scoped to OUR
                          # ns — the */15 review-<stack> cron may have dispatched first.
                          # BACKSTOPS, and which one covers what (homelab#204): reviewer-session.sh
                          # runs a SHELL guard before it creates anything — agents/reviewer-optout.sh
                          # (the stack's reviewer.enabled knob, fail-CLOSED) — and the pod's prompt
                          # STEP-0 self-guards on review history. This trigger is one of three
                          # dispatch sites and deliberately reads NEITHER knob itself: the sites
                          # converge on reviewer-session.sh, so the knob is read once there. It used
                          # to be read only inside the reflex tick, and this path approved +
                          # auto-merged agent-runtime#57 on an opted-out stack (2026-08-09 08:00Z).
                          # If you add a fourth dispatch site, route it through reviewer-session.sh
                          # too — do not copy a jq in here.
                          if kubectl get pods -n "${NS}" -l "app=agent-reviewer,project=${REPO},pr=${PR}" \
                               --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name 2>/dev/null | grep -q .; then
                            echo "review(perstack): ${REPO}#${PR} already under review — skipping (idempotent)"; exit 0
                          fi
                          # Broker-fetched stack-scoped git token for the session's gh reads (the
                          # review-<stack> cron's pattern); reviewer-session.sh --loop-ns fetches
                          # its own role=reviewer token for the pod's verdict writes.
                          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                          GH_TOKEN="$(curl -fsS -H "Authorization: Bearer ${SA_TOKEN}" \
                            "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/loop-git-token?ns=${NS}&role=coordinator")" \
                            || { echo "FATAL: loop-git token fetch refused/failed — not reviewing blind"; exit 1; }
                          export GH_TOKEN
                          rm -rf /work/homelab
                          # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
                          # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
                          # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
                          # old anonymous behavior (degrade, never a new hard dependency).
                          _cu="https://github.com/teststuffstash/homelab.git"
                          [ -n "${GH_TOKEN:-}" ] && _cu="https://x-access-token:${GH_TOKEN}@github.com/teststuffstash/homelab.git"
                          git clone --depth 1 -b master "$_cu" /work/homelab
                          exec bash /work/homelab/agents/reviewer-session.sh "${REPO}" "${PR}" --loop-ns "${NS}"
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: ORG, value: "teststuffstash" }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "512Mi" }
          parameters:
            - src: { dependencyName: review-perstack, dataKey: body.loop_ns }
              dest: metadata.namespace
            - src: { dependencyName: review-perstack, dataKey: body.repo }
              dest: spec.arguments.parameters.0.value
            - src: { dependencyName: review-perstack, dataKey: body.number }
              dest: spec.arguments.parameters.1.value
            - src: { dependencyName: review-perstack, dataKey: body.loop_ns }
              dest: spec.arguments.parameters.2.value
---
# The review Workflow — one step: clone homelab, run the proven reviewer-session.sh for the PR.
# Runs as the agent-coordinator SA (pod-create for reviewer-session.sh's reviewer pod + the
# workflowtaskresults binding below). One level of pod indirection (workflow→reviewer) reuses the
# battle-tested launcher unchanged; a native-step reviewer is a later refinement.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: review
  namespace: agent-coordinator
spec:
  serviceAccountName: agent-coordinator
  # FU-088 Argo layer: an edge-triggered review queues ("waiting for lock") instead of spawning
  # into a full subscription pool — see the subscription-capacity ConfigMap in reflexes-argo.yaml.
  synchronization:
    semaphores:
      - configMapKeyRef: { name: subscription-capacity, key: claude }
  # homelab#103 soft hostname spread — rationale on the `coordinate` WorkflowTemplate
  # (coordinate-argo.yaml). Verbatim copy; keep in sync.
  # homelab#867 soft Longhorn-disk de-preference — same rationale.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  entrypoint: main
  arguments:
    parameters:
      - name: repo
      - name: number
  templates:
    - name: main
      inputs:
        parameters:
          - name: repo
          - name: number
      metadata:
        labels: { app: review-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        command: ["bash", "-lc"]
        args:
          - |
            set -e
            REPO="{{inputs.parameters.repo}}"; PR="{{inputs.parameters.number}}"
            # Safe parallel with the CronJob reflex: skip if a reviewer pod for this PR already
            # exists (the CronJob may have dispatched first) — the same app=agent-reviewer,project,pr
            # idempotency review-reflex.sh uses. Backstops: reviewer-session.sh's shell guard
            # (agents/reviewer-optout.sh — the stack's reviewer.enabled knob, fail-CLOSED,
            # homelab#204) and then the pod prompt's STEP-0 self-guard on review history.
            # ⚠ The `graduated` deferral below is NOT the optout. It reads a different field for a
            # different purpose (which reviewer owns the PR, not whether one should run), and it is
            # exactly why this site looked safe: platform is graduated, so this workflow never
            # fired for it — but a NON-graduated stack with reviewer.enabled=false would fall
            # straight through to the dispatch. The knob is enforced in reviewer-session.sh, once,
            # for all three sites.
            if kubectl get pods -n agent-coordinator -l "app=agent-reviewer,project=${REPO},pr=${PR}" \
                 --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name 2>/dev/null | grep -q .; then
              echo "review: ${REPO}#${PR} already under review — skipping (idempotent)"; exit 0
            fi
            rm -rf /work/homelab
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
            # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
            # old anonymous behavior (degrade, never a new hard dependency).
            _cu="https://github.com/teststuffstash/homelab.git"
            [ -n "${GH_TOKEN:-}" ] && _cu="https://x-access-token:${GH_TOKEN}@github.com/teststuffstash/homelab.git"
            git clone --depth 1 -b master "$_cu" /work/homelab
            # FU-080: a graduated stack is reviewed by its OWN per-stack review-<stack> cron (in
            # <stack>-agents as agentstack-loop). This global workflow runs as agent-coordinator and
            # CAN'T create reviewer pods in that ns, so DEFER — the review-perstack trigger above
            # (FU-100) reviews it near-instantly in <loop_ns>, the */15 cron backstops a routing
            # miss (e.g. a degraded exporter stacks.json fetch → plain POST lands only here).
            # Keeps the global + per-stack reviewers from racing the same PR. The global
            # review-reflex cron skips graduated too.
            if jq -e --arg r "$REPO" '.stacks[]|select((.graduated//false)==true)|select([.repos[]]|index($r))' /work/homelab/agents/stacks.json >/dev/null 2>&1; then
              echo "review: $REPO belongs to a graduated stack — deferring to its per-stack review cron"; exit 0
            fi
            exec bash /work/homelab/agents/reviewer-session.sh "$REPO" "$PR"
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "512Mi" }
      volumes:
        - { name: work, emptyDir: {} }
        - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
---
# Sensor identity — submit Workflows from the trigger.
apiVersion: v1
kind: ServiceAccount
metadata: { name: sensor-review, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sensor-review, namespace: agent-coordinator }
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sensor-review, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sensor-review }
subjects:
  - { kind: ServiceAccount, name: sensor-review, namespace: agent-coordinator }
---
# The review workflow runs as agent-coordinator (pod-create); it also needs the chart's workflow
# Role (workflowtaskresults create/patch) to report step results.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflows-workflow-coordinator, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflows-workflow }
subjects:
  - { kind: ServiceAccount, name: agent-coordinator, namespace: agent-coordinator }
