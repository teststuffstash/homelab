# Reviewer git token (agents/reviewer-session.sh, docs/agents/workflow.md). Mints the `reviewer-git`
# Secret the reviewer pod mounts as GH_TOKEN — the review bot's GitHub identity for `gh pr review
# --approve` / `--request-changes`. Distinct from coordinator-git/agent-git-token ON PURPOSE: those
# are homelab-agents[bot] (the PR author), and GitHub blocks self-approval. This is homelab-reviewer[bot].
#
# ⚠️ SCAFFOLD — prereqs (one-time): the homelab-reviewer App is bootstrapped + its key is in Infisical
# (scripts/github-app-bootstrap.sh homelab-reviewer) and installed on the agent repos. Fill appID/installID
# below from `github-app-bootstrap.sh homelab-reviewer secrets`. Applied with kubectl (not ArgoCD), AFTER rbac.yaml:
#   kubectl --kubeconfig tofu/kubeconfig apply -f agents/coordinator/reviewer-git.yaml
---
# 1) App private key: Infisical → a k8s Secret in this namespace the generator reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reviewer-github-app
  namespace: agent-coordinator
spec:
  refreshInterval: 1h
  secretStoreRef: { name: infisical, kind: ClusterSecretStore }
  target:
    name: reviewer-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        privateKey: '{{ .pem | replace "\\n" "\n" }}'
  data:
    - secretKey: pem
      remoteRef: { key: REVIEWER_GH_APP_PRIVATE_KEY }
---
# 2) The generator: mint an installation token — contents:write + pull_requests:write. contents:WRITE is
# required for homelab-reviewer[bot]'s approval to COUNT toward the required-approval ruleset — GitHub only
# counts reviews from a reviewer with repo write access; contents:read → authorAssociation NONE, ignored
# (learned 2026-07-02). The reviewer still never merges — GitHub auto-merge does that once approval + CI pass.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: reviewer-git-gen
  namespace: agent-coordinator
spec:
  appID: "4199252"           # homelab-reviewer App (github-app-bootstrap.sh homelab-reviewer, 2026-07-02)
  installID: "143941082"     # the teststuffstash installation of homelab-reviewer
  auth:
    privateKey:
      secretRef: { name: reviewer-github-app, key: privateKey }
  permissions:
    contents: write          #   clone the PR branch + make the bot a repo WRITER so its approval counts
    pull_requests: write     #   submit the review (approve / request-changes) + inline comments
    issues: read             #   resolve the ISSUE a PR claims to fix (scope-authorization reads its
                             #   Touches:) + the depth-rule parent walk. The App grant existed since
                             #   FU-069(b) — but the MINT never requested it, so every issue read
                             #   403'd while PR reads worked (the breaker's PR-side writes ride
                             #   pull_requests, which masked it) — homelab#1038, 4 false blocks on
                             #   sleep-tracking#137 before the coordinator stopped the loop.
    checks: read             #   independently confirm CI-green on the head it reviews (App grant
    statuses: write          #   widened by the operator 2026-07-10 (read) — the PR #6 re-review had
    actions: read            #   to caveat "CI not independently confirmed"; these three closed that.
                             #   statuses → WRITE 2026-08-18 (App grant clicked same day): the
                             #   iac-sentinel posts its required `iac-sentinel` commit status under
                             #   THIS identity — never the worker's own, which could pass itself
                             #   (the G01 enforcement flip, iac-lane.md §L0b). ⚠ ordering: the
                             #   manifest line lands only AFTER the App grant — requesting an
                             #   ungranted permission 422s the ESO mint and stops the reviewer
                             #   token refreshing fleet-wide.
  repositories:              #   the repos where agent PRs land (mirror coordinator-git; verify
    - sleep-tracking         #   the exporter /apps page confirms coverage BEFORE adding — ESO 422s otherwise)
    - snore-recorder         #   NB comments in this list go TRAILING — the registration lint's
    - sleep-iac              #   parser stops at the first non-item line (found 2026-07-16)
    - openrouter-operator
    - oracle-fleet
    - oracle-iac
    - agent-runtime          # added 2026-07-16: the #14 reviewer produced a verdict it could not
    - agent-coordinator      # SUBMIT — App installed, token not scoped here
    - allure-behavior-snippets # oracle stack context-only; Apps installed 2026-07-16
    - circles                # added 2026-08-03: circles stack (homelab-reviewer App covers it — verified on exporter /apps)
    - circles-iac            # ditto (install extended 2026-08-03 — the -iac issue lane needs coordinator labels)
    - homelab                # ditto — homelab PRs were invisible to the reflex while it derived its scan set from the claims
---
# 3) Drive the generator → the Secret the reviewer pod reads as GH_TOKEN (key `token` → GH_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reviewer-git
  namespace: agent-coordinator
spec:
  refreshInterval: 45m
  target:
    name: reviewer-git
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GH_TOKEN: '{{ .token }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: reviewer-git-gen
