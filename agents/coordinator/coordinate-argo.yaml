# Coordinator edge-trigger (FU-085, docs/agents/workflow.md §Triggers ▸ "The coordinator Sensor")
# — the review-argo.yaml pattern applied to the coordinator: POST /coordinate {repo} on the
# agent-loop EventSource → this Sensor → a `coordinate` Workflow running the deterministic scan.
#
# THE EVENT IS A DOORBELL, NEVER A WORK ITEM: the payload only scopes (`{repo}`, v1 logs it and
# re-lists everything); the scan re-applies the FULL predicate (C4/C5 probes, FU-080
# coordinator.enabled, FU-088 capacity via coordinator-session's latch probe). A false/duplicate
# wake costs a handful of `gh` calls, never an LLM tick — emitters may over-approximate freely.
# Emitters (workflow.md table): agent-session.sh at worker-terminal, reviewer-session.sh after a
# verdict, devbox-update at PR-open; the mono jail keeps `devbox run coordinate-now` (kubectl
# path); stack jails curl this webhook — no RBAC into agent-coordinator needed (airlock-aligned).
#
# Serialization: the `coordinator-scan` mutex (here, in the WorkflowTemplate) makes Sensor
# submissions and the */10 CronWorkflow backstop (reflexes-argo.yaml, workflowTemplateRef to the
# SAME template) mutually exclusive — Cron `Forbid` alone does NOT see Sensor submissions. The
# Sensor trigger rateLimit is the dumb outer belt. Cron demotes */10 → */30 after the edge proves
# itself in live use (FU-084 GraphQL burn).
# ADR-106 (5) — the goal-#278 famine fixes, both receiver-side (coordinator-scan.sh):
#   COLLAPSE: a starting full scan absorbs every PENDING sibling `coordinate*` workflow in its
#   namespace before it lists GitHub (those rings are older than the re-list, so nothing is
#   lost), which ends the generateName convoy without the fixed-name race of dropping rings that
#   land mid-run. DETACH: coordinator-session.sh exits at pod-Ready (--detach), so this mutex
#   spans only the deterministic pass — never a streamed session (the famine's 45-min holds).
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: coordinator
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review # same submit-only Role (workflows/workflowtemplates create)
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  dependencies:
    - name: coordinate-dep
      eventSourceName: agent-loop
      eventName: coordinate
    # FU-080 per-stack routing: the SAME coordinate event, matched only when the emitter carried a
    # non-empty loop_ns (a GRADUATED stack — agent-session.sh / reviewer-session.sh add {stack,
    # loop_ns}). Missing/empty loop_ns is filtered out here, so plain {repo} POSTs and legacy
    # emitters fire the global trigger ALONE. A graduated POST satisfies BOTH deps: the global scan
    # runs but SKIPS the graduated stack (coordinator-scan.sh), and this trigger scans it in its ns.
    - name: coordinate-perstack
      eventSourceName: agent-loop
      eventName: coordinate
      filters:
        data:
          # Argo string data-filter values are REGEXes (value must be non-empty — ""/"!=" is
          # rejected). ".+" matches any non-empty loop_ns; a missing/empty path extracts to "" and
          # fails the match, so plain {repo} POSTs and legacy emitters take the global trigger alone.
          - path: body.loop_ns
            type: string
            comparator: "="
            value:
              - ".+"
  triggers:
    - rateLimit: { unit: Minute, requestsPerUnit: 2 } # dumb outer belt vs emitter storms
      template:
        name: submit-coordinate
        conditions: "coordinate-dep" # scope to the global dep so a graduated POST can't gate it
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: coordinate-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: coordinate }
                arguments:
                  parameters:
                    - { name: repo, value: "all" }
                    # FU-085 compound: "-" = no unit (full scan); a unit-carrying doorbell
                    # (reviewer verdict) runs the scan's scoped fast-path instead of the sweep.
                    - { name: unit, value: "-" }
                    # FU-144 loop-break: the emitter's loop_ns, surfaced to the scan as
                    # SCAN_RING_NS. Non-empty = this POST was already routed per-stack (the
                    # perstack trigger fired beside this one), so the global scan must NOT
                    # fan it out again — that includes the scan's own fan-out re-rings.
                    - { name: ring_ns, value: "-" }
                    # issue#779 capacity doorbell: the ring source (empty/"" = not a capacity ring)
                    - { name: source, value: "" }
                    # issue#779 capacity doorbell: the rail that cleared (go/openrouter/anthropic)
                    - { name: rail, value: "" }
          parameters:
            # dataKey missing from the POST body → the static `value` above stays (unscoped scan).
            - src: { dependencyName: coordinate-dep, dataKey: body.repo, value: "all" }
              dest: spec.arguments.parameters.0.value
            - src: { dependencyName: coordinate-dep, dataKey: body.unit, value: "-" }
              dest: spec.arguments.parameters.1.value
            - src: { dependencyName: coordinate-dep, dataKey: body.loop_ns, value: "-" }
              dest: spec.arguments.parameters.2.value
            - src: { dependencyName: coordinate-dep, dataKey: body.source, value: "" }
              dest: spec.arguments.parameters.3.value
            - src: { dependencyName: coordinate-dep, dataKey: body.rail, value: "" }
              dest: spec.arguments.parameters.4.value
    # FU-080: submit an inline coordinate Workflow INTO <loop_ns> as agentstack-loop (SCAN_STACK
    # scoped, broker-fetch role=coordinator). Inlined rather than referencing a per-stack
    # WorkflowTemplate so the composition cron stays byte-identical per stack; the coordinator-scan
    # mutex (rendered in <loop_ns> on the cron) serializes this doorbell against the */10 tick.
    # RBAC: sensor-submit-coordinate Role/Binding rendered per graduated ns (agentstack composition).
    - rateLimit: { unit: Minute, requestsPerUnit: 2 }
      template:
        name: submit-coordinate-perstack
        conditions: "coordinate-perstack"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: coordinate-perstack-
                namespace: PLACEHOLDER # ← body.loop_ns (parameters below)
              spec:
                serviceAccountName: agentstack-loop
                activeDeadlineSeconds: 1800
                ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
                # homelab#103 soft hostname spread — rationale on the `coordinate` WorkflowTemplate
                # below. Applies inside <loop_ns>, spreading that stack's perstack scans.
                # homelab#867 soft Longhorn-disk de-preference — same rationale.
                podSpecPatch: |
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchExpressions:
                          - { key: workflows.argoproj.io/workflow, operator: Exists }
                  affinity:
                    nodeAffinity:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 10
                          preference:
                            matchExpressions:
                              - key: node.longhorn.io/create-default-disk
                                operator: NotIn
                                values:
                                  - "true"
                synchronization:
                  mutexes:
                    - name: coordinator-scan
                arguments:
                  parameters:
                    - { name: stack, value: PLACEHOLDER }
                    - { name: loop_ns, value: PLACEHOLDER }
                    - { name: unit, value: "-" } # FU-085 compound ("-" = full scan)
                    - { name: source, value: "" } # issue#779: capacity doorbell source
                    - { name: rail, value: "" } # issue#779: capacity doorbell rail
                entrypoint: main
                volumes:
                  - { name: work, emptyDir: {} }
                templates:
                  - name: main
                    container:
                      image: ghcr.io/teststuffstash/agent-coordinator
                      command: ["bash", "-lc"]
                      args:
                        - |
                          set -e
                          echo "coordinate(perstack): stack={{workflow.parameters.stack}} ns={{workflow.parameters.loop_ns}} (doorbell edge)"
                          SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                          GH_TOKEN="$(curl -fsS -H "Authorization: Bearer ${SA_TOKEN}" \
                            "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/loop-git-token?ns={{workflow.parameters.loop_ns}}&role=coordinator")" \
                            || { echo "FATAL: loop-git token fetch refused/failed — not scanning blind"; exit 1; }
                          export GH_TOKEN
                          rm -rf /work/homelab
                          # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
                          # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
                          # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
                          # old anonymous behavior (degrade, never a new hard dependency).
                          _cu="https://github.com/teststuffstash/homelab.git"
                          [ -n "${GH_TOKEN:-}" ] && _cu="https://x-access-token:${GH_TOKEN}@github.com/teststuffstash/homelab.git"
                          git clone --depth 1 -b master "$_cu" /work/homelab
                          export SCAN_STACK={{workflow.parameters.stack}} LOOP_NS={{workflow.parameters.loop_ns}}
                          export SCAN_UNIT='{{workflow.parameters.unit}}'
                          exec bash /work/homelab/agents/coordinator-scan.sh --spawn
                      env:
                        - { name: HOME, value: "/home/node" }
                        - { name: ORG, value: "teststuffstash" }
                      volumeMounts:
                        - { name: work, mountPath: /work }
                      resources:
                        requests: { cpu: "100m", memory: "256Mi" }
                        limits: { memory: "512Mi" }
          parameters:
            - src: { dependencyName: coordinate-perstack, dataKey: body.loop_ns }
              dest: metadata.namespace
            - src: { dependencyName: coordinate-perstack, dataKey: body.stack }
              dest: spec.arguments.parameters.0.value
            - src: { dependencyName: coordinate-perstack, dataKey: body.loop_ns }
              dest: spec.arguments.parameters.1.value
            - src: { dependencyName: coordinate-perstack, dataKey: body.unit, value: "-" }
              dest: spec.arguments.parameters.2.value
            - src: { dependencyName: coordinate-perstack, dataKey: body.source, value: "" }
              dest: spec.arguments.parameters.3.value
            - src: { dependencyName: coordinate-perstack, dataKey: body.rail, value: "" }
              dest: spec.arguments.parameters.4.value
---
# The coordinate Workflow — the coordinator-reflex CronWorkflow's inline container, extracted so
# the cron backstop and the Sensor edge both workflowTemplateRef ONE definition (the review-argo
# refactor shape). Carries the FU-088 subscription semaphore + the coordinator-scan mutex for
# every submission path.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: coordinate
  namespace: agent-coordinator
spec:
  serviceAccountName: agent-coordinator
  activeDeadlineSeconds: 1800
  ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
  # homelab#103 — soft spread so concurrent coordinator workflow pods stop piling onto one node.
  # homelab#867 — soft Longhorn-disk de-preference so burst pods avoid IO-heavy nodes.
  # ⚠ THE CANONICAL COPY OF THIS BLOCK. Every other workflow spec in agents/coordinator/*-argo.yaml
  # repeats it verbatim (YAML anchors don't cross documents) and points back here. Keep in sync.
  # Carve-out: reflexes-argo.yaml is pin-only GUARDED — its 5 uncovered workflow specs remain
  # unfixed by design (scripts/pin-only-lint.sh GUARDED=). The operator push route covers them.
  #   - `podSpecPatch`, not a typed field: WorkflowSpec has NO first-class topologySpreadConstraints
  #     (argo-workflows v4.0.7 — see the Field Reference; nodeSelector/tolerations/affinity are the
  #     only native scheduling knobs). The patch is a strategic merge onto the generated pod spec.
  #   - Selector is the built-in per-pod `workflows.argoproj.io/workflow` label with operator
  #     Exists, so it matches EVERY workflow pod in the namespace and spreads ACROSS runs. Matching
  #     that label's VALUE (the usual upstream example) would spread only WITHIN one workflow —
  #     useless here, where a coordinate/review/respond run is a single pod.
  #   - ScheduleAnyway, never DoNotSchedule: the schedulable pool shrinks when metal nodes sleep, so
  #     a hard constraint would wedge dispatch rather than merely leave it unbalanced.
  #   - nodeAffinity (homelab#867): soft `preferredDuringSchedulingIgnoredDuringExecution`
  #     de-preference for nodes carrying `node.longhorn.io/create-default-disk=true`. Weight 10 is
  #     modest — enough to tip the scales when nodes are otherwise equal, never enough to override
  #     the existing hostname spread or force pods onto wk-01 (the single non-Longhorn node). The
  #     `NotIn` operator matches nodes that either lack the label or have it set to a value other
  #     than "true", so it is a de-preference, not an exclusion.
  # Spread is namespace-scoped by design of the API (a TopologySpreadConstraint has no
  # namespaceSelector), so this balances agent-coordinator's own burst; the per-stack namespaces get
  # the same block via the inline perstack workflows above.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  synchronization:
    mutexes:
      - name: coordinator-scan # one scan at a time across cron + Sensor submissions
    semaphores:
      - configMapKeyRef: { name: subscription-capacity, key: claude } # FU-088 pool
  arguments:
    parameters:
      - { name: repo, value: "all" }
      - { name: unit, value: "-" } # FU-085 compound: "-" = full scan; else the scoped fast-path
      - { name: ring_ns, value: "-" } # FU-144: the POST's loop_ns ("-" = repo-dumb ring → the scan may fan out; the cron backstop inherits the default and never fans out anyway — its wake source is cron)
      - { name: source, value: "" } # issue#779: capacity doorbell source (empty = not a capacity ring)
      - { name: rail, value: "" } # issue#779: capacity doorbell rail
  entrypoint: main
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: main
      metadata:
        labels: { app: coordinate-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        command: ["bash", "-lc"]
        args:
          - |
            set -e
            echo "coordinate: doorbell scope={{workflow.parameters.repo}} unit={{workflow.parameters.unit}} ring_ns={{workflow.parameters.ring_ns}} (unit '-' = full scan)"
            rm -rf /work/homelab
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
            # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
            # old anonymous behavior (degrade, never a new hard dependency).
            _cu="https://github.com/teststuffstash/homelab.git"
            [ -n "${GH_TOKEN:-}" ] && _cu="https://x-access-token:${GH_TOKEN}@github.com/teststuffstash/homelab.git"
            git clone --depth 1 -b master "$_cu" /work/homelab
            export SCAN_UNIT='{{workflow.parameters.unit}}'
            # FU-144 receiver-side fan-out inputs: the ring's repo scope + whether it was
            # already routed per-stack (coordinator-scan.sh §doorbell-fanout reads both).
            export SCAN_REPO='{{workflow.parameters.repo}}'
            export SCAN_RING_NS='{{workflow.parameters.ring_ns}}'
            # issue#779 capacity doorbell: the ring source and rail for capacity fan-out
            export SCAN_SOURCE='{{workflow.parameters.source}}'
            export SCAN_RAIL='{{workflow.parameters.rail}}'
            exec bash /work/homelab/agents/coordinator-scan.sh --spawn
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "1Gi" }
