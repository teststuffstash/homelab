# FU-149 — the responder's daily LLM-triage budget, made visible.
#
# The budget latch (agents/responder-budget.sh) can stop LLM triage for the rest of the UTC day.
# That is a deliberate state, but a SILENT one: alerts keep firing and keep reaching Home
# Assistant, so from the outside nothing looks different while automated investigation is off.
# This rule is the operator-facing signal for exactly that.
#
# ⚠ `triage: none` is load-bearing, not decoration. Without it the responder would triage its own
# budget alert — spending a session to report that sessions are no longer being spent, and on the
# first alert of the next day it would spend one of the new budget doing so. The label is the
# rule-author convention the responder honours before any ledger lookup (responder-argo.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: responder-budget
  namespace: monitoring
  labels:
    app: agent-coordinator
spec:
  groups:
    - name: responder-budget
      rules:
        # DAY gate, not a freshness gate — the pushgateway serves every pushed group FOREVER, so
        # something must stop yesterday's "exhausted" from firing into today.
        # ⚠ The first cut used push age < 3h and was WRONG, live on 2026-08-07 01:05Z: the last
        # responder run was 23:21Z, so a 1h44m-old sample sailed through the freshness window and
        # the alert reported "no further triage today" 65 minutes into a day whose budget had
        # already reset to 0/12. Push age is the wrong invariant in BOTH directions — within a day
        # a stale sample is still accurate (the session count only grows, so an exhausted budget
        # stays exhausted whether or not anything re-pushes), and across midnight a FRESH-looking
        # one is worthless. What actually matters is whether the sample describes the day we are
        # in, so the script publishes the 00:00Z epoch of its own day and this compares against it.
        # Self-clearing at midnight with no push required, which is what the old gate only pretended
        # to do.
        - alert: ResponderTriageBudgetExhausted
          expr: |
            responder_triage_blocked == 1
              and on (job) (time() - responder_triage_day_start) < 86400
          for: 5m
          labels:
            # ⚠ severity is `warning`, NOT `info`, and that is not a judgement about urgency.
            # `info` is SILENTLY SUPPRESSED in this cluster: kube-prometheus-stack ships a stock
            # inhibit_rule (`source alertname=InfoInhibitor → target severity=info`, equal
            # namespace) and the values file does not override inhibit_rules. Shipped as `info`
            # on 2026-08-06 this alert reached Prometheus, fired correctly, and then sat
            # `state: suppressed / inhibitedBy: [...]` in Alertmanager — dispatched to NEITHER
            # the responder NOR the Home Assistant webhook, because a suppressed alert is not
            # dispatched at all. It was live for ~10 minutes as pure decoration. Tell: this repo's
            # other 27 alerts are all warning/critical; the one `info` was this one.
            severity: warning
            # Keeps the responder from triaging its own budget alert. Load-bearing at `warning`
            # in a way it was not at `info`: the route now really does deliver this to the
            # responder (`continue: true` → agent-responder), so this label is the only thing
            # stopping a session being spent to report that sessions are not being spent.
            triage: none
          annotations:
            summary: "Responder is no longer launching LLM triage sessions today ({{ $value }})"
            description: >-
              responder_triage_blocked=1: the responder will spawn NO further investigation
              sessions until 00:00 UTC. SYMPTOM ONLY — two different states produce it and the
              gauges separate them: responder_triage_probe_ok=0 means the ledger could not be read
              and the latch blocked fail-closed (an infra fault, check RBAC on the responder-seen
              ConfigMap in agent-coordinator); responder_triage_probe_ok=1 means the budget was
              genuinely spent, so compare responder_triage_sessions_today against
              responder_triage_budget_max. Alerts continue to fire and continue to route to Home
              Assistant throughout — what stops is automated investigation, so anything arriving
              now needs a human. Blocked alerts are recorded with a `budget-<date>` marker in the
              ledger, which is how a deliberate stop stays distinguishable from a dropped event.
              Raise RESPONDER_DAILY_MAX on the respond WorkflowTemplate, or find the storm that
              spent it (dashboard "Responder triage budget").
