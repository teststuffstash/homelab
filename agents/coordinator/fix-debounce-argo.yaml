# fix-debounce-argo — the FU-133 dispatch half: SET-judged queueing of alert-fix issues.
#
# The trap (iac-lane.md §"one root cause, N alert issues", operator direction 2026-08-07): alert
# issues arrive one-per-fingerprint, same-cause issues declare DIFFERENT Touches: footprints, so
# ADR-097's path-keyed hold never relates them — three fixers attack three symptoms of one cause.
# The unit of triage must be the open SET, not the next issue.
#
# Flow (operator design 2026-08-07 — deliberately NOT cron-first; a cron's latency is random
# within its window, a bell's is exactly the debounce):
#   responder applies agent-fix (VERDICT, inert: the scan dispatches only on agent-fix ∧
#   agent/queued) and rings /fix-verdict → Sensor submits this workflow → suspend WAIT →
#   query the pending set LIVE from GitHub (per-claim-repo REST list — no search-index lag,
#   no GraphQL: FU-084's drained pool stays untouched) →
#     0 pending → exit;  1 pending → deterministic gates, label agent/queued;
#     ≥2 pending → ONE sonnet set-pass session decides cause/downstream/independent as JSON,
#                  and THIS SHELL applies it (ADR-094: dispatch acts are launcher-owned, the
#                  LLM only judges — same reason breaker #1 keeps labels out of triage sessions).
#
# Concurrency: suspends run in PARALLEL (each bell guarantees a decision ≥WAIT after it), only
# `decide` serializes (mutex) — so a burst wakes together, the first decide sweeps the whole set,
# the rest exit empty in seconds. State lives in GitHub labels, nowhere else: agent-fix ∧ NO
# `agent/*` label IS the pending set; a killed workflow loses nothing. The exclusion is the whole
# LIFECYCLE namespace, not a list (homelab#238 → #244): every lifecycle label is applied by
# REMOVING `agent/queued`, so each one re-admits its issue to the pending set and the debouncer
# re-queues it — mid-block for `agent/blocked`, mid-RIDE for `agent/in-progress` (see the query's
# own note). `agent-fix` is spelled with a DASH exactly so the diagnosis survives the test that
# eats the states.
# Un-linking on refire: the responder's fp/subject belts REOPEN the same issue when its alert
# refires after the cause-fix merged — the reopen comment is a human/meta cue; the linked label
# is stripped by hand if the downstream issue turns out to be independent after all.
#
# Budget: no ledger of its own — set-pass sessions are bounded by verdicts (≤ RESPONDER_DAILY_MAX
# rings/day), the FU-088 latch probe pre-session, and the subscription-capacity semaphore held
# only across `decide`. Deny gates are fail-closed: anything unclear leaves the issue inert, per
# the recorded fail-safe ("an un-queued issue waits; three concurrent fixers on one cause do not").
#
# Queue-time deny = ONLY the paths where authoring takes effect BEFORE a human approves
# (iac-lane.md §platform lane, operator correction 2026-08-07 — "authoring is not effect"):
# .github/ (PR runs its own workflow), .agents/ (next round reads its recipe from the branch),
# devbox.json|lock + scripts/ (CI executes them from the branch; in homelab the scripts ARE the
# checks). Everything else queues freely — CODEOWNERS gates the MERGE, which is the real gate;
# the fixer authors the diff at 2am and the owner reads it in the morning (50b8418).
#
# Queue-time CURRENCY (FU-133 leg c, homelab#253): the footprint gate above asks "may this be
# worked", the currency gate asks "is this still TRUE". Everything upstream of dispatch reads
# BODIES — the set-pass judges from them, `sq_decide` reads one — and a body is a diagnosis with a
# date on it. homelab#68 is the founding case (iac-lane.md §"one root cause, N alert issues",
# first-live set-pass): a 07-28 diagnosis whose scope ceiling had already shipped, queued ELEVEN
# MINUTES after the responder's resolve leg recorded the alert clearing, because it was
# human-engaged and so sat ripe in the pending set. The 21:00Z coordinator refused the unit and
# parked it `agent/blocked` — a belt doing a guard's job, at the wrong end of the lane. So the
# gate reads LIVE alert state at queue time and skips two shapes: the alert has RESOLVED, or the
# body predates the subject's last recorded state change (a refire after a `last-cleared:` line).
# A skip is NOT a close and moves no label: alert-state is not defect-state, and whether the
# defect outlives its alert is a human's call. The issue stays inert with one note saying so.
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: fix-debounce
  namespace: agent-coordinator
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-review
    # homelab#103: was BestEffort — no requests at all. Same values as the coordinate/review
    # Sensors. CPU requests only (no CPU limit), memory limited — this file set's norm.
    container:
      resources:
        requests: { cpu: "25m", memory: "64Mi" }
        limits: { memory: "128Mi" }
  dependencies:
    - name: verdict-dep
      eventSourceName: agent-loop
      eventName: fix-verdict
  triggers:
    - rateLimit: { unit: Minute, requestsPerUnit: 6 }
      template:
        name: submit-fix-debounce
        conditions: "verdict-dep"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: fix-debounce-
                namespace: agent-coordinator
              spec:
                workflowTemplateRef: { name: fix-debounce }
                arguments:
                  parameters:
                    - name: payload
                      value: "{}"
          parameters:
            - src: { dependencyName: verdict-dep, dataKey: body }
              dest: spec.arguments.parameters.0.value
---
# Backstop (roles.md machinery slot 3): level-triggered, re-derives the pending set that a lost
# bell (search lag, webhook drop, responder crash post-label) left behind. wait=10s because the
# debounce already happened — anything pending here is ≥ one cron period old.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: fix-debounce-backstop
  namespace: agent-coordinator
spec:
  schedules: ["17 */2 * * *"] # plural — this Argo's CronWorkflow schema (like every rendered cron here)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    workflowTemplateRef: { name: fix-debounce }
    arguments:
      parameters:
        - { name: payload, value: '{"backstop":true}' }
        - { name: wait, value: "10s" }
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fix-debounce
  namespace: agent-coordinator
spec:
  entrypoint: debounce
  serviceAccountName: agent-coordinator
  # homelab#103 soft hostname spread — rationale on the `coordinate` WorkflowTemplate
  # (coordinate-argo.yaml). Verbatim copy; keep in sync.
  # homelab#867 soft Longhorn-disk de-preference — same rationale.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  ttlStrategy: { secondsAfterCompletion: 86400 }
  arguments:
    parameters:
      - { name: payload, value: "{}" }
      - { name: wait, value: "10m" }
      - { name: dryRun, value: "0" }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
  templates:
    - name: debounce
      steps:
        - - name: wait
            template: wait
        - - name: decide
            template: decide
    - name: wait
      suspend:
        duration: "{{workflow.parameters.wait}}"
    - name: decide
      # Mutex: decides serialize (burst → first sweep wins, rest exit empty). Semaphore: the
      # possible set-pass session draws the shared claude pool; held only across this step, so a
      # suspended debounce never parks a subscription slot.
      synchronization:
        mutexes:
          - name: fix-debounce-decide
        semaphores:
          - configMapKeyRef: { name: subscription-capacity, key: claude }
      metadata:
        labels: { app: fix-debounce-workflow }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          - { name: PAYLOAD, value: "{{workflow.parameters.payload}}" }
          - { name: DRY_RUN, value: "{{workflow.parameters.dryRun}}" }
          # The currency gate's live-state surface (FU-133 leg c). In-cluster service DNS, NOT the
          # `192.168.40.14` LAN VIP: a LoadBalancer IP is a 'world' destination and is not a route
          # to depend on from a pod (the same rule the responder's Prometheus query states).
          # Reachability verified from an agent pod on 2026-08-11 (HTTP 200 on /api/v2/status).
          - { name: AM_URL, value: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093" }
          - { name: ANTHROPIC_BASE_URL, value: "http://openrouter-proxy.agent-egress.svc.cluster.local:8080/anthropic" }
          - { name: ANTHROPIC_AUTH_TOKEN, value: "ref:agent-coordinator/coordinator-claude" }
          - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
          # Cost attribution (2026-08-08 label audit — same contract as every other role).
          - { name: CLAUDE_CODE_ENABLE_TELEMETRY, value: "1" }
          - { name: OTEL_METRICS_EXPORTER, value: "otlp" }
          - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
          - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
          - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
          - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=claude-code,role=fix-debounce,stack=platform" }
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
        command: [bash, -lc]
        args:
          - |
            set -euo pipefail
            echo "fix-debounce decide — payload: $PAYLOAD dry-run: $DRY_RUN"
            rm -rf /work/homelab
            # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
            # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
            # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
            # old anonymous behavior (degrade, never a new hard dependency).
            _cu="https://github.com/teststuffstash/homelab.git"
            [ -n "${GH_TOKEN:-}" ] && _cu="https://x-access-token:${GH_TOKEN}@github.com/teststuffstash/homelab.git"
            git clone --depth 1 -b master "$_cu" /work/homelab

            # ── the pending set, LIVE (repo list = the AgentStack claims' repos + homelab) ────
            # The claims also feed a repo→stack→loop-ns map: after queueing, the debouncer rings
            # /coordinate so dispatch is edge-driven, not cron-bound — and a GRADUATED stack needs
            # the {stack, loop_ns} payload (FU-144: a bare {repo} POST fires only the global
            # trigger, whose scan SKIPS graduated stacks; this lane must not re-trip that).
            CLAIMS="$(kubectl get agentstacks.platform.teststuff.net -o json 2>/dev/null)" \
              || CLAIMS="$(jq '{items: [.stacks[] | {metadata: {name: .name}, spec: {loop: {graduated: (.graduated // false)}, repos: [.repos[] | {name: .}]}}]}' /work/homelab/agents/stacks.json)"
            printf '%s' "$CLAIMS" | jq -r '.items[] | .metadata.name as $s | ((.spec.loop.graduated // false) | if . then $s + "-agents" else "" end) as $ns | .spec.repos[].name | [., $s, $ns] | @tsv' > /tmp/stackmap.tsv
            { cut -f1 /tmp/stackmap.tsv; echo homelab; } | sort -u | grep -v '^$' > /tmp/repos.txt
            # >>>REPLAY:fix-debounce-pending-set>>>
            : > /tmp/pending.jsonl
            while read -r r; do
              # ⚠ ALERT-LANE ONLY (`alert-fp:` in body) — found by the 2026-08-07 dry run: stack
              # loops use agent-fix-without-queued for their OWN deliberate holds (ADR-097
              # footprint overlap, goal gating), and the unscoped query swept circles#42 —
              # an issue meta-state records as held — into "would queue". The fingerprint
              # marker is what makes an issue the RESPONDER's; everything else is not ours.
              #
              # ⚠ The lane test is LINE-ANCHORED (`test("(^|\n)alert-fp:")`), not a substring
              # `contains`. The responder writes the marker as a line of its own — its own resolve
              # leg already greps `^alert-fp:` (responder-argo.yaml) — so anchoring matches how the
              # marker is authored, and an unanchored test made "mentions the alert lane" mean
              # "belongs to it". Live on homelab#249: #238 is a HAND-WRITTEN defect report about
              # this very predicate, carries no marker, and was swept into the pending set and
              # QUEUED over a live ride (`fix-debounce-backstop-1786436220`, 2026-08-11 08:17:00Z)
              # because its body quotes `body~alert-fp:` mid-line inside the predicate under test.
              # The `self-referential: true` breaker below does not cover this: that marker is
              # written by the RESPONDER, so a hand-written issue about the debouncer sails past
              # it. Orthogonal to the lifecycle-label half (#244) — every lifecycle label could be
              # excluded and a non-alert issue would still enter a set it does not belong to.
              #
              # ⚠ EVERY `agent/*` label excludes — the namespace, not a list. `agent/*` is the
              # LIFECYCLE (agents/coordinator/README.md §State machine); `agent-fix` is the
              # DIAGNOSIS and is spelled with a dash, so the prefix test keeps the opt-in and eats
              # only the states. Every one of those states is applied by REMOVING `agent/queued`,
              # so each is a hole of the same shape: the label that means "somebody/something has
              # this" is exactly what re-admits the issue to the pending set, and the next bell
              # re-queues it with nothing in the path.
              #   · human-waiting (`agent/blocked`, `agent/error`) — live on homelab#237: block
              #     01:53Z → silent re-queue 02:17Z (2026-08-11), dispatch re-discovering the same
              #     blocker once per debounce period with the human gate erased each turn, until
              #     the FU-069 breaker latched `agent/error` — which the old predicate ALSO did
              #     not exclude, so the breaker's own output would have re-entered the set as soon
              #     as a human cleared anything else. homelab#238 fixed that pair only.
              #   · IN-FLIGHT (`agent/in-progress`, `agent/review`) — the same hole one lane over
              #     and the reason this is a namespace test now: dispatch does `--add-label
              #     agent/in-progress --remove-label agent/queued`, so a RIDING issue re-entered
              #     the set and was re-queued MID-RIDE. Live on homelab#238's own timeline
              #     (dispatch 08:08:14Z → `agent/queued` back on at 08:17:21Z). Only the
              #     launcher's pre-flight (open-PR / running-pod refusal) and the pod-name
              #     idempotency key held it to label churn — belts doing a guard's job. #244.
              #   · terminal (`agent/done`, `agent/linked`) — finished work never re-queues.
              # This does NOT weaken the IL-T16 phantom belt or C4/C5 re-dispatch: both are the
              # SCAN's, they re-add `agent/queued` themselves, and an issue wearing `agent/queued`
              # was already out of the pending set under the old predicate too. The debouncer's
              # re-queue was never load-bearing for either — it was the bug. The scan holds the
              # same rule on its side (coordinator-scan.sh:17 — the LLM never wakes for these).
              gh api "repos/$ORG/$r/issues?labels=agent-fix&state=open&per_page=50" \
                --jq ".[] | select(.pull_request | not) | select(.body // \"\" | test(\"(^|\\n)alert-fp:\")) | select([.labels[].name] | any(startswith(\"agent/\")) | not) | {repo: \"$ORG/$r\", number: .number, title: .title, body: (.body // \"\")}" \
                2>/dev/null >> /tmp/pending.jsonl || true
            done < /tmp/repos.txt

            # self-referential = human-queued only (marker written by the responder session)
            jq -c 'select(.body | contains("self-referential: true") | not)' /tmp/pending.jsonl > /tmp/set.jsonl || true
            SELFREF="$(jq -c 'select(.body | contains("self-referential: true"))' /tmp/pending.jsonl | jq -r '"  \(.repo)#\(.number) \(.title)"' || true)"
            [ -n "$SELFREF" ] && printf 'self-referential, left for a human to queue:\n%s\n' "$SELFREF"
            N="$(wc -l < /tmp/set.jsonl | tr -d ' ')"
            echo "pending set: $N issue(s)"
            [ "$N" -eq 0 ] && { echo "nothing to decide"; exit 0; }
            # <<<REPLAY:fix-debounce-pending-set<<<

            # ── currency seams (FU-133 leg c) ────────────────────────────────────────────────
            # The gate's two I/O points and the comment helper it writes through, factored out so
            # the fixture family can serve a RECORDED Alertmanager and a fixed clock while the
            # arithmetic below stays under replay (agents/replay/README.md — shadow the I/O and the
            # magnitude, never the branching). They sit OUTSIDE the replay blocks on purpose: a
            # fixture composes bridge-first, so a definition inside the block would override the
            # fixture's rather than the other way round.
            #
            # `active|silenced|inhibited|unprocessed=true` is the WHOLE store, deliberately not the
            # default active filter: a silenced alert is still FIRING (a human muted the
            # notification, not the defect), and firing-vs-resolved is decided by `endsAt` in
            # sq_decide rather than by Alertmanager's state word.
            fc_am_alerts() { curl -m 5 -fsS "$AM_URL/api/v2/alerts?active=true&silenced=true&inhibited=true&unprocessed=true" 2>/dev/null; }
            fc_now() { date -u +%s; }
            # ADR-103 rule 2: a skip note is machine residue, so it appends to the ONE
            # `<!-- agent-summary -->` comment instead of starting a thread of its own.
            . /work/homelab/agents/machine-comment.sh

            # >>>REPLAY:fix-debounce-gates>>>
            # ── deterministic gates (fail-closed; the ❌ table, NOT the old governance list) ──
            SQ_DENY='^(\.github/|\.agents/|devbox\.json|devbox\.lock|scripts/)'
            sq_decide() { # <repo> <number> — 0 = may queue, 1 = inert (log only), 2 = inert + a currency note
              local body touches p fp alerts cleared verdict v since
              body="$(gh api "repos/$1/issues/$2" --jq '.body // ""' 2>/dev/null || true)"
              # UNION of every Touches: line (S6 sprout, #716 — the reviewer-side twin): head -1
              # read only the FIRST line, so a deny-listed path on a later superseding line slipped
              # the queue-time gate (fail-open). The scan's footprint read is a join over all lines.
              touches="$(printf '%s' "$body" | sed -n 's/^[Tt]ouches:[[:space:]]*//p' | paste -sd, -)"
              [ -n "$touches" ] || { echo "no Touches: line (undeclared = exclusive, waits for a human)"; return 1; }
              for p in $(printf '%s' "$touches" | tr ',' ' '); do
                case "$p" in ''|' ') continue;; esac
                printf '%s' "$p" | grep -qE "$SQ_DENY" \
                  && { echo "footprint takes effect pre-merge: $p (iac-lane ❌ table)"; return 1; }
              done
              # ── CURRENCY (FU-133 leg c) ────────────────────────────────────────────────────
              # Cheapest-first: the footprint tests above cost nothing beyond the body read this
              # gate needs anyway, so an issue that can never be worked never costs a probe.
              # The marker is read LINE-ANCHORED, the same way the pending set's lane test and the
              # responder's own resolve leg (`^alert-fp:`) read it — an unanchored read made
              # "mentions the alert lane" mean "belongs to it" once already (homelab#249).
              fp="$(printf '%s' "$body" | sed -n 's/^alert-fp:[[:space:]]*//p' | head -1)"
              [ -n "$fp" ] || { echo "no alert-fp: marker — currency unjudgeable (the pending set's own lane test requires one, so this is a contradiction, not a stale body)"; return 1; }
              alerts="$(fc_am_alerts)" || alerts=""
              printf '%s' "$alerts" | jq -e 'type == "array"' >/dev/null 2>&1 \
                || { echo "Alertmanager unreadable at $AM_URL — currency unjudgeable, so INERT (fail-closed, no comment: the 2h backstop re-derives, an alert store that cannot be read is itself the incident, and nothing new can be filed while it is down anyway)"; return 1; }
              # Membership is NOT the test — `endsAt` is. Alertmanager keeps a resolved alert in the
              # store for a while after it clears (endsAt moves into the past), and #68's queue
              # landed inside exactly that window: "the fingerprint is still listed" would have
              # answered FIRING eleven minutes after the clear, which is the bug verbatim.
              cleared="$(printf '%s' "$body" | sed -n 's/^last-cleared:[[:space:]]*\([^ ]*\).*/\1/p' | head -1)"
              verdict="$(printf '%s' "$alerts" | jq -r --arg fp "$fp" --arg cleared "$cleared" --argjson now "$(fc_now)" '
                def ep: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601? // 0;
                [ .[] | select(.fingerprint == $fp) | select((.endsAt // "" | ep) > $now) ] as $live
                | ($live[0].startsAt // "") as $since
                | (if ($live | length) == 0 then "resolved"
                   elif ($cleared != "" and (($since | ep) > ($cleared | ep))) then "refired"
                   else "current" end) + "\t" + $since' 2>/dev/null)" || verdict=""
              v="$(printf '%s' "$verdict" | cut -f1)"; since="$(printf '%s' "$verdict" | cut -f2)"
              case "$v" in
                current) return 0;;
                # The `last-cleared:` line is the resolve leg's own record (responder-argo.yaml,
                # #148): one line, rewritten in place, written exactly where a clear that does not
                # close the issue belongs. A firing episode that STARTED after it is a refire, and
                # the body's evidence bundle — the thing the fixer is told to treat as ground truth
                # — describes the previous one. Narrow in practice: an issue queued on the bell it
                # was filed by has no clear to predate, so only a body that outlived a whole flap
                # cycle unqueued reaches this branch, which is #68's shape exactly.
                refired) echo "the body predates its subject's last state change — recorded clear at $cleared, firing again since $since, so its evidence describes the PREVIOUS episode"; return 2;;
                resolved) echo "alert-fp:$fp is not firing — it resolved, and the body is all a fixer would have to work from"; return 2;;
                *) echo "currency verdict unparseable from the Alertmanager read — INERT (fail-closed)"; return 1;;
              esac
            }
            ensure_label() { # <repo> <label> <color> <desc>
              gh api "repos/$1/labels/$(printf '%s' "$2" | jq -sRr @uri)" >/dev/null 2>&1 && return 0
              gh api -X POST "repos/$1/labels" -f name="$2" -f color="$3" -f description="$4" >/dev/null 2>&1 || true
            }
            ring_coordinate() { # <owner/repo> — same payload shape as agent-session.sh's _door
              local short stack lns payload
              short="${1##*/}"
              stack="$(awk -F'\t' -v r="$short" '$1==r{print $2; exit}' /tmp/stackmap.tsv)"
              lns="$(awk -F'\t' -v r="$short" '$1==r{print $3; exit}' /tmp/stackmap.tsv)"
              payload="$(jq -cn --arg repo "$short" --arg stack "$stack" --arg lns "$lns" \
                '{repo: $repo, unit: "-"} + (if $lns != "" then {stack: $stack, loop_ns: $lns} else {} end)')"
              curl -m 5 -fsS -X POST -H "Content-Type: application/json" -d "$payload" \
                "http://agent-loop-eventsource-svc.agent-coordinator.svc.cluster.local:12000/coordinate" >/dev/null 2>&1 \
                && echo "rang /coordinate for $1 (${lns:-global})" \
                || echo "coordinate bell failed for $1 (non-fatal — the */30 cron catches it)"
            }
            sq_note_currency() { # <repo> <number> <why> — at most ONE currency note per timeline
              # Idempotence is load-bearing, not decoration: a currency skip changes NOTHING about
              # the issue (no label, no close — that is the point), so every bell and every 2h
              # backstop re-derives the same verdict forever. An unguarded comment here would be
              # the #148 disease exactly — the responder's resolve leg was cured of posting one
              # notice per flap cycle (27 of one 2026-08-08 day's 80 homelab comments). The guard
              # reads the timeline for this note's own `kind=` marker and writes at most once.
              local seen
              if [ "$DRY_RUN" = "1" ]; then echo "DRY: would note the currency skip on $1#$2"; return 0; fi
              seen="$(mc_gh_comments "$1" "$2" | jq -r '[.[]? | select((.body // "") | contains("kind=currency-skip"))] | length' 2>/dev/null || echo 0)"
              [ "${seen:-0}" -eq 0 ] || { echo "currency note already on $1#$2 — not repeating"; return 0; }
              mc_event "$1" "$2" currency-skip "**not queued — queue-time currency gate** (FU-133 leg c): $3. Nothing was closed and no label moved: alert-state is not defect-state. If the defect outlives its alert, say so here and queue it by hand." \
                && echo "noted the currency skip on $1#$2" \
                || echo "WARN: currency note failed on $1#$2 (non-fatal — the issue is inert either way)"
            }
            queue_one() { # <repo> <number>
              local why rc=0
              why="$(sq_decide "$1" "$2")" || rc=$?
              case "$rc" in
                0)
                  if [ "$DRY_RUN" = "1" ]; then echo "DRY: would queue $1#$2 (+ring /coordinate)"; return 0; fi
                  if gh api -X POST "repos/$1/issues/$2/labels" -f "labels[]=agent/queued" >/dev/null 2>&1; then
                    echo "QUEUED $1#$2"
                    ring_coordinate "$1"
                  else
                    echo "WARN: queue label failed on $1#$2 — stays inert, backstop retries"
                  fi ;;
                # 2 = a currency verdict, which is the one deny a human is expected to read. The
                # footprint denies (rc 1) stay log-only: they are a standing property of the
                # issue's own Touches: line, not news about the world.
                2) echo "inert $1#$2 — $why"; sq_note_currency "$1" "$2" "$why" ;;
                *) echo "inert $1#$2 — $why" ;;
              esac
            }
            link_one() { # <repo> <number> <cause-repo> <cause-number> <why>
              if [ "$DRY_RUN" = "1" ]; then echo "DRY: would link $1#$2 → downstream of $3#$4 ($5)"; return 0; fi
              ensure_label "$1" "agent/linked" "bfdadc" "judged downstream of a queued cause by fix-debounce (FU-133)"
              gh api -X POST "repos/$1/issues/$2/labels" -f "labels[]=agent/linked" >/dev/null 2>&1 || true
              gh api -X POST "repos/$1/issues/$2/comments" \
                -f body="🔗 fix-debounce set-pass: judged **downstream** of $3#$4 — $5. Not queued; the cause's fix should clear this alert. If it refires after that fix merges, the reopen strips this judgement's effect (remove the \`agent/linked\` label to re-enter the pending set)." \
                >/dev/null 2>&1 && echo "LINKED $1#$2 → $3#$4" || echo "WARN: link failed on $1#$2"
            }

            if [ "$N" -eq 1 ]; then
              r="$(jq -r '.repo' /tmp/set.jsonl)"; n="$(jq -r '.number' /tmp/set.jsonl)"
              echo "single pending issue — deterministic fast path"
              queue_one "$r" "$n"
              exit 0
            fi
            # <<<REPLAY:fix-debounce-gates<<<

            # ── ≥2 pending: ONE set-pass session (subscription; latch-gated like every spawn) ──
            # homelab#439: --pick-rail mode — when ANY rail is clear the session proceeds.
            rail="$(SUBSCRIPTION_TIER=dispatch bash /work/homelab/agents/subscription-latch.sh --pick-rail)" || rail=""
            if [ -z "$rail" ]; then
              echo "set-pass DEFERRED — both rails latched (FU-088); pending set stays, backstop/next bell retries"
              exit 0
            fi
            # Log which rail we're on (Go rail only when Anthropic is latched)
            case "$rail" in opencode-go/*) echo "→ Anthropic latched — serving set-pass on the Go rail ($rail)";; esac
            jq -c 'del(.body)' /tmp/set.jsonl > /tmp/set-brief.json
            claude -p "You are the FIX-DEBOUNCE SET-PASS (homelab docs/agents/iac-lane.md, section 'one root cause, N alert issues'): several alert-triage issues carry a fix verdict and await dispatch. Your job is to decide queueing for the SET — the trap you exist to prevent is several fixers attacking symptoms of ONE root cause in parallel (e.g. a node-pressure alert and an OOM-kill alert that are the same memory problem).

            THE PENDING SET (one JSON object per line): $(cat /tmp/set-brief.json)

            For each issue run: gh issue view <number> --repo <repo> --json title,body,labels (always the --json form). Bodies carry the responder's evidence bundle, a Touches: footprint and an alert-fp marker — treat the evidence as ground truth; you may use kubectl READS to check current state, degrade gracefully if denied.

            Decide, per group of same-cause issues: which SINGLE issue is the CAUSE (queue it), which are DOWNSTREAM symptoms (link them to it), and which are genuinely INDEPENDENT (queue those too). If you are genuinely unsure whether two issues share a cause, queue NEITHER and say why — an unqueued issue waits safely; concurrent fixers on one cause spend budget and produce conflicting PRs.

            Your ONLY output is a single fenced json block, nothing after it:
            \`\`\`json
            {\"queue\": [{\"repo\": \"owner/name\", \"number\": 1, \"why\": \"...\"}], \"link\": [{\"repo\": \"owner/name\", \"number\": 2, \"cause_repo\": \"owner/name\", \"cause_number\": 1, \"why\": \"...\"}], \"unsure\": [{\"repo\": \"owner/name\", \"number\": 3, \"why\": \"...\"}]}
            \`\`\`
            HARD RULES: do NOT label, comment, edit, file, close or reopen anything — the shell applies your JSON deterministically (ADR-094). No kubectl mutations. Every issue in the set appears in exactly one of queue/link/unsure." \
              --model "$(case "$rail" in opencode-go/*) echo "$rail";; *) bash /work/homelab/agents/resolve-model.sh --role dispatch-unit --fallback sonnet;; esac)" --permission-mode bypassPermissions --max-turns 25 </dev/null \
              > /tmp/setpass.out 2>&1 || { echo "WARN: set-pass session failed — set stays pending"; tail -5 /tmp/setpass.out; exit 0; }

            awk '/^```json[[:space:]]*$/{f=1;buf="";next} /^```[[:space:]]*$/{if(f){last=buf};f=0;next} f{buf=buf $0 "\n"} END{printf "%s", last}' /tmp/setpass.out > /tmp/decision.json
            jq -e . /tmp/decision.json >/dev/null 2>&1 || { echo "WARN: set-pass output unparseable — set stays pending (fail-safe: nothing labelled)"; exit 0; }
            echo "set-pass decision:"; jq . /tmp/decision.json

            jq -c '.queue[]?' /tmp/decision.json | while read -r q; do
              queue_one "$(printf '%s' "$q" | jq -r '.repo')" "$(printf '%s' "$q" | jq -r '.number')"
            done
            jq -c '.link[]?' /tmp/decision.json | while read -r l; do
              link_one "$(printf '%s' "$l" | jq -r '.repo')" "$(printf '%s' "$l" | jq -r '.number')" \
                       "$(printf '%s' "$l" | jq -r '.cause_repo')" "$(printf '%s' "$l" | jq -r '.cause_number')" \
                       "$(printf '%s' "$l" | jq -r '.why')"
            done
            jq -r '.unsure[]? | "unsure (waits): \(.repo)#\(.number) — \(.why)"' /tmp/decision.json
            echo "fix-debounce decide done"
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "1Gi" }
