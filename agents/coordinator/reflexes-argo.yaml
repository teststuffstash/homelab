# The agent-loop reflexes as Argo CronWorkflows (ADR-093 Phase 1) — replacing the k8s CronJobs
# (review-reflex/coordinator-reflex/model-scout/ledger were `kind: CronJob`). Same containers, same
# coordinator SA + secrets; now on Argo, so each tick shows in the argo-server UI + emits
# argo_workflows_* metrics (duration/phase/retry) to Prometheus. The clone-homelab initContainer
# folds into the single step. review-reflex is now the *backstop* (the edge-trigger Sensor +
# exporter POST is the fast path — review-argo.yaml) so it drops to */15. The per-stack split with
# the two knobs (coordinator.enabled off / reviewer.enabled on) is the FU-080 continuation; these
# stay GLOBAL in agent-coordinator until then (model-scout + ledger stay global permanently).
---
# FU-088 Argo layer: the subscription-capacity semaphore. Workflows that HOLD a live subscription
# session (review-reflex tick, coordinator tick, the Sensor-submitted review Workflow — their
# containers run for the session's whole duration) declare this semaphore, so an over-cap
# submission QUEUES ("waiting for lock" in the UI, priority-ordered) instead of spawning into a
# rate-limited account. Complements — never replaces — agents/subscription-latch.sh: Argo counts
# only Argo-run workflows (interactive rides and jail launches are invisible here, and one reflex
# tick may hold K=2 reviewer pods on a single slot), while the latch's proxy verdict + pod-label
# count see ALL subscription traffic. ConfigMap semaphores are namespace-scoped — the FU-080
# per-stack world needs the DB-backed lock flavor or per-stack pools (decide there).
apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-capacity
  namespace: agent-coordinator
data:
  claude: "5" # keep in step with SUBSCRIPTION_MAX_RUNNING — since ADR-096 P2 the authority is the proxy Deployment (explicit 5 since 2026-08-08, Max 5x→20x upgrade); agents/subscription-latch.sh's env is the jail belt
---
# Review backstop — level-triggered catch-all for anything the edge-trigger missed (exporter down,
# lost event). The Sensor path handles the common case near-instantly; this only sweeps.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: review-reflex
  namespace: agent-coordinator
spec:
  # RETIRED 2026-08-06 (operator): every stack is graduated (sleep, platform, oracle, circles), so
  # the FU-080 cutover filters this reflex's repo set to EMPTY every tick — it reviewed nothing and
  # cost a pod per 15 min. The per-stack review-<stack> CronWorkflows (AgentStack Composition) own
  # all reviews now. ⚠ RESURRECTION CONDITION: a NEW stack lands UNGRADUATED with no per-stack
  # reflex → its PRs sit green+armed+unapproved FOREVER unless this is unsuspended (or the stack
  # graduates). Nothing checks that automatically — flip suspend back when onboarding an
  # ungraduated stack. (Was: RESUMED 2026-07-28, meta-15 "enable the world".)
  suspend: true
  schedules:
    # HOURLY since 2026-08-20 (operator: the sensors do the heavy lifting; the cron only
    # rescues a dropped ring — worst wait for a lost ring = 1h on an unattended lane, and the
    # CRON-SERVICED detector in scripts/iac-sentinel.sh names every ring the edge missed, which
    # is the evidence that would retire this cron entirely).
    - "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  workflowSpec:
    serviceAccountName: agent-coordinator
    activeDeadlineSeconds: 900
    ttlStrategy: { secondsAfterCompletion: 3600, secondsAfterFailure: 86400 }
    # FU-088 Argo layer: queue (not spawn) when the subscription pool is full — see the
    # subscription-capacity ConfigMap header. The tick holds its slot while its reviewers run.
    synchronization:
      semaphores:
        - configMapKeyRef: { name: subscription-capacity, key: claude }
    entrypoint: main
    volumes:
      - { name: work, emptyDir: {} }
      - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
    templates:
      - name: main
        container:
          image: ghcr.io/teststuffstash/agent-coordinator
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              rm -rf /work/homelab
              # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
              # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
              # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
              # old anonymous behavior (degrade, never a new hard dependency).
              # Preemptive auth (the 2026-09-03 throttle recurrence): the token rides `http.extraHeader` on the
              # FIRST request. Token-in-URL still made two ANONYMOUS requests per clone (GET refs + POST
              # upload-pack → 401 → authenticated retry) — ~700 anonymous hits/day on GitHub's per-IP throttle
              # from an "authenticated" loop. `clone -c` persists it for later fetch/push. Empty = anonymous.
              _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git clone -c "$_ah" --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab
              exec bash /work/homelab/agents/review-reflex.sh
          env:
            - { name: HOME, value: "/home/node" }
            - { name: ORG, value: "teststuffstash" }
            - { name: REVIEW_CONCURRENCY, value: "2" }
            - name: GH_TOKEN
              valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
            - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
---
# Coordinator tick — RETIRED 2026-08-31 (ADR-120, the switchboard rebrand): the global cron
# backstop caught nothing by construction once all stacks graduated (dispatch skipped every
# stack; fan-out is edge-wakes-only by design), measured as 18/18 no-op ticks over 3h. The
# per-stack coordinate-<stack> crons are the level-triggered failure detector. The global
# Sensor edge survives as the SWITCHBOARD (coordinate-argo.yaml): resolve repo-dumb rings +
# capacity fan-out, never a board scan.
# Model scout — weekly catalog diff + canary (FU-062). GLOBAL (fleet-wide by nature).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: model-scout
  namespace: agent-coordinator
spec:
  schedules:
    - "0 6 * * 1" # weekly, Monday 06:00 UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    serviceAccountName: agent-coordinator
    activeDeadlineSeconds: 1800
    ttlStrategy: { secondsAfterCompletion: 86400, secondsAfterFailure: 86400 }
    entrypoint: main
    volumes:
      - { name: work, emptyDir: {} }
      - { name: coordinator-git, secret: { secretName: coordinator-git, optional: true } }
    templates:
      - name: main
        container:
          image: ghcr.io/teststuffstash/agent-coordinator
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              rm -rf /work/homelab
              # homelab#1136: AUTHENTICATED clone when a token is present — anonymous git from the
              # cluster NAT IP tripped GitHub throttling under burst (401-challenges on a public
              # repo + truncated ref listings, 47 failed workflows 2026-08-31); absent token = the
              # old anonymous behavior (degrade, never a new hard dependency).
              # Preemptive auth (the 2026-09-03 throttle recurrence): the token rides `http.extraHeader` on the
              # FIRST request. Token-in-URL still made two ANONYMOUS requests per clone (GET refs + POST
              # upload-pack → 401 → authenticated retry) — ~700 anonymous hits/day on GitHub's per-IP throttle
              # from an "authenticated" loop. `clone -c` persists it for later fetch/push. Empty = anonymous.
              _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git clone -c "$_ah" --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab
              exec bash /work/homelab/agents/model-scout.sh
          env:
            - { name: HOME, value: "/home/node" }
            - { name: ORG, value: "teststuffstash" }
            - { name: DIGEST_REPO, value: "homelab" }
            - { name: PRICE_CEILING, value: "0.50" }
            # FU-161 leg 2 (homelab#299/PR#306): the MCP get-model benchmark pull. OPERATOR
            # direct-to-master by design — this file is pin-only-lint-guarded, so no PR can land
            # non-pin lines; the Secret is ESO-minted by scout-account-key.yaml. optional: the
            # scout degrades to `unbenched` columns without it.
            - name: SCOUT_MCP_KEY
              valueFrom: { secretKeyRef: { name: scout-account-key, key: OPENROUTER_API_KEY, optional: true } }
            - name: GH_TOKEN
              valueFrom: { secretKeyRef: { name: coordinator-git, key: GH_TOKEN, optional: true } }
            - { name: GH_TOKEN_FILE, value: "/var/run/coordinator-git/GH_TOKEN" }
            - { name: AGENT_TS_ENDPOINT, value: "http://garage.garage.svc.cluster.local:3900" }
            - { name: AGENT_TS_BUCKET, value: "agent-transcripts" }
            - name: AGENT_TS_READER_ID
              valueFrom: { secretKeyRef: { name: agent-transcripts-s3, key: reader_access_key_id, optional: true } }
            - name: AGENT_TS_READER_SECRET
              valueFrom: { secretKeyRef: { name: agent-transcripts-s3, key: reader_secret_access_key, optional: true } }
            - name: AGENT_TS_WRITER_ID
              valueFrom: { secretKeyRef: { name: agent-transcripts-s3, key: writer_access_key_id, optional: true } }
            - name: AGENT_TS_WRITER_SECRET
              valueFrom: { secretKeyRef: { name: agent-transcripts-s3, key: writer_secret_access_key, optional: true } }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: coordinator-git, mountPath: /var/run/coordinator-git, readOnly: true }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
