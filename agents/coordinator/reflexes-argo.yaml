# IAC-G04 policy sentinel (FU-106, built 2026-08-03; G01 enforcement flip 2026-08-18 —
# iac-lane.md §L0b): evaluates PR heads of the sentinel repos against homelab-owned rules
# (policy/iac/ + scripts/iac-sentinel.sh; Kyverno CLI is THE rule engine per operator ruling —
# admission seat later), reports to logs + pushgateway, and posts the REQUIRED `iac-sentinel`
# commit status per head under the REVIEWER App identity (never the worker's own — it could
# pass itself; SENTINEL_STATUS_TOKEN rides the reviewer-git Secret, empty = shadow). The EDGE
# serves per-push evaluations since homelab#650; this cron is the */15 backstop. Tamper-proof by construction: rules, engines, exceptions
# and the gitleaks config come from THIS repo's master clone, the PR tree is fetched as a
# tarball (data, never executed). Runs on the arc-runner image so `devbox run` serves the
# pinned toolchain (kyverno/gitleaks ride the warm store).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: iac-sentinel
  namespace: agent-coordinator
spec:
  schedules:
    # */15 BACKSTOP since 2026-08-20 (was */2 interim, */5 at the G01 flip): the head-changed
    # EDGE serves evaluations now (homelab#650 — exporter POST /sentinel → sentinel Sensor →
    # the iac-sentinel WorkflowTemplate; proven live on PR#695: ring → iac-sentinel-edge-* →
    # status ~3min after push, poll-bounded). The edge+level pattern everywhere else: this cron
    # only rescues a dropped ring. Wake-source accounting: iac_sentinel_wake_{cron,edge}
    # _timestamp_seconds — a recurring cron-SERVED evaluation is a dead-edge defect with an id.
    - "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    # The ONE evaluation spec lives in the iac-sentinel WorkflowTemplate (sentinel-argo.yaml,
    # NOT pin-guarded) — extracted at the #650 edge build so cron and edge cannot drift; this
    # guarded file keeps only the cadence + the ref (the coordinate/fix-debounce shape).
    workflowTemplateRef: { name: iac-sentinel }
    arguments:
      parameters:
        - { name: wake, value: "cron" }
