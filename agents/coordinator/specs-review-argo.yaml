# The specs-review tick (ADR-155) — the SECOND review identity's level-triggered dispatch:
# agents/specs-reviewer-session.sh runs here every 5 minutes, from a fresh master clone, inside
# the agent-coordinator image (Claude Code + the gh wrapper that prefers GH_TOKEN_FILE). The
# iac-sentinel shape (sentinel-argo.yaml), not review-argo.yaml's launcher→pod shape — the script's
# header says why. No Sensor/edge yet: the whole tick re-lists every open PR itself and a
# mechanical approval is cheap, so */5 is the latency bound; an edge lands when the tick time
# says it must (the edge+level pattern everywhere else).
#
# LLM admission is the agent-gateway's `POST /sessions` (gateway/specs/endpoints/sessions.md),
# the first real consumer (FU-270 dogfood) — NOT the subscription-capacity semaphore the `review`
# WorkflowTemplate carries: that semaphore is the OLD proxy's capacity model, and this plane is
# the one that moves off it. The gateway Service is in ns agent-egress, which the agent-loop
# egress policy (egress-cnp.yaml) already allows for every Argo Workflow pod in this namespace.
# The call is AUTHENTICATED (GW-SESSIONS-AUTH, FU-270): the `gateway-token` volume is this pod's
# projected ServiceAccount token (agent-coordinator, audience agent-gateway), and the gateway's
# policy `callers` entry for that SA grants stack platform, roles reviewer + worker (the goose
# shadow cell), no bind.
#
# IDENTITY: GH_TOKEN = the `specs-reviewer-git` Secret (agents/coordinator/specs-reviewer-git.yaml),
# `optional:true`.
# Absent Secret = SHADOW mode: the script logs "specs-reviewer-git absent — shadow, no verdicts",
# pushes its heartbeat and exits 0 — it never reviews under another identity (there is no second
# token in this pod on purpose). The Secret appearing IS the cutover (the chain's banner documents
# the order); nothing here changes then.
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: specs-review
  namespace: agent-coordinator
spec:
  entrypoint: main
  serviceAccountName: agent-coordinator
  # homelab#103 soft hostname spread — rationale on the `switchboard` WorkflowTemplate (coordinate-argo.yaml — was `coordinate`, ADR-120)
  # (coordinate-argo.yaml). Verbatim copy; keep in sync.
  # homelab#867 soft Longhorn-disk de-preference — same rationale.
  podSpecPatch: |
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchExpressions:
            - { key: workflows.argoproj.io/workflow, operator: Exists }
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
                - key: node.longhorn.io/create-default-disk
                  operator: NotIn
                  values:
                    - "true"
  synchronization:
    mutexes:
      - name: specs-review
  # one tick = N mechanical approvals + at most ONE LLM pass; 15 min bounds a wedged pass, the
  # released session (DELETE on the script's exit trap) frees the rail slot either way.
  activeDeadlineSeconds: 900
  ttlStrategy: { secondsAfterCompletion: 21600, secondsAfterFailure: 86400 }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: specs-reviewer-git, secret: { secretName: specs-reviewer-git, optional: true } }
    # GW-SESSIONS-AUTH (FU-270): the caller token for the gateway's /sessions — this pod's projected
    # ServiceAccount token (agent-coordinator), audience agent-gateway, the shortest expiry the API
    # allows; kubelet rotates the file and the script re-reads it per call. Pod spec only: the
    # gateway's TokenReview is its own RBAC, and the policy's `callers` grants this SA its roles.
    - name: gateway-token
      projected:
        sources:
          - serviceAccountToken: { audience: agent-gateway, expirationSeconds: 600, path: token }
  templates:
    - name: main
      metadata:
        labels: { app: specs-review }
      container:
        image: ghcr.io/teststuffstash/agent-coordinator
        command: ["bash", "-lc"]
        args:
          - |
            set -e
            rm -rf /work/homelab
            # Preemptive auth (sentinel-argo.yaml, the 2026-09-03 throttle recurrence): the token
            # rides `http.extraHeader` on the FIRST request; empty = anonymous (shadow mode clones
            # master anonymously exactly like the sentinel without its token — degrade, no new
            # hard dependency).
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git clone -c "$_ah" --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab
            exec bash /work/homelab/agents/specs-reviewer-session.sh
        env:
          - { name: HOME, value: "/home/node" }
          - { name: ORG, value: "teststuffstash" }
          - { name: SPECS_REVIEW_REPOS, value: "homelab" }
          - { name: PUSHGATEWAY, value: "http://prometheus-pushgateway.monitoring.svc:9091" }
          - { name: GATEWAY_URL, value: "http://agent-gateway.agent-egress.svc.cluster.local:8080" }
          # The SECOND review identity's token (ADR-155). Env is the frozen fallback; the image's
          # gh wrapper prefers the LIVE token file (ESO re-mints it ~hourly). Both optional =
          # shadow mode until the specs-reviewer-git chain exists.
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: specs-reviewer-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/specs-reviewer-git/GH_TOKEN" }
          # A0 standard rail: OTLP metrics+logs → the in-cluster collector, attributed to THIS
          # role so the subscription spend lands on the cost dashboard (the reviewer pod's block,
          # agents/reviewer-session.sh). The script appends `,project=<repo>,pr=<n>` per pass.
          - { name: CLAUDE_CODE_ENABLE_TELEMETRY, value: "1" }
          - { name: OTEL_METRICS_EXPORTER, value: "otlp" }
          - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
          - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
          - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
          - { name: OTEL_TRACES_EXPORTER, value: "none" } # no traces pipeline on the collector (otel-config.yaml); unset = SDK default otlp, a 404 per pod
          - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=claude-code,role=specs-reviewer,stack=platform" }
          # NO ANTHROPIC_* here, on purpose: the LLM env is the gateway's `dispatch.env`, exported
          # verbatim by the script per pass (GW-SESSIONS-ENV) — a rendered ANTHROPIC_AUTH_TOKEN
          # would be the old ref-rail and would take auth precedence.
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: specs-reviewer-git, mountPath: /var/run/specs-reviewer-git, readOnly: true }
          - { name: gateway-token, mountPath: /var/run/secrets/agent-gateway, readOnly: true }
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { memory: "2Gi" }
---
# Level-triggered: every 5 minutes, one tick, never two at once (Forbid + the mutex above — the
# mutex also serializes a future edge submission against the cron, the coordinate-argo lesson).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: specs-review
  namespace: agent-coordinator
spec:
  schedules: ["*/5 * * * *"] # plural — this Argo's CronWorkflow schema (fix-debounce-argo.yaml)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    workflowTemplateRef: { name: specs-review }
---
# SHADOW cell runs (gateway/PLAN.md step 3; docs/agents/specs-reviewer.md §Shadow runs): ONE
# harness × rail cell over a PR list, one-off, never on a schedule. The same script in
# `--shadow` mode: the same context pack and brief, the verdicts written to /work/shadow (the
# `shadow` output artifact → the namespace's default Garage repository), NO GitHub write (the
# script's read-only gh allow-list, pinned by its --self-test) and no pushgateway metrics — the
# live tick's belts never see a shadow run. A SEPARATE template, not parameters on `specs-review`:
# its own mutex (a shadow run never holds the live tick's), its own deadline (a PR list outlasts
# one tick's 900 s) and an image the caller picks — the opencode/goose cells need agent-base (the
# harness image), the claude cells ride the live reviewer's agent-coordinator image. The image is a
# runtime parameter with NO default, taken from agents/images.env (the probe-argo.yaml shape — no
# first-party tag is written here):
#   argo submit -n agent-coordinator --from workflowtemplate/specs-review-shadow \
#     -p image="$(sed -n 's/^AGENT_BASE_IMAGE=//p' agents/images.env)" -p harness=goose -p rail=openrouter \
#     -p prs="homelab#2640@9639e99ede9bf4c1deb77c8231837db73ee790bc homelab#2635@02c7fb58…"
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: specs-review-shadow
  namespace: agent-coordinator
spec:
  entrypoint: main
  serviceAccountName: agent-coordinator
  arguments:
    parameters:
      - name: image                   # REQUIRED — an agents/images.env pin (AGENT_BASE_IMAGE / AGENT_COORDINATOR_IMAGE)
      - name: harness                 # REQUIRED — claude | opencode | goose
      - { name: rail, value: "" }     # optional POST /sessions override (anthropic | opencode | openrouter)
      - { name: tier, value: "" }     # optional POST /sessions tier (light | standard | heavy)
      - { name: role, value: "reviewer" }
      - name: prs                     # REQUIRED — space-separated <repo>#<n>[@<judged head sha>]
  synchronization:
    mutexes:
      - name: specs-review-shadow
  activeDeadlineSeconds: 3600
  ttlStrategy: { secondsAfterCompletion: 86400, secondsAfterFailure: 86400 }
  volumes:
    - { name: work, emptyDir: {} }
    - { name: specs-reviewer-git, secret: { secretName: specs-reviewer-git, optional: true } }
    # GW-SESSIONS-AUTH (FU-270): the caller token for the gateway's /sessions — this pod's projected
    # ServiceAccount token (agent-coordinator), audience agent-gateway, the shortest expiry the API
    # allows; kubelet rotates the file and the script re-reads it per call. Pod spec only: the
    # gateway's TokenReview is its own RBAC, and the policy's `callers` grants this SA its roles.
    - name: gateway-token
      projected:
        sources:
          - serviceAccountToken: { audience: agent-gateway, expirationSeconds: 600, path: token }
  templates:
    - name: main
      metadata:
        labels: { app: specs-review-shadow }
      outputs:
        artifacts:
          - { name: shadow, path: /work/shadow, optional: true }
      container:
        image: "{{workflow.parameters.image}}"
        command: ["bash", "-lc"]
        args:
          - |
            set -e
            rm -rf /work/homelab
            _ah="http.extraHeader="; [ -n "${GH_TOKEN:-}" ] && _ah="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git clone -c "$_ah" --depth 1 -b master https://github.com/teststuffstash/homelab.git /work/homelab
            # parameters arrive as env, never spliced into this script; SHADOW_PRS word-splits on purpose
            exec bash /work/homelab/agents/specs-reviewer-session.sh --shadow --harness "$SHADOW_HARNESS" \
              --rail "$SHADOW_RAIL" --tier "$SHADOW_TIER" --role "$SHADOW_ROLE" --out /work/shadow $SHADOW_PRS
        env:
          - { name: SHADOW_HARNESS, value: "{{workflow.parameters.harness}}" }
          - { name: SHADOW_RAIL, value: "{{workflow.parameters.rail}}" }
          - { name: SHADOW_TIER, value: "{{workflow.parameters.tier}}" }
          - { name: SHADOW_ROLE, value: "{{workflow.parameters.role}}" }
          - { name: SHADOW_PRS, value: "{{workflow.parameters.prs}}" }
          - { name: ORG, value: "teststuffstash" }
          - { name: GATEWAY_URL, value: "http://agent-gateway.agent-egress.svc.cluster.local:8080" }
          # READ identity for the PR bodies, reviews and CI artifacts (the shadow path cannot write
          # with it — the script's gh allow-list). No PUSHGATEWAY: a shadow run reports nothing.
          - name: GH_TOKEN
            valueFrom: { secretKeyRef: { name: specs-reviewer-git, key: GH_TOKEN, optional: true } }
          - { name: GH_TOKEN_FILE, value: "/var/run/specs-reviewer-git/GH_TOKEN" }
          - { name: CLAUDE_CODE_ENABLE_TELEMETRY, value: "1" }
          - { name: OTEL_METRICS_EXPORTER, value: "otlp" }
          - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
          - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
          - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
          - { name: OTEL_TRACES_EXPORTER, value: "none" }
          - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=claude-code,role=specs-reviewer,stack=platform" }   # the script appends shadow=true,cell=…
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: specs-reviewer-git, mountPath: /var/run/specs-reviewer-git, readOnly: true }
          - { name: gateway-token, mountPath: /var/run/secrets/agent-gateway, readOnly: true }
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { memory: "2Gi" }
