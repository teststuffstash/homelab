# Scoped identity for the coordinator pod. It runs in its own namespace and talks to the cluster via
# this ServiceAccount (in-cluster config — no kubeconfig file in the pod). The grant is exactly the
# coordinator's job: spawn/observe agent worker pods in project namespaces, and mint/observe/delete
# the ephemeral per-session OpenRouterKey CRs. Deliberately NO access to Secret *values* — it waits
# on the OpenRouterKey `.status` (the operator stamps the hash when minted), never reads the key.
#
#   kubectl --kubeconfig tofu/kubeconfig apply -f agents/coordinator/rbac.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-coordinator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-coordinator
  namespace: agent-coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-coordinator
rules:
  # Spawn + observe worker pods (agent-session.sh creates Pods in the project namespace).
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch, create, delete]
  # Attach to an interactive worker (agent-session.sh exec). Drop if only headless --run is used.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Discover project namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  # ⚠ Was the FU-072 kata endpoint-IP rewrite's read (`resolve_ep`, deleted 2026-09-04 — kata
  # reaches service VIPs again). Kept read-only pending a check that no other launcher path
  # reads endpoints; drop it once that is established. Revert-safe: restoring the rewrite needs
  # this grant back (meta-8: without it kata rides shipped raw svc URLs → ConnectionRefused,
  # oracle-fleet#52 r1 strike).
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list]
  # agent-session.sh probes for the optional agent-uv-cache PVC to decide whether to mount the shared
  # uv wheel cache. Without this read the probe 403s, the mount is skipped, and (pre-fix) UV_CACHE_DIR
  # pointed at an unmounted /uv-cache the worker couldn't write. Read-only.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  # homelab#1205: context-prefetch writes the bundle to a ConfigMap (off argv) in the pod's namespace.
  # Created before the pod, then `patch`ed with an ownerReference to it so kube GC collects the
  # bundle with the pod; `delete` is the launcher's own cleanup for the exits that PRECEDE
  # pod-create (dispatch-gate defers and refusals), where no owner exists yet.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, patch]
  # Mint / observe / clean up ephemeral per-session budget keys. status: wait for the minted hash
  # instead of reading the Secret value.
  - apiGroups: [openrouter.teststuff.net]
    resources: [openrouterkeys, openrouterkeys/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-048: coordinator-scan reads AgentStack claims — the stack-list source of truth (a failed
  # read PROBE-FAILS back to agents/stacks.json; grant this or the reflex runs on the belt forever).
  - apiGroups: [platform.teststuff.net]
    resources: [agentstacks]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-coordinator
subjects:
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
# (The former "one deliberate exception" — a get on the agent-transcripts-s3 Secret for
# agent-session.sh's cross-namespace env-value injection — was REMOVED 2026-07-17, FU-080 a:
# the AgentStack Composition now mirrors the write-only key into each fixer namespace via the
# `agent-transcripts` ClusterSecretStore, and worker pods secretKeyRef it in-ns. No launcher
# reads Secret values anymore; this SA has zero secret access.)
---
# Responder fingerprint ledger (responder-argo.yaml): one triage per alert fp per 24h + the
# daily cap live in the responder-seen ConfigMap — NAMESPACED on purpose (a cluster-wide cm
# patch grant could touch other namespaces' config; the pods grant above is cluster-wide only
# because worker spawning genuinely crosses namespaces). A denied write degrades to the
# fp-issue search belt (loud, never blocking).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: responder-ledger
  namespace: agent-coordinator
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: responder-ledger
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: responder-ledger
subjects:
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
---
# ADR-106 (5) doorbell collapse + FU-160 wake source: the scan reads its OWN Workflow object
# (edge-vs-cron + the ring epoch — `dp_wake`; this read had silently failed fail-open since
# FU-160 shipped, no workflows grant existed) and DELETES pending sibling `coordinate*`
# workflows at scan start (`absorb_pending_rings`). NAMESPACED on purpose: the global scan only
# ever touches agent-coordinator's own workflows; the per-stack mirror is the Composition's
# agentstack-loop-workflow Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-scan-workflows
  namespace: agent-coordinator
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-scan-workflows
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-scan-workflows
subjects:
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
---
# FU-138: the openrouter-proxy's _cr_guardrail() lists openrouterkeys in the ref's namespace to
# read the authoritative guardrail. The proxy SA has this grant in agent-egress (its own namespace)
# and in each worker project namespace (composed by the AgentStack claim), but agent-coordinator
# was covered by neither — and that is where the coordinator/reviewer subscription refs
# (ref:agent-coordinator/coordinator-claude) live. Without this, every anthropic passthrough
# request logs a 403 fallback line (fail-open, noise only). Mirrors the FU-138 grant verbatim
# from argocd/resources/openrouter-proxy/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openrouter-proxy-guardrail
  namespace: agent-coordinator
rules:
  - apiGroups: [openrouter.teststuff.net]
    resources: [openrouterkeys]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openrouter-proxy-guardrail
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openrouter-proxy-guardrail
subjects:
  - kind: ServiceAccount
    name: openrouter-proxy
    namespace: agent-egress
