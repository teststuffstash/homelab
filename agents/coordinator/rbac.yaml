# Scoped identity for the coordinator pod. It runs in its own namespace and talks to the cluster via
# this ServiceAccount (in-cluster config — no kubeconfig file in the pod). The grant is exactly the
# coordinator's job: spawn/observe agent worker pods in project namespaces, and mint/observe/delete
# the ephemeral per-session OpenRouterKey CRs. Deliberately NO access to Secret *values* — it waits
# on the OpenRouterKey `.status` (the operator stamps the hash when minted), never reads the key.
#
#   kubectl --kubeconfig tofu/kubeconfig apply -f agents/coordinator/rbac.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-coordinator
  labels:
    # Pinned explicitly so the posture is visible in git (oracle-namespaces.yaml shape). baseline
    # enforce is safe: the coordinator/reflex/sensor/EventBus pods here run plain runc and none
    # is privileged, hostPath, host-namespaced or adds a non-baseline capability (live check
    # 2026-10-25, all 16 pods). warn/audit restricted surfaces the remaining gap without blocking.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-coordinator
  namespace: agent-coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-coordinator
rules:
  # Spawn + observe worker pods (agent-session.sh creates Pods in the project namespace).
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch, create, delete]
  # Attach to an interactive worker (agent-session.sh exec). Drop if only headless --run is used.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Discover project namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  # ⚠ Was the FU-072 kata endpoint-IP rewrite's read (`resolve_ep`, deleted 2026-09-04 — kata
  # reaches service VIPs again). Kept read-only pending a check that no other launcher path
  # reads endpoints; drop it once that is established. Revert-safe: restoring the rewrite needs
  # this grant back (meta-8: without it kata rides shipped raw svc URLs → ConnectionRefused,
  # oracle-fleet#52 r1 strike).
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list]
  # agent-session.sh probes for the optional agent-uv-cache PVC to decide whether to mount the shared
  # uv wheel cache. Without this read the probe 403s, the mount is skipped, and (pre-fix) UV_CACHE_DIR
  # pointed at an unmounted /uv-cache the worker couldn't write. Read-only.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  # homelab#1205: context-prefetch writes the bundle to a ConfigMap (off argv) in the pod's namespace.
  # Created before the pod, then `patch`ed with an ownerReference to it so kube GC collects the
  # bundle with the pod; `delete` is the launcher's own cleanup for the exits that PRECEDE
  # pod-create (dispatch-gate defers and refusals), where no owner exists yet.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, patch]
  # Mint / observe / clean up ephemeral per-session budget keys. status: wait for the minted hash
  # instead of reading the Secret value.
  - apiGroups: [openrouter.teststuff.net]
    resources: [openrouterkeys, openrouterkeys/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # FU-048: coordinator-scan reads AgentStack claims — the stack-list source of truth (a failed
  # read PROBE-FAILS back to agents/stacks.json; grant this or the reflex runs on the belt forever).
  - apiGroups: [platform.teststuff.net]
    resources: [agentstacks]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-coordinator
subjects:
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
# (The former "one deliberate exception" — a get on the agent-transcripts-s3 Secret for
# agent-session.sh's cross-namespace env-value injection — was REMOVED 2026-07-17, FU-080 a:
# the AgentStack Composition now mirrors the write-only key into each fixer namespace via the
# `agent-transcripts` ClusterSecretStore, and worker pods secretKeyRef it in-ns. No launcher
# reads Secret values anymore; this SA has zero secret access.)
---
# The specs-review tick's OWN identity (homelab#2685, FU-270 / GW-SESSIONS-AUTH): the gateway's
# policy `callers` is keyed per ServiceAccount, and while `specs-review` + `specs-review-shadow`
# (specs-review-argo.yaml) ran as `agent-coordinator`, every workflow in this namespace was
# authorized as the specs reviewer on the gateway's control plane. This SA is what the policy
# names now (`system:serviceaccount:agent-coordinator:specs-review`). Its grant is EXACTLY what
# the two Workflow pods need: the Argo executor's `workflowtaskresults` create/patch — the
# chart-rendered `argo-workflows-workflow` Role, the same one `agent-coordinator` holds through
# `argo-workflows-workflow-coordinator` (review-argo.yaml) — plus ONE cluster read, the
# `specs-review-claims-read` ClusterRole below. NOTHING else from the ClusterRole above and none
# of the namespaced Roles: agents/specs-reviewer-session.sh calls kubectl for exactly that read
# (its other inputs are a diff, a body and a CI log; its Secret is a volume/env ref,
# kubelet-served), so pods, configmaps, workflows and openrouterkeys are all left out.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: specs-review
  namespace: agent-coordinator
---
# The specs-review tick's one cluster read: `pack_roots` takes a repo's specs/tests roots off its
# AgentStack claim (`repos[].specs`) — the SAME field the worker launcher mounts the pinned spec
# process by (ADR-156), so the trigger paths, the context pack and the ride read one home.
# agentstacks get/list, nothing else; a failed read falls back to the script's per-repo table,
# said once per tick. Not a binding to `agentstack-claims-read` (argocd/resources/agentstack/
# rbac.yaml): that role is "loop cluster reads" (endpoints, apps, …), wider than this tick needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: specs-review-claims-read
rules:
  - apiGroups: [platform.teststuff.net]
    resources: [agentstacks]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: specs-review-claims-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: specs-review-claims-read
subjects:
  - kind: ServiceAccount
    name: specs-review
    namespace: agent-coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflows-workflow-specs-review, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflows-workflow }
subjects:
  - { kind: ServiceAccount, name: specs-review, namespace: agent-coordinator }
---
# The gateway's JUDGE identity (FU-270 (b), GW-SESSIONS-OUTCOME §Who may report): the policy's
# `callers` entry `system:serviceaccount:agent-coordinator:outcome-judge` carries `outcome: any`
# (stacks [platform], roles [] — it admits nothing), the one grant that may report the judge-only
# class `wrong-verdict` on a session this SA never admitted. The deploy-revert chain's `judge`
# step (deploy-revert-argo.yaml) runs as it, and ONLY that step: `callers` is per SA, so the
# `revert` step stays on `agent-coordinator` and no other workflow in this namespace can report a
# judge-only class by accident. Its kube grant is EXACTLY the executor's `workflowtaskresults`
# binding, as `specs-review` above: the judge calls GitHub (one read) and the gateway (two
# routes) and never kubectl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outcome-judge
  namespace: agent-coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflows-workflow-outcome-judge, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflows-workflow }
subjects:
  - { kind: ServiceAccount, name: outcome-judge, namespace: agent-coordinator }
---
# The island intake sitting's OWN identity (homelab#3577, Goal #3574 pin 6): READ-ONLY. Until this
# SA the sitting (island-intake-argo.yaml) ran as `agent-coordinator` and so held that SA's pod
# create/delete, pods/exec create, configmap create/delete/patch and openrouterkeys writes — none
# of which a sitting uses: it reads, and writes only to GitHub (its token), the transcripts bucket
# (its key) and the Pushgateway (HTTP). Its kube grant is three reads and the executor's write:
#   - `agent-read-infra` + `agent-read-app` (agent-read-rbac.yaml), cluster-wide: what the
#     coordinator's lanes already read (pods and their logs, events, workloads, PVCs, nodes,
#     Longhorn, ArgoCD apps, workflows, network policies, ESO specs, claims). `agents/
#     subscription-latch.sh`'s belt (`kubectl get pods -A -l …subscription-session`) rides it;
#   - `island-intake-read` below: the four kinds a ruling needed and could not read, and the
#     AgentStack claims (the stack islands' declaration, homelab#3580);
#   - the chart-rendered `argo-workflows-workflow` Role (`workflowtaskresults` create/patch — the
#     Argo executor's own write), the `specs-review` pattern above.
# NOT bound to ClusterRole `agent-coordinator`, to `responder-ledger` or to
# `coordinator-scan-workflows`. No Secret and no ConfigMap read (agent-read-rbac.yaml §NEVER
# GRANTED). The gateway admits it by name (argocd/resources/agent-gateway/policy.json `callers`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: island-intake
  namespace: agent-coordinator
---
# What the read roles lack and an intake ruling stands on: a namespace's quota (is the ride
# starved or the quota wrong), the alert rule as deployed (not as the repo has it), and the
# schedules and templates of the loop's own workflows. And the AgentStack claims (homelab#3580):
# a stack declares an intake island as `repos[].intake.facts` in its claim, and the workflow's list
# step and a stack island's sitting read the claims live (islands/intake/scripts/claims-read.sh) —
# never agents/stacks.json, so a stack turning intake on needs no homelab commit. get/list, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: island-intake-read
rules:
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [cronworkflows, workflowtemplates]
    verbs: [get, list]
  - apiGroups: [platform.teststuff.net]
    resources: [agentstacks]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: island-intake-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: island-intake-read }
subjects:
  - { kind: ServiceAccount, name: island-intake, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: island-intake-read-infra
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-read-infra }
subjects:
  - { kind: ServiceAccount, name: island-intake, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: island-intake-read-app
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-read-app }
subjects:
  - { kind: ServiceAccount, name: island-intake, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflows-workflow-island-intake, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflows-workflow }
subjects:
  - { kind: ServiceAccount, name: island-intake, namespace: agent-coordinator }
---
# The RESPONDER's OWN identity (operator 2026-11-21: the dig, intake and responder each get their own
# account and token while staying in the intake island). A role carries its own boundary
# (docs/agents/roles.md §What a role is); until this SA the `respond` WorkflowTemplate
# (responder-argo.yaml) ran as `agent-coordinator` and so held cluster-wide pod create/delete,
# configmap create/delete/patch and openrouterkeys writes it never uses — and every grant made "to
# the responder" (the #818 dial, a stack's alert-edge start right) would have reached the coordinator
# too. Its grant is what the template does:
#   - `agent-read-infra` (agent-read-rbac.yaml), cluster-wide: the triage's kubectl READS (pods and
#     logs, events, workloads, PVCs, nodes, Longhorn, ArgoCD apps — the window/claim reads at the
#     gateway gate — network policies, ESO specs, the AgentStack claims for ROUTE_STACK);
#   - `responder-ledger` below (the responder-seen ConfigMap — fp/subject dedup + the daily cap);
#   - `responder-hubble-exec` below: pods/exec in kube-system ONLY — the brief's (1b) HUBBLE step runs
#     `kubectl exec -n kube-system ds/cilium -- hubble observe` (no hubble binary in the image). This is
#     the one wide verb left (a cilium agent is node-privileged); it was cluster-wide before;
#   - the chart-rendered `argo-workflows-workflow` Role (the Argo executor's own write).
# NOT bound to ClusterRole `agent-coordinator` or `coordinator-scan-workflows`; no Secret read. Its
# GitHub token is `responder-git` (responder-git.yaml); the gateway admits it by name
# (argocd/resources/agent-gateway/policy.json `callers`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: responder
  namespace: agent-coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: responder-read-infra
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-read-infra }
subjects:
  - { kind: ServiceAccount, name: responder, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: responder-hubble-exec
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: responder-hubble-exec
  namespace: kube-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: responder-hubble-exec }
subjects:
  - { kind: ServiceAccount, name: responder, namespace: agent-coordinator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflows-workflow-responder, namespace: agent-coordinator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflows-workflow }
subjects:
  - { kind: ServiceAccount, name: responder, namespace: agent-coordinator }
---
# Responder fingerprint ledger (responder-argo.yaml): one triage per alert fp per 24h + the
# daily cap live in the responder-seen ConfigMap — NAMESPACED on purpose (a cluster-wide cm
# patch grant could touch other namespaces' config; the pods grant above is cluster-wide only
# because worker spawning genuinely crosses namespaces). A denied write degrades to the
# fp-issue search belt (loud, never blocking).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: responder-ledger
  namespace: agent-coordinator
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: responder-ledger
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: responder-ledger
subjects:
  # agent-coordinator stays: the deploy-revert chain keys its idempotency into the same ledger
  # (deploy-revert-argo.yaml, `deploy-<app>-<revision>`).
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
  - kind: ServiceAccount
    name: responder
    namespace: agent-coordinator
---
# ADR-106 (5) doorbell collapse + FU-160 wake source: the scan reads its OWN Workflow object
# (edge-vs-cron + the ring epoch — `dp_wake`; this read had silently failed fail-open since
# FU-160 shipped, no workflows grant existed) and DELETES pending sibling `coordinate*`
# workflows at scan start (`absorb_pending_rings`). NAMESPACED on purpose: the global scan only
# ever touches agent-coordinator's own workflows; the per-stack mirror is the Composition's
# agentstack-loop-workflow Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-scan-workflows
  namespace: agent-coordinator
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-scan-workflows
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-scan-workflows
subjects:
  - kind: ServiceAccount
    name: agent-coordinator
    namespace: agent-coordinator
---
# FU-138: the openrouter-proxy's _cr_guardrail() lists openrouterkeys in the ref's namespace to
# read the authoritative guardrail. The proxy SA has this grant in agent-egress (its own namespace)
# and in each worker project namespace (composed by the AgentStack claim), but agent-coordinator
# was covered by neither — and that is where the coordinator/reviewer subscription refs
# (ref:agent-coordinator/coordinator-claude) live. Without this, every anthropic passthrough
# request logs a 403 fallback line (fail-open, noise only). Mirrors the FU-138 grant verbatim
# from argocd/resources/openrouter-proxy/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openrouter-proxy-guardrail
  namespace: agent-coordinator
rules:
  - apiGroups: [openrouter.teststuff.net]
    resources: [openrouterkeys]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openrouter-proxy-guardrail
  namespace: agent-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openrouter-proxy-guardrail
subjects:
  - kind: ServiceAccount
    name: openrouter-proxy
    namespace: agent-egress
