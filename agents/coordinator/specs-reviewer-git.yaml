# Specs-reviewer git token (ADR-155): mints the `specs-reviewer-git` Secret the specs-review
# CronWorkflow (specs-review-argo.yaml) reads as GH_TOKEN — the SECOND review identity,
# homelab-specs-reviewer[bot] (docs/github-apps.yaml; brief agents/lenses/specs.md; design
# docs/agents/specs-reviewer.md). Split from reviewer-git ON PURPOSE: GitHub counts approvals per
# identity, and the island repo's master ruleset requires 2 — the code verdict (homelab-reviewer)
# and the specs verdict can never collapse into one. Same ESO chain shape as sentinel-git.yaml.
#
# Registered 2026-10-16 by `scripts/github-app-bootstrap.sh homelab-specs-reviewer register` (the
# ids below + docs/github-apps.yaml; key in Infisical SPECS_REVIEWER_GH_APP_PRIVATE_KEY + the wallet).
# ArgoCD-managed through kustomization.yaml like the sibling *-git.yaml chains.
# CUTOVER: specs-review-argo.yaml mounts this Secret `optional:true`. Absent Secret =
# SHADOW mode (agents/specs-reviewer-session.sh logs "specs-reviewer-git absent — shadow, no
# verdicts" and exits 0 — it never reviews under another identity); the Secret appearing IS the
# cutover, no manifest edit on the workflow side.
---
# 1) App private key: Infisical → a k8s Secret in this namespace the generator reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specs-reviewer-github-app
  namespace: agent-coordinator
spec:
  refreshInterval: 1h
  secretStoreRef: { name: infisical, kind: ClusterSecretStore }
  target:
    name: specs-reviewer-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        privateKey: '{{ .pem | replace "\\n" "\n" }}'
  data:
    - secretKey: pem
      remoteRef: { key: SPECS_REVIEWER_GH_APP_PRIVATE_KEY }
---
# 2) The generator: mint an installation token with ONLY the specs verdict's needs. contents:WRITE
# is required for the approval to COUNT toward the required-approval ruleset — GitHub only counts
# reviews from a reviewer with repo write access (contents:read ⇒ authorAssociation NONE, ignored;
# the homelab-reviewer lesson, 2026-07-02). The identity still never pushes and never merges.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: specs-reviewer-git-gen
  namespace: agent-coordinator
spec:
  appID: "5344206"       # homelab-specs-reviewer App (github-app-bootstrap.sh … register, 2026-10-16)
  installID: "172048550" # the teststuffstash installation of homelab-specs-reviewer
  auth:
    privateKey:
      secretRef: { name: specs-reviewer-github-app, key: privateKey }
  permissions:
    contents: write          #   clone the PR to diff **/specs/** against the merge-base + make the approval count
    pull_requests: write     #   submit the specs verdict (approve / request-changes) + read the PR body's Spec changes:
    issues: read             #   the closing issue's ## Acceptance rows — the lens's check-1 intent source (reads only)
    checks: read             #   CI green at head is the dispatch premise (statusCheckRollup)
    actions: read            #   `gh run view --log` on the head's ci run — the evidence-render block is the evidence input
  repositories:              #   the island repos — SPECS_REVIEW_REPOS in agents/specs-reviewer-session.sh
    - homelab                #   (an island adopting the lens adds itself here AND installs the App there —
    - oracle-fleet           #    the install FIRST: a token request naming an uninstalled repo fails for all)
---
# 3) Drive the generator → the Secret the CronWorkflow reads (key `token` → GH_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specs-reviewer-git
  namespace: agent-coordinator
spec:
  refreshInterval: 45m
  target:
    name: specs-reviewer-git
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GH_TOKEN: '{{ .token }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: specs-reviewer-git-gen
