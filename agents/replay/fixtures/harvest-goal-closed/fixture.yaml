# ADR-102 / homelab#207 — fixture (c): GOAL CLOSED → the sprout lands in the bucket INERT, with NO
# queue labels, and the budget is never even read.
#
# CONDITION UNDER REPLAY. The goal (#29) is CLOSED — VALIDATED, REVERTED or ABANDONED, the clause
# does not care which; a closed goal grants nothing. Everything else matches fixture (b): #35 still
# carries `Base: goal/29-p0-complete`, the bucket still exists, the tree is still funded on paper.
#
# THIS IS THE CENSUS CASE. On 2026-08-09 the harvest was caught self-queueing #195/#211-shaped
# sprouts after the goal had closed and the budget was gone, and oracle-fleet goal-174 grew three
# generations 34 hours post-close because nothing owned the tree. ADR-102's rule — "harvest
# self-queue is legal only inside an open funded goal and dies with it" — is this stream: bucket
# yes, labels no.
#
# NOTE WHAT IS ABSENT. No `gh issue list` and no ledger read: the state check short-circuits ahead
# of the budget read, so a closed goal costs one probe rather than a descendant walk. A future
# refactor that reorders those two would show up here as added CALL lines, which is the point.
name: harvest-goal-closed
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:harvest-disposition
  - file:post.sh
env:
  - IN_ORG=teststuffstash
  - IN_REPO=circles
  - IN_CLAUSE=merged-closeout
  - IN_ITEM=issue-35
  - IN_WMODEL=claude/haiku
  - IN_CAP=2.0000
