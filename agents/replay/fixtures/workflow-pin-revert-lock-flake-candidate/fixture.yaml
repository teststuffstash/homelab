# workflow-pin-revert-lock-flake-candidate — the lock shape admits the box flake's lock (2026-10-10,
# class 13 — the weekly devbox-update PR carries `mgmt/nixos/flake.lock` beside `devbox.lock`,
# operator ruling; pin-only-lint check (j) holds that file to a re-resolve). The contract pinned
# here: a merge of exactly {devbox.lock, mgmt/nixos/flake.lock} is a candidate and is picked over an
# OLDER lock-only merge; a merge that pairs the flake lock with ANY other file (here flake.nix — an
# owned edit, not a re-resolve) stays outside the class even when it is the newest.
name: workflow-pin-revert-lock-flake-candidate
mode: actions
source: agents/coordinator/deploy-revert-argo.yaml
env:
  - SLUG=teststuffstash/homelab
  - REVERT_WINDOW_MIN=120
  - CUTOFF=2026-10-12T02:00:00Z
parts:
  - block:workflow-pin-revert-candidate
  - file:post.sh
