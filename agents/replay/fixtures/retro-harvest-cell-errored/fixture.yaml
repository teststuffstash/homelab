# homelab#268 — the OTHER door into the silent loss #248 closed: a cell whose POD errored.
#
# CONDITION UNDER REPLAY. Argo splits a dead node in two. A container that exits non-zero is
# Failed — that is #248's world, and `continueOn: {failed: true}` covers it. A pod that never got
# to report an exit code (OOMKilled, evicted, node lost, image pull gone) is ERROR, which
# `failed: true` does not match: the `dependencies` edge held, cell-b and the harvest never ran,
# and the surviving cell's report died with the DAG — the identical silent-loss shape, reached
# through the phase nobody had widened for. The retro's two cells ride ephemeral TAINTED metal
# nodes (wk-metal-0*, 8GB, evictable), so Error is the phase the hardware picks, not an exotic one.
#
# WHAT THE HARNESS CAN AND CANNOT SEE. It asserts an action stream, and no shell clause reads
# `continueOn` — Argo does, and the phase itself is assigned by a controller this fixture cannot
# run. kubeconform SKIPS the CronWorkflow kind and manifest-lint does not even walk `agents/`, so
# the field is otherwise checked by NOTHING. Hence the two halves, and the split is the point:
#
#   • the DECLARATION is read out of the shipped manifest by the bridge (never transcribed) and
#     asserted as OUT lines — reverting the widening reds this fixture;
#   • the CONSEQUENCE is the harvest block replayed against the world an errored cell leaves.
#
# THE CONTRACT:
#   1. Both cell tasks declare failed AND error. One line each, from the manifest.
#   2. The surviving report still lands, under its own cell's slug: exactly one `cp` in the
#      stream. This is the whole point of the widening — cell-a delivered, cell-b's node OOMKilled
#      it, and the retro still ships what it has.
#   3. An errored cell leaves NO log at all. Its ride log is written by `tee` inside the pod, so a
#      pod that died before the ride never created one, the output artifact is unresolvable and
#      `optional: true` stages nothing — the harvest reads a path that does not exist. That is a
#      strictly harsher world than `retro-harvest-one-cell-dead`'s markerless log, and the same
#      WARN branch has to hold: `sed`'s read error goes to stderr (asserted, so it cannot become
#      an unnoticed change of behaviour) and the extraction's `[ -s ]` test decides.
#   4. RC 0, WARN names the cell, DEAD_NOTE carries the partial run into the PR body — the
#      dead-cell sibling's contract, re-asserted in the error world rather than assumed to
#      transfer, because the branch is reached by a different route (missing file, not empty
#      extraction).
#
# Siblings: `retro-harvest-one-cell-dead` (same harvest, Failed-phase world), `retro-harvest-slug`
# (both cells delivered), `retro-cell-report-*` (the cell's own self-check).
name: retro-harvest-cell-errored
mode: actions
source: agents/coordinator/retro-argo.yaml
parts:
  - file:bridge.sh
  - block:retro-harvest-slug
  - file:post.sh
