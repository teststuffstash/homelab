# tofu-image-revert-coupling-match — the tree read that ties the stuck Deployment to the candidate
# (#1988's class row, 2026-09-28): a changed file must DECLARE the alert's deployment name
# (`name = "<deployment>"`), read from the checkout — never inferred from the alert. The candidate's file declares it → the chain proceeds.
name: tofu-image-revert-coupling-match
mode: actions
source: agents/coordinator/deploy-revert-argo.yaml
env:
  - SLUG=teststuffstash/homelab
  - PRNUM=2037
  - NS=forgejo-runner
  - DEP=forgejo-runner
parts:
  - file:bridge.sh
  - block:tofu-image-revert-coupling
  - file:post.sh
