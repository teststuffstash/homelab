# FU-161 legs 3–4 / homelab#469 — the typed rail-probe canary + the FU-161 filing gate, one
# decision table.
#
# CONDITION UNDER REPLAY. Leg 1 (diff) and leg 2 (benchmark + rank) have already produced the
# ranked candidate list; this family pins the CANARY leg and the DIGEST from that point on. The
# bridge seeds `world/scout/ranked.json` (the RECORDED post-rank state) and shadows the canary I/O
# seams — `scout_canary_mint` (OpenRouterKey CR lifecycle), `scout_canary_ride` (the
# agent-session.sh dispatch, served from the recorded AGENT_RUN_STATS line) and `rotation_post` —
# so the ORCHESTRATION runs for real from the shipped script: typed verdict classification, the
# contradiction rule, the common-cause rule, the cell-keyed merge, and the filing gate. The rank
# itself is not this family's subject (scout-bench-ranked-columns pins it); its post-state is
# simply the world.
#
# THE CONTRACT (the issue's minimum, one row each):
#   1. A digest whose every row is unbenched AND lacking an evidence-bearing canary verdict posts
#      to the scout log ONLY — `gh issue create` is SKIPPED with a log line saying why (the
#      zero-information digests #380 and #455 are the reason this gate exists). Evidence-bearing
#      verdicts are `clean` or a model-specific `error_class`; platform/rail faults like `void`,
#      `no-stats`, and `unknown` provide no model signal. The `skip` row also pins the leg-4
#      COMMON-CAUSE rule: two canaries failing IDENTICALLY in one tick = ONE `_scout-infra`
#      datum in the rotation store, zero per-model verdicts — the suppressed tick is exactly the
#      all-unbenched all-lacking-evidence shape the gate skips.
#   2. A canary verdict is TYPED — the launcher's `error_class`, never a bare `failed`. The
#      `contradiction` row pins the CONTRADICTION rule: canary-fail ∧ benchmark-capable ⇒
#      `suspect-infra`, retry once, else `inconclusive` — ling-3.0-flash is the real 2026-08-10
#      datum that posted a bogus `failed` while benching above gpt-5.1. The row records the retry
#      also failing, so the final verdict is `inconclusive`, and the typed class (`auth-storm`)
#      never leaks through as the answer.
#   3. Any row with a benchmark index OR an evidence-bearing canary verdict ⇒ file as today, rows
#      carrying the canary column. The `filed` row pins that: one benched + one unbenched-but-clean
#      canary, the digest posts, the canary column shows both typed verdicts. Evidence-bearing
#      means `clean` or a model-specific `error_class`, not platform/rail faults.
#   4. An UNPARSABLE stats blob is a TYPED verdict, never blank (additive, PR#499 round 2). A
#      jq parse failure on a non-JSON AGENT_RUN_STATS tail ⇒ `unknown` — the rail DID speak, the
#      line did not parse; a fact distinct from `no-stats`. Though `unknown` is typed, it carries
#      no model signal (it is a runner fault, not a model outcome), so it does not meet the
#      evidence-bearing criterion. The `unparsable` row pins this: an unbenched candidate with
#      `unknown` verdict is canaried but lacks evidence, so the gate SKIPS the digest.
#   5. A digest with ≥1 evidence-bearing verdict (whether benched rows with canary, or unbenched
#      rows with `clean`/model-error verdicts) posts normally to file. The `mixed-benched-and-evidence`
#      row pins that: a benched row + an unbenched row with an evidence-bearing canary coexist,
#      the digest posts, the canary column shows the evidence-bearing verdict.
#   6. A digest whose every row has non-evidence verdicts (`void`, `no-stats`, `unknown` with no
#      alternative benched rows) skips filing but logs the model ids so they remain discoverable
#      from the tick. The `all-non-evidence-void-no-stats` row pins this: three unbenched rows
#      with only `void`/`no-stats` verdicts, the digest is SKIPPED, and the withheld model ids
#      appear in the tick log.
#
# Worlds are the family's per-row recorded state: ranked.json (post-rank rows, the shape leg 2
# writes) + the AGENT_RUN_STATS lines the rides would have emitted. `filed` and `contradiction`
# carry `.enr` (the enrichment), `skip` does not (unenriched + unbenched is the honest newcomer).
name: scout-canary-filing-gate
mode: table
source: agents/model-scout.sh
env:
  - CANARY=1
# The digest title carries `date -u +%F`; the run date is not the subject of any assertion here.
scrub:
  - s/(20[0-9][0-9]-[0-9][0-9]-[0-9][0-9])/(<today>)/
parts:
  - block:scout-seams
  - file:bridge.sh
  - block:scout-canary
  - block:scout-digest
  - file:observe.sh
