# homelab#1941 — fix round, ConfigMap create refused AlreadyExists, same-key pod absent, but the existing
# ConfigMap carries NO Pod ownerReference: that is a CONCURRENT launcher's fresh bundle (the owner is patched
# on only after pod-create), not a stale one. The launcher must delete nothing and retry nothing; the run
# takes the argv fallback and its fallback line names AlreadyExists. The create is refused (alreadyexists)
# on every call. Context = ../fix-round (pr.md + reviews.md fetch OK).
name: context-prefetch/fix-round-cm-stale-no-owner
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:context-prefetch
  - file:post.sh
env:
  - STUB_KUBECTL_create=alreadyexists
# Round 3 ruling: the existing ConfigMap has NO Pod ownerReference (a concurrent launcher's fresh bundle) — nothing is deleted, argv fallback names AlreadyExists.
