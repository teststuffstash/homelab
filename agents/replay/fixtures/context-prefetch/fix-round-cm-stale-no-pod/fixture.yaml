# homelab#1941 — fix round, ConfigMap create refused AlreadyExists by a STALE bundle: a struck or crashed
# earlier attempt at this (task, round) left the ConfigMap behind and no same-key pod exists (the kubectl
# read answers empty). The launcher must delete that bundle and recreate it ONCE, so the run takes the
# ConfigMap channel and never the argv fallback. The first create is refused (alreadyexists-once), the
# retry lands. Context = ../fix-round (pr.md + reviews.md fetch OK).
name: context-prefetch/fix-round-cm-stale-no-pod
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:context-prefetch
  - file:post.sh
env:
  - STUB_KUBECTL_create=alreadyexists-once
