# workflow-touching nor lock-only is walked past, a `revert-*` merge is never a candidate, and a
# lock PR that ALSO carries a fixture (the worker-adapted #2362 shape) is OUTSIDE the class —
# the world holds all four and the chain must pick the lock-only one.
