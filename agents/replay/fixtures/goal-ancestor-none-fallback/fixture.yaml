# homelab#367 — the DEGRADE. A walk that finds no goal must not take away what the single hop gave.
#
# CONDITION UNDER REPLAY. Issue #88's parent #61 is an ordinary epic: no `task/goal` label, no
# `Budget:` line — but it DOES carry `## Goal` and `## Acceptance` headings. Its own parent read
# comes back `null`, so the tree is exhausted after one hop.
#
#     #88 (this ride) → #61 (no label, no Budget, has Goal/Acceptance) → ∅
#
# THE CONTRACT — this is the arm that makes the fix safe to ship, not the arm that fixes anything:
#   1. `GATE SUBJECT: #61` with a card built from #61. Before #367 an unlabelled, unfunded parent
#      still produced a bounded card, and thousands of ordinary child rides sit on that path. A
#      walk that returned "no goal" and dropped the card would be a regression bought with a fix.
#   2. It cannot weaken the GATE, and the reason is structural rather than argued: any ancestor
#      carrying a machine-readable `Budget:` line STOPS the walk (its sibling fixture
#      goal-ancestor-unlabelled-budget pins exactly that), so an issue reached by this arm has no
#      `Budget:` line by construction and `goal_budget_read` returns `no-budget` on it — "gate off",
#      identically to the pre-#367 behaviour on the same issue.
#   3. The degrade is SAID (`no task/goal or Budget: ancestor above #88 … for the card only`). A
#      launcher that quietly treats a non-goal as a goal is how #367 lasted a week.
#   4. `null` from `/parent` ends the walk. GitHub answers a parentless issue that way, and the
#      guard that reads it is the same `case … *[!0-9]*` the clause uses everywhere.
#
# THE WORLD IS CONSTRUCTED, not recorded — circles has no such issue. It is a legitimate world for
# pinning OUR side of a contract (agents/replay/README.md §scout-*): the `null` payload is the real
# shape GitHub returns, and the headings-without-a-label shape is the ordinary sub-issue this arm
# exists for.
name: goal-ancestor-none-fallback
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-ancestor
  - file:post.sh
