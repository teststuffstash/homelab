# Issue #871 (homelab): budget-403 split — the raw-log classifier distinguishes
# account-credit from key-limit 403s, and carries the matched log line into the
# strike comment. Three branches:
#   - budget-403-key:   key limit exceeded
#   - budget-403-account: insufficient (credit|fund), 402 payment, payment required, out of credit
#   - budget-403:       residual (insufficient quota, quota exceeded, budget exceeded)
#
# Issue #815 / #804 (homelab): Replay coverage for the startup-config-death strike
# signature in BOTH classifier branches — STATS path and raw-log fallback.
#
# THE CONTRACT:
#   The opencode binary rejects unknown config keys at startup (Configuration is invalid /
#   Unrecognized key), causing the pod to die in under 15s at zero cost. Both classifier
#   branches must map this signature to error_class=harness-death so the coordinator strikes
#   the model instead of treating the round as "unknown" (which re-dispatches on the same
#   broken config).
#
# CONDITION UNDER REPLAY. The strike classifier sits in two branches of agent-session.sh:
#   - STATS path (AGENT_RUN_STATS line exists): if exit_status classifies as "unknown", the
#     run log is checked for the config-death signature. Must not over-trigger on clean logs.
#   - Raw-log fallback (no AGENT_RUN_STATS): the pod's reason and run log are classified
#     from scratch with the same signatures. DeadlineExceeded takes precedence over the
#     config-death check (ordering witness).
#
name: strike-quota-classifier
mode: table
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:strike-classifier
  - block:strike-line-format
  - file:post.sh