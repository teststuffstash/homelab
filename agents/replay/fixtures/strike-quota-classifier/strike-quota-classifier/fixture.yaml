# Issue #871 (homelab): budget-403 split — the raw-log classifier distinguishes
# account-credit from key-limit 403s, and carries the matched log line into the
# strike comment. Three branches:
#   - budget-403-key:   key limit exceeded
#   - budget-403-account: insufficient (credit|fund), 402 payment, payment required, out of credit
#   - budget-403:       residual (insufficient quota, quota exceeded, budget exceeded)
#
# Issue #815 / #804 (homelab): Replay coverage for the startup-config-death strike
# signature in BOTH classifier branches — STATS path and raw-log fallback.
#
# Issue #866 (homelab): Replay coverage for the provider-5xx (harness-side UnknownError)
# strike signature in BOTH classifier branches. A zero-cost, sub-30s pod death with
# "UnknownError" in the log must classify as harness-death to avoid mis-classifying the
# ride as "clean" (which would escalate an existing PR to arbitrate, costing coordinator time).
#
# THE CONTRACT:
#   1. Config-death: The opencode binary rejects unknown config keys at startup (Configuration is
#      invalid / Unrecognized key), causing the pod to die in under 15s at zero cost. Both classifier
#      branches must map this signature to error_class=harness-death.
#   2. Provider-5xx: The model API returns UnknownError (harness-side), causing the pod to die at
#      zero cost in sub-30s with no new artifact. Both classifier branches must map this signature
#      to error_class=harness-death.
#   3. PR-present narrowing (homelab#866): A PR-less ride strikes on any classified error, `unknown`
#      included (FU-062 semantics — that's the chain-walk signal). A ride WITH an open PR strikes
#      only on harness-death, auth-storm, timeout, quota, or budget-* classes; anything else
#      (e.g., `unknown`) must not strike and must reset ERR_CLASS to empty so the report records
#      no error.
#
# Retro r8 F3 (docs/agents/retros/2026-10-12-platform-r8-opus.md): two cap signatures that the
# classifier had no pattern for, so the harness-forced `final_output` filed as a deliberate stop —
# no strike, no ADR-127 swap, a phantom the seat requeued by hand (5 touches on 2026-10-06):
#   4. Output-token cap: goose's `Warning: Response reached the model's output-token limit` line
#      followed by its `You MUST call the final_output tool NOW` order. error_class=turn-cap
#      (router.py:STRIKE_CLASSES; the strike-retry predicate admits it for one automatic
#      re-route), goose-gated like `-32602`, matched as the two-line pair at column 0 — the
#      phrase alone in quoted content is text (#1705). Strikes with and without a PR (#866).
#   5. Goose's 402 line (`check your account with your provider to add more credits`): no code,
#      envelope or URL, so key-cap and empty-account are indistinguishable on the line. Operator
#      ruling 2026-10-15 (retro r8 F3): KEY-class → budget-403-key → KEY-RETRY (same model, fresh
#      key, no strike), mirroring agent-finalize — the credit-floor gate (FU-088b) defers dispatch
#      when the account is low, so the line means the session key hit its cap.
#
# homelab#3094: an OOMKilled agent container takes agent-finalize with it (no stats line), so only
# the raw-log fallback sees the ride:
#   6. The kubelet's terminated reason for the `agent` container is the evidence — read in the SAME
#      call as the pod's status.reason (`<pod reason>/<agent terminated reason>`; a world file with no
#      `/` is a pod reason alone). OOMKilled → error_class=oom, after DeadlineExceeded and before
#      every log signature; it strikes with and without a PR. Any other terminated reason classifies
#      from the log as before.
#
# CONDITION UNDER REPLAY. The strike classifier sits in two branches of agent-session.sh:
#   - STATS path (AGENT_RUN_STATS line exists): if exit_status classifies as "unknown", the
#     run log is checked for config-death and provider-5xx signatures. Must not over-trigger on clean logs.
#   - Raw-log fallback (no AGENT_RUN_STATS): the pod's reason and run log are classified
#     from scratch with the same signatures. DeadlineExceeded takes precedence over the
#     config-death/provider-5xx checks (ordering witness).
#
name: strike-quota-classifier
mode: table
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:strike-classifier
  - block:strike-line-format
  - block:strike-provider-append
  - file:post.sh