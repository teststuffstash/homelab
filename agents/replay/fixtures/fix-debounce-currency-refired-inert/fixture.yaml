# homelab#253 — leg G: the alert IS firing, and the issue still does not queue, because its body
# predates the subject's last state change. The second half of FU-133 leg c.
#
# CONDITION UNDER REPLAY. `fix-debounce-unblocked-queues`'s world with one BODY LINE added — the
# `last-cleared:` line the responder's resolve leg writes in place when an alert clears on an issue
# it may not close (`fix-verdict: fix`, responder-argo.yaml, #148) — and an alert store in which
# `alert-fp:9c41d70e5ab28f13` is firing again, since 11:31:44Z, two hours after that recorded
# clear. Nothing else moves.
#
# WHY THIS IS NOT THE SAME AS LEG F. There the alert was gone and the answer was easy. Here live
# state says FIRING, and a gate that only asked "is it firing" would queue: the fixer would then be
# handed an evidence bundle — which the recipe tells it to treat as ground truth — describing the
# episode that ENDED at 09:12Z, not the one running now. That is homelab#68's actual failure
# (iac-lane.md: "the set-pass reads bodies, not current state"), stated as the doc states it —
# treat a body older than its subject's last state change as suspect.
#
# It is narrow on purpose, and the narrowness is the design: an issue queued off the bell that
# filed it has no recorded clear to predate, so this branch is unreachable for the common path. It
# takes a body that sat unqueued across a whole flap cycle — held by a set-pass `unsure`, a human
# label, or a backstop rediscovery — to get here. Flapping alone does not gut the lane.
#
# THE CONTRACT:
#   1. No queue POST, no doorbell. The clear timestamp comes out of the BODY (the resolve leg's one
#      line, read with the same `^`-anchored discipline as the `alert-fp:` marker) and the refire
#      timestamp out of the LIVE store — neither side is inferred from the other.
#   2. The note names both timestamps. A skip a human cannot check is a skip a human will override
#      blind, so the comparison that produced it is in the record.
#   3. `mc_event` APPENDS to the summary comment this timeline already carries (the block notice
#      from an earlier ride) rather than starting a second one — ADR-103 rule 2, and the arm leg F
#      does not exercise. The PATCH body in the stream is the old comment plus exactly one line.
#   4. Still no label and no close: same rule as leg F, for the same reason.
