# homelab#253 — leg F: the alert RESOLVED, so the issue that was ripe to queue goes inert with one
# note instead. FU-133 leg c, the queue-time currency gate.
#
# CONDITION UNDER REPLAY. `fix-debounce-unblocked-queues`'s world — the same #237, the same labels,
# the same body, the same one-issue pending set — with exactly one delta: the recorded Alertmanager
# store. It is the founding case's shape, from the first live ≥2 set-pass (iac-lane.md §"one root
# cause, N alert issues"): homelab#68 was queued off a 07-28 body ELEVEN MINUTES after the resolve
# leg recorded its alert clearing, and the 21:00Z coordinator had to refuse the unit and park it
# `agent/blocked` — a belt doing a guard's job at the wrong end of the lane.
#
# The delta is deliberately NOT "the fingerprint is absent". `alert-fp:9c41d70e5ab28f13` is still
# IN the store, `status.state: active`, with `endsAt` eleven minutes in the past of this fixture's
# pinned clock — because that is what Alertmanager actually serves in the minutes after a clear,
# and a membership test would therefore answer FIRING inside exactly the window #68 was queued in.
# `endsAt > now` is the assertion; the fingerprint's presence is the trap it has to survive.
#
# THE CONTRACT:
#   1. The gate runs AFTER the ❌-table footprint tests and only for an issue that would otherwise
#      queue: #237's `Touches:` line is clean, so the deny in this stream is the currency verdict
#      and nothing else. No `labels[]=agent/queued` POST, no `/coordinate` doorbell — the two
#      actions leg B asserts are here by their ABSENCE.
#   2. Nothing else moves either: no label, no close, no body edit. A skip is not a close, because
#      alert-state is not defect-state — the defect may well outlive its alert, and that call
#      belongs to a human. The issue simply stays inert and re-enters the pending set the moment
#      anyone decides it is still true.
#   3. The 4b8e… entry is the WITNESS, and it is doing two jobs: it proves the probe was served
#      (an unread store would be an empty array, which reaches the same verdict by accident), and
#      it proves the fingerprint filter is a filter — a live alert sits beside the resolved one
#      and does not rescue it.
#   4. The verdict is recorded ONCE, through the ADR-103 machine channel. This world has no
#      `<!-- agent-summary -->` comment yet, so `mc_event` creates one; leg H holds the other half
#      (a note already there → no second write) and `fix-debounce-currency-refired-inert` holds the
#      append-into-the-existing-comment arm.
name: fix-debounce-currency-resolved-inert
mode: actions
source: agents/coordinator/fix-debounce-argo.yaml
# The clock the recorded alert store was taken at: 2026-08-11T14:00:00Z, eleven minutes after
# 9c41d70e…'s endsAt. MC_NOW is the note's timestamp — mc_event stamps its own line, and a real
# clock there would red this fixture once per second.
env:
  - FC_NOW=1786456800
  - MC_NOW=2026-08-11T14:00:00Z
parts:
  - file:../fix-debounce-blocked-inert/bridge.sh
  - block:fix-debounce-pending-set
  - block:fix-debounce-gates
