# updater — agents/update-pr-branch.sh as one decision table (ADR-111 / homelab#742; the
# adRise-action replacement, MP-T02/MP-T06's first executed replay).
#
# THE CONTRACT: per pass over one `gh pr list` snapshot, three legs —
#   1. main pick: armed ∧ BEHIND ∧ ¬CHANGES_REQUESTED, oldest first (FIFO), ONE update per pass.
#      NO green requirement (2026-07-10: requiring checks wedges base-side CI fixes out of PRs).
#   2. unstrand (the CR∧BEHIND crack, narrowed 2026-08-17): armed ∧ BEHIND ∧ CHANGES_REQUESTED,
#      breaker labels excluded, updated ONLY when the newest NON-merge commit post-dates the
#      newest homelab-reviewer verdict; unreadable commit/review data HOLDS (rule #6).
#   3. conflict labeler: armed ∧ DIRTY gains merge-conflict (idempotent create first); the label
#      is removed once the PR is no longer armed-and-DIRTY.
# The script under test is INVOKED BY PATH (bridge.sh), never transcribed — arg handling included.
# Base world `board` is CLEAN (#90 armed∧CLEAN + #91 unarmed∧BEHIND = the armed-only witness);
# each row patches its condition in. ⚠ The 422-on-update branch is unreplayable until homelab#740
# (STUB_GH is run-global; a single write cannot be failed) — noted at the branch in the script.
name: updater
mode: table
parts:
  - file:bridge.sh
rows: rows.psv
