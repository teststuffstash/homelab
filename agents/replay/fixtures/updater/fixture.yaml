# updater — agents/update-pr-branch.sh as one decision table (ADR-111 / homelab#742; the
# adRise-action replacement, MP-T02/MP-T06's first executed replay).
#
# THE CONTRACT: per pass over one `gh pr list` snapshot, three legs —
#   1. main pick: armed ∧ BEHIND ∧ MERGE-READY, oldest first (FIFO), ONE update per
#      (repo, base) LANE per pass — ADR-125 (2)/homelab#1422; before that it was one per REPO,
#      which serialized a goal lane behind master traffic that cannot stale its approvals.
#      NO green requirement (2026-07-10: requiring checks wedges base-side CI fixes out of PRs).
#      MERGE-READY (homelab#1452, the platform-native merge queue) = nothing but currency + CI
#      stands between the PR and auto-merge: reviewDecision APPROVED, or the reviewer bot's
#      APPROVED post-dating the newest NON-MERGE commit. ¬CHANGES_REQUESTED and the #887
#      codeowner-park skip are now special cases of it. `unreviewed-behind-no-update` is the pin
#      (same world as the pre-#1452 fifo row, minus the approvals ⇒ no update);
#      `merge-ready-only-off-legacy-pick` holds UPDATER_MERGE_READY_ONLY=0 (the old pick) for the
#      L-scenario comparison. The FIFO/lane rows carry bot approvals now so their subject stays
#      the ORDERING, not the predicate.
#   2. unstrand (the CR∧BEHIND crack, narrowed 2026-08-17): armed ∧ BEHIND ∧ CHANGES_REQUESTED,
#      breaker labels excluded, updated ONLY when the newest NON-merge commit post-dates the
#      newest homelab-reviewer verdict; unreadable commit/review data HOLDS (rule #6).
#   3. conflict labeler: armed ∧ DIRTY gains merge-conflict (idempotent create first); the label
#      is removed once the PR is no longer armed-and-DIRTY.
# The script under test is INVOKED BY PATH (bridge.sh), never transcribed — arg handling included.
# Ratchet disposition (#744, 2026-08-23): the /update-pr EventSource endpoint (review-argo.yaml)
# and the Sensor/WorkflowTemplate/cron around this script (update-pr-argo.yaml) are ACTIVATION
# MACHINERY — routing surface with no clause logic of their own; THIS family is their behavior
# pin, and the CRON-SERVICED detector line is asserted operationally (log-read), not replayed.
# Base world `board` is CLEAN (#90 armed∧CLEAN + #91 unarmed∧BEHIND = the armed-only witness), and
# every recorded PR carries `baseRefName` because the pass now asks for it; the lane rows
# (`two-lanes-two-updates`, `same-lane-one-update`) are the ADR-125 pin — two bases in one pass
# yield TWO calls, two PRs on ONE base still yield one.
#
# each row patches its condition in. The 422-on-update branch is pinned by the `update-fail` row
# (per-call failure injection, STUB_GH_<slug> — homelab#740 / PR#759). The race-422 row was
# dropped (homelab#1007): `agents/update-pr-branch.sh` deliberately no longer distinguishes race
# from conflict on 422, so `update-fail` covers both — a distinct row would be byte-identical.
pins:
  - MP-T02
name: updater
mode: table
parts:
  - file:bridge.sh
rows: rows.psv
