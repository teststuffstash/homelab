# homelab#237 no longer carries `agent/blocked` (its body line is reworded to say so; nothing else
# moves). Holding the world constant across the pair is the point: an exclusion that also silenced
# the happy path would pass leg A and be a worse bug than the one it fixed, and the only way to see
# that is to change one label and nothing else.
