# homelab#238 — leg B: the SAME world with the block lifted, and the ordinary queue path still runs
# end to end.
#
# CONDITION UNDER REPLAY. `fix-debounce-blocked-inert`'s world with exactly one label removed —
# homelab#237 no longer carries `agent/blocked` (its body line is reworded to say so; nothing else
# moves). Holding the world constant across the pair is the point: an exclusion that also silenced
# the happy path would pass leg A and be a worse bug than the one it fixed, and the only way to see
# that is to change one label and nothing else.
#
# THE CONTRACT:
#   1. #237 is now the whole pending set — one issue — so the deterministic fast path runs: no
#      set-pass session, no subscription latch, no LLM. `sq_decide` reads its body, finds a
#      `Touches:` line outside the ❌ table, and it is QUEUED.
#   2. #229 (`agent/error`) is STILL excluded, and here that exclusion is load-bearing rather than
#      cosmetic: without it N would be 2, and this leg would take the ≥2 set-pass branch instead of
#      the fast path. Leg A proves the error label is not queued; this leg proves it is not
#      COUNTED either.
#   3. #226 stays in SELFREF — the `self-referential: true` marker keeps it human-queued no matter
#      what the label predicate says, and it witnesses that the list read was served (see leg A).
#      This leg is also the exclusion's LOWER bound, and that got sharper with homelab#244: the
#      predicate is now a namespace test (`any(startswith("agent/"))`), so #237 queueing here on
#      `alert` + `agent-fix` alone is what proves the test eats lifecycle STATE and not the
#      diagnosis. `agent-fix` is spelled with a dash; a predicate that reached it would empty the
#      pending set forever and kill the lane silently — a worse failure than the bug being fixed,
#      and no `agent/*` leg can see it. Legs A and C only assert the upper bound.
#   4. The doorbell rings once, for the repo that was queued, carrying `{repo, unit}` only —
#      platform is not a graduated stack, so no `{stack, loop_ns}` pair rides along (FU-144).
#   5. CURRENCY IS CURRENT (homelab#253, FU-133 leg c). This leg gained the gate's happy path and
#      is now its lower bound too: #237's `alert-fp:9c41d70e5ab28f13` is in the recorded alert
#      store with an `endsAt` in the FUTURE of this fixture's pinned clock, and its body carries
#      no `last-cleared:` line — so the verdict is `current`, the probe is the only extra action
#      in the stream, and the queue path runs exactly as before. A gate that over-denied would
#      empty this stream of its POST and its doorbell, which is the failure the two inert legs
#      cannot see (they never reach the gate).
name: fix-debounce-unblocked-queues
mode: actions
source: agents/coordinator/fix-debounce-argo.yaml
# The clock the recorded alert store was taken at: 2026-08-11T14:00:00Z. The fixture
# subset has no inline comments — a trailing `# …` would ride into the value.
env:
  - FC_NOW=1786456800
parts:
  - file:../fix-debounce-blocked-inert/bridge.sh
  - block:fix-debounce-pending-set
  - block:fix-debounce-gates
