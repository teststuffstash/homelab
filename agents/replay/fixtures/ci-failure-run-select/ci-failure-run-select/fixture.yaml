# homelab#1440 + homelab#1940 — the ci-red run selector, as one decision table.
#
# THE CONTRACT. The ci-red prefetch needs the FAILING run's log. It selects the run whose
# run-level conclusion is `failure` (`--status failure`), never the newest run on the branch
# (#1440: a `renovate-approve` skip sharing the CI run's createdAt sorted first and the log read
# came back empty on every tick — a permanent defer). But a run whose failing job has already
# completed is not yet `failure` while a SIBLING job is still running — GitHub reports the run
# `in_progress` until every job settles — so `--status failure` is empty for as long as any
# sibling runs, and a wedged sibling (no `timeout-minutes`) defers every ride for up to 6h
# (#1940). The selector now falls back to the newest run on the branch when no run has settled to
# `failure`; its failed job's log is already readable, and that log is the directive the round
# needs.
#
# ROWS. `settled-failure` is the clean base — one run concluded `failure` (the #1440 pin: the
# newest run on the branch is a `skipped` renovate-approve, and the selector must pick the
# concluded-failure run, not it). `unsettled-sibling` is the missed case: no run has settled to
# `failure` (the `--status failure` list is empty) while the newest run on the branch is
# `in_progress` with a readable failed job — the fallback selects it and the log tail lands.
#
# WORLDS. worlds/base (constructed — see its provenance.yaml).
pins:
  - MP-T12
name: ci-failure-run-select
mode: table
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:ci-failure-run-select
  - file:post.sh
world: base
rows: rows.psv
