# ADR-103 / homelab#1060 + homelab#1116 — the sibling-mention false-positive case, pinned.
#
# CONDITION UNDER REPLAY. A red PR (#43, branch `fix/issue-19-thing`) that has completed TWO fix
# rounds (attempts=2 < RED_MAX=3). The repo also holds:
#   - PR #44 (branch `fix/issue-20-other`) whose body mentions `#19` as a sibling reference
#     ("sibling #19, documented for #19 to plumb") but carries NO closing keyword for #19.
#   - PR #45 (branch `fix/issue-21-other`) whose body says "this remains unresolved #19" —
#     "unresolved" contains "resolved" as a substring; the leading anchor must reject it.
#   - PR #46 (branch `fix/issue-22-other`) whose body says "prefixes #19 the issue" —
#     "prefixes" contains "fixes" as a substring; the leading anchor must reject it.
#   - PR #47 (branch `fix/issue-23-other`) whose body says "this resolves #19 the issue" —
#     "resolves" at a word boundary; the leading anchor must accept it.
#   - PR #48 (branch `fix/issue-24-other`) whose body says "resolves #19 the issue" —
#     "resolves" at line start; the leading anchor must accept it.
#
# WHY THIS FIXTURE EXISTS (leg 1, #1060). The old `refs($n)` body arm matched any bare `#<n>`
# (boundary-anchored), so PR #44 would be counted as a sibling of issue #19, inflating the round
# count. The fix tightened the body arm to only match closing keywords (Fixes/Closes/Resolves
# #<n>), so a mere sibling mention no longer counts.
#
# WHY THIS FIXTURE WAS EXTENDED (leg 2, #1116). The closing-keyword regex had no leading
# word-boundary anchor, so `unresolved #<n>` and `prefixes #<n>` matched as closing references
# (because "resolved" and "fixes" are substrings of those words). The fix adds `(^|[^a-z])`
# before the keyword group at all 7 sites. PRs #45–#48 pin the negative and positive cases.
#
# THE CONTRACT:
#   1. attempts = 2 — two new-shape stats markers, both before the newest non-merge commit.
#   2. noop_round = <none> — newest stats timestamp (08:30) is BEFORE the newest non-merge commit
#      (09:00), so the last completed round pushed something.
#   3. attempts(2) < RED_MAX(3), so the issue-keyed ceiling IS checked — `gh pr list` is called.
#   4. PR #44 mentions `#19` in its body but NOT as a closing keyword → NOT counted.
#   5. PR #45 says "unresolved #19" → "resolved" is a substring of "unresolved", but the leading
#      anchor `(^|[^a-z])` rejects it because 'e' precedes "resolved" → NOT counted.
#   6. PR #46 says "prefixes #19" → "fixes" is a substring of "prefixes", but the leading anchor
#      rejects it because 'e' precedes "fixes" → NOT counted.
#   7. PR #47 says "this resolves #19" → "resolves" at a word boundary (space before it) → COUNTED.
#   8. PR #48 says "resolves #19" at line start → "resolves" at start of string → COUNTED.
#   9. `refs(19)` matches 3 PRs (#43 via branch, #47, #48) with 4 stats (2+1+1).
#      red_sib_prs=3, red_sib_n=4. Since red_sib_n(4) > red_rounds(2), the issue-keyed ceiling
#      applies: RED_ROUNDS=4, RED_ROUNDS_KEY="issue #19 (3 PRs)".
#  10. Two calls: `gh pr view 43` and `gh pr list --repo ... --state all --limit 100 --json ...`.
pins:
  - MP-T12
name: ci-red-rounds-sibling-mention
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:round-evidence
  - file:bridge.sh
  - block:ci-red-rounds
  - file:post.sh
