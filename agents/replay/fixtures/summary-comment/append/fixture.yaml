# ADR-103 / homelab#210 — the EDIT half, and the one that makes the bar hold.
#
# CONDITION UNDER REPLAY. PR #43 already carries a `<!-- agent-summary -->` comment from round 1
# (id 5231000042), plus a decoy: a SECOND marked comment (id 5231000099) created later — the race
# a find-or-create with no tie-break would ping-pong between. The launcher fallback posts round 2's
# stats.
#
# THE CONTRACT:
#   1. ONE PATCH, no POST. "Every later machine event EDITS it, never adds a comment" is the whole
#      deliverable; a create in this stream is the bug.
#   2. The PATCH targets 5231000042 — the OLDEST marked comment, not the newest and not the last in
#      list order. Ties break on `created_at` so a stray second summary comment converges back onto
#      the first instead of alternating forever.
#   3. The body is round 1's body plus ONE appended line. Append-only, never replace: the round
#      counter reads how many `kind=stats` markers a PR carries, and a replacing writer would peg
#      the ci-red clause at attempts=1 permanently — the livelock RED_ROUNDS_MAX exists to bound.
#      The pre-existing round-1 markers are visible, verbatim, in the asserted body.
#   4. The endpoint is `issues/comments/<id>`, keyed on the REST-numeric id. A PR conversation
#      comment IS an issue comment, which is why one helper serves both sides with no pr/issue
#      switch — and why the GraphQL node id `gh pr view --json comments` returns would 404 here.
name: summary-comment-append
mode: actions
parts:
  - file:bridge.sh
env:
  - IN_SLUG=teststuffstash/circles
  - IN_NUMBER=43
