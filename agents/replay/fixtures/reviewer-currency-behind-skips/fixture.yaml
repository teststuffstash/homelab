# reviewer-currency-behind-skips (2026-08-17) — the CURRENCY GATE skips a review whose head has
# fallen BEHIND master by spawn time.
#
# CONDITION UNDER REPLAY. The launcher's combined FU-092 pod-name probe (ONE `gh pr view`
# fetching headRefOid,state,mergeStateStatus) returns state=OPEN, mergeStateStatus=BEHIND.
# Before the gate this exact situation burned a STANDING-ASIDE pod: the PR was green+current at
# dispatch-decision and BEHIND by pod-execution — the pod and its subscription semaphore slot
# were spent on a review of a head about to be replaced.
#
# THE CONTRACT (executes the REAL currency-gate block from reviewer-session.sh via sentinel):
#   1. The block calls `gh pr view 42 --repo teststuffstash/test-project --json
#      headRefOid,state,mergeStateStatus` — the bridge's function-shadow `gh` records a CALL line
#      and serves the fixture world JSON.
#   2. state=OPEN passes the state check; mergeStateStatus=BEHIND fires the skip branch: ONE line
#      naming the status at spawn time, then `exit 0`. The level-triggered path re-picks the PR
#      once the updater brings it current — nothing is lost by the skip.
#   3. The action stream asserts: exactly the CALL line, the skip OUT line, RC 0 — and BY ABSENCE
#      no pod was created and execution did not continue (the composed clause is bridge+block, so
#      a gate that failed to skip would emit no skip line and the diff reds).
#
# EXPECTED STREAM (derived from the shipped text in the block):
#   CALL — gh pr view 42 --repo teststuffstash/test-project --json headRefOid,state,mergeStateStatus
#   OUT  — "→ review of teststuffstash/test-project#42 skipped — head is BEHIND at spawn time
#          (currency gate: the level-triggered path re-picks when current; was a STANDING-ASIDE
#          pod burn before)"   ← the exact `echo` from the shipped block
#   RC   — 0 (skip is a clean no-op, not an error)
#
# Parts: bridge.sh (seams: function-shadow gh) + block:reviewer-currency-gate (real code)
name: reviewer-currency-behind-skips
mode: actions
source: agents/reviewer-session.sh
parts:
  - file:bridge.sh
  - block:reviewer-currency-gate
