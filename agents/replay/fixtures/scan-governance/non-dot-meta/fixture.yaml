# homelab#1070 — governance_paths() unescape drops non-dot metacharacters.
#
# WHAT IT PINS. The `governance_paths()` function in `agents/coordinator-scan.sh` unescapes regex
# metacharacters from the GOVERNANCE set. The sibling `guarded_paths()` uses a capture-group form
# (`s/\\\(.\)/\1/g`) that correctly unescapes any character. `governance_paths()` was using a
# dot-only form (`s/\\././g`) that silently corrupts non-dot metacharacters like `\+` or `\|`.
# This fixture verifies the fix: a GOVERNANCE entry escaping `\+` correctly produces a literal `+`.
#
# THE TWO CASES:
#   #1100  `something+else` → HELD. The GOVERNANCE set includes `something\+else`, which after
#          correct unescape becomes `something+else`. An issue touching `something+else` should
#          be identified as a governance path and held.
#   #1101  `something.else` → DISPATCHED. The GOVERNANCE set includes `something\+else`, which
#          after correct unescape becomes `something+else` (NOT `something.else`). An issue
#          touching `something.else` should NOT match the governance set and should dispatch.
#
# `GOVERNANCE_LINT` is pointed at a custom script in this fixture directory that has a GOVERNANCE
# entry with a non-dot metacharacter (`something\+else`).
name: scan-governance-non-dot-meta
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:governance-set
  - file:cases.sh
  - block:governance-hold
  - file:post.sh
env:
  - GOVERNANCE_LINT=./governance-lint.sh