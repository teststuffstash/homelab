# homelab#1151 — CODEOWNERS unreadable: the ❌ set is hardcoded in classify_touches(), so it still
# works. Non-❌ paths default to machine-merge (no CODEOWNERS patterns to match).
#
# WHY THIS BRANCH GETS ITS OWN FIXTURE. classify_touches() reads CODEOWNERS at runtime. If
# CODEOWNERS is unreadable, the function cannot determine ownership for non-❌ paths — they
# default to machine-merge. The ❌ set (`.github/`, `.agents/`, `devbox.json|lock`, `scripts/`)
# is hardcoded in classify_touches() and works regardless of CODEOWNERS readability.
#
# THE TWO CASES:
#   #1002 homelab, `argocd/resources/loki/` — a plainly UNGOVERNED footprint, DISPATCHED.
#        With CODEOWNERS unreadable, non-❌ paths default to machine-merge. This is correct:
#        the ❌ set is the only dispatch-time gate; CODEOWNERS is merge-time enforcement.
#   #1005 homelab, `devbox.json` — a ❌ path, HELD. The ❌ set is hardcoded and works regardless.
#
# `CLASSIFY_CODEOWNERS` is pointed at a path that does not exist, via the env override.
name: scan-governance-set-unreadable
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:operator-lane-set
  - file:cases.sh
  - block:operator-lane-hold
  - file:post.sh
env:
  - CLASSIFY_CODEOWNERS=/no/such/CODEOWNERS