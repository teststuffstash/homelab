# homelab#1151 — the pre-dispatch OPERATOR-LANE intersection via classify_touches().
#
# WHAT IT PINS. `classify_touches()` in agents/footprint.sh is the ONE machine-readable home for
# the platform lane path tables. It returns `codeowner-author` for the ❌ operator-author set
# (paths that take effect BEFORE a human approves: `.github/`, `.agents/`, `devbox.json|lock`,
# `scripts/`). A queued issue whose declared `Touches:` footprint lands on any of these paths is
# undeliverable by any worker PR — the required `ci` check is structurally red before the worker
# writes a line, and the documented route is an operator push to master.
#
# THE NINE CASES, and what each one exists to stop a later edit from breaking:
#   #993  `agents/coordinator-scan.sh, agents/replay/` → DISPATCHED. This very issue. `agents/`
#         is codeowner-merge (agent may author, human merges), not codeowner-author.
#   #1000 `.github/workflows/ci.yaml` → HELD. The canonical ❌ path: CI workflows run from the
#         PR branch, so a worker edit here is structurally red.
#   #1001 `scripts/governance-lint.sh` → HELD. scripts/ is in the ❌ set.
#   #1002 `argocd/resources/loki/` → DISPATCHED. The main lane is untouched by this check.
#   #1003 `*` → DISPATCHED. The no-`Touches:` sentinel normalizes to empty and is dropped.
#   #1004 `policy/` → DISPATCHED. policy/ is codeowner-merge (agent may author), NOT in the ❌ set.
#         The old governance check (homelab#993) held this; classify_touches() correctly allows it.
#   #1005 `devbox.json` → HELD. devbox.json is in the ❌ set.
#   #1006 `CODEOWNERS` → DISPATCHED. CODEOWNERS is codeowner-merge (agent may author), NOT in the
#         ❌ set. The old governance check held this; classify_touches() correctly allows it.
#   #1007 `.agents/fix.yaml` → HELD. `.agents/` is in the ❌ set.
#   #1008 oracle-fleet, `scripts/` → DISPATCHED. The ❌ set is THIS repo's CI's. A stack repo
#         that happens to own a same-named path is not touching this repo's file.
#
# NO LABEL WRITE IS ASSERTED FOR FREE: the action stream carries no `gh` call at all. This clause
# is a router, not a gate — `agent/blocked` is a human gate, and an operator-lane overlap may be
# only part of an issue's scope. A future edit that "helpfully" parks the issue shows up here as a
# new call.
#
# classify_touches() reads CODEOWNERS at runtime (parsed, never restated). The fixture uses the
# real CODEOWNERS in the checkout — a fixture holding a second copy would defeat the change.
name: scan-governance-pre-dispatch
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:operator-lane-set
  - file:cases.sh
  - block:operator-lane-hold
  - file:post.sh