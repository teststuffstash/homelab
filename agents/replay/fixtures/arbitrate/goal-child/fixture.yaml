# arbitrate goal-child — the harvest-disposition block with an arbitrate clause and a PR that
# fixes a goal child issue. Asserts the unit carries `harvest=store` (homelab#1381).
#
# The PR (#234) carries `Fixes #35` in its body; #35 is a goal child of #29 (task/goal, Budget: 12,
# state OPEN). The block resolves the goal ancestor, finds/creates the post-launch bucket, and
# emits `harvest=store` — the same path merged-closeout uses.
name: arbitrate-goal-child
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:harvest-disposition
  - file:post.sh
# The block's bucket body is composed by `agents/issue_body.py` (homelab#1460 leg 4) and the goal
# walk reads `Budget:` through it too — declared, per the hermeticity contract (cleanup move 6).
requires:
  - python3
scrub:
  # The body no longer rides the CALL line (`--body-file` since homelab#1460 leg 4). Only the
  # directory half of `$TMPDIR` is scrubbed; the filename carries the repo and goal and stays asserted.
  - s|--body-file [^ ]*/post-launch-bucket-|--body-file <tmp>/post-launch-bucket-|
  # The bucket's `deferred by=bucket` disposition row (ADR-122 (4)) carries a wall-clock stamp —
  # the STATE is the contract, the instant is not.
  - s|\(-f body=<!-- epic-dispositions v1 -->..#[0-9]* deferred \)[0-9T:Z-]*\( by=bucket\)|\1<ts>\2|
env:
  - IN_ORG=teststuffstash
  - IN_REPO=circles
  - IN_CLAUSE=arbitrate
  - IN_ITEM=pr-234
  - IN_WMODEL=claude/haiku
  - IN_CAP=2.0000