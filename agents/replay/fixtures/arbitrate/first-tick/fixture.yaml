# The harness's worked example of the declarative mode: recorded world in, expected actions out.
#
# CONDITION UNDER REPLAY. oracle-fleet PR #234 carries `agent/arbitrate` and the thread has never
# been dispatched against — prose only, no `state-fp:` marker. The contract is that this FIRST tick
# emits the unit: the #198 debounce holds a clause back only on state it has already ridden, and a
# debounce that fires on tick 1 is a permanent off switch that nothing else would notice.
#
# PR #235 is in the recorded `pr list` too, labelled `agent/arbitrate` AND `agent/error`. The
# FU-069 breaker must drop it before the clause ever probes it, so it appears in the action stream
# NOWHERE — no `CALL gh pr view 235`, no unit. Verified by dropping the exclusion from the scan and
# watching this fixture red with exactly those two lines added. (It is deliberately given no world
# recording, but note that is not what catches it: the clause's own fail-open swallows the stub's
# death, so the assertion that bites is the extra CALL in the stream, not a loud stub.)
#
# WHY THIS ROW AND NOT THE WHOLE TABLE. The stability/movement rows of the fingerprint are pinned by
# the state-fp suite and depend on the hash value; duplicating them here would give the same
# invariant two homes that drift apart. This fixture pins the seam the SUITE cannot: the exact
# `gh` call the clause makes against a recorded world, and the exact action stream it emits.
pins:
  - MP-T11
name: arbitrate-first-tick
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:blocked-on-jq
  - block:blocked-on-check
  - block:state-fp-jq
  - block:state-fp-pair
  - file:bridge.sh
  - block:arbitrate-gate
  - file:post.sh
env:
  - IN_SLUG=teststuffstash/oracle-fleet
  - IN_REPO=oracle-fleet
