# The same clause against a DEGRADED world: the state probe cannot be read at all (403/404/network
# — $STUB_GH=fail, the stub's failure-mode knob).
#
# CONTRACT. An unreadable probe must behave exactly as the pre-#198 clause did: EMIT. The guard is
# worth less than the loop it guards (FU-104), so every unknown resolves to "ride". Concretely that
# rests on the `[ -n "$afp_cur" ]` half of the debounce condition — without it an unreadable probe
# gives cur == prev == "" and the clause debounces FOREVER, on every PR, silently.
#
# The expected stream here is byte-identical to arbitrate-first-tick's, and that is the assertion,
# not a copy-paste: a broken probe must be indistinguishable from a fresh one at the action level.
# Verified by deleting the `-n` guard from the scan and watching this fixture red (the unit
# disappears) while arbitrate-first-tick stays green — which is why the degraded world needs its
# own fixture rather than one more row on the healthy one.
#
# `parts` reaches its bridge/observation files sideways rather than copying them: they name SCAN
# variables, and two copies of that mapping is two things to keep true.
pins:
  - MP-T11
name: arbitrate-probe-unreadable
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:blocked-on-jq
  - block:blocked-on-check
  - block:state-fp-jq
  - block:state-fp-pair
  - file:../first-tick/bridge.sh
  - block:arbitrate-gate
  - file:../first-tick/post.sh
env:
  - IN_SLUG=teststuffstash/oracle-fleet
  - IN_REPO=oracle-fleet
  - STUB_GH=fail
