# ADR-102 / homelab#208 — fixture (e): the ABANDONED terminal, the one that does NOT close the
# tree.
#
# CONDITION UNDER REPLAY. The same post-launch tree as fixtures (b) and (c) — bucket #77, sprout
# #95 still `agent/queued` — but the budget runs out before any verdict and a human applies
# `goal/abandoned`. Three legs, three dispositions of one identical tree, and the whole point of
# holding the world constant across them is that the difference has to show up in the CALL stream:
#   (b) reverted  → descendants CLOSED, goal closed `completed`
#   (c) validated → descendants UNTOUCHED, goal closed `completed`
#   (e) abandoned → descendants DE-QUEUED but left OPEN, goal closed `not planned`
#
# The contract here:
#   1. #95 loses `agent/queued` and gets an audit comment; it is NOT closed. The work may still be
#      worth doing — what must stop is spending a budget that is gone. A queued descendant of a
#      dead goal draws a coordinator ride every tick only to be refused by the launcher pre-flight,
#      which is the goal-174 shape one level down.
#   2. #77 (the bucket) carries no `agent/queued`, so it draws NO call at all — compare-then-write,
#      not write-and-hope. An unconditional de-label would show up here as a second edit.
#   3. the goal closes `--reason "not planned"`, which is the one place the abandoned/refuted
#      distinction survives a year: fixture (b) closes the same goal `completed`.
pins:
  - IL-T21
  - IL-T22
name: goal-abandoned
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:goal-lane
  - file:post.sh
env:
  - IN_SLUG=teststuffstash/circles
  - IN_REPO=circles
scrub:
  - s|--body 🤖 de-queued: goal .*|--body <de-queue audit comment — see agents/coordinator-scan.sh>|
  - s|--comment 🤖 goal terminal: \*\*ABANDONED\*\*.*|--comment <goal terminal comment — see agents/coordinator-scan.sh>|
