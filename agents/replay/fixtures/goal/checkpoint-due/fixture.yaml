# goal-checkpoint-due (ADR-106 (3)) — the POSITIVE checkpoint trigger: the goal's findings
# store holds 6 entries with dispositioned-through: 1 (5 undispositioned = GOAL_CHECKPOINT_N),
# so the demoted goal lane emits ONE `goal-checkpoint` unit — the reasoning tier fires only
# where work is CREATED. The burn-down line already matches live state, so compare-then-write
# writes NOTHING (the debounce is the comparison; a PATCH would not move createdAt anyway).
# World is the goal-nonassembly-merge-inert tree (1 open / 2 closed of 3 descendants — child-set
# NOT complete, so trigger (b) stays quiet and what fires is attributably trigger (a) alone).
name: goal-checkpoint-due
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:goal-lane
  - file:post.sh
env:
  - IN_SLUG=teststuffstash/circles
  - IN_REPO=circles
