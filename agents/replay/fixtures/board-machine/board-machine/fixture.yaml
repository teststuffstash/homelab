# homelab#892 — the board.sh --machine mode golden pinning.
#
# Suite mode: extends agents/board-test.sh with a --machine arm. The fixture provides
# a recorded Prometheus world (via REPLAY_WORLD/stubs) and expected key=value line grammar.
# Uses the declared seam PROMETHEUS_URL="${PROMETHEUS_URL:-http://stub}" for Prometheus mocking.
name: board-machine
mode: suite
source: agents/board.sh
# Its composition reaches `agents/issue_body.py` — the ONE body parser is Python (ADR-113),
# so the interpreter is DECLARED rather than discovered as a mystery red (homelab#1460 leg 6;
# the hermeticity contract, agents/replay/README.md cleanup-contract move 6).
requires:
  - python3
entrypoint: agents/board-test.sh