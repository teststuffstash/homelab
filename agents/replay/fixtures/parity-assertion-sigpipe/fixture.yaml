# homelab#1547 — parity assertion head pipe SIGPIPE guard.
#
# WHY THIS FIXTURE EXISTS. The parity assertion block in coordinator-scan.sh reads
# `.github/workflows/ci.yaml` to extract the ratchet regex from lines matching
# `grep -E.*agents/`. Under `set -euo pipefail`, `head -1` can close its read end before
# `sed`/`grep` finish writing, causing SIGPIPE (exit 141) and aborting the scan before
# any dispatch clause runs.
#
# The fix adds `|| true` after `head -1` so the pipe is guarded against SIGPIPE, matching
# the pattern already used elsewhere in this file for identical reads.
#
# WHY A SYNTHETIC WORLD. The real `.github/workflows/ci.yaml` has only 2 matching lines,
# so the pipe race is a coin flip — `sed` usually finishes writing before `head -1` closes.
# This fixture uses a synthetic world with 500 matching lines so the race is a certainty:
# `grep`/`sed` cannot finish writing before `head -1` reads the first line and closes,
# producing exit 141 against the pre-fix source and exit 0 with the guard.
#
# bridge.sh overrides REPLAY_ROOT="$REPLAY_WORLD" so the parity assertion block reads
# from the synthetic world instead of the real repo root.
#
# THE CONTRACT:
#   1. REPLAY_ROOT is set to REPLAY_WORLD (by bridge.sh) pointing at the synthetic world.
#   2. clause_files contains the canonical clause file list.
#   3. The parity assertion block runs without crashing (exit 0, not 141).
#   4. PARITY_ISSUES is set (the synthetic ci.yaml has 500 matching lines, the regex
#      extracts the first, and the find loop checks clause_files parity).
name: parity-assertion-sigpipe
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:config-defaults
  - file:bridge.sh
  - block:parity-assertion
  - file:post.sh
