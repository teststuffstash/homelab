# homelab#226, the other half of the pair — the gate has NOT resolved, so there is nothing to
# announce. `unblocked-unlabeled-surfaces` is the fires-case; this is the same clause refusing.
#
# Why a pair and not one fixture with a comment: the emission direction alone would stay green if
# the blocked-by test were deleted outright, and "the report says the gate cleared" is a line a
# human ACTS on. A false 🔓 sends someone to triage an issue that is still correctly parked, and
# after the third one nobody reads the class at all — which is how the 2026-08-09 miss happened in
# the first place, one report-only log section over.
#
#   #90 jail-authored, unlabelled, >24h, blockers = one CLOSED + one OPEN → NOTHING.
#       ALL, not ANY. A partially-resolved gate is a gate. This row is why the predicate counts
#       non-closed nodes instead of testing `.nodes[0].state`.
#   #91 bot-authored, unlabelled, >24h, single OPEN blocker → the ordinary 🌱 row, unchanged.
#       The issue is not lost while it waits — it is reported as what it is. The promotion in the
#       fires-fixture removes a row from this list; that removal must be the ONLY difference.
name: unblocked-unlabeled-blocker-open
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:sprout-report
  - file:post.sh
env:
  - IN_SLUG=teststuffstash/oracle-fleet
  - IN_REPO=oracle-fleet
