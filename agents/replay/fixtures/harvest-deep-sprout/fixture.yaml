# ADR-102 / homelab#207 — the DEPTH pin. A live-recorded tree, not a constructed one.
#
# WHY THIS EXISTS. The ancestry walk needs a hop bound, and the first cut used 4 on the strength of
# the reviewer's depth-≥2 Follow-ups bar — chains "should" stop at three. Then the #207 acceptance
# dry-run ran the block against the real circles#29 tree and found this:
#
#     #75 (sprout) → #47 (sprout) → #18 (goal child) → #29 (task/goal)
#
# Four issues inspected, i.e. the entire budget, on a tree that exists today. ADR-102's other
# motivating case, oracle-fleet goal-174, grew THREE generations post-close. A bound a live tree
# already touches is a bound that silently drops the deepest sprouts back onto the master lane —
# which is the loss this whole clause exists to stop — so it went to 6.
#
# BE PRECISE ABOUT WHAT THIS FIXTURE PROVES, because a check nobody has watched fail is not a
# check. It was run against bounds 5, 4 and 3: green, green, RED. So it pins `≥ 4` — the depth the
# live tree needs — and NOT the 6 the clause ships with. The two extra hops are deliberate headroom
# for the generation goal-174 already grew and this recording does not contain; nothing here
# defends them, and a future editor lowering 6 to 4 will get a green run. If that headroom ever
# becomes load-bearing, the honest move is to record a deeper tree, not to lean on this comment.
#
# THE WORLD IS RECORDED FROM LIVE circles STATE (2026-08-09) — the ancestry edges, the labels, the
# goal's CLOSED state and its ten sub-issues are all real, which is what makes the depth claim
# evidence rather than a hypothesis. Two deliberate edits: issue bodies are elided (since
# homelab#367 the walk DOES read each one — `--json labels,body`, testing for a `Budget:` line
# beside the `task/goal` label — but none of these four carries one, and the goal is CLOSED so the
# budget arithmetic short-circuits before its own body read), and the `gh issue create` response is
# SYNTHESISED as #999, because
# circles#29 has no post-launch bucket yet. That synthesis is the whole point of the dry-run: these
# four parked sprouts (#46, #67, #75, #76) are precisely the ones ADR-102 says should have been
# living in a bucket, and this stream is what putting them there looks like.
#
# The verdict is `harvest=inert` (was `selfqueue=no` pre-ADR-106) — goal #29 is closed, so its sprouts get a home but no queue
# labels. Fixture harvest-goal-closed pins that rule on a constructed world; this one shows it
# ruling correctly on the real thing.
name: harvest-deep-sprout
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:harvest-disposition
  - file:post.sh
env:
  - IN_ORG=teststuffstash
  - IN_REPO=circles
  - IN_CLAUSE=merged-closeout
  - IN_ITEM=issue-75
  - IN_WMODEL=claude/haiku
  - IN_CAP=2.0000
scrub:
  - s|--body Post-launch bucket for goal #29 .*|--body <bucket body — see agents/coordinator-scan.sh>|
