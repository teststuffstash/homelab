# homelab#937 — FU-042 leg (b) WIP cap: a wedged (Unschedulable) Pending pod does NOT hold a
# WIP slot, while a booting Pending pod still does (the #55 counter-constraint). A 30-second
# grace period prevents a briefly-unschedulable new pod from being discounted instantly.
#
# CONDITION UNDER REPLAY. The launcher pre-flight counts live agent pods per project and refuses
# dispatch when the count reaches the WIP limit. The old predicate counted every non-terminal
# pod (Pending + Running), which was correct for booting pods (#55) but wrong for wedged pods
# that will never run (#778 finding #5, #919).
#
# THE CONTRACT (one world, one arm):
#   World: one Running pod + one Unknown pod + one Pending Unschedulable old pod (created >30s ago)
#          + one phase-absent pod (no .status.phase set — #998).
#   With WIP=3, the count of 3 (Running + Unknown + phase-absent counted, wedged excluded) equals
#   the WIP limit — the fixture asserts that the Unschedulable pod is discounted, the Unknown pod
#   is counted, the phase-absent pod is default-counted (parity with pre-#995 field-selector), and
#   the pre-flight refuses (3 ≥ 3), demonstrating the phase-absent pod is no longer silently dropped.
name: fu042-wip-cap
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:fu042-wip-cap