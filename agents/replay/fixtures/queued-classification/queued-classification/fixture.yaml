# homelab#913 — queued issue classification under set -u (non-extraction fixture)
#
# CONDITION UNDER REPLAY. The queued-issue classification logic was previously untested
# because it sits outside the extracted REPLAY regions (between pr-cap-per-base and goal-lane
# markers), embedded in the queued-dispatch loop's processing. The issue at r7 was that the
# test referenced an undefined variable ($qblockers instead of $qdeps), causing the scan to
# exit under set -euo pipefail on the first queued issue.
#
# FIXTURE TYPE: This is a direct test (not an extracted-block replay). It re-implements the
# classification logic with controlled inputs to verify that the logic correctly distinguishes
# queued-ready (no blockers) from queued-held (has blockers) and calls item_class_push with
# the correct classification. This verifies the logic under `set -u` without depending on
# loop context variables.
#
# THE CONTRACT:
#   1. Queued issues are classified based on blocker status (qdeps variable)
#   2. Empty qdeps (or "-" normalized to empty) → queued-ready classification
#   3. Non-empty qdeps → queued-held classification
#   4. item_class_push() is called with the correct classification
#   5. The logic runs under set -u and does not reference undefined variables
#
name: queued-classification
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
env:
  - AGENT_PUSHGATEWAY_URL=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_PGW=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_POD=coordinate-homelab-1
  - SCAN_PHASE_NS=homelab-agents
