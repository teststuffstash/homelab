# homelab#913 — queued issue classification: ready (no blockers)
#
# CONDITION UNDER REPLAY. The queued-issue classification block was previously untested
# (sat outside REPLAY sentinels) and contained an undefined variable reference ($qblockers)
# that would crash the scan under set -euo pipefail. Round 6 fixed the variable name to $qdeps.
# This fixture extracts and pins that block, proving it classifies an issue with no blockers
# (normalized qdeps="") as queued-ready.
#
# THE CONTRACT:
#   1. When qdeps is empty (normalized from "-" placeholder), qclass_item is set to "queued-ready"
#   2. item_class_push is called with the queued-ready classification
#   3. The logic runs under set -u and completes without crashing on undefined variables
#
pins:
  - homelab#913
name: queued-classification-ready
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:queued-classification
  - file:post.sh
env:
  - AGENT_PUSHGATEWAY_URL=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_PGW=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_POD=coordinate-homelab-1
  - SCAN_PHASE_NS=homelab-agents
