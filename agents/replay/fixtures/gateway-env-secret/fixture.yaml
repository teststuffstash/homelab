# gateway-env-secret — FU-270: the pod's LLM env slot (`${LLM_ENV}` in the pod manifest).
#
# THE CONTRACT. Knob OFF → LLM_ENV is exactly today's two goose lines (GOOSE_PROVIDER=openrouter,
# GOOSE_MODEL=<model>) and nothing is created — the manifest is unchanged byte-for-byte. Knob ON
# (a /sessions dispatch) → the gateway's `env` (GW-SESSIONS-ENV) goes VERBATIM into ONE per-ride
# Secret `<pod>-gateway-env` (kubectl create from STDIN — the token never rides argv), and LLM_ENV
# is one secretKeyRef per key, so the manifest holds NO literal token (GW-SESSIONS-TOKEN: the token
# is a credential). The pod carries a `homelab.teststuff.net/gateway-session` label. A Secret the
# API refuses → FAIL CLOSED with the router-defer exit (exit 1), no pod.
