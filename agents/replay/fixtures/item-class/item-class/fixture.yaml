# homelab#892 — the EMITTER half of the attention layer v1.
#
# CONDITION UNDER REPLAY. The item_class_push and item_class_flush functions implement
# batched pushgateway updates for `agent_item_class` and `agent_item_class_since_timestamp_seconds`
# series (job `agent_board`, grouped per namespace).
#
# THE CONTRACT (as restructured per #913):
#   1. item_class_push accumulates rows in ITEM_CLASS_ROWS; item_class_flush does ONE curl POST
#      per (tick, namespace) to the NAMESPACE-keyed group (`…/job/agent_board/namespace/…`),
#      replacing all series of these metrics in that group.
#   2. `agent_item_class` is a gauge set to 1.
#   3. `agent_item_class_since_timestamp_seconds` is a gauge set to the FIRST-transition epoch
#      (preserved from prior ticks if the item remains in the same class; re-stamped on entry).
#   4. Every degenerate path (no gateway, no pod identity) returns 0 silently.
name: item-class
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:unit-lane
  - block:item-class
  - file:bridge.sh
env:
  - AGENT_PUSHGATEWAY_URL=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_PGW=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_POD=coordinate-homelab-1
  - SCAN_PHASE_NS=homelab-agents