# homelab#244 — leg C: an IN-FLIGHT alert-lane issue stays out of the pending set, so a ride in
# progress is never re-queued underneath itself.
#
# CONDITION UNDER REPLAY. `fix-debounce-blocked-inert`'s world with exactly one label changed —
# homelab#237 carries `agent/in-progress` instead of `agent/blocked` (its body line says which,
# nothing else moves). One label delta per leg is this family's pattern, and here it is the whole
# argument: #238 fixed the HUMAN-WAITING pair and left the in-flight pair with the identical hole,
# because every lifecycle label is applied by REMOVING `agent/queued`. Dispatch does
# `--add-label agent/in-progress --remove-label agent/queued`, so the ride's own first act put the
# issue back in scope. Live on #238's OWN timeline: dispatch 08:08:14Z, `agent/queued` back on at
# 08:17:21Z — nine minutes into the ride. Only the launcher's pre-flight (open-PR / running-pod
# refusal) and the pod-name idempotency key kept that from becoming a second concurrent worker,
# which is belts doing a guard's job.
#
# THE CONTRACT:
#   1. #237 (`agent/in-progress`) draws NO write. Not a label, not a comment, not a doorbell. A
#      ride in flight owns its issue; the debouncer's job ended when it queued it the first time.
#   2. The predicate is a NAMESPACE test (`any(startswith("agent/"))`), so this leg stands for
#      `agent/review` and `agent/done` too — they are the same line of code, not sibling
#      fixtures. What no `agent/*` leg can witness is the test's LOWER bound (that `agent-fix`,
#      dash not slash, survives it); leg B is that witness, and the two are only meaningful read
#      as a set.
#   3. #229 (`agent/error`) and #226 (self-referential) behave exactly as in leg A — the world is
#      otherwise identical, so any drift here is the label delta and nothing else. #226 is again
#      the WITNESS that the list read was served at all: an unrecorded read would be swallowed by
#      the query's `2>/dev/null … || true` and leave an empty pending set that looks just like a
#      pass. Only a served read can print the SELFREF line.
#   4. Pending set 0 → `nothing to decide`, exit 0, before the gates block is reached. Under the
#      old enumerated predicate N would be 1, the fast path would run, and a
#      `labels[]=agent/queued` POST plus a `/coordinate` bell would appear in the stream — which
#      is precisely the live defect, and why the gates block is composed into this leg unreached.
