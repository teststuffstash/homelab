# ADR-102 / homelab#207 — fixture (a): GOAL OPEN, BUDGET REMAINS → the sprout lands in the
# post-launch bucket and MAY self-queue.
#
# CONDITION UNDER REPLAY. circles #35 is a merged goal child whose closeout is the dispatched unit.
# The goal (#29) is OPEN, carries `Budget: 12`, and has NO post-launch bucket yet. The contract is
# three-part and each part has cost real money or real triage before:
#   1. the ancestry walk finds #29 from #35 (one hop, native sub-issue edge),
#   2. the bucket is CREATED and LINKED under the goal — created here rather than at assembly
#      merge because deliverable 2 files open-goal sprouts into it, so the container must exist
#      while the goal is still pre-launch,
#   3. the SAME arithmetic the launcher pre-flight enforces with (agents/goal-budget.sh, sourced
#      by the bridge, not transcribed) rules `within` — Σ $1.75 of $12 — so `harvest=store` (was `selfqueue=yes` — the queue right moved to the checkpoint, ADR-106 (3)) rides
#      the `--item` string to the coordinator play.
#
# WHAT IT PINS THAT PROSE DID NOT. The old rule queued a sprout whenever the ORIGINATING issue
# carried `Base: goal/**` — a body line that survives its goal by construction. #35's recorded body
# still carries exactly that line, and the fixture asserts the decision is now made from the GOAL's
# live state instead: fixtures (b) and (c) hold this same `Base:` line and both come out inert.
#
# THE LINK IS LOAD-BEARING, NOT DECORATION. `api ... /sub_issues -F sub_issue_id=9900077` is in the
# stream because an UNPARENTED bucket puts its children outside the goal's descendant walk — they
# would then spend budget the gate cannot see, which is the goal-174 failure one level down.
pins:
  - IL-T15
  - IL-T17
name: harvest-goal-open-funded
mode: actions
world: circles-29-tree
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:harvest-disposition
  - file:post.sh
env:
  - IN_ORG=teststuffstash
  - IN_REPO=circles
  - IN_CLAUSE=merged-closeout
  - IN_ITEM=issue-35
  - IN_WMODEL=claude/haiku
  - IN_CAP=2.0000
scrub:
  # The bucket body is prose the block owns; pin its provenance sentence, not its paragraphs.
  - s|--body Post-launch bucket for goal #29 .*|--body <bucket body — see agents/coordinator-scan.sh>|
