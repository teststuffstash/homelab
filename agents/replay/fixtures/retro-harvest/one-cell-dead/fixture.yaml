# homelab#248 — the PARTIAL harvest: one cell delivered, one died, and the PR says so.
#
# CONDITION UNDER REPLAY. Run 3 exactly (kpg42, 2026-08-11): cell-a's opus report in log-a, cell-b's
# 8-second provider death in log-b. This is the run that shipped — PR#246, one report, and nothing
# in it recorded that half the run was missing. The retro is a CROSS-CHECKED pair by design (two
# cells off the same brief); a reader who does not know they are holding one cell's view will
# read a single model's unchecked opinion as the pair's agreement.
#
# THE CONTRACT:
#   1. The surviving report still lands, under its OWN cell's slug. A dead sibling does not cost
#      the good cell its report — the `continueOn: failed:true` this pairs with exists for exactly
#      that, and one `cp` in the stream (not zero, not two) is the assertion.
#   2. The dead cell is NAMED in the WARN — `$src` alone was the old text, and a path called
#      /work/log-b does not tell an operator which model died. homelab#590: the WARN also carries
#      the floor helper's own reason (`— no-markers (log mode — a marker-less log is never floor-checked as a report, PR#620 r1)` here) — this log has
#      no markers at all, so agents/retro-report-floor.sh falls back to floor-checking it as-is,
#      the same fallback the `--review` gate uses on an already-extracted report.
#   3. `DEAD_NOTE` carries into the PR body. It is rendered by PREDICATE (post.sh), not diffed
#      verbatim: it is prose that will legitimately be reworded, and a fixture that pinned it
#      byte-for-byte would red on every copy-edit. What must not move is that the note EXISTS when
#      a cell died, names it, and says the report is one cell's view — the responder-fixture
#      SELF_NOTE pattern (agents/replay/README.md §When the clause lives inside a manifest).
#   4. RC 0. A partial harvest is a SUCCESSFUL harvest: it has something to commit. The cell that
#      died already failed its own step; making the harvest fail too would throw away the report
#      it just extracted, which is the trade this whole change exists to avoid.
#
# Its sibling `retro-harvest-slug` is the both-cells-delivered case (and pins the slug parse);
# `retro-cell-report-missing` is the same dead ride seen from the cell's own side.
name: retro-harvest-one-cell-dead
mode: actions
source: agents/coordinator/retro-argo.yaml
parts:
  - file:bridge.sh
  - block:retro-harvest-slug
  - file:post.sh
