# homelab#292 — two cells on the SAME harness AND the SAME model must not resolve to one
# filename either. Pass 2 (homelab#269) disambiguates a HARNESS A/B on one model by joining the
# harness onto the slug; it does nothing for a pure A/B repeat of one cell, because joining the
# SAME harness onto both legs leaves them equal — "claude:opus" vs "claude:opus" both become
# "claude-opus", still collided, and the second `cp` silently overwrote the first exactly as the
# pre-#269 bug did, one layer deeper.
#
# CONDITION UNDER REPLAY. `claude:opus` on both legs, both cells delivering a report. This is the
# only configuration that reaches pass 3: pass 1 collides (both slugs "opus"), pass 2's harness
# join collides AGAIN (both "claude-opus", since the harness is identical too) — sibling
# `retro-harvest-slug-collision` stops one pass earlier because its harnesses differ.
#
# THE CONTRACT:
#   1. Both reports land, under DISTINCT paths — `…-r3-claude-opus-a.md` and
#      `…-r3-claude-opus-b.md`. Two `cp` lines to two different destinations is the whole
#      assertion; one line, or two lines naming the same file, is the bug.
#   2. The disambiguation is CELL INDEX (leg A vs leg B), applied ON THE STILL-COLLIDED CASE
#      ONLY: pass 1 and pass 2 are unconditional passes that already ran (and, per the sibling
#      fixtures, did not resolve this case) — pass 3 fires only when pass 2's own output is still
#      equal. The ordinary path (`retro-harvest-slug`) and the harness-collision path
#      (`retro-harvest-slug-collision`) are untouched — their `expected/` stays byte-identical.
#   3. The harvest SUCCEEDS (RC 0), same reasoning as the harness-collision guard: refusing the
#      harvest on a duplicate slug throws away both good reports of a run that worked, and a
#      landed report is this lane's only success signal (`retro_report_last_success_timestamp`).
#   4. `DEAD_NOTE` stays empty. Both cells delivered, so the partial-run warning must not appear.
#
# EXPECTED NAMES, derived from the code (not restated from a fixture): pass 1 gives SLUG_A=SLUG_B
# ="opus" (both `${CELL#*:}` → "opus", already alnum/.-only). SLUG_A=SLUG_B triggers pass 2:
# HARNESS_A=HARNESS_B="claude" (`${CELL%%:*}`), giving SLUG_A=SLUG_B="claude-opus" — STILL equal,
# so pass 3 triggers: SLUG_A="claude-opus-a", SLUG_B="claude-opus-b". Filenames are
# "${DATE}-${STACK}-${RUN}-${model}.md" = "2026-08-11-oracle-r3-claude-opus-a.md" (leg A, first
# `cp`) and "2026-08-11-oracle-r3-claude-opus-b.md" (leg B, second `cp`), matching expected/
# below.
#
# The pairing is asserted by ORDER, as in the siblings: leg A is harvested first, so its filename
# is the first `cp` in the stream.
name: retro-harvest-slug-collision-identical
mode: actions
source: agents/coordinator/retro-argo.yaml
parts:
  - file:bridge.sh
  - block:retro-harvest-slug
  - file:post.sh
