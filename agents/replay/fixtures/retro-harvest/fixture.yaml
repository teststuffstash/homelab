# retro-harvest — THE FAMILY, as one decision table (FU-167 cleanup move 2; stint #661 batch 4;
# was five copied dirs: cell-errored, one-cell-dead, slug, slug-collision, slug-collision-identical).
#
# THE CONTRACT (consolidated from the five fixture essays; the per-row intent is the rows file):
# retro-argo.yaml's harvest step extracts each cell's report through agents/retro-report-floor.sh
# (homelab#590's content floor) and derives its filename from the workflow's OWN dispatch
# parameters — never sniffed off the report's own prose heading (homelab#248) — through a
# THREE-PASS collision guard: bare model (`${CELL#*:}` → `${CELL##*/}`), then harness-joined on a
# same-model collision (homelab#269), then cell-index-suffixed on a same-harness-AND-model repeat
# (homelab#292). A cell that produced no usable report (the floor rejects a markerless log, or the
# pod never wrote a log at all) does not cost its sibling the harvest — the surviving report still
# lands under its own slug, RC stays 0, and a `DEAD_NOTE` names the missing cell in the PR body
# without ever appearing when both cells deliver (homelab#248/#268/#590).
#
# Rows: `slug` (both deliver — the r1/r2 filename convention, and the collision guard's
# regression proof) · `slug-collision` (one model, two harnesses → harness-joined names,
# homelab#269) · `slug-collision-identical` (one model, one harness repeated → cell-index-suffixed
# names, homelab#292) · `one-cell-dead` (cell-b's pod produced a markerless transcript — floor
# reason `no-markers`, homelab#248) · `cell-errored` (cell-b's pod never wrote a log at all — floor
# reason `empty`, homelab#268's OTHER door into the silent loss #248 closed, and the ONLY row
# whose bridge also reads the `continueOn` DECLARATION out of the shipped manifest: Argo's own
# field, no shell clause reads it, never transcribed — README §When the clause lives inside a
# manifest).
#
# LOGS. `logs/*` are the report bodies these rows extract from — committed once, shared by
# reference (one is genuinely shared byte-for-byte across four rows: `opus-report`, CELL_A's
# report on every row but `cell-errored`). They are read via $REPLAY_ROOT, NOT the table harness's
# per-row world materialization — see bridge.sh for why (the WARN line embeds the log's own PATH
# literally in its text, so it must be a fixed, deterministic location).
name: retro-harvest
mode: table
source: agents/coordinator/retro-argo.yaml
parts:
  - file:bridge.sh
  - block:retro-harvest-slug
  - file:post.sh
env:
  - DATE=2026-08-11
  - STACK=oracle
  - RUN=r3
  - CELL_A=claude:opus
  - CELL_B=goose:deepseek/deepseek-v4-pro
  - LOG_A_NAME=opus-report
  - LOG_B_NAME=deepseek-report
rows: rows.psv
