# ADR-103 / homelab#1108 — the ci-red rerun wake path: dispatch case, pinned.
#
# CONDITION UNDER REPLAY. A red PR (#43, branch `fix/issue-1108-ci-red-rerun-wake`) that has
# completed ONE fix round (attempts=1 < RED_MAX=3). The thread carries a previous state-fp marker
# from an earlier dispatch (startedAt=2026-08-31T07:00:00Z era, hash=b123683ec476). The CI has
# been re-run on the same head, so the checks now have DIFFERENT startedAt values
# (2026-08-31T08:00:00Z). The ci-red clause uses STATE_FP_JQ_CIRED which folds each check's
# startedAt into the fingerprint, so the current hash (d2fedb4b769b) differs from the recorded one
# (b123683ec476) — the debounce releases and the clause emits a dispatch.
#
# WHY THIS FIXTURE EXISTS. Before homelab#1108, the ci-red clause keyed its state-fp dedup on
# (head_sha, check conclusions, reviewDecision, newest verdict) — the same STATE_FP_JQ the
# arbitrate clause uses. A CI rerun on an unchanged head produces the same fingerprint, so the
# debounce held and the PR was wedged: no new round, ever, until a human pushed a commit. The fix
# adds STATE_FP_JQ_CIRED that folds each check's startedAt into the hash, so a rerun changes the
# fingerprint and re-arms the gate. This fixture pins that the ci-red-gate does NOT debounce when
# startedAt has moved.
#
# THE CONTRACT:
#   1. attempts = 1 — one new-shape stats marker.
#   2. noop_round = <none> — newest stats timestamp (06:30) is BEFORE the newest non-merge commit
#      (07:30), so the last completed round pushed something.
#   3. attempts(1) < RED_MAX(3), so the issue-keyed ceiling IS checked — `gh pr list` is called.
#      Only PR #43 references issue #1108 (via branch), so red_sib_n=1, not > red_rounds(1).
#   4. The ci-red-gate block calls pr_state_fp_pair with "ci-red". The current fingerprint
#      (d2fedb4b769b, computed with startedAt=2026-08-31T08:00:00Z) differs from the recorded
#      marker (state-fp:b123683ec476, written when startedAt was 2026-08-31T07:00:00Z), so the
#      gate does NOT debounce — no orphans line, no continue.
#   5. Three calls: `gh pr view 43` (round evidence), `gh pr list` (issue-keyed ceiling),
#      `gh pr view 43` (state-fp pair).
pins:
  - MP-T12
name: ci-red-rerun-wake-dispatch
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:blocked-on-jq
  - block:blocked-on-check
  - block:state-fp-jq
  - block:state-fp-pair
  - block:round-evidence
  - file:bridge.sh
  - block:ci-red-rounds
  - block:ci-red-gate
  - file:post.sh
env:
  - IN_SLUG=teststuffstash/circles
  - IN_REPO=circles
  - IN_PR=43