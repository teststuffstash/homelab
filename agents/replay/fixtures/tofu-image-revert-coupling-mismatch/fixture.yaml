# tofu-image-revert-coupling-mismatch — the tree read that ties the stuck Deployment to the candidate
# (#1988's class row, 2026-09-28): a changed file must DECLARE the alert's deployment name
# (`name = "<deployment>"`), read from the checkout — never inferred from the alert. The alert names a Deployment the candidate never touched → report-only, exit 0, nothing written.
name: tofu-image-revert-coupling-mismatch
mode: actions
source: agents/coordinator/deploy-revert-argo.yaml
env:
  - SLUG=teststuffstash/homelab
  - PRNUM=2037
  - NS=home-assistant
  - DEP=home-assistant
parts:
  - file:bridge.sh
  - block:tofu-image-revert-coupling
  - file:post.sh
