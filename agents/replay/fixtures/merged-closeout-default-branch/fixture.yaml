# homelab#1149 — IL-G06 revisit: the IL-G06 merged-closeout detection block's `--arg default_branch`
# and variable hoist fixes. This fixture validates the **structural fix** (the block parses, runs clean,
# and produces empty output under stub-provided empty world data), but NOT the **positive-path detection
# semantics** (the detection regex, strong-link vs bare-mention split, or dref exclusion logic).
#
# NOTE (homelab#1199): the replay stub now keys `gh pr list` world files by --state value, so
# `--state merged` and `--state open` serve DISTINCT world files. The positive-path detection
# semantics are now pinned in the sibling fixture `merged-closeout-ilg06-detect`.
#
# THE CONTRACT (structural only):
#   1. The detection block runs to completion under `set -euo pipefail` with empty world data.
#   2. No jq compile errors from undefined `$default_branch` (the --arg fix).
#   3. Detection output variables (c6db, c6db_nums) remain empty, which is correct for empty input.
#      NOT-PINNED: the `default_branch=` assignment in coordinator-scan.sh sits ABOVE the
#      `>>>REPLAY:il-g06-detect>>>` marker (grep the marker — line numbers drift), so it is
#      outside the extracted block and bridge.sh supplies the variable under replay.
#      Un-hoisting it would not red this fixture.
pins:
  - IL-T09
name: merged-closeout-default-branch
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:il-g06-detect
  - block:merged-closeout
  - file:post.sh
scrub:
  - 's/`[0-9T:Z-]\{20\}`/`TIMESTAMP`/g'
  - 's/ [0-9]\{1,\}m / Nm /g'
# hermeticity contract (homelab#329): the clause reads issue bodies through agents/issue_body.py.
requires:
  - python3
