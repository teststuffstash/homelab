# homelab#107 — registry.npmjs.org stub for non-opencode (goose/claude) rides under enforced
# egress with a non-node profile. The opencode block produces no stubs (HARNESS != opencode),
# but the registry.npmjs.org block fires because EGRESS_ENFORCE=true and EGRESS_PROFILE != node.
# The unenforced counterpart is non-opencode/ (homelab#990): same harness, EGRESS_ENFORCE unset,
# HOST_ALIASES empty — that fixture is untouched by this fix and must stay so.
#
# CONDITION UNDER REPLAY: HARNESS=goose, EGRESS_ENFORCE=true, EGRESS_PROFILE unset.
# THE CONTRACT: HOST_ALIASES is non-empty and carries only registry.npmjs.org.
name: opencode-hostaliases-enforced-non-opencode
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:opencode-hostaliases
  - file:post.sh