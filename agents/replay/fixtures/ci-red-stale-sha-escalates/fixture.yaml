# FU-1529 stale-sha escalates — positive path, pinned.
#
# CONDITION UNDER REPLAY. A red armed PR (#1515, branch fix/issue-1515-something) that has
# completed RED_ROUNDS_MAX attempts. The per-sha check-runs query on the current head returns
# a completed red check with lowercase conclusion (the ACTUAL red, not stale). The escalation
# SHOULD fire because the red is on the current head.
#
# WHY THIS FIXTURE EXISTS. Sub-defect 1's fix uses ascii_downcase to normalize the REST API's
# lowercase conclusions. This fixture covers the positive case: a real red on the current head
# with the corrected casing still escalates correctly.
#
# THE CONTRACT:
#   1. red_rounds >= RED_MAX — the exhausted-rounds case is reached.
#   2. The per-sha check-runs query for the current head returns a completed red check.
#   3. The conclusion is lowercase (REST API format).
#   4. ci_red_should_arbitrate = 1 — the escalation proceeds.
#   5. ORPHANS line is emitted: "ci-red → agent/arbitrate: PR #1515..."
#   6. gh pr edit adds the agent/arbitrate label.
