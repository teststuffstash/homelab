# coordinator-scan-large-metrics (FU-1456) — SIGPIPE on large metrics payloads.
#
# ISSUE. The metrics extraction pipeline in item_class_flush used | head -1 to select the
# first matching metric line. On busy board days with large metric payloads, the head -1
# closes stdin early while upstream grep commands still write data, causing SIGPIPE
# (exit 141) under set -o pipefail.
#
# FIX. Capture the full pipeline output to a variable, then extract the first line via
# parameter expansion (${var%%$'\n'*}) instead of early-exit consumers. This avoids SIGPIPE
# by not closing stdin prematurely.
#
# THE CONTRACT:
#   1. When metrics_before contains multiple matching lines (simulating a large busy payload),
#      the extraction correctly returns only the FIRST matching line.
#   2. The extraction completes without SIGPIPE (exit 0), even with large payloads.
#   3. The variable is empty when no lines match (graceful fallback).
name: coordinator-scan-large-metrics
mode: suite
source: agents/coordinator-scan.sh
parts:
  - block:unit-lane
  - block:item-class
  - file:bridge.sh
entrypoint: agents/replay/fixtures/coordinator-scan-large-metrics/entrypoint.sh
env:
  - AGENT_PUSHGATEWAY_URL=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_PGW=http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
  - SCAN_PHASE_POD=coordinate-homelab-1
  - SCAN_PHASE_NS=homelab-agents
