# fleet-strike-reader — FU-200: scan-side window count of AGENT_STRIKE error_class across issues.
#
# THE CONTRACT (homelab#1235, FU-200). The scan reads AGENT_STRIKE comments across all open
# agent-fix issues in a repo. When the same `error_class=` appears on ≥2 distinct issues within
# 24h, the scan:
#   1. Applies `agent/error` label to each affected issue.
#   2. Posts ONE comment on the first affected issue listing all of them.
#   3. Files ONE deduped inert platform issue (or extends an existing open match).
#
# THE #326 FOUR-STRIKE WORLD (recorded fixture). Four issues (#326, #327, #328, #329) each carry
# an AGENT_STRIKE: comment with `error_class=unknown`, all within 24h. The scan detects the
# fleet strike and applies agent/error to all four, comments on #326, and creates a new filing
# (no existing open match).
#
# Three properties are load-bearing:
#   • ANCHORED at the start of a COMMENT body, never a substring. Same discipline as
#     AGENT_INFEASIBLE: (homelab#257) and AGENT_STRIKE: (FU-199).
#   • MATCH on the structured `error_class=` field only, never log excerpts.
#   • FORWARD-COMPATIBLE with the G2 key-class split: counts strike-class rows only
#     (AGENT_STRIKE: comments), never key-class rows.
pins:
  - IL-T30
name: fleet-strike-reader
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:fleet-strike-reader
  - file:post.sh
