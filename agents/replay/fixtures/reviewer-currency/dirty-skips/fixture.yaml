# reviewer-currency-dirty-skips (2026-09-05, homelab#1422) — the CURRENCY GATE still skips a
# CONFLICTED head.
#
# WHY THIS ROW EXISTS. The gate used to refuse `BEHIND || DIRTY` and only its BEHIND arm was
# replayed (`behind-skips`). Narrowing the gate to DIRTY would have left the surviving arm pinned
# by nothing at all — an assertion deleted rather than moved. This row is that assertion, now
# standing on its own leg: a conflicted head belongs to the merge-conflict lane (MP-T06 — the
# coordinator dispatches a worker to rebase), an update-branch call cannot resolve it, and a
# reviewer spawned on it would burn a pod and a subscription semaphore slot to stand aside in
# STEP-0.
#
# CONDITION UNDER REPLAY. The combined FU-092 probe returns state=OPEN, mergeStateStatus=DIRTY.
#
# THE CONTRACT (executes the REAL currency-gate block from reviewer-session.sh via sentinel):
#   1. state=OPEN passes the state check; DIRTY fires the skip branch: ONE line naming the status
#      at spawn time, then `exit 0`.
#   2. The stream asserts BY ABSENCE that execution did not continue — post.sh is deliberately NOT
#      a part here, mirroring the old behind-skips shape: nothing follows the skip line.
#
# EXPECTED STREAM (the shipped `echo` with $PR_MERGE_STATE = DIRTY substituted):
#   CALL — gh pr view 42 --repo teststuffstash/test-project --json headRefOid,state,mergeStateStatus
#   OUT  — "→ review of teststuffstash/test-project#42 skipped — head is DIRTY at spawn time
#          (currency gate: the level-triggered path re-picks when current; was a STANDING-ASIDE
#          pod burn before)"
#   RC   — 0 (a skip is a clean no-op, not an error)
#
# Parts: bridge.sh (seams: function-shadow gh serving the DIRTY world) + block:reviewer-currency-gate
name: reviewer-currency-dirty-skips
mode: actions
pins:
  - MP-T03
source: agents/reviewer-session.sh
parts:
  - file:bridge.sh
  - block:reviewer-currency-gate
