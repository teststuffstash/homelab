# homelab#1041 — the WORKER's claude arm with the MCP knob present. Pins that the MCP prelude
# (base64 decode to /tmp/mcp-config.json, in claude's own {"mcpServers":{…}} shape) and the
# `--mcp-config /tmp/mcp-config.json` flag are emitted when the stack declares
# spec.mcp.{endpoint,tools}. The first cut set a CLAUDE_CODE_MCP_CONFIG env var instead — no such
# var exists, so the file was written and never loaded (oracle-fleet#330 r2, 2026-09-01).
#
# CONDITION UNDER REPLAY. Same as harness-run-cmd-claude, but with MCP_ENDPOINT and MCP_TOOLS
# set so the MCP attach block inside the replay region fires.
#
# THE CONTRACT:
#   1. MCP_PRELUDE contains the base64 decode command for the MCP config; the blob decodes to
#      {"mcpServers":{"stack-mcp":{"type":"http","url":<endpoint>}}} — the CLI's shape, no tools key.
#   2. The claude case carries `--mcp-config /tmp/mcp-config.json` as a CLI flag (not an env var).
#   3. The rest of the pod command is unmoved: context prelude, recipe decode, --model, --max-turns.
name: harness-run-cmd-claude-mcp
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:harness-run-cmd
  - file:post.sh