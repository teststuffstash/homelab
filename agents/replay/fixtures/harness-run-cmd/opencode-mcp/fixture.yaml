# homelab#1276 — the opencode arm with the MCP knob present. Pins that the MCP server config is
# merged into the opencode session config (OPENCODE_CONFIG) when the stack declares
# spec.mcp.{endpoint,tools}. The MCP config is delivered via the session config JSON, not a CLI
# flag — opencode reads it from the OPENCODE_CONFIG env var at /tmp/opencode-session.json.
#
# CONDITION UNDER REPLAY. Same as harness-run-cmd-opencode, but with MCP_ENDPOINT and MCP_TOOLS
# set so the MCP attach block inside the replay region fires.
#
# THE CONTRACT:
#   1. MCP_OPENCODE_CONFIG_JSON is set to the opencode-format MCP config
#      {"mcp":{"stack-mcp":{"type":"remote","url":<endpoint>}}}.
#   2. The opencode RUN_CMD is unchanged (MCP is delivered via OPENCODE_CONFIG, not the CLI).
#   3. The rest of the pod command is unmoved: prelude, recipe decode, -m, task message.
name: harness-run-cmd-opencode-mcp
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:harness-run-cmd
  - file:post.sh