# homelab#1180 → 2026-09-03 header sweep: when GH_TOKEN is set, the token rides `_ah` (a
# preemptive `http.extraHeader` Basic credential, base64 of `x-access-token:<token>`) and the
# clone URL `_cu` stays PLAIN. Token-in-URL (the #1136/#1180 idiom) still let git send two
# anonymous requests per clone before the 401 retry — the exact traffic GitHub's per-IP throttle
# counts (incidents/2026-09-02-anonymous-git-throttle-loop-outage.md §Recurrence). This fixture
# asserts both: the URL carries no token, the header carries the right one.
#
# FU-1990 part 2 (2026-09-26): the new `workflow-pin-revert` WorkflowTemplate in the same file
# reuses the same `>>>REPLAY:deploy-revert-token-clone>>>` block, so this fixture covers both
# templates (deploy-revert and workflow-pin-revert). The block is identical; only the surrounding
# workflow logic differs (different alert payload, different branch name, different PR close logic).
name: deploy-revert-token-clone-set
mode: actions
source: agents/coordinator/deploy-revert-argo.yaml
env:
  - SLUG=teststuffstash/oracle-iac
  - GH_TOKEN=ghp_fake1234567890abcdef
parts:
  - block:deploy-revert-token-clone
  - file:post.sh