# homelab#456 — the pod env card ships the opencode OPENCODE_DISABLE_AUTOUPDATE kill-switch.
#
# CONDITION UNDER REPLAY. opencode-1.18.18's SDK initialization makes runtime fetches to
# models.opencode.ai (model-registry) + registry.npmjs.org (provider SDK packages/@ai-sdk/*).
# The var OPENCODE_DISABLE_AUTOUPDATE disables the periodic auto-update check but not the SDK
# init fetches — the CNP Policy DENY is the intended backstop. The var must be set
# UNCONDITIONALLY in the always-rendered env list beside devbox/uv precedents, never gated on
# HARNESS=opencode, matching the doctrine in PR #503 §2 (kill at tool, do not widen extraFQDNs).
#
# mode: suite — the subject is a STATIC property of the launcher's pod env card, not an action
# stream: no gh/kubectl calls, nothing to record. The suite reads the var OUT of
# agents/agent-session.sh at run time (never a transcription, #166) and asserts presence, value,
# and unconditional placement in the always-on env block.
name: opencode-phonehome-killswitch
mode: suite
entrypoint: agents/replay/fixtures/opencode-phonehome-killswitch/opencode-phonehome-killswitch/suite.sh
# hermeticity contract (homelab#329): bash/awk/jq/sed are the harness base; grep is used for the
# literal line finds, so it is declared — absent grep reports cannot-run-here, not a clause red.
requires:
  - grep
