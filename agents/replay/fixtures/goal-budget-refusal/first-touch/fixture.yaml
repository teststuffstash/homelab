# homelab#361 — the CREATE half of the goal-budget refusal's one-comment-per-goal contract.
#
# CONDITION UNDER REPLAY. Goal #29 is over its `Budget:` ($1.75 > $1) and the launcher pre-flight
# has already refused. The thread has never carried a refusal: one human comment, no
# `<!-- agent-budget-refusal -->` marker anywhere.
#
# THE CONTRACT:
#   1. ONE read, then ONE create. The first refusal is the only one allowed to POST — the three
#      sibling fixtures pin what the second, third and tenth do.
#   2. The created body carries the marker. No marker, and every later refusal fails to find this
#      comment and posts another, which is the residue the issue is about. It is asserted verbatim
#      in the CALL stream, as is the human-readable `AGENT_BUDGET_REFUSED:` label line under it.
#   3. The body carries NO timestamp. A clock in it would make every scan a distinct body and turn
#      "edit in place" into an edit per scan (goal-budget-refusal-unchanged pins the other side).
#   4. The refusal still EXITS NON-ZERO after commenting — `RC 1`, and post.sh's line is absent.
#      The comment is where a human looks; the exit is what stops the dispatch. Neither replaces
#      the other.
name: goal-budget-refusal-first-touch
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-budget-refusal
  - file:post.sh
