# homelab#361 — the MIGRATION arm: the first refusal after this change lands on a goal that already
# carries a pre-marker one.
#
# CONDITION UNDER REPLAY. The live state of goal #278 on 2026-08-12, transposed onto #29: a refusal
# in the SHIPPED format (first line `AGENT_BUDGET_REFUSED: …`, no HTML marker — the old code had
# none), a goal-review comment after it, and a human comment that MENTIONS the prefix mid-line.
#
# THE CONTRACT:
#   1. The pre-marker refusal is ADOPTED, not duplicated: one PATCH of 5231000042, no POST. Skip
#      this arm and the fix opens by posting one extra comment onto every goal it was written to
#      protect — the thing it forbids, done once, in its own name.
#   2. The patched body carries the marker, so the `startswith` arm matches once per goal and the
#      ordinary marker path owns it from then on. The arm is deletable when no live goal carries a
#      pre-marker refusal; nothing else depends on it.
#   3. #5231000088 draws nothing. The prefix test is ANCHORED (`startswith`), so a comment that
#      quotes `AGENT_BUDGET_REFUSED:` while discussing the mechanism is a mention, not a marker —
#      an unanchored `contains` here would adopt a human's comment and overwrite it with a cap
#      table, which is a strictly worse bug than the one being fixed. (Anchoring is the lesson of
#      fixtures/fix-debounce-quoted-marker-inert, paid for on homelab#238.)
name: goal-budget-refusal-legacy
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-budget-refusal
  - file:post.sh
