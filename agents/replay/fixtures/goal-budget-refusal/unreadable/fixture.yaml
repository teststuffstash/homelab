# homelab#361 — the error path, which on a level-triggered refusal is where a comment-spam bug is
# most likely to be re-introduced.
#
# CONDITION UNDER REPLAY. The refusal stands, but the goal's timeline cannot be read: `STUB_GH=fail`
# — the shape a 403 (token scope), a 404 or a network failure takes at this seam.
#
# THE CONTRACT:
#   1. FAIL CLOSED. One read attempt, then NOTHING. A create here would be one new comment per scan
#      on a probe failure, which is the exact residue the fix removes, reached by the error path
#      instead of the happy one — mc_event fails closed for the same reason and says so in its own
#      header.
#   2. The launcher SAYS it went unsaid, on stderr, and does not pretend the refusal softened:
#      `RC 1`, no `REACHED:` line. A pre-flight that could not comment is still a pre-flight that
#      refused.
name: goal-budget-refusal-unreadable
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-budget-refusal
  - file:post.sh
env:
  - STUB_GH=fail
