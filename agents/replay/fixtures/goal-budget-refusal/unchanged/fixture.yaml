# homelab#361 — the steady state, which is where a level-triggered refusal spends almost all of its
# life: nothing has moved, so nothing is written.
#
# CONDITION UNDER REPLAY. Goal #29 already carries the refusal (5231000042) with the SAME numbers
# this scan computes, plus a later goal-review comment. The recorded body is generated from the
# clause's own format string, so this fixture reds the moment the body drifts from what the code
# would write — which is what makes "already current" mean identical rather than merely present.
#
# THE CONTRACT:
#   1. ONE read, ZERO writes. Not a POST (that is the shipped bug), and not a PATCH either: an
#      unconditional edit would stamp an "edited" badge and a history entry onto the comment on
#      every scan — the same noise the issue is about, moved one column over. Nothing changed, so
#      the machine says nothing.
#   2. The comparison is on the WHOLE body, not the marker. Presence-only would be option 1 of #361
#      (one comment ever, stale numbers) wearing option 3's clothes — the interleaved fixture is the
#      other half of that pair and pins the edit that must happen when the numbers DO move.
#   3. `RC 1` still. Silence about the refusal is not a softening of it.
name: goal-budget-refusal-unchanged
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-budget-refusal
  - file:post.sh
