# homelab#501 (operator ruling 2026-08-18, direction (b)) — the deterministic review-flip belt:
# an `agent-fix ∧ agent/in-progress` issue whose OPEN PR STRONGLY references it moves to
# `agent/review` here, level-triggered, so the ADR-097 footprint releases at PR-open BY DESIGN
# instead of being a coin-flip on whether a coordinator session visited the item.
#
# CONDITION UNDER REPLAY. Four in-progress issues in one world, each a different arm:
#   #60 — an OPEN PR #112 whose body is `Implements #60 / Closes #60` (the strong link) → FLIPS.
#   #61 — an OPEN PR #113 whose body merely NAMES it as a sibling seam (`(#61)` — the C6
#         strong-link grammar must NOT treat a bare mention as an implementer) → no flip.
#   #62 — referenced only by a CLOSED PR (absent from prsjson, which is the OPEN list) → no flip:
#         a merged PR cannot release today's footprint; the merged-closeout clause owns that state.
#   #63 — carries BOTH `agent/in-progress` AND `agent/blocked`, and an OPEN PR #115 that strongly
#         references it → still no flip: a human gate is never a flip candidate (the infeasible
#         terminal leaves both labels mid-write; relabelling would move a human-owned issue).
#
# THE CONTRACT:
#   1. #60 is WRITTEN in the IL-T16 order — `--add-label agent/review` FIRST, `--remove-label
#      agent/in-progress` SECOND, then a `gh issue view` RE-READ that proves the end state before
#      a single word is commented. That order is not cosmetic: `gh issue edit` is not atomic, and
#      with neither label the issue is invisible to every clause (oracle#193's lesson, IL-T16).
#   2. The audit comment names the strong-link basis and the release-at-PR-open semantic.
#   3. #61, #62 and #63 emit NO flip and NO write — a bare mention, a closed PR and a human gate
#      are all held.
#   4. `busy_fps` is deliberately NOT re-derived here: it read $inprog above the block, so the
#      CURRENT tick still holds a flipped issue's footprint; the next scan sees agent/review
#      (level-triggered). This block's job is the label, not the footprint cache.
#
# Its sibling `review-flip-belt-probe-fail` holds the rule-#6 arm: an unreadable open-PR read
# writes nothing and reports, leaving today's behaviour whole.
name: review-flip-belt
mode: actions
source: agents/coordinator-scan.sh
parts:
  - file:bridge.sh
  - block:review-flip-belt
  - file:post.sh
