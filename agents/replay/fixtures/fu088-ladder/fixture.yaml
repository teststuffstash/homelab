# Shapes live as worlds (bridge.sh's own header has the detail): worlds/worker-shape (recipe/worker,
# `--model haiku ` already in RUN_CMD) shared by anthropic/both/go; worlds/retro-run-shape (a `--run`
# string with no --model flag) for run-shape; worlds/goose-run-shape (neither shape) for
# unthreadable. `post.sh`'s RUN_CMD echo is a family part for every row — it never fires for
# both/unthreadable (the block exits first), which is exactly the absence those two rows assert.
