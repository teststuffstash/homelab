# is NOT an opencode-go/* dispatch consults the ONE ladder (`subscription-latch.sh --pick-rail`)
# instead of probing the Anthropic latch alone. Anthropic clear → proceed as dispatched, untouched,
# no Go probe (a direct probe trips the curl tripwire — `anthropic`). Anthropic latched, Go clear →
