# fu088-ladder-run-shape (homelab#439 leg 2, finding-2 ratchet) — the fu088-gates `*)` arm,
# GO-FAILOVER leg for the `--run` DISPATCH SHAPE (retro, retro-session.sh:104).
#
# CONDITION UNDER REPLAY: Anthropic latched, Go rail clear (the ladder prints
# `opencode-go/deepseek-v4-flash`), on a claude-harness RETRO ride — whose pod command is a `--run`
# string with NO `--model` flag, and whose `_claude_model` was never assigned (the recipe block
# that assigns it does not run). This is the shape the round-1 fu088-ladder-go fixture could not
# see (its bridge pre-seeded the recipe/worker RUN_CMD with `--model haiku`).
#
# THE CONTRACT (finding 2, #439): the failover inserts the Go rail's model into the `claude -p `
# command so the pod ACTUALLY serves from Go — never a false 'serving on the Go rail' log over a
# pod that would run the CLI default against the still-latched Anthropic API (the round-1 defect:
# a no-op substitution that announced the Go rail and dispatched a mis-served pod).
name: fu088-ladder-run-shape
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:fu088-gates
  - file:post.sh
env:
  - STUB_RAIL=opencode-go/deepseek-v4-flash
