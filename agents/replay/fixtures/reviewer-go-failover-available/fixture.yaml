# reviewer-go-failover-available (homelab#424) — the Go-rail failover when Anthropic is latched.
#
# CONDITION UNDER REPLAY. The subscription-latch.sh probe returns exit 1 (Anthropic limited),
# but the Go rail probe (/opencode-limit) returns {limited: false}.
#
# THE CONTRACT:
#   1. The failover gate sets MODEL="opencode-go/kimi-k3" and GO_SERVED=1 when Go is available.
#   2. The log line "→ Anthropic latched — serving review of ..." is emitted.
#   3. The script CONTINUES to pod creation (exit 0 from the gate, no defer).
#   4. An explicit --model always wins — this fixture tests the implicit case (no --model passed).
#
# The bridge.sh contains the complete test logic with stubbed subscription-latch.sh and curl.
name: reviewer-go-failover-available
mode: actions
source: agents/reviewer-session.sh
parts:
  - file:bridge.sh
env:
  - PROJECT=test-project
  - PR=42
  - MODEL_SET_EXPLICIT=
