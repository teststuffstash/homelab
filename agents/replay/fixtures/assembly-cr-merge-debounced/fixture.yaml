# assembly-cr-merge-debounced (homelab#1939) — a master-merge on a stale changes-requested
# assembly PR is NOT a new state: the clause DEBOUNCES instead of emitting a goal-checkpoint.
#
# CONDITION UNDER REPLAY. PR #1934's 2026-09-23 shape: the assembly PR (#309 here) holds a stale
# CHANGES_REQUESTED; the last emit recorded `state-fp:assembly-cr:<hash>` while the head was the
# non-merge commit 0df28aeca…; since then the updater merged master (head = the merge commit
# b3d551392…) and CI re-ran (e2e IN_PROGRESS). The verdict and reviewDecision are unchanged.
#
# The REAL pr_state_fp_pair runs (block:state-fp-jq + block:state-fp-pair; the sibling
# assembly-cr-debounced stubs it wholesale, so the clause→jq routing was invisible to the family).
# The recorded marker is computed FROM THE CONTRACT, not by running the code — the arbitrate fold
# (STATE_FP_JQ_ARBITRATE, homelab#1011) over the pre-merge state:
#   printf '%s' 'head=0df28aeca0000000000000000000000000000000|review=CHANGES_REQUESTED|verdict=2026-09-23T08:40:00Z' \
#     | sha256sum | cut -c1-12   →  01a3358fb2d9
# On base (assembly-cr → the generic STATE_FP_JQ: raw head= + per-check states) the hash differs
# and the clause EMITS a goal-checkpoint unit — this fixture's red.
#
# THE CONTRACT:
#   1. No goal-checkpoint unit is emitted.
#   2. The DEBOUNCED orphan line names the recorded hash.
name: assembly-cr-merge-debounced
mode: actions
source: agents/coordinator-scan.sh
parts:
  - block:state-fp-jq
  - block:state-fp-pair
  - file:bridge.sh
  - block:changes-requested-gate
  - file:../assembly-cr-debounced/post.sh
env:
  - IN_SLUG=teststuffstash/oracle-fleet
  - IN_REPO=oracle-fleet
