# homelab#257 (retro r3 F4) — leg A: a worker's `AGENT_INFEASIBLE:` verdict parks the issue on
# `agent/blocked` and takes it out of `c4c5-redispatch`, while the issue beside it — same state,
# no marker — keeps today's behaviour exactly.
#
# CONDITION UNDER REPLAY. The oracle-fleet#66 shape, transposed onto this repo. Two `agent-fix` +
# `agent/in-progress` issues, no live worker pod, no open PR referencing either: the abandoned-ride
# predicate holds for BOTH, so before the marker existed both landed as `c4c5-redispatch` units and
# one of them was a paid session spent to re-derive "the deliverable is a banned path". #66's
# worker posted the verdict as a comment and ended without pushing; #70's worker just died.
#
# THE CONTRACT:
#   1. #66 is READ (its comments), then WRITTEN in the belt's own order — `--add-label
#      agent/blocked` FIRST, `--remove-label agent/in-progress` SECOND, then a `gh issue view`
#      RE-READ that proves the end state before a single word is commented. The audit comment
#      quotes the resource the worker named. That order is not cosmetic: `gh issue edit` is not
#      atomic, and with neither label the issue is invisible to every clause.
#   2. #66 emits NO unit and NO `v2` report line. It is human-gated now, and the report it does
#      get says so — a `c4c5-redispatch` for it is the exact hand-override retro r3 F4 measured.
#   3. #70 emits its unit and its report line, unchanged. A terminal that quietly swallowed the
#      ordinary abandoned ride would be a far worse defect than the one it fixes, and only a
#      no-marker issue in the SAME world can assert that.
#   4. The marker's payload rides into both the audit comment and the report line. "Which path or
#      resource" is the whole content of the verdict; a terminal that dropped it would leave a
#      human re-reading a transcript to learn what to re-scope.
#
# Its sibling `c4c5-infeasible-quoted-inert` holds the near-miss half: a comment that TALKS about
# the marker, and an issue a human already blocked. Both must stay inert.
name: c4c5-infeasible-parks
mode: actions
world: circles-29-tree
source: agents/coordinator-scan.sh
parts:
  - block:c4c5-selector
  - file:bridge.sh
  - block:infeasible-terminal
  - block:c4c5-derivations
  - file:post.sh
