# Issue #660 leg 2: tier-default STRUCK_MODEL sync (PR#668 round 2, step 1/3).
#
# The tier-default rewrite at the subscription pod-label section rewrites MODEL from the
# OpenRouter default to haiku. STRUCK_MODEL must be synced here because the pre-rewrite value
# is the SCRIPT's OWN default (not a chain entry a dispatcher chose), so the strike must name
# what actually runs. This contrasts with the two degrade sites below (:1566, :1639), where
# the pre-rewrite value IS a chain entry that was dispatched and must be preserved in STRUCK_MODEL.
#
# Fixture tests the synchronization at init time: when the tier-default rewrite fires, both
# MODEL and STRUCK_MODEL are set to "haiku" (the script's fallback), so they remain in sync at
# this point. The divergence tested in strike-attribution-degrade happens LATER when the model
# fails and we degrade to a fallback — only then does STRUCK_MODEL stay at the original while
# MODEL changes.
#
name: go-rail-latch-strike-attribution-init-tier-default
mode: actions
source: agents/agent-session.sh
