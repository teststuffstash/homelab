# Issue #660: strike attribution survives model fallback and error classification fix.
#
# TWO halves fixed:
#  1. STRUCK_MODEL tracks the originally attempted chain entry; when degrading to a fallback,
#     MODEL changes but STRUCK_MODEL stays put, so the strike comment records which chain entry
#     was attempted (not which fallback was used). The coordinator's strike-grepping reads this
#     to blacklist the right model for the next attempt.
#  2. A 429 error with quota/limit text classifies to error_class=quota (not unknown), so fleet
#     quota-exhaustion is distinguishable from other errors in the router's strike table.
#
# Test: the launcher initializes STRUCK_MODEL, and after degradation it still holds the original
# model while MODEL has changed to the fallback. A quota-bearing 429 in the log classifies as
# error_class=quota.
name: go-rail-latch-strike-attribution
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:struck-model-init
  - block:rail-degrade
  - file:post.sh
