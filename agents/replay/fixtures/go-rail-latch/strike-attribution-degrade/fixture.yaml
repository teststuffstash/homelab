# Issue #660 leg 2: STRUCK_MODEL divergence across degrade (PR#668 round 2).
#
# When the launcher degrades from an attempted chain entry (e.g., opencode-go/*) to a fallback
# (e.g., claude/haiku), MODEL is rewritten to the fallback, but STRUCK_MODEL must remain at the
# original attempted entry. This ensures the strike comment records which chain entry was
# attempted and found unavailable (not which fallback was used), so the coordinator's
# strike-grepping correctly blacklists the right model for the next attempt (FU-062 / #660).
#
# This fixture replays the Go-window-limited degrade path (subscription fallback arm) and asserts
# that MODEL/GOOSE_MODEL change to the fallback while STRUCK_MODEL stays at the pre-degrade value.
# Contrasts with the init-only strike-attribution fixture, which asserts MODEL == STRUCK_MODEL
# "at init" (correct there, would fail after this degrade).
#
name: go-rail-latch-strike-attribution-degrade
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:fu088-gates
  - file:post.sh
