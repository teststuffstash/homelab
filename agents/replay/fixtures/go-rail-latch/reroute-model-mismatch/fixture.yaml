# Issue #629: AGENT_STRIKE records wrong model for Go-rail ride
#
# CONDITION UNDER REPLAY: an opencode-go/deepseek-v4-flash dispatch while the Go window is
# latched (CAPACITY reason). The fixture tests that both RUN_CMD and pod env MODEL are
# consistently updated to the fallback model (claude/haiku).
#
# THE DEFECT: RUN_CMD substitution fails to match the model string, leaving RUN_CMD pointing
# at the Go endpoint while MODEL is set to haiku. This causes agent-finalize to read pod env
# MODEL=haiku but the actual ride goes to Go, creating a mismatch in the strike comment
# (model=haiku) vs RUN_STATS (model=opencode-go/deepseek-v4-flash).
#
# THE CONTRACT: After the degrade block executes:
# 1. RUN_CMD is updated to use the fallback model (--model haiku)
# 2. MODEL shell variable is set to the fallback model (haiku)
# 3. GOOSE_MODEL remains consistent (this was also broken in #629)
#
name: go-rail-latch-reroute-model-mismatch
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:fu088-gates
  - file:post.sh
