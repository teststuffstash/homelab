# homelab#367 — THE DEFECT, replayed on the tree it was found in.
#
# CONDITION UNDER REPLAY. Issue #367 is a post-launch sprout: its native parent is the ADR-102
# BUCKET #295, whose parent is goal #278. The bucket carries no labels and no `Budget:` line; the
# goal carries `task/goal` and `Budget: 60`.
#
#     #367 (this ride) → #295 (post-launch bucket) → #278 (task/goal, Budget: 60)
#
# WHAT THE SHIPPED CODE DID, measured live on 2026-08-12 and the reason this fixture exists: the
# launcher read `/issues/367/parent` ONCE, got #295, and stopped. #295 has no `Budget:` line, so
# `goal_budget_read` returned `no-budget` — which the pre-flight treats as "gate off" by design —
# while goal #278 was sitting at $76 of its $60, `exhausted`. #351 dispatched straight through that
# on the same morning. The bucket also has no `## Goal` / `## Acceptance` headings, so the card
# printed "no Goal/Acceptance heading found" and the ride went goal-blind — the structural
# forgetting FU-090 leg (c) built the card to end. Both halves came off the same single hop.
#
# THE CONTRACT:
#   1. The walk CLIMBS: #295 is inspected, rejected, and its parent read. Two `issue view` reads and
#      two `parent` reads, in that order — the stream, not a variable, is the assertion.
#   2. `GATE SUBJECT: #278`. The pre-flight's argument is the GOAL, not the bucket. This is the
#      whole bug; a fixture that pinned only the card would go green on half a fix.
#   3. The card is #278's, and it is BOUNDED — the `## Acceptance` section only. #278 has no
#      `## Goal` heading (it opens with the `Budget:`/`Verdict-authority:` lines), so the card
#      carries exactly one section, which is the real shape of the real goal rather than a
#      constructed one that happens to have both.
#   4. The hop is SAID OUT LOUD (`walked 1 hop(s) up to goal #278`). A resolution that silently
#      changes which issue the money is charged against is the thing that took a week to notice.
#
# THE WORLD IS RECORDED FROM LIVE homelab STATE (2026-08-12) — the two ancestry edges, #295's
# bucket body, #278's labels and its whole body are verbatim. One deliberate edit, the harvest-*
# convention: the `/parent` payloads are trimmed to `{id, number, title}`, the fields the clause
# reads; GitHub returns the entire parent issue there.
name: goal-ancestor-bucket-child
mode: actions
source: agents/agent-session.sh
parts:
  - file:bridge.sh
  - block:goal-ancestor
  - file:post.sh
