# homelab#239 — leg A: the rule author's label is the key, and it is the ONLY key this alert has.
#
# CONDITION UNDER REPLAY. The live 2026-08-11 failure, homelab#237. RetroReportOverdue fires off a
# PUSHGATEWAY metric (retro_report_last_success_timestamp): no meaningful namespace label, and a
# name that is not `Agent*`. The gate's two original keys both INFER machinery from something else,
# so both missed it — the alert took a `fix` verdict, was debounce-queued, and put a coordinator
# ride on the retro belt, which only the jail/operator lane can act on. It ended in an agent/error
# latch. The rule now stamps `platform_machinery: "true"` and this fixture is what holds the pair
# together from the gate's side.
#
# THE CONTRACT:
#   1. The label ALONE trips the gate. No namespace, no `Agent*` name, no other signal in the
#      payload — if this fixture ever goes green for a different reason, its sibling
#      `responder-selfref-unlabelled` is the one that catches it (same alert, label removed).
#   2. WHICH key matched is recorded, not just THAT one did. `SELF_WHY` is the audit trail that
#      goes into both the log line and the brief; the gate used to claim `namespace=''` for every
#      match, which for a label match is simply false.
#   3. The brief gets the cap: author a PR, never auto-merge, and end the issue body with
#      `self-referential: true` — the marker `fix-debounce-argo.yaml` skips at wake, i.e. the
#      mechanism that would have stopped the #237 dispatch. Asserted by predicate; see post.sh.
#   4. NO gh and NO kubectl calls. The gate is pure computation over the payload — a lookup added
#      here would show up as a CALL line, and would be a per-alert API read on the hot path.
name: responder-selfref-platform-machinery
mode: actions
source: agents/coordinator/responder-argo.yaml
parts:
  - file:bridge.sh
  - block:responder-selfref-gate
  - file:post.sh
