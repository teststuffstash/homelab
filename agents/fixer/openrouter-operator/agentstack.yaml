# The platform stack's AgentStack claim (FU-048/ADR-085) — openrouter-operator's agent POLICY in
# one CR; the XRD+Composition render the fixer MECHANISM that openrouter-key.yaml + git-token.yaml
# in this dir carried by hand. The platform stack has no -iac repo, so its claim lives here
# (homelab IS its deployment truth); applied by the same agent-fixer ApplicationSet dir generator.
apiVersion: platform.teststuff.net/v1alpha1
kind: AgentStack
metadata:
  name: platform
spec:
  mainRepo: homelab
  coordinatorModel: opencode-go/deepseek-v4-flash # 2026-09-25 (operator): the Anthropic 7d window sits at
  # 0.94 against the 0.95 latch, and the dispatch class rails are subscription-only, so a latched
  # coordinator DEFERS rather than fails over. The claim model is an explicit override (resolve-model:
  # --model wins), so this rides the Go rail until the window resets; revert to `opus` then.
  # FU-080 graduation (2026-07-26, third stack): platform runs its own per-stack loop in
  # platform-agents. Thin by design — only openrouter-operator has a fixer block, and little
  # agentic activity happens here yet (operator note). coordinator.enabled + loop.perStack render
  # the loop; loop.graduated cuts over (global scan skips platform, doorbell + per-stack review in-ns).
  routerMode: authoritative  # declared-not-defaulted (ADR-096; same drift class). FLIPPED from
  # shadow 2026-09-19 (Goal #1640 acceptance 6, homelab#1782) — the last stack in the fleet off a
  # static chain; the routed decision IS the model now (see the CHAINLESS note below).
  coordinator:
    enabled: true # RESUMED 2026-07-28 (meta-15, operator "enable the world" after Phase 4)
  # Bot review ON (operator directive 2026-08-11: platform PRs get the bot read BEFORE the
  # codeowner read). The live object carried an imperative enabled:false patch (SSA-owned by
  # kubectl, invisible in git — this explicit block takes the field back). Safe on homelab by
  # construction: whole-repo scaffold CODEOWNERS + require_code_owner_review mean a bot approval
  # parks at REVIEW_REQUIRED and a human still merges; agent-runtime returns to its documented
  # unowned-lane design (PR#40 shape). ⚠ agent-coordinator + openrouter-operator have
  # require_approval but NO codeowner gate until the tofu/github flip lands (host-side apply) —
  # window accepted 2026-08-11, guards staged in tofu/github/variables.tf + repo CODEOWNERS.
  reviewer:
    enabled: true
    goalModel: sonnet   # declared-not-defaulted (M10; the server default drifted the app 2026-08-12)
  loop:
    perStack: true
    graduated: true
  # FU-102 prober — ENABLED 2026-08-24 (goal #818 child homelab#835; the .agents/** carve-out was
  # DECLINED, so the brief is seat-authored — ruling on the issue). Every field declared, never
  # defaulted (the 2026-07-16 API-server-stamp/OutOfSync lesson). Schedule = the XRD default
  # four-a-day tick at :41, offset from the :00/:30 coordinate and :15 review crons.
  prober:
    enabled: true
    schedule: "41 */6 * * *"
    model: haiku
  # 0731 DENY — kept UNCHANGED across the chainless flip (2026-09-19). Head-swapped 2026-08-05 on
  # wall-clock evidence, not on scores: the 0731 ride produced eight consecutive ~max_tokens
  # completions (~1.25 MB each, latency climbing 162s → 299s) in 30 minutes with no branch, no
  # commit and no edit — the repetition-loop shape the circles fan-out audit already measured
  # (53% of wall-clock lost to loops, 2026-08-03). Cost is trivial ($0.003/call); the ride is what
  # is lost. Its SCORES were never in dispute; its behaviour here is. Under the chainless claim
  # this deny is no longer a belt behind a static head — the launcher sends it as the /route
  # request's `deny` (agent-session.sh), so it binds the SERVED walk directly.
  # REVISIT when a 0731 ride completes cleanly elsewhere, or the router gains a latency lever.
  modelDeny: [deepseek/deepseek-v4-flash-0731]
  # ⚠ CHAINLESS since 2026-09-19 (Goal #1640 acceptance 6, homelab#1782): the static worker chain
  # is DELETED — no primary, no fallbacks — and routerMode above is authoritative, so the
  # launcher's /route call owns the pick and dispatchers stop passing --model (ADR-107 decision 1:
  # static chains are deleted, not deprecated in place; ADR-094: the routed decision IS the model,
  # the coordinator's routing verbs are labels, never model ids). This was the fleet's LAST
  # per-stack chain; oracle-iac#387 and sleep-iac#77 took the other two on 2026-08-26.
  #
  # The operator's ordering preference ("v4-flash first, v4.1-flash next") is CLASS policy now,
  # not stack policy: the coding class's `chain_head` in model-classes.json (homelab#1783 /
  # PR#1784 — merged to master BEFORE this flip, which is the blocked-by edge this issue carries).
  # It had to exist first because `chain_source: stack` resolves NOTHING on a chainless stack, so
  # the served walk would otherwise draw straight from the ranked rotation with the operator's
  # ordering stated nowhere.
  #
  # The chain's own dated history (08-03 reset, 08-05 head swap, 08-07 subscription cutover, 08-17
  # Go dogfood + 08-19 park, 08-20 OR-flash fixup, 09-05 haiku restore, 09-11 deepseek primary,
  # 09-14 v4.1-flash with the `:exacto` suffix on the STATIC string) is NOT carried here: it was
  # the justification of a knob that no longer exists. It lives where the archaeology lives —
  # docs/spikes/model-routing-history.md §M12 and agents/coordinator/TICK-LOG.md — and the `:exacto`
  # reasoning it ended on is now moot in the best way: the suffix is appended at SERVE time by
  # provider_policy: exacto on the coding class, not hand-written into a chain entry.
  #
  # The M12 degrade is UNCHANGED, and is why claudeTier stays true below: at the OpenRouter credit
  # floor rides return to claude/haiku LOUDLY (rail=subscription-fallback), never silently.
  repos:
    # agent-runtime: FIXER ENABLED 2026-08-08 — the 2026-07-16 "No fixer: these build the
    # agent images" ruling (kept for agent-coordinator below) was superseded for THIS repo by
    # its PR#37 (2026-08-07): `.agents/fix.yaml`, tests + a `unit` CI job, CODEOWNERS on the
    # governor paths. Only this claim-side switch was missing — five queued issues sat
    # invisible to the scan because dispatchability is a fixer-block predicate (IAC-T03);
    # found 2026-08-08 when the operator asked why nothing was happening. Every
    # server-default declared explicitly (the 2026-07-16 OutOfSync lesson).
    - name: agent-runtime
      labels: { extra: [] } # explicit (server default) — bare {} gets stamped to {extra: []}, ArgoCD drifts
      storage:
        standard: "5Gi" # docker:false → no per-ride scratch; flipping docker later must add it (ADR-089)
        bulk: "0"       # ⚠ defaulted fields must be DECLARED or the server stamps them and the
        fast: "0"       #   app sits OutOfSync forever (agent-fixer.yaml doctrine; drift seen live
        scratch: "0"    #   2026-08-12 when the storage/router/goalModel defaults landed)
      fixer:
        budgetUSD: 5
        resetInterval: weekly
        guardrail: none # paid stack chain — only-free would 403 before spend; budgetUSD bounds it
        docker: false # rides run pytest/devbox over agent-finalize; images build in CI, never in rides
        claudeTier: true # platform-stack posture (subscription cutover 2026-08-07, FU-134)
        egress:
          profile: none # devbox/nix are the only KNOWN deps (the `unit` gate is pytest under
          # devbox); no pypi pre-declared — agent-finalize is stdlib-shaped, and harvest-first
          # (FU-142) means the first trip names the REAL dep instead of a guessed one.
          extraFQDNs: []
          enforce: true
    # agent-coordinator stays context-only (the 2026-07-16 ruling): no repo-side lane
    # (.agents/), and its content is tier-3 loop machinery.
    - name: agent-coordinator
      labels: { extra: [] }
    # homelab: joined 2026-08-04 for reviewer coverage + claim-owned labels (FU-068), and gained
    # its FIXER BLOCK the same day (below) — it IS a dispatch target now, gated per PATH, not per
    # repo. It is the platform's own -iac (ArgoCD syncs argocd/, agents/coordinator,
    # agents/fixer/*) AND the home of the loop's own machinery; which paths a fixer may author
    # was SETTLED 2026-08-04/05 (FU-068 + FU-142, archived): CODEOWNERS tiers + the .agents/fix.yaml
    # scope ceiling, both described in iac-lane.md §The platform lane.
    # The labels below ADOPT the 27 that tofu forgot in the same change (labels.tf retired).
    - name: homelab
      labels: { extra: [] }
      # ADR-089 quota-as-contract, ARMED 2026-08-07. Until today NO claim set spec.repos[].storage,
      # so `kubectl get resourcequota -A` returned nothing cluster-wide and the "over-cap PVC
      # fails fast at CREATE" promise was never in force. This repo is docker:false, so it takes
      # no per-ride 20Gi scratch volume — scratch stays at the "0" default DELIBERATELY, which
      # means flipping docker:true later also requires setting a scratch cap here. That coupling
      # is the point: capacity becomes a declared decision instead of a silent draw on the pool.
      storage:
        standard: "5Gi"
        bulk: "0"
        fast: "0"
        scratch: "0" # declared-not-defaulted (agent-fixer.yaml doctrine, 2026-08-12 drift)
      # FIXER BLOCK 2026-08-04 — homelab becomes a dispatch target. The gate it lands behind is
      # PATH-based, not repo-based (docs/agents/iac-lane.md §The platform lane): CODEOWNERS owns
      # the governance tiers, and tier 1 (argocd/resources/) is owned as a temporary scaffold until
      # the IAC-G04 sentinel covers this repo. Every server-default is declared explicitly — an
      # omitted defaulted field is stamped by the API server and leaves the ArgoCD app permanently
      # OutOfSync (the 2026-07-16 lesson).
      fixer:
        budgetUSD: 5
        resetInterval: weekly
        # `none`, not only-free: platform IaC is grounding-heavy and the stack chain is
        # deepseek-v4-flash-0731 (~$0.09/M, a PAID model) — only-free would 403 every completion
        # before spend and the ride could never start. budgetUSD is what bounds it.
        guardrail: none
        docker: false
        # true since 2026-08-07 (subscription cutover, when the chain's primary was claude/haiku;
        # the M12 credit-floor degrade below is what keeps it load-bearing after the 2026-09-19
        # chainless flip) — renders
        # the claude-session secret this ns needs for the ref rail. The FU-134 ruling stands:
        # claudeTier is for RIDING the subscription, never the backdoor for web lookup.
        claudeTier: true
        egress:
          profile: none # baseline FQDNs only — homelab work is YAML/HCL, no pypi/npm pulls
          # raw.githubusercontent.com is the fixer's OWN GATE, not a convenience: `devbox run
          # manifest-lint` shells to kubeconform, whose default schema location is that host. Under
          # enforce:true a ride would fail on a network drop rather than on its manifest — a gate
          # that cannot run is worse than no gate, because the ride reports the wrong reason.
          # Pre-declared rather than harvested from a tripped ride: the dependency is known, and
          # "harvest first" is for the deps we cannot predict (FU-142 / homelab#97).
          # ghcr.io added 2026-08-05, from a LIVE drop on the lane's first ride: the recipe tells
          # an argocd/** change to run BOTH gates, and the second one — `devbox run
          # argocd-validate-pins` — does `helm pull oci://ghcr.io/teststuffstash/charts/...` to
          # prove a pinned chart still renders. I declared kubeconform's host and missed helm's,
          # in the same file that names both lints. If a gate is named in the recipe, its egress
          # belongs here: the ride cannot tell "my manifest is wrong" from "the network said no".
          # results-receiver.actions.githubusercontent.com added 2026-08-09 (homelab#107, third
          # cause on the thread): `gh run view --log` streams Actions log content from this host,
          # and reading run logs IS play-named work here (the ci-red play's triage; FU-148 even
          # grants actions:write for its retry terminal). The live drop (~18, ride issue-198-r1)
          # was masked by a false sense of coverage: Cilium `matchPattern: '*'` spans exactly ONE
          # DNS label, so `*.githubusercontent.com` reaches raw. but not results-receiver.actions.
          # (cilium/cilium#22081 — documented behavior). Distinct from the 2026-08-08 #107 ruling
          # (no widening for a ride's INCIDENTAL supply-chain curiosity): this one is the recipe's
          # own gate surface.
          extraFQDNs: [raw.githubusercontent.com, ghcr.io, results-receiver.actions.githubusercontent.com]
          enforce: true # the -iac lane's ring-2 posture; harvest first if a ride trips it
    - name: openrouter-operator
      labels: { extra: [] } # claim-owned label set (FU-068; live diff 2026-07-16: strict taxonomy subset)
      # ADR-089 quota-as-contract, ARMED 2026-08-07. Until today NO claim set spec.repos[].storage,
      # so `kubectl get resourcequota -A` returned nothing cluster-wide and the "over-cap PVC
      # fails fast at CREATE" promise was never in force. This repo is docker:false, so it takes
      # no per-ride 20Gi scratch volume — scratch stays at the "0" default DELIBERATELY, which
      # means flipping docker:true later also requires setting a scratch cap here. That coupling
      # is the point: capacity becomes a declared decision instead of a silent draw on the pool.
      storage:
        standard: "5Gi"
        bulk: "0"
        fast: "0"
        scratch: "0" # declared-not-defaulted (agent-fixer.yaml doctrine, 2026-08-12 drift)
      fixer:
        budgetUSD: 5 # USD/week standing ceiling (carried over)
        resetInterval: weekly
        # `none` since 2026-08-05, matching every other fixer repo (operator direction — the sleep
        # and circles guardrails came off the day before, oracle-fleet's via oracle-iac#271). It was
        # only-free while the stack chain is PAID (deepseek-v4-flash-0731 + mimo/hy3), which after
        # FU-138 made guardrails actually take effect would 403 every completion BEFORE spend, so no
        # ride here could start. budgetUSD above is the bound that was doing the work all along;
        # stack-lint KEY-02 fails on the only-free-with-a-paid-chain combination from now on.
        guardrail: none
        # explicit (server defaults) — the API server stamps defaulted booleans into the stored
        # object, so omitting them leaves the ArgoCD app permanently OutOfSync (same rule as
        # extraFQDNs below; observed live 2026-07-16 when claudeTier's default landed).
        docker: false
        claudeTier: true # 2026-08-07 subscription cutover — see the M12 note above
        egress:
          profile: python # kopf operator, uv/pip toolchain
          extraFQDNs: [] # explicit (server default) — earned from a harvest, currently none; also keeps ArgoCD diff clean
          # MONITOR (FU-020 rollout ring 1) — flip to true after clean harvested rides.
          # ENFORCED since 2026-07-16 (FU-020 ring 2): canary ride harvested clean under monitor —
          # all destinations allowlisted or known-benign (models.dev + direct openrouter.ai).
          enforce: true
