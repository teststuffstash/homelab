# The platform stack's AgentStack claim (FU-048/ADR-085) — openrouter-operator's agent POLICY in
# one CR; the XRD+Composition render the fixer MECHANISM that openrouter-key.yaml + git-token.yaml
# in this dir carried by hand. The platform stack has no -iac repo, so its claim lives here
# (homelab IS its deployment truth); applied by the same agent-fixer ApplicationSet dir generator.
apiVersion: platform.teststuff.net/v1alpha1
kind: AgentStack
metadata:
  name: platform
spec:
  mainRepo: homelab
  coordinatorModel: opus # platform coordination = highest-stakes arbitration (stacks.json carry-over)
  # FU-080 graduation (2026-07-26, third stack): platform runs its own per-stack loop in
  # platform-agents. Thin by design — only openrouter-operator has a fixer block, and little
  # agentic activity happens here yet (operator note). coordinator.enabled + loop.perStack render
  # the loop; loop.graduated cuts over (global scan skips platform, doorbell + per-stack review in-ns).
  coordinator:
    enabled: true # RESUMED 2026-07-28 (meta-15, operator "enable the world" after Phase 4)
  loop:
    perStack: true
    graduated: true
  # Chain reset 2026-08-03 (operator, evidence-based — scout #81 + MCP evals/market/AA):
  # 0731 = the flash successor (gpqa 88.7%@$0.0033 vs 0423's 87.0%, τ-Bench 76.7 vs 75.0,
  # canary clean, already charting in devops/security tags); mimo = our own 7×-wall-clock
  # evidence (sleep #105) + top devops/frontend/repo-scan market share; qwen3-coder EVICTED
  # (weak on every AA axis); claude/haiku = cross-rail availability tail (agentic idx 16.4 —
  # never a quality pick, survives OpenRouter-wide outage on the paid subscription).
  # HEAD SWAPPED 2026-08-05 (operator) — mimo leads, 0731 denied. Not a revision of the
  # benchmark reasoning above: 0731's SCORES are not in dispute, its wall-clock behaviour here is.
  # openrouter-operator#14 is a two-line YAML change; the 0731 ride produced eight consecutive
  # ~max_tokens completions (~1.25 MB each, latency climbing 162s → 299s) in 30 minutes with no
  # branch, no commit and no edit — the repetition-loop shape the circles fan-out audit already
  # measured (53% of wall-clock lost to loops, 2026-08-03). Cost is trivial ($0.003/call); the
  # ride is what is lost. mimo carries our own 7×-wall-clock evidence (sleep #105).
  # ⚠ modelDeny alone would NOT have changed dispatch: this stack has no routerMode, so
  # AGENT_ROUTER defaults to SHADOW and the router's decision is advisory — the static chain
  # below is what dispatches. The deny is here so the exclusion still holds after the P4
  # authoritative flip (FU-095); the head swap is what takes effect today.
  # REVISIT when a 0731 ride completes cleanly elsewhere, or the router gains a latency lever.
  modelDeny: [deepseek/deepseek-v4-flash-0731]
  workerModel: xiaomi/mimo-v2.5
  workerModelFallbacks: [tencent/hy3, claude/haiku]
  repos:
    # Platform-image repos, context-only (FU-052 "still to onboard", visibility half done
    # 2026-07-16): the review-reflex derives its scan set from the stack claims, so agent PRs
    # here were invisible until a human dispatched the reviewer by hand (found live on
    # agent-runtime#14). No fixer: these build the agent images; workers don't run pods in them.
    # labels: {} = claim-owned label set (FU-068, taxonomy only) — tofu label_repos handoff via
    # `tofu state rm` like the oracle repos.
    - name: agent-runtime
      labels: { extra: [] } # explicit (server default) — bare {} gets stamped to {extra: []}, ArgoCD drifts
    - name: agent-coordinator
      labels: { extra: [] }
    # homelab: CONTEXT-ONLY (no fixer block) — FU-068, 2026-08-04. It is the platform's own -iac
    # (ArgoCD syncs argocd/, agents/coordinator, agents/fixer/*) AND the home of the loop's own
    # machinery, so it joins the claim for REVIEWER COVERAGE + claim-owned labels WITHOUT becoming
    # a dispatch target: dispatchability is a fixer-block predicate, never implicit (IAC-T03), and
    # stack-lint's is_fixer() excludes it. Whether a fixer may author here — and on which paths —
    # was SETTLED 2026-08-04/05 (FU-068 + FU-142, archived): CODEOWNERS tiers + the .agents/fix.yaml
    # scope ceiling, both described in iac-lane.md §The platform lane.
    # The labels below ADOPT the 27 that tofu forgot in the same change (labels.tf retired).
    - name: homelab
      labels: { extra: [] }
      # FIXER BLOCK 2026-08-04 — homelab becomes a dispatch target. The gate it lands behind is
      # PATH-based, not repo-based (docs/agents/iac-lane.md §The platform lane): CODEOWNERS owns
      # the governance tiers, and tier 1 (argocd/resources/) is owned as a temporary scaffold until
      # the IAC-G04 sentinel covers this repo. Every server-default is declared explicitly — an
      # omitted defaulted field is stamped by the API server and leaves the ArgoCD app permanently
      # OutOfSync (the 2026-07-16 lesson).
      fixer:
        budgetUSD: 5
        resetInterval: weekly
        # `none`, not only-free: platform IaC is grounding-heavy and the stack chain is
        # deepseek-v4-flash-0731 (~$0.09/M, a PAID model) — only-free would 403 every completion
        # before spend and the ride could never start. budgetUSD is what bounds it.
        guardrail: none
        docker: false
        # FU-134 ruling: research capability must be platform-wide, not a property of which harness
        # got spawned. claudeTier is NOT the way to give this fixer web lookup.
        claudeTier: false
        egress:
          profile: none # baseline FQDNs only — homelab work is YAML/HCL, no pypi/npm pulls
          # raw.githubusercontent.com is the fixer's OWN GATE, not a convenience: `devbox run
          # manifest-lint` shells to kubeconform, whose default schema location is that host. Under
          # enforce:true a ride would fail on a network drop rather than on its manifest — a gate
          # that cannot run is worse than no gate, because the ride reports the wrong reason.
          # Pre-declared rather than harvested from a tripped ride: the dependency is known, and
          # "harvest first" is for the deps we cannot predict (FU-142 / homelab#97).
          # ghcr.io added 2026-08-05, from a LIVE drop on the lane's first ride: the recipe tells
          # an argocd/** change to run BOTH gates, and the second one — `devbox run
          # argocd-validate-pins` — does `helm pull oci://ghcr.io/teststuffstash/charts/...` to
          # prove a pinned chart still renders. I declared kubeconform's host and missed helm's,
          # in the same file that names both lints. If a gate is named in the recipe, its egress
          # belongs here: the ride cannot tell "my manifest is wrong" from "the network said no".
          extraFQDNs: [raw.githubusercontent.com, ghcr.io]
          enforce: true # the -iac lane's ring-2 posture; harvest first if a ride trips it
    - name: openrouter-operator
      labels: { extra: [] } # claim-owned label set (FU-068; live diff 2026-07-16: strict taxonomy subset)
      fixer:
        budgetUSD: 5 # USD/week standing ceiling (carried over)
        resetInterval: weekly
        # `none` since 2026-08-05, matching every other fixer repo (operator direction — the sleep
        # and circles guardrails came off the day before, oracle-fleet's via oracle-iac#271). It was
        # only-free while the stack chain is PAID (deepseek-v4-flash-0731 + mimo/hy3), which after
        # FU-138 made guardrails actually take effect would 403 every completion BEFORE spend, so no
        # ride here could start. budgetUSD above is the bound that was doing the work all along;
        # stack-lint KEY-02 fails on the only-free-with-a-paid-chain combination from now on.
        guardrail: none
        # explicit (server defaults) — the API server stamps defaulted booleans into the stored
        # object, so omitting them leaves the ArgoCD app permanently OutOfSync (same rule as
        # extraFQDNs below; observed live 2026-07-16 when claudeTier's default landed).
        docker: false
        claudeTier: false
        egress:
          profile: python # kopf operator, uv/pip toolchain
          extraFQDNs: [] # explicit (server default) — earned from a harvest, currently none; also keeps ArgoCD diff clean
          # MONITOR (FU-020 rollout ring 1) — flip to true after clean harvested rides.
          # ENFORCED since 2026-07-16 (FU-020 ring 2): canary ride harvested clean under monitor —
          # all destinations allowlisted or known-benign (models.dev + direct openrouter.ai).
          enforce: true
