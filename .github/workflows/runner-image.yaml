# Builds the custom ARC runner image (FU-015) — see docker/arc-runner/Dockerfile for why.
# Runs on ubuntu-latest BY DESIGN: the runner image must not depend on the scale set it
# provisions (bootstrap), and hosted minutes are free on a public repo. Raw `docker build` here
# (not `devbox run`) matches the image-build practice on hosted/VM runners (snore-recorder):
# docker is the one tool the hosted image provides that devbox can't. Push auth is the job's
# built-in GITHUB_TOKEN (packages: write) — no external credential (agent-coordinator precedent).
# The image is pinned by tag (calver-gsha) in argocd/platform/arc-runners.yaml — bump it there
# after a build; nothing consumes :latest (none is pushed).
name: runner-image

on:
  push:
    branches: [master]
    paths:
      - docker/arc-runner/**
      - .github/workflows/runner-image.yaml
      # The lock bump itself is the rebuild signal (level-triggered): the Monday devbox-update
      # PR merging re-bakes the warm store + eval cache against the fresh locks. This replaced
      # the fixed-offset cron ordering (lock 03:00 → image 06:00): GitHub cron drifts by HOURS
      # independently per workflow (2026-07-27: the 03:00 lock bump fired 06:19 — the 06:00
      # image cron would have rebaked LAST week's locks), so offsets guarantee nothing.
      # devbox.json is DELIBERATELY not a trigger (2026-08-03: a scripts-only edit triggered a
      # full build+pin cycle) — any real toolchain change updates devbox.lock too.
      - devbox.lock
  schedule:
    # Monday fallback rebake only (base-image freshness + the OTHER repos' lock drift — their
    # lockfiles are fetched live at build time, so no master push signals them). Ordering with
    # the lock bump no longer matters: the push trigger above owns that case.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write # push the arc-runners.yaml pin bump after a build (see last step)
  packages: write

concurrency: runner-image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every build fetches ALL repos' lockfiles live, so any same-day build already served the
      # Monday cron's purpose (other repos' lock drift). Skip the scheduled rebake when today's
      # pin proves a build already ran (2026-08-03: the drifted cron was the 4th build that day).
      - name: Skip scheduled rebake if a build already ran today
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && grep -q "arc-runner:$(date +%Y.%-m.%-d)-g" argocd/platform/arc-runners.yaml; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "scheduled rebake skipped — today's pin shows a build already ran" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Most fleet repos are private — the warm-store lockfiles need an App token (the
      # devbox-update.yaml pattern); this job's own GITHUB_TOKEN is homelab-scoped.
      # ⚠ The list below is the homelab-renovate App INSTALLATION set, not the wishlist:
      # minting for an uninstalled repo 422s the whole step (the exporter /apps page has the live matrix).
      - uses: actions/create-github-app-token@v1
        if: steps.guard.outputs.skip != '1'
        id: app
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: teststuffstash
          repositories: homelab,sleep-tracking,sleep-iac,openrouter-operator,oracle-fleet,oracle-iac,agent-coordinator
      - name: Fetch fleet devbox lockfiles into the build context (FU-015 warm store)
        if: steps.guard.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Every repo dir must EXIST (empty on failure, never removed): the Dockerfile has a
          # per-repo COPY (#80 layering) and a missing dir fails the whole build; warm-one
          # skips an empty one.
          for r in homelab oracle-fleet oracle-iac sleep-tracking sleep-iac agent-coordinator openrouter-operator; do
            mkdir -p "docker/arc-runner/warm/$r"
            for f in devbox.json devbox.lock; do
              if ! gh api "repos/teststuffstash/$r/contents/$f" -H "Accept: application/vnd.github.raw" \
                   > "docker/arc-runner/warm/$r/$f"; then
                echo "::warning:: $r/$f not fetchable — closure skipped"
                rm -f docker/arc-runner/warm/$r/*; break
              fi
            done
          done
          echo "closures staged: $(ls docker/arc-runner/warm/)"
      - uses: docker/login-action@v3
        if: steps.guard.outputs.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag (calver-gsha, agent-coordinator convention)
        if: steps.guard.outputs.skip != '1'
        id: tag
        run: echo "tag=$(date +%Y.%-m.%-d)-g$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.skip != '1'
      - name: Build and push
        if: steps.guard.outputs.skip != '1'
        # Registry layer cache (#80): the hosted builder is ephemeral, so without --cache-from
        # every build re-executes and RE-DIGESTS every layer — consecutive pins shared only the
        # 0.55G of pulled base layers and each bump shipped ~3.5G of "new" bytes. mode=max
        # exports every layer's cache to the :buildcache ref; an unchanged step (per-repo
        # closure layers, Dockerfile) is REUSED bit-identical and its digest stays stable.
        # --provenance=false keeps a plain manifest (no attestation index) — the pin consumers
        # and the mirror-warm tooling expect one.
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/arc-runner:${{ steps.tag.outputs.tag }}"
          CACHE="ghcr.io/${{ github.repository }}/arc-runner:buildcache"
          docker buildx build \
            --push -t "$IMAGE" \
            --provenance=false \
            --cache-from "type=registry,ref=$CACHE" \
            --cache-to "type=registry,ref=$CACHE,mode=max" \
            docker/arc-runner
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      # The image is consumed by TAG PIN in arc-runners.yaml — a build nobody pins is a no-op
      # (the scheduled Monday rebuild would otherwise bake fresh locks into an image nothing
      # runs). Bump = a CI-gated auto-merge PR, the homelab deploy-target shape (FU-051): a
      # direct push is blocked by the master ruleset (GH013, first attempt run 30170507026) —
      # and rightly, argocd-validate-pins must gate every pin. App token: the workflow's
      # existing homelab-renovate mint (same App that opens the devbox-update PRs on homelab).
      - name: Bump the scale-set pin (auto-merge PR)
        if: steps.guard.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Three pinned consumers: the scale set, the iac-sentinel WorkflowTemplate (sentinel-argo.yaml — the
          # list named reflexes-argo.yaml, which carries no pin, so the sentinel sat on a 17-day-old bake and
          # re-downloaded every lock drift on every run: 3.5 min of nix copies per PR check, 2026-09-03), and the
          # runner-image-prepull DaemonSet that holds the image on every worker (first pull = 429–909 s).
          sed -i -E "s|(arc-runner:)[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-g[0-9a-f]{12}|\1${{ steps.tag.outputs.tag }}|g" \
            argocd/platform/arc-runners.yaml agents/coordinator/sentinel-argo.yaml argocd/resources/runner-image-prepull/daemonset.yaml
          if git diff --quiet argocd/platform/arc-runners.yaml agents/coordinator/sentinel-argo.yaml argocd/resources/runner-image-prepull/daemonset.yaml; then
            echo "pin already current" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          BRANCH="runner-image-pin"
          git config user.name "runner-image bot"
          git config user.email "noreply@teststuff.net"
          # The pin branch must sit on CURRENT master, not this job's checkout: if master moved
          # (or a stale pin branch lingers), the pushed tree's .github/workflows/* differ from
          # master's and GitHub rejects the App push as "updating a workflow file without
          # workflows permission" — over files this bump never touches (live 2026-07-26: a
          # renovate.yaml comment edit that landed on master mid-build). Re-apply the sed on
          # fresh master. NEVER delete the branch first: delete+recreate while a pin PR is
          # open desyncs the PR's head (mergeable stuck UNKNOWN — wedged #1133 and #1142);
          # the force-push below replaces a stale ref via a clean `synchronize` instead.
          git fetch origin master && git checkout -B "$BRANCH" origin/master
          sed -i -E "s|(arc-runner:)[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-g[0-9a-f]{12}|\1${{ steps.tag.outputs.tag }}|g" \
            argocd/platform/arc-runners.yaml agents/coordinator/sentinel-argo.yaml argocd/resources/runner-image-prepull/daemonset.yaml
          git diff --quiet argocd/platform/arc-runners.yaml agents/coordinator/sentinel-argo.yaml argocd/resources/runner-image-prepull/daemonset.yaml && { echo "pin already current on fresh master" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git add argocd/platform/arc-runners.yaml agents/coordinator/sentinel-argo.yaml argocd/resources/runner-image-prepull/daemonset.yaml
          git commit -m "arc-runners: pin runner image ${{ steps.tag.outputs.tag }} (auto-bump after build)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "HEAD:$BRANCH"
          PR="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            PR="$(gh pr create --repo "${{ github.repository }}" --base master --head "$BRANCH" \
              --label automerge,dependencies \
              --title "arc-runners: pin runner image ${{ steps.tag.outputs.tag }}" \
              --body "Auto-bump after a runner-image build (FU-015 closed loop): the warm store + eval cache only work if the scale set runs the image baked from current locks. CI-gated (argocd-validate-pins); auto-merges." \
              | grep -oE '[0-9]+$')"
          fi
          gh pr merge --auto --squash "$PR" --repo "${{ github.repository }}"
          echo "pin PR #$PR armed for ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
