# update-pr-branch.reusable.yml — the merge-path UPDATER (FU-041), as a REUSABLE org workflow. One
# implementation for every agent repo; a repo carries only a caller:
#
#   # .github/workflows/update-pr-branch.yml
#   name: update-pr-branch
#   on:
#     push: { branches: [master] }
#     workflow_run: { workflows: [CI], types: [completed] }
#     schedule: [{ cron: "*/15 * * * *" }]
#     workflow_dispatch: {}
#   concurrency: { group: update-pr-branch, cancel-in-progress: false }
#   jobs:
#     update:
#       uses: teststuffstash/homelab/.github/workflows/update-pr-branch.reusable.yml@master
#       secrets: inherit
#
# Keeps exactly ONE PR current with master so GitHub auto-merge can fire (the ruleset requires an
# up-to-date branch). `adRise/update-pr-branch` merges master into the oldest green + auto-merge-armed +
# behind PR (FIFO, one per run, update-BEFORE-review). MUST use the homelab-merge App token, not
# GITHUB_TOKEN (a GITHUB_TOKEN push doesn't re-trigger `ci`, so a strict branch never sees green). In a
# called workflow `github.repository`/`$GITHUB_REPOSITORY` = the CALLER repo, so this is repo-agnostic.
# See docs/agents/merge-path.md §Chosen design ▸2 + §Updater token.
name: update-pr-branch-reusable

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write
  issues: write # label conflicted PRs (Phase 3)

jobs:
  update:
    # Doorbell dedup (2026-07-24, merge-path-fsm MP-T02): master-push bursts collapse to the
    # running run + the LATEST queued one — safe because the updater is LEVEL-TRIGGERED (each run
    # re-reads the world; a push is only a doorbell, so only never-started duplicate runs drop).
    # cancel-in-progress MUST stay false: killing an in-flight run can drop the 422→merge-conflict
    # labeling (MP-T06) and silently park a DIRTY PR — the loop-lock class. Billing: each run
    # rounds up to 1 hosted minute; bursts were ~1,415 min/mo across the private repos.
    concurrency:
      group: update-pr-branch-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest # GitHub-hosted: the merge path must not depend on the self-hosted tier being awake (API-only, seconds)
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_GH_APP_ID }}
          private-key: ${{ secrets.MERGE_GH_APP_PRIVATE_KEY }}

      - name: Update the oldest behind, green, auto-merge-armed PR
        uses: adRise/update-pr-branch@v0.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: master
          required_approval_count: 0 # update BEFORE review
          # false (2026-07-10): 'true' wedges — a base-side CI fix can only reach a PR through an
          # update, but this gate refused updates while the PR's checks were red FROM the base-side
          # bug (deploy-pins #20/#21 stuck after the lint fix; same shape as the changesRequested
          # deadlock). Updating a red PR is harmless: strict checks re-run and still gate the merge.
          require_passed_checks: 'false' # only update green PRs
          require_auto_merge_enabled: true # only PRs actually queued to land (arming is the boundary)
          sort: created
          direction: asc # FIFO

      # ── the CR∧BEHIND crack (2026-08-12, found on homelab#398 twice in one hour) ────────────
      # The action above skips CHANGES_REQUESTED PRs (its documented changesRequested shape), and
      # the review reflex only lifts green+CURRENT PRs — so an armed PR that gets a verdict, a
      # fix push, and then watches master move sits in a state NO machine serves: the reflex
      # waits for current, the updater waits for the verdict to clear.
      # ⚠ NARROWED 2026-08-17 (measured: 34 of 118 branch-update merges + ~35 of 69 CI runs
      # that day were this belt keeping UNMERGEABLE PRs current — #473 ×16 while parked, #475
      # ×18 while breaker-latched). "Over-updating is harmless" is false on a busy master: the
      # crack only exists when a FIX PUSH has landed after the verdict (that is what the reflex
      # is waiting to re-review at a current head). So the belt now fires ONLY when the newest
      # NON-MERGE commit post-dates the newest reviewer verdict (the reflex's reviewable_again
      # shape — updater merge commits are NOT content, or the belt feeds itself), and never on
      # agent/error / agent/arbitrate PRs (breaker-latched: humans own those). Unreadable
      # commit/review data HOLDS with a line, never updates — the */15 cron retries.
      - name: Unstrand changes-requested PRs (the CR-and-behind crack, new-content-gated)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,mergeStateStatus,autoMergeRequest,reviewDecision,labels \
          | jq -r '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND"
                                and .reviewDecision == "CHANGES_REQUESTED"
                                and (([.labels[].name] | index("agent/error")) == null)
                                and (([.labels[].name] | index("agent/arbitrate")) == null)) | .number' \
          | while read -r n; do
              pj="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json commits,reviews 2>/dev/null)" || pj=""
              verdict_ok=""
              if [ -n "$pj" ]; then
                verdict_ok="$(printf '%s' "$pj" | jq -r '
                  ([.commits[] | select(.messageHeadline | startswith("Merge branch ") | not)
                     | .committedDate] | max) as $c
                  | ([.reviews[] | select(.author.login | startswith("homelab-reviewer"))
                       | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                       | .submittedAt] | max) as $v
                  | if ($c != null and $v != null and $c > $v) then "yes" else "no" end' 2>/dev/null)" || verdict_ok=""
              fi
              case "$verdict_ok" in
                yes)
                  echo "unstrand: updating CR-and-behind PR #$n (new content since verdict)"
                  gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$n/update-branch" \
                    || echo "unstrand: update of #$n failed (conflict? next run retries)" ;;
                no)
                  echo "unstrand: #$n CR-and-behind but NO new content since the verdict — nothing to re-review, not updating (2026-08-17 narrowing)" ;;
                *)
                  echo "unstrand: #$n commit/review probe unreadable — HOLDING, not updating (rule #6; the */15 cron retries)" ;;
              esac
            done

      - name: Flag conflicted PRs (updater can't auto-resolve these)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Defensive: `gh pr edit --add-label` FAILS on a missing label, so create it idempotently
          # first (labels.tf provisions it via tofu, but this survives a not-yet-applied repo or a
          # deleted label — the reflex must never hard-fail and block the merge path).
          gh label create merge-conflict --repo "$GITHUB_REPOSITORY" --color e11d21 \
            --description "PR branch conflicts with master — updater can't auto-resolve" --force >/dev/null 2>&1 || true
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,mergeStateStatus,autoMergeRequest,labels \
          | jq -c '.[]' | while read -r pr; do
              n=$(printf '%s' "$pr" | jq -r '.number')
              armed=$(printf '%s' "$pr" | jq -r '.autoMergeRequest != null')
              dirty=$(printf '%s' "$pr" | jq -r '.mergeStateStatus == "DIRTY"')
              has=$(printf '%s' "$pr" | jq -r '[.labels[].name] | index("merge-conflict") != null')
              if [ "$armed" = "true" ] && [ "$dirty" = "true" ]; then
                [ "$has" = "true" ] || gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --add-label merge-conflict
              elif [ "$has" = "true" ]; then
                gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label merge-conflict || true
              fi
            done
