# pin-only.reusable.yml — the `.github/workflows` pin-only lint as a REUSABLE org workflow
# (ADR-100 addendum 2026-09-25, homelab#1990): the rule that replaces the code owner on action
# digest bumps in every platform repo. Rollout: agent-coordinator → openrouter-operator →
# agent-runtime → homelab (homelab runs the script directly from ci.yaml). A caller carries only:
#
#   # .github/workflows/pin-only.yml
#   name: pin-only
#   on:
#     pull_request:
#       branches: [master]
#   permissions:
#     contents: read
#   jobs:
#     pin-only:
#       uses: teststuffstash/homelab/.github/workflows/pin-only.reusable.yml@master
#
# The script comes from homelab MASTER (a sparse checkout beside the caller's tree) — a fix here
# reaches every caller at once, the first-party @master contract. `gh` comes from homelab's
# devbox.json; the ARC runner image bakes nix + devbox + the warm store (FU-015), so the run is
# a warm `devbox run`, not an install. Make the caller's `pin-only` check REQUIRED in
# tofu/github/repo_rulesets.tf for the un-owning to be a replacement, not a removal.
name: pin-only-reusable

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  pin-only:
    runs-on: homelab-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # the caller's PR merge ref (refs/pull/N/merge)

      - name: Fetch homelab's lint at master (script + devbox toolchain)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: teststuffstash/homelab
          ref: master
          path: .homelab-lint
          sparse-checkout: |
            scripts/pin-only-lint.sh
            devbox.json
            devbox.lock
          sparse-checkout-cone-mode: false

      # homelab#1441: diff against the PR's base SHA AT EVENT TIME — the merge commit's first
      # parent — never the base BRANCH tip (a merely-behind PR would go red on files master
      # added since). base.sha is depth-independent and exact.
      - name: Guarded files may only receive pin bumps (pin-only-lint)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PIN_ONLY_REPO: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          devbox run --config "$GITHUB_WORKSPACE/.homelab-lint" -- bash "$GITHUB_WORKSPACE/.homelab-lint/scripts/pin-only-lint.sh" "$BASE_SHA"
