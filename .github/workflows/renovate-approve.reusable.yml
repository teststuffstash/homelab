# renovate-approve.reusable.yml — the "reviewer approves Renovate" reflex, as a REUSABLE org workflow
# (FU-014/FU-041). One implementation for every agent repo; a repo carries only a 3-line caller:
#
#   # .github/workflows/renovate-approve.yml
#   name: renovate-approve
#   on:
#     pull_request_target:
#       types: [opened, reopened, synchronize, labeled]
#   permissions: {}
#   jobs:
#     approve:
#       uses: teststuffstash/homelab/.github/workflows/renovate-approve.reusable.yml@master
#       secrets: inherit
#
# Renovate's `automerge`-labelled PRs arm GitHub auto-merge but the repo's required-approval ruleset
# needs a DISTINCT approving review (Renovate can't self-approve). The homelab-reviewer App posts it — a
# separate identity SATISFIES the rule (not a bypass; a GitHub App bypass can't waive an approval on a
# merge anyway, ADR-084). CI (the tests) is the real gate; this is the mechanical rubber-stamp.
#
# In a called workflow the `github` context = the CALLER's repo + PR event, so this is repo-agnostic:
# it approves the caller repo's PR. `secrets: inherit` passes the org REVIEWER_APP_* secrets.
# pull_request_target (set by the caller) runs base-branch code with secrets and checks out NO head code.
name: renovate-approve-reusable

on:
  workflow_call: {}

permissions: {} # uses the reviewer App token, not GITHUB_TOKEN

jobs:
  approve:
    if: >-
      github.event.pull_request.user.type == 'Bot' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: homelab-ephemeral
    # SERIALIZE per PR (homelab#114, 2026-08-11): one `labeled` event fires PER LABEL, so a
    # producer adding automerge+dependencies spawns concurrent instances that all pass the
    # dup-check below before any of them posts (PR#236: two APPROVEDs in the same minute at one
    # head). cancel-in-progress is safe — every instance re-derives from live state, so the
    # surviving latest one does the right thing.
    concurrency:
      group: renovate-approve-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Skip gracefully (don't hard-fail every dep PR) if the reviewer secrets aren't wired yet — a red
      # job here becomes a failed check that (require_passed_checks) blocks the FU-041 updater. Never gate
      # the merge path on this auxiliary reflex.
      - name: Reviewer secret present?
        id: gate
        env:
          RID: ${{ secrets.REVIEWER_APP_ID }}
        run: |
          if [ -n "$RID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::REVIEWER_APP_ID not set — run 'devbox run github-tofu apply'. Skipping auto-approve; the dep PR just waits."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint homelab-reviewer token (scoped to the caller repo)
        if: steps.gate.outputs.ok == 'true'
        id: rev
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # IDEMPOTENCY (2026-08-07). This job fires on opened/reopened/synchronize/labeled, and GitHub
      # emits one `labeled` event PER LABEL — so a producer adding `automerge` + `dependencies` in
      # one `gh pr edit` triggers it three times inside a second. homelab#113 collected FOUR
      # Auto-approved reviews in ~4 min, tripping the review-reflex circuit breaker and latching
      # agent/error on a PR whose only sin was being labelled correctly. Duplicate approvals are
      # harmless to GitHub but not to the loop's loop-detector, so this reflex must be idempotent.
      # Keyed on the HEAD SHA rather than mere existence: dismiss_stale_reviews_on_push drops
      # approvals on a new push, so "APPROVED at the CURRENT head" is exactly "already satisfied",
      # and after a force-push there is none — the re-approve still happens.
      # ⚠ python3 stays a ONE-LINER: a multi-line `python3 -c "` puts code at column 0, which ends
      # the YAML block scalar and makes the whole file unparseable (caught by yq before shipping).
      # jq is deliberately not used — the slim ARC runner image does not guarantee it.
      - name: Already approved at this head?
        id: dup
        if: steps.gate.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.rev.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # FAIL-CLOSED (homelab#114, 2026-08-11): the old shape (`|| body=''` + 2>/dev/null)
          # turned ANY listing failure into "no approval found → approve" — a probe failing INTO
          # a write (rule #6), and the likely path of PR#236's third same-head approval. An
          # unreadable review list now SKIPS: safe by this reflex's own charter (never gate the
          # merge path — the next PR event retries), while approving-on-unknown is what storms.
          if ! body=$(curl -sS --fail -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR/reviews?per_page=100"); then
            echo "::warning::could not LIST reviews for #$PR — skipping approve (fail-closed; next event retries)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! n=$(printf '%s' "$body" | python3 -c "import json,sys,os;rs=json.load(sys.stdin);print(sum(1 for r in rs if isinstance(r,dict) and r.get('state')=='APPROVED' and r.get('commit_id')==os.environ.get('SHA','')))"); then
            echo "::warning::review list unparseable for #$PR — skipping approve (fail-closed; next event retries)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$n" -gt 0 ]; then
            echo "already APPROVED at $SHA ($n review(s)) — skipping; another adds nothing but loop-detector noise"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no approval at $SHA — approving"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve (distinct identity → satisfies required-approval)
        if: steps.gate.outputs.ok == 'true' && steps.dup.outputs.skip != 'true'
        env:
          TOKEN: ${{ steps.rev.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR/reviews" \
            -d '{"event":"APPROVE","body":"Auto-approved: Renovate automerge dep bump — CI is the gate."}')
          echo "review API → HTTP $code"; cat /tmp/resp 2>/dev/null; echo
          [ "$code" = "200" ] || echo "::warning::approve returned $code — PR left unapproved (will retry); not failing so the merge path isn't blocked"
