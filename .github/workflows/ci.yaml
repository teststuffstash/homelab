# homelab CI — the required status check `ci` (tofu/github protected_repos → required-checks ruleset).
# Focused, not a whole-repo lint: it proves every ArgoCD Application that pins an OCI Helm chart RENDERS
# at its pinned version with this repo's values (scripts/argocd-validate-pins.sh). That's the gate that
# stops a deploy-pin bump to a chart version whose new REQUIRED value is missing here from auto-merging
# and only failing at ArgoCD sync. Thin: all logic is `devbox run argocd-validate-pins` (pinned helm/yq),
# so the same gate runs locally. Mirrors sleep-iac's CI.
#
# NO path filter: the required check must REPORT on every PR (a filtered job that doesn't run leaves the
# `ci` context absent → strict ruleset blocks the merge forever). Cheap when no OCI pin changed.
name: CI

on:
  pull_request:
    # goal/** joined 2026-08-23 (operator-direct, overnight v1.2-proof Goal prep): the ruleset
    # requires `ci` on goal/** PRs, and a required check whose workflow never triggers leaves an
    # approved child PR permanently BLOCKED — the ruleset and the trigger move together
    # (docs/agents/issue-authoring.md §Base, the circles coupling trap).
    branches: [master, "goal/**"]
  workflow_dispatch: {}

# One live run per PR (org standard — docs/ci.md §Concurrency): superseded PR heads cancel,
# push/master runs queue serially and never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: homelab-ephemeral
    steps:
      - uses: actions/checkout@v4

      # ── #518 wall-time structure (operator-direct 2026-08-31): the two heavy suites and the
      # pin-bump mirror pre-warm run in the BACKGROUND, overlapping the serial small steps, and
      # are collected at the end of the job — wall ≈ max(heaviest, serial chain) instead of the
      # sum (measured serial shape: prometheus-rules-lint 112–126s + clause-replay 71–79s +
      # smalls ~60s; pre-warm +386s on pin bumps). The heavies also SKIP when the changeset
      # cannot affect them — via step-level `if:` on the changed-paths map below, NEVER via
      # workflow `on.paths` (a filtered-out workflow reports no `ci` context and the strict
      # ruleset blocks the merge forever — the header rule stands). Background processes
      # survive step boundaries within a job; each writes <name>.rc when done and its collect
      # step replays the log and exits with it, so failure attribution stays per-suite.
      # Changed-paths via the API, not git — the checkout is shallow (the ADR-103 ratchet
      # learned this on #214).
      # The warm-up below MUST come first on every event: devbox's first run creates the venv
      # non-atomically, and two concurrent first runs die on EEXIST — proven by this
      # structure's own verification dispatch (run 33409776004, 2026-08-31: the ∥ starts
      # raced validate-pins because the PR-only diff step had skipped).
      - name: Warm the devbox closure (once, before anything runs ∥)
        run: devbox run -- true

      - name: Changed paths (skip map for the background suites)
        id: diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          devbox run -- gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --paginate --jq '.[].filename' > /tmp/ci-changed-files
          prom=false; clause=false
          # prometheus-rules-lint reads every PrometheusRule under argocd/ + tofu/ AND
          # drift-pins the hand-copy fixture files against their CRs — the honest trigger
          # set is the whole manifest tree, not "files named prometheus".
          grep -qE '^(argocd/|tofu/|scripts/prometheus-rules-lint\.sh|devbox\.(json|lock)$)' /tmp/ci-changed-files && prom=true
          # clause-replay extracts its clause blocks from agents/ scripts + manifests and
          # replays fixtures under agents/replay/ — all of it lives under agents/.
          grep -qE '^(agents/|devbox\.(json|lock)$)' /tmp/ci-changed-files && clause=true
          { echo "prom=$prom"; echo "clause=$clause"; } >> "$GITHUB_OUTPUT"
          echo "skip map: prometheus-rules-lint=$prom clause-replay=$clause ($(grep -c . /tmp/ci-changed-files) changed file(s))"

      # FU-158 (operator ruling 2026-08-11: promtool over more per-file self-tests): every
      # PrometheusRule's exprs must parse — kubeconform SKIPS the kind, so this is the only
      # form gate the ~44 alert rules have. Runs ∥; verdict at "— collect" below.
      - name: PrometheusRule exprs parse — start ∥ (devbox run prometheus-rules-lint)
        if: github.event_name != 'pull_request' || steps.diff.outputs.prom == 'true'
        run: |
          # detach fully (own fds, no step pipes) — a leaked step fd can hold the step open
          ( devbox run prometheus-rules-lint; echo $? > /tmp/prom-lint.rc ) > /tmp/prom-lint.log 2>&1 < /dev/null &

      # ADR-103 leg 1: every committed clause replay executes on every push — the generalized
      # harness (agents/replay/, homelab#206). Runs ∥; verdict at "— collect" below.
      - name: Clause replays — start ∥ (devbox run clause-replay)
        if: github.event_name != 'pull_request' || steps.diff.outputs.clause == 'true'
        run: |
          ( devbox run clause-replay; echo $? > /tmp/clause-replay.rc ) > /tmp/clause-replay.log 2>&1 < /dev/null &

      # Mirror pre-warm (#80): when THIS PR changes the runner-image pin, pull the new image's
      # blobs through the LAN ghcr mirror once while CI gates the merge — the ≤maxRunners node
      # herd after the ArgoCD flip then hits a warm cache (pure reads), instead of N concurrent
      # multi-GB _uploads streams (the #80 ENOSPC storm: pin merge → disk full in 36 min).
      # Sits INSIDE the required `ci` job so warm-before-flip ordering is structural — that is
      # why it is backgrounded here rather than moved to a non-required job (#518): the merge
      # must still wait for the warm, it just no longer waits for the warm AND everything else
      # in sequence. Failure must not block a runner update (collect is continue-on-error):
      # nodes fall back to upstream ghcr, and the mirror alerts own that failure mode.
      - name: Pre-warm the ghcr mirror on a runner-image pin bump (#80) — start ∥
        if: github.event_name == 'pull_request'
        run: |
          if grep -qx "argocd/platform/arc-runners.yaml" /tmp/ci-changed-files; then
            IMAGE="$(grep -oE 'ghcr\.io/[^" ]*/arc-runner:[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-g[0-9a-f]{12}' argocd/platform/arc-runners.yaml | head -1)"
            ( bash scripts/warm-registry-mirror.sh "$IMAGE"; echo $? > /tmp/mirror-warm.rc ) > /tmp/mirror-warm.log 2>&1 < /dev/null &
          else
            echo "runner pin untouched — skipping"
            echo 0 > /tmp/mirror-warm.rc; echo "(pin untouched — no warm ran)" > /tmp/mirror-warm.log
          fi

      # No toolchain install: the runner image (docker/arc-runner/, FU-015) bakes single-user
      # Nix + devbox + the LAN nix substituter. `devbox run` fetches the project closure from
      # the in-cluster cache on first use.
      - name: Validate ArgoCD OCI chart pins (devbox run argocd-validate-pins)
        run: devbox run argocd-validate-pins

      # Platform-lane tier 1 (docs/agents/iac-lane.md): argocd/resources/** is deliberately UNOWNED
      # in CODEOWNERS, so CI is its only gate — and the pin check above only proves that OCI charts
      # render, not that the hand-written manifests beside them are valid. kubeconform -strict is
      # what makes "CI-green" mean something for that tier. NB it SKIPS CRs with no local schema and
      # says so loudly; the script fails if it ever validates nothing.
      - name: Schema-validate the raw manifests ArgoCD applies (devbox run manifest-lint)
        run: devbox run manifest-lint

      # The ~250-line responder script EMBEDDED in responder-argo.yaml is the one thing
      # manifest-lint skips entirely (it validates the Sensor CR, not the shell inside it) — and
      # it shipped two bugs in two rounds on homelab#124 alone. The harness extracts the script
      # from the manifest at run time via yq, so it cannot drift from what actually ships (#133).
      - name: Responder behaviour harness (devbox run responder-behaviour-test)
        run: devbox run responder-behaviour-test

      # The ConfigMap-shipped Python (exporters, the proxy/router) is the other thing manifest-lint
      # can't see — it validates the YAML wrapper, never the script inside, so a syntax error only
      # surfaced when ArgoCD rolled the pod (#173, found landing the #153 fix). Parse-only: no
      # imports run, so in-cluster-only deps (kopf) don't break the lint.
      - name: Tracked Python parses (devbox run py-compile-lint)
        run: devbox run py-compile-lint

      # The estimator's assertion suite existed since birth and NOTHING executed it — the
      # written-is-not-applied class, found in the 2026-08-10 coverage audit. The registry math
      # (banding, effective price, provider pin) is the budget breaker's input; keep it gated.
      - name: Budget estimator self-test (devbox run estimate-budget -- --self-test)
        run: devbox run estimate-budget -- --self-test

      # homelab#215 (harvested from PR#214's review): the exporter's own logic tests — goal walk,
      # budget parse, verdict, membership, fallback query — as a gate, not just a deploy-time hope.
      - name: github-exporter self-test (devbox run exporter-self-test)
        run: devbox run exporter-self-test

      # homelab#217 (PR#220's operator finding 1): the spend-probe's rule replay as a gate — it
      # reads the alert exprs OUT of the committed prometheusrule.yaml, so an expr/metric renamed
      # on one side only goes red here instead of rotting silently.
      - name: cloudflare spend-probe self-test (devbox run spend-probe-self-test)
        run: devbox run spend-probe-self-test

      # The #158 rail-degrade contract (leg 1: a subscription-rail dispatch NEVER waits on
      # OpenRouter key state) pinned as an executed replay — launcher blocks extracted from
      # agent-session.sh by sentinel at run time, so the pin cannot drift from the code (#166).
      # 100 assertions, no network, ~2s.
      - name: Rail-degrade contract replay (devbox run rail-degrade-replay)
        run: devbox run rail-degrade-replay

      # #197: the prose-inside-executing-code class (4 instances in 4 days) gets a mechanical
      # guard — jq -Rs used as shell quoting, and $<digit> in an expanding manifest heredoc.
      # Fixtures carry the real pre-fix defects; the self-test runs on every invocation.
      - name: Prompt transport lint (devbox run prompt-transport-lint)
        run: devbox run prompt-transport-lint

      # #198/#201: the state-fingerprint debounce (arbitrate/ci-red dispatch on CHANGE, not
      # existence) pinned as an executed replay — the five scan blocks sentinel-extracted at run
      # time, replaying the PR#234 five-rides-on-frozen-state sequence. 88 assertions, ~1s.
      - name: State-fingerprint debounce replay (devbox run state-fp-replay)
        run: devbox run state-fp-replay

      # The ADR-103 RATCHET: a PR that changes clause-carrying files without touching any replay
      # fixture is red. This does not prove the fixture COVERS the change — it forces the author
      # to look at the replay tree at all, which is the compliance gap the recurrence audit named
      # (every prose-warned class recurred; every executed gate held). Widen the file list as
      # clause code moves; loosen ONLY by ADR.
      - name: Changed clauses carry replay changes (ADR-103 ratchet)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Files via the API, not git: the checkout is SHALLOW (depth 1) and a three-dot diff
          # against a depth-1 base has no merge base — the first version of this step died there
          # on its first-ever PR execution (#214; shipped from the jail lane, so the
          # pull_request branch had never run — the exact unexecuted-gate class ADR-103 exists
          # to kill, in the gate itself). gh comes from devbox (slim runner has no gh).
          changed=$(devbox run -- gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --paginate --jq '.[].filename')
          clause=$(printf '%s\n' "$changed" | grep -E '^agents/(model-scout\.sh|coordinator-scan\.sh|review-reflex\.sh|reviewer-(session|optout)\.sh|machine-comment\.sh|goal-budget\.sh|agent-session\.sh|retro-session\.sh|argv-guard\.sh|coordinator/((reflexes|review|coordinate)[^/]*|responder-argo|retro-argo|fix-debounce-argo|deploy-revert-argo)\.ya?ml)$' || true)
          replay=$(printf '%s\n' "$changed" | grep -E '^agents/replay/' || true)
          # Pin-bump carve-out (found on PR#236, 2026-08-11): reflexes-argo.yaml is BOTH a ratchet
          # clause file AND a pin-only-lint guarded file — a pin-only diff changes no action stream
          # (the canonical "no fixture can apply" case) and pin-only-lint is already its gate.
          # Exempt a clause file iff its ENTIRE patch is pin lines; regexes come from
          # scripts/pin-only-lint.sh itself (one home — a second copy here would drift).
          eval "$(grep -m1 '^GUARDED=' scripts/pin-only-lint.sh)"
          eval "$(grep -m1 '^PIN_LINE=' scripts/pin-only-lint.sh)"
          if [ -n "$clause" ]; then
            kept=""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if printf '%s\n' "$f" | grep -qE "^($GUARDED)$"; then
                patch=$(devbox run -- gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --paginate --jq ".[] | select(.filename==\"$f\") | .patch // \"\"")
                nonpin=$(printf '%s\n' "$patch" | grep -E '^[-+][^-+]' | grep -Ev "$PIN_LINE" || true)
                if [ -n "$patch" ] && [ -z "$nonpin" ]; then
                  echo "ratchet: $f exempt — pin-only diff (pin-only-lint is its gate)"
                  continue
                fi
              fi
              kept="${kept}${f}"$'\n'
            done <<< "$clause"
            clause=$(printf '%s' "$kept")
          fi
          if [ -n "$clause" ] && [ -z "$replay" ]; then
            echo "::error::ADR-103 ratchet: clause files changed with NO replay fixture change:"
            printf '%s\n' "$clause"
            echo "Add/extend a fixture under agents/replay/fixtures/ (or record why none applies IN a fixture README diff)."
            exit 1
          fi
          echo "ratchet: ok (clause files: $(printf '%s' "$clause" | grep -c . || true), replay files touched: $(printf '%s' "$replay" | grep -c . || true))"

      # The two files carved OUT of CODEOWNERS so the arc-runner auto-bump stays hands-off keep a
      # gate — just a deterministic one instead of a human. Only pin lines may reach them via a PR.
      # The findings-store parse/append/advance contract (ADR-106 (3)) — the sibling of
      # exporter/spend-probe/router self-tests, wired for the same reason: an unexecuted
      # assertion suite already bit this repo once (the estimator self-test, 2026-08-10 audit).
      - name: Findings-store self-test (devbox run goal-findings-self-test)
        run: devbox run goal-findings-self-test

      - name: Guarded files may only receive pin bumps (devbox run pin-only-lint)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          devbox run pin-only-lint FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}

      # ADR-106 (4): the .agents/fix.yaml NEVER-TOUCH tier as a machine check — a WORKER-authored
      # diff touching governance paths (.github/.agents/scripts/policy/devbox/CODEOWNERS) is red.
      # Seat/renovate PRs pass (author-scoped); rationale + set live in the script (one home).
      - name: Worker diffs may not touch governance paths (devbox run governance-lint)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          devbox run governance-lint FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: machines/generate.py outputs current (devbox run machines-lint)
        run: devbox run machines-lint

      # tofu paths are CODEOWNERS-gated (a human reads the diff), so CI buys the cheap half only:
      # fmt is free, while `tofu validate` needs a provider download per PR (the FU-130 WAN class).
      # `devbox run tf-validate` stays the local/manual gate.
      - name: OpenTofu formatting (fmt -check, all roots)
        run: devbox run -- tofu fmt -check -recursive tofu/

      # Stale-registration gate (TICK-LOG meta-1: 5/6 reflex gaps were a stack repo missing from a
      # per-identity token list). Interim until the AgentStack XRD (FU-048) renders all from one claim.
      - name: Agents registration lint (stacks.json ⊆ coordinator/reviewer token lists)
        run: devbox run agents-registration-lint
      - name: Merge-path FSM model matches code (devbox run merge-path-lint)
        run: devbox run merge-path-lint
      # ADR-097 double-dispatch belt: the footprint predicate the scan sources, under synthetic
      # rules — a predicate bug must fail HERE, not double-dispatch two workers into one lane.
      - name: Footprint-intersection predicate rules (devbox run footprint-test)
        run: devbox run footprint-test
      - name: Touches escape-set predicate (devbox run touches-check-test)
        run: devbox run touches-check-test
      # FU-127: the model-id rules, plus the drift pin on the proxy's copy of the rail-namespace
      # half (it lives in another deployment unit and cannot import the parser).
      - name: Model-id parse rules + proxy drift pin (devbox run model-id-test)
        run: devbox run model-id-test
      - name: GitHub App mint sites ⊆ declared permissions (FU-098)
        run: devbox run github-apps-lint
      # ADR-096 router: DB round-trip + model-classes.json parse/threshold sanity — the same
      # self-test a deployed pod's module carries.
      - name: Router self-test (devbox run router-self-test)
        run: devbox run router-self-test
      # The proxy's own 12-section suite (rail routing, header allowlist, guardrail, Go-leg
      # isolation). Was cited as evidence across PR#429's five rounds while never executing as
      # a gate — the same unexecuted-suite class as the 2026-08-10 estimator audit (#429 fu).
      - name: Proxy self-test (devbox run proxy-self-test)
        run: devbox run proxy-self-test
      # The jail's model-splitting shim — same unexecuted-suite class: its 18-check suite was
      # #446's evidence while nothing ran it in CI (reviewer-flagged on that PR; the proxy
      # self-test above got this exact fix in the Go wave, 0616d31).
      - name: Shim self-test (devbox run shim-self-test)
        run: devbox run shim-self-test
      # FU-tracker conventions: dangling ids + broken pointers FAIL; oversize/done-marker WARN.
      # In CI because the 2026-07 tracker bloat (258→1000 lines) happened under convention-only
      # discipline — see docs/follow-ups.md "Conventions".
      - name: FU tracker lint (devbox run follow-ups-lint)
        run: devbox run follow-ups-lint

      # Doc graph: relative .md links resolve + the agents doc table indexes every agents doc
      # (dangling/orphan FAIL in living docs, WARN in historical ones). The reader-side rule
      # (CLAUDE.md "Design questions run full-context") enters at the doc table and chases
      # links — this lint is what keeps that entry point trustworthy between grooms.
      - name: Docs graph lint (devbox run docs-graph-lint)
        run: devbox run docs-graph-lint

      # Mermaid parse-lint: every tracked ```mermaid block through mermaid's own parser (jsdom,
      # no browser) — a diagram GitHub refuses to render fails HERE, not on a reader
      # (docs/README.md §Conventions; the docs/agents/README.md worked-example was unrenderable
      # for weeks). ~3s npm ci + ~1.5s parse; deps pinned in scripts/mermaid-lint/package-lock.json.
      - name: Mermaid parse lint (devbox run mermaid-lint)
        run: devbox run mermaid-lint

      # ── collect the ∥ suites started at the top of the job (#518). Each waits for its rc
      # file, replays the full log, and exits with the suite's own code — a hung/killed
      # background run fails loudly at the timeout instead of hanging the job to its 6h default.
      - name: Clause replays — collect (started ∥ above)
        if: github.event_name != 'pull_request' || steps.diff.outputs.clause == 'true'
        run: |
          for i in $(seq 1 600); do [ -f /tmp/clause-replay.rc ] && break; sleep 1; done
          [ -f /tmp/clause-replay.rc ] || { echo "::error::clause-replay never finished (background run died?)"; cat /tmp/clause-replay.log 2>/dev/null; exit 1; }
          cat /tmp/clause-replay.log
          exit "$(cat /tmp/clause-replay.rc)"

      # FU-158: behaviour tests (promtool test rules) ride the same script — see the start step.
      - name: PrometheusRule exprs parse — collect (started ∥ above)
        if: github.event_name != 'pull_request' || steps.diff.outputs.prom == 'true'
        run: |
          for i in $(seq 1 900); do [ -f /tmp/prom-lint.rc ] && break; sleep 1; done
          [ -f /tmp/prom-lint.rc ] || { echo "::error::prometheus-rules-lint never finished (background run died?)"; cat /tmp/prom-lint.log 2>/dev/null; exit 1; }
          cat /tmp/prom-lint.log
          exit "$(cat /tmp/prom-lint.rc)"

      # continue-on-error: a mirror outage must not block a runner update (#80 — see the start
      # step for why this still gates the merge at all).
      - name: Pre-warm the ghcr mirror — collect (started ∥ above)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          for i in $(seq 1 1200); do [ -f /tmp/mirror-warm.rc ] && break; sleep 1; done
          [ -f /tmp/mirror-warm.rc ] || { echo "::error::mirror pre-warm never finished"; cat /tmp/mirror-warm.log 2>/dev/null; exit 1; }
          cat /tmp/mirror-warm.log
          exit "$(cat /tmp/mirror-warm.rc)"
