# Smart-plug power monitoring — uniform, query-friendly sensors.
#
# Every plug gets sensor.plug_<box>_power (W) and sensor.plug_<box>_voltage (V), so a single
# Prometheus selector catches them all:
#     homeassistant_sensor_power_w{entity=~"sensor.plug_.+_power"}
#     homeassistant_sensor_voltage_v{entity=~"sensor.plug_.+_voltage"}
# The raw integration entities are excluded from the scrape in prometheus.yaml.
#
# SOURCE: tuya_local (LAN), not the Tuya cloud — cut over 2026-08-07 (FU-038) after the cloud
# froze every plug for nine days while still reporting them `available` (docs/power-measurements.md).
# These templates are the stable public names; swapping what feeds them is why the indirection
# exists.
#
# ⚠ THE /10 CORRECTION IS GONE, deliberately. The cloud reported the two NOUS A1 sockets in
# deci-watts, so thinkcentre/hp were divided by 10 here. tuya_local applies that scaling
# itself from the device profile — verified live: raw cloud 358.0 vs tuya_local 35.8 for thinkcentre,
# 329.0 vs 32.9 for hp. Re-adding a /10 would make the readings ten times too small.
#
# Plug -> box map: pve = "K&M black 1"; opnsense = "Smart plug 2"; laptop3 = "Smart plug 3" =
# X240 (wk-metal-01); laptop4 = "Smart plug 4" = X250 (wk-metal-02); thinkcentre / hp =
# the two NOUS A1 sockets (RENAMED 2026-08-18 from aquarium / konditsioneer; the tuyalocal_*
# entity ids were renamed in the HA registry, so history under the old names ends 2026-08-18).
# ⚠ That rename was CROSSED until 2026-09-09: the id named `thinkcentre` sat on the socket feeding
# hp-01 and vice versa — a seat session power-cycled hp-01 believing it was booting thinkcentre
# (docs/incidents/2026-09-09-crossed-plug-hp01-outage.md). Fixed by swapping the entity ids in
# the registry (device 06001461… = hp-01 = `tuyalocal_hp_*`, device 31743873… = thinkcentre =
# `tuyalocal_thinkcentre_*`), so plug_* history between 08-18 and 09-09 belongs to the OTHER box.
# Device material (id/key/IP/version): wallet `tuya-local`/devices.json.
# Source of truth in git; copied into the HA /config PV.
template:
  - sensor:
      - { name: "Plug pve power",   unique_id: plug_pve_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_pve_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_pve_power')   | float(0) }}" }
      - { name: "Plug pve voltage", unique_id: plug_pve_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_pve_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_pve_voltage') | float(0) }}" }
      - { name: "Plug opnsense power",   unique_id: plug_opnsense_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_opnsense_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_opnsense_power')   | float(0) }}" }
      - { name: "Plug opnsense voltage", unique_id: plug_opnsense_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_opnsense_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_opnsense_voltage') | float(0) }}" }
      - { name: "Plug laptop3 power",   unique_id: plug_laptop3_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_laptop3_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_laptop3_power')   | float(0) }}" }
      - { name: "Plug laptop3 voltage", unique_id: plug_laptop3_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_laptop3_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_laptop3_voltage') | float(0) }}" }
      - { name: "Plug laptop4 power",   unique_id: plug_laptop4_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_laptop4_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_laptop4_power')   | float(0) }}" }
      - { name: "Plug laptop4 voltage", unique_id: plug_laptop4_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_laptop4_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_laptop4_voltage') | float(0) }}" }
      - { name: "Plug thinkcentre power",   unique_id: plug_thinkcentre_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_thinkcentre_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_thinkcentre_power')   | float(0) }}" }
      - { name: "Plug thinkcentre voltage", unique_id: plug_thinkcentre_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_thinkcentre_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_thinkcentre_voltage') | float(0) }}" }
      - { name: "Plug hp power",   unique_id: plug_hp_power,   unit_of_measurement: "W", device_class: power,   state_class: measurement, availability: "{{ states('sensor.tuyalocal_hp_power')   not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_hp_power')   | float(0) }}" }
      - { name: "Plug hp voltage", unique_id: plug_hp_voltage, unit_of_measurement: "V", device_class: voltage, state_class: measurement, availability: "{{ states('sensor.tuyalocal_hp_voltage') not in ['unknown','unavailable','none'] }}", state: "{{ states('sensor.tuyalocal_hp_voltage') | float(0) }}" }
