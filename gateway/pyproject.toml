[project]
name = "agent-gateway"
version = "0.1.0"
description = "LLM egress gateway for the agent fleet — the credential boundary, session-scoped model resolution, three rails (anthropic / openrouter / opencode). Spec-first island (homelab gateway/, ADR-139, P2)."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "starlette>=1.3.1,<2",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raw Allure results for every run (conventions § Prime rule): `devbox run evidence` turns them
# into evidence.json + digest.md + per-rule md via the pinned allure-behavior-snippets wheel.
# --allure-no-capture: pytest's captured logging never rides into the Allure results as a flat test-level
# `log` attachment (the control-plane observe WARNING on every session) — no row's value rests on it, and a
# flat attachment is what ATTACH_BULK counts past the step-bound exchanges (CONVENTIONS.md § Hygiene codes).
# Captured logs still print in pytest's own failure output; rows that claim a log line read caplog.
addopts = "--alluredir=allure-results --clean-alluredir --allure-no-capture"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "rule(id): the spec requirement this decision table proves (GW-…); fails at collection when specs/ has no such heading",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
# ADR-143 floor (lock-intake-lint): a resolved version must be ≥ 7 days old. Bump this date when relocking.
exclude-newer = "2026-10-08T00:00:00Z"
