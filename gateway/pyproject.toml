[project]
name = "agent-gateway"
version = "0.1.0"
description = "LLM egress gateway for the agent fleet — the credential boundary, session-scoped model resolution, three rails (anthropic / openrouter / opencode). Spec-first island (homelab gateway/, ADR-139, P2)."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "starlette>=0.46,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "rule(id): the spec requirement this decision table proves (GW-…); fails at collection when specs/ has no such heading",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
