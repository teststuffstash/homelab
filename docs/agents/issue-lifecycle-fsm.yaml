    guards:
      - desc: "persistence guard — never actuate on the same instant of state the scan first saw"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_PERSIST_S" }
      - desc: "merged-PR requirement — without a merged PR mentioning the issue, the close may be unrelated to agent work; holding beats guessing"
        anchor: { file: agents/coordinator-scan.sh, pattern: "NOT mentioned by any merged PR" }
      - desc: "add agent/done FIRST, remove the stale label SECOND, then re-read and prove the end state (the edit is not atomic — IL-T16's lesson)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ORDER IS LOAD-BEARING" }
      - desc: "probe failure holds every candidate and writes nothing (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "the phantom-label belt held every candidate" }
      - desc: "human-gate exclusion — agent/error is never auto-relabeled by the belt"
        anchor: { file: agents/coordinator-scan.sh, pattern: "agent/error" }
    incidents:
