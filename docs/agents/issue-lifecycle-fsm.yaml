      - desc: "human-gate exclusion — agent/blocked and agent/error are never re-queued by the belt (mirrors C4C5_SEL); a re-queue would hand a human-held issue back to dispatch"
        anchor: { file: agents/coordinator-scan.sh, pattern: "a human gate is never re-dispatched" }
    incidents:
