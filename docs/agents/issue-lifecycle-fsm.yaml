  - id: IL-T29
    name: goal child + AGENT_STRIKE + resumable branch → decidable, emit --work-branch (the narrowed hold)
    owner: coordinator-scan, deterministically — no LLM tick in the path
    when: "goal child ∧ agent/in-progress ∧ no OPEN PR referencing ∧ the issue's newest anchored
      `AGENT_STRIKE:` comment carries a `Resumable branch pushed: <branch>` line ⇒ DECIDABLE —
      emit the ordinary C4/C5 unit carrying the branch so the session resumes with `--work-branch
      <branch>` (never a restart). No strike / no resumable branch / unreadable probe ⇒ held
      exactly as today (the FU-143/IL-G06 asymmetry stands unchanged). Loop guard: a resumed
      round that strikes again with the same (model, error_class) pair follows the existing
      second-strike rule (the agent/error STRIKE-channel path) — the narrowed hold must not
      create a strike→resume→strike loop."
    status: guarded
    replay:
