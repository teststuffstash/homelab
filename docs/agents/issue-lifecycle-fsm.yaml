  - id: IL-T11
    name: goal-decompose
    owner: coordinator item session (reasoning tier — GOAL_MODEL, default opus)
    when: "queued goal → children authored as native sub-issues (Base: inherited, Touches: narrowed, coverage map) and QUEUED; parent → agent/blocked tracking"
    status: guarded
