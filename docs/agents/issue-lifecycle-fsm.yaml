        anchor: { file: agents/coordinator-session.sh, pattern: 'goal-decompose.goal-checkpoint\) RESOLVE_CLASS' }

  - id: IL-T12
    name: goal burn-down (deterministic) + goal-checkpoint on triggers (ADR-106 (3), was per-closure goal-review)
    owner: scan goal lane (burn-down, zero tokens) → coordinator goal-checkpoint session (reasoning tier)
