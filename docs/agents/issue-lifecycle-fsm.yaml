# issue-lifecycle-fsm.yaml — THE machine-readable model of the ISSUE lifecycle, goal lane included.
#
# WHY (2026-08-06, after the FU-143 arc): merge-path-fsm.yaml models the PR; nobody modeled the
# ISSUE — and the goal lane's bugs were all issue-state cells (a child that cannot close, a
# re-dispatch onto merged work, a goal-review that reads only direct children). Same treatment,
# same lint: every guard carries a code ANCHOR that must still grep (`devbox run merge-path-lint`),
# every gap carries an fu:/accepted: disposition, and issue-lifecycle-fsm.md is GENERATED from
# here — never hand-edited. The lane doctrine in one line: the MASTER lane human-gates per issue
# (breaker #1 triage) because auto-merge lands its code with no human; the GOAL lane human-gates
# at the BOUNDARY (queue the goal in, merge the assembly out) and is autonomous inside it.
#
# Statuses: guarded (mechanical guard + anchor) | report-only (surfaced, human acts) |
#           github-native (GitHub's own gate) | gap (known missing guard — needs fu/accepted).

title: "Issue lifecycle & goal lane"
narrative: issue-authoring.md   # the design-narrative doc this machine models
# THE ISSUE machine. The PR it spawns runs merge-path-fsm.yaml; the -iac wrappers run
# iac-lane-fsm.yaml. Where the machines touch: a PR merging is THIS machine's close event.
diagram: |
  stateDiagram-v2
      [*] --> Inert: authored — harvest / janitor / responder (IL-T01)
      Inert --> Queued: human triage (IL-T02) | responder selfQueue (IL-T03)
      Queued --> Queued: held — deps / footprint / WIP / PR-cap (IL-T04)
      Queued --> InProgress: queued-dispatch → ride opens PR (IL-T05)
      InProgress --> InProgress: worker died → c4c5-redispatch (IL-T06)
      InProgress --> Queued: phantom label, persisted → scan reconciles it (IL-T16)
      InProgress --> ClosedByMerge: PR merges into MASTER — keyword fires (IL-T07)
      InProgress --> MergedIntoGoal: PR merges into goal/** — keyword INERT (IL-T08)
      MergedIntoGoal --> ClosedByMerge: FU-143 widened C6 closes it (IL-T08)
      ClosedByMerge --> Done: merged-closeout — verify, flip, harvest (IL-T09)
      Done --> [*]
      state GoalLane {
          [*] --> GoalQueued: human authors AND queues (breaker up, IL-T10)
          GoalQueued --> GoalTracking: goal-decompose authors+queues children (IL-T11)
          GoalTracking --> GoalTracking: goal-review on any DESCENDANT close (IL-T12)
          GoalTracking --> GoalTracking: post-launch bucket ensured, one per goal (IL-T17)
          GoalTracking --> AssemblyOpen: assembly-complete → assembly PR armed (IL-T13)
          AssemblyOpen --> PostLaunch: codeowner + human merge — a MIDPOINT, goal stays OPEN (IL-T14/IL-T18)
          PostLaunch --> PostLaunch: goal-review on any DESCENDANT close (IL-T12)
          PostLaunch --> [*]: goal/validated → closed met + close sweep (IL-T19)
          PostLaunch --> [*]: goal/reverted → closed refuted, descendants close with it (IL-T20)
          PostLaunch --> [*]: goal/abandoned → closed not-planned, descendants inert (IL-T21)
      }
      note right of GoalLane
          the three terminals are HUMAN verdicts (Verdict-authority:);
          the loop reacts to the label and never rules one — a
          Bot-applied verdict is refused, fail-closed (IL-T19/20/21)
      end note
      note right of Inert
          a sprout of a GOAL descendant is filed into that
          goal's post-launch bucket (IL-T17), and skips Inert
          ONLY while the goal is open AND funded (IL-T15)
      end note

axes:
  labels: [inert, queued, in_progress, review, done, error, blocked_tracking]  # agent/* + agent-fix
  lane: [master, goal_child, goal_parent, responder]        # decided by Base:/task-goal, not provenance
  base: [master, goal_branch]                                # the Base: body line — the close key
  lineage_depth: [0, 1, 2]                                   # native sub-issue chain; reviewer stops Follow-ups at ≥2
  budget: [within, exhausted]                                # Σ descendant caps vs the goal Budget:

events:
  authored: "a play files an issue (harvest bullet / janitor draft / responder alert / goal decompose)"
  human_triage: "a human applies agent-fix + agent/queued (or closes as noise)"
  dispatched: "the scan emits a unit; the launcher opens a ride (WIP=1, pod-name key)"
  pr_merged_master: "the ride's PR merges into master — GitHub closing keyword fires"
  pr_merged_goal: "the ride's PR merges into its declared goal/** base — keyword INERT"
  worker_terminal: "the ride died with no open PR referencing the issue"
  descendant_closed: "any issue in the goal's sub-issue closure closes"
  assembly_complete: "goal-review rules the acceptance BUILT AS SPECIFIED (renamed from goal_met, ADR-102 — it never meant 'idea validated')"
  assembly_merged: "the goal→master PR merges (human codeowner act) — a MIDPOINT, not the end"
  verdict_applied: "the goal's Verdict-authority applies goal/validated | goal/reverted | goal/abandoned"

transitions:
  - id: IL-T01
    name: authored inert (master lane)
    owner: merged-closeout play (harvest) / janitor tick (spec-gap drafts)
    when: "authored on the MASTER lane → no agent-fix, no agent/queued; 🌱-reported until a human triages"
    status: guarded
    replay:
      - agents/replay/fixtures/unblocked-unlabeled-surfaces
      - agents/replay/fixtures/unblocked-unlabeled-blocker-open
    replay:
      - agents/replay/fixtures/unblocked-unlabeled-surfaces
      - agents/replay/fixtures/unblocked-unlabeled-blocker-open
    guards:
      - desc: "the play forbids self-labeling (loop-safety breaker #1)"
        anchor: { file: agents/coordinator/README.md, pattern: "never add .agent-fix. or .agent/queued." }
      - desc: "the scan surfaces untriaged bot-authored issues every pass"
        anchor: { file: agents/coordinator-scan.sh, pattern: "bot-authored, awaiting human triage" }
    incidents: ["2026-07-31 sleep harvest: 3 of 5 sprouts were noise — the triage gate is where they died"]

  - id: IL-T02
    name: human adoption
    owner: the operator
    when: "human labels agent-fix + agent/queued, or closes as noise — the master lane's ONLY human gate"
    status: report-only

  - id: IL-T03
    name: responder selfQueue (alert lane)
    owner: responder-argo shell (not the session)
    when: "alert-filed issue + three fail-closed gates: not self-referential, Touches: declared, no governance path"
    status: guarded
    replay:
      - agents/coordinator/responder-behaviour-test.sh
      - agents/replay/fixtures/responder-reopen-fix-verdict
      - agents/replay/fixtures/responder-reopen-report-only
    replay:
      - agents/coordinator/responder-behaviour-test.sh
      - agents/replay/fixtures/responder-reopen-fix-verdict
      - agents/replay/fixtures/responder-reopen-report-only
    guards:
      - desc: "the three deterministic gates label from the SHELL"
        anchor: { file: agents/coordinator/responder-argo.yaml, pattern: "selfQueue" }

  - id: IL-T04
    name: queued but held
    owner: coordinator-scan queued clause
    when: "open Depends-on (native ∪ body line) / footprint intersection / repo WIP ceiling / open-PR cap"
    status: guarded
    replay:
      - agents/replay/fixtures/depends-on-retired-format
    replay:
      - agents/replay/fixtures/depends-on-retired-format
    guards:
      - desc: "dependency gate (FU-087) — blocked issues report, never dispatch"
        anchor: { file: agents/coordinator-scan.sh, pattern: "queued-blocked" }
      - desc: "ADR-097 footprint hold — declared Touches: intersect ⇒ held"
        anchor: { file: agents/coordinator-scan.sh, pattern: "busy_fps" }
      - desc: "repo WIP ceiling (ADR-097 hard max)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "REPO_MAX_WIP" }

  - id: IL-T05
    name: queued-dispatch
    owner: scan (schedules ONE unit) → coordinator item session (judges) → launcher (opens the ride)
    when: "agent-fix ∧ agent/queued ∧ ¬direction-change ∧ ¬agent/error ∧ nothing held"
    status: guarded
    unreplayed: "scan priority + pod-name key (kubectl-create semantics) — backfill by fix-density"
    unreplayed: "scan priority + pod-name key (kubectl-create semantics) — backfill by fix-density"
    guards:
      - desc: "the queued-dispatch unit rides the priority list (in-flight recovery first)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'queued-dispatch\|' }
      - desc: "launcher dispatch idempotency — the pod name IS the (task, round) key"
        anchor: { file: agents/agent-session.sh, pattern: "the key IS the pod name" }
      - desc: "a task/goal issue routes to goal-decompose, NEVER to a worker recipe"
        anchor: { file: agents/coordinator-scan.sh, pattern: "BREAKER #1, moved UP" }

  - id: IL-T06
    name: abandoned in-progress → c4c5 re-dispatch
    owner: scan C4/C5 clause
    when: "agent/in-progress ∧ no Running worker ∧ no OPEN PR referencing ∧ NOT merged-into-goal (FU-143) ∧ NOT reconciled by IL-T16 this pass"
    status: guarded
    unreplayed: "the single C4C5 selector makes this one fixture — on its next touch"
    unreplayed: "the single C4C5 selector makes this one fixture — on its next touch"
    guards:
      - desc: "the FU-143 exclusion — merged-into-goal is finished work, not abandonment"
        anchor: { file: agents/coordinator-scan.sh, pattern: "FU-143 point 2" }
      - desc: "agent/error invisible to the clause (FU-069 breaker)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'index\("agent/error"\)' }
      - desc: "ONE selector for the abandoned predicate — the unit, the report and the IL-T16 belt cannot drift apart"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_SEL=" }
    incidents: ["2026-08-05 circles#22: pre-FU-143, C4/C5 re-rode a merged child — breakage #1 of three"]

  - id: IL-T16
    name: phantom in-progress reconciled → queued (the belt)
    owner: coordinator-scan, deterministically — no LLM tick in the path
    when: "IL-T06's predicate ∧ the state PERSISTED past C4C5_PERSIST_S (issue quiet AND no ride pod
      gone terminal within the window) ∧ no MERGED PR mentions the issue → add agent/queued, remove
      agent/in-progress, comment the audit. Anything held falls through to IL-T06 unchanged."
    status: guarded
    unreplayed: "belt built pre-harness (homelab#155) — convert on its next touch"
    unreplayed: "belt built pre-harness (homelab#155) — convert on its next touch"
    guards:
      - desc: "persistence guard — never actuate on the same instant of state the scan first saw (dispatch + finalize races)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_PERSIST_S" }
      - desc: "merged-PR hold — a non-closing reference on a merged PR leaves this exact state; holding beats re-riding finished work"
        anchor: { file: agents/coordinator-scan.sh, pattern: "is mentioned by a MERGED PR" }
      - desc: "add agent/queued FIRST, remove agent/in-progress SECOND, then re-read and prove the end state (the edit is not atomic)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ORDER IS LOAD-BEARING" }
      - desc: "probe failure holds every candidate and writes nothing (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "the phantom-label belt held every candidate" }
    incidents:
      - "2026-08-08 oracle#193 + circles#42/#46/#49: six phantom labels, zero worker pods — ~3h of two stacks idle. WIP caps counted ghosts and ADR-097 footprint holds refused SIBLING issues against dead work; found only because the operator asked why nothing was running, cleared by hand"
      - "2026-08-08 oracle#193 again: the hand-clear removed agent/in-progress and FORGOT agent/queued — the issue went invisible a second time. That is why the belt writes queued first and verifies the end state"

  - id: IL-T07
    name: close by master merge
    owner: GitHub (closing keyword)
    when: "pr_merged_master ∧ the PR body carries Fixes #N"
    status: github-native
    guards:
      - desc: "ordinary master-lane PRs close their issue by keyword; the ASSEMBLY PR deliberately does not (ADR-102 — it writes a non-closing Assembly-for: trailer instead)"
        anchor: { file: agents/coordinator/README.md, pattern: 'NOT .Fixes #<goal>., and this is load-bearing' }

  - id: IL-T08
    name: close by goal merge — FU-143 widened C6
    owner: scan detection (Base:-keyed) → merged-closeout play closes the issue
    when: "OPEN ∧ in-progress ∧ Base: goal/** ∧ referencing PR MERGED into exactly that base ∧ no open referencing PR"
    status: guarded
    unreplayed: "Base:-keyed detection — fixture on next touch; the merge doorbell is foreign"
    unreplayed: "Base:-keyed detection — fixture on next touch; the merge doorbell is foreign"
    guards:
      - desc: "Base:-keyed detection — goal/** only, never any non-default base (the #32 mirror)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "a goal child cannot self-close" }
      - desc: "the play CLOSES the still-open issue (re-fires goal-review, unblocks siblings)"
        anchor: { file: agents/coordinator/README.md, pattern: "GOAL-CHILD leg: also CLOSE the issue" }
      - desc: "merge doorbell: a merged circles PR rings /coordinate (was: wait for the */10 cron)"
        anchor: { repo: circles, file: .github/workflows/coordinate-doorbell.yaml, pattern: "coordinate-doorbell" }
    incidents: ["2026-08-05 circles#22/#23: closed BY HAND (agent/done+close) — which also silently skipped the harvest (C6 excludes agent/done)"]

  - id: IL-T09
    name: merged-closeout — verify, flip, harvest
    owner: scan merged-closeout clause → coordinator item session
    when: "closed (or IL-T08 open-merged) ∧ still non-terminal agent/* — verify on the branch Base: declares, flip agent/done, harvest Follow-ups"
    status: guarded
    unreplayed: "scan emit + LLM play — the play layer is outside the harness by design"
    unreplayed: "scan emit + LLM play — the play layer is outside the harness by design"
    guards:
      - desc: "scan emits merged-closeout units (goal children first, shared cap 3/repo/scan)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'merged-closeout\|' }
      - desc: "goal children verify against the GOAL branch, not master/ArgoCD"
        anchor: { file: agents/coordinator/README.md, pattern: "Verify against the GOAL BRANCH" }
      - desc: "goal closeout retargets surviving sprouts to master (their base dies with the branch)"
        anchor: { file: agents/coordinator/README.md, pattern: "GOAL closeout only" }

  - id: IL-T10
    name: goal queued by a human
    owner: the operator (breaker #1 moved UP, not away)
    when: "task/goal + Budget: authored AND agent/queued applied by a USER — the goal lane's entry gate"
    status: guarded
    unreplayed: "defence-in-depth actor check (the boundary is CODEOWNERS) — fixture with the next goal-lane touch"
    unreplayed: "defence-in-depth actor check (the boundary is CODEOWNERS) — fixture with the next goal-lane touch"
    guards:
      - desc: "the scan refuses a Bot-queued goal, fail-closed (defence in depth; the boundary is CODEOWNERS)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "BREAKER #1, moved UP" }

  - id: IL-T11
    name: goal-decompose
    owner: coordinator item session (reasoning tier — GOAL_MODEL, default opus)
    when: "queued goal → children authored as native sub-issues (Base: inherited, Touches: narrowed, coverage map) and QUEUED; parent → agent/blocked tracking"
    status: guarded
    unreplayed: "decompose is an LLM play; the deterministic budget legs are exercised through goal-budget.sh by the harvest fixtures"
    unreplayed: "decompose is an LLM play; the deterministic budget legs are exercised through goal-budget.sh by the harvest fixtures"
    guards:
      - desc: "the play (coverage map, seams pinned, Σ budgets fit)"
        anchor: { file: agents/coordinator/README.md, pattern: "goal-decompose" }
      - desc: "launcher enforces Σ(DESCENDANT spend + reservations) ≤ Budget: — sprouts spend the goal's money"
        anchor: { file: agents/agent-session.sh, pattern: "PREFLIGHT REFUSED" }
      - desc: "…over the shared read (extracted for #207's harvest gate; one sum, two callers, one enforcer)"
        anchor: { file: agents/goal-budget.sh, pattern: "DESCENDANTS, not direct children" }
      - desc: "the worker's slice is BOUNDED — Goal+Acceptance card only, never the spec tree"
        anchor: { file: agents/agent-session.sh, pattern: "GOAL CONTEXT" }
      - desc: "the reasoning-tier model map (launcher-owned, ADR-094)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'goal-decompose\) cmodel' }

  - id: IL-T12
    name: goal-review on every descendant close (tracking AND post-launch)
    owner: scan goal-review clause → coordinator item session
    when: "a DESCENDANT (not just direct child — sprouts sit at depth 2) closed after the loop's newest
      comment on the goal. Keeps firing after IL-T18: the goal is still open and still shipping, which
      is what makes the terminal a separate, later transition rather than a merge-time guess."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-nonassembly-merge-inert     # the ordinary unit still emits
      - agents/replay/fixtures/goal-assembly-complete           # …but NOT for a goal the lifecycle just acted on
    guards:
      - desc: "descendant fixpoint walk (the budget-gate bug-shape, fixed here too)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "FU-143 point 6: DESCENDANTS" }
      - desc: "the play: assembly-complete / children cover / author the missing child / retro checkpoint"
        anchor: { file: agents/coordinator/README.md, pattern: "goal-review. clause" }
      - desc: "a goal the lifecycle legs just moved does not ALSO draw a review unit this pass (replay: goal-assembly-complete)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "is DONE for this pass" }
      - desc: "the post-launch leg of the play: burn-down report, retarget stranded Base: children, recommend a verdict — never apply one"
        anchor: { file: agents/coordinator/README.md, pattern: "Your job in post-launch" }

  - id: IL-T13
    name: assembly-complete → assembly PR opened ARMED
    owner: goal-review session (App-authored, at assembly-complete time — never at decompose)
    when: "assembly_complete → gh pr create goal→master non-draft + a line-anchored `Assembly-for: #<goal>`
      trailer + coverage map body, then armed. NOT a closing keyword (ADR-102): the merge is IL-T18's
      midpoint, and `Fixes` here restores the #17 bug the rename exists to kill."
    status: guarded
    unreplayed: "LLM play (assembly PR open) — anchor-gated"
    unreplayed: "LLM play (assembly PR open) — anchor-gated"
    guards:
      - desc: "the play opens+arms at assembly-complete; human changes-requested routes as a NEW child"
        anchor: { file: agents/coordinator/README.md, pattern: "open the ASSEMBLY PR" }
      - desc: "the verdict is named assembly-complete — 'built as specified', never 'idea validated' (the #17 lesson)"
        anchor: { file: agents/coordinator/README.md, pattern: "Assembly-complete.*ADR-102" }
      - desc: "the reflex reviews it on the assembly rubric, model = claim reviewer.goalModel"
        anchor: { file: agents/review-reflex.sh, pattern: "REVIEW_GOAL_MODEL" }
      - desc: "the scan never dispatches a fix round at a goal/** HEAD (protected base — push would be refused)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ASSEMBLY PR #" }

  - id: IL-T14
    name: assembly merge — the goal lane's human gate (NO LONGER its exit)
    owner: GitHub (codeowner rule) + the operator (OrgAdmin merge)
    when: "bot approval satisfies required-approval; /specs/ in the diff trips CODEOWNERS; the human
      merges. Since ADR-102 the merge closes NOTHING — it is IL-T18's midpoint. The gate is unchanged;
      what changed is what lies on the other side of it."
    status: github-native
    guards:
      - desc: "master ruleset carries the codeowner flag; goal/** twin deliberately does not"
        anchor: { file: tofu/github/repo_rulesets.tf, pattern: "required_approval_goal" }
      - desc: "CODEOWNERS: /specs/ + /.agents/ on the operator"
        anchor: { repo: circles, file: CODEOWNERS, pattern: "/specs/" }

  - id: IL-T18
    name: assembly-complete → POST-LAUNCH (merge is a midpoint, the goal stays OPEN)
    owner: coordinator-scan goal lane (deterministic; no LLM in the path)
    when: "an open task/goal without `goal/post-launch` ∧ a MERGED PR with a `goal/**` HEAD whose body
      carries a line-anchored `Assembly-for: #<goal>` trailer → add `goal/post-launch`, comment
      assembly-complete (naming the bucket and the three verdict labels), and LEAVE THE GOAL OPEN."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-assembly-complete           # merged assembly → label + comment, no close
      - agents/replay/fixtures/goal-nonassembly-merge-inert     # a goal CHILD's merge moves nothing
    guards:
      - desc: "the goal is never closed here — assembly-complete measures 'built as specified', and only production knows the rest (replay: goal-assembly-complete asserts the ABSENCE of a close call)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ASSEMBLY-COMPLETE → POST-LAUNCH" }
      - desc: "keyed on a goal/** HEAD + the line-anchored Assembly-for: trailer — a goal CHILD has a goal/** BASE and would otherwise announce a launch on its own merge (replay: goal-nonassembly-merge-inert)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "assembly-for" }
      - desc: "a merged goal/** PR that only MENTIONS the goal is HELD and reported, never assumed (the circles#36 sibling-citation shape, one lane over)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "a mention is not an assembly claim" }
      - desc: "label FIRST, comment SECOND, comment only on a label that stuck — the write is not atomic and the leg is level-triggered, so the reverse order re-comments every tick"
        anchor: { file: agents/coordinator-scan.sh, pattern: "LABEL FIRST, COMMENT SECOND" }
      - desc: "the play must not open a second assembly PR or self-apply the label in post-launch"
        anchor: { file: agents/coordinator/README.md, pattern: "already carries .goal/post-launch." }
    incidents:
      - "2026-08-05 circles#17: machine-ruled 'goal met' and closed 100 minutes before the operator refuted it — nothing at merge time can know whether production agrees, which is why this transition closes nothing"

  - id: IL-T19
    name: "terminal — goal/validated: closed met + the close sweep"
    owner: coordinator-scan goal lane, reacting to a HUMAN-applied label
    when: "an open task/goal carrying `goal/validated` ∧ `Verdict-authority:` is human ∧ the label's
      newest `labeled` event actor is a User → close `--reason completed` with the audit comment, and
      SURFACE the close sweep as a report line: every open descendant with a proposed disposition."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-validated                   # closes the goal, touches NO descendant
    guards:
      - desc: "the sweep is REPORT-first — batch disposition becomes legal here and stays operator-confirmed until the goal registry panel exists (replay: goal-validated pins zero descendant writes)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "THE CLOSE SWEEP, REPORT-FIRST" }
      - desc: "the panel already reads the verdict labels — it needed no code change the day they landed"
        anchor: { file: argocd/resources/github-exporter/github-exporter.py, pattern: "_VERDICT_LABELS" }

  - id: IL-T20
    name: "terminal — goal/reverted: closed successfully-refuted, the tree dies with it"
    owner: coordinator-scan goal lane, reacting to a HUMAN-applied label
    when: "same two gates as IL-T19 → close every OPEN descendant `--reason 'not planned'` with an audit
      comment, then close the goal `--reason completed` (a refuted idea is a finished experiment, not a
      failure) quoting the `Revert:` line's pointer — the pin rollback or the revert of the assembly
      squash, which ADR-102 makes the revert unit."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-reverted                    # descendants close first, goal last
    guards:
      - desc: "descendants FIRST, the goal LAST — a closed goal leaves `openall` and the leg never fires again, so a partial pass must leave the goal open to be resumed (replay: goal-reverted pins the call order)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "DESCENDANTS FIRST, THE GOAL LAST" }
      - desc: "descendants are CLOSED, never deleted — the tree stays readable history (⚖ pre-decided, homelab#208)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "the tree stays readable history" }
      - desc: "the revert pointer is DECLARED on the goal, never guessed; an absent one is said plainly in the audit comment"
        anchor: { file: agents/coordinator-scan.sh, pattern: "revert POINTER is declared, never guessed" }
    incidents:
      - "oracle-fleet goal-174: 19 sprouts, 3 generations, still growing 34h post-close because nothing owned the tree — this leg is what now owns it"

  - id: IL-T21
    name: "terminal — goal/abandoned: closed not-planned, descendants inert"
    owner: coordinator-scan goal lane, reacting to a HUMAN-applied label
    when: "same two gates as IL-T19 → remove `agent/queued` from every OPEN descendant (compare-then-write)
      with an audit comment, then close the goal `--reason 'not planned'`. Descendants stay OPEN: the work
      may still be worth doing, it just may not spend a budget that is gone."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-abandoned                   # de-queued but OPEN; goal closed not-planned
    guards:
      - desc: "de-queued, not closed — a queued descendant of a dead goal burns a ride per tick to be refused by the launcher pre-flight (replay: goal-abandoned, same tree as goal-reverted, opposite disposition)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "descendants inert" }

  - id: IL-T22
    name: the verdict authority gate — the loop may not rule its own goal
    owner: coordinator-scan goal lane (fail-closed, before ANY terminal write)
    when: "a terminal label is present → refuse unless `Verdict-authority:` (default human) is `human`
      AND the label's newest `labeled` event actor is a `User`. Bot ⇒ refuse+report. UNREADABLE ⇒
      refuse+report. `kpi` authority ⇒ refuse+report (a later oracle-side issue, gateway-gated)."
    status: guarded
    replay:
      - agents/replay/fixtures/goal-validated
      - agents/replay/fixtures/goal-reverted
      - agents/replay/fixtures/goal-abandoned
    replay:
      - agents/replay/fixtures/goal-validated
      - agents/replay/fixtures/goal-reverted
      - agents/replay/fixtures/goal-abandoned
    guards:
      - desc: "the breaker-#1 actor shape, with more at stake: this transition closes a goal and, on revert, its whole tree — and the App holds issues:write"
        anchor: { file: agents/coordinator-scan.sh, pattern: "TWO FAIL-CLOSED GATES BEFORE ANY TERMINAL WRITE" }
      - desc: "an unreadable authorisation is not an authorisation (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "refusing to terminate" }
      - desc: "the labels are provisioned as code — IssueLabels is AUTHORITATIVE, so a runtime `gh label create` self-destructs on the next sync"
        anchor: { file: argocd/resources/agentstack/composition.yaml, pattern: 'name. .goal/validated' }

  - id: IL-T15
    name: goal-lane sprouts queue at harvest — only while the goal is open AND funded
    owner: scan harvest-disposition block (decides) → merged-closeout play (obeys)
    when: "the scan resolved a task/goal ancestor for the closeout item → the sprout is filed into
      that goal's post-launch bucket (IL-T17) and gets agent-fix+agent/queued ONLY when the goal is
      OPEN and the shared Budget: read rules `within`. Closed goal, exhausted or unparseable budget,
      unresolved bucket, or no goal ancestor at all → filed with NO queue labels."
    status: guarded
    replay:
      - agents/replay/fixtures/harvest-goal-open-funded       # open + funded → queued
      - agents/replay/fixtures/harvest-goal-open-exhausted    # open + out of money → inert
      - agents/replay/fixtures/harvest-goal-closed            # closed → inert, budget never read
    guards:
      - desc: "the verdict is DETERMINISTIC and rides --item; the play is ordered, never asked (replay: harvest-goal-open-funded / -exhausted / -closed)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "no grant, no self-queue right" }
      - desc: "the play obeys selfqueue=; the pre-ADR-102 `Base: goal/**` exception is retired"
        anchor: { file: agents/coordinator/README.md, pattern: "THE GOAL LANE IS DECIDED FOR YOU" }
      - desc: "ONE Budget: read, shared with the enforcing launcher pre-flight — never a second sum"
        anchor: { file: agents/goal-budget.sh, pattern: "goal_budget_read" }
      - desc: "the reviewer emits NO Follow-ups at depth ≥2 — the tree is capped at sprouts-of-children"
        anchor: { file: agents/reviewer-session.sh, pattern: "depth-conditional half of the harvest bar" }
    incidents:
      - "2026-08-09 census: #195/#211-shaped sprouts self-queued after their goal had closed and its budget was spent — the `Base: goal/**` body line outlives the goal that authorised it"
      - "oracle-fleet goal-174: 19 sprouts, 3 generations, still growing 34h post-close because nothing owned the tree (ADR-102's motivating case)"

  - id: IL-T17
    name: post-launch bucket — merge is a midpoint, the container is a sub-issue
    owner: scan harvest-disposition block (deterministic; no LLM in the path)
    when: "a merged-closeout or goal-review unit resolves a task/goal ancestor → find-or-create ONE
      `post-launch: <goal title>` sub-issue under the goal and link it with the native edge. Created
      at the first closeout/review rather than strictly at assembly merge: IL-T15 files open-goal
      sprouts into it, so the container must exist while the goal is still pre-launch. Post-launch
      children base MASTER — the goal branch dies at the assembly squash; goal identity is the issue."
    status: guarded
    replay:
      - agents/replay/fixtures/harvest-goal-open-funded       # absent → created AND linked
      - agents/replay/fixtures/harvest-goal-open-exhausted    # present → no create call (idempotent)
      - agents/replay/fixtures/harvest-master-inert           # no goal → no bucket, breaker #1 intact
      - agents/replay/fixtures/harvest-deep-sprout            # live circles#29 tree — the walk depth is measured
      - agents/replay/fixtures/sprout-report-skips-buckets    # the container is not reported as work
    guards:
      - desc: "one container per goal — found by title in the goal's own sub-issue list before any create (replay: harvest-goal-open-exhausted)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "post-launch:" }
      - desc: "a bucket that cannot be LINKED is discarded — its children would sit outside the goal's descendant walk and spend budget the gate cannot see"
        anchor: { file: agents/coordinator-scan.sh, pattern: "escape the budget walk" }
      - desc: "the bucket is a goal descendant, so its children already charge the goal's Budget: (no second accounting)"
        anchor: { file: agents/goal-budget.sh, pattern: "DESCENDANTS, not direct children" }
      - desc: "the play never creates it — it is handed the number and files into it"
        anchor: { file: agents/coordinator/README.md, pattern: "NOT yours to create" }
      - desc: "a bucket is a CONTAINER, not a sprout — excluded from the 🌱 triage slice, whose printed instruction would otherwise dispatch a worker at it (replay: sprout-report-skips-buckets)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "A POST-LAUNCH BUCKET IS NOT A SPROUT" }

gaps:
  - id: IL-G01
    name: "first live closeout unproven"
    detail: "FU-143 points 1–7 are fixture-proven and live-scan clean, but no goal child has merged
      through the widened C6 yet — the first child of circles#29 is the proof."
    fu: FU-143

  - id: IL-G02
    name: "goal branch creation is manual"
    detail: "Nothing creates goal/<n>-<slug> from master; circles#29's ⛔ section assigns it to the
      operator as a precondition. The decompose play could create it (one API call) if this
      recurs as friction."
    accepted: "deliberate operator step per #29 (2026-08-06); revisit on the second goal that trips on it"

  - id: IL-G03
    name: "assembly-only extra checks (audit, perf) unbuilt"
    detail: "Operator wish 2026-08-06: the assembly PR could carry checks a normal PR does not.
      Constraint: a REQUIRED check must report on every PR or it blocks them all — needs a
      workflow that runs on all PRs and trivially greens itself unless the head is goal/**."
    accepted: "design when a goal actually demands one; the codeowner review is the gate meanwhile"

  - id: IL-G04
    name: "sprout-RATE gauge (the harvest-gate half is closed)"
    detail: "The harvest gate DOES read remaining budget now — IL-T15/IL-T17 (ADR-102, homelab#207)
      close that half. What remains is the metric: the exporter does not yet walk the sub-issue
      lineage into a convergence number (inflow rate > fix rate = diverging), which is homelab#209's
      per-goal panel. ADR-102 supersedes this gap once that lands."
    fu: FU-090

  - id: IL-G06
    name: "merged-but-unlinked on MASTER only HELD, never resolved"
    detail: "IL-T16 refuses to reconcile an issue any merged PR merely MENTIONS, because a PR that
      merged with a non-closing reference leaves a state identical to abandonment (the FU-143
      hazard, one lane over). It reports and falls through to IL-T06, so a human/LLM still decides —
      the belt just never guesses. Resolvable the same way the goal lane resolved it: once
      agent-runtime#34's finalize guarantees a strong `Implements #N` link, the mention test can be
      tightened into an ownership test."
    accepted: "hold-not-guess is the asymmetry (a missed clear costs a report line, a wrong one costs a duplicate ride); revisit when finalize guarantees the link"

  - id: IL-G07
    name: "the belt treats the symptom; the missing finalize is the cause"
    detail: "agent-runtime#36 owns making finalize run on every exit path. Until it lands, phantom
      labels keep being CREATED and IL-T16 keeps clearing them ≤1 scan interval later — visible as
      a stream of RECONCILED report lines, which is itself the signal for how often the cause fires."
    accepted: "belt-and-cause are separate items by design (homelab#155 vs agent-runtime#36); the report lines are the meter"

  - id: IL-G08
    name: "the ASSEMBLY PR's own review Follow-ups have no harvester"
    detail: "IL-T09 harvests `Follow-ups:` bullets when a merged PR's ISSUE reaches merged-closeout.
      The assembly PR's issue is the GOAL, and since IL-T18 the goal does not close at assembly merge —
      so nothing schedules a closeout for it and the assembly review's bullets have no owner. The gap
      predates ADR-102 (a goal carries `agent/blocked`, which C6's selector never matched either), but
      #208 removes the one path that could have covered it by accident. The post-launch bucket is the
      obvious target and IL-T18 already resolves its number; what is missing is a clause that fires on
      the assembly merge itself rather than on an issue close."
    accepted: "the goal-review post-launch leg reads the merged assembly PR and can raise the bullets in
      its burn-down report meanwhile; build the clause when a real assembly review actually emits
      Follow-ups (none has yet), so the fixture can be recorded from a live payload rather than invented"

  - id: IL-G05
    name: "master-lane harvest graduation knob unbuilt"
    detail: "issueAuthoring.selfQueue exists in prose only (no XRD field, no reader). Per the
      gate-the-merge doctrine it may never need building — CODEOWNERS is the boundary."
    accepted: "gate-the-merge ruling 2026-08-05; build only if per-issue triage becomes the bottleneck"
