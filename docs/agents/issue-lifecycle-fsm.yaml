# issue-lifecycle-fsm.yaml — THE machine-readable model of the ISSUE lifecycle, goal lane included.
#
# WHY (2026-08-06, after the FU-143 arc): merge-path-fsm.yaml models the PR; nobody modeled the
# ISSUE — and the goal lane's bugs were all issue-state cells (a child that cannot close, a
# re-dispatch onto merged work, a goal-review that reads only direct children). Same treatment,
# same lint: every guard carries a code ANCHOR that must still grep (`devbox run merge-path-lint`),
# every gap carries an fu:/accepted: disposition, and issue-lifecycle-fsm.md is GENERATED from
# here — never hand-edited. The lane doctrine in one line: the MASTER lane human-gates per issue
# (breaker #1 triage) because auto-merge lands its code with no human; the GOAL lane human-gates
# at the BOUNDARY (queue the goal in, merge the assembly out) and is autonomous inside it.
#
# Statuses: guarded (mechanical guard + anchor) | report-only (surfaced, human acts) |
#           github-native (GitHub's own gate) | gap (known missing guard — needs fu/accepted).

title: "Issue lifecycle & goal lane"
narrative: issue-authoring.md   # the design-narrative doc this machine models
# THE ISSUE machine. The PR it spawns runs merge-path-fsm.yaml; the -iac wrappers run
# iac-lane-fsm.yaml. Where the machines touch: a PR merging is THIS machine's close event.
diagram: |
  stateDiagram-v2
      [*] --> Inert: authored — harvest / janitor / responder (IL-T01)
      Inert --> Queued: human triage (IL-T02)
      Inert --> AlertPending: responder fix-verdict → agent-fix, INERT + /fix-verdict bell (IL-T03)
      AlertPending --> AlertPending: bell → debounce → the SET re-derived — any agent/* lifecycle label leaves it (IL-T23)
      AlertPending --> Queued: 1 pending → deterministic gates → agent/queued + doorbell (IL-T24)
      AlertPending --> Queued: ≥2 → set-pass queues the CAUSE (IL-T25)
      AlertPending --> Linked: ≥2 → set-pass links the DOWNSTREAM symptoms — agent/linked, inert (IL-T25)
      Linked --> AlertPending: the cause's fix did not clear it → a human strips agent/linked (IL-T25)
      Queued --> Queued: held — deps / footprint / WIP / PR-cap (IL-T04)
      Queued --> InProgress: queued-dispatch → ride opens PR (IL-T05)
      InProgress --> InProgress: worker died → c4c5-redispatch (IL-T06)
      InProgress --> InProgress: goal child + AGENT_STRIKE + resumable branch → decidable, emit --work-branch (IL-T29)
      InProgress --> Queued: phantom label, persisted → scan reconciles it (IL-T16)
      Review --> Queued: phantom label, persisted → scan reconciles it (IL-T27)
      InProgress --> Blocked: worker ruled it NOT IMPLEMENTABLE → AGENT_INFEASIBLE parks it (IL-T26)
      Blocked --> Queued: a human re-scopes it and strips agent/blocked (IL-T26)
      InProgress --> ClosedByMerge: PR merges into MASTER — keyword fires (IL-T07)
      InProgress --> MergedIntoGoal: PR merges into goal/** — keyword INERT (IL-T08)
      MergedIntoGoal --> ClosedByMerge: FU-143 widened C6 closes it (IL-T08)
      ClosedByMerge --> Done: merged-closeout — verify, flip, harvest (IL-T09)
      ClosedByMerge --> Done: stale label, persisted → scan reconciles it (IL-T28)
      Done --> [*]
      state GoalLane {
          [*] --> GoalQueued: human authors AND queues (breaker up, IL-T10)
          GoalQueued --> GoalTracking: goal-decompose authors+queues children (IL-T11)
          GoalTracking --> GoalTracking: burn-down / goal-checkpoint on triggers (IL-T12)
          GoalTracking --> GoalTracking: post-launch bucket ensured, one per goal (IL-T17)
          GoalTracking --> AssemblyOpen: assembly-complete → assembly PR armed (IL-T13)
          AssemblyOpen --> PostLaunch: codeowner + human merge — a MIDPOINT, goal stays OPEN (IL-T14/IL-T18)
          PostLaunch --> PostLaunch: burn-down / goal-checkpoint on triggers (IL-T12)
          PostLaunch --> [*]: goal/validated → closed met + close sweep (IL-T19)
          PostLaunch --> [*]: goal/reverted → closed refuted, descendants close with it (IL-T20)
          PostLaunch --> [*]: goal/abandoned → closed not-planned, descendants inert (IL-T21)
      }
      note right of GoalLane
          the three terminals are HUMAN verdicts (Verdict-authority:);
          the loop reacts to the label and never rules one — a
          Bot-applied verdict is refused, fail-closed (IL-T19/20/21)
      end note
      note right of AlertPending
          the alert lane's verdict/queue SPLIT (FU-133): agent-fix is the
          DIAGNOSIS the responder shell records, agent/queued is granted
          only by the set-judged debouncer — one root cause must not draw
          N parallel fixers at N symptoms (IL-T23/IL-T24/IL-T25)
      end note
      note right of Inert
          a sprout of a GOAL descendant is filed into that
          goal's post-launch bucket (IL-T17), and skips Inert
          ONLY while the goal is open AND funded (IL-T15)
      end note

axes:
  labels: [inert, queued, in_progress, review, done, error, blocked_tracking, linked]  # agent/* + agent-fix
  lane: [master, goal_child, goal_parent, responder]        # decided by Base:/task-goal, not provenance
  base: [master, goal_branch]                                # the Base: body line — the close key
  lineage_depth: [0, 1, 2]                                   # native sub-issue chain; reviewer stops Follow-ups at ≥2
  budget: [within, exhausted]                                # Σ descendant caps vs the goal Budget:

events:
  authored: "a play files an issue (harvest bullet / janitor draft / responder alert / goal decompose)"
  fix_verdict: "an alert-triage session ends its issue with `fix-verdict: fix` — the responder shell applies agent-fix (INERT) and rings /fix-verdict"
  debounce_elapsed: "the debounce suspend expires (or the backstop cron fires) and one `decide` re-derives the pending SET live"
  human_triage: "a human applies agent-fix + agent/queued (or closes as noise)"
  dispatched: "the scan emits a unit; the launcher opens a ride (WIP=1, pod-name key)"
  pr_merged_master: "the ride's PR merges into master — GitHub closing keyword fires"
  pr_merged_goal: "the ride's PR merges into its declared goal/** base — keyword INERT"
  worker_terminal: "the ride died with no open PR referencing the issue"
  worker_infeasible: "the ride ENDED ON PURPOSE with no open PR: the deliverable needs a path its recipe bans or a resource outside the pod, and the worker said so in one `AGENT_INFEASIBLE: <path/resource>` comment (retro r3 F4)"
  descendant_closed: "any issue in the goal's sub-issue closure closes"
  assembly_complete: "the goal-checkpoint play rules the acceptance BUILT AS SPECIFIED (renamed from goal_met, ADR-102 — it never meant 'idea validated')"
  assembly_merged: "the goal→master PR merges (human codeowner act) — a MIDPOINT, not the end"
  verdict_applied: "the goal's Verdict-authority applies goal/validated | goal/reverted | goal/abandoned"

transitions:
  - id: IL-T01
    name: authored inert (master lane)
    owner: merged-closeout play (harvest) / janitor tick (spec-gap drafts)
    when: "authored on the MASTER lane → no agent-fix, no agent/queued; 🌱-reported until a human triages"
    status: guarded
    replay:
      - agents/replay/fixtures/unblocked-unlabeled/surfaces
      - agents/replay/fixtures/unblocked-unlabeled/blocker-open
    guards:
      - desc: "the play forbids self-labeling (loop-safety breaker #1)"
        anchor: { file: agents/coordinator/README.md, pattern: "never add .agent-fix. or .agent/queued." }
      - desc: "the scan surfaces untriaged bot-authored issues every pass"
        anchor: { file: agents/coordinator-scan.sh, pattern: "bot-authored, awaiting human triage" }
    incidents: ["2026-07-31 sleep harvest: 3 of 5 sprouts were noise — the triage gate is where they died"]

  - id: IL-T02
    name: human adoption
    owner: the operator
    when: "human labels agent-fix + agent/queued, or closes as noise — the master lane's ONLY human gate"
    status: report-only

  - id: IL-T03
    name: responder fix-verdict → agent-fix, INERT (alert lane)
    owner: "responder-argo shell (not the session — breaker #1)"
    when: "an alert-triage session ends its issue with `fix-verdict: fix` → the SHELL applies
      `agent-fix`, which is inert by the scan's own predicate (dispatch needs agent-fix ∧
      agent/queued), and rings `POST /fix-verdict`. `report-only`, or no open issue carrying the
      fingerprint, moves nothing; inside an app observation window the label lands with NO bell and
      a refire re-rings. The three fail-closed gates this transition used to carry moved WITH the
      queueing act into the debouncer (IL-T23/IL-T24) when selfQueue was retired."
    status: guarded
    replay:
      - agents/coordinator/responder-behaviour-test.sh
      - agents/replay/fixtures/responder-reopen/fix-verdict
      - agents/replay/fixtures/responder-reopen/report-only
    guards:
      - desc: "the label is applied by the SHELL and is a DIAGNOSIS, not a dispatch — queueing is the debouncer's"
        anchor: { file: agents/coordinator/responder-argo.yaml, pattern: "queueing is the debouncer" }
      - desc: "the bell hands the verdict to the set-judged debouncer; a lost bell is re-derived by ITS backstop, never re-rung here"
        anchor: { file: agents/coordinator/responder-argo.yaml, pattern: "debounce decides the set" }
      - desc: "the per-issue `selfQueue` knob is RETIRED (cb4ae5a) — it labelled agent-fix+agent/queued one issue at a time and so dispatched same-cause issues in parallel"
        anchor: { file: agents/coordinator/responder-argo.yaml, pattern: "Replaces selfQueue" }
      - desc: "a REOPENED thread is stripped back to a record — only a fresh verdict may re-earn the labels (replay: responder-reopen-fix-verdict / -report-only)"
        anchor: { file: agents/coordinator/responder-argo.yaml, pattern: "only a fresh verdict may re-queue it" }

  - id: IL-T23
    name: "fix-verdict bell → debounce → the pending SET (state is GitHub labels, nowhere else)"
    owner: fix-debounce Sensor + WorkflowTemplate — shell only, no LLM in this leg
    when: "the bell submits ONE `fix-debounce` workflow → suspend `wait` (10m; the backstop cron
      re-derives at 10s whatever a lost bell dropped) → `decide` takes the mutex and derives the set
      LIVE, per claim repo: open ∧ agent-fix ∧ `alert-fp:` in the body ∧ no lifecycle label ∧ not
      self-referential. 0 pending → `nothing to decide`, exit before any gate runs. Suspends run in
      PARALLEL and only `decide` serializes, so a burst wakes together, the first decide sweeps the
      whole set and the rest exit empty."
    status: guarded
    replay:
      - agents/replay/fixtures/fix-debounce   # THE TABLE (cleanup move 2 pilot): rows blocked-inert / unblocked-queues / in-progress-inert (the agent/* namespace legs A-C) + quoted/anchored-marker (the PR#271 anchoring pair) + the currency trio — per-row intent in rows.psv
    guards:
      - desc: "ALERT-LANE ONLY (`alert-fp:` in the body) — a stack loop's own agent-fix-without-queued hold is not this lane's to queue (the 2026-08-07 dry run swept circles#42, an issue meta-state recorded as held)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "ALERT-LANE ONLY" }
      - desc: "a lifecycle label EXCLUDES: each one is applied by REMOVING `agent/queued`, so the label meaning somebody already has this issue is exactly what would re-admit it (homelab#238 enumerated the human-waiting pair; homelab#244 widens the same test to the whole `agent/*` namespace — this anchor accepts either form, and neither's deletion)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: 'index\(\\"agent/blocked\\"\)|any\(startswith\(\\"agent/\\"\)\)' }
      - desc: "the scan holds the same rule on its side — a human-waiting state never wakes the LLM"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "coordinator-scan.sh:17" }
      - desc: "`self-referential: true` bodies are skipped at wake and named for a human — dispatch onto broken substrate is not the debouncer's call (both fixtures use the SELFREF line as their WITNESS that the list read was served at all)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "self-referential: true" }
      - desc: "derived LIVE from per-repo REST — the search index lags a just-filed issue, and GraphQL is the pool the reflex drained (FU-084)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "no search-index lag" }
      - desc: "decides serialize on one mutex, and the set is re-derived rather than carried — a killed workflow loses nothing"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "fix-debounce-decide" }
      - desc: "level-triggered backstop re-derives the set a lost bell left behind (search lag, webhook drop, responder crash post-label)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "fix-debounce-backstop" }
    incidents:
      - "2026-08-11 homelab#237: a coordinator BLOCK at 01:53Z re-admitted the issue to the pending set (blocking removes `agent/queued`) and the debouncer re-queued it at 02:17Z — one ride per debounce period, the human gate erased each turn, until the FU-069 breaker latched `agent/error`, which the predicate of the day did not exclude either. homelab#238"

  - id: IL-T24
    name: "1 pending → deterministic gates → agent/queued + the /coordinate doorbell"
    owner: fix-debounce `decide` shell (ADR-094 — dispatch acts are launcher-owned)
    when: "exactly one issue pending → `sq_decide` re-reads its body: a `Touches:` line must be
      declared, and none of its paths may match the queue-time deny table (`.github/`, `.agents/`,
      `devbox.json|lock`, `scripts/` — the paths where authoring takes effect BEFORE a human
      approves). Pass → `agent/queued`, then ring `/coordinate` so dispatch is edge-driven rather
      than cron-bound. Fail, or a refused label write → the issue stays inert and says why."
    status: guarded
    replay:
      - agents/replay/fixtures/fix-debounce   # table row — see rows.psv
    guards:
      - desc: "queue-time deny is the ❌ table ONLY — authoring is not effect, CODEOWNERS gates the merge (operator correction 2026-08-07)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "SQ_DENY=" }
      - desc: "an UNDECLARED footprint is exclusive and waits for a human — never queued wide on a guess"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "undeclared = exclusive" }
      - desc: "the doorbell carries {stack, loop_ns} for a GRADUATED stack — a bare {repo} POST fires only the global trigger, whose scan skips graduated stacks (FU-144)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "FU-144" }
      - desc: "fail-closed on the write: a refused label leaves the issue inert for the backstop, never a queued-but-unrung half state"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "stays inert, backstop retries" }
      - desc: "ADR-100 binds it: queue-time denial anywhere may use ONLY the ❌ table — the deny line is does-it-take-effect-pre-merge, never is-it-governance"
        anchor: { file: docs/adr.md, pattern: "queue-time denial anywhere" }

  - id: IL-T25
    name: "≥2 pending → ONE set-pass: queue the CAUSE, link the downstream, leave the unsure"
    owner: sonnet set-pass session (judges) → the same `decide` shell (acts — ADR-094)
    when: "two or more pending → the FU-088 subscription latch, then ONE session ranks the whole set
      as fenced JSON: `queue` (the cause, through IL-T24's same gates), `link` (downstream symptoms
      → `agent/linked` + a comment naming the cause, inert), `unsure` (waits). A failed session or
      unparseable output labels NOTHING and the set stays pending for the next bell. Re-entry from
      Linked is deliberate hand-work: the responder's reopen belt strips the lifecycle labels but
      not `agent/linked`, so a symptom the cause-fix did not clear is a human/meta cue."
    status: guarded
    unreplayed: "no fixture records a ≥2 world — the apply legs are the ones IL-T24 pins, and the JUDGEMENT is an LLM play with one dry run and one live datapoint (homelab#68 vs #118 judged INDEPENDENT, TICK-LOG 2026-08-07); record from the next live set-pass rather than inventing a set"
    guards:
      - desc: "the LLM judges and the SHELL acts — the session may not label, comment, file, close or reopen anything (ADR-094, breaker #1's shape)"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "the shell applies your JSON deterministically" }
      - desc: "fail-safe is NOT to label: unparseable output queues nobody, and `unsure` waits — an un-queued issue waits safely, three fixers on one cause spend budget and produce conflicting PRs"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "fail-safe: nothing labelled" }
      - desc: "latch-gated like every spawn, and the shared claude semaphore is held only across `decide` — a suspended debounce never parks a subscription slot"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "SUBSCRIPTION_TIER=dispatch" }
      - desc: "a linked issue is TOLD what it was judged downstream of and how to re-enter the pending set — the judgement is legible and reversible"
        anchor: { file: agents/coordinator/fix-debounce-argo.yaml, pattern: "judged downstream of a queued cause by fix-debounce" }
    incidents:
      - "2026-08-04 corpus audit (FU-133): ~19 of 27 alert issues were 5 root causes, one PVC producing 8 across 8 days — the SET, not the next issue, is the unit of triage"

  - id: IL-T04
    name: queued but held
    owner: coordinator-scan queued clause
    when: "open Depends-on (native ∪ body line) / footprint intersection / repo WIP ceiling / open-PR cap"
    status: guarded
    replay:
      - agents/replay/fixtures/depends-on-retired-format/depends-on-retired-format
    guards:
      - desc: "dependency gate (FU-087) — blocked issues report, never dispatch"
        anchor: { file: agents/coordinator-scan.sh, pattern: "queued-blocked" }
      - desc: "ADR-097 footprint hold — declared Touches: intersect ⇒ held"
        anchor: { file: agents/coordinator-scan.sh, pattern: "busy_fps" }
      - desc: "repo WIP ceiling (ADR-097 hard max)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "REPO_MAX_WIP" }

  - id: IL-T05
    name: queued-dispatch
    owner: scan (schedules ONE unit) → coordinator item session (judges) → launcher (opens the ride)
    when: "agent-fix ∧ agent/queued ∧ ¬direction-change ∧ ¬agent/error ∧ nothing held"
    status: guarded
    unreplayed: "scan priority + pod-name key (kubectl-create semantics) — backfill by fix-density"
    unreplayed: "scan priority + pod-name key (kubectl-create semantics) — backfill by fix-density"
    guards:
      - desc: "the queued-dispatch unit rides the priority list (in-flight recovery first)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'queued-dispatch\|' }
      - desc: "launcher dispatch idempotency — the pod name IS the (task, round) key"
        anchor: { file: agents/agent-session.sh, pattern: "the key IS the pod name" }
      - desc: "a task/goal issue routes to goal-decompose, NEVER to a worker recipe"
        anchor: { file: agents/coordinator-scan.sh, pattern: "BREAKER #1, moved UP" }

  - id: IL-T06
    name: abandoned in-progress → c4c5 re-dispatch
    owner: scan C4/C5 clause
    when: "agent/in-progress ∧ no Running worker ∧ no OPEN PR referencing ∧ NOT merged-into-goal (FU-143) ∧ NOT reconciled by IL-T16 this pass ∧ NOT parked by IL-T26 this pass"
    status: guarded
    replay:
      - agents/replay/fixtures/c4c5-infeasible   # THE TABLE (move-2 rollout): row parks = a no-marker issue beside a parked one still gets its unit; row quoted-inert = the ordinary abandoned ride unchanged by IL-T26; row probe-fail = it still gets it when the terminal's own probe is down
    guards:
      - desc: "the FU-143 exclusion — merged-into-goal is finished work, not abandonment"
        anchor: { file: agents/coordinator-scan.sh, pattern: "FU-143 point 2" }
      - desc: "agent/error invisible to the clause (FU-069 breaker)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'index\("agent/error"\)' }
      - desc: "agent/blocked invisible to the clause — a human gate is never re-dispatched (homelab#257; was an ASSUMPTION in a comment before)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'index\("agent/blocked"\)' }
      - desc: "ONE selector for the abandoned predicate — the unit, the report, the IL-T16 belt and the IL-T26 terminal cannot drift apart"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_SEL=" }
    incidents: ["2026-08-05 circles#22: pre-FU-143, C4/C5 re-rode a merged child — breakage #1 of three"]

  - id: IL-T16
    name: phantom in-progress reconciled → queued (the belt)
    owner: coordinator-scan, deterministically — no LLM tick in the path
    when: "IL-T06's predicate ∧ the state PERSISTED past C4C5_PERSIST_S (issue quiet AND no ride pod
      gone terminal within the window) ∧ no MERGED PR mentions the issue → add agent/queued, remove
      agent/in-progress, comment the audit. Anything held falls through to IL-T06 unchanged."
    status: guarded
    unreplayed: "belt built pre-harness (homelab#155) — convert on its next touch"
    guards:
      - desc: "persistence guard — never actuate on the same instant of state the scan first saw (dispatch + finalize races)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_PERSIST_S" }
      - desc: "merged-PR hold — a non-closing reference on a merged PR leaves this exact state; holding beats re-riding finished work"
        anchor: { file: agents/coordinator-scan.sh, pattern: "is mentioned by a MERGED PR" }
      - desc: "add agent/queued FIRST, remove agent/in-progress SECOND, then re-read and prove the end state (the edit is not atomic)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ORDER IS LOAD-BEARING" }
      - desc: "probe failure holds every candidate and writes nothing (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "the phantom-label belt held every candidate" }
    incidents:
      - "2026-08-08 oracle#193 + circles#42/#46/#49: six phantom labels, zero worker pods — ~3h of two stacks idle. WIP caps counted ghosts and ADR-097 footprint holds refused SIBLING issues against dead work; found only because the operator asked why nothing was running, cleared by hand"
      - "2026-08-08 oracle#193 again: the hand-clear removed agent/in-progress and FORGOT agent/queued — the issue went invisible a second time. That is why the belt writes queued first and verifies the end state"

  - id: IL-T26
    name: infeasible scope → parked agent/blocked (the terminal)
    owner: coordinator-scan, deterministically — no LLM tick in the path
    when: "IL-T06's predicate ∧ one issue COMMENT whose first characters are `AGENT_INFEASIBLE:` →
      add agent/blocked, remove agent/in-progress, comment the audit quoting the named
      path/resource. Runs BEFORE the IL-T16 belt and removes the issue from every C4/C5
      derivation, so a verdict is never re-queued and never re-dispatched. A human re-scopes it
      (or does the named part by hand) and strips agent/blocked to send it back to Queued."
    status: guarded
    replay:
      - agents/replay/fixtures/c4c5-infeasible   # THE TABLE (move-2 rollout): row parks = read → blocked → in-progress off → re-read → audit, no unit; row quoted-inert = a QUOTED marker latches nothing and a human-blocked issue is not even read; row probe-fail = rule #6, an unreadable probe writes nothing, reports, and leaves today's behaviour whole
    guards:
      - desc: "the marker is ANCHORED at the start of a COMMENT — talking about the terminal is not the terminal"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'test\("\^AGENT_INFEASIBLE:"\)' }
      - desc: "add agent/blocked FIRST, remove agent/in-progress SECOND, then re-read and prove the end state (the edit is not atomic — IL-T16's lesson)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "Same non-atomic write as the belt" }
      - desc: "the MARKER suppresses the redispatch, not the label write — a failed/half-applied write reports loudly and the issue still leaves the unit list"
        anchor: { file: agents/coordinator-scan.sh, pattern: "The redispatch is suppressed either way" }
      - desc: "an unreadable comments probe keeps today's behaviour, belt and unit included (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "the infeasible-terminal check was SKIPPED" }
      - desc: "PRODUCER HALF — each repo's `.agents/fix.yaml` must tell a worker to emit the marker; until it does, this transition is unreachable in that repo"
        anchor: { file: agents/coordinator/README.md, pattern: "AGENT_INFEASIBLE" }
    incidents:
      - "2026-08-11 oracle-fleet#66: the whole deliverable was .github/workflows/ci.yaml, banned by .agents/fix.yaml. The worker correctly self-reported 'not implementable as written' — with no terminal for it, that landed as AGENT_STRIKE error_class=unknown, and the coordinator had to override the mechanical c4c5-redispatch clause BY HAND (retro r3 F4)"
      - "2026-08-11 oracle-fleet#225: 'none of that is executable by a fix-class worker (no cluster/infra access, no live-API credentials, no oracle-iac checkout)' — the worker RESCOPED itself instead, and its PR's `Fixes #225` then wrongly auto-closed the issue (reopened 19:03:31Z). Self-rescoping is what an agent does when the honest answer has no exit"

  - id: IL-T27
    name: phantom review reconciled → queued (the belt)
    owner: coordinator-scan, deterministically — no LLM tick in the path
    when: "agent-fix ∧ agent/review ∧ no OPEN PR referencing ∧ no MERGED PR mentions the issue ∧ the state PERSISTED past C4C5_PERSIST_S (issue quiet) → add agent/queued, remove agent/review, comment the audit. Verbatim shape of IL-T16's phantom belt applied to the review state instead of in-progress."
    status: guarded
    replay:
      - agents/replay/fixtures/review-phantom-belt
    guards:
      - desc: "persistence guard — never actuate on the same instant of state the scan first saw (dispatch + finalize races)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "C4C5_PERSIST_S" }
      - desc: "merged-PR hold — a non-closing reference on a merged PR leaves this exact state; holding beats re-riding finished work"
        anchor: { file: agents/coordinator-scan.sh, pattern: "is mentioned by a MERGED PR" }
      - desc: "add agent/queued FIRST, remove agent/review SECOND, then re-read and prove the end state (the edit is not atomic)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ORDER IS LOAD-BEARING" }
