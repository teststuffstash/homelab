# merge-path-fsm.yaml — THE machine-readable model of the PR merge-path state machine.
#
# WHY (2026-07-21, after the nine-review loop — the FOURTH unmodeled-transition incident): the
# de-facto FSM is implemented across review-reflex.sh, the updater action, GitHub's own merge
# semantics, coordinator-scan clauses, and finalize — and every loop bug was a state×event cell
# nobody had explicitly disposition'd. Prose drifts; this file is checked against the code by
# `devbox run merge-path-lint` (scripts/merge-path-lint.py): every guard carries a code ANCHOR
# (file + regex) that must still grep, every gap must carry an fu:/accepted: disposition, and the
# human-readable doc (merge-path-fsm.md) is GENERATED from here — never hand-edited.
#
# Statuses: guarded (mechanical guard + anchor) | report-only (surfaced, human acts) |
#           github-native (GitHub's own gate) | gap (known missing guard — needs fu/accepted).

title: "Merge-path FSM"
narrative: merge-path.md   # the design-narrative doc this machine models
# THE APP-REPO machine. The -iac wrapper repos run a DIFFERENT machine (merge is the midpoint
# there, evidence arrives post-merge): iac-lane-fsm.yaml / iac-lane.md (FU-106).
diagram: |
  stateDiagram-v2
      [*] --> Open: pr_opened + arm (MP-T01)
      Open --> Green: ci success
      Open --> Red: ci failure
      Red --> Green: fix round lands (MP-T07/MP-T12) — edge-woken, content-based (FU-115)
      Red --> Arbitrate: red rounds exhausted (MP-T13)
      Green --> Behind: master_moved
      Behind --> Green: branch_updated (MP-T02) — NOT new content
      Behind --> Conflicted: merge_conflict_422 (MP-T06)
      Green --> BotApproved: review dispatch + APPROVE (MP-T03)
      Green --> ChangesRequested: review dispatch + CHANGES (MP-T03)
      ChangesRequested --> Green: content_pushed, re-reviewable (MP-T04/T07)
      BotApproved --> CodeownerPark: spec-gated (MP-T08)
      CodeownerPark --> Merged: human_approve → auto-merge (MP-T05)
      BotApproved --> Merged: auto-merge (MP-T05)
      Merged --> [*]: Fixes closes issue → merged-closeout (MP-T10, C6)
      note right of Green
          agent_error (MP-T09) freezes any state
          for automation until a human clears it
      end note

axes:
  ci: [pending, green, red]                     # statusCheckRollup at head (SKIPPED/NEUTRAL = green-equivalent)
  currency: [current, behind, conflicted]       # mergeStateStatus (BEHIND / DIRTY)
  arming: [armed, unarmed]                      # autoMergeRequest != null — ARMING IS THE BOUNDARY
  bot_review_at_head: [none, approved, changes_requested]  # at the REAL head = newest NON-MERGE commit
  codeowner_gate: [not_required, pending, approved]        # spec-touching PRs only (/specs/, /.agents/)
  breaker: [normal, agent_error]
  lane: [worker, automerge, deps_review, major, major_awaiting_human, operator]

events:
  pr_opened: "worker/renovate/operator opens a PR"
  ci_completed: "required checks conclude at head (success | failure)"
  master_moved: "any merge/push to master"
  branch_updated: "updater merge commit — brings currency, IS NOT new content"
  content_pushed: "author commits on the PR branch — IS new content"
  bot_verdict: "reviewer bot APPROVE or CHANGES_REQUESTED"
  human_approve: "codeowner (or any human) approval"
  merge_conflict_422: "update-branch API refuses — DIRTY"
  merged: "GitHub auto-merge completes; branch deleted; Fixes #N closes"
  agent_error_set: "breaker trip (any layer) or human kill switch"

transitions:
  - id: MP-T01
    name: arm at open
    owner: agent-finalize (in-pod)
    when: "pr_opened by a worker → gh pr merge --auto --squash"
    status: guarded
    unreplayed: "arm guard is foreign (agent-runtime finalize); the C9/orphan belts backfill by fix-density"
    guards:
      - desc: "pr_url derived from the checked-out branch (goose-only self-report gap closed)"
        anchor: { repo: agent-runtime, file: agent-base/agent-finalize, pattern: "def derive_pr_url" }
    belts:
      - desc: "reflex C9 re-arm for worker-authored un-armed PRs"
        anchor: { file: agents/review-reflex.sh, pattern: "C9 repair" }
      - desc: "scan orphan report (any un-armed unowned PR, report-only per FU-079)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "un-armed open PRs" }
    incidents: ["2026-07-16 oracle-fleet#16 (stacked PR born un-armed)", "2026-07-17 meta-7(a) claude-tier 3/3 un-armed", "FU-079 (archived)"]

  - id: MP-T02
    name: updater brings a behind PR current
    owner: in-cluster updater (ADR-111 — exporter edge + */15 Argo CronWorkflow → agents/update-pr-branch.sh, homelab-merge App via ESO; hosted reusable retired 2026-08-26, homelab#745)
    when: "behind ∧ green ∧ armed ∧ ¬conflicted ∧ ¬changes_requested — oldest first WITHIN a
      (repo, base) LANE, ONE update per lane per run (ADR-125 (2); it was one per REPO until
      homelab#1422)"
    emits: branch_updated
    status: guarded
    replay:
      - agents/replay/fixtures/updater
    guards:
      - desc: "per-lane FIFO + one-per-(repo, base)-per-run + armed-only. The unit is the LANE
          because the merge -> behind -> dismiss-approval chain this leg paces only ever runs
          between PRs sharing a base (ADR-125); legs 2 (unstrand) and 3 (DIRTY labeler) are
          per-PR sweeps and are unaffected"
        anchor: { file: agents/update-pr-branch.sh, pattern: "oldest armed\\+BEHIND, FIFO" }
      - desc: "the lane grouping itself: group_by(.baseRefName) before the FIFO take, replayed by
          the `two-lanes-two-updates` (two bases ⇒ two update calls in one pass) and
          `same-lane-one-update` (two PRs on one goal/** base ⇒ one call, the older) rows"
        anchor: { file: agents/update-pr-branch.sh, pattern: "group_by\\(\\.baseRefName" }
      - desc: "burst serialization: ONE mutex across edge + cron submissions (Cron Forbid cannot
          see Sensor submissions), so push bursts serialize instead of racing (the
          cancel-in-progress: false rationale of the hosted era, carried by the mutex now).
          ⚠ This used to also claim it preserved a 422→merge-conflict labeling MP-T06 depends on;
          since homelab#986 (PR#1005) the update-branch call carries expected_head_sha and a 422
          — conflict OR concurrent-push race — SKIPS without labeling. MP-T06 is fed by leg 3's
          armed∧DIRTY labeler alone, one pass later"
        anchor: { file: agents/coordinator/update-pr-argo.yaml, pattern: "synchronization" }
      - desc: "the CR∧BEHIND unstrand belt fires ONLY on new content since the newest reviewer
          verdict (non-merge commits — the reflex's reviewable_again shape; updater merges are not
          content or the belt feeds itself) and never on agent/error / agent/arbitrate PRs.
          Measured 2026-08-17: the unconditional belt spent 34 branch updates + ~35 CI runs
          keeping unmergeable PRs current in one busy-master day (#473 ×16 parked, #475 ×18
          breaker-latched); unreadable probe data HOLDS, never updates"
        anchor: { file: agents/update-pr-branch.sh, pattern: "unstrand" }
    incidents: ["2026-07-09 oracle-fleet#6 (changes-requested refusal deadlock → MP-T04's BEHIND exception)"]

  - id: MP-T03
    name: review dispatch
    owner: exporter edge (POST → Sensor → review WorkflowTemplate) + */15 CronWorkflow backstop
    when: "green ∧ ¬conflicted ∧ armed ∧ bot_review_at_head=none ∧ ¬automerge-lane ∧
      ¬agent_error ∧ reviewer.enabled ∧ capacity — ONE dispatch per (repo, base) LANE per tick
      (ADR-125 (1)). CURRENCY IS NOT A PRECONDITION (homelab#1422, 2026-09-05): a BEHIND-but-green
      PR that has never been reviewed is admitted to its FIRST review. Re-review on a BEHIND branch
      was already allowed — MP-T04"
    status: guarded
    replay:
      - agents/reviewer-optout-replay.sh
      - agents/replay/fixtures/reviewer-exit-contract
      - agents/replay/fixtures/review-pick/two-lanes-two-picks
      - agents/replay/fixtures/review-pick/same-lane-oldest
      - agents/replay/fixtures/review-pick/behind-cr-no-content-held
      - agents/replay/fixtures/review-pick/behind-first-review-admitted
      - agents/replay/fixtures/reviewer-currency/behind-proceeds
    guards:
      - desc: "ONE pick per (repo, base) LANE, oldest first within the lane (ADR-125 (1),
          homelab#1422) — group_by(.baseRefName) over the SAME filtered candidate set. Master-lane
          and goal-lane PRs cannot stale each other approvals (dismiss-on-push only reaches PRs
          sharing a base), so serializing them together bought nothing and cost goal #278 361
          starved minutes. K (REVIEW_CONCURRENCY) and the FU-088 subscription latch are unchanged
          and stay the fleet-wide ceiling"
        anchor: { file: agents/review-reflex.sh, pattern: "group_by\\(\\.baseRefName" }
      - desc: "bot-approval-at-head over NON-MERGE commits (branch_updated ≠ content_pushed)"
        anchor: { file: agents/review-reflex.sh, pattern: "UPDATER MERGE COMMITS ARE NOT NEW CONTENT" }
      - desc: "bot login normalized (REST 'x[bot]' vs GraphQL 'x')"
        anchor: { file: agents/review-reflex.sh, pattern: 'sub\("\\\\\[bot\\\\\]\$"' }
      - desc: "never reviewDecision (codeowner repos hold it REVIEW_REQUIRED forever)"
        anchor: { file: agents/review-reflex.sh, pattern: "bot_approved_head" }
      - desc: "capacity gate (429 latch / 80% utilization / session semaphore)"
        anchor: { file: agents/review-reflex.sh, pattern: "subscription-latch.sh" }
      - desc: "deterministic-name key: reviewer pod = (repo, pr, head-sha8), atomic create — was gap MP-G02 (FU-092, 2026-07-27)"
        anchor: { file: agents/reviewer-session.sh, pattern: "pod name IS the .repo, pr, head-sha8. idempotency key" }
      - desc: "per-stack reviewer.enabled knob, honored by ALL THREE dispatch sites from ONE shared
          read — was a silent gap until homelab#204 (2026-08-09): the knob lived as an inline jq in
          the review-reflex tick, so the `review-perstack` Sensor trigger reviewed, APPROVED and
          auto-merged agent-runtime#57 on a stack whose claim said `reviewer.enabled: false`, in the
          same minute the tick logged the correct skip. The three sites converge on
          reviewer-session.sh, which runs the shared read as a SHELL guard before the head-sha probe,
          the latch and the pod create — the prompt's STEP-0 cannot serve as this backstop, since it
          runs inside a pod that should never have been created"
        anchor: { file: agents/reviewer-optout.sh, pattern: "reviewer.enabled" }
      - desc: "…and FAIL-CLOSED: an unreadable claims read skips dispatch on every path rather than
          reviewing the world, reversing the old WARN-and-continue branch. For a DISABLE knob the
          failures are asymmetric — a skipped tick costs minutes on a level-triggered path, an
          un-skippable disabled review costs the gate itself. NB `kubectl get -o json` on a Forbidden
          prints a VALID empty List to stdout and exits 1, so the status is checked as well as the
          payload; trusting stdout alone reads as 'no stack opted out'"
        anchor: { file: agents/reviewer-optout.sh, pattern: "fail-CLOSED" }
      - desc: "the gate is pinned by an executed replay (42 assertions, sentinel-extracted from the
          shipped scripts, no cluster): with reviewer.enabled=false NEITHER the tick NOR the perstack
          path dispatches, and a PROBE-FAILed claims read skips rather than proceeds"
        anchor: { file: agents/reviewer-optout-replay.sh, pattern: "NEITHER PATH DISPATCHES" }
    belts:
      - desc: "reviewer STEP-0 self-guard, PRECONDITION arm (homelab#122 / PR #123, master 11c2045,
          2026-08-08): a premise true when the reviewer was QUEUED and false when it EXECUTED —
          mergeStateStatus DIRTY/UNKNOWN, checks not concluded at head, or one LIVE (non-DISMISSED)
          verdict of its own identity already at this exact commit — is ordinary semaphore
          contention, NOT an anomaly: one standing-aside comment, NO label, NO verdict, and the
          level-triggered path re-dispatches when the state settles. homelab#556 (2026-08-18):
          the at-head count filters on review state APPROVED/CHANGES_REQUESTED exactly as the
          reflex's breaker count does — a DISMISSED verdict is an ended round, not a verdict, so
          the arbitration-dismissal play (homelab#141) no longer leaves STEP-0 refusing the
          re-dispatch"
        anchor: { file: agents/reviewer-session.sh, pattern: "PRECONDITION FAILURE" }
      - desc: "the aside dedup is keyed by (content commit, precondition) on a MACHINE MARKER
          (`<!-- standing-aside head=<sha8> pre=<slug> -->`, ADR-103 channel-separation precedent),
          not by pass and not by prose — the reviewer reads the comments it already fetched and posts
          nothing if one of its own asides carries the marker for this newest non-merge commit and
          this precondition. homelab#556 (2026-08-18): the old prose key (head sha) never matched
          across sessions because the branch tip moved on update-branch merge no-ops, so PR#547
          piled two near-identical asides 7 minutes apart and risked the anomaly latch"
        anchor: { file: agents/reviewer-session.sh, pattern: "IDEMPOTENT ASIDE" }
      - desc: "reviewer STEP-0 self-guard, ANOMALY arm — only a state re-dispatch CANNOT resolve
          trips the breaker (agent/error + one AGENT_ERROR: comment): MORE THAN ONE LIVE
          (non-DISMISSED) verdict at head, a pile of near-identical bot reviews or comments, a review
          history irreconcilable with the commit history, contradictory labels; an agent/error already
          present still means touch nothing and stop silently"
        anchor: { file: agents/reviewer-session.sh, pattern: "GENUINE ANOMALY" }
      - desc: "BEHIND is NOT a skip on either half of the dispatch (homelab#1422, 2026-09-05).
          The reflex predicate dropped `(mergeStateStatus != BEHIND) or reviewable_again`, and the
          launcher currency gate narrowed from BEHIND|DIRTY to DIRTY — leaving the latter would
          have turned every admitted pick into a dispatch that dies at spawn. Evidence: an
          update-branch merge does not dismiss a verdict (GitHub re-points the review commit_id;
          PR#1386 survived 4 updater merges 07:06-07:37Z, #1388/#1389 the same day), while the
          skip starved first reviews (PR#1437: 7 master moves, 3 updater merges, no first review).
          DIRTY still skips — an UNMODIFIED arm, so its pin (`reviewer-currency/dirty-skips`) re-lands as a fixture-only follow-up per the replay README §Pin-vacuity routing rule, escape (a); until then it is unreplayed on its own leg"
        anchor: { file: agents/reviewer-session.sh, pattern: "NARROWED to DIRTY" }
      - desc: "in-band breaker: impossible verdict counts trip agent/error"
        anchor: { file: agents/review-reflex.sh, pattern: "CIRCUIT-BREAKER TELEMETRY" }
      - desc: "out-of-band: AgentReviewLoop / AgentErrorFlagged alerts (different code+token)"
        anchor: { file: argocd/resources/github-exporter/prometheusrule.yaml, pattern: "AgentReviewLoop" }
      - desc: "in-band EXIT CONTRACT (homelab#560, 2026-08-18): a review session that ends with NO
          verdict, NO standing-aside comment, and NO agent/error label is a FAILURE — the 2026-08-18
          outage was a pod that died on a PREP syntax error (the #547 apostrophe), uploaded its
          transcript via the trap, and still reported Succeeded because the launcher never propagated
          the pod's exit. The pod re-reads its own review state after claude and asserts one of the
          three terminals exists at this head (FINAL=0); no terminal + claude crash → claude's RC;
          no terminal + claude 'green' → FINAL=10 (the silent-green kill); unreadable state → 10,
          fail-closed. The trap preserves the pre-trap exit; the launcher propagates the pod's
          terminated exitCode so a dead/terminal-less session reds the Argo workflow. The three
          legitimate quiet exits (standing-aside posted / agent/error already present / opt-out skip
          before pod creation) stay 0. Pinned by an executed replay (agents/replay/fixtures/
          reviewer-exit-contract, six rows)"
        anchor: { file: agents/reviewer-session.sh, pattern: "EXIT CONTRACT" }
    incidents: ["2026-07-12 oracle-fleet#13 (reviewDecision aliasing, 12 approvals)", "2026-07-21 oracle-fleet#57 (merge-commit staleness, 9 reviews, 88% window burn)"]

  - id: MP-T04
    name: re-review after changes-requested + new content
    owner: review reflex (reviewable_again arm) + exporter edge (same arm since 2026-07-21)
    when: "changes_requested ∧ content_pushed since verdict (BEHIND allowed — the verdict is about the fix, not currency)"
    status: guarded
    unreplayed: "reviewable_again arm — replayable; fixture on its next touch (fix-density, ADR-103)"
    guards:
      - desc: "new CONTENT since verdict (non-merge commits only, via newest_commit_at)"
        anchor: { file: agents/review-reflex.sh, pattern: "reviewable_again" }
      - desc: "the exporter edge carries the SAME arm — the edge must not re-POST a just-verdicted
          head at all. Until homelab#122 / PR #123 (master 11c2045, 2026-08-08) delegating the check
          to the STEP-0 belt made every benign re-POST an agent/error latch that froze the PR's own
          MP-T07 fix round; since #123 that re-POST lands in STEP-0's PRECONDITION arm instead — one
          standing-aside comment, no label — so the residual cost is a burned reviewer session, not
          a frozen PR. The arm stays because a burned session is still waste (private repos null
          commit dates → edge stays off, CronWorkflow owns re-reviews)"
        anchor: { file: argocd/resources/github-exporter/github-exporter.py, pattern: "reviewable_again" }
    incidents: ["2026-07-09 oracle-fleet#6 (the BEHIND-re-review exception's origin)", "2026-07-21 oracle-fleet#60 (exporter re-POST one poll after the verdict — restart-emptied dedup; STEP-0 tripped, breaker froze the fix round 5h)"]

  - id: MP-T05
    name: auto-merge completes
    owner: GitHub (native auto-merge)
    when: "armed ∧ green ∧ current ∧ required approvals (incl. codeowner where gated)"
    status: github-native
    accepted: "approval→merge window: master moving in those seconds costs one update + one re-review — rare, self-healing, counted in scenario L"

  - id: MP-T06
    name: conflict routes to judgment
    owner: updater labels merge-conflict → coordinator item unit
    when: "merge_conflict_422"
    status: guarded
    replay:
      - agents/replay/fixtures/merge-conflict/clause
      - agents/replay/fixtures/merge-conflict/debounced
      - agents/replay/fixtures/merge-conflict/null-author
    guards:
      - desc: "scan emits the merge-conflict clause as a work unit"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'merge-conflict\|' }
      - desc: "WORKER_AUTHOR-scoped like changes-requested (homelab#595): a seat-authored conflict PR emits a report line, never a unit — the seat's own push is the next mover"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'homelab#595' }
      - desc: "unchanged-state debounce on the worker-authored leg (the #198 fingerprint pair)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "merge-conflict DEBOUNCED" }
      - desc: "null-author catch-all (homelab#602): a conflict PR whose `.author` is null (deleted/suspended account) matches neither the seat nor the worker predicate and emits a report line, never a unit — it cannot vanish from both surfaces"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'homelab#602' }

  - id: MP-T07
    name: fix round on the PR's own branch
    owner: coordinator item session → agent-session --work-branch --recipe
    when: "changes_requested (or meta-dispatched red fix) → worker resumes THE PR branch, round N+1"
    status: guarded
    unreplayed: "launcher dispatch assembly — rail-degrade-replay covers the capacity legs; the rest backfills by fix-density"
    guards:
      - desc: "dispatch idempotency: the pod name IS the (task, round) key — atomic create"
        anchor: { file: agents/agent-session.sh, pattern: "the key IS the pod name" }
      - desc: "recipe fix-round exception (being ON the PR branch is not the FU-069 anomaly)"
        anchor: { repo: oracle-fleet, file: .agents/fix.yaml, pattern: "NOT an anomaly" }
      - desc: "launcher-owned claude run command (--recipe, never LLM-assembled)"
        anchor: { file: agents/agent-session.sh, pattern: "LAUNCHER-OWNED claude run command" }
    incidents: ["2026-07-21 #55 ($B64 template shipped raw)", "2026-07-21 #47 (breaker misfire on the fix-round path)", "2026-07-21 #55 (double-dispatch ×3 → pod-name key)"]

  - id: MP-T08
    name: codeowner park
    owner: GitHub (require_code_owner_review) — bot approved, human pending
    when: "bot_review_at_head=approved ∧ codeowner_gate=pending → wait; auto-merge on human_approve"
    status: github-native
    guards:
      - desc: "reflex does NOT re-dispatch while parked (bot_approved_head, not reviewDecision)"
        anchor: { file: agents/review-reflex.sh, pattern: "bot_approved_head" }
      - desc: "exporter edge carries the SAME arm (a parked PR reads REVIEW_REQUIRED — without this
          the edge re-POSTs the approved head of a PR merely waiting for a human; that refusal
          latched agent/error until homelab#122 / PR #123 (master 11c2045, 2026-08-08) and now
          stands aside instead, so the arm is what keeps a parked PR from collecting a reviewer
          session plus an aside comment on every poll; commit dates via REST fallback, fail-closed
          when unknown)"
        anchor: { file: argocd/resources/github-exporter/github-exporter.py, pattern: "bot_approved_head" }
    incidents: ["2026-07-12 oracle-fleet#13", "2026-07-21 oracle-fleet#60 (edge re-POSTed the approved head 2 min after the verdict — second breaker latch of the day, same class both arms)"]

  - id: MP-T10
    name: merged close-out (C6)
    owner: scan merged-closeout clause → coordinator item session
    when: "issue CLOSED by merged PR ∧ still agent/in-progress OR agent/review (21d window)"
    status: guarded
    unreplayed: "scan emit + LLM play — the play layer is outside the harness by design"
    guards:
      - desc: "scan emits merged-closeout units (cap 3/repo/scan, agent/error excluded)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'merged-closeout\|' }
      - desc: "the play: verify outcome → agent/done flip → Follow-ups harvest as INERT issues (breaker #1)"
        anchor: { file: agents/coordinator/README.md, pattern: "merged-closeout. clause" }
    incidents: ["MP-G03 origin: #52/#55/#47 label flips + harvest all manual through meta-9..11"]

  - id: MP-T11
    name: arbitrate — rounds-exhausted escalation
    owner: review reflex labels agent/arbitrate → scan arbitrate unit → coordinator item session
    when: "bot verdicts ≥ ROUNDS_MAX ∧ NOT an impossible-state signature (those stay agent/error)"
    status: guarded
    replay:
      - agents/replay/fixtures/arbitrate/first-tick
      - agents/replay/fixtures/arbitrate/probe-unreadable
      - agents/replay/fixtures/arbitrate/landing-sequence
      - agents/replay/fixtures/arbitrate/fu147-refire-blocked
      - agents/replay/fixtures/arbitrate/no-op-after-directive
      - agents/replay/fixtures/state-fp/state-fp
      - agents/replay/fixtures/changes-requested/blocked-held
      - agents/replay/fixtures/changes-requested/dispatched
      - agents/replay/fixtures/changes-requested/reviewable-again-held
    guards:
      - desc: "reflex splits rounds-exhausted (escalation → agent/arbitrate) from impossible-state (anomaly → agent/error)"
        anchor: { file: agents/review-reflex.sh, pattern: "ROUNDS EXHAUSTED" }
      - desc: "reflex pick excludes agent/arbitrate (no re-trip loop)"
        anchor: { file: agents/review-reflex.sh, pattern: 'index\("agent/arbitrate"\)' }
      - desc: "scan emits arbitrate units; sibling clauses exclude the label"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'arbitrate\|' }
      - desc: "the exclusion set is the PR's OWN terminal labels, and agent/blocked is one of them — the coordinator's own arbitrate/ci-red escalate terminal writes it on the PR, and the BLOCKED-SOURCE hold at :2160 answers a different question (is the SOURCE ISSUE gated), so it cannot cover a PR with no Fixes link (homelab#1097; PR #1094 re-dispatched every tick)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'index\("agent/blocked"\)' }
      - desc: "arbitrate unit emission excludes APPROVED+armed PRs (landing-sequence exclusion — a past-arbitration state needs no escalation)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "autoMergeRequest" }
      - desc: "unchanged-state debounce: the unit is emitted only when the PR's state fingerprint (head|reviewDecision|checks|newest verdict) differs from the recorded state-fp marker — PR#234 drew 5 identical dispatches in 30m before this (homelab#198)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "STATE_FP_JQ" }
      - desc: "the play, exactly one of four: re-dispatch-with-clarification / rule-follow-up-class (terminal = dismiss the superseded reviewer verdict, homelab#141) / close-not-mergeable / escalate (meta-4 doctrine)"
        anchor: { file: agents/coordinator/README.md, pattern: "arbitrate. clause" }
      - desc: "changes-requested clause holds when newest non-merge commit post-dates the newest review — the pushed fix round is already in flight and the next bot verdict retires the clause (homelab#975)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "reviewable_again" }
    incidents: ["MP-G04 origin: tie-break rows existed only as breaker counts — the coordinator never got the structured dispatch"]

  - id: MP-T12
    name: red detection → fix round (content-based, edge-woken)
    owner: exporter red edge (/coordinate doorbell) + */10 poll → scan ci-red clause → coordinator item session
    when: "armed ∧ CI-red ∧ no Running worker ∧ fix-round attempts < RED_ROUNDS_MAX"
    status: guarded
    replay:
      - agents/replay/fixtures/ci-failure-run-select/ci-failure-run-select
      - agents/replay/fixtures/ci-red-rounds-two-channels/ci-red-rounds-two-channels
      - agents/replay/fixtures/ci-red-rounds-two-channels/ci-red-rerun-wake
      - agents/replay/fixtures/ci-red-rounds-two-channels/ci-red-rerun-wake-dispatch
      - agents/replay/fixtures/ci-red-rounds-two-channels/ci-red-deferred-then-debounced
      - agents/replay/fixtures/ci-red-rounds-sibling-mention
      - agents/replay/fixtures/ci-red-goal-head-excluded
    guards:
      - desc: "content-based: attempts = durable run-stats-comment count (not the old 4h updatedAt timer a no-op comment reset), dispatch cap 2/repo/scan"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ci-red" }
      - desc: "unchanged-state debounce on the dispatch leg (before the per-repo cap, so a frozen PR never spends a slot a live red PR could use) — homelab#198"
        anchor: { file: agents/coordinator-scan.sh, pattern: "pr_state_fp_pair" }
      - desc: "exporter red edge-trigger: POST /coordinate on an armed agent PR going CI-red, deduped per head_sha (a no-op pushes no commit → no re-wake)"
        anchor: { file: argocd/resources/github-exporter/github-exporter.py, pattern: "maybe_dispatch_cired" }
      - desc: "the play: fix round with the failing log in context / park / close; red-master = platform incident, not a fix round"
        anchor: { file: agents/coordinator/README.md, pattern: "ci-red. clause" }
    incidents: ["MP-G01 origin: #58's red e2e needed a MANUAL meta round dispatch (2026-07-21)", "2026-07-28 meta-14 #48: no-op rounds reset the 4h timer → livelock; the red loop had no exhaustion→escalation (FU-115)"]

  - id: MP-T13
    name: red rounds exhausted → arbitrate
    owner: scan ci-red clause (attempt cap) → agent/arbitrate → MP-T11 tie-break
    when: "armed ∧ CI-red ∧ fix-round attempts ≥ RED_ROUNDS_MAX (the Red→Arbitrate edge the FSM lacked — symmetric with the review loop's ROUNDS_MAX→arbitrate)"
    status: guarded
    unreplayed: "the RED_ROUNDS_MAX cap leg — extend the ci-red fixtures on next touch"
    guards:
      - desc: "scan labels agent/arbitrate + comments when red attempts hit the cap; the existing arbitrate clause + coordinator tie-break take over (re-dispatch stronger / close / escalate)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "ci-red → agent/arbitrate" }
    incidents: ["FU-115: the red loop livelocked forever (no exhaustion edge); this is MP-T11 ported to the CI-red side"]

  - id: MP-T14
    name: issue → review at PR-open, footprint releases
    owner: scan review-flip belt (deterministic) + agent-finalize finalize edge (cause)
    when: "agent/in-progress ∧ an OPEN PR STRONGLY references it (the C6 grammar — implements/closes/fixes/resolves or the line-anchored Issue: trailer; a bare mention must NOT count) → add agent/review, remove agent/in-progress. The footprint releases at PR-open BY DESIGN (homelab#501 direction (b)): at open the worker's occupation is durable branch state, so the ADR-097 same-file hold has nothing left to gate — and sibling dispatch must not couple to the codeowner's reading latency. Collision absorption is the merge path's own answer to same-file PRs: the ≤3-open-PR cap, strict up-to-date + updater serialization, and the merge-conflict judgment lane — a deterministic flip on the CAUSE side cannot add coupling the merge path already absorbs"
    status: guarded
    replay:
      - agents/replay/fixtures/review-flip-belt/review-flip-belt
      - agents/replay/fixtures/review-flip-belt/probe-fail
    guards:
      - desc: "STRONG link only, same grammar as C6's goal-child closeout — a sibling-seam bare mention must NOT flip (the circles#36 lesson)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "same grammar as C6" }
      - desc: "write discipline IL-T16 — add agent/review FIRST, remove agent/in-progress SECOND, then re-read and prove the end state (the edit is not atomic; neither-label = invisible to every clause)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "add agent/review FIRST" }
      - desc: "HUMAN-OWNED states excluded — agent/error (breaker) and agent/blocked (human gate) are never flip candidates"
        anchor: { file: agents/coordinator-scan.sh, pattern: "HUMAN-OWNED state" }
      - desc: "probe failure HOLDS and writes nothing (rule #6 — never fail INTO a write)"
        anchor: { file: agents/coordinator-scan.sh, pattern: "review-flip belt HELD" }
      - desc: "busy_fps stays level-triggered (reads agent/in-progress only) — the flip releases the footprint by construction on the next tick; no second gate to re-derive"
        anchor: { file: agents/coordinator-scan.sh, pattern: "busy_fps=" }
      - desc: "the CAUSE — finalize flips the labels at PR-open beside MP-T01 arming (foreign, agent-runtime); this scan belt is the belt over finalize's failures (MP-T01 arm-guard precedent)"
        anchor: { repo: agent-runtime, file: agent-base/agent-finalize, pattern: "agent/review" }
    incidents: ["homelab#501 origin: #477/#450 PRs sat 9-10h with issues never flipped to agent/review — footprints held, #478/#479 blocked by an UNUSED half of a Touches declaration while every PR codeowner-parked"]

  - id: MP-T09
    name: breaker trip and clear
    owner: any layer (reflex counts / reviewer STEP-0 ANOMALY arm / worker recipe / exporter alerts / human)
    when: "loop anomaly detected → agent/error + one AGENT_ERROR comment; HUMAN clears. Since
      homelab#122 / PR #123 (master 11c2045, 2026-08-08) the reviewer STEP-0 layer feeds this
      transition ONLY from its anomaly class (MP-T03 belt 3); its precondition class stands aside
      without a label, so a state the machinery resolves by re-dispatching never reaches here"
    status: guarded
    unreplayed: "the exclusion is anchor-grepped per clause; a dedicated breaker-trip fixture awaits its next touch"
    guards:
      - desc: "agent/error excluded from EVERY actionable clause (queued, c4c5, review pick, C9)"
        anchor: { file: agents/coordinator-scan.sh, pattern: 'index\("agent/error"\)' }
    incidents: ["2026-07-21 ×3 (two correct fires, one misfire → MP-T07 recipe exception)"]

gaps:
  - id: MP-G05
    name: "belt-3 cannot compute since-head"
    detail: "The exporter PAT can't read commit objects, so AgentReviewLoop uses a trailing-1h
      window, not verdicts-since-head — a slow loop (<3 verdicts/h) is invisible to layer 3."
    accepted: "documented degradation; layers 1+2 carry since-head precision (2026-07-12 decision)"
