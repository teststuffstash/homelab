# github-apps.yaml — the DECLARED state of every GitHub App's permissions (FU-098).
#
# This file is the single source the four formerly-unsynchronized places converge on:
#   1. bootstrap scripts (scripts/github-*-bootstrap.sh) template default_permissions from here
#      at creation time (creation can no longer diverge from the declaration);
#   2. docs/github-setup.md §2's permission column defers here;
#   3. the LIVE App settings (the only truth GitHub holds; API is read-only for permissions —
#      `GET /app` with the App JWT — so this file can be VERIFIED against live but never applied:
#      scripts/github-apps.sh --verify renders the drift matrix into docs/github-apps.md);
#   4. every MINT SITE's requested permissions must be ⊆ the App's declaration
#      (scripts/github-apps-lint.py, in ci — a request the App can't grant 422s in prod, which is
#      exactly how the fleet#134 workflows-scope gap surfaced 2026-07-25).
#
# CHANGE FLOW (the new process): PR this file first (the `why` is mandatory — a permission
# without a consumer is blast radius); the github-exporter drift alert fires while declared≠live;
# the operator makes the UI click (+ approves the permission update on each installation); the
# alert clears. Both hope-paths — a click nobody documented, a PR nobody clicked — are visible.
#
# `absent:` entries are DECIDED non-grants — the verify leg treats a live grant of one as drift
# just like a missing declared grant (over-grant is drift too).
#
# levels: read | write. org-level permissions are prefixed `org:`.

apps:
  - slug: homelab-agents
    app_id: 4150968
    install_id: 142724430
    purpose: >-
      Worker + coordinator git identity — homelab-agents[bot] is the PR author; mints the
      per-repo worker tokens (agent-git-<repo>, FU-089 central) and the coordinator/loop tokens.
    permissions:
      metadata: { level: read, why: "baseline — every App needs it" }
      contents: { level: write, why: "worker/coordinator clone+push (agent-git-<repo> gens, composition.yaml; agents/coordinator/git-token.yaml)" }
      pull_requests: { level: write, why: "workers open PRs; coordinator merges (git-token.yaml)" }
      issues: { level: write, why: "queue labels, strike/report comments, coordinator C6 (composition worker gens + git-token.yaml)" }
      checks: { level: read, why: "coordinator `gh pr checks` (git-token.yaml + composition loop-git gens; fine-grained PATs cannot read Checks — App-only)" }
      statuses: { level: read, why: "merge-path require_passed_checks reads (loop-git gens)" }
      actions: { level: read, why: "coordinator `gh run watch`/rerun on agent repos (loop-git gens)" }
      workflows: { level: write, why: "fleet#134 — track/chassis carve-out needs workers pushing .github/workflows/ci.yaml; DECLARED 2026-07-26 ahead of the grant (the drift alert rings until the operator clicks)" }
    installs: selected # the agent repos — see docs/github-apps.md (install matrix, generated)
    key_locations: [Infisical AGENTS_GH_APP_PRIVATE_KEY, "~/.claude/homelab-github-agents/"]

  - slug: homelab-reviewer
    app_id: 4199252
    install_id: 143941082
    purpose: >-
      The review bot's identity — homelab-reviewer[bot] submits approve/request-changes.
      Distinct App on purpose: GitHub blocks self-approval, so it must not be the PR author.
    permissions:
      metadata: { level: read, why: "baseline" }
      contents: { level: write, why: "the approval must COUNT — GitHub only counts reviews from a repo writer (contents:read ⇒ authorAssociation NONE, ignored)" }
      pull_requests: { level: write, why: "submit reviews" }
      checks: { level: read, why: "reviewer reads CI state (composition loop-reviewer gens)" }
      statuses: { level: read, why: "same" }
      actions: { level: read, why: "reviewer reads run logs on private repos (loop-reviewer gens)" }
      code_quality: { level: read, why: "OPERATOR RULING 2026-07-26: deliberate future-proof read — a reviewer probing a surface that 422s mid-review reads as 'something is there'; harmless reads are pre-granted so review probes fail honest-empty, not permission-denied" }
      discussions: { level: read, why: "same ruling — deliberate future-proof reviewer read" }
    absent:
      issues: "reviewer never labels/comments issues — the coordinator lane owns that; keeps the reviewer's blast radius review-only"
    installs: selected
    key_locations: [Infisical REVIEWER_GH_APP_PRIVATE_KEY, "~/.claude/homelab-github-reviewer/"]

  - slug: homelab-merge
    app_id: null # fill from the cred dir on the next --verify run outside the jail
    install_id: null
    purpose: >-
      The merge-serializer identity — update-pr-branch.yml's branch-update push. Dedicated App:
      its key sits in an org Actions secret readable by the semi-trusted CI plane, so minimal.
    permissions:
      metadata: { level: read, why: "baseline" }
      contents: { level: write, why: "branch-update push" }
      pull_requests: { level: write, why: "update-branch is a /pulls/ mutation — an App needs BOTH contents+PR write or it 403s" }
      checks: { level: read, why: "require_passed_checks" }
      statuses: { level: read, why: "require_passed_checks" }
    absent:
      issues: "the conflict-labeling step uses GITHUB_TOKEN instead — a leaked merge key must not grant issue writes"
    installs: selected # agent repos + homelab (deploy target)
    key_locations: [org Actions secret via tofu/github/actions_secrets.tf, KeePass]

  - slug: homelab-renovate
    app_id: null
    install_id: null
    purpose: Self-hosted Renovate's identity (renovate.yaml) + devbox-update/runner-image lockfile fetches.
    permissions:
      metadata: { level: read, why: "baseline" }
      contents: { level: write, why: "renovate branches; devbox-update.sh pushes; runner-image warm-store lockfile fetch (private repos)" }
      pull_requests: { level: write, why: "renovate + devbox-update PRs; runner-image self-bump PR" }
      issues: { level: write, why: "the Dependency Dashboard issue" }
      workflows: { level: write, why: "renovate bumps pinned action refs under .github/workflows/" }
    absent:
      vulnerability_alerts: "DECIDED — vulnerability data comes from Renovate's OSV alerts, not GitHub Dependabot (docs/renovate.md §OSV: 'we use OSV instead and ignore that warning'; self-host ethos, no repo Dependency-graph settings needed)"
    installs: selected
    key_locations: [org Actions secrets RENOVATE_APP_ID/RENOVATE_APP_PRIVATE_KEY, KeePass]

  - slug: homelab-labels
    app_id: null
    install_id: null
    purpose: Label-sync identity (agent label set across repos).
    permissions:
      metadata: { level: read, why: "baseline" }
      issues: { level: write, why: "create/update labels (labels ride the Issues permission)" }
    installs: all
    key_locations: [KeePass]

  - slug: homelab-deploy
    app_id: null
    install_id: null
    purpose: Deploy-pin bump PRs into deploy-target repos (FU-051; homelab, sleep-iac, oracle-iac).
    permissions:
      metadata: { level: read, why: "baseline" }
      contents: { level: write, why: "push the bump branch" }
      pull_requests: { level: write, why: "open + auto-merge the bump PR" }
    installs: selected
    key_locations: [org Actions secrets DEPLOY_APP_*, KeePass]

  - slug: homelab-arc
    app_id: null
    install_id: 142353606
    purpose: Actions Runner Controller registers the org homelab-ephemeral scale set.
    permissions:
      "org:self_hosted_runners": { level: write, why: "runner registration" }
      metadata: { level: read, why: "baseline" }
    installs: all # + "Allow public repositories" on the runner group (docs/github-setup.md §4)
    key_locations: [in-cluster arc-github-app Secret, KeePass]

  - slug: homelab-runner-registrar
    app_id: 4141567
    install_id: 142515626
    purpose: The Proxmox CI-runner VM mints its own registration tokens at boot (ADR-082).
    permissions:
      "org:self_hosted_runners": { level: write, why: "runner registration" }
      metadata: { level: read, why: "baseline" }
    installs: selected
    key_locations: ["ci-runner VM cloud-init (/etc/runner-app/private-key.pem)", KeePass]
    note: "FU-017: merge into homelab-arc — identical grants"
