# publicroute-tf-validate fixture — the ADR-123 operational-path opt-in: a claim that keeps
# /healthz public and lets /metrics stay blocked. Exercises the partial-list branch of both
# legs (connector path regex + edge WAF rule), which the all-default fixtures cannot reach.
apiVersion: platform.teststuff.net/v1alpha2
kind: XPublicRoute
metadata:
  name: ops-optin-xr
spec:
  claimRef:
    apiVersion: platform.teststuff.net/v1alpha2
    kind: PublicRoute
    name: ops-optin
    namespace: oracle-fleet
  profile: api
  zone: minutark.ee
  hostname: ops-optin.minutark.ee
  backend:
    service: oracle-gateway.oracle-fleet.svc.cluster.local.
    port: 8080
  operationalPaths:
    public:
      - /healthz
