  - name: wk-metal-04
    kind: metal
    zone: wk-metal-04
    label: "`wk-metal-04` (desktop i5-3570K 16GB, PXE)"
    role: k8s worker, ephemeral/compute tier (tainted; kata node, no AVX2) + Longhorn bulk tier
    hardware: desktop, i5-3570K (Ivy Bridge, VT-x/EPT, no AVX2)
    cpu_cores: 4
    memory_gb: 16
    ip: 192.168.2.186
    plug: null
    idle_w: null
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    # Desktop i5-3570K (Ivy Bridge: VT-x + EPT → kata OK; VT-d absent on the K SKU but not needed
    # for microVMs; NO AVX2 → intentionally left avx2-unset, so goose rides schedule here but
    # opencode (Bun SIGILLs) does not). 16GB RAM = the roomy kata node: unlike the 8GB laptops a
    # ~5Gi ride fits with ~7Gi to spare (the Playwright/Chrome gate's home — sleep#48).
    # 500GB SATA SSD → /dev/sda (⚠ CONFIRM via `talosctl -n 192.168.2.186 get disks --insecure` at
    # maintenance before install). kata=true → metal_kata install image + homelab.io/kata label +
    # the FU-112b kubelet reservation (conservative on 16GB). Compute tier: tainted ephemeral.
    talos_metal_node: true
    install_disk: /dev/sda
    kata: true
    longhorn_default_disk: true
    # 2026-09-09: two Intel SSD Pro 7600p 256 GB (SSDPEKKF256G8L — SM2262, 2×256 MB DDR4 DRAM, 3D TLC;
    # the R2 lot, teststuff/hardware) on Axagon PCEM2-N x4 adapters in the two x16-length slots.
    # Together they are the `bulk` tier's DRAM-cached replacement for the DRAM-less SA400
    # (docs/storage-ledger.md §2026-09-05: 486 ms / 26 MB/s sustained) — the "demote": new bulk
    # placements + garage-0's zone volumes go here, the SA400 keeps Talos + the image store + what
    # already sits on it. by-id (eui) selectors: this directive PARTITIONS what it points at, and
    # /dev/nvme{0,1}n1 is enumeration order. Names are the live Longhorn disk keys — never rename.
    longhorn_disks:
      - { device: /dev/disk/by-id/nvme-eui.5cd2e42a81a410f6, name: intel0, tags: [bulk] } # serial BTHH829402EZ256B
      - { device: /dev/disk/by-id/nvme-eui.5cd2e42a81a35e16, name: intel1, tags: [bulk] } # serial BTHH817204JW256B
    ephemeral: true
    notes: >-
      The roomy kata node (16GB — Playwright/Chrome gate home); 500GB SATA; no AVX2 so
      opencode/Bun rides are excluded; onboarded 2026-07-28. Carries the THIRD bulk-tier
      Longhorn disk since 2026-08-07 (ADR-089 addendum): 150Gi reserved, because Longhorn shares
      the ephemeral partition with the containerd+kata image store and the kubelet's nodefs
      floor evicts pods when they collide.

  - name: nx-01
    kind: metal
    zone: nx-01        # ⚠ SAME 2U twin chassis as nx-02 (shared backplane + 1+1 PSUs), so these
                       # two zone labels are NOT the independent domains Longhorn/Garage
                       # anti-affinity reads them as. Both nodes are declared storage-free, which
                       # is what keeps it harmless; before any replica lands on either, collapse
                       # the two to ONE zone name (docs/storage-ledger.md §Requirements).
    label: "`nx-01` (Nutanix NX-6035-G5 node 1, 2U twin, PXE)"
    role: k8s worker, RIDE/ARC tier (tainted; kata node, EPHEMERAL on NVMe) — no Longhorn
    hardware: Supermicro X10DRT-P-G5-NI22 (Nutanix NX-6035-G5, CSE-827HD+ 2U twin), 2 × Xeon E5-2640 v4
    cpu_cores: 40        # 2 sockets × 10C/20T — the largest node in the fleet
    memory_gb: 64        # 4 × 16GB Samsung M393A2K40BB1-CRC DDR4-2400 RDIMM; 12 of 16 slots FREE
    ip: 192.168.2.58
    plug: null
    idle_w: null         # 104 W read from the BMC (DCMI, BIOS idle, no drives, single PSU) —
                         # deliberately NOT in this column, which holds WALL-METER numbers.
                         # Supply-side detail + method: teststuff/hardware docs/nx-6035-g5.md.
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    remote_power: "IPMI/BMC — the fleet's FIRST (ADR-013 assumed none): `ipmitool -I lanplus -H 192.168.2.123 -U ADMIN -P ADMIN chassis power on|off|cycle`. No WoL or smart plug needed."
    # 2026-09-16: the day-one reboot storm was the Talos v1.13.2 kernel's page_table_check bug under
    # ARC jobs (docs/incidents/2026-09-16-page-table-check-reboots.md, FU-246), NOT this hardware —
    # cordoned until it runs Talos ≥ v1.13.10. SEL notes: CMOS cell dead (VBAT 1.16 V), PS2 uncabled.
    # Bought 2026-09-14 (€399) against the hardware register's own "no" — the objections were noise
    # and idle draw, never function. Onboarded 2026-09-15 as a BURN-IN: the open question is whether
    # a 2U twin is liveable in the house over days and nights under moderate load, which is why it
    # takes ordinary workloads but carries NO Longhorn disk — nothing here is load-bearing and a
    # drain is instant. If the noise verdict is "no", this node leaves without taking data with it.
    # ⚠ Only ONE of the two nodes in the chassis is cabled and running; the second is deliberately
    # off until the trial concludes. The PSUs are chassis-level 1+1 SHARED by both nodes.
    # ⚠ eno2 (ac:1f:6b:60:ed:9b) is intentionally unconfigured and uncabled — one address per node.
    # The install disk is pinned by SERIAL, not by wwn: this ADATA reports a NULL WWN
    # (naa.5000000000000000) through the SAS3008, so the wwn-* symlink is not unique and /dev/sda
    # will shift the moment an NVMe is added. It is a DRAM-less QLC drive = boot + image store only,
    # never data (the hardware register's R2 filter).
    talos_metal_node: true
    install_disk: /dev/disk/by-id/ata-ADATA_SU630_2J4720061320
    avx2: true           # Broadwell-EP — AVX2 present (unlike the Pentium Gold boxes)
    kata: true           # VT-x present; metal_kata install image + homelab.io/kata label
    ephemeral: true      # the ride/ARC tier taint — nothing lands here that cannot tolerate it
    # 62 Gi and 40 threads is the ONE node where rides and ARC runners do not contend: the 8 GB
    # laptops fit either one microVM or one runner, which is why tofu/talos.tf declines to label
    # them. This box IS the storage-ledger's "RIDE/ARC box" row, so it carries both (FU-218 (a)).
    arc: true            # join the ARC runner pool (homelab.io/ephemeral LABEL, not the taint)
    # EPHEMERAL (containerd image store + ride scratch) goes on the NVMe, NOT the system disk.
    # Boot stays on the SATA bay drive above: these boards boot LEGACY and a passive M.2 adapter
    # has no option ROM, so an NVMe cannot be a boot device — but it can carry EPHEMERAL, which is
    # where ride-host pressure actually lands. Matched by TRANSPORT, not serial, so it survives
    # whichever of the two 256 GB NVMe units is fitted (same lesson as the answer-file's
    # ID_SERIAL_SHORT match: never pin to a device name that can shift).
    ephemeral_disk_selector: disk.transport == "nvme"
    notes: Nutanix NX-6035-G5 node 1; the fleet's RIDE/ARC box (storage-ledger §a RIDE/ARC box); BMC 192.168.2.123; onboarded 2026-09-15, converted from compute-only 2026-09-15.

