# Homelab machine inventory — the SINGLE SOURCE OF TRUTH for what boxes exist, and (for the
# bare-metal Talos workers) how tofu installs them. Two consumers read this file:
#
#   1. `tofu/locals.tf`  — `yamldecode(file(...))` derives `local.metal_nodes` (tofu/metal.tf),
#      `local.avx2_nodes` (the homelab.io/cpu-avx2 label) and `local.ephemeral_nodes` (the
#      homelab.io/ephemeral taint). Editing a metal flag HERE changes the cluster on the next
#      `tofu apply` — there is no second copy in the .tf files any more.
#   2. `machines/generate.py` — regenerates machines/README.md + machines.html AND the
#      marker-delimited host tables + version line in ../README.md and ../CLAUDE.md.
#
# After ANY edit:  devbox run -- python3 machines/generate.py   (then commit the generated files;
# re-running must produce an empty diff — the tables are a stable regeneration, CONTEXT.md #2).
#
# ── Fields ───────────────────────────────────────────────────────────────────────────────────
# Identity / docs (consumed by generate.py):
#   name        node/host name (also the tofu map key + the k8s node name for cluster members)
#   kind        metal | vm | lxc | device   — only `metal` boxes appear in the power/benchmark
#               table (a VM/LXC draws no wall power of its own)
#   label       host-table display name, markdown (README.md + CLAUDE.md "Host" column)
#   role        one-line role — the "Role" column of BOTH generated tables
#   ip          primary IPv4; `ip_display` overrides just the rendered text (pop-os is dual-homed)
#   hardware    box/CPU description (power table "Hardware" column)
#
# Power / benchmarks (`kind: metal` only; leave null/omit what's not measured yet):
#   cpu_cores (logical), memory_gb, plug (HA entity), idle_w, load_w, singlecore_bogo_s,
#   multicore_bogo_s, remote_power, notes.
#   Benchmark = stress-ng `--cpu N --cpu-method matrixprod` bogo-ops/s (synthetic; only comparable
#   across these runs, not a real-world score). See docs/power-measurements.md for the method.
#   Derived columns (perf/W, load delta) are computed by the generator — don't hand-edit them.
#   remote_power = how the box is powered on/cycled remotely (WoL, smart-plug, hypervisor, …).
#   Matters for power-loss recovery — see docs/runbook.md "Power-loss / ghost-node recovery".
#
# Talos / cluster flags (consumed by tofu):
#   talos_metal_node  true ⇒ tofu/metal.tf manages this node's machine config (PXE-installed
#                     bare-metal node). Requires `install_disk`.
#   controlplane      true ⇒ this metal node is a CONTROL PLANE, not a worker (ADR-133's laptop
#                     CP). Default false. ⚠ INSTALL-TIME: machine_type is baked at install, so
#                     flipping it on a running node does nothing — the node must be reset to
#                     maintenance and reinstalled (docs/provisioning.md). Flip it in the same
#                     change that drops `ephemeral` (a CP carries no ride taint); `kata` stays,
#                     the label is harmless and the ARC pool selects on `arc`, not on it.
#                     ⚠ Never flip two nodes at once: joining leaves etcd at an even membership,
#                     and two members are LESS available than one (ip-plan.md, the VIP ruling).
#   install_disk      target disk for the Talos install (NOT any longhorn_disks entry)
#   longhorn_disks    extra block devices formatted+mounted as ADDITIONAL Longhorn disks, one
#                     entry per device: {device, name, tags}. Mounted UNDER /var/lib/longhorn/ on
#                     purpose: longhorn-manager only host-mounts that path (Bidirectional
#                     propagation), so a disk anywhere else is invisible to it. Each becomes
#                     /var/lib/longhorn/<name>, and <name> is ALSO the disk key in the
#                     node.longhorn.io CR — so renaming one makes Longhorn see a new empty disk
#                     and declare the old one missing. Never rename an entry that holds replicas.
#                     `tags` selects the ADR-089 tier (docs/storage-ledger.md); registration is
#                     scripts/longhorn-tag-disks.sh (std/bulk) or -register-optane.sh (fast).
#                     ⚠ Prefer a /dev/disk/by-id/wwn-* device here over /dev/sdX: this directive
#                     PARTITIONS the device, and on a box with two same-size disks a /dev/sdX that
#                     re-enumerates would format the wrong one (hp-01, 2026-08-25).
#   pin_hostname      pin the hostname via a HostnameConfig patch (default true). Set false for a
#                     node that has NOT yet been reinstalled with the pinned config — otherwise a
#                     plain `tofu apply` would push the hostname change to the *running* node and
#                     ghost it (install-time only; see the ⚠ in tofu/metal.tf).
#   ephemeral_max_size  cap the EPHEMERAL (/var) volume so USER VOLUMES fit on the same install
#                     disk. Talos provisions system volumes BEFORE user volumes and grows the
#                     grow:true ones last, so an uncapped EPHEMERAL takes the whole disk and the
#                     user volume never provisions (siderolabs/talos discussion #12713 — this cap
#                     IS the maintainer's answer). ⚠ INSTALL-TIME ONLY: Talos applies volume
#                     config only to an UNPROVISIONED volume and XFS cannot shrink, so changing
#                     this on a live node is a no-op — it needs a wipe + reinstall.
#   user_volumes      [{name, min_size, grow}] — node-local XFS partitions, auto-mounted at
#                     /var/mnt/<name> (partition label u-<name>), selected onto the system disk.
#                     Distinct from longhorn_disks: those are WHOLE extra devices handed to
#                     Longhorn; these are partitions of the install disk for a workload that
#                     wants node-local storage rather than replicated storage (ADR-114: Garage
#                     engines replicate, so storage must store singles). Same install-time-only
#                     rule as above.
#   longhorn_default_disk  true ⇒ this node's Longhorn disk is the DEFAULT one (/var/lib/longhorn,
#                     i.e. the Talos EPHEMERAL partition, shared with the containerd image store).
#                     Drives the kubelet imageGC floor patch in metal.tf (60/50 instead of the
#                     85/80 default): the 2026-09-01 collision — images accumulate until Longhorn's
#                     25% minimal-available floor refuses every new replica — is a property of the
#                     shared partition, not of kata, so a non-kata storage node needs it too (m70s,
#                     the ADR-114 zone; storage-ledger.md §2026-09-07). Registration stays
#                     scripts/longhorn-tag-disks.sh. Kata nodes carry the floor already.
#   kata              install the metal_kata image (Kata Containers runtime — SLSA Phase-3 /
#                     agent-CI microVMs, tofu/image.tf) and label the node kata-capable (the
#                     `kata` RuntimeClass in kata.tf selects on it). Requires VT-x in BIOS.
#                     Install-time only, like everything in install.image.
#   avx2              CPU has AVX2 ⇒ Talos machine.nodeLabels homelab.io/cpu-avx2=true, so the
#                     label travels with the machine config and survives a reinstall
#                     (boot-from-git) instead of an imperative `kubectl label`. Used to schedule
#                     AVX2-only workloads (opencode's Bun runtime SIGILLs without it; see
#                     agents/agent-session.sh). Applies to VMs and metal alike.
#   ephemeral         compute/ephemeral tier ⇒ the homelab.io/ephemeral=true NoSchedule taint
#                     (kubernetes_node_taint in tofu/metal.tf), so stateful workloads never land
#                     there; explicitly-tolerating workloads still can. Applied AFTER the node
#                     joins (docs/provisioning.md step 7).
#   arc               node joins the ARC runner pool ⇒ Talos machine.nodeLabels
#                     homelab.io/ephemeral=true, which is what the runner scale set's
#                     nodeSelector matches (argocd/platform/arc-runners.yaml). SEPARATE from
#                     `ephemeral` above on purpose: that flag is the TAINT (keep stateful work
#                     off), this one is POOL MEMBERSHIP (invite CI runners in), and a runner pod
#                     (~2.5 Gi incl. dind) competes with a kata microVM (≤4 Gi + 512 Mi overhead)
#                     for the same RAM — so widening the pool onto a small kata node is an
#                     operator call, not a default (FU-218 (a); the VM path's equivalent block in
#                     tofu/talos.tf declines it for exactly this reason). Same boot-from-git
#                     pattern as `avx2`: the label rides the machine config and survives a
#                     reinstall, unlike the imperative `kubectl label` on wk-metal-01/-02.
#   zone              failure-domain for topology.kubernetes.io/zone (ADR-114): physical box =
#                     zone; every VM on the pve thin pool = "proxmox" (the 2026-08-24 incident
#                     took several VMs with ONE pool). Consumed by tofu/longhorn.tf via
#                     local.machine_zones; the label lands only on k8s nodes (ci-runner-01
#                     carries the field as failure-domain documentation).
#
# NOT here (yet), on purpose — each has one home and moving it needs a file outside this change:
#   • VM specs (vm_id/cores/memory/disk) — `var.nodes` in tofu/variables.tf, `ci-runner.tf` for
#     the runner VM. The `ip` below is the only field duplicated from there.
#   • MAC addresses / DHCP reservations — `opnsense/dnsmasq-dhcp.py`.
#   • Version triple (Talos/k8s/Cilium) — `tofu/variables.tf` defaults; generate.py READS them
#     from there to render the version line (one home, no copy).
#   • Services (VIPs/hostnames) — SERVICES.md (its generated successor is FU-049).

machines:
  - name: opnsense
    kind: metal
    label: OPNsense ("Big Data", HP desktop)
    role: Router/FW + DHCP (dnsmasq) + DNS (Unbound) + FRR/BGP + HAProxy + ACME
    hardware: HP desktop ("Big Data")
    cpu_cores: 4         # i5-2500
    memory_gb: 8
    ip: 192.168.2.1
    plug: sensor.plug_opnsense_power
    idle_w: 57
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    notes: Not stress-tested (production router).

  - name: pve
    kind: metal
    label: Proxmox `pve` (X99/Xeon, 64GB)
    role: Hypervisor for the Talos VMs + Matchbox LXC
    hardware: AliExpress X99 + Intel Xeon E5-2680 v4
    cpu_cores: 28        # 14C / 28T
    memory_gb: 64
    ip: 192.168.2.3
    plug: sensor.plug_pve_power
    idle_w: 127
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    notes: Idle figure is from the dashboard; not stress-tested (don't want to stress the hypervisor).

  - name: matchbox
    kind: lxc
    label: Matchbox LXC (CTID 210)
    role: PXE provisioning (proxy-DHCP + TFTP + Matchbox)
    hardware: LXC container on pve (CTID 210)
    ip: 192.168.2.30
    notes: Provisioned by the separate tofu root tofu/provisioning/ (own state).

  - name: cp-01
    kind: vm
    zone: proxmox
    label: "`cp-01` (VM)"
    role: k8s control plane
    hardware: Talos VM on pve
    ip: 192.168.2.51
    # avx2 deliberately unset: the label targets AVX2-only *workload* scheduling, and the control
    # plane carries none (unchanged from the pre-YAML local.avx2_nodes set).

  - name: wk-01
    kind: vm
    zone: proxmox
    label: "`wk-01` (VM)"
    role: k8s worker
    hardware: Talos VM on pve
    ip: 192.168.2.61
    avx2: true           # Xeon E5-2680 v4 (Broadwell) — verified via /proc/cpuinfo

  - name: wk-02
    kind: vm
    zone: proxmox
    label: "`wk-02` (VM)"
    role: k8s worker (left the Longhorn std tier 2026-09-14 — compute-only; mounts volumes, serves none)
    hardware: Talos VM on pve
    ip: 192.168.2.62
    avx2: true           # Xeon E5-2680 v4 (Broadwell) — verified via /proc/cpuinfo

  - name: wk-03
    kind: vm
    zone: proxmox
    label: "`wk-03` (VM)"
    role: k8s worker, ephemeral/CI-runner tier (tainted; removable — no Longhorn disks, no kata)
    hardware: Talos VM on pve
    ip: 192.168.2.63
    avx2: true           # same host CPU as wk-01/wk-02
    ephemeral: true      # taint (metal.tf for_each) + nodeLabel (talos.tf patch) — ARC runners
                         # select on the LABEL; added 2026-08-18 to double CI runner capacity
                         # (2→4 slots). Deliberately a VM: CI needs no metal (no kata/KVM — that
                         # is the RIDE pool's requirement), and reclaiming the RAM later is
                         # drain + tofu destroy of this one VM (nothing stateful lands here).

  - name: wk-04
    kind: vm
    zone: nx-02        # the nx-02 BOX is the failure domain. ⚠ nx-01 and nx-02 are the two nodes
                       # of ONE 2U twin chassis (shared backplane, 1+1 shared PSUs), so as zone
                       # labels they are NOT the independent domains Longhorn/Garage anti-affinity
                       # reads them as. Harmless while neither carries data — both are declared
                       # storage-free — so the rule is: BEFORE any replica is placed on either
                       # node, collapse the two to ONE zone name. Renaming a zone after replicas
                       # land makes Longhorn see a new empty disk and declare the old one missing.
    label: "`wk-04` (VM on nx-02)"
    role: k8s worker, untainted batch compute (the second hypervisor's first VM)
    hardware: Talos VM on nx-02
    ip: 192.168.2.64
    avx2: true           # Xeon E5-2640 v4 (Broadwell) — same family as the pve VMs

  - name: thinkcentre
    kind: metal
    label: "`thinkcentre` (metal, OUT of the cluster)"
    role: R12 out-of-band management-box PILOT — left cluster duty 2026-09-12, NixOS installed 2026-09-13 (ADR-129); its first apply waits on FU-012's state copy
    hardware: Lenovo ThinkCentre Edge
    cpu_cores: 2
    memory_gb: 4
    ip: 192.168.2.53
    plug: sensor.plug_thinkcentre_power
    idle_w: 27.9
    load_w: 54.5
    singlecore_bogo_s: 1200.4
    multicore_bogo_s: 2231.7
    remote_power: smart-plug (switch.tuyalocal_thinkcentre — entity ids were CROSSED with hp-01's 2026-08-18→09-09, read the incident before trusting an older plug observation); auto-boots on AC restore — NOT WoL
    # ⚠ NO LONGER A CLUSTER MEMBER (2026-09-12). It was `k8s worker + Longhorn (+ 2×Optane fast
    # tier)` for 101 days; the operator retired it from cluster duty once std had two other
    # schedulable nodes (m70s 416 G + hp-01 233 G vs a ~141 G tier) and gave it the R12 role —
    # the out-of-band management box of docs/spikes/no-human-in-the-loop.md, as a PILOT only.
    # Decommission run: 16 Longhorn replicas evicted 18:58→19:02Z (0 degraded, no co-location),
    # drained, shut down. Storage: docs/storage-ledger.md; the R12 row + why it is NOT the
    # permanent box (27.9 W idle, no AES-NI, the absent x16 CPU root port) lives in the private
    # hardware requirements register. Installed 2026-09-13 (docs/management-box.md); its test
    # surface is ruled (§The test surface), its first apply waits on `main`'s state copy (FU-012).
    # The Talos flags (talos_metal_node / install_disk / longhorn_disks / pin_hostname / zone) were
    # REMOVED, not commented out — tofu derives cluster membership from their presence.
    # Hardware facts that outlive the role: 120GB Kingston SV300S3 SATA SSD (/dev/sdb when
    # PXE-booting with no USB stick — enumeration-order dependent). Two Intel Optane M10 16GB on
    # PCIe→M.2 adapter CARDS (the board has no native M.2 slot) — queued to move to wk-metal-04
    # as ride/ARC scratch; the x1 AIC form factor is off the market, so do not discard them.
    # PCIe (SMBIOS type 9, five slots): J7B1 + J8B4 free on chipset root ports 5/6 → the x1 NIC
    # R12's dual-homing needs fits; the two Optane cards free two more when they leave.
    # No AVX2 and no AES-NI (Pentium G840) — both verified from /proc/cpuinfo flags.
    notes: >-
      Desktop — highest absolute throughput of the tested boxes, but thirsty.
      WoL is not the control path: BIOS is set to power-on after AC loss, so the box never rests
      in S5 (a magic packet sent 2026-06-09 while the plug was ON found it already at full idle
      draw, ~28 W, not waiting in standby). Remote power = cycle switch.tuyalocal_thinkcentre via
      Home Assistant; it boots when AC returns. NIC-level WoL support is therefore unverified
      (Talos ships no ethtool) and moot for this box.

  - name: hp-01
    kind: metal
    zone: hp-01
    label: "`hp-01` (metal, PXE)"
    role: k8s worker + Longhorn (WoL-capable)
    hardware: HP Compaq Elite 8300 SFF (board 3397), i3-3220
    cpu_cores: 4         # 2C / 4T — i3-3220 (Ivy Bridge); this field is THREADS (kubectl capacity.cpu)
    memory_gb: 16        # ⚠ CORRECTED 2026-09-12: 2 × 8 GB DDR3-1600 in DIMM4+DIMM2 (dmidecode type
    #                      17 + talosctl memorymodules + node capacity 16225688Ki all agree). The
    #                      old "8" predates any board read. 4 slots, DIMM1+DIMM3 free, max 32 GB.
    #                      PCIe (dmidecode type 9, all four EMPTY): x16 PCIe 2.0 + x4 PCIe 2.0 + x1
    #                      + legacy PCI — i.e. TWO x4-capable low-profile slots free.
    ip: 192.168.2.54
    plug: sensor.plug_hp_power
    idle_w: null
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    remote_power: Wake-on-LAN (PXE-booted); smart plug switch.tuyalocal_hp exists but AC-restore is flaky — prefer WoL
    # HP desktop — 128GB SanDisk SATA SSD. Installs WITH extensions (the metal install image),
    # so it joins Longhorn-ready. Power: the hp plug (ex-konditsioneer NOUS A1, renamed
    # 2026-08-18; AC-restore flaky → WoL).
    # No AVX2 — verified via /proc/cpuinfo.
    talos_metal_node: true
    install_disk: /dev/sda
    longhorn_disks:
      # 2nd 128GB SATA SSD added 2026-08-25 to relieve the std tier — hp-01 is the node
      # docs/storage-ledger.md calls the one place where the honest answer is buy a disk.
      # by-id, NOT /dev/sdb: both disks are 128GB SATA and this directive partitions.
      - { device: /dev/disk/by-id/wwn-0x500080db1007e129, name: hg5d, tags: [std] }
      # Intel SSD Pro 7600p 256G (SSDPEKKF256G8L) from the 10-lot, on the spare Gembird PEX-M2-01
      # in the x16 LP slot, fitted 2026-09-12. THE std CAPACITY FLOOR, not a preference: with
      # thinkcentre leaving cluster duty (operator, 2026-09-12) std has two schedulable nodes, every
      # r=2 volume needs a copy on each, the distinct std footprint is ~141G and hp-01's only std
      # disk (hg5d) is 127G with 61G free. Longhorn's anti-affinity here is SOFT
      # (replica-soft-anti-affinity=true), so the failure mode is not a Pending volume but SILENT
      # co-location of both replicas on m70s — capacity is what prevents it.
      # DRAM-cached by the drive's own answer (hmpre 0), 3% used / 4457h / 0 media errors, Opal
      # capable but unlocked. An Intel rather than the shelf Micron 2200 on purpose: std's two
      # copies then sit on different makers (m70s Micron 2300 + this).
      # ⚠ Negotiates PCIe 2.0 x4 (5.0 GT/s) — this board's slot is PCIe 2.0 (dmidecode type 9), NOT
      # a drive fault; ~2GB/s, far above what small synchronous std writes ask for.
      - { device: /dev/disk/by-id/nvme-eui.5cd2e42a81a4111d, name: intel7600p, tags: [std] }
    notes: On the hp plug (a NOUS A1; entity ids were crossed with thinkcentre's 2026-08-18→09-09, fixed in the HA registry) — power measurable as sensor.plug_hp_power (~24 W idle); switch.tuyalocal_hp can cycle it, but AC-restore is flaky (confirmed 2026-09-09 — did not boot after a plug cycle) and WoL cannot follow an AC cut, so a plug cycle ends at the power button. Prefer WoL from a clean shutdown.

  - name: m70s
    kind: metal
    zone: m70s
    label: "`m70s` (Lenovo ThinkCentre M70s SFF, PXE)"
    role: k8s worker + Longhorn (third physical Garage zone — ADR-114)
    hardware: Lenovo ThinkCentre M70s SFF
    cpu_cores: 4         # 2C / 4T — Pentium Gold G6400 @ 4.00GHz (talosctl get processors)
    memory_gb: 16
    ip: 192.168.2.56
    plug: null
    idle_w: null
    load_w: null
    singlecore_bogo_s: null
    multicore_bogo_s: null
    remote_power: PXE-first in BIOS by operator choice — a network wipe+reinstall needs no console. WoL untested; no smart plug yet.
    # Bought 2026-09-07 (≈150 €) to be FU-137's third PHYSICAL Garage zone: ADR-114 puts Garage at
    # rf=3, one instance per physical zone, and the interim third zone was a VM on the pve thin pool
    # that has hit 100 % four times. Supply-side detail: teststuff/hardware (private).
    # OEM disk is a Micron 2300 512GB (MTFDHBA512TDV, LPDDR4 DRAM + 96L TLC — it clears the
    # DRAM-cache filter, so it is data-class, not just a boot drive). Arrived with a Windows GPT.
    # 4 DIMM slots, ONE filled (SK Hynix HMA82GU6DJR8N-WM 16GiB, ChannelA-DIMM1) — a matched second
    # stick makes it 32GB dual-channel. 3 SATA ports, all empty. PCIe: ONE x4-capable slot — the
    # x16 LP, holding the PM961 since 2026-09-12; the `x4` silkscreen is an x1 connector and the
    # `x1` silkscreen is unpopulated (board-read 2026-09-12; the earlier "x4 LP" read was wrong).
    # avx2 deliberately unset — /proc/cpuinfo on the installed node has NO avx/avx2 (Intel disables
    # them on Pentium Gold SKUs), same shape as wk-metal-04. `vmx` IS present, so it could host kata,
    # but it is storage tier and stays untainted/non-kata on purpose.
    talos_metal_node: true
    # ⚠ BY-ID, not /dev/nvmeXn1 (2026-09-12): fitting the Samsung PM961 on a PCIe adapter made it
    # `nvme0n1` and pushed this OEM Micron to `nvme1n1`, so the old `/dev/nvme0n1` here now named
    # the GARAGE DATA DISK — a reinstall would have wiped the zone (and this box is PXE-first).
    # A by-id path that stops matching fails the install loudly instead; schema-checked with
    # `talosctl validate --mode metal`. Install-time only, like every field in this block.
    install_disk: /dev/disk/by-id/nvme-Micron_MTFDHBA512TDV_21052D0C4364
    longhorn_default_disk: true # registered 2026-09-07; tier tag `std` since 2026-09-12, once the
    # zone's volumes moved to the PM961 below — the fleet direction's "Micron → std", and the
    # capacity that lets wk-02's pooled std disk stop taking new replicas (longhorn-tag-disks.sh).
    longhorn_disks:
      # Samsung PM961 256G on a Gembird PEX-M2-01 in the x16 LP slot, fitted 2026-09-12 —
      # garage-1's DEDICATED data disk, the FU-137 residual. Read in place before declaring:
      # 1% used, 3925h, hmpre 0 (real DRAM), link 8.0 GT/s x4 = its maximum, Opal-capable but
      # unlocked, no partition table (so the `machine.disks` partitioning below needs no
      # `talosctl wipe disk` first). NOT one of the two shelf 7600p on purpose: garage-0 already
      # rides that batch, so the three zones stay three makers (teststuff/hardware §the lot).
      # by-id, and an `nvme-eui.*` one: NVMe presents no `wwn-*` link in /dev/disk/by-id here.
      - { device: /dev/disk/by-id/nvme-eui.002538b571b1c443, name: pm961, tags: [] }
    # WHOLE DISK to EPHEMERAL, deliberately. The 2026-09-07 middle state carved a 241GB
    # node-local XFS user volume here for a raw-XFS Garage zone (ADR-114 as written); the operator
    # then took Longhorn instead — placement is a measured per-workload call now, recorded in
    # docs/storage-ledger.md §"2026-09-07 — what the Longhorn engine actually costs, and why
    # placement stops being an ADR" (merged as #1495; it carries the measured engine overhead and
    # the operator ruling), not an ADR decree. A user volume mounts at
    # /var/mnt/<name>, which longhorn-manager CANNOT see (it host-mounts only /var/lib/longhorn),
    # so on a ONE-DISK box a Longhorn disk must be the default one on EPHEMERAL — the carved
    # partition would have stranded half the drive. Reverted while the node still held nothing.
    # ⚠ Consequence carried in the ledger: Garage data then shares this partition with the
    # containerd image store (the 2026-09-01 collision). The kubelet imageGC floor in metal.tf is
    # gated on `kata` and must widen when this node is registered as a Longhorn storage node.
    # RESOLVED 2026-09-12 for Garage: the PM961 above is the dedicated spindle, so once garage-1's
    # two volumes rotate onto it this partition carries Talos + the image store + (next) a `std`
    # slice — the fleet direction's "Micron → std" — and NOT the zone's data.
    # The ephemeral_max_size / user_volumes fields stay SUPPORTED (metal.tf) for the multi-disk
    # profiling the incoming drives are for — they are simply not used here.
    notes: Third physical Garage zone (FU-137/ADR-114). Storage tier, always-on — deliberately NOT ephemeral/kata. Garage data disk (Samsung PM961) fitted in the x16 LP slot 2026-09-12; that is the box's only x4-capable slot.

  - name: wk-metal-01
    kind: metal
    zone: wk-metal-01
    label: "`wk-metal-01` (ThinkPad X240, PXE)"
    role: k8s worker, compute tier (tainted, 8GB) + Longhorn bulk tier + the garage-2 zone — NO rides
    hardware: Lenovo ThinkPad X240
    cpu_cores: 4         # 2C / 4T
    memory_gb: 8
    ip: 192.168.2.182
    plug: sensor.plug_laptop3_power
    idle_w: 9.1
    load_w: 28.8
    singlecore_bogo_s: 1182.1
    multicore_bogo_s: 1932.2
    # ThinkPad X240 — 500GB Crucial MX500 SATA SSD (confirmed via `talosctl get disks`).
    # Haswell → AVX2.
    #
    # ⚠ NO RIDES ON THIS BOX — it carries the garage-2 zone. `kata: true` was set 2026-07-14
    # (docker-capable agent workers on all 3 laptops) and REMOVED 2026-09-16: docs/storage-ledger.md
    # §"a Garage zone node's envelope" requires >= 4 threads at desktop clocks, ~2 cores free at
    # peak and 16 GB, and names "no rides on the node" — this box is 2C/4T ULV with 8 GB and fails
    # the envelope on both counts. It is also the zone that PACES THE CLUSTER: mean PutObject 1.99 s
    # vs 0.66 s on the other two, and both recorded stall episodes (09-08, and the 09-10 08:25Z
    # release with the node at 9 % idle and every endpoint p99 28-100 s) were a ride sharing it.
    # Measured again 2026-09-16 with a runner co-resident: 20.7 % idle / load1 4.82 on 4 threads
    # (m70s 50.4 %, wk-metal-04 84.7 %), and garage-2 burning 0.54 cores against garage-1's 0.18
    # and garage-0's 0.09 for the same rf=3 work.
    # The ARC half went the same day: the node left `kubernetes_labels.ephemeral_tier`'s for_each in
    # tofu/forgejo-runner.tf, which force-applies the homelab.io/ephemeral LABEL that both the ARC
    # scale sets and the Forgejo runner select on. (A kubectl removal alone was NOT enough — that
    # resource would have re-asserted it on the next apply.) This is the kata half.
    # ⚠ Two consequences, both accepted:
    #   - the kubelet memory guard in tofu/metal.tf is gated on `kata` and goes with it (operator,
    #     2026-09-16: "let it go with kata — if they are required they should be configured together
    #     with garage so all garage nodes get them"). Not built today.
    #   - install.image reverts to the plain metal schematic in CONFIG only. The running node keeps
    #     the metal_kata image until some future reinstall, which is benign: the `kata` LABEL is what
    #     the RuntimeClass schedules on, and that goes away live. Do not "fix" that drift.
    talos_metal_node: true
    install_disk: /dev/sda
    longhorn_default_disk: true
    avx2: true
    ephemeral: true
    notes: Most power-efficient tested. AC draw is battery-buffered + power-capped (~29 W flat).

